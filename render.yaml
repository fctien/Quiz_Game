# Render 部署設定（Blueprint）
# 在 Render 按 New → Blueprint，選這個 repo，它會自動照這個檔建立服務。
# 官方規格：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pulse-quiz
    runtime: python
    plan: free
    region: singapore              # 可選 oregon / ohio / virginia / frankfurt / singapore，新加坡離台灣最近
    buildCommand: pip install -r requirements.txt gunicorn
    # 考坊狀態存在記憶體，所以只能一個 worker；多執行緒才能同時服務多位學生的即時連線（SSE）
    startCommand: gunicorn -w 1 --threads 200 --timeout 0 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit      # 只要 push 到 main 就自動重新部署
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
