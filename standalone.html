<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金榜問答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1729" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="金榜問答">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/favicon.png" type="image/png">
<style>
/* 青花瓷配色:瓷白底、青花藍、硃砂印、玉綠 */
:root{
  --ground:#F3F5F8; --paper:#FFFFFF; --ink:#1E2A4A; --muted:#5E6A85; --line:#D9DFEA;
  --blue:#2B4C9B; --blue-soft:#E6ECF8; --cinnabar:#C8321E; --cinnabar-soft:#FBE7E3;
  --jade:#2F7D5B; --jade-soft:#E1F2EA; --shadow:0 1px 2px rgba(30,42,74,.06),0 6px 20px rgba(30,42,74,.06);
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1729; --paper:#18223A; --ink:#E8ECF5; --muted:#9AA6C2; --line:#2A3654;
    --blue:#8FB0FF; --blue-soft:#1F2D52; --cinnabar:#FF6B57; --cinnabar-soft:#3A1F22;
    --jade:#5FC89A; --jade-soft:#16332A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1729; --paper:#18223A; --ink:#E8ECF5; --muted:#9AA6C2; --line:#2A3654;
  --blue:#8FB0FF; --blue-soft:#1F2D52; --cinnabar:#FF6B57; --cinnabar-soft:#3A1F22;
  --jade:#5FC89A; --jade-soft:#16332A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* 沒有這行,display:grid 會蓋掉 hidden 屬性 */
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 首頁 */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:2.6rem;line-height:1.1;margin:0;letter-spacing:.08em;font-weight:700}
h1 .seal{display:inline-grid;place-items:center;width:1.25em;height:1.25em;margin-left:.15em;font-size:.55em;
  vertical-align:.45em;background:var(--cinnabar);color:#fff;border-radius:4px;letter-spacing:0}
.sub{color:var(--muted);margin:6px 0 0;text-wrap:balance}
.best{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.best b{display:block;font-size:1.35rem;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;
  text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s}
.cat:hover{border-color:var(--blue)}
.cat:active{transform:scale(.98)}
.cat .sealbox{flex:none;width:44px;height:44px;border:2px solid var(--cinnabar);color:var(--cinnabar);border-radius:6px;
  display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:700}
.cat[data-k="news"] .sealbox,.cat[data-k="mix"] .sealbox{border-color:var(--blue);color:var(--blue)}
.cat b{display:block;font-size:1.05rem;line-height:1.3}
.cat small{color:var(--muted);font-size:.8rem}
.rules{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;font-size:.9rem;color:var(--muted)}
.rules h2{font-family:var(--display);font-size:1.05rem;color:var(--ink);margin:0 0 4px;letter-spacing:.1em}
.rules ul{margin:0;padding-left:1.2em}

/* 遊戲 */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lives{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--cinnabar);display:block}
.lives i.off{background:transparent;border:1.5px solid var(--line)}
.prog{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.score{font-family:var(--mono);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.streak{color:var(--cinnabar);font-size:.85rem;min-height:1.5em;text-align:center;font-weight:500}
.timer{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.timer i{display:block;height:100%;background:var(--blue);width:100%;transition:width .25s linear}
.timer.low i{background:var(--cinnabar)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem;margin-bottom:10px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 7px;letter-spacing:.05em}
.qbox{position:relative}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 18px;box-shadow:var(--shadow);
  font-family:var(--display);font-size:1.4rem;line-height:1.55;font-weight:700;white-space:pre-line;text-wrap:balance}
.stamp{position:absolute;right:-4px;top:-28px;width:54px;height:54px;border:3px solid currentColor;border-radius:8px;
  display:grid;place-items:center;font-family:var(--display);font-size:1.9rem;font-weight:700;transform:rotate(-12deg);
  background:var(--paper);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.stamp.pass{color:var(--cinnabar)} .stamp.fail{color:var(--muted)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
  cursor:pointer;font-size:1.02rem;display:flex;gap:12px;align-items:center;transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .n{flex:none;width:26px;height:26px;border-radius:6px;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;font-weight:600}
.opt.picked{border-color:var(--blue)}
.opt.good{border-color:var(--jade);background:var(--jade-soft)}
.opt.good .n{background:var(--jade);color:var(--paper)}
.opt.bad{border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.opt.bad .n{background:var(--cinnabar);color:var(--paper)}
.opt.gone{opacity:.25;pointer-events:none}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:var(--display);font-size:1.6rem;padding:16px}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.row{display:flex;gap:10px;margin-top:12px}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700;background:var(--blue);color:var(--paper);flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.powers{display:flex;gap:8px;margin-top:16px}
.pw{flex:1;font-size:.82rem;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:8px 4px;cursor:pointer;color:var(--muted)}
.pw:not(:disabled):hover{border-color:var(--blue);color:var(--blue)}
.pw:disabled{opacity:.35;cursor:default}

/* 解說 */
.fb{margin-top:16px;border-left:3px solid var(--line);padding:4px 0 4px 14px}
.fb.ok{border-color:var(--jade)} .fb.no{border-color:var(--cinnabar)}
.fb h3{margin:0 0 4px;font-family:var(--display);font-size:1.25rem}
.fb.ok h3{color:var(--jade)} .fb.no h3{color:var(--cinnabar)}
.fb p{margin:6px 0;max-width:36em}
.fun{background:var(--blue-soft);border-radius:8px;padding:8px 12px;font-size:.93rem}
.fun b{color:var(--blue);font-weight:700;margin-right:4px}
.fb a{color:var(--blue);word-break:break-all;font-size:.85rem}
.pop{animation:pop .3s ease both}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 金榜 */
.result{text-align:center}
.bang{display:inline-block;margin-top:8px;padding:18px 28px 14px;border:2px solid var(--cinnabar);border-radius:6px;position:relative}
.bang small{display:block;color:var(--muted);letter-spacing:.3em;font-size:.8rem}
.rank{font-family:var(--display);font-size:3rem;line-height:1.2;font-weight:700;color:var(--cinnabar);letter-spacing:.15em}
.big{font-family:var(--mono);font-size:2rem;font-weight:600;margin:14px 0 2px}
.newbest{color:var(--cinnabar);font-weight:700;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border-block:1px solid var(--line)}
.stat{padding:10px 4px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:1.25rem}
.stat small{color:var(--muted)}
.review{text-align:left;margin-top:14px}
.review div{padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;display:flex;gap:10px}
.review span.m{flex:none;width:1.4em;font-family:var(--display);font-weight:700}
.review .y{color:var(--jade)} .review .x{color:var(--cinnabar)} .review .s{color:var(--muted)}
.err{color:var(--cinnabar);margin-top:12px}
/* 排行榜 */
.linkbtn{margin-top:12px;width:100%;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;
  cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.linkbtn:hover{border-color:var(--cinnabar)}
.linkbtn span:first-child{font-family:var(--display);font-size:1.1rem;letter-spacing:.1em}
.linkbtn .arrow{color:var(--cinnabar)}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbhead h1{font-size:2.2rem}
.back{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px 0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.seg button{background:transparent;border:0;padding:6px 16px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips button{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  cursor:pointer;font-size:.85rem;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700}
.board{margin-top:10px;border-top:2px solid var(--ink)}
.entry{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.entry.me{background:var(--cinnabar-soft)}
.entry .pos{font-family:var(--mono);color:var(--muted);text-align:center;font-weight:600}
.entry .pos.top{font-family:var(--display);color:var(--cinnabar);font-size:1.05rem;letter-spacing:.05em}
.entry .who{min-width:0}
.entry .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .who small{color:var(--muted);font-size:.78rem}
.entry .pts{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:.8rem;margin-top:10px}
.lbform{margin-top:18px;text-align:left}
.lbform label{font-family:var(--display);font-size:1.1rem;font-weight:700;letter-spacing:.1em}
.lbform .row{margin-top:6px}
.lbform input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink)}
.lbform input:focus{outline:2px solid var(--blue);outline-offset:1px}
.lbform .btn{flex:none;background:var(--cinnabar)}
.placed{margin-top:18px;padding:12px;border:1.5px dashed var(--cinnabar);border-radius:10px}
.placed b{color:var(--cinnabar);font-family:var(--mono)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ================= 模式選擇 ================= */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:20px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modes button{background:transparent;border:0;padding:10px 8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:1rem}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.mp-panel{margin-top:18px;display:grid;gap:12px}
.mp-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.mp-card h3{margin:0 0 4px;font-family:var(--display);font-size:1.3rem;letter-spacing:.08em}
.mp-card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.codein{font-family:var(--mono);font-size:1.6rem;letter-spacing:.4em;text-align:center;width:100%;padding:10px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.codein:focus,.textin:focus{outline:2px solid var(--blue);outline-offset:1px}
.textin{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:.85rem;color:var(--muted);font-weight:500}

/* ================= 四個選項的顏色 ================= */
:root{--o0:#2B4C9B;--o1:#C8321E;--o2:#2F7D5B;--o3:#A86B12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--o0:#8FB0FF;--o1:#FF6B57;--o2:#5FC89A;--o3:#F2B84B}}
:root[data-theme="dark"]{--o0:#8FB0FF;--o1:#FF6B57;--o2:#5FC89A;--o3:#F2B84B}
.o0{--oc:var(--o0)} .o1{--oc:var(--o1)} .o2{--oc:var(--o2)} .o3{--oc:var(--o3)}

/* ================= 主持人 ================= */
.wide{max-width:980px}
.hostbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.hostbar b{color:var(--ink)}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
@media (max-width:720px){.lobby{grid-template-columns:1fr}}
.joinbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.joinbox small{display:block;color:var(--muted);letter-spacing:.2em}
.bigcode{font-family:var(--mono);font-size:clamp(3rem,12vw,5.5rem);font-weight:600;letter-spacing:.12em;line-height:1.1;margin:6px 0}
.qr{width:min(220px,70%);margin:10px auto 6px;background:#fff;padding:8px;border-radius:8px}
.qr svg{width:100%;height:auto;display:block}
.joinurl{font-family:var(--mono);font-size:.85rem;color:var(--blue);word-break:break-all}
.roster h2{font-family:var(--display);margin:0 0 10px;font-size:1.3rem;letter-spacing:.08em}
.roster h2 span{font-family:var(--mono);color:var(--cinnabar)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--paper);animation:pop .3s ease both}
.pchip.off{opacity:.45;border-style:dashed}
.hq{display:grid;gap:16px;margin-top:10px}
.hqtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cd{width:72px;height:72px;border-radius:50%;border:3px solid var(--blue);display:grid;place-items:center;
  font-family:var(--mono);font-size:1.8rem;font-weight:600;flex:none}
.cd.low{border-color:var(--cinnabar);color:var(--cinnabar)}
.hqtext{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:700;line-height:1.45;text-wrap:balance;white-space:pre-line}
.double{display:inline-block;background:var(--cinnabar);color:var(--paper);border-radius:6px;padding:2px 10px;font-weight:700;font-size:.85rem;letter-spacing:.1em}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.hopts{grid-template-columns:1fr}}
.hopt{border:2px solid var(--oc);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--paper);font-size:1.15rem;position:relative;overflow:hidden}
.hopt .n{flex:none;width:34px;height:34px;border-radius:8px;background:var(--oc);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.hopt .bar{position:absolute;inset:auto 0 0 0;height:5px;background:var(--oc);transform-origin:left;transition:transform .6s ease}
.hopt .cnt{margin-left:auto;font-family:var(--mono);font-weight:600}
.hopt.dim{opacity:.35}
.hopt.win{box-shadow:0 0 0 3px var(--oc)}
.answered{font-family:var(--mono);color:var(--muted)}
.answered b{color:var(--ink);font-size:1.3rem}
.hreveal{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.hreveal{grid-template-columns:1fr}}
.fastest{color:var(--cinnabar);font-weight:700}
.topboard .entry .pos{font-size:1rem}
.move{font-family:var(--mono);font-size:.8rem;margin-left:6px}
.move.up{color:var(--jade)} .move.down{color:var(--cinnabar)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:10px;margin:20px 0 10px;text-align:center}
.pod{border:2px solid var(--cinnabar);border-bottom:0;border-radius:10px 10px 0 0;padding:12px 6px;background:var(--paper)}
.pod .t{font-family:var(--display);color:var(--cinnabar);font-size:1.4rem;font-weight:700;letter-spacing:.1em}
.pod b{display:block;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-family:var(--mono);color:var(--muted)}
.pod.p1{min-height:170px} .pod.p2{min-height:130px} .pod.p3{min-height:105px}
.conn{font-size:.8rem;color:var(--cinnabar)}

/* ================= 玩家 ================= */
.popts{display:grid;gap:10px;margin-top:14px}
.popt{border:0;border-radius:12px;padding:16px;background:var(--oc);color:var(--paper);font-size:1.1rem;font-weight:700;
  text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:60px}
.popt .n{flex:none;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--mono)}
.popt:active{transform:scale(.98)}
.popt[disabled]{cursor:default}
.sent{text-align:center;padding:30px 10px}
.sent .picked-big{display:inline-flex;gap:10px;align-items:center;border:2px solid var(--oc);border-radius:12px;padding:12px 18px;margin:14px 0;font-weight:700}
.bigstamp{width:110px;height:110px;margin:10px auto;border:4px solid currentColor;border-radius:12px;display:grid;place-items:center;
  font-family:var(--display);font-size:3.6rem;font-weight:700;transform:rotate(-10deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.bigstamp.pass{color:var(--cinnabar)} .bigstamp.fail{color:var(--muted)}
.gain{font-family:var(--mono);font-size:2rem;font-weight:600;text-align:center}
.center{text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;color:var(--muted)}

.cd.up{border-color:var(--muted);color:var(--muted)}
.rules h2 small{font-weight:400;font-size:.8rem;margin-left:8px}
</style>
<script>window.EMBEDDED_BANK = {"geo": [{"id": "tw-005", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣最高的山是哪一座？", "options": ["雪山", "合歡山", "阿里山", "玉山"], "answer": 3, "explanation": "玉山主峰海拔約 3,952 公尺，是台灣第一高峰。", "fun_fact": "玉山比日本富士山（約 3,776 公尺）還高。", "topic": "geo", "region": "台灣"}, {"id": "tw-006", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣最長的河流是？", "options": ["淡水河", "大甲溪", "高屏溪", "濁水溪"], "answer": 3, "explanation": "濁水溪全長約 186 公里，是台灣最長的河流。", "fun_fact": "因為上游帶來大量泥沙讓河水混濁，所以叫「濁水」。", "topic": "geo", "region": "台灣"}, {"id": "tw-007", "category": "地理", "difficulty": 1, "type": "choice", "question": "日月潭位在哪一個縣？", "options": ["台中市", "嘉義縣", "南投縣", "花蓮縣"], "answer": 2, "explanation": "日月潭位於南投縣魚池鄉。", "fun_fact": "湖中的拉魯島是邵族的祖靈聖地。", "topic": "geo", "region": "台灣"}, {"id": "tw-008", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣位於哪兩個板塊的交界，所以地震特別多？", "options": ["太平洋板塊與北美板塊", "菲律賓海板塊與太平洋板塊", "歐亞板塊與菲律賓海板塊", "印澳板塊與歐亞板塊"], "answer": 2, "explanation": "台灣位於歐亞板塊與菲律賓海板塊的交界處。", "fun_fact": "板塊擠壓也是台灣高山林立的原因。", "topic": "geo", "region": "台灣"}, {"id": "tw-009", "category": "地理", "difficulty": 2, "type": "choice", "question": "下列哪個縣市設有「北回歸線標誌」？", "options": ["嘉義縣", "屏東縣", "台南市", "宜蘭縣"], "answer": 0, "explanation": "北回歸線通過嘉義與花蓮，兩地都設有標誌。", "fun_fact": "北回歸線會因地球自轉軸的變化而緩慢移動，所以嘉義的標誌蓋過好幾代。", "topic": "geo", "region": "台灣"}, {"id": "tw-010", "category": "地理", "difficulty": 2, "type": "choice", "question": "太魯閣峽谷主要是由哪一條溪切割形成的？", "options": ["卑南溪", "蘭陽溪", "立霧溪", "秀姑巒溪"], "answer": 2, "explanation": "立霧溪長期切割大理石岩層，形成太魯閣峽谷。", "fun_fact": "太魯閣的大理石峭壁有些高達數百公尺。", "topic": "geo", "region": "台灣"}, {"id": "tw-016", "category": "地理", "difficulty": 2, "type": "choice", "question": "台北 101 曾經是世界最高的大樓。", "options": ["對", "錯"], "answer": 0, "explanation": "台北 101 在 2004 到 2010 年間是世界最高建築，後來被杜拜的哈里發塔超越。", "fun_fact": "大樓裡有一顆巨大的「風阻尼器」，用來減少颱風和地震時的晃動。", "topic": "geo", "region": "台灣"}, {"id": "tw-027", "category": "地理", "difficulty": 2, "type": "choice", "question": "澎湖群島的島嶼，大多是由哪一種岩石構成的？", "options": ["石灰岩", "花崗岩", "玄武岩", "大理石"], "answer": 2, "explanation": "澎湖群島多由火山熔岩冷卻形成的玄武岩構成，常可見整齊的柱狀節理。", "fun_fact": "七美著名的「雙心石滬」，就是先民用玄武岩和咾咕石堆成的捕魚陷阱。", "topic": "geo", "region": "台灣"}, {"id": "tw-028", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣第一座成立的國家公園是？", "options": ["太魯閣國家公園", "墾丁國家公園", "玉山國家公園", "陽明山國家公園"], "answer": 1, "explanation": "墾丁國家公園於 1984 年成立，是台灣第一座國家公園。", "fun_fact": "每年秋天國慶日前後，大批灰面鵟鷹會飛過墾丁，因此被暱稱為「國慶鳥」。", "topic": "geo", "region": "台灣"}, {"id": "tw-029", "category": "地理", "difficulty": 2, "type": "choice", "question": "在台北陽明山的小油坑，可以看到噴氣孔和硫磺結晶，這是因為當地屬於？", "options": ["石灰岩洞穴", "珊瑚礁海岸", "大屯火山群", "泥火山地形"], "answer": 2, "explanation": "陽明山一帶屬於大屯火山群，地底仍有熱源，才會有噴氣孔、硫磺和溫泉。", "fun_fact": "大屯火山群中的七星山海拔約 1,120 公尺，是台北市的最高峰。", "topic": "geo", "region": "台灣"}, {"id": "tw-030", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣南部的「泥火山」會噴出滾燙的岩漿。", "options": ["對", "錯"], "answer": 1, "explanation": "泥火山噴出的是泥漿，是地下天然氣帶著泥水冒出地表形成的，溫度通常和常溫差不多，並不是岩漿。", "fun_fact": "高雄燕巢的烏山頂泥火山已被劃設為自然保留區，泥漿堆成的小錐丘很像迷你火山。", "topic": "geo", "region": "台灣"}, {"id": "tw-031", "category": "地理", "difficulty": 3, "type": "choice", "question": "新北野柳地質公園的著名岩石「女王頭」，屬於哪一種地形？", "options": ["蕈狀岩", "沙丘", "海蝕洞", "鐘乳石"], "answer": 0, "explanation": "女王頭是海岸岩石經海水與風化侵蝕後，形成上粗下細、像香菇一樣的蕈狀岩。", "fun_fact": "女王頭的「脖子」因侵蝕越來越細，未來可能會斷裂，所以園區也做了仿製的女王頭。", "topic": "geo", "region": "台灣"}, {"id": "tw-032", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣冬天吹東北季風時，哪一帶最容易下雨？", "options": ["嘉義、雲林一帶", "台中、彰化一帶", "台南、高雄一帶", "基隆、宜蘭一帶"], "answer": 3, "explanation": "東北季風帶著海上的水氣吹向台灣東北部，遇到山地抬升就容易降雨，基隆、宜蘭首當其衝。", "fun_fact": "基隆因為雨下得多，有「雨港」之稱。", "topic": "geo", "region": "台灣"}, {"id": "tw-033", "category": "地理", "difficulty": 2, "type": "choice", "question": "以「麻豆文旦」聞名的麻豆，位於哪個縣市？", "options": ["宜蘭縣", "台中市", "屏東縣", "台南市"], "answer": 3, "explanation": "麻豆是台南市的一個區，種植文旦的歷史悠久，是著名的文旦產地。", "fun_fact": "中秋節吃柚子的習俗，一說是因為「柚」和「佑」同音，有保佑平安的意思。", "topic": "geo", "region": "台灣"}, {"id": "tw-034", "category": "地理", "difficulty": 1, "type": "choice", "question": "每年春夏之交舉辦「黑鮪魚文化觀光季」而聞名的漁港是？", "options": ["屏東東港", "宜蘭南方澳", "基隆八斗子", "嘉義布袋"], "answer": 0, "explanation": "屏東東港是台灣黑鮪魚的主要卸貨港，黑鮪魚季已成為當地的招牌活動。", "fun_fact": "東港有「三寶」：黑鮪魚、櫻花蝦和油魚子。", "topic": "geo", "region": "台灣"}, {"id": "tw-035", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣本島的形狀常被比喻成哪一種作物？", "options": ["蕃薯", "香蕉", "玉米", "芒果"], "answer": 0, "explanation": "台灣本島南北狹長、中間略寬，外形很像一條蕃薯。", "fun_fact": "也因為這樣，許多台灣人會以「蕃薯仔」自稱。", "topic": "geo", "region": "台灣"}, {"id": "tw-036", "category": "地理", "difficulty": 3, "type": "choice", "question": "台灣本島的最東端是哪裡？", "options": ["鵝鑾鼻", "貓鼻頭", "富貴角", "三貂角"], "answer": 3, "explanation": "三貂角位於新北市貢寮區，是台灣本島最東的地點；富貴角在最北端，鵝鑾鼻與貓鼻頭則在南端。", "fun_fact": "「三貂」這個名字，源自 17 世紀西班牙人為它取的名字「Santiago」。", "topic": "geo", "region": "台灣"}, {"id": "tw-037", "category": "地理", "difficulty": 1, "type": "order", "question": "請依地理位置由北到南排出這些縣市：", "options": ["屏東縣", "雲林縣", "桃園市", "苗栗縣"], "answer": [2, 3, 1, 0], "explanation": "由北到南依序是桃園市、苗栗縣、雲林縣、屏東縣。", "fun_fact": "", "topic": "geo", "region": "台灣"}, {"id": "tw-038", "category": "地理", "difficulty": 2, "type": "choice", "question": "花東縱谷夾在哪兩座山脈之間？", "options": ["玉山山脈與阿里山山脈", "中央山脈與海岸山脈", "雪山山脈與中央山脈", "海岸山脈與雪山山脈"], "answer": 1, "explanation": "花東縱谷西側是中央山脈、東側是海岸山脈，從花蓮一路延伸到台東。", "fun_fact": "有名的池上米和關山米，就產自花東縱谷南段。", "topic": "geo", "region": "台灣"}, {"id": "tw-052", "category": "地理", "difficulty": 1, "type": "choice", "question": "金門最有名、常被當成伴手禮的特產酒是哪一種？", "options": ["小米酒", "梅酒", "紹興酒", "高粱酒"], "answer": 3, "explanation": "金門土地貧瘠、氣候乾燥，適合種植耐旱的高粱，當地酒廠釀造的高粱酒因此成為金門代表特產。", "fun_fact": "金門另一項知名特產「金門菜刀」，傳統上是用過去戰爭留下的砲彈鋼材打造的。", "topic": "geo", "region": "台灣"}, {"id": "tw-053", "category": "地理", "difficulty": 1, "type": "choice", "question": "以山城老街、階梯與茶樓聞名的「九份」，位在哪個縣市？", "options": ["宜蘭縣", "基隆市", "台北市", "新北市"], "answer": 3, "explanation": "九份位於新北市瑞芳區，早年因採金而繁榮，現在是熱門的山城老街。", "fun_fact": "相傳早年這裡只有九戶人家，對外採買時總是要「九份」，地名因此而來。", "topic": "geo", "region": "台灣"}, {"id": "tw-054", "category": "地理", "difficulty": 1, "type": "choice", "question": "每年春夏在馬祖海邊出現、會發出藍光的「藍眼淚」，主要是由什麼造成的？", "options": ["夜光蟲等會發光的浮游生物", "月光照在海面上的反光", "成群的螢火蟲", "海底火山噴出的氣體"], "answer": 0, "explanation": "藍眼淚主要是一種叫「夜光蟲」的渦鞭毛藻，受到海浪拍打等刺激時會發出藍光，4到6月是最容易看到的季節。", "fun_fact": "春夏閩江進入洪水期，把大量營養鹽帶進馬祖海域，浮游生物跟著大量繁殖，藍眼淚也就特別多。", "topic": "geo", "region": "台灣"}, {"id": "tw-055", "category": "地理", "difficulty": 1, "type": "choice", "question": "綠島的「朝日溫泉」有什麼特別之處？", "options": ["位在海拔三千公尺的高山上", "是水溫很低的冷泉", "是黑色的泥漿溫泉", "是罕見的海底（鹹水）溫泉"], "answer": 3, "explanation": "朝日溫泉的泉水從海邊的礁岩湧出，帶有海水的鹹味，是全世界少見的海底溫泉。", "fun_fact": "朝日溫泉面向太平洋，許多遊客會一大早去泡湯，邊泡邊看日出。", "topic": "geo", "region": "台灣"}, {"id": "tw-056", "category": "地理", "difficulty": 1, "type": "choice", "question": "有一座八個拱形相連的跨海步橋、傳說有三位仙人登臨過的「三仙台」，位在哪個縣？", "options": ["宜蘭縣", "屏東縣", "花蓮縣", "台東縣"], "answer": 3, "explanation": "三仙台位於台東縣成功鎮，屬於東部海岸國家風景區，由離岸小島與珊瑚礁海岸構成，跨海步橋長近400公尺。", "fun_fact": "相傳呂洞賓、李鐵拐、何仙姑曾在島上的三塊巨石停留，「三仙台」因此得名。", "topic": "geo", "region": "台灣"}, {"id": "tw-057", "category": "地理", "difficulty": 2, "type": "choice", "question": "蘭嶼在改名之前，常被稱為什麼？", "options": ["紅頭嶼", "琉球嶼", "雞籠嶼", "火燒島"], "answer": 0, "explanation": "蘭嶼舊稱「紅頭嶼」，1947年因為島上盛產蝴蝶蘭而改名為蘭嶼。火燒島是綠島的舊稱，雞籠嶼是基隆嶼的舊稱，琉球嶼則是小琉球的正式名稱。", "fun_fact": "島上的達悟族稱蘭嶼為「Ponso no Tao」，意思是「人之島」。", "topic": "geo", "region": "台灣"}, {"id": "tw-058", "category": "地理", "difficulty": 2, "type": "choice", "question": "宜蘭外海的龜山島，是怎麼形成的？", "options": ["河川泥沙沖積而成", "冰河搬運岩石堆成", "火山活動形成的火山島", "珊瑚礁慢慢堆積而成"], "answer": 2, "explanation": "龜山島是火山島，經定年研究發現，它在過去約7000年內至少發生過四次火山活動，因此被列為台灣的活火山之一，也是台灣最年輕的火山島。", "fun_fact": "龜山島「龜首」附近海底有溫泉湧出，與海水混合後變成乳白色，被稱為「牛奶海」。", "topic": "geo", "region": "台灣"}, {"id": "tw-059", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣公路的最高點「武嶺」（海拔約3275公尺），位在哪一條公路上？", "options": ["台8線（中橫主線）", "台20線（南橫公路）", "台18線（阿里山公路）", "台14甲線（合歡山公路）"], "answer": 3, "explanation": "武嶺位於台14甲線上，是合歡山一帶的熱門景點，海拔約3275公尺，也是台灣公路的最高點。", "fun_fact": "冬天寒流來時，武嶺一帶常會下雪，吸引許多人上山賞雪。", "topic": "geo", "region": "台灣"}, {"id": "tw-060", "category": "地理", "difficulty": 2, "type": "choice", "question": "以高聳海崖直落太平洋聞名的「清水斷崖」，位在哪一條公路沿線？", "options": ["北部濱海公路", "中部橫貫公路", "蘇花公路", "南迴公路"], "answer": 2, "explanation": "清水斷崖位於花蓮縣和平與崇德之間，蘇花公路沿著斷崖修築，是蘇花公路最壯觀的一段。", "fun_fact": "清水斷崖的山壁以接近90度的角度緊臨太平洋，被譽為台灣八大景之一。", "topic": "geo", "region": "台灣"}, {"id": "tw-061", "category": "地理", "difficulty": 2, "type": "choice", "question": "嘉義的「奮起湖」以鐵路便當聞名，地名裡的「湖」是什麼意思？", "options": ["一座溫泉池", "一座高山湖泊", "一座人工水庫", "四周環山的低窪山坳地"], "answer": 3, "explanation": "奮起湖位於嘉義縣竹崎鄉、阿里山森林鐵路沿線，三面環山、中間低平，形狀像畚箕，舊稱「畚箕湖」。台語把山坳地稱為「湖」，當地其實沒有湖。", "fun_fact": "奮起湖海拔約1400公尺，過去是阿里山森林鐵路的重要中途站，旅客常在這裡買便當，「奮起湖便當」因此出名。", "topic": "geo", "region": "台灣"}, {"id": "tw-062", "category": "地理", "difficulty": 2, "type": "choice", "question": "新竹的舊地名是什麼？", "options": ["艋舺", "竹塹", "打狗", "諸羅"], "answer": 1, "explanation": "新竹舊稱「竹塹」，一般認為與當地道卡斯族的「竹塹社」有關；1875年設新竹縣，取「新的竹塹」之意。諸羅是嘉義，打狗是高雄，艋舺是台北萬華。", "fun_fact": "新竹因為秋冬東北季風特別強，有「風城」的稱號，強風也很適合製作米粉和柿餅。", "topic": "geo", "region": "台灣"}, {"id": "tw-063", "category": "地理", "difficulty": 2, "type": "choice", "question": "以少見的「泥漿溫泉」聞名的關子嶺溫泉，位在哪個縣市？", "options": ["台東縣", "台南市", "宜蘭縣", "新北市"], "answer": 1, "explanation": "關子嶺溫泉位於台南市白河區，泉水含有泥質，是台灣少見的泥漿溫泉，與北投、陽明山、四重溪並稱台灣四大溫泉。", "fun_fact": "關子嶺附近還有「水火同源」奇景：天然氣從岩縫冒出燃燒，旁邊同時有泉水流出。", "topic": "geo", "region": "台灣"}, {"id": "tw-064", "category": "地理", "difficulty": 3, "type": "choice", "question": "「南迴鐵路」的西端起點，是屏東縣的哪一個車站？", "options": ["潮州", "東港", "枋寮", "恆春"], "answer": 2, "explanation": "南迴鐵路從屏東枋寮到台東，全長約98公里，穿越中央山脈南段，1991年完工、隔年開始營運。潮州屬於屏東線，恆春和東港目前都沒有台鐵車站。", "fun_fact": "南迴鐵路通車後，台灣的環島鐵路網終於完整接起來。", "topic": "geo", "region": "台灣"}, {"id": "tw-065", "category": "地理", "difficulty": 3, "type": "choice", "question": "下列哪一座山「不」屬於「台灣五岳」？", "options": ["北大武山", "南湖大山", "秀姑巒山", "合歡山"], "answer": 3, "explanation": "台灣五岳是玉山、雪山、秀姑巒山、南湖大山和北大武山。合歡山雖然也是百岳，但不在五岳之列。", "fun_fact": "合歡山主峰離公路很近，常被當成入門百岳，是許多人第一次登上三千公尺高山的地方。", "topic": "geo", "region": "台灣"}, {"id": "tw-066", "category": "地理", "difficulty": 3, "type": "choice", "question": "下列哪一條河川「不是」淡水河的支流？", "options": ["新店溪", "基隆河", "大漢溪", "頭前溪"], "answer": 3, "explanation": "淡水河的三大支流是基隆河、新店溪和大漢溪；頭前溪則是新竹地區自己的河川，直接流入台灣海峽。", "fun_fact": "大漢溪和新店溪在台北萬華、板橋一帶匯流後才稱為淡水河，最後在淡水、八里之間出海。", "topic": "geo", "region": "台灣"}, {"id": "tw-067", "category": "地理", "difficulty": 3, "type": "choice", "question": "又稱「膨風茶」的東方美人茶，獨特的蜜香是因為茶芽被哪一種小昆蟲叮咬過？", "options": ["小綠葉蟬", "蜜蜂", "蠶", "螞蟻"], "answer": 0, "explanation": "東方美人茶的幼嫩茶芽經小綠葉蟬刺吸（俗稱「著涎」），再經加工後產生特殊的蜜香與熟果香。主要產於新竹北埔、峨眉及苗栗一帶。", "fun_fact": "相傳早年茶農把被蟲咬過的茶拿去賣，竟賣到好價錢，說出來被鄉親笑是「膨風」（吹牛），「膨風茶」的名字就這樣傳開了。", "topic": "geo", "region": "台灣"}, {"id": "tw-068", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣的梅雨季大約在每年五、六月，常帶來連續多日的降雨。", "options": ["對", "錯"], "answer": 0, "explanation": "每年五、六月，梅雨鋒面常在台灣附近徘徊，帶來連日降雨，是台灣重要的水資源來源之一。", "fun_fact": "「梅雨」的名稱，一般認為和這段時間正好是梅子成熟的季節有關。", "topic": "geo", "region": "台灣"}, {"id": "tw-069", "category": "地理", "difficulty": 2, "type": "choice", "question": "日月潭的湖面自古以來就是現在這麼大，從來沒有經過人工改造。", "options": ["對", "錯"], "answer": 1, "explanation": "日治時期興建日月潭水力發電工程，從濁水溪引水進入日月潭，使水位增高約18公尺，湖面積也大幅擴大，1934年完工。", "fun_fact": "濁水溪本來並不流進日月潭，是從武界壩取水，經過全長約15公里的引水道把溪水送進來的。", "topic": "geo", "region": "台灣"}, {"id": "tw-070", "category": "地理", "difficulty": 2, "type": "order", "question": "請依地理位置由北到南，排出下列離島：", "options": ["金門", "澎湖", "蘭嶼", "馬祖"], "answer": [3, 0, 1, 2], "explanation": "馬祖位在最北邊，靠近福建閩江口；金門靠近廈門；澎湖位在台灣海峽中；蘭嶼則在台東外海，最南。", "fun_fact": "金門和馬祖都很靠近中國大陸沿岸，從金門岸邊就能看到對岸廈門的高樓。", "topic": "geo", "region": "台灣"}, {"id": "tw-071", "category": "地理", "difficulty": 3, "type": "order", "question": "請依海拔由高到低，排出下列山峰：", "options": ["秀姑巒山", "玉山", "雪山", "合歡山主峰"], "answer": [1, 2, 0, 3], "explanation": "玉山約3952公尺，雪山約3886公尺，秀姑巒山約3825公尺，合歡山主峰約3417公尺。", "fun_fact": "秀姑巒山是中央山脈的最高峰，也是「台灣五岳」之一。", "topic": "geo", "region": "台灣"}, {"id": "cn-011", "category": "地理", "difficulty": 1, "type": "choice", "question": "中國最長的河流是？", "options": ["珠江", "長江", "黃河", "黑龍江"], "answer": 1, "explanation": "長江全長約 6,300 公里。", "fun_fact": "長江是亞洲第一長河、世界第三長河。", "topic": "geo", "region": "中國"}, {"id": "cn-012", "category": "地理", "difficulty": 1, "type": "choice", "question": "在月球上用肉眼可以看到萬里長城。", "options": ["對", "錯"], "answer": 1, "explanation": "這是流傳很久的誤解。長城雖長但很窄，從月球上用肉眼看不到。", "fun_fact": "就連太空人在近地軌道上，也很難用肉眼分辨出長城。", "topic": "geo", "region": "中國"}, {"id": "cn-013", "category": "地理", "difficulty": 2, "type": "choice", "question": "世界最高峰聖母峰（珠穆朗瑪峰）位於中國與哪一國的邊界？", "options": ["印度", "巴基斯坦", "尼泊爾", "不丹"], "answer": 2, "explanation": "聖母峰位於中國與尼泊爾的邊界上。", "fun_fact": "2020 年兩國共同公布的最新高度是 8,848.86 公尺。", "topic": "geo", "region": "中國"}, {"id": "cn-014", "category": "地理", "difficulty": 2, "type": "choice", "question": "著名的兵馬俑位在哪一座城市？", "options": ["南京", "北京", "洛陽", "西安"], "answer": 3, "explanation": "兵馬俑位於陝西西安，屬於秦始皇陵的一部分。", "fun_fact": "兵馬俑是 1974 年農民挖井時意外發現的。", "topic": "geo", "region": "中國"}, {"id": "cn-015", "category": "地理", "difficulty": 2, "type": "choice", "question": "「桂林山水甲天下」的桂林位於哪個省級行政區？", "options": ["雲南", "湖南", "廣西", "貴州"], "answer": 2, "explanation": "桂林位於廣西壯族自治區。", "fun_fact": "桂林的奇峰是典型的喀斯特（石灰岩）地形。", "topic": "geo", "region": "中國"}, {"id": "cn-016", "category": "地理", "difficulty": 3, "type": "choice", "question": "中國面積最大的省級行政區是？", "options": ["青海", "西藏", "新疆", "內蒙古"], "answer": 2, "explanation": "新疆面積約 166 萬平方公里，是中國面積最大的省級行政區。", "fun_fact": "新疆的面積大約是台灣的 46 倍。", "topic": "geo", "region": "中國"}, {"id": "cn-029", "category": "地理", "difficulty": 2, "type": "choice", "question": "古代帝王舉行「封禪」大典，祭告天地的名山是？", "options": ["泰山", "華山", "黃山", "峨眉山"], "answer": 0, "explanation": "泰山被尊為五嶽之首，秦始皇、漢武帝等帝王都曾到泰山封禪。", "fun_fact": "泰山在 1987 年列入世界遺產，是自然與文化雙重遺產。", "topic": "geo", "region": "中國"}, {"id": "cn-030", "category": "地理", "difficulty": 2, "type": "choice", "question": "在中國大陸，簡稱「粵」的是哪一個省級地區？", "options": ["福建", "雲南", "廣東", "廣西"], "answer": 2, "explanation": "廣東簡稱「粵」，廣西是「桂」、福建是「閩」、雲南是「滇」。", "fun_fact": "「粵語」「粵菜」的「粵」就是指廣東。", "topic": "geo", "region": "中國"}, {"id": "cn-031", "category": "地理", "difficulty": 1, "type": "order", "question": "請將這些城市由北到南排列：", "options": ["北京", "哈爾濱", "上海", "廣州"], "answer": [1, 0, 2, 3], "explanation": "由北到南依序是 哈爾濱 → 北京 → 上海 → 廣州。", "fun_fact": "哈爾濱冬天的冰雕節很有名，被稱為「冰城」。", "topic": "geo", "region": "中國"}, {"id": "cn-032", "category": "地理", "difficulty": 3, "type": "choice", "question": "下列哪一個「不是」長江三峽之一？", "options": ["巫峽", "虎跳峽", "西陵峽", "瞿塘峽"], "answer": 1, "explanation": "長江三峽是瞿塘峽、巫峽、西陵峽；虎跳峽位於雲南的金沙江上。", "fun_fact": "虎跳峽得名自傳說中老虎曾踩著江心巨石一躍跳過峽谷。", "topic": "geo", "region": "中國"}, {"id": "cn-033", "category": "地理", "difficulty": 3, "type": "choice", "question": "《西遊記》中孫悟空借芭蕉扇的「火焰山」，真實存在於哪個地方？", "options": ["雲南大理", "甘肅敦煌", "新疆吐魯番", "西藏拉薩"], "answer": 2, "explanation": "火焰山位於新疆吐魯番盆地，紅色砂岩在烈日下宛如火焰。", "fun_fact": "吐魯番盆地夏季極為炎熱，盆地內的艾丁湖是中國陸地的最低點。", "topic": "geo", "region": "中國"}, {"id": "cn-034", "category": "地理", "difficulty": 2, "type": "choice", "question": "以壁畫和佛像聞名的「莫高窟」位於哪個省？", "options": ["陝西", "寧夏", "甘肅", "新疆"], "answer": 2, "explanation": "莫高窟位於甘肅敦煌，是絲路上的佛教藝術寶庫，1987 年列入世界遺產。", "fun_fact": "1900 年莫高窟發現了「藏經洞」，裡面藏有數萬件古代文書。", "topic": "geo", "region": "中國"}, {"id": "cn-035", "category": "地理", "difficulty": 1, "type": "choice", "question": "黃河的河水之所以呈現黃色，主要是因為流經哪個地形區？", "options": ["華北平原", "黃土高原", "青藏高原", "四川盆地"], "answer": 1, "explanation": "黃河中游流經土質鬆軟的黃土高原，大量泥沙被沖入河中而變黃。", "fun_fact": "因為泥沙淤積，黃河下游河床比兩岸地面還高，被稱為「地上河」。", "topic": "geo", "region": "中國"}, {"id": "cn-036", "category": "地理", "difficulty": 2, "type": "choice", "question": "黃山是「五嶽」之一。", "options": ["對", "錯"], "answer": 1, "explanation": "五嶽是東嶽泰山、西嶽華山、南嶽衡山、北嶽恆山、中嶽嵩山，黃山並不在其中。", "fun_fact": "相傳明代旅行家徐霞客讚嘆：「五嶽歸來不看山，黃山歸來不看嶽。」", "topic": "geo", "region": "中國"}, {"id": "cn-037", "category": "地理", "difficulty": 2, "type": "choice", "question": "因為四季氣候溫和，被稱為「春城」的是哪一座城市？", "options": ["成都", "昆明", "福州", "長春"], "answer": 1, "explanation": "雲南省會昆明位於高原，冬不嚴寒、夏不酷熱，四季如春。", "fun_fact": "名字有「春」的長春其實在東北，冬天非常寒冷。", "topic": "geo", "region": "中國"}, {"id": "cn-038", "category": "地理", "difficulty": 3, "type": "choice", "question": "被譽為「瓷都」的景德鎮位於哪個省？", "options": ["福建", "廣東", "浙江", "江西"], "answer": 3, "explanation": "景德鎮位於江西，自古以燒製瓷器聞名。", "fun_fact": "景德鎮的名字來自北宋宋真宗的年號「景德」。", "topic": "geo", "region": "中國"}, {"id": "cn-050", "category": "地理", "difficulty": 1, "type": "choice", "question": "城市依山而建、道路上上下下，被稱為「山城」的是哪一座城市？", "options": ["上海", "北京", "重慶", "天津"], "answer": 2, "explanation": "重慶位於長江與嘉陵江交會處，市區建在起伏的丘陵上，高低落差很大，所以有「山城」之稱。", "fun_fact": "重慶的輕軌2號線在李子壩站直接「穿過」一棟住宅大樓，列車從樓中呼嘯而過，成了熱門打卡景點；重慶也因多霧有「霧都」之稱。", "topic": "geo", "region": "中國"}, {"id": "cn-051", "category": "地理", "difficulty": 1, "type": "choice", "question": "以五彩湖泊和瀑布聞名的世界遺產「九寨溝」位於哪個省？", "options": ["四川", "雲南", "貴州", "青海"], "answer": 0, "explanation": "九寨溝位於四川省阿壩藏族羌族自治州，1992年列入世界自然遺產。", "fun_fact": "九寨溝的湖水因為富含碳酸鈣、又有藻類與水生植物，會呈現藍、綠、黃等不同顏色，當地人把這些湖泊稱為「海子」。", "topic": "geo", "region": "中國"}, {"id": "cn-052", "category": "地理", "difficulty": 1, "type": "choice", "question": "依山而建、外牆紅白相間的宮殿建築群「布達拉宮」位於哪座城市？", "options": ["林芝", "西寧", "日喀則", "拉薩"], "answer": 3, "explanation": "布達拉宮位於西藏拉薩市區的紅山上，1994年列入世界文化遺產。", "fun_fact": "人民幣50元紙鈔的背面圖案，就是布達拉宮。", "topic": "geo", "region": "中國"}, {"id": "cn-053", "category": "地理", "difficulty": 1, "type": "choice", "question": "平均海拔超過4,000公尺，被稱為「世界屋脊」的是哪一個高原？", "options": ["雲貴高原", "黃土高原", "青藏高原", "內蒙古高原"], "answer": 2, "explanation": "青藏高原是世界上平均海拔最高的高原，因此被稱為「世界屋脊」。", "fun_fact": "青藏高原是印度板塊向北擠壓歐亞板塊而隆起形成的，到現在仍在緩慢上升。", "topic": "geo", "region": "中國"}, {"id": "cn-054", "category": "地理", "difficulty": 2, "type": "choice", "question": "電影《阿凡達》中的懸浮山，據說靈感來自石柱林立的「張家界」，它位於哪個省？", "options": ["江西", "湖南", "湖北", "貴州"], "answer": 1, "explanation": "張家界位於湖南省西北部，所在的武陵源風景名勝區在1992年列入世界自然遺產。", "fun_fact": "《阿凡達》上映後，張家界在2010年把一根名為「南天一柱」的石柱改名為「阿凡達－哈利路亞山」。", "topic": "geo", "region": "中國"}, {"id": "cn-055", "category": "地理", "difficulty": 2, "type": "choice", "question": "以功夫聞名天下的「少林寺」，位於哪一座山？", "options": ["嵩山", "武當山", "峨眉山", "華山"], "answer": 0, "explanation": "少林寺位於河南省登封市的嵩山，嵩山就是五嶽中的「中嶽」。", "fun_fact": "少林寺所在的登封「天地之中」歷史建築群，在2010年列入世界文化遺產。武當山則是道教與武當派的聖地，兩者常被拿來相提並論。", "topic": "geo", "region": "中國"}, {"id": "cn-056", "category": "地理", "difficulty": 2, "type": "choice", "question": "「湖南」「湖北」兩個省名中的「湖」，指的是哪一座湖？", "options": ["洞庭湖", "太湖", "巢湖", "鄱陽湖"], "answer": 0, "explanation": "兩省大致以洞庭湖為界，洞庭湖以南是湖南，以北是湖北。", "fun_fact": "范仲淹〈岳陽樓記〉中「銜遠山，吞長江，浩浩湯湯」描寫的正是洞庭湖；岳陽樓就矗立在洞庭湖畔。", "topic": "geo", "region": "中國"}, {"id": "cn-057", "category": "地理", "difficulty": 2, "type": "choice", "question": "名列中國四大名園之一的「拙政園」位於哪座城市？", "options": ["杭州", "南京", "蘇州", "揚州"], "answer": 2, "explanation": "拙政園位於江蘇蘇州，與留園等蘇州古典園林在1997年列入世界文化遺產。", "fun_fact": "中國四大名園是蘇州的拙政園、留園，北京的頤和園，以及河北的承德避暑山莊，其中一半在蘇州。", "topic": "geo", "region": "中國"}, {"id": "cn-058", "category": "地理", "difficulty": 2, "type": "choice", "question": "連接青海西寧與西藏拉薩、被稱為「世界海拔最高鐵路」的是？", "options": ["京滬高鐵", "京廣鐵路", "青藏鐵路", "成昆鐵路"], "answer": 2, "explanation": "青藏鐵路全線在2006年通車，最高點唐古拉山口海拔約5,072公尺，是世界上海拔最高的鐵路。", "fun_fact": "因為高原空氣稀薄，青藏鐵路的旅客列車車廂設有供氧設備，座位旁還有吸氧的插孔。", "topic": "geo", "region": "中國"}, {"id": "cn-059", "category": "地理", "difficulty": 2, "type": "choice", "question": "以「一清二白三紅四綠五黃」形容的牛肉拉麵，是哪座城市的招牌美食？", "options": ["銀川", "太原", "西安", "蘭州"], "answer": 3, "explanation": "蘭州牛肉麵講究湯清、蘿蔔白、辣油紅、香菜蒜苗綠、麵條黃黃亮亮，因此有這句口訣。", "fun_fact": "蘭州牛肉麵是清湯系統，和台灣常見、湯頭濃郁的紅燒牛肉麵是完全不同的風格。", "topic": "geo", "region": "中國"}, {"id": "cn-060", "category": "地理", "difficulty": 2, "type": "choice", "question": "隔開海南島與廣東雷州半島的海峽是？", "options": ["渤海海峽", "瓊州海峽", "對馬海峽", "麻六甲海峽"], "answer": 1, "explanation": "瓊州海峽位於海南島北方，隔開海南島與廣東的雷州半島；海南省簡稱「瓊」，海峽也因此得名。", "fun_fact": "火車要去海南島，會整列開上渡輪「坐船」過瓊州海峽，上岸後再繼續行駛。", "topic": "geo", "region": "中國"}, {"id": "cn-061", "category": "地理", "difficulty": 3, "type": "choice", "question": "京杭大運河溝通了中國大陸東部五大水系，下列哪一條「不在」其中？", "options": ["錢塘江", "淮河", "珠江", "海河"], "answer": 2, "explanation": "京杭大運河北起北京、南到杭州，由北而南連接海河、黃河、淮河、長江、錢塘江五大水系；珠江在華南，並不在運河沿線。", "fun_fact": "京杭大運河全長將近1,800公里，是世界上最長的古代人工運河，2014年以「中國大運河」之名列入世界文化遺產。", "topic": "geo", "region": "中國"}, {"id": "cn-062", "category": "地理", "difficulty": 3, "type": "choice", "question": "中國大陸最大的沙漠「塔克拉瑪干沙漠」，位於哪一個盆地？", "options": ["四川盆地", "塔里木盆地", "柴達木盆地", "準噶爾盆地"], "answer": 1, "explanation": "塔克拉瑪干沙漠位於新疆南部的塔里木盆地中央，是中國大陸面積最大的沙漠。", "fun_fact": "它有「死亡之海」的稱號；2022年環繞整座沙漠的鐵路環線全部接通，成為世界第一條環沙漠鐵路。", "topic": "geo", "region": "中國"}, {"id": "cn-063", "category": "地理", "difficulty": 3, "type": "choice", "question": "被譽為烏龍茶名品的武夷岩茶「大紅袍」，產自哪一座山？", "options": ["黃山", "峨眉山", "廬山", "武夷山"], "answer": 3, "explanation": "大紅袍產自福建的武夷山，是武夷岩茶的代表。武夷山在1999年列入世界文化與自然雙重遺產。", "fun_fact": "武夷山九龍窠的岩壁上有幾株大紅袍「母樹」，被當成國寶保護，已經停止採摘。黃山、廬山也產名茶，分別是黃山毛峰和廬山雲霧茶。", "topic": "geo", "region": "中國"}, {"id": "cn-064", "category": "地理", "difficulty": 3, "type": "choice", "question": "長江和黃河的發源地，都位於哪一個省級行政區？", "options": ["四川", "甘肅", "西藏", "青海"], "answer": 3, "explanation": "長江與黃河都發源於青海省，當地和瀾滄江的源頭合稱「三江源」。", "fun_fact": "三江源地區被稱為「中華水塔」，長江的源頭在唐古拉山脈的各拉丹冬雪山一帶，黃河則發源於巴顏喀拉山北麓。", "topic": "geo", "region": "中國"}, {"id": "cn-065", "category": "地理", "difficulty": 2, "type": "choice", "question": "長江和黃河最後都流入同一片海。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。長江在上海附近注入東海，黃河則在山東東營一帶注入渤海。", "fun_fact": "黃河每年挾帶大量泥沙入海，河口的陸地會不斷向海中延伸，東營一帶因此不斷「長出」新的土地。", "topic": "geo", "region": "中國"}, {"id": "cn-066", "category": "地理", "difficulty": 1, "type": "order", "question": "請將這些城市由西到東排列：", "options": ["成都", "武漢", "上海", "烏魯木齊"], "answer": [3, 0, 1, 2], "explanation": "烏魯木齊在新疆，位置最西；接著是四川成都、湖北武漢，最東邊是濱海的上海。", "fun_fact": "中國大陸官方統一使用北京時間，所以位置很西的烏魯木齊，夏天晚上10點左右天色可能還亮著。", "topic": "geo", "region": "中國"}, {"id": "cn-067", "category": "地理", "difficulty": 3, "type": "order", "question": "請將這些名山依主峰海拔由高到低排列：", "options": ["泰山", "峨眉山", "華山", "衡山"], "answer": [1, 2, 0, 3], "explanation": "峨眉山主峰萬佛頂約3,099公尺；西嶽華山約2,155公尺；東嶽泰山約1,500多公尺；南嶽衡山約1,300公尺。", "fun_fact": "峨眉山並不在五嶽之列，它是中國佛教四大名山之一，與五台山、普陀山、九華山齊名。", "topic": "geo", "region": "中國"}, {"id": "wd-001", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上面積最大的國家是？", "options": ["俄羅斯", "加拿大", "中國", "美國"], "answer": 0, "explanation": "俄羅斯面積約 1,700 萬平方公里，是世界最大的國家。", "fun_fact": "俄羅斯橫跨 11 個時區。", "topic": "geo", "region": "世界"}, {"id": "wd-002", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上最大的海洋是？", "options": ["印度洋", "太平洋", "北冰洋", "大西洋"], "answer": 1, "explanation": "太平洋是面積最大的海洋。", "fun_fact": "太平洋的面積比地球上所有陸地加起來還大。", "topic": "geo", "region": "世界"}, {"id": "wd-003", "category": "地理", "difficulty": 1, "type": "choice", "question": "澳洲的首都是？", "options": ["坎培拉", "伯斯", "墨爾本", "雪梨"], "answer": 0, "explanation": "澳洲首都是坎培拉，不是很多人以為的雪梨。", "fun_fact": "坎培拉是為了平息雪梨和墨爾本爭當首都而特別規劃興建的城市。", "topic": "geo", "region": "世界"}, {"id": "wd-004", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上面積最小的國家是？", "options": ["梵蒂岡", "摩納哥", "新加坡", "列支敦斯登"], "answer": 0, "explanation": "梵蒂岡面積不到半平方公里。", "fun_fact": "梵蒂岡的國土被義大利首都羅馬整個包圍。", "topic": "geo", "region": "世界"}, {"id": "wd-005", "category": "地理", "difficulty": 2, "type": "choice", "question": "撒哈拉沙漠是世界上面積最大的沙漠。", "options": ["對", "錯"], "answer": 1, "explanation": "若依降水量來定義沙漠，南極洲才是世界最大的沙漠；撒哈拉是最大的「熱沙漠」。", "fun_fact": "沙漠的定義看的是雨量，而不是溫度或沙子。", "topic": "geo", "region": "世界"}, {"id": "wd-006", "category": "地理", "difficulty": 2, "type": "choice", "question": "古印加帝國的遺址「馬丘比丘」位於哪個國家？", "options": ["墨西哥", "巴西", "秘魯", "智利"], "answer": 2, "explanation": "馬丘比丘位於秘魯的安地斯山脈上。", "fun_fact": "直到 1911 年，它才被外界廣泛知道。", "topic": "geo", "region": "世界"}, {"id": "wd-007", "category": "地理", "difficulty": 2, "type": "choice", "question": "「盧比」是下列哪個國家的貨幣？", "options": ["泰國", "越南", "印度", "韓國"], "answer": 2, "explanation": "印度的貨幣是盧比。泰國是泰銖，越南是越南盾，韓國是韓元。", "fun_fact": "巴基斯坦、尼泊爾、斯里蘭卡的貨幣也叫盧比。", "topic": "geo", "region": "世界"}, {"id": "wd-016", "category": "地理", "difficulty": 1, "type": "choice", "question": "加拿大的首都是哪一座城市？", "options": ["多倫多", "溫哥華", "蒙特婁", "渥太華"], "answer": 3, "explanation": "加拿大的首都是渥太華，並不是人口最多的多倫多。", "fun_fact": "渥太華是在 1857 年由英國維多利亞女王選定為首都的。", "topic": "geo", "region": "世界"}, {"id": "wd-017", "category": "地理", "difficulty": 1, "type": "choice", "question": "巴拿馬運河連接了哪兩個大洋？", "options": ["大西洋與印度洋", "印度洋與北冰洋", "太平洋與印度洋", "太平洋與大西洋"], "answer": 3, "explanation": "巴拿馬運河橫越中美洲的巴拿馬地峽，讓船隻不必繞行南美洲南端就能往返太平洋與大西洋。", "fun_fact": "運河不是平的：船隻要靠一道道船閘被抬升到海拔約 26 公尺的加通湖，再降回海平面。", "topic": "geo", "region": "世界"}, {"id": "wd-018", "category": "地理", "difficulty": 1, "type": "choice", "question": "著名的古蹟「吳哥窟」位於哪個國家？", "options": ["泰國", "柬埔寨", "越南", "寮國"], "answer": 1, "explanation": "吳哥窟位於柬埔寨暹粒附近，是 12 世紀高棉帝國興建的寺廟。", "fun_fact": "吳哥窟的圖案就畫在柬埔寨的國旗上。", "topic": "geo", "region": "世界"}, {"id": "wd-019", "category": "地理", "difficulty": 1, "type": "choice", "question": "位於澳洲東北外海的「大堡礁」，是世界上最大的珊瑚礁系統。", "options": ["對", "錯"], "answer": 0, "explanation": "正確。大堡礁由約 3,000 個珊瑚礁組成，綿延超過 2,300 公里，是世界最大的珊瑚礁系統。", "fun_fact": "大堡礁是由無數微小的珊瑚蟲一點一點堆積出來的，被稱為地球上最大的生物構造。", "topic": "geo", "region": "世界"}, {"id": "wd-020", "category": "地理", "difficulty": 2, "type": "choice", "question": "世界上最深的湖泊是哪一個？", "options": ["蘇必略湖", "貝加爾湖", "維多利亞湖", "裏海"], "answer": 1, "explanation": "位於俄羅斯西伯利亞的貝加爾湖最深約 1,642 公尺，是世界最深的湖泊。", "fun_fact": "貝加爾湖儲存了全世界地表未結冰淡水的約兩成。", "topic": "geo", "region": "世界"}, {"id": "wd-021", "category": "地理", "difficulty": 2, "type": "choice", "question": "「直布羅陀海峽」隔開了哪兩個洲？", "options": ["北美洲與南美洲", "歐洲與非洲", "亞洲與非洲", "歐洲與亞洲"], "answer": 1, "explanation": "直布羅陀海峽位於西班牙與摩洛哥之間，是地中海通往大西洋的出口，也分隔了歐洲與非洲。", "fun_fact": "海峽最窄處只有約 14 公里，天氣好時可以從歐洲望見非洲。", "topic": "geo", "region": "世界"}, {"id": "wd-022", "category": "地理", "difficulty": 2, "type": "choice", "question": "世界上唯一一面「不是四邊形」的國旗，屬於哪個國家？", "options": ["梵蒂岡", "瑞士", "尼泊爾", "不丹"], "answer": 2, "explanation": "尼泊爾國旗是由兩個上下相疊的三角形組成，是全世界唯一不是長方形或正方形的國旗。瑞士和梵蒂岡的國旗是正方形。", "fun_fact": "尼泊爾國旗上方畫著月亮、下方畫著太陽。", "topic": "geo", "region": "世界"}, {"id": "wd-023", "category": "地理", "difficulty": 2, "type": "choice", "question": "非洲最高峰「吉力馬札羅山」位於哪個國家？", "options": ["坦尚尼亞", "衣索比亞", "肯亞", "南非"], "answer": 0, "explanation": "吉力馬札羅山位於坦尚尼亞東北部，靠近肯亞邊界，海拔約 5,895 公尺。", "fun_fact": "雖然它離赤道不遠，山頂卻終年有冰川，不過面積已經大幅縮小。", "topic": "geo", "region": "世界"}, {"id": "wd-024", "category": "地理", "difficulty": 2, "type": "choice", "question": "南美洲國家「厄瓜多」的國名，在西班牙文中是什麼意思？", "options": ["白銀", "高山", "赤道", "太陽"], "answer": 2, "explanation": "Ecuador 在西班牙文就是「赤道」的意思，因為赤道正好穿過這個國家。", "fun_fact": "同在南美洲的阿根廷，國名則來自拉丁文的「銀」（argentum）。", "topic": "geo", "region": "世界"}, {"id": "wd-025", "category": "地理", "difficulty": 2, "type": "choice", "question": "日本最高峰富士山，橫跨哪兩個縣？", "options": ["愛知縣與長野縣", "東京都與神奈川縣", "靜岡縣與山梨縣", "長野縣與岐阜縣"], "answer": 2, "explanation": "富士山海拔 3,776 公尺，位於靜岡縣與山梨縣之間。", "fun_fact": "富士山八合目以上的土地，大部分屬於富士山本宮淺間大社所有。", "topic": "geo", "region": "世界"}, {"id": "wd-026", "category": "地理", "difficulty": 2, "type": "order", "question": "請依面積由大到小，排出這四個大洲：", "options": ["亞洲", "北美洲", "南美洲", "非洲"], "answer": [0, 3, 1, 2], "explanation": "亞洲約 4,400 萬平方公里，非洲約 3,000 萬，北美洲約 2,400 萬，南美洲約 1,800 萬平方公里。", "fun_fact": "亞洲一洲的面積，就占了地球陸地的將近三分之一。", "topic": "geo", "region": "世界"}, {"id": "wd-027", "category": "地理", "difficulty": 3, "type": "choice", "question": "被稱為世界上最乾燥的非極地沙漠「阿塔卡馬沙漠」，主要位於哪個國家？", "options": ["智利", "澳洲", "墨西哥", "納米比亞"], "answer": 0, "explanation": "阿塔卡馬沙漠位於智利北部，有些測站幾十年來幾乎沒有記錄到降雨。", "fun_fact": "因為環境很像火星，美國太空總署（NASA）曾在這裡測試火星探測設備。", "topic": "geo", "region": "世界"}, {"id": "wd-051", "category": "地理", "difficulty": 1, "type": "choice", "question": "越南的首都是哪一座城市？", "options": ["胡志明市", "峴港", "河內", "順化"], "answer": 2, "explanation": "越南的首都是位於北部的河內；胡志明市（舊稱西貢）雖然是越南人口最多的城市，但並不是首都。", "fun_fact": "河內的越南文「Hà Nội」意思是「河之內」，因為這座城市位在紅河的河灣之中。", "topic": "geo", "region": "世界"}, {"id": "wd-052", "category": "地理", "difficulty": 1, "type": "choice", "question": "東南亞國家中，唯一沒有海岸線的內陸國是哪一國？", "options": ["緬甸", "柬埔寨", "寮國", "越南"], "answer": 2, "explanation": "寮國被中國、越南、柬埔寨、泰國、緬甸五國包圍，是東南亞唯一的內陸國。", "fun_fact": "雖然沒有海，湄公河卻流經寮國大半國土，是當地重要的交通與漁業命脈。", "topic": "geo", "region": "世界"}, {"id": "wd-053", "category": "地理", "difficulty": 1, "type": "choice", "question": "著名的「國油雙峰塔」（Petronas Twin Towers）位於哪一座城市？", "options": ["雅加達", "吉隆坡", "曼谷", "新加坡"], "answer": 1, "explanation": "國油雙峰塔位於馬來西亞首都吉隆坡，1998 年完工，高約 452 公尺。", "fun_fact": "兩座塔之間在 41 至 42 樓有一座「空中天橋」相連，是遊客必訪的觀景點。", "topic": "geo", "region": "世界"}, {"id": "wd-054", "category": "地理", "difficulty": 1, "type": "choice", "question": "以壯麗的「峽灣」地形聞名，有蓋倫格峽灣等世界遺產的北歐國家是？", "options": ["比利時", "荷蘭", "芬蘭", "挪威"], "answer": 3, "explanation": "峽灣是冰河侵蝕出的深谷被海水淹沒而成，挪威西海岸的峽灣最具代表性，蓋倫格峽灣與納柔依峽灣在 2005 年列入世界遺產。", "fun_fact": "芬蘭則以湖泊眾多聞名，被稱為「千湖之國」。", "topic": "geo", "region": "世界"}, {"id": "wd-055", "category": "地理", "difficulty": 1, "type": "choice", "question": "著名的「尼加拉瀑布」位於哪兩個國家的交界？", "options": ["巴西與阿根廷", "美國與墨西哥", "美國與加拿大", "尚比亞與辛巴威"], "answer": 2, "explanation": "尼加拉瀑布位於美國紐約州與加拿大安大略省交界的尼加拉河上。", "fun_fact": "尼加拉瀑布其實由三座瀑布組成：馬蹄瀑布、美國瀑布和新娘面紗瀑布，其中馬蹄瀑布大部分位於加拿大境內。", "topic": "geo", "region": "世界"}, {"id": "wd-056", "category": "地理", "difficulty": 1, "type": "choice", "question": "日本沖繩縣的縣廳所在地是哪一個城市？", "options": ["那霸市", "石垣市", "名護市", "宮古島市"], "answer": 0, "explanation": "沖繩縣的縣廳位於沖繩本島南部的那霸市，那霸機場也是台灣旅客前往沖繩最常用的機場。", "fun_fact": "那霸市的「國際通」約 1.6 公里長，因戰後快速復興，被稱為「奇蹟的一英里」。", "topic": "geo", "region": "世界"}, {"id": "wd-057", "category": "地理", "difficulty": 2, "type": "choice", "question": "緬甸目前的首都是哪一座城市？", "options": ["蒲甘", "仰光", "奈比多", "曼德勒"], "answer": 2, "explanation": "緬甸在 2005 年開始把首都從仰光遷往新建的奈比多，並於 2006 年正式宣布。仰光仍是緬甸最大的城市。", "fun_fact": "奈比多的道路寬敞，有些主要大道寬達 20 線道，但車流稀少，常被形容為「空城」。", "topic": "geo", "region": "世界"}, {"id": "wd-058", "category": "地理", "difficulty": 2, "type": "choice", "question": "北非國家摩洛哥的首都是哪一座城市？", "options": ["馬拉喀什", "卡薩布蘭加", "拉巴特", "非斯"], "answer": 2, "explanation": "摩洛哥的首都是拉巴特；卡薩布蘭加雖然是最大城市，也因同名電影而出名，但並不是首都。", "fun_fact": "卡薩布蘭加（Casablanca）在西班牙文中是「白色房子」的意思。", "topic": "geo", "region": "世界"}, {"id": "wd-059", "category": "地理", "difficulty": 2, "type": "choice", "question": "土耳其的伊斯坦堡被一條海峽分成「歐洲區」和「亞洲區」，這條海峽是？", "options": ["荷莫茲海峽", "麻六甲海峽", "達達尼爾海峽", "博斯普魯斯海峽"], "answer": 3, "explanation": "博斯普魯斯海峽連接黑海與馬爾馬拉海，把伊斯坦堡分成歐洲、亞洲兩岸，因此伊斯坦堡是一座橫跨兩大洲的城市。", "fun_fact": "住在伊斯坦堡的人，可能每天搭渡輪或走跨海大橋，在歐洲和亞洲之間通勤上班。", "topic": "geo", "region": "世界"}, {"id": "wd-060", "category": "地理", "difficulty": 2, "type": "choice", "question": "埃及的「蘇伊士運河」連接了哪兩個海？", "options": ["地中海與黑海", "地中海與紅海", "紅海與阿拉伯海", "黑海與裏海"], "answer": 1, "explanation": "蘇伊士運河在 1869 年通航，連接北邊的地中海與南邊的紅海，讓船隻不必繞行非洲南端就能往來歐亞。", "fun_fact": "蘇伊士運河也是非洲與亞洲的分界，所以埃及的國土其實橫跨非、亞兩洲。", "topic": "geo", "region": "世界"}, {"id": "wd-061", "category": "地理", "difficulty": 2, "type": "choice", "question": "多瑙河流經多個國家的首都，下列哪一座首都「沒有」多瑙河流過？", "options": ["布拉格", "貝爾格勒", "布達佩斯", "維也納"], "answer": 0, "explanation": "捷克首都布拉格位在伏爾塔瓦河畔；維也納、布達佩斯、貝爾格勒則都有多瑙河流經。", "fun_fact": "多瑙河流經的首都還有斯洛伐克的布拉提斯拉瓦，是世界上流經最多國家首都的河流。", "topic": "geo", "region": "世界"}, {"id": "wd-062", "category": "地理", "difficulty": 2, "type": "choice", "question": "英文中的「間歇泉」（geyser）一詞，源自哪一個國家的一處溫泉名稱？", "options": ["紐西蘭", "日本", "美國", "冰島"], "answer": 3, "explanation": "geyser 一詞來自冰島豪卡達勒谷地的「蓋歇爾」（Geysir）間歇泉，冰島文原意是「噴湧」。", "fun_fact": "蓋歇爾現在已經很少噴發，遊客多半是去看旁邊的「史托克」間歇泉，它大約每隔幾分鐘就會噴一次。", "topic": "geo", "region": "世界"}, {"id": "wd-063", "category": "地理", "difficulty": 3, "type": "choice", "question": "全世界只有兩個「雙重內陸國」（自己是內陸國，所有鄰國也都是內陸國），其中位於歐洲的是哪一國？", "options": ["列支敦斯登", "盧森堡", "聖馬利諾", "安道爾"], "answer": 0, "explanation": "列支敦斯登夾在瑞士和奧地利之間，這兩國都是內陸國，所以它是雙重內陸國；安道爾、盧森堡、聖馬利諾的鄰國都有海岸線。", "fun_fact": "另一個雙重內陸國是中亞的烏茲別克。從這兩國出發，至少要穿越兩個國家才能抵達通往大洋的海岸。", "topic": "geo", "region": "世界"}, {"id": "wd-064", "category": "地理", "difficulty": 3, "type": "choice", "question": "全世界「最早」進入新的一天、最先迎接新年的時區是？", "options": ["UTC+10", "UTC+13", "UTC+12", "UTC+14"], "answer": 3, "explanation": "太平洋島國吉里巴斯的萊恩群島使用 UTC+14，是全世界最早進入新一天的地方。", "fun_fact": "吉里巴斯在 1995 年調整國際換日線，讓原本被換日線分成「兩天」的國土統一在同一天，換日線因此出現一個明顯的凸出。", "topic": "geo", "region": "世界"}, {"id": "wd-065", "category": "地理", "difficulty": 3, "type": "choice", "question": "印度全國使用同一個標準時間，它比國際標準時間（UTC）快多少？", "options": ["4 小時 30 分", "5 小時", "5 小時 30 分", "6 小時"], "answer": 2, "explanation": "印度標準時間是 UTC+5:30，比台灣（UTC+8）慢 2 小時 30 分。", "fun_fact": "鄰國尼泊爾更特別，使用 UTC+5:45，時差會出現「45 分」這種零頭。", "topic": "geo", "region": "世界"}, {"id": "wd-066", "category": "地理", "difficulty": 3, "type": "choice", "question": "世界上落差最大的瀑布「天使瀑布」，位於哪個國家？", "options": ["巴西", "哥倫比亞", "秘魯", "委內瑞拉"], "answer": 3, "explanation": "天使瀑布位於南美洲委內瑞拉的卡奈馬國家公園，落差約 979 公尺。", "fun_fact": "天使瀑布的名字不是來自天使，而是紀念 1930 年代飛越瀑布的美國飛行員吉米．安傑爾（Jimmie Angel）。", "topic": "geo", "region": "世界"}, {"id": "wd-067", "category": "地理", "difficulty": 2, "type": "choice", "question": "赤道通過新加坡。", "options": ["對", "錯"], "answer": 1, "explanation": "錯誤。新加坡大約位於北緯 1 度，雖然非常接近赤道，但赤道其實從它南方的印尼通過。", "fun_fact": "新加坡距離赤道只有約140公里，所以一年四季都很炎熱，白天的長度全年也都在12小時左右。", "topic": "geo", "region": "世界"}, {"id": "wd-068", "category": "地理", "difficulty": 2, "type": "choice", "question": "南極點的平均氣溫，比北極點還要低得多。", "options": ["對", "錯"], "answer": 0, "explanation": "正確。南極點位在海拔約 2,800 公尺的冰原上，年平均氣溫約零下 49°C；北極點則位於海冰上，底下的海水會釋放熱量，所以相對「溫暖」許多。", "fun_fact": "南極點底下是南極大陸，北極點底下卻沒有陸地，只有漂浮在北冰洋上的海冰。", "topic": "geo", "region": "世界"}, {"id": "wd-069", "category": "地理", "difficulty": 2, "type": "order", "question": "請依山峰高度由高到低，排出下列四座山：", "options": ["富士山", "白朗峰", "聖母峰", "吉力馬札羅山"], "answer": [2, 3, 1, 0], "explanation": "聖母峰約 8,849 公尺，非洲的吉力馬札羅山約 5,895 公尺，歐洲阿爾卑斯山的白朗峰約 4,800 公尺，日本的富士山約 3,776 公尺。", "fun_fact": "白朗峰山頂覆蓋著厚厚的冰雪，冰雪厚度每年不同，所以每次測量出來的高度都會略有差異。", "topic": "geo", "region": "世界"}, {"id": "wd-070", "category": "地理", "difficulty": 3, "type": "order", "question": "請依緯度由北到南，排出下列四座城市：", "options": ["台北", "東京", "首爾", "新加坡"], "answer": [2, 1, 0, 3], "explanation": "首爾約北緯 37.6 度，東京約北緯 35.7 度，台北約北緯 25 度，新加坡約北緯 1.3 度。", "fun_fact": "很多人以為東京比首爾更北，其實首爾的緯度比東京還要高約 2 度。", "topic": "geo", "region": "世界"}], "history": [{"id": "tw-001", "category": "歷史", "difficulty": 1, "type": "choice", "question": "荷蘭人在台灣建立的「熱蘭遮城」，位於今天的哪座城市？", "options": ["新竹", "高雄", "基隆", "台南"], "answer": 3, "explanation": "熱蘭遮城於 1624 年起興建，位於今台南安平。", "fun_fact": "熱蘭遮城的遺址就是今天的「安平古堡」。", "topic": "history", "region": "台灣"}, {"id": "tw-002", "category": "歷史", "difficulty": 2, "type": "order", "question": "請依時間先後排出這些事件：", "options": ["馬關條約割讓台灣", "清軍攻台，明鄭結束", "荷蘭人興建熱蘭遮城", "鄭成功驅逐荷蘭人"], "answer": [2, 3, 1, 0], "explanation": "1624 熱蘭遮城 → 1662 鄭成功驅荷 → 1683 明鄭降清 → 1895 馬關條約。", "fun_fact": "明鄭在台灣統治約 21 年，歷經鄭成功、鄭經、鄭克塽三代。", "topic": "history", "region": "台灣"}, {"id": "tw-003", "category": "歷史", "difficulty": 2, "type": "choice", "question": "台灣建省後的首任巡撫，推動鐵路與電報建設的是誰？", "options": ["沈葆楨", "林爽文", "丘逢甲", "劉銘傳"], "answer": 3, "explanation": "劉銘傳於 1885 年台灣建省後出任首任巡撫。", "fun_fact": "他主持興建的鐵路從基隆通到台北，後來再延伸到新竹。", "topic": "history", "region": "台灣"}, {"id": "tw-004", "category": "歷史", "difficulty": 3, "type": "choice", "question": "日治時期設計烏山頭水庫與嘉南大圳的日本工程師是？", "options": ["後藤新平", "兒玉源太郎", "八田與一", "伊能嘉矩"], "answer": 2, "explanation": "八田與一主持興建嘉南大圳，大幅改善嘉南平原的灌溉。", "fun_fact": "烏山頭水庫旁有八田與一的銅像，每年都有紀念活動。", "topic": "history", "region": "台灣"}, {"id": "tw-017", "category": "歷史", "difficulty": 2, "type": "choice", "question": "台灣目前已知最早的史前文化「長濱文化」，其代表遺址八仙洞位於哪個縣？", "options": ["屏東縣", "宜蘭縣", "花蓮縣", "台東縣"], "answer": 3, "explanation": "長濱文化以台東縣長濱鄉的八仙洞遺址為代表，屬於舊石器時代晚期文化。", "fun_fact": "八仙洞原本是海浪侵蝕出的海蝕洞，因為地殼不斷抬升，現在高掛在山壁上。", "topic": "history", "region": "台灣"}, {"id": "tw-018", "category": "歷史", "difficulty": 3, "type": "choice", "question": "1980 年興建南迴鐵路卑南新站（今台東車站）時，意外挖出上千座石板棺的史前遺址是？", "options": ["卑南遺址", "長濱八仙洞遺址", "圓山遺址", "十三行遺址"], "answer": 0, "explanation": "卑南遺址在興建南迴鐵路卑南新站（今台東車站）時被發現，搶救發掘出土約 1,600 座石板棺與大量玉器、陶器。", "fun_fact": "遺址現已規劃為卑南遺址公園，屬於國立臺灣史前文化博物館。", "topic": "history", "region": "台灣"}, {"id": "tw-019", "category": "歷史", "difficulty": 2, "type": "choice", "question": "新北八里的十三行文化史前居民，已經懂得煉鐵。", "options": ["對", "錯"], "answer": 0, "explanation": "十三行遺址出土煉鐵遺留與鐵器，十三行人是目前唯一確定擁有煉鐵技術的台灣史前居民，屬於鐵器時代。", "fun_fact": "這處遺址是 1955 年一位空軍飛官飛越觀音山時，發現羅盤指針異常，才循線找到的。", "topic": "history", "region": "台灣"}, {"id": "tw-020", "category": "歷史", "difficulty": 3, "type": "choice", "question": "1626 年西班牙人在台灣北部建立的「聖薩爾瓦多城」，位於今天的哪裡？", "options": ["基隆和平島", "淡水紅毛城", "宜蘭頭城", "新竹南寮"], "answer": 0, "explanation": "西班牙人於 1626 年佔領基隆的社寮島（今和平島），並在島上興建聖薩爾瓦多城。", "fun_fact": "西班牙人在北台灣只待了約 16 年，1642 年就被荷蘭人趕走了。", "topic": "history", "region": "台灣"}, {"id": "tw-021", "category": "歷史", "difficulty": 1, "type": "choice", "question": "俗諺「一府二鹿三艋舺」中的「鹿」，指的是今天的哪裡？", "options": ["鹿草", "鹿谷", "鹿港", "鹿野"], "answer": 2, "explanation": "這句話描述清代台灣最繁榮的三大港市：府城台南、彰化鹿港、台北艋舺（萬華）。", "fun_fact": "一般認為「艋舺」源自原住民語中的「獨木舟」（Bangka），因為早年常有原住民划獨木舟來此交易。", "topic": "history", "region": "台灣"}, {"id": "tw-022", "category": "歷史", "difficulty": 3, "type": "choice", "question": "1874 年牡丹社事件後，奉命來台籌辦防務、在台南興建「億載金城」的清朝官員是？", "options": ["施琅", "劉永福", "劉銘傳", "沈葆楨"], "answer": 3, "explanation": "沈葆楨來台處理牡丹社事件後續防務，興建億載金城砲台，並推動開山撫番等措施。", "fun_fact": "他也奏請朝廷為鄭成功建祠，就是今天台南的延平郡王祠。", "topic": "history", "region": "台灣"}, {"id": "tw-023", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1908 年全線通車、從基隆一路通到打狗（高雄）的鐵路是？", "options": ["北迴鐵路", "阿里山森林鐵路", "縱貫線鐵路", "南迴鐵路"], "answer": 2, "explanation": "日治時期興建的縱貫線鐵路於 1908 年全線通車，大幅縮短了台灣南北的交通時間。", "fun_fact": "當年的通車典禮在台中公園舉行，公園裡著名的「湖心亭」就是為了這場典禮而蓋的。", "topic": "history", "region": "台灣"}, {"id": "tw-024", "category": "歷史", "difficulty": 1, "type": "choice", "question": "阿里山森林鐵路在日治時期興建，最初主要是為了什麼？", "options": ["運送軍隊與物資", "載遊客上山看日出", "運送山上的木材", "運送茶葉下山"], "answer": 2, "explanation": "日本人看中阿里山豐富的檜木資源，興建森林鐵路把木材運下山。", "fun_fact": "為了爬上陡峭的山坡，鐵路設計了「之字形」折返路線，還會在獨立山繞圈螺旋爬升。", "topic": "history", "region": "台灣"}, {"id": "tw-025", "category": "歷史", "difficulty": 2, "type": "choice", "question": "下列哪一項「不」屬於 1970 年代推動的「十大建設」？", "options": ["台北捷運", "桃園國際機場", "中山高速公路", "北迴鐵路"], "answer": 0, "explanation": "十大建設包括中山高速公路、北迴鐵路、鐵路電氣化、桃園國際機場（當時稱中正國際機場）等；台北捷運第一條路線到 1996 年才通車。", "fun_fact": "中山高速公路於 1978 年全線通車，是台灣第一條南北高速公路。", "topic": "history", "region": "台灣"}, {"id": "tw-026", "category": "歷史", "difficulty": 2, "type": "order", "question": "請依時間先後排出這些事件：", "options": ["牡丹社事件", "郁永河來台採硫磺", "台灣建省", "台北捷運第一條路線通車"], "answer": [1, 0, 2, 3], "explanation": "1697 郁永河來台採硫 → 1874 牡丹社事件 → 1885 台灣建省 → 1996 台北捷運木柵線通車。", "fun_fact": "郁永河把來台採硫的見聞寫成《裨海紀遊》，是認識清初台灣的重要史料。", "topic": "history", "region": "台灣"}, {"id": "cn-001", "category": "歷史", "difficulty": 1, "type": "choice", "question": "第一個統一中國、自稱「始皇帝」的是誰？", "options": ["嬴政", "劉邦", "漢武帝", "項羽"], "answer": 0, "explanation": "秦王嬴政於西元前 221 年統一六國，自稱始皇帝。", "fun_fact": "他也統一了文字、貨幣和度量衡。", "topic": "history", "region": "中國"}, {"id": "cn-002", "category": "歷史", "difficulty": 1, "type": "order", "question": "請依時間先後排出這些朝代：", "options": ["宋", "漢", "唐", "隋"], "answer": [1, 3, 2, 0], "explanation": "順序是 漢 → 隋 → 唐 → 宋。", "fun_fact": "隋朝雖然只有短短三十多年，卻開鑿了大運河。", "topic": "history", "region": "中國"}, {"id": "cn-003", "category": "歷史", "difficulty": 2, "type": "choice", "question": "漢武帝時奉命出使西域、開拓絲路的是誰？", "options": ["班超", "鄭和", "玄奘", "張騫"], "answer": 3, "explanation": "張騫出使西域，打通了中原與西域的交通。", "fun_fact": "葡萄、苜蓿等作物據說就是那時傳進中原的。", "topic": "history", "region": "中國"}, {"id": "cn-004", "category": "歷史", "difficulty": 2, "type": "choice", "question": "明朝的鄭和一共下西洋幾次？", "options": ["3 次", "10 次", "7 次", "5 次"], "answer": 2, "explanation": "鄭和在永樂、宣德年間共七次下西洋。", "fun_fact": "他的船隊最遠到達東非沿岸。", "topic": "history", "region": "中國"}, {"id": "cn-017", "category": "歷史", "difficulty": 2, "type": "choice", "question": "一般認為，中國的「科舉制度」創始於哪個朝代？", "options": ["隋朝", "元朝", "漢朝", "宋朝"], "answer": 0, "explanation": "隋朝開始以考試選拔官員，隋煬帝時設立進士科，一般視為科舉的開端。", "fun_fact": "科舉在清末 1905 年正式廢除，前後實行了約 1300 年。", "topic": "history", "region": "中國"}, {"id": "cn-018", "category": "歷史", "difficulty": 1, "type": "choice", "question": "成語「臥薪嘗膽」說的是哪一位君王忍辱復國的故事？", "options": ["漢高祖劉邦", "西楚霸王項羽", "吳王夫差", "越王勾踐"], "answer": 3, "explanation": "越王勾踐被吳國打敗後刻苦自勵，最終滅了吳國。", "fun_fact": "《史記》其實只記載勾踐「嘗膽」，「臥薪」是後人附加上去的說法。", "topic": "history", "region": "中國"}, {"id": "cn-019", "category": "歷史", "difficulty": 1, "type": "choice", "question": "成語「破釜沉舟」出自哪位人物在鉅鹿之戰的決戰行動？", "options": ["劉邦", "韓信", "項羽", "曹操"], "answer": 2, "explanation": "項羽渡河後下令鑿沉船隻、打破煮飯的鍋，只帶三天糧食，表示不勝不歸。", "fun_fact": "這一戰項羽以少勝多大破秦軍主力，從此威震諸侯。", "topic": "history", "region": "中國"}, {"id": "cn-020", "category": "歷史", "difficulty": 1, "type": "choice", "question": "民間傳說「岳母刺字」，母親在誰的背上刺下「精忠報國」？", "options": ["戚繼光", "文天祥", "岳飛", "關羽"], "answer": 2, "explanation": "這是南宋名將岳飛的著名傳說。", "fun_fact": "據《宋史》記載，岳飛背上刺的是「盡忠報國」四字，至於是否為岳母所刺並無史料根據。", "topic": "history", "region": "中國"}, {"id": "cn-021", "category": "歷史", "difficulty": 1, "type": "choice", "question": "歷史上被稱為「貞觀之治」的盛世，是哪位皇帝在位時？", "options": ["漢武帝", "唐太宗", "唐玄宗", "宋太祖"], "answer": 1, "explanation": "「貞觀」是唐太宗李世民的年號，他在位時政治清明、國力強盛。", "fun_fact": "唐太宗曾說魏徵是他的鏡子：「以人為鏡，可以明得失」。", "topic": "history", "region": "中國"}, {"id": "cn-022", "category": "歷史", "difficulty": 3, "type": "choice", "question": "中國唯一的正統女皇帝武則天登基後，改國號為什麼？", "options": ["周", "魏", "齊", "唐"], "answer": 0, "explanation": "武則天於 690 年稱帝，改國號為「周」，史稱「武周」。", "fun_fact": "她晚年被迫退位後，國號又改回「唐」。", "topic": "history", "region": "中國"}, {"id": "cn-023", "category": "歷史", "difficulty": 2, "type": "choice", "question": "北宋發明「活字印刷術」的是哪一位？", "options": ["張衡", "畢昇", "郭守敬", "蔡倫"], "answer": 1, "explanation": "北宋平民畢昇發明膠泥活字，事蹟記載於沈括的《夢溪筆談》。", "fun_fact": "畢昇的活字是用黏土刻字再用火燒硬，比歐洲古騰堡的活字印刷早了約四百年。", "topic": "history", "region": "中國"}, {"id": "cn-024", "category": "歷史", "difficulty": 2, "type": "choice", "question": "南北朝時期，把圓周率精確推算到小數點後第 7 位的數學家是誰？", "options": ["沈括", "張衡", "郭守敬", "祖沖之"], "answer": 3, "explanation": "祖沖之算出圓周率介於 3.1415926 與 3.1415927 之間。", "fun_fact": "他還提出「密率」355/113，是非常精準又好記的近似分數。", "topic": "history", "region": "中國"}, {"id": "cn-025", "category": "歷史", "difficulty": 2, "type": "choice", "question": "明太祖朱元璋在建立明朝之前，曾經出家當過和尚。", "options": ["對", "錯"], "answer": 0, "explanation": "朱元璋幼年家貧、親人死於饑荒，曾到皇覺寺出家，後來才投身起義軍。", "fun_fact": "他從放牛娃、和尚一路成為開國皇帝，是中國史上出身最寒微的皇帝之一。", "topic": "history", "region": "中國"}, {"id": "cn-026", "category": "歷史", "difficulty": 2, "type": "choice", "question": "「罷黜百家，獨尊儒術」是秦始皇推行的政策。", "options": ["對", "錯"], "answer": 1, "explanation": "這是漢武帝時採納董仲舒的建議而推行的；秦始皇反而是「焚書坑儒」。", "fun_fact": "從漢武帝之後，儒家思想成為中國兩千年來的官方正統學說。", "topic": "history", "region": "中國"}, {"id": "cn-027", "category": "歷史", "difficulty": 3, "type": "choice", "question": "成語「紙上談兵」諷刺的是戰國時代哪位將領？", "options": ["廉頗", "孫臏", "白起", "趙括"], "answer": 3, "explanation": "趙括熟讀兵書卻缺乏實戰經驗，在長平之戰中大敗於秦將白起。", "fun_fact": "趙括的母親曾事先上書趙王，說兒子不能當大將，請求萬一失敗不要株連家人。", "topic": "history", "region": "中國"}, {"id": "cn-028", "category": "歷史", "difficulty": 3, "type": "order", "question": "請依發生時間先後排列這些歷史事件：", "options": ["靖難之役", "陳橋兵變", "赤壁之戰", "玄武門之變"], "answer": [2, 3, 1, 0], "explanation": "赤壁之戰（208 年，東漢末）→ 玄武門之變（626 年，唐）→ 陳橋兵變（960 年，北宋建立）→ 靖難之役（1399 年起，明）。", "fun_fact": "成語「黃袍加身」就是出自趙匡胤的陳橋兵變。", "topic": "history", "region": "中國"}, {"id": "wd-008", "category": "歷史", "difficulty": 1, "type": "choice", "question": "名畫《蒙娜麗莎》的作者是誰？", "options": ["米開朗基羅", "梵谷", "畢卡索", "達文西"], "answer": 3, "explanation": "《蒙娜麗莎》是達文西的作品，收藏於巴黎羅浮宮。", "fun_fact": "這幅畫在 1911 年曾經被偷走，兩年後才找回來。", "topic": "history", "region": "世界"}, {"id": "wd-009", "category": "歷史", "difficulty": 1, "type": "choice", "question": "美國的自由女神像是哪一個國家贈送的？", "options": ["英國", "法國", "西班牙", "荷蘭"], "answer": 1, "explanation": "自由女神像是法國送給美國的禮物，1886 年落成。", "fun_fact": "雕像內部的鋼鐵骨架是由艾菲爾鐵塔的設計者艾菲爾參與設計。", "topic": "history", "region": "世界"}, {"id": "wd-010", "category": "歷史", "difficulty": 2, "type": "choice", "question": "巴黎艾菲爾鐵塔當初是為了哪個活動而建造？", "options": ["世界博覽會", "國王加冕", "奧運", "戰爭勝利紀念"], "answer": 0, "explanation": "艾菲爾鐵塔是為 1889 年巴黎世界博覽會而建。", "fun_fact": "剛建成時很多藝術家反對，覺得它醜。", "topic": "history", "region": "世界"}, {"id": "wd-011", "category": "歷史", "difficulty": 2, "type": "order", "question": "請依時間先後排出這些事件：", "options": ["美國發表獨立宣言", "哥倫布抵達美洲", "人類首次登陸月球", "第一次世界大戰爆發"], "answer": [1, 0, 3, 2], "explanation": "1492 → 1776 → 1914 → 1969。", "fun_fact": "阿波羅 11 號登月時，阿姆斯壯說：「這是個人的一小步，人類的一大步。」", "topic": "history", "region": "世界"}, {"id": "wd-012", "category": "歷史", "difficulty": 2, "type": "choice", "question": "埃及最有名的三座大金字塔位在哪裡？", "options": ["阿斯旺", "路克索", "亞歷山大港", "吉薩"], "answer": 3, "explanation": "三座大金字塔位於開羅近郊的吉薩。", "fun_fact": "古夫金字塔是古代世界七大奇蹟中，唯一保存到今天的。", "topic": "history", "region": "世界"}, {"id": "wd-028", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1903 年完成公認為人類第一次「有動力、可操控」飛機飛行的是誰？", "options": ["林白", "愛迪生", "萊特兄弟", "貝爾"], "answer": 2, "explanation": "美國的萊特兄弟在 1903 年 12 月 17 日，於北卡羅來納州成功完成首次有動力、可操控的飛行。", "fun_fact": "第一次飛行只持續了約 12 秒，距離約 36 公尺，比一架波音 747 的翼展還短。", "topic": "history", "region": "世界"}, {"id": "wd-029", "category": "歷史", "difficulty": 1, "type": "choice", "question": "古羅馬城市「龐貝」是被哪一座火山爆發所掩埋？", "options": ["富士山", "維蘇威火山", "埃特納火山", "聖海倫斯火山"], "answer": 1, "explanation": "西元 79 年，義大利的維蘇威火山爆發，大量火山灰將龐貝城整個掩埋。", "fun_fact": "因為被火山灰封存，龐貝城連壁畫、麵包店和街上的塗鴉都保留了下來。", "topic": "history", "region": "世界"}, {"id": "wd-030", "category": "歷史", "difficulty": 2, "type": "choice", "question": "15 世紀在歐洲發明金屬活字印刷術，讓書籍得以大量印製的是誰？", "options": ["馬丁·路德", "伽利略", "古騰堡", "哥白尼"], "answer": 2, "explanation": "德國人古騰堡約在 1450 年發展出金屬活字印刷術，大幅推動了知識在歐洲的傳播。", "fun_fact": "其實東亞更早就有活字印刷：現存最古老的金屬活字印刷書是韓國 1377 年印製的《直指》。", "topic": "history", "region": "世界"}, {"id": "wd-031", "category": "歷史", "difficulty": 2, "type": "choice", "question": "率領船隊出發、進行人類第一次環球航行的航海家是誰？", "options": ["庫克船長", "達伽馬", "麥哲倫", "哥倫布"], "answer": 2, "explanation": "麥哲倫在 1519 年率西班牙船隊出發，但他在 1521 年死於菲律賓，最後由艾爾卡諾帶領剩下的船員於 1522 年回到西班牙，完成環球航行。", "fun_fact": "出發時有 5 艘船、約 240 至 270 人（各家說法不一），最後只有「維多利亞號」1 艘船、18 人回到西班牙。", "topic": "history", "region": "世界"}, {"id": "wd-032", "category": "歷史", "difficulty": 2, "type": "choice", "question": "第二次世界大戰在歐洲的爆發，是因為德國在 1939 年入侵了哪個國家？", "options": ["波蘭", "法國", "挪威", "蘇聯"], "answer": 0, "explanation": "1939 年 9 月 1 日德國入侵波蘭，英、法兩國隨即在 9 月 3 日對德宣戰，第二次世界大戰爆發。", "fun_fact": "", "topic": "history", "region": "世界"}, {"id": "wd-033", "category": "歷史", "difficulty": 2, "type": "choice", "question": "象徵冷戰的「柏林圍牆」是在哪一年倒塌的？", "options": ["1961 年", "1989 年", "1975 年", "1991 年"], "answer": 1, "explanation": "柏林圍牆在 1989 年 11 月 9 日開放，隔年東西德統一。1961 年是圍牆開始興建的年份。", "fun_fact": "圍牆開放的起因之一，是東德官員在記者會上誤說新的出境規定「立即生效」。", "topic": "history", "region": "世界"}, {"id": "wd-034", "category": "歷史", "difficulty": 2, "type": "choice", "question": "法國皇帝拿破崙其實是個特別矮小的人。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。拿破崙身高約 168 至 170 公分，在當時的法國男性中算是一般身高。「矮個子」的印象多半來自法制與英制單位換算的誤會，以及英國漫畫的醜化。", "fun_fact": "俗稱的「拿破崙情結」（形容矮個子愛逞強），就是從這個刻板印象而來的。", "topic": "history", "region": "世界"}, {"id": "wd-035", "category": "歷史", "difficulty": 3, "type": "choice", "question": "拿破崙最後一次戰敗的「滑鐵盧戰役」，戰場位於今天的哪個國家？", "options": ["荷蘭", "德國", "法國", "比利時"], "answer": 3, "explanation": "1815 年的滑鐵盧戰役發生在今天比利時布魯塞爾的南方，拿破崙戰敗後被流放到南大西洋的聖赫勒拿島。", "fun_fact": "從此「滑鐵盧」就成了「慘敗」的代名詞。", "topic": "history", "region": "世界"}, {"id": "wd-036", "category": "歷史", "difficulty": 3, "type": "choice", "question": "幫助學者破解古埃及象形文字的關鍵文物是什麼？", "options": ["死海古卷", "羅塞塔石碑", "納斯卡線", "圖坦卡門黃金面具"], "answer": 1, "explanation": "羅塞塔石碑上用象形文字、埃及世俗體和古希臘文刻了同一段內容，法國學者商博良在 1822 年藉此破解了象形文字。", "fun_fact": "羅塞塔石碑是 1799 年由法國士兵發現的，現在收藏在倫敦的大英博物館。", "topic": "history", "region": "世界"}, {"id": "wd-037", "category": "歷史", "difficulty": 3, "type": "choice", "question": "埃及豔后克麗奧佩脫拉七世生活的年代，距離大金字塔建成的時間，比距離人類登陸月球的時間還要近。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。古夫大金字塔約建於西元前 2560 年，克麗奧佩脫拉七世死於西元前 30 年，相距約 2,500 年；而她離 1969 年人類登月只有約 2,000 年。", "fun_fact": "對埃及豔后來說，大金字塔已經是「古蹟」了。", "topic": "history", "region": "世界"}, {"id": "wd-038", "category": "歷史", "difficulty": 3, "type": "order", "question": "請依發生時間先後，排出下列歷史事件：", "options": ["聯合國成立", "法國大革命爆發", "蘇伊士運河通航", "英國《大憲章》簽署"], "answer": [3, 1, 2, 0], "explanation": "《大憲章》1215 年 → 法國大革命 1789 年 → 蘇伊士運河 1869 年 → 聯合國 1945 年。", "fun_fact": "《大憲章》限制了國王的權力，被視為近代憲政思想的重要源頭。", "topic": "history", "region": "世界"}], "human": [{"id": "tw-011", "category": "文化", "difficulty": 1, "type": "choice", "question": "俗語「北天燈、南蜂炮」說的是哪一個節日的活動？", "options": ["中秋節", "端午節", "中元節", "元宵節"], "answer": 3, "explanation": "元宵節時，新北平溪放天燈、台南鹽水放蜂炮。", "fun_fact": "參加鹽水蜂炮要全副武裝：安全帽、口罩、厚外套一樣都不能少。", "topic": "human", "region": "台灣"}, {"id": "tw-012", "category": "文化", "difficulty": 1, "type": "choice", "question": "媽祖信仰最初主要守護的是哪一類人？", "options": ["商人", "讀書人", "農夫", "航海者與漁民"], "answer": 3, "explanation": "媽祖被視為海上守護神，保佑航海平安。", "fun_fact": "大甲媽祖遶境是台灣最有名的宗教活動之一，徒步行程長達九天八夜。", "topic": "human", "region": "台灣"}, {"id": "tw-013", "category": "文化", "difficulty": 1, "type": "choice", "question": "珍珠奶茶起源於台灣。", "options": ["對", "錯"], "answer": 0, "explanation": "珍珠奶茶在 1980 年代於台灣誕生。", "fun_fact": "到底是哪一家店發明的，台中和台南各有說法。", "topic": "human", "region": "台灣"}, {"id": "tw-014", "category": "文化", "difficulty": 2, "type": "choice", "question": "每年四、五月，客家庄常舉辦以哪一種花為主題的節慶？", "options": ["荷花", "櫻花", "油桐花", "向日葵"], "answer": 2, "explanation": "客家桐花祭在油桐花盛開的季節舉辦。", "fun_fact": "油桐花落滿地像下雪一樣，被稱為「五月雪」。", "topic": "human", "region": "台灣"}, {"id": "tw-015", "category": "文化", "difficulty": 2, "type": "choice", "question": "台語「呷飯皇帝大」的意思最接近下列哪一個？", "options": ["吃飯要有禮貌", "吃太多會變胖", "皇帝吃飯的排場最大", "吃飯最重要，什麼事都等吃完再說"], "answer": 3, "explanation": "意思是吃飯最大，再重要的事也要先讓人好好吃飯。", "fun_fact": "類似的俗語還有「食飯配菜脯，儉錢開店鋪」。", "topic": "human", "region": "台灣"}, {"id": "tw-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "蘭嶼達悟族最重要的歲時祭儀，與哪一種魚的季節洄游有關？", "options": ["鮭魚", "虱目魚", "飛魚", "鯛魚"], "answer": 2, "explanation": "每年春夏飛魚隨黑潮而來，達悟族依飛魚季節安排祭儀、捕撈與生活禁忌。", "fun_fact": "達悟族傳統的拼板舟由許多木板拼接而成，船頭常雕有象徵「船眼」的同心圓圖案。", "topic": "human", "region": "台灣"}, {"id": "tw-040", "category": "文化", "difficulty": 3, "type": "choice", "question": "每兩年舉辦一次、每十年一次大祭的「矮靈祭」，是哪一族的祭典？", "options": ["賽夏族", "阿美族", "布農族", "排灣族"], "answer": 0, "explanation": "矮靈祭（paSta'ay）是賽夏族最重要的祭典，主要在苗栗南庄與新竹五峰舉行。", "fun_fact": "相傳矮人曾教導賽夏族農耕與歌舞，後來雙方發生衝突，族人便以祭典安撫矮靈。", "topic": "human", "region": "台灣"}, {"id": "tw-041", "category": "文化", "difficulty": 2, "type": "choice", "question": "以「八部合音」（祈禱小米豐收歌）聞名的原住民族是？", "options": ["布農族", "達悟族", "魯凱族", "泰雅族"], "answer": 0, "explanation": "布農族的「祈禱小米豐收歌」（pasibutbut）以多聲部合唱著稱，俗稱八部合音。", "fun_fact": "1943 年日本學者黑澤隆朝來台調查時錄下這首歌，1952 年將錄音寄給國際民俗音樂協會，引起西方音樂學界的注意。", "topic": "human", "region": "台灣"}, {"id": "tw-042", "category": "文化", "difficulty": 3, "type": "choice", "question": "過去以「紋面」象徵成年，女子要擅長織布才能紋面的原住民族是？", "options": ["泰雅族", "阿美族", "排灣族", "達悟族"], "answer": 0, "explanation": "泰雅族傳統上男子要能狩獵、女子要會織布，才有資格紋面，象徵成年與榮耀。", "fun_fact": "除了泰雅族，太魯閣族和賽德克族也有紋面傳統。", "topic": "human", "region": "台灣"}, {"id": "tw-043", "category": "文化", "difficulty": 2, "type": "choice", "question": "台南小吃「棺材板」的外皮，是用什麼做成的？", "options": ["蛋皮", "厚片吐司", "麵餅", "米糕"], "answer": 1, "explanation": "棺材板是把厚片吐司炸酥後挖空，填入雞肉、海鮮、蔬菜等勾芡內餡，再蓋上吐司蓋。", "fun_fact": "據說它原本叫「雞肝板」，後來有位教授覺得外型像棺材，才有了這個名字。", "topic": "human", "region": "台灣"}, {"id": "tw-044", "category": "文化", "difficulty": 3, "type": "choice", "question": "客家人在農曆正月二十過「天穿日」，是紀念哪一位神話人物？", "options": ["嫦娥", "女媧", "盤古", "后羿"], "answer": 1, "explanation": "相傳女媧在這一天煉石補天，所以稱為「天穿日」。", "fun_fact": "客家委員會曾在 2010 年將天穿日訂為「全國客家日」，2022 年起改為 12 月 28 日的「還我母語運動日」。", "topic": "human", "region": "台灣"}, {"id": "tw-045", "category": "文化", "difficulty": 1, "type": "choice", "question": "台語俗諺「呷緊弄破碗」的意思是？", "options": ["動作快的人比較能幹", "吃飯時要小心拿好碗", "打破碗會帶來好運", "做事太急反而容易出錯"], "answer": 3, "explanation": "字面意思是吃太快會把碗打破，比喻做事心急反而會壞事。", "fun_fact": "意思和成語「欲速則不達」很接近。", "topic": "human", "region": "台灣"}, {"id": "tw-046", "category": "文化", "difficulty": 2, "type": "choice", "question": "民間俗稱「土地公」的神明，正式名稱是？", "options": ["開漳聖王", "福德正神", "保生大帝", "清水祖師"], "answer": 1, "explanation": "土地公的正式神號是「福德正神」，是台灣最普遍的民間信仰神明之一。", "fun_fact": "農曆二月初二土地公生是商家的「頭牙」，十二月十六的「尾牙」也是祭拜土地公的日子。", "topic": "human", "region": "台灣"}, {"id": "tw-047", "category": "文化", "difficulty": 2, "type": "choice", "question": "電視布袋戲《雲州大儒俠》的主角是誰？", "options": ["史艷文", "素還真", "楚留香", "孫悟空"], "answer": 0, "explanation": "《雲州大儒俠》由黃俊雄製作，1970 年在台視播出，主角史艷文紅遍全台。", "fun_fact": "據說當年收視率一度超過九成，播出時街上幾乎看不到人。", "topic": "human", "region": "台灣"}, {"id": "tw-048", "category": "文化", "difficulty": 2, "type": "choice", "question": "歌仔戲是在台灣發展形成的戲曲，一般認為起源於宜蘭。", "options": ["對", "錯"], "answer": 0, "explanation": "一般認為歌仔戲由宜蘭一帶的「本地歌仔」發展而來，是少數在台灣形成的傳統戲曲。", "fun_fact": "位於宜蘭五結的國立傳統藝術中心宜蘭傳藝園區，常有歌仔戲演出。", "topic": "human", "region": "台灣"}, {"id": "tw-049", "category": "文化", "difficulty": 1, "type": "choice", "question": "蚵仔煎裡的「蚵仔」指的是蛤蜊。", "options": ["對", "錯"], "answer": 1, "explanation": "蚵仔指的是牡蠣，蛤蜊在台語中則叫「蚶仔」或「粉蟯」。", "fun_fact": "蚵仔煎的粉漿主要用番薯粉調製，才會有 Q 彈的口感。", "topic": "human", "region": "台灣"}, {"id": "tw-050", "category": "文化", "difficulty": 1, "type": "choice", "question": "台灣民間的「中元普渡」是在農曆八月十五日。", "options": ["對", "錯"], "answer": 1, "explanation": "中元節是農曆七月十五日；農曆八月十五日是中秋節。", "fun_fact": "整個農曆七月俗稱「鬼月」，基隆中元祭的放水燈是很有名的活動。", "topic": "human", "region": "台灣"}, {"id": "tw-051", "category": "文化", "difficulty": 1, "type": "order", "question": "請依農曆日期先後排出這些節日：", "options": ["端午節", "元宵節", "七夕", "中秋節"], "answer": [1, 0, 2, 3], "explanation": "元宵節正月十五 → 端午節五月初五 → 七夕七月初七 → 中秋節八月十五。", "fun_fact": "台南有在七夕為滿 16 歲孩子舉辦「做十六歲」成年禮的習俗。", "topic": "human", "region": "台灣"}, {"id": "cn-005", "category": "文化", "difficulty": 1, "type": "choice", "question": "下列哪一項「不是」中國古代的四大發明？", "options": ["指南針", "火藥", "造紙術", "地動儀"], "answer": 3, "explanation": "四大發明是造紙術、印刷術、火藥和指南針。", "fun_fact": "地動儀是東漢張衡發明的，用來偵測地震的方位。", "topic": "human", "region": "中國"}, {"id": "cn-006", "category": "文化", "difficulty": 1, "type": "choice", "question": "傳說端午節是為了紀念哪一位人物？", "options": ["屈原", "岳飛", "孔子", "諸葛亮"], "answer": 0, "explanation": "一般流傳端午節是紀念戰國時代楚國的屈原。", "fun_fact": "包粽子、划龍舟，據說都是為了不讓魚蝦吃掉屈原。", "topic": "human", "region": "中國"}, {"id": "cn-007", "category": "文化", "difficulty": 1, "type": "choice", "question": "十二生肖中排第一的是？", "options": ["鼠", "虎", "龍", "牛"], "answer": 0, "explanation": "十二生肖依序為鼠、牛、虎、兔、龍、蛇、馬、羊、猴、雞、狗、豬。", "fun_fact": "傳說老鼠騎在牛背上，在終點前一跳就搶到了第一名。", "topic": "human", "region": "中國"}, {"id": "cn-008", "category": "文化", "difficulty": 2, "type": "choice", "question": "京劇臉譜中，紅色臉通常代表什麼性格？", "options": ["忠勇正直", "滑稽搞笑", "兇猛暴躁", "陰險狡詐"], "answer": 0, "explanation": "紅臉象徵忠勇正直。", "fun_fact": "最有名的紅臉就是關公；白臉則常用來表示奸詐，例如曹操。", "topic": "human", "region": "中國"}, {"id": "cn-009", "category": "文化", "difficulty": 2, "type": "choice", "question": "「學而時習之，不亦說乎」出自哪一部經典？", "options": ["孟子", "道德經", "大學", "論語"], "answer": 3, "explanation": "這句話是《論語》的第一句。", "fun_fact": "這裡的「說」讀作「悅」，意思是快樂。", "topic": "human", "region": "中國"}, {"id": "cn-010", "category": "文化", "difficulty": 2, "type": "choice", "question": "一般認為《西遊記》的作者是誰？", "options": ["羅貫中", "曹雪芹", "吳承恩", "施耐庵"], "answer": 2, "explanation": "《西遊記》一般認為是明代吳承恩所作。", "fun_fact": "唐僧的原型是唐代真實存在的高僧玄奘。", "topic": "human", "region": "中國"}, {"id": "cn-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "在北半球，二十四節氣中白天最長的是哪一個？", "options": ["立夏", "春分", "冬至", "夏至"], "answer": 3, "explanation": "夏至時太陽直射北回歸線，北半球白天最長；冬至則是白天最短。", "fun_fact": "北回歸線通過台灣的嘉義和花蓮，夏至正午時太陽幾乎就在頭頂正上方。", "topic": "human", "region": "中國"}, {"id": "cn-040", "category": "文化", "difficulty": 3, "type": "choice", "question": "二十四節氣是根據月亮的圓缺（陰曆）制定的。", "options": ["對", "錯"], "answer": 1, "explanation": "二十四節氣是依太陽在黃道上的位置劃分的，其實屬於陽曆系統。", "fun_fact": "所以節氣在國曆上的日期幾乎固定，例如清明大多落在 4 月 4 日或 5 日。", "topic": "human", "region": "中國"}, {"id": "cn-041", "category": "文化", "difficulty": 1, "type": "choice", "question": "「麻婆豆腐」屬於哪一個菜系？", "options": ["魯菜", "粵菜", "淮揚菜", "川菜"], "answer": 3, "explanation": "麻婆豆腐是四川名菜，以花椒的「麻」和辣椒的「辣」為特色。", "fun_fact": "相傳這道菜出自清代成都一家小飯館的老闆娘，因她臉上有麻子，人稱「陳麻婆」。", "topic": "human", "region": "中國"}, {"id": "cn-042", "category": "文化", "difficulty": 1, "type": "choice", "question": "名菜「東坡肉」相傳與哪位文人有關？", "options": ["蘇軾", "李白", "白居易", "杜甫"], "answer": 0, "explanation": "蘇軾號東坡居士，相傳他愛吃燉豬肉，東坡肉因此得名。", "fun_fact": "蘇軾還寫過〈豬肉頌〉：「淨洗鐺，少著水，柴頭罨煙焰不起。待他自熟莫催他，火候足時他自美。」", "topic": "human", "region": "中國"}, {"id": "cn-043", "category": "文化", "difficulty": 2, "type": "choice", "question": "京劇角色分為「生、旦、淨、丑」，其中「旦」指的是？", "options": ["丑角", "女性角色", "畫臉譜的花臉", "老年男性"], "answer": 1, "explanation": "「旦」是京劇中的女性角色；生是男性，淨是花臉，丑是丑角。", "fun_fact": "早期京劇的旦角多由男性演員扮演，梅蘭芳就是著名的男旦。", "topic": "human", "region": "中國"}, {"id": "cn-044", "category": "文化", "difficulty": 2, "type": "choice", "question": "被尊為「書聖」，寫下《蘭亭集序》的書法家是？", "options": ["柳公權", "王羲之", "顏真卿", "蘇軾"], "answer": 1, "explanation": "東晉王羲之的行書《蘭亭集序》被譽為「天下第一行書」。", "fun_fact": "相傳《蘭亭集序》真跡被唐太宗帶進陵墓陪葬，今日所見都是摹本。", "topic": "human", "region": "中國"}, {"id": "cn-045", "category": "文化", "difficulty": 1, "type": "choice", "question": "《三國演義》中「桃園三結義」的三個人，不包括誰？", "options": ["張飛", "趙雲", "關羽", "劉備"], "answer": 1, "explanation": "桃園三結義是劉備、關羽、張飛三人結為兄弟。", "fun_fact": "「桃園結義」是小說情節，正史《三國志》並沒有這段記載。", "topic": "human", "region": "中國"}, {"id": "cn-046", "category": "文化", "difficulty": 1, "type": "choice", "question": "「文房四寶」不包括下列哪一項？", "options": ["印章", "筆", "墨", "硯"], "answer": 0, "explanation": "文房四寶是筆、墨、紙、硯。", "fun_fact": "其中最有名的是湖筆、徽墨、宣紙和端硯。", "topic": "human", "region": "中國"}, {"id": "cn-047", "category": "文化", "difficulty": 2, "type": "choice", "question": "成語「朝三暮四」的典故中，被騙的是哪種動物？", "options": ["羊", "猴子", "雞", "馬"], "answer": 1, "explanation": "《莊子．齊物論》記載養猴人說早上給三份、晚上給四份橡實，猴子大怒；改成早上四份、晚上三份，猴子就高興了。", "fun_fact": "這個成語原本是指用手段欺騙人，後來才多用來形容反覆無常。", "topic": "human", "region": "中國"}, {"id": "cn-048", "category": "文化", "difficulty": 3, "type": "choice", "question": "傳說「寒食節」禁火吃冷食，是為了紀念哪位人物？", "options": ["晉文公", "屈原", "伍子胥", "介之推"], "answer": 3, "explanation": "相傳晉文公放火燒山想逼介之推出來做官，介之推卻抱樹而死，於是訂下這天禁火。", "fun_fact": "寒食節就在清明前一兩天，後來習俗逐漸和清明節合併。", "topic": "human", "region": "中國"}, {"id": "cn-049", "category": "文化", "difficulty": 1, "type": "choice", "question": "民間傳說中，過年貼春聯、放鞭炮，是為了嚇跑怕紅色和巨響的「年獸」。", "options": ["對", "錯"], "answer": 0, "explanation": "相傳年獸會在除夕出來傷人，但牠害怕紅色、火光和聲響，人們就用這些方法驅趕牠。", "fun_fact": "民間也有一說，「過年」的意思就是平安度過年獸這一關。", "topic": "human", "region": "中國"}, {"id": "wd-013", "category": "文化", "difficulty": 1, "type": "choice", "question": "奧運五環象徵的是什麼？", "options": ["五種美德", "五種運動", "五大洲的團結", "五個創始國"], "answer": 2, "explanation": "五環代表五大洲的團結與相聚。", "fun_fact": "據創辦人顧拜旦的說法，五環的五種顏色加上白色底，可以組出當時所有參賽國國旗上的顏色。", "topic": "human", "region": "世界"}, {"id": "wd-014", "category": "文化", "difficulty": 2, "type": "choice", "question": "依聯合國估計，印度的人口已經超越中國，成為世界第一。", "options": ["對", "錯"], "answer": 0, "explanation": "聯合國估計印度人口在 2023 年超越中國。", "fun_fact": "這是自有人口統計以來，中國第一次不是世界人口最多的國家。", "topic": "human", "region": "世界"}, {"id": "wd-015", "category": "文化", "difficulty": 3, "type": "choice", "question": "「相對論」是由哪一位科學家提出的？", "options": ["霍金", "牛頓", "愛因斯坦", "居禮夫人"], "answer": 2, "explanation": "愛因斯坦在 1905 年提出狹義相對論，1915 年提出廣義相對論。", "fun_fact": "愛因斯坦的諾貝爾獎其實是因為「光電效應」，不是相對論。", "topic": "human", "region": "世界"}, {"id": "wd-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "以互丟番茄聞名的「番茄大戰」節慶，是在哪個國家舉行？", "options": ["西班牙", "葡萄牙", "墨西哥", "義大利"], "answer": 0, "explanation": "番茄大戰（La Tomatina）每年 8 月最後一個星期三，在西班牙瓦倫西亞地區的小鎮布尼奧爾舉行。", "fun_fact": "為了安全，規定參加者丟番茄前要先把番茄捏爛，免得砸傷人。", "topic": "human", "region": "世界"}, {"id": "wd-040", "category": "文化", "difficulty": 1, "type": "choice", "question": "迪士尼皮克斯電影《可可夜總會》的故事背景，是哪個國家的「亡靈節」？", "options": ["西班牙", "墨西哥", "秘魯", "巴西"], "answer": 1, "explanation": "亡靈節是墨西哥的傳統節日，人們在 11 月初布置祭壇，迎接過世親人的靈魂回家團聚。", "fun_fact": "亡靈節常用橘色的萬壽菊裝飾，相傳花的顏色和香氣能為亡靈指引回家的路。", "topic": "human", "region": "世界"}, {"id": "wd-041", "category": "文化", "difficulty": 1, "type": "choice", "question": "名畫《星夜》是哪一位畫家的作品？", "options": ["畢卡索", "雷諾瓦", "莫內", "梵谷"], "answer": 3, "explanation": "《星夜》是荷蘭畫家梵谷在 1889 年的作品，現藏於紐約現代藝術博物館。", "fun_fact": "梵谷畫這幅畫時住在法國聖雷米的療養院，畫的是他從房間窗戶望出去的景色（再加上想像）。", "topic": "human", "region": "世界"}, {"id": "wd-042", "category": "文化", "difficulty": 1, "type": "choice", "question": "馬拉松全程的標準距離是多少公里？", "options": ["40 公里", "45 公里", "42.195 公里", "50 公里"], "answer": 2, "explanation": "馬拉松全程的標準距離是 42.195 公里。", "fun_fact": "這個有零有整的數字，一般認為來自 1908 年倫敦奧運，為了讓終點落在王室包廂前而定下的路線長度。", "topic": "human", "region": "世界"}, {"id": "wd-043", "category": "文化", "difficulty": 1, "type": "choice", "question": "泰國的「潑水節」（宋干節）是在慶祝什麼？", "options": ["國王生日", "雨季開始", "稻米豐收", "傳統新年"], "answer":
