answer": 0, "explanation": "阿蘇山的巨大破火山口東西約 18 公里、南北約 25 公里，內部還有城鎮與鐵路。", "fun_fact": ""}, {"id": "geo-EA-035", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "隔著錦江灣與鹿兒島市區相望、經常噴發落灰的活火山是哪一座？", "options": ["雲仙岳", "櫻島", "有珠山", "淺間山"], "answer": 1, "explanation": "櫻島原本是離島，1914 年大噴發後與大隅半島相連，至今仍頻繁噴發。", "fun_fact": ""}, {"id": "geo-EA-036", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "朝鮮半島西側所面對的海域是哪一個？", "options": ["黃海", "日本海", "東海（東中國海）", "鄂霍次克海"], "answer": 0, "explanation": "朝鮮半島西臨黃海、東臨日本海（韓國稱東海）、南接朝鮮海峽。", "fun_fact": ""}, {"id": "geo-EA-037", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "流經南韓首都首爾市區、把城市分成江南與江北的河川是哪一條？", "options": ["洛東江", "錦江", "大同江", "漢江"], "answer": 3, "explanation": "漢江橫貫首爾後向西注入黃海，江南、江北的說法就是以漢江為界。", "fun_fact": ""}, {"id": "geo-EA-038", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "南韓面積最大的島嶼，同時也是著名度假勝地的是哪一座？", "options": ["鬱陵島", "濟州島", "江華島", "巨濟島"], "answer": 1, "explanation": "濟州島是火山島，島上的漢拏山與熔岩洞窟群已列入世界自然遺產。", "fun_fact": ""}, {"id": "geo-EA-039", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "南韓境內的最高峰是下列哪一座山？", "options": ["智異山", "雪嶽山", "漢拏山", "太白山"], "answer": 2, "explanation": "漢拏山位於濟州島，標高約 1,947 公尺，是一座盾狀火山。", "fun_fact": ""}, {"id": "geo-EA-040", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "整個朝鮮半島的最高峰、被視為聖山的是哪一座？", "options": ["漢拏山", "金剛山", "白頭山", "妙香山"], "answer": 2, "explanation": "白頭山（中國稱長白山）標高約 2,744 公尺，坐落在北韓與中國的邊界上。", "fun_fact": ""}, {"id": "geo-EA-041", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "朝鮮半島最高峰的山頂有一座著名的火山口湖，它叫什麼？", "options": ["天池", "鏡泊湖", "青海湖", "華清池"], "answer": 0, "explanation": "這座火山口湖水深數百公尺，一半屬中國、一半屬北韓；湖水經二道白河外流，是松花江的源頭，白頭山山體則同時是鴨綠江與圖們江的發源地。", "fun_fact": ""}, {"id": "geo-EA-042", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "劃分南北韓的非軍事區（DMZ），沿軍事分界線南北各退多少距離？", "options": ["各約 5 公里，總寬約 10 公里", "各約 1 公里，總寬約 2 公里", "各約 20 公里，總寬約 40 公里", "各約 2 公里，總寬約 4 公里"], "answer": 3, "explanation": "非軍事區長約 250 公里、寬約 4 公里，而且它並非完全沿著北緯 38 度線走。", "fun_fact": ""}, {"id": "geo-EA-043", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "南北韓舉行會談、著名的「共同警備區」所在的板門店，位於下列何處？", "options": ["非軍事區西段、靠近首爾一側", "非軍事區東段、靠近日本海一側", "北韓首都平壤市郊", "南韓釜山近郊的港口"], "answer": 0, "explanation": "板門店位於非軍事區靠西邊的位置，距離首爾不到六十公里。", "fun_fact": ""}, {"id": "geo-EA-044", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "完全位於南韓境內、長度最長的河川是哪一條？", "options": ["漢江", "鴨綠江", "豆滿江", "洛東江"], "answer": 3, "explanation": "洛東江縱貫嶺南地區、在釜山附近注入大海；鴨綠江與豆滿江則在北韓邊界上。", "fun_fact": ""}, {"id": "geo-EA-045", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "南韓為分散首都圈機能，把多個中央行政機關遷往哪一座計畫新市？", "options": ["仁川廣域市", "世宗特別自治市", "大田廣域市", "水原市"], "answer": 1, "explanation": "世宗市以朝鮮世宗大王命名，是專為承接中央行政機關而興建的計畫城市。", "fun_fact": ""}, {"id": "geo-EA-046", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "北韓首都平壤，坐落在哪一條河的兩岸？", "options": ["漢江", "鴨綠江", "清川江", "大同江"], "answer": 3, "explanation": "大同江貫穿平壤市區後注入黃海，是北韓西部的重要河川。", "fun_fact": ""}, {"id": "geo-EA-047", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "蒙古國是內陸國，它只與哪兩個國家接壤？", "options": ["中國與哈薩克", "俄羅斯與中國", "俄羅斯與哈薩克", "中國與吉爾吉斯"], "answer": 1, "explanation": "蒙古北接俄羅斯、南接中國，沒有其他鄰國，也完全沒有海岸線。", "fun_fact": ""}, {"id": "geo-EA-048", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "以國土面積計算，蒙古是世界第幾大的內陸國？", "options": ["最大的內陸國", "第三大，僅次於哈薩克與查德", "第二大，僅次於哈薩克", "第五大"], "answer": 2, "explanation": "哈薩克是世界最大的內陸國，蒙古居次。", "fun_fact": ""}, {"id": "geo-EA-049", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "橫跨蒙古南部與中國北部的大沙漠叫什麼名字？", "options": ["塔克拉瑪干沙漠", "卡拉庫姆沙漠", "戈壁沙漠", "柴達木盆地"], "answer": 2, "explanation": "戈壁沙漠橫跨蒙古南部與中國內蒙古一帶；塔克拉瑪干則位於中國新疆。", "fun_fact": ""}, {"id": "geo-EA-050", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "戈壁沙漠在氣候上的一大特色是什麼？", "options": ["屬於冬季嚴寒、會結冰下雪的寒漠", "全年高溫、幾乎不見霜雪", "雨量豐沛、季節性積水成湖", "位於赤道附近、日夜溫差極小"], "answer": 0, "explanation": "戈壁緯度高、海拔也高，冬季氣溫可降到攝氏零下三十度以下，是典型的寒漠。", "fun_fact": ""}, {"id": "geo-EA-051", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "蒙古西部與中國、俄羅斯交界一帶，聳立著哪一座大山脈？", "options": ["興安嶺", "天山山脈", "崑崙山脈", "阿爾泰山脈"], "answer": 3, "explanation": "阿爾泰山脈橫跨蒙古西部，蒙古最高峰就在這條山脈上；東部則以草原和戈壁為主。", "fun_fact": ""}, {"id": "geo-EA-052", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "烏蘭巴托常被稱為「世界上最冷的首都」，它坐落在哪一條河的河谷？", "options": ["圖拉河", "色楞格河", "鄂爾渾河", "克魯倫河"], "answer": 0, "explanation": "烏蘭巴托位於圖拉河河谷、四周群山環抱，年均溫僅約攝氏零度。", "fun_fact": ""}, {"id": "geo-EA-053", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "「烏蘭巴托」這個城市名稱在蒙古語中是什麼意思？", "options": ["草原之心", "紅色英雄", "金色宮帳", "永恆蒼天"], "answer": 1, "explanation": "1924 年蒙古人民共和國成立後，首都改名為烏蘭巴托，意為「紅色英雄」。", "fun_fact": ""}, {"id": "wd-007", "category": "地理", "difficulty": 2, "type": "choice", "question": "「盧比」是下列哪個國家的貨幣？", "options": ["泰國", "越南", "印度", "韓國"], "answer": 2, "explanation": "印度的貨幣是盧比。泰國是泰銖，越南是越南盾，韓國是韓元。", "fun_fact": "巴基斯坦、尼泊爾、斯里蘭卡的貨幣也叫盧比。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-018", "category": "地理", "difficulty": 1, "type": "choice", "question": "著名的古蹟「吳哥窟」位於哪個國家？", "options": ["泰國", "柬埔寨", "越南", "寮國"], "answer": 1, "explanation": "吳哥窟位於柬埔寨暹粒附近，是 12 世紀高棉帝國興建的寺廟。", "fun_fact": "吳哥窟的圖案就畫在柬埔寨的國旗上。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-022", "category": "地理", "difficulty": 2, "type": "choice", "question": "世界上唯一一面「不是四邊形」的國旗，屬於哪個國家？", "options": ["梵蒂岡", "瑞士", "尼泊爾", "不丹"], "answer": 2, "explanation": "尼泊爾國旗是由兩個上下相疊的三角形組成，是全世界唯一不是長方形或正方形的國旗。瑞士和梵蒂岡的國旗是正方形。", "fun_fact": "尼泊爾國旗上方畫著月亮、下方畫著太陽。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-051", "category": "地理", "difficulty": 1, "type": "choice", "question": "越南的首都是哪一座城市？", "options": ["胡志明市", "峴港", "河內", "順化"], "answer": 2, "explanation": "越南的首都是位於北部的河內；胡志明市（舊稱西貢）雖然是越南人口最多的城市，但並不是首都。", "fun_fact": "河內的越南文「Hà Nội」意思是「河之內」，因為這座城市位在紅河的河灣之中。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-052", "category": "地理", "difficulty": 1, "type": "choice", "question": "東南亞國家中，唯一沒有海岸線的內陸國是哪一國？", "options": ["緬甸", "柬埔寨", "寮國", "越南"], "answer": 2, "explanation": "寮國被中國、越南、柬埔寨、泰國、緬甸五國包圍，是東南亞唯一的內陸國。", "fun_fact": "雖然沒有海，湄公河卻流經寮國大半國土，是當地重要的交通與漁業命脈。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-053", "category": "地理", "difficulty": 1, "type": "choice", "question": "著名的「國油雙峰塔」（Petronas Twin Towers）位於哪一座城市？", "options": ["雅加達", "吉隆坡", "曼谷", "新加坡"], "answer": 1, "explanation": "國油雙峰塔位於馬來西亞首都吉隆坡，1998 年完工，高約 452 公尺。", "fun_fact": "兩座塔之間在 41 至 42 樓有一座「空中天橋」相連，是遊客必訪的觀景點。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-057", "category": "地理", "difficulty": 2, "type": "choice", "question": "緬甸目前的首都是哪一座城市？", "options": ["蒲甘", "仰光", "奈比多", "曼德勒"], "answer": 2, "explanation": "緬甸在 2005 年開始把首都從仰光遷往新建的奈比多，並於 2006 年正式宣布。仰光仍是緬甸最大的城市。", "fun_fact": "奈比多的道路寬敞，有些主要大道寬達 20 線道，但車流稀少，常被形容為「空城」。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-065", "category": "地理", "difficulty": 3, "type": "choice", "question": "印度全國使用同一個標準時間，它比國際標準時間（UTC）快多少？", "options": ["4 小時 30 分", "5 小時", "5 小時 30 分", "6 小時"], "answer": 2, "explanation": "印度標準時間是 UTC+5:30，比台灣（UTC+8）慢 2 小時 30 分。", "fun_fact": "鄰國尼泊爾更特別，使用 UTC+5:45，時差會出現「45 分」這種零頭。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "wd-067", "category": "地理", "difficulty": 2, "type": "choice", "question": "赤道通過新加坡。", "options": ["對", "錯"], "answer": 1, "explanation": "錯誤。新加坡大約位於北緯 1 度，雖然非常接近赤道，但赤道其實從它南方的印尼通過。", "fun_fact": "新加坡距離赤道只有約140公里，所以一年四季都很炎熱，白天的長度全年也都在12小時左右。", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "geo-SEA-001", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "麻六甲海峽主要分隔馬來半島與下列哪一座島嶼？", "options": ["爪哇島", "蘇門答臘島", "峇里島", "蘇拉威西島"], "answer": 1, "explanation": "麻六甲海峽夾在馬來半島與印尼的蘇門答臘島之間，是連接印度洋與南海的關鍵航道。", "fun_fact": ""}, {"id": "geo-SEA-002", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1883 年劇烈噴發的喀拉喀托火山，位於分隔爪哇島與蘇門答臘島的哪一條海峽？", "options": ["麻六甲海峽", "巽他海峽", "龍目海峽", "望加錫海峽"], "answer": 1, "explanation": "喀拉喀托火山島座落於巽他海峽中，該海峽正好把爪哇島與蘇門答臘島分開。", "fun_fact": ""}, {"id": "geo-SEA-003", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "泰國的首都是哪一座城市？", "options": ["金邊", "仰光", "永珍", "曼谷"], "answer": 3, "explanation": "曼谷是泰國的首都與最大城市，位於昭披耶河下游的平原上。", "fun_fact": ""}, {"id": "geo-SEA-004", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "1815 年大噴發、造成隔年北半球出現「無夏之年」的坦博拉火山，位於印尼哪一座島？", "options": ["爪哇島", "峇里島", "龍目島", "松巴哇島"], "answer": 3, "explanation": "坦博拉火山位於小巽他群島中的松巴哇島，那次噴發把大量火山灰送入平流層，使全球氣溫明顯下降。", "fun_fact": ""}, {"id": "geo-SEA-005", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "世界最高峰聖母峰（珠穆朗瑪峰）位於中國與哪一個國家的邊界上？", "options": ["尼泊爾", "不丹", "印度", "巴基斯坦"], "answer": 0, "explanation": "聖母峰坐落在喜馬拉雅山脈上，山脊線正是中國與尼泊爾的國界。", "fun_fact": ""}, {"id": "geo-SEA-006", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "世界第二高峰 K2 屬於下列哪一座山脈？", "options": ["喜馬拉雅山脈", "興都庫什山脈", "喀喇崑崙山脈", "阿爾卑斯山脈"], "answer": 2, "explanation": "K2 位於喀喇崑崙山脈，不屬於喜馬拉雅山脈，它橫跨巴基斯坦與中國邊界。", "fun_fact": ""}, {"id": "geo-SEA-007", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "著名的「湄公河三角洲」位於下列哪一個國家境內？", "options": ["柬埔寨", "泰國", "越南", "寮國"], "answer": 2, "explanation": "湄公河在越南南部分流入海，形成廣大的湄公河三角洲，是越南最重要的稻米產區。", "fun_fact": ""}, {"id": "geo-SEA-008", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "寮國首都永珍座落在哪一條大河的河畔？", "options": ["紅河", "昭披耶河", "薩爾溫江", "湄公河"], "answer": 3, "explanation": "永珍緊臨湄公河，河道同時是寮國與泰國之間的一段國界。", "fun_fact": ""}, {"id": "geo-SEA-009", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "湄公河從源頭到出海口，總共流經幾個國家？", "options": ["三個", "四個", "六個", "九個"], "answer": 2, "explanation": "湄公河發源於中國青藏高原，依序流經中國、緬甸、寮國、泰國、柬埔寨與越南，共六國。", "fun_fact": ""}, {"id": "geo-SEA-010", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "菲律賓的首都馬尼拉位於哪一座島嶼上？", "options": ["呂宋島", "民答那峨島", "宿霧島", "巴拉望島"], "answer": 0, "explanation": "馬尼拉位於菲律賓北部最大島呂宋島的西岸，面向馬尼拉灣。", "fun_fact": ""}, {"id": "geo-SEA-011", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "伊洛瓦底江是下列哪一個國家最重要的河川？", "options": ["泰國", "越南", "柬埔寨", "緬甸"], "answer": 3, "explanation": "伊洛瓦底江自北向南縱貫緬甸，是該國的交通與農業命脈。", "fun_fact": ""}, {"id": "geo-SEA-012", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "觀光勝地峇里島屬於下列哪一個國家？", "options": ["馬來西亞", "菲律賓", "汶萊", "印尼"], "answer": 3, "explanation": "峇里島是印尼的一個省，位於爪哇島東側，以印度教文化與梯田景觀聞名。", "fun_fact": ""}, {"id": "geo-SEA-013", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "布拉馬普特拉河在中國西藏境內被稱為什麼？", "options": ["雅魯藏布江", "瀾滄江", "怒江", "金沙江"], "answer": 0, "explanation": "這條河在西藏叫雅魯藏布江，進入印度後改稱布拉馬普特拉河，最後在南亞注入孟加拉灣。", "fun_fact": ""}, {"id": "geo-SEA-014", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "恆河下游主要流經印度與哪一個國家後注入孟加拉灣？", "options": ["尼泊爾", "孟加拉", "緬甸", "斯里蘭卡"], "answer": 1, "explanation": "恆河離開印度後進入孟加拉，與其他大河會合形成廣大的三角洲再入海。", "fun_fact": ""}, {"id": "geo-SEA-015", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "世界最大的紅樹林濕地「孫德爾本斯」，位於哪一（組）河川的三角洲上？", "options": ["印度河", "恆河—布拉馬普特拉河", "伊洛瓦底江", "湄公河"], "answer": 1, "explanation": "孫德爾本斯橫跨印度與孟加拉，坐落在恆河與布拉馬普特拉河共同堆積出的三角洲濱海地帶。", "fun_fact": ""}, {"id": "geo-SEA-016", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "以海上林立的石灰岩島嶼聞名的「下龍灣」位於哪一個國家？", "options": ["泰國", "越南", "菲律賓", "印尼"], "answer": 1, "explanation": "下龍灣在越南北部的北部灣一帶，數千座喀斯特石灰岩島礁構成獨特海上地景。", "fun_fact": ""}, {"id": "geo-SEA-017", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "汶萊的國土被馬來西亞哪一州從中分隔成互不相連的兩塊？", "options": ["沙巴州", "砂拉越州", "柔佛州", "檳城州"], "answer": 1, "explanation": "汶萊四周被馬來西亞的砂拉越州包圍，砂拉越的林夢一帶把汶萊切成東西兩塊。", "fun_fact": ""}, {"id": "geo-SEA-018", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "婆羅洲（加里曼丹島）由三個國家分割統治，下列哪一國「不」在其中？", "options": ["汶萊", "馬來西亞", "菲律賓", "印尼"], "answer": 2, "explanation": "婆羅洲由汶萊、馬來西亞與印尼三國共同分割，菲律賓並未占有這座島。", "fun_fact": ""}, {"id": "geo-SEA-019", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "分隔印度南端與斯里蘭卡的海峽是？", "options": ["荷莫茲海峽", "曼德海峽", "保克海峽", "巽他海峽"], "answer": 2, "explanation": "保克海峽位於印度半島南端與斯里蘭卡之間，水淺而多沙洲。", "fun_fact": ""}, {"id": "geo-SEA-020", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "東南亞十一國中，唯一的「城市國家」是？", "options": ["汶萊", "東帝汶", "馬來西亞", "新加坡"], "answer": 3, "explanation": "新加坡的國土幾乎就是一座城市與周邊小島，是典型的城市國家。", "fun_fact": ""}, {"id": "geo-SEA-021", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "新加坡與馬來半島之間那條狹窄的水道稱為？", "options": ["柔佛海峽", "麻六甲海峽", "新加坡海峽", "卡里馬塔海峽"], "answer": 0, "explanation": "柔佛海峽把新加坡島與馬來半島南端分開，兩岸之間靠長堤與大橋相連。", "fun_fact": ""}, {"id": "geo-SEA-022", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "印度河（Indus River）今日的主要河道與下游灌溉平原，絕大部分位於哪一個國家？", "options": ["印度", ": ["望加錫海峽", "卡里馬塔海峽", "龍目海峽", "巴士海峽"], "answer": 0, "explanation": "望加錫海峽把婆羅洲與蘇拉威西島分開，是印尼重要的南北向深水航道。", "fun_fact": ""}, {"id": "geo-SEA-041", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "東帝汶有一塊被印尼領土完全包圍、與本土不相連的「飛地」，它的名稱是？", "options": ["狄力", "包考", "歐庫西", "阿陶羅"], "answer": 2, "explanation": "歐庫西位於帝汶島西半部的印尼領土之中，是殖民時期邊界劃分留下的歷史產物。", "fun_fact": ""}, {"id": "geo-SEA-042", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "斯里蘭卡的行政首都、國會所在地是哪一座城市？", "options": ["可倫坡", "康提", "加勒", "斯里賈亞瓦德納普拉科特"], "answer": 3, "explanation": "斯里蘭卡把行政中心遷到可倫坡近郊的斯里賈亞瓦德納普拉科特，商業與港口機能仍留在可倫坡。", "fun_fact": ""}, {"id": "geo-SEA-043", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "以極端多雨聞名的乞拉朋吉（Cherrapunji），位於印度的哪一邦？", "options": ["喀拉拉邦", "梅加拉亞邦", "阿薩姆邦", "西孟加拉邦"], "answer": 1, "explanation": "乞拉朋吉在印度東北部的梅加拉亞邦，位於卡西丘陵迎風坡，西南季風在此被抬升而降下驚人雨量。", "fun_fact": ""}, {"id": "geo-SEA-044", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "馬來西亞的最高峰京那巴魯山（神山）位於哪一州？", "options": ["沙巴州", "砂拉越州", "彭亨州", "霹靂州"], "answer": 0, "explanation": "京那巴魯山矗立在婆羅洲北端的沙巴州，是馬來西亞境內最高的山峰。", "fun_fact": ""}, {"id": "geo-SEA-045", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "越南北部、流經河內並注入北部灣（東京灣）的主要河川是？", "options": ["湄公河", "薩爾溫江", "紅河", "珠江"], "answer": 2, "explanation": "紅河源自中國雲南，穿越越南北部的河內後注入北部灣，其沖積平原是越南北部的農業核心。", "fun_fact": ""}, {"id": "geo-SEA-046", "topic": "geo", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "地理", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "世界最深的海溝之一「菲律賓海溝」，其最深點「恩登深淵」位於哪一座大島的東側外海？", "options": ["呂宋島", "巴拉望島", "薩馬島", "民答那峨島"], "answer": 3, "explanation": "菲律賓海溝沿菲律賓群島東側延伸，最深處在民答那峨島以東外海，深度超過一萬公尺。", "fun_fact": ""}, {"id": "wd-001", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上面積最大的國家是？", "options": ["俄羅斯", "加拿大", "中國", "美國"], "answer": 0, "explanation": "俄羅斯面積約 1,700 萬平方公里，是世界最大的國家。", "fun_fact": "俄羅斯橫跨 11 個時區。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-004", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上面積最小的國家是？", "options": ["梵蒂岡", "摩納哥", "新加坡", "列支敦斯登"], "answer": 0, "explanation": "梵蒂岡面積不到半平方公里。", "fun_fact": "梵蒂岡的國土被義大利首都羅馬整個包圍。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-020", "category": "地理", "difficulty": 2, "type": "choice", "question": "世界上最深的湖泊是哪一個？", "options": ["蘇必略湖", "貝加爾湖", "維多利亞湖", "裏海"], "answer": 1, "explanation": "位於俄羅斯西伯利亞的貝加爾湖最深約 1,642 公尺，是世界最深的湖泊。", "fun_fact": "貝加爾湖儲存了全世界地表未結冰淡水的約兩成。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-021", "category": "地理", "difficulty": 2, "type": "choice", "question": "「直布羅陀海峽」隔開了哪兩個洲？", "options": ["北美洲與南美洲", "歐洲與非洲", "亞洲與非洲", "歐洲與亞洲"], "answer": 1, "explanation": "直布羅陀海峽位於西班牙與摩洛哥之間，是地中海通往大西洋的出口，也分隔了歐洲與非洲。", "fun_fact": "海峽最窄處只有約 14 公里，天氣好時可以從歐洲望見非洲。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-054", "category": "地理", "difficulty": 1, "type": "choice", "question": "以壯麗的「峽灣」地形聞名，有蓋倫格峽灣等世界遺產的北歐國家是？", "options": ["比利時", "荷蘭", "芬蘭", "挪威"], "answer": 3, "explanation": "峽灣是冰河侵蝕出的深谷被海水淹沒而成，挪威西海岸的峽灣最具代表性，蓋倫格峽灣與納柔依峽灣在 2005 年列入世界遺產。", "fun_fact": "芬蘭則以湖泊眾多聞名，被稱為「千湖之國」。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-059", "category": "地理", "difficulty": 2, "type": "choice", "question": "土耳其的伊斯坦堡被一條海峽分成「歐洲區」和「亞洲區」，這條海峽是？", "options": ["荷莫茲海峽", "麻六甲海峽", "達達尼爾海峽", "博斯普魯斯海峽"], "answer": 3, "explanation": "博斯普魯斯海峽連接黑海與馬爾馬拉海，把伊斯坦堡分成歐洲、亞洲兩岸，因此伊斯坦堡是一座橫跨兩大洲的城市。", "fun_fact": "住在伊斯坦堡的人，可能每天搭渡輪或走跨海大橋，在歐洲和亞洲之間通勤上班。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-061", "category": "地理", "difficulty": 2, "type": "choice", "question": "多瑙河流經多個國家的首都，下列哪一座首都「沒有」多瑙河流過？", "options": ["布拉格", "貝爾格勒", "布達佩斯", "維也納"], "answer": 0, "explanation": "捷克首都布拉格位在伏爾塔瓦河畔；維也納、布達佩斯、貝爾格勒則都有多瑙河流經。", "fun_fact": "多瑙河流經的首都還有斯洛伐克的布拉提斯拉瓦，是世界上流經最多國家首都的河流。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-062", "category": "地理", "difficulty": 2, "type": "choice", "question": "英文中的「間歇泉」（geyser）一詞，源自哪一個國家的一處溫泉名稱？", "options": ["紐西蘭", "日本", "美國", "冰島"], "answer": 3, "explanation": "geyser 一詞來自冰島豪卡達勒谷地的「蓋歇爾」（Geysir）間歇泉，冰島文原意是「噴湧」。", "fun_fact": "蓋歇爾現在已經很少噴發，遊客多半是去看旁邊的「史托克」間歇泉，它大約每隔幾分鐘就會噴一次。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-063", "category": "地理", "difficulty": 3, "type": "choice", "question": "全世界只有兩個「雙重內陸國」（自己是內陸國，所有鄰國也都是內陸國），其中位於歐洲的是哪一國？", "options": ["列支敦斯登", "盧森堡", "聖馬利諾", "安道爾"], "answer": 0, "explanation": "列支敦斯登夾在瑞士和奧地利之間，這兩國都是內陸國，所以它是雙重內陸國；安道爾、盧森堡、聖馬利諾的鄰國都有海岸線。", "fun_fact": "另一個雙重內陸國是中亞的烏茲別克。從這兩國出發，至少要穿越兩個國家才能抵達通往大洋的海岸。", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-074", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "作為經度 0 度基準的格林威治天文台，位於哪一個國家？", "options": ["法國", "英國", "德國", "荷蘭"], "answer": 1, "explanation": "格林威治天文台位於英國倫敦，1884 年國際會議決定以通過此地的經線為本初子午線。", "fun_fact": "天文台地面上畫著一條子午線，遊客最愛站上去「一腳東半球、一腳西半球」拍照。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-077", "topic": "geo", "category": "地理", "difficulty": 3, "type": "choice", "question": "傳統上，歐洲與亞洲的分界主要以哪一條南北走向的山脈為界？", "options": ["烏拉山脈", "喀爾巴阡山脈", "阿爾卑斯山脈", "高加索山脈"], "answer": 0, "explanation": "烏拉山脈南北縱貫俄羅斯，長期被視為歐亞分界的主要標誌，往南再接烏拉河一線。", "fun_fact": "俄羅斯的葉卡捷琳堡附近立有「歐亞分界碑」，可以一腳踩一洲。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "geo-EU-001", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "阿爾卑斯山脈的最高峰是哪一座山？", "options": ["白朗峰", "馬特洪峰", "少女峰", "大格洛克納山"], "answer": 0, "explanation": "白朗峰海拔約4808公尺，是阿爾卑斯山脈的最高峰。", "fun_fact": ""}, {"id": "geo-EU-002", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "白朗峰位於哪兩個國家的交界？", "options": ["瑞士與奧地利", "義大利與瑞士", "法國與義大利", "法國與西班牙"], "answer": 2, "explanation": "白朗峰坐落在法國上薩瓦省與義大利奧斯塔谷的邊界上。", "fun_fact": ""}, {"id": "geo-EU-003", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "庇里牛斯山脈是哪兩個國家的天然邊界？", "options": ["義大利與法國", "西班牙與法國", "葡萄牙與西班牙", "瑞士與義大利"], "answer": 1, "explanation": "庇里牛斯山脈橫亙伊比利半島北緣，長期是西班牙與法國的天然界線。", "fun_fact": ""}, {"id": "geo-EU-004", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "外型如金字塔、位於瑞士與義大利邊界的名峰是？", "options": ["白朗峰", "少女峰", "大帕拉迪索峰", "馬特洪峰"], "answer": 3, "explanation": "馬特洪峰以四面錐體外形聞名，山脊正好是瑞士與義大利的國界。", "fun_fact": ""}, {"id": "geo-EU-005", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "西元79年埋沒古羅馬城市龐貝的火山是？", "options": ["埃特納火山", "維蘇威火山", "斯特龍伯利火山", "武爾卡諾火山"], "answer": 1, "explanation": "維蘇威火山在西元79年爆發，火山灰將龐貝整座城市掩埋。", "fun_fact": ""}, {"id": "geo-EU-006", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "義大利著名活火山埃特納火山位於哪一座島？", "options": ["薩丁尼亞島", "科西嘉島", "克里特島", "西西里島"], "answer": 3, "explanation": "埃特納火山位於義大利西西里島東岸，已列入世界遺產。", "fun_fact": ""}, {"id": "geo-EU-007", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "歐洲最長的河流是哪一條？", "options": ["窩瓦河", "多瑙河", "萊茵河", "第聶伯河"], "answer": 0, "explanation": "窩瓦河全長約3500公里，是歐洲最長的河流，最後注入裏海。", "fun_fact": ""}, {"id": "geo-EU-008", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "流經法國巴黎市區的河流是？", "options": ["隆河", "羅亞爾河", "塞納河", "加倫河"], "answer": 2, "explanation": "塞納河貫穿巴黎，西堤島就位於河中央。", "fun_fact": ""}, {"id": "geo-EU-009", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "多瑙河最後注入哪一個海？", "options": ["地中海", "亞得里亞海", "黑海", "波羅的海"], "answer": 2, "explanation": "多瑙河向東流，在羅馬尼亞形成三角洲後注入黑海。", "fun_fact": ""}, {"id": "geo-EU-010", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "萊茵河在荷蘭境內注入哪一個海？", "options": ["北海", "波羅的海", "挪威海", "愛爾蘭海"], "answer": 0, "explanation": "萊茵河在荷蘭與馬士河形成三角洲，最後注入北海。", "fun_fact": ""}, {"id": "geo-EU-011", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "歐洲面積最大的湖泊是哪一個？", "options": ["日內瓦湖", "奧涅加湖", "巴拉頓湖", "拉多加湖"], "answer": 3, "explanation": "拉多加湖位於俄羅斯西北部，是歐洲面積最大的淡水湖。", "fun_fact": ""}, {"id": "geo-EU-012", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "日內瓦湖是瑞士與哪一個國家共有的湖泊？", "options": ["德國", "法國", "奧地利", "義大利"], "answer": 1, "explanation": "日內瓦湖南岸屬於法國，北岸屬於瑞士。", "fun_fact": ""}, {"id": "geo-EU-013", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "歐洲面積最大的島嶼是哪一座？", "options": ["冰島", "愛爾蘭島", "西西里島", "大不列顛島"], "answer": 3, "explanation": "大不列顛島是歐洲面積最大的島嶼，也是全球第九大島。", "fun_fact": ""}, {"id": "geo-EU-014", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "拿破崙的出生地科西嘉島屬於哪一個國家？", "options": ["義大利", "法國", "西班牙", "希臘"], "answer": 1, "explanation": "科西嘉島自18世紀起由法國統治，是法國的大區之一。", "fun_fact": ""}, {"id": "geo-EU-015", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "米諾斯文明發源地克里特島屬於哪一個國家？", "options": ["土耳其", "義大利", "希臘", "賽普勒斯"], "answer": 2, "explanation": "克里特島是希臘最大的島嶼，米諾斯文明即發源於此。", "fun_fact": ""}, {"id": "geo-EU-016", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "英國由英格蘭、蘇格蘭、威爾斯與哪一部分組成？", "options": ["北愛爾蘭", "愛爾蘭共和國", "曼島", "海峽群島"], "answer": 0, "explanation": "英國全名為大不列顛暨北愛爾蘭聯合王國，由四個構成國組成。", "fun_fact": ""}, {"id": "geo-EU-017", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "北大西洋上的法羅群島是哪一個國家的自治領地？", "options": ["丹麥", "挪威", "冰島", "瑞典"], "answer": 0, "explanation": "法羅群島是丹麥王國下的自治領地，擁有自己的議會與語言。", "fun_fact": ""}, {"id": "geo-EU-018", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "瑞士的首都是哪一座城市？", "options": ["蘇黎世", "日內瓦", "伯恩", "巴塞爾"], "answer": 2, "explanation": "瑞士聯邦政府所在地是伯恩，蘇黎世與日內瓦則是經濟與國際組織重鎮。", "fun_fact": ""}, {"id": "geo-EU-019", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "荷蘭的首都是阿姆斯特丹，但政府與國會設在哪一座城市？", "options": ["鹿特丹", "海牙", "烏特勒支", "埃因霍芬"], "answer": 1, "explanation": "荷蘭憲法定阿姆斯特丹為首都，但內閣、國會與王室辦公都在海牙。", "fun_fact": ""}, {"id": "geo-EU-020", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "除了梵蒂岡，還有哪一個國家被義大利完全包圍？", "options": ["摩納哥", "安道爾", "馬爾他", "聖馬利諾"], "answer": 3, "explanation": "聖馬利諾位於義大利中北部山區，四周全被義大利國土環繞。", "fun_fact": ""}, {"id": "geo-EU-021", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "小國安道爾夾在哪兩個國家之間？", "options": ["西班牙與葡萄牙", "法國與西班牙", "法國與義大利", "義大利與瑞士"], "answer": 1, "explanation": "安道爾位於庇里牛斯山中，由法國總統與西班牙的烏赫爾主教共同擔任元首。", "fun_fact": ""}, {"id": "geo-EU-022", "topic": "geo", "unit": " , "question": "挪威、瑞典、芬蘭北部薩米人居住的地區通稱為？", "options": ["拉普蘭", "波希米亞", "西伯利亞", "加利西亞"], "answer": 0, "explanation": "拉普蘭橫跨北歐三國與俄羅斯西北部，是原住民族薩米人的傳統居地。", "fun_fact": ""}, {"id": "geo-EU-043", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "波羅的海三小國由北到南依序是？", "options": ["立陶宛、拉脫維亞、愛沙尼亞", "拉脫維亞、愛沙尼亞、立陶宛", "愛沙尼亞、立陶宛、拉脫維亞", "愛沙尼亞、拉脫維亞、立陶宛"], "answer": 3, "explanation": "由北往南依序是愛沙尼亞、拉脫維亞、立陶宛。", "fun_fact": ""}, {"id": "geo-EU-044", "topic": "geo", "unit": "EU", "unit_name": "歐洲", "category": "地理", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "一般認為的歐洲大陸最高峰厄爾布魯斯山位於哪條山脈？", "options": ["阿爾卑斯山脈", "高加索山脈", "庇里牛斯山脈", "喀爾巴阡山脈"], "answer": 1, "explanation": "厄爾布魯斯山位於俄羅斯境內的大高加索山脈，海拔5642公尺，是一座休眠火山。", "fun_fact": ""}, {"id": "wd-006", "category": "地理", "difficulty": 2, "type": "choice", "question": "古印加帝國的遺址「馬丘比丘」位於哪個國家？", "options": ["墨西哥", "巴西", "秘魯", "智利"], "answer": 2, "explanation": "馬丘比丘位於秘魯的安地斯山脈上。", "fun_fact": "直到 1911 年，它才被外界廣泛知道。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-016", "category": "地理", "difficulty": 1, "type": "choice", "question": "加拿大的首都是哪一座城市？", "options": ["多倫多", "溫哥華", "蒙特婁", "渥太華"], "answer": 3, "explanation": "加拿大的首都是渥太華，並不是人口最多的多倫多。", "fun_fact": "渥太華是在 1857 年由英國維多利亞女王選定為首都的。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-017", "category": "地理", "difficulty": 1, "type": "choice", "question": "巴拿馬運河連接了哪兩個大洋？", "options": ["大西洋與印度洋", "印度洋與北冰洋", "太平洋與印度洋", "太平洋與大西洋"], "answer": 3, "explanation": "巴拿馬運河橫越中美洲的巴拿馬地峽，讓船隻不必繞行南美洲南端就能往返太平洋與大西洋。", "fun_fact": "運河不是平的：船隻要靠一道道船閘被抬升到海拔約 26 公尺的加通湖，再降回海平面。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-024", "category": "地理", "difficulty": 2, "type": "choice", "question": "南美洲國家「厄瓜多」的國名，在西班牙文中是什麼意思？", "options": ["白銀", "高山", "赤道", "太陽"], "answer": 2, "explanation": "Ecuador 在西班牙文就是「赤道」的意思，因為赤道正好穿過這個國家。", "fun_fact": "同在南美洲的阿根廷，國名則來自拉丁文的「銀」（argentum）。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-027", "category": "地理", "difficulty": 3, "type": "choice", "question": "被稱為世界上最乾燥的非極地沙漠「阿塔卡馬沙漠」，主要位於哪個國家？", "options": ["智利", "澳洲", "墨西哥", "納米比亞"], "answer": 0, "explanation": "阿塔卡馬沙漠位於智利北部，有些測站幾十年來幾乎沒有記錄到降雨。", "fun_fact": "因為環境很像火星，美國太空總署（NASA）曾在這裡測試火星探測設備。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-055", "category": "地理", "difficulty": 1, "type": "choice", "question": "著名的「尼加拉瀑布」位於哪兩個國家的交界？", "options": ["巴西與阿根廷", "美國與墨西哥", "美國與加拿大", "尚比亞與辛巴威"], "answer": 2, "explanation": "尼加拉瀑布位於美國紐約州與加拿大安大略省交界的尼加拉河上。", "fun_fact": "尼加拉瀑布其實由三座瀑布組成：馬蹄瀑布、美國瀑布和新娘面紗瀑布，其中馬蹄瀑布大部分位於加拿大境內。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-066", "category": "地理", "difficulty": 3, "type": "choice", "question": "世界上落差最大的瀑布「天使瀑布」，位於哪個國家？", "options": ["巴西", "哥倫比亞", "秘魯", "委內瑞拉"], "answer": 3, "explanation": "天使瀑布位於南美洲委內瑞拉的卡奈馬國家公園，落差約 979 公尺。", "fun_fact": "天使瀑布的名字不是來自天使，而是紀念 1930 年代飛越瀑布的美國飛行員吉米．安傑爾（Jimmie Angel）。", "topic": "geo", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-071", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上面積最大的熱帶雨林「亞馬遜雨林」，主要分布在哪個國家？", "options": ["印尼", "剛果", "秘魯", "巴西"], "answer": 3, "explanation": "亞馬遜雨林橫跨南美洲多國，但超過半數面積位於巴西境內。", "fun_fact": "亞馬遜雨林常被稱為「地球之肺」，不過它產生的氧氣大多也被森林自己消耗掉。", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-072", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界上面積最大的島嶼是哪一個？", "options": ["新幾內亞", "格陵蘭", "婆羅洲", "馬達加斯加"], "answer": 1, "explanation": "格陵蘭面積約 216 萬平方公里，是世界最大島；澳洲更大，但被歸類為大陸而非島嶼。", "fun_fact": "格陵蘭在地理上屬於北美洲，政治上卻是丹麥王國的自治領地。", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "geo-AM-001", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "五大湖中，唯一完全位於美國境內的是哪一座湖？", "options": ["蘇必略湖", "休倫湖", "密西根湖", "伊利湖"], "answer": 2, "explanation": "其餘四座五大湖都有一部分屬於加拿大，只有密西根湖全部在美國境內。", "fun_fact": "它也是世界上完全位於單一國家內、面積最大的湖泊。"}, {"id": "geo-AM-002", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 1, "type": "choice", "question": "五大湖中面積最大的是哪一座湖？", "options": ["蘇必略湖", "密西根湖", "休倫湖", "安大略湖"], "answer": 0, "explanation": "蘇必略湖水面約三萬一千平方英里，是五大湖中最大也最深的一座。", "fun_fact": ""}, {"id": "geo-AM-003", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "北美洲最高峰位於美國的哪一州？", "options": ["科羅拉多州", "華盛頓州", "蒙大拿州", "阿拉斯加州"], "answer": 3, "explanation": "北美最高峰高逾六千公尺，聳立於阿拉斯加州內陸的阿拉斯加山脈。", "fun_fact": ""}, {"id": "geo-AM-004", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 1, "type": "choice", "question": "分隔美國阿拉斯加與俄羅斯的海峽是哪一條？", "options": ["戴維斯海峽", "白令海峽", "丹麥海峽", "哈德遜海峽"], "answer": 1, "explanation": "白令海峽把阿拉斯加的蘇華德半島與俄羅斯的楚科奇半島隔開，並連通太平洋與北冰洋。", "fun_fact": ""}, {"id": "geo-AM-005", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "美國本土四十八州中，面積最大的是哪一州？", "options": ["德克薩斯州", "加利福尼亞州", "蒙大拿州", "新墨西哥州"], "answer": 0, "explanation": "扣除不相連的阿拉斯加後，德克薩斯州是美國本土面積最大的州。", "fun_fact": ""}, {"id": "geo-AM-006", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 1, "type": "choice", "question": "大峽谷是由哪一條河流長期侵蝕而成？", "options": ["格蘭德河", "哥倫比亞河", "科羅拉多河", "密蘇里河"], "answer": 2, "explanation": "亞利桑那州的大峽谷是科羅拉多河歷經數百萬年下切岩層形成的深邃峽谷。", "fun_fact": ""}, {"id": "geo-AM-007", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 1, "type": "choice", "question": "加拿大唯一以法語為單一官方語言的省份是？", "options": ["安大略省", "魁北克省", "曼尼托巴省", "新斯科細亞省"], "answer": 1, "explanation": "魁北克省是加拿大唯一把法語列為單一官方語言的省份。", "fun_fact": ""}, {"id": "geo-AM-008", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 3, "type": "choice", "question": "美國與加拿大西部的大部分邊界，沿著哪一條緯線？", "options": ["北緯38度", "北緯42度", "北緯45度", "北緯49度"], "answer": 3, "explanation": "亞伯達省與薩克其萬省一帶的美加邊界，整段都沿著北緯四十九度線。", "fun_fact": ""}, {"id": "geo-AM-009", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "黃石國家公園約九成六的面積位於哪一州？", "options": ["蒙大拿州", "愛達荷州", "南達科他州", "懷俄明州"], "answer": 3, "explanation": "黃石橫跨三州，但約百分之九十六的土地在懷俄明州內。", "fun_fact": "它被公認是世界上第一座國家公園，一八七二年設立。"}, {"id": "geo-AM-010", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "加拿大第一座國家公園「班夫」位於哪個省？", "options": ["卑詩省", "亞伯達省", "薩克其萬省", "安大略省"], "answer": 1, "explanation": "班夫國家公園一八八五年設立，座落於亞伯達省的加拿大洛磯山區。", "fun_fact": ""}, {"id": "geo-AM-011", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "北美洲陸地最低點「惡水盆地」位於哪座國家公園？", "options": ["死谷國家公園", "約書亞樹國家公園", "大盆地國家公園", "拱門國家公園"], "answer": 0, "explanation": "惡水盆地低於海平面，位在加州莫哈維沙漠北緣的死谷國家公園內。", "fun_fact": ""}, {"id": "geo-AM-012", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 2, "type": "choice", "question": "美國首都華盛頓特區位於哪一條河的河畔？", "options": ["哈德遜河", "德拉瓦河", "波多馬克河", "薩斯奎哈納河"], "answer": 2, "explanation": "華盛頓特區座落於波多馬克河畔，本身不隸屬任何一州。", "fun_fact": ""}, {"id": "geo-AM-013", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 3, "type": "choice", "question": "流經加拿大西北地區的馬更些河，最後注入哪個大洋？", "options": ["大西洋", "北冰洋", "太平洋", "印度洋"], "answer": 1, "explanation": "馬更些河向北流入北冰洋的波弗特海，形成廣大的河口三角洲。", "fun_fact": ""}, {"id": "geo-AM-014", "topic": "geo", "unit": "AM", "unit_name": "美洲", "category": "地理", "region": "美洲", "difficulty": 3, "type": "choice", "question": "加拿大面積最大的省或地區是哪一個？", "options": ["魁北克省", "卑詩省", "安大略省", "努納福特地區"], "answer": 3, "explanation": "若把地區一併 。", "options": ["對", "錯"], "answer": 1, "explanation": "若依降水量來定義沙漠，南極洲才是世界最大的沙漠；撒哈拉是最大的「熱沙漠」。", "fun_fact": "沙漠的定義看的是雨量，而不是溫度或沙子。", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-019", "category": "地理", "difficulty": 1, "type": "choice", "question": "位於澳洲東北外海的「大堡礁」，是世界上最大的珊瑚礁系統。", "options": ["對", "錯"], "answer": 0, "explanation": "正確。大堡礁由約 3,000 個珊瑚礁組成，綿延超過 2,300 公里，是世界最大的珊瑚礁系統。", "fun_fact": "大堡礁是由無數微小的珊瑚蟲一點一點堆積出來的，被稱為地球上最大的生物構造。", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-023", "category": "地理", "difficulty": 2, "type": "choice", "question": "非洲最高峰「吉力馬札羅山」位於哪個國家？", "options": ["坦尚尼亞", "衣索比亞", "肯亞", "南非"], "answer": 0, "explanation": "吉力馬札羅山位於坦尚尼亞東北部，靠近肯亞邊界，海拔約 5,895 公尺。", "fun_fact": "雖然它離赤道不遠，山頂卻終年有冰川，不過面積已經大幅縮小。", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-058", "category": "地理", "difficulty": 2, "type": "choice", "question": "北非國家摩洛哥的首都是哪一座城市？", "options": ["馬拉喀什", "卡薩布蘭加", "拉巴特", "非斯"], "answer": 2, "explanation": "摩洛哥的首都是拉巴特；卡薩布蘭加雖然是最大城市，也因同名電影而出名，但並不是首都。", "fun_fact": "卡薩布蘭加（Casablanca）在西班牙文中是「白色房子」的意思。", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-060", "category": "地理", "difficulty": 2, "type": "choice", "question": "埃及的「蘇伊士運河」連接了哪兩個海？", "options": ["地中海與黑海", "地中海與紅海", "紅海與阿拉伯海", "黑海與裏海"], "answer": 1, "explanation": "蘇伊士運河在 1869 年通航，連接北邊的地中海與南邊的紅海，讓船隻不必繞行非洲南端就能往來歐亞。", "fun_fact": "蘇伊士運河也是非洲與亞洲的分界，所以埃及的國土其實橫跨非、亞兩洲。", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-068", "category": "地理", "difficulty": 2, "type": "choice", "question": "南極點的平均氣溫，比北極點還要低得多。", "options": ["對", "錯"], "answer": 0, "explanation": "正確。南極點位在海拔約 2,800 公尺的冰原上，年平均氣溫約零下 49°C；北極點則位於海冰上，底下的海水會釋放熱量，所以相對「溫暖」許多。", "fun_fact": "南極點底下是南極大陸，北極點底下卻沒有陸地，只有漂浮在北冰洋上的海冰。", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-075", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "位於以色列與約旦之間的「死海」，最著名的特徵是什麼？", "options": ["深度世界第一，超過千公尺", "全年結冰，湖面可以行走", "鹽度極高，人能輕鬆漂浮", "面積世界最大，橫跨數國"], "answer": 2, "explanation": "死海鹽度約為一般海水的近十倍，浮力極大，人躺在水面上就能浮起來。", "fun_fact": "死海其實是一座內流的鹹水湖，水面高度低於海平面四百多公尺。", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-076", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "夏天在北極圈內，太陽整夜不落下、天空持續明亮的現象稱為？", "options": ["極光", "焚風", "日食", "永晝"], "answer": 3, "explanation": "高緯度地區夏季會出現太陽終日不落的「永晝」，冬季則相反出現「永夜」。", "fun_fact": "北歐國家把永晝的太陽叫做「午夜太陽」，半夜還能在戶外看書。", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "geo-OTH-001", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 1, "type": "choice", "question": "貫穿伊斯坦堡、分隔歐亞兩洲的海峽是？", "options": ["達達尼爾海峽", "荷莫茲海峽", "博斯普魯斯海峽", "曼德海峽"], "answer": 2, "explanation": "博斯普魯斯海峽連接黑海與馬爾馬拉海，海峽兩岸分屬歐洲與亞洲，伊斯坦堡正好跨在兩側。", "fun_fact": ""}, {"id": "geo-OTH-002", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 1, "type": "choice", "question": "世界面積最大的半島是哪一個？", "options": ["阿拉伯半島", "印度半島", "中南半島", "巴爾幹半島"], "answer": 0, "explanation": "阿拉伯半島面積約三百萬平方公里，是全球最大的半島，遠超其他候選者。", "fun_fact": ""}, {"id": "geo-OTH-003", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 3, "type": "choice", "question": "阿拉伯半島南部那片世界最大的連續沙質沙漠叫什麼？", "options": ["大內夫得沙漠", "卡維爾沙漠", "內蓋夫沙漠", "魯卜哈利沙漠"], "answer": 3, "explanation": "魯卜哈利沙漠意為「空白之地」，是世界上面積最大的連續沙質沙漠。", "fun_fact": ""}, {"id": "geo-OTH-004", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "兩河流域的底格里斯河與幼發拉底河最後注入哪裡？", "options": ["地中海", "波斯灣", "紅海", "黑海"], "answer": 1, "explanation": "兩河在伊拉克南部匯流成阿拉伯河，再注入波斯灣。", "fun_fact": ""}, {"id": "geo-OTH-005", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "波斯灣要出海通往阿曼灣，必須經過哪個海峽？", "options": ["曼德海峽", "蘇伊士運河", "荷莫茲海峽", "達達尼爾海峽"], "answer": 2, "explanation": "荷莫茲海峽北岸是伊朗、南岸是阿曼與阿聯，是波斯灣唯一的出海口。", "fun_fact": ""}, {"id": "geo-OTH-006", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "連接紅海與亞丁灣的海峽是？", "options": ["曼德海峽", "荷莫茲海峽", "博斯普魯斯海峽", "麻六甲海峽"], "answer": 0, "explanation": "曼德海峽位於葉門與非洲之角之間，是紅海南端通往印度洋的門戶。", "fun_fact": ""}, {"id": "geo-OTH-007", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 1, "type": "choice", "question": "土耳其的首都是哪一座城市？", "options": ["伊斯坦堡", "伊茲密爾", "布爾薩", "安卡拉"], "answer": 3, "explanation": "一九二三年土耳其共和國成立時把首都遷到內陸的安卡拉，伊斯坦堡不再是首都。", "fun_fact": ""}, {"id": "geo-OTH-008", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "土耳其最高峰、傳說中諾亞方舟停靠之處是？", "options": ["黎巴嫩山", "阿拉拉特山", "西奈山", "厄爾布爾士山"], "answer": 1, "explanation": "阿拉拉特山海拔約五千一百公尺，是土耳其最高峰，也是一座休眠的層狀火山。", "fun_fact": ""}, {"id": "geo-OTH-009", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "土耳其中部以「精靈煙囪」奇岩和熱氣球聞名的地區是？", "options": ["帕慕卡麗", "內姆魯特山", "卡帕多奇亞", "番紅花城"], "answer": 2, "explanation": "卡帕多奇亞的火山灰岩層受風雨侵蝕，形成一根根柱狀的「精靈煙囪」。", "fun_fact": ""}, {"id": "geo-OTH-010", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 3, "type": "choice", "question": "約旦河在注入死海之前，會先流經哪一座湖？", "options": ["凡湖", "烏爾米耶湖", "塔納湖", "加利利海"], "answer": 3, "explanation": "約旦河由北向南先穿過淡水的加利利海（提比里亞湖），再往南流。", "fun_fact": ""}, {"id": "geo-OTH-011", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大 海峽", "庫克海峽", "望加錫海峽"], "answer": 1, "explanation": "托雷斯海峽位於約克角半島與新幾內亞之間，海峽中的島嶼由昆士蘭管轄。", "fun_fact": ""}, {"id": "geo-OTH-037", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 1, "type": "choice", "question": "澳洲唯一完全由島嶼構成的州是？", "options": ["塔斯馬尼亞", "新南威爾斯", "維多利亞", "昆士蘭"], "answer": 0, "explanation": "塔斯馬尼亞隔著巴斯海峽與澳洲大陸相望，是唯一不在大陸上的州。", "fun_fact": ""}, {"id": "geo-OTH-038", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 3, "type": "choice", "question": "澳洲大陸最高峰科修斯科山屬於哪一條山脈？", "options": ["南阿爾卑斯山", "麥克唐納山脈", "弗林德斯山脈", "大分水嶺"], "answer": 3, "explanation": "科修斯科山位於大分水嶺南段的雪山山區，海拔約二千二百公尺。", "fun_fact": ""}, {"id": "geo-OTH-039", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "紐西蘭最高峰、毛利語稱作 Aoraki 的是哪一座山？", "options": ["魯阿佩胡山", "庫克山", "塔拉納基山", "阿斯派靈山"], "answer": 1, "explanation": "庫克山海拔約三千七百公尺，聳立在南島的南阿爾卑斯山脈中。", "fun_fact": ""}, {"id": "geo-OTH-040", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "澳洲地勢最低處、平時多半乾涸的巨大鹽湖是？", "options": ["托倫斯湖", "麥覺理湖", "艾爾湖", "甘比爾湖"], "answer": 2, "explanation": "艾爾湖湖面低於海平面約十五公尺，只有內陸大洪水時才會真正蓄滿水。", "fun_fact": ""}, {"id": "geo-OTH-041", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 3, "type": "choice", "question": "紐西蘭北島以間歇泉與沸騰泥漿池聞名的地熱城市是？", "options": ["陶波", "納皮爾", "漢密爾頓", "羅托魯瓦"], "answer": 3, "explanation": "羅托魯瓦坐落在火山口窪地上，硫磺味與地熱景觀是它的招牌。", "fun_fact": ""}, {"id": "geo-OTH-042", "topic": "geo", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "地理", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "紐西蘭地震與火山頻繁，因為它正位於哪兩大板塊的交界？", "options": ["太平洋板塊與澳洲板塊", "歐亞板塊與印度板塊", "北美板塊與太平洋板塊", "南極板塊與納茲卡板塊"], "answer": 0, "explanation": "太平洋板塊與澳洲板塊在紐西蘭一帶相
