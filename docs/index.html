將諸羅改名為嘉義。", "fun_fact": "林爽文事件最後由清朝派福康安領軍平定，事件平息後朝廷在台灣各地立碑紀念。", "region": "台灣"}, {"id": "tw-103", "topic": "history", "category": "大航海時代", "difficulty": 3, "type": "choice", "question": "荷蘭時期傳教士用羅馬字為原住民拼寫語言，留下的「新港文書」記錄的是哪一族的語言？", "options": ["西拉雅族", "凱達格蘭族", "巴宰族", "道卡斯族"], "answer": 0, "explanation": "荷蘭傳教士以羅馬字書寫台南一帶西拉雅族新港社的語言，用來傳教與訂立契約，這些文書被稱為新港文書。", "fun_fact": "民間把這些夾雜羅馬字的契約俗稱為「番仔契」，最晚的一份寫於荷蘭人離台超過一百年之後。", "region": "台灣"}, {"id": "tw-104", "topic": "history", "category": "日治時期", "difficulty": 3, "type": "choice", "question": "1915 年爆發、由余清芳等人領導，被視為漢人最後一次大規模武裝抗日的事件是？", "options": ["羅福星事件", "北埔事件", "西來庵事件", "霧社事件"], "answer": 2, "explanation": "西來庵事件因余清芳等人以台南西來庵為據點策劃起事而得名，主戰場在噍吧哖（今台南玉井），又稱噍吧哖事件。", "fun_fact": "事件之後，漢人的抗日方式逐漸從武裝行動轉向議會請願、結社與辦報等非武裝路線。", "region": "台灣"}, {"id": "tw-105", "topic": "history", "category": "戰後台灣", "difficulty": 3, "type": "choice", "question": "1979 年 12 月 10 日發生的美麗島事件，地點在哪個城市？", "options": ["台北", "台中", "台南", "高雄"], "answer": 3, "explanation": "美麗島事件發生於 1979 年 12 月 10 日世界人權日，《美麗島》雜誌社在高雄舉辦遊行，過程中與警方發生衝突，事後多名參與者遭到逮捕與審判。", "fun_fact": "事件相關的軍事審判在隔年公開進行，審判過程經由報紙刊登，是台灣民主化歷程中常被提及的一段。", "region": "台灣"}, {"id": "cn-001", "category": "歷史", "difficulty": 1, "type": "choice", "question": "第一個統一中國、自稱「始皇帝」的是誰？", "options": ["嬴政", "劉邦", "漢武帝", "項羽"], "answer": 0, "explanation": "秦王嬴政於西元前 221 年統一六國，自稱始皇帝。", "fun_fact": "他也統一了文字、貨幣和度量衡。", "topic": "history", "region": "中國"}, {"id": "cn-002", "category": "歷史", "difficulty": 1, "type": "order", "question": "請依時間先後排出這些朝代：", "options": ["宋", "漢", "唐", "隋"], "answer": [1, 3, 2, 0], "explanation": "順序是 漢 → 隋 → 唐 → 宋。", "fun_fact": "隋朝雖然只有短短三十多年，卻開鑿了大運河。", "topic": "history", "region": "中國"}, {"id": "cn-003", "category": "歷史", "difficulty": 2, "type": "choice", "question": "漢武帝時奉命出使西域、開拓絲路的是誰？", "options": ["班超", "鄭和", "玄奘", "張騫"], "answer": 3, "explanation": "張騫出使西域，打通了中原與西域的交通。", "fun_fact": "葡萄、苜蓿等作物據說就是那時傳進中原的。", "topic": "history", "region": "中國"}, {"id": "cn-004", "category": "歷史", "difficulty": 2, "type": "choice", "question": "明朝的鄭和一共下西洋幾次？", "options": ["3 次", "10 次", "7 次", "5 次"], "answer": 2, "explanation": "鄭和在永樂、宣德年間共七次下西洋。", "fun_fact": "他的船隊最遠到達東非沿岸。", "topic": "history", "region": "中國"}, {"id": "cn-017", "category": "歷史", "difficulty": 2, "type": "choice", "question": "一般認為，中國的「科舉制度」創始於哪個朝代？", "options": ["隋朝", "元朝", "漢朝", "宋朝"], "answer": 0, "explanation": "隋朝開始以考試選拔官員，隋煬帝時設立進士科，一般視為科舉的開端。", "fun_fact": "科舉在清末 1905 年正式廢除，前後實行了約 1300 年。", "topic": "history", "region": "中國"}, {"id": "cn-018", "category": "歷史", "difficulty": 1, "type": "choice", "question": "成語「臥薪嘗膽」說的是哪一位君王忍辱復國的故事？", "options": ["漢高祖劉邦", "西楚霸王項羽", "吳王夫差", "越王勾踐"], "answer": 3, "explanation": "越王勾踐被吳國打敗後刻苦自勵，最終滅了吳國。", "fun_fact": "《史記》其實只記載勾踐「嘗膽」，「臥薪」是後人附加上去的說法。", "topic": "history", "region": "中國"}, {"id": "cn-019", "category": "歷史", "difficulty": 1, "type": "choice", "question": "成語「破釜沉舟」出自哪位人物在鉅鹿之戰的決戰行動？", "options": ["劉邦", "韓信", "項羽", "曹操"], "answer": 2, "explanation": "項羽渡河後下令鑿沉船隻、打破煮飯的鍋，只帶三天糧食，表示不勝不歸。", "fun_fact": "這一戰項羽以少勝多大破秦軍主力，從此威震諸侯。", "topic": "history", "region": "中國"}, {"id": "cn-020", "category": "歷史", "difficulty": 1, "type": "choice", "question": "民間傳說「岳母刺字」，母親在誰的背上刺下「精忠報國」？", "options": ["戚繼光", "文天祥", "岳飛", "關羽"], "answer": 2, "explanation": "這是南宋名將岳飛的著名傳說。", "fun_fact": "據《宋史》記載，岳飛背上刺的是「盡忠報國」四字，至於是否為岳母所刺並無史料根據。", "topic": "history", "region": "中國"}, {"id": "cn-021", "category": "歷史", "difficulty": 1, "type": "choice", "question": "歷史上被稱為「貞觀之治」的盛世，是哪位皇帝在位時？", "options": ["漢武帝", "唐太宗", "唐玄宗", "宋太祖"], "answer": 1, "explanation": "「貞觀」是唐太宗李世民的年號，他在位時政治清明、國力強盛。", "fun_fact": "唐太宗曾說魏徵是他的鏡子：「以人為鏡，可以明得失」。", "topic": "history", "region": "中國"}, {"id": "cn-022", "category": "歷史", "difficulty": 3, "type": "choice", "question": "中國唯一的正統女皇帝武則天登基後，改國號為什麼？", "options": ["周", "魏", "齊", "唐"], "answer": 0, "explanation": "武則天於 690 年稱帝，改國號為「周」，史稱「武周」。", "fun_fact": "她晚年被迫退位後，國號又改回「唐」。", "topic": "history", "region": "中國"}, {"id": "cn-023", "category": "歷史", "difficulty": 2, "type": "choice", "question": "北宋發明「活字印刷術」的是哪一位？", "options": ["張衡", "畢昇", "郭守敬", "蔡倫"], "answer": 1, "explanation": "北宋平民畢昇發明膠泥活字，事蹟記載於沈括的《夢溪筆談》。", "fun_fact": "畢昇的活字是用黏土刻字再用火燒硬，比歐洲古騰堡的活字印刷早了約四百年。", "topic": "history", "region": "中國"}, {"id": "cn-024", "category": "歷史", "difficulty": 2, "type": "choice", "question": "南北朝時期，把圓周率精確推算到小數點後第 7 位的數學家是誰？", "options": ["沈括", "張衡", "郭守敬", "祖沖之"], "answer": 3, "explanation": "祖沖之算出圓周率介於 3.1415926 與 3.1415927 之間。", "fun_fact": "他還提出「密率」355/113，是非常精準又好記的近似分數。", "topic": "history", "region": "中國"}, {"id": "cn-025", "category": "歷史", "difficulty": 2, "type": "choice", "question": "明太祖朱元璋在建立明朝之前，曾經出家當過和尚。", "options": ["對", "錯"], "answer": 0, "explanation": "朱元璋幼年家貧、親人死於饑荒，曾到皇覺寺出家，後來才投身起義軍。", "fun_fact": "他從放牛娃、和尚一路成為開國皇帝，是中國史上出身最寒微的皇帝之一。", "topic": "history", "region": "中國"}, {"id": "cn-026", "category": "歷史", "difficulty": 2, "type": "choice", "question": "「罷黜百家，獨尊儒術」是秦始皇推行的政策。", "options": ["對", "錯"], "answer": 1, "explanation": "這是漢武帝時採納董仲舒的建議而推行的；秦始皇反而是「焚書坑儒」。", "fun_fact": "從漢武帝之後，儒家思想成為中國兩千年來的官方正統學說。", "topic": "history", "region": "中國"}, {"id": "cn-027", "category": "歷史", "difficulty": 3, "type": "choice", "question": "成語「紙上談兵」諷刺的是戰國時代哪位將領？", "options": ["廉頗", "孫臏", "白起", "趙括"], "answer": 3, "explanation": "趙括熟讀兵書卻缺乏實戰經驗，在長平之戰中大敗於秦將白起。", "fun_fact": "趙括的母親曾事先上書趙王，說兒子不能當大將，請求萬一失敗不要株連家人。", "topic": "history", "region": "中國"}, {"id": "cn-028", "category": "歷史", "difficulty": 3, "type": "order", "question": "請依發生時間先後排列這些歷史事件：", "options": ["靖難之役", "陳橋兵變", "赤壁之戰", "玄武門之變"], "answer": [2, 3, 1, 0], "explanation": "赤壁之戰（208 年，東漢末）→ 玄武門之變（626 年，唐）→ 陳橋兵變（960 年，北宋建立）→ 靖難之役（1399 年起，明）。", "fun_fact": "成語「黃袍加身」就是出自趙匡胤的陳橋兵變。", "topic": "history", "region": "中國"}, {"id": "cn-074", "topic": "history", "category": "先秦", "difficulty": 1, "type": "choice", "question": "儒家創始人孔子是春秋時代哪一個諸侯國的人？", "options": ["齊國", "楚國", "魯國", "秦國"], "answer": 2, "explanation": "孔子生於春秋時代的魯國陬邑，也就是今天的山東曲阜一帶。", "fun_fact": "曲阜的孔廟、孔林、孔府合稱「三孔」，1994年列入世界文化遺產。", "region": "中國"}, {"id": "cn-075", "topic": "history", "category": "三國", "difficulty": 1, "type": "choice", "question": "赤壁之戰中，孫權與劉備的聯軍擊敗了哪一方的大軍？", "options": ["袁紹", "曹操", "董卓", "呂布"], "answer": 1, "explanation": "西元208年，孫劉聯軍在赤壁以火攻大破曹操南下的軍隊。", "fun_fact": "赤壁之戰後形成魏、蜀、吳三方鼎立的局面。", "region": "中國"}, {"id": "cn-076", "topic": "history", "category": "隋唐", "difficulty": 1, "type": "choice", "question": "唐代高僧玄奘西行求取佛經，最終抵達的是當時的哪個地區？", "options": ["波斯（今伊朗）", "大秦（今羅馬）", "天竺（今印度）", "扶桑（今日本）"], "answer": 2, "explanation": "玄奘從長安出發，經西域前往天竺（印度）取經，在那爛陀寺學習多年。", "fun_fact": "他回國後口述、由弟子筆錄成《大唐西域記》，是研究當時中亞與印度的重要史料。", "region": "中國"}, {"id": "cn-077", "topic": "history", "category": "近代", "difficulty": 1, "type": "choice", "question": "鴉片戰爭戰敗後，清朝與英國簽訂的第一個不平等條約是？", "options": ["北京條約", "天津條約", "南京條約", "馬關條約"], "answer": 2, "explanation": "1842年清朝與英國簽訂《南京條約》，割讓香港島並開放五口通商。", "fun_fact": "《南京條約》是在停泊於南京江面的英國軍艦「皋華麗號」上簽訂的。", "region": "中國"}, {"id": "cn-078", "topic": "history", "category": "近代", "difficulty": 1, "type": "choice", "question": "1911年辛亥革命的首義，發生在哪一座城市？", "options": ["南京", "廣州", "上海", "武昌"], "answer": 3, "explanation": "1911年10月10日革命黨人在武昌發動起義，各省接連響應，史稱辛亥革命。", "fun_fact": "因為起義發生在農曆辛亥年，所以稱為辛亥革命；10月10日後來成為「雙十節」。", "region": "中國"}, {"id": "cn-079", "topic": "history", "category": "秦漢", "difficulty": 1, "type": "choice", "question": "秦朝末年發動中國史上第一次大規模民變的領袖是誰？", "options": ["項羽、項梁", "陳勝、吳廣", "劉邦、蕭何", "張角、張梁"], "answer": 1, "explanation": "西元前209年陳勝、吳廣在大澤鄉起事，揭開反秦民變的序幕。", "fun_fact": "「王侯將相寧有種乎」就是《史記》記載陳勝說過的話。", "region": "中國"}, {"id": "cn-080", "topic": "history", "category": "先秦", "difficulty": 1, "type": "choice", "question": "刻在龜甲與獸骨上的「甲骨文」，主要出自哪一個朝代？", "options": ["夏朝", "商朝", "西周", "春秋"], "answer": 1, "explanation": "甲骨文是商朝晚期的占卜紀錄，大量出土於河南安陽的殷墟。", "fun_fact": "甲骨文是1899年由清朝官員王懿榮在中藥材「龍骨」上發現的。", "region": "中國"}, {"id": "cn-081", "topic": "history", "category": "宋元", "difficulty": 1, "type": "choice", "question": "建立元朝、定都大都（今北京）的是哪一位君主？", "options": ["成吉思汗", "窩闊台", "忽必烈", "努爾哈赤"], "answer": 2, "explanation": "成吉思汗的孫子忽必烈於1271年定國號為「大元」，1279年滅南宋統一全國。", "fun_fact": "義大利人馬可波羅相傳就是在忽必烈在位期間來到中國。", "region": "中國"}, {"id": "cn-082", "topic": "history", "category": "明清", "difficulty": 1, "type": "choice", "question": "清朝最後一位皇帝溥儀，在位時使用的年號是？", "options": ["咸豐", "同治", "光緒", "宣統"], "answer": 3, "explanation": "溥儀1908年即位，年號宣統，1912年清帝退位，清朝結束。", "fun_fact": "溥儀即位時還不滿三歲，是清朝年紀最小的皇帝。", "region": "中國"}, {"id": "cn-083", "topic": "history", "category": "三國", "difficulty": 1, "type": "choice", "question": "成語「三顧茅廬」中，劉備三次登門請出山的是誰？", "options": ["周瑜", "司馬懿", "龐統", "諸葛亮"], "answer": 3, "explanation": "劉備三次前往隆中拜訪諸葛亮，請他出山輔佐，這段記載見於《三國志》。", "fun_fact": "諸葛亮在〈出師表〉中自述「三顧臣於草廬之中」，就是指這件事。", "region": "中國"}, {"id": "cn-084", "topic": "history", "category": "隋唐", "difficulty": 1, "type": "choice", "question": "唐朝由盛轉衰的關鍵事件，一般認為是哪一場動亂？", "options": ["安史之亂", "黃巾之亂", "八王之亂", "黃巢之亂"], "answer": 0, "explanation": "755年安祿山、史思明起兵叛亂，歷時八年，唐朝國力自此大幅衰退。", "fun_fact": "杜甫的〈春望〉「國破山河在，城春草木深」就寫於安史之亂期間。", "region": "中國"}, {"id": "cn-085", "topic": "history", "category": "秦漢", "difficulty": 1, "type": "choice", "question": "秦始皇連接、修築長城，主要是為了防禦北方哪一個游牧民族？", "options": ["匈奴", "契丹", "女真", "蒙古"], "answer": 0, "explanation": "秦統一後派蒙恬北擊匈奴，並把戰國時代各國的長城連接修築起來。", "fun_fact": "今天看到的磚砌長城大多是明代重修的，秦代長城多為夯土構築，位置也更偏北。", "region": "中國"}, {"id": "cn-086", "topic": "history", "category": "先秦", "difficulty": 2, "type": "choice", "question": "戰國時代商鞅推行變法，使哪一個國家國力大為增強？", "options": ["秦國", "齊國", "趙國", "魏國"], "answer": 0, "explanation": "商鞅在秦孝公支持下兩次變法，獎勵耕戰、推行法治，奠定秦國富強的基礎。", "fun_fact": "「徙木立信」的故事就是商鞅為了讓百姓相信新法會確實執行而設計的。", "region": "中國"}, {"id": "cn-087", "topic": "history", "category": "先秦", "difficulty": 2, "type": "choice", "question": "主張「兼愛」「非攻」的先秦思想家是誰？", "options": ["莊子", "韓非", "荀子", "墨子"], "answer": 3, "explanation": "墨子提倡兼愛（平等地愛人）與非攻（反對侵略戰爭），創立墨家學派。", "fun_fact": "墨家弟子擅長守城器械，「墨守成規」的「墨」就是指墨子善於守城。", "region": "中國"}, {"id": "cn-088", "topic": "history", "category": "秦漢", "difficulty": 2, "type": "choice", "question": "中國第一部紀傳體通史《史記》的作者是誰？", "options": ["班固", "司馬遷", "司馬光", "陳壽"], "answer": 1, "explanation": "西漢司馬遷著《史記》，記事上起黃帝、下至漢武帝，是第一部紀傳體通史。", "fun_fact": "《漢書》作者是班固，《資治通鑑》作者是司馬光，《三國志》作者是陳壽。", "region": "中國"}, {"id": "cn-089", "topic": "history", "category": "魏晉南北朝", "difficulty": 2, "type": "choice", "question": "東晉以少勝多、擊敗前秦苻堅大軍的戰役是？", "options": ["官渡之戰", "昆陽之戰", "淝水之戰", "鉅鹿之戰"], "answer": 2, "explanation": "383年淝水之戰，東晉謝安、謝玄以少數兵力大敗前秦苻堅，保住南方政權。", "fun_fact": "成語「草木皆兵」「風聲鶴唳」都出自苻堅戰敗後潰逃的情景。", "region": "中國"}, {"id": "cn-090", "topic": "history", "category": "隋唐", "difficulty": 2, "type": "choice", "question": "貫通南北的大運河，是在哪一位皇帝在位時大規模開鑿？", "options": ["隋文帝", "隋煬帝", "唐太宗", "唐玄宗"], "answer": 1, "explanation": "隋煬帝在位期間徵調大量民力開鑿運河，連通了海河、黃河、淮河與長江流域。", "fun_fact": "大運河便利了南北漕運，但沉重的徭役也是隋朝迅速滅亡的原因之一。", "region": "中國"}, {"id": "cn-091", "topic": "history", "category": "宋元", "difficulty": 2, "type": "choice", "question": "北宋滅亡、徽欽二帝被金人擄往北方的事件，史稱什麼？", "options": ["土木之變", "玄武門之變", "陳橋兵變", "靖康之變"], "answer": 3, "explanation": "1127年金軍攻破開封，擄走宋徽宗與宋欽宗，北宋滅亡，史稱靖康之變。", "fun_fact": "岳飛〈滿江紅〉中「靖康恥，猶未雪」說的就是這件事。", "region": "中國"}, {"id": "cn-092", "topic": "history", "category": "明清", "difficulty": 2, "type": "choice", "question": "明代在東南沿海率軍抗擊倭寇、戰功卓著的名將是誰？", "options": ["鄭成功", "戚繼光", "袁崇煥", "文天祥"], "answer": 1, "explanation": "戚繼光在浙江、福建一帶練兵抗倭，他所帶的部隊被稱為「戚家軍」。", "fun_fact": "戚繼光創的「鴛鴦陣」讓長槍、盾牌、狼筅等兵器互相掩護，專門剋制倭寇的刀法。", "region": "中國"}, {"id": "cn-093", "topic": "history", "category": "近代", "difficulty": 2, "type": "choice", "question": "甲午戰爭清朝戰敗後，與日本簽訂的條約是？", "options": ["辛丑條約", "北京條約", "馬關條約", "璦琿條約"], "answer": 2, "explanation": "1895年清朝與日本簽訂《馬關條約》，割讓台灣、澎湖並賠款兩億兩白銀。", "fun_fact": "條約在日本下關（舊稱馬關）春帆樓簽訂，因此稱為《馬關條約》。", "region": "中國"}, {"id": "cn-094", "topic": "history", "category": "近代", "difficulty": 2, "type": "choice", "question": "太平天國的領導者、自稱「天王」的是誰？", "options": ["洪秀全", "李鴻章", "曾國藩", "石達開"], "answer": 0, "explanation": "洪秀全1851年在廣西金田起事，建號太平天國，自稱天王，後來定都南京。", "fun_fact": "太平天國歷時十餘年，最後由曾國藩率領的湘軍攻破南京而結束。", "region": "中國"}, {"id": "cn-095", "topic": "history", "category": "明清", "difficulty": 2, "type": "choice", "question": "明代李時珍編成、收錄近兩千種藥物的醫藥學巨著是哪一部？", "options": ["天工開物", "本草綱目", "齊民要術", "夢溪筆談"], "answer": 1, "explanation": "《本草綱目》是李時珍花費約二十七年編成的藥物學著作，明代萬曆年間刊行。", "fun_fact": "《天工開物》是明代宋應星的工藝技術專書，《齊民要術》則是北魏賈思勰的農書。", "region": "中國"}, {"id": "cn-096", "topic": "history", "category": "隋唐", "difficulty": 3, "type": "choice", "question": "唐代三省六部制中，負責審核並可以駁回詔令的是哪一省？", "options": ["中書省", "尚書省", "門下省", "御史臺"], "answer": 2, "explanation": "中書省草擬詔令，門下省負責審核封駁，尚書省負責執行，六部隸屬尚書省。", "fun_fact": "門下省若認為詔令不妥可以退回重擬，這種權力稱為「封駁」。", "region": "中國"}, {"id": "cn-097", "topic": "history", "category": "魏晉南北朝", "difficulty": 3, "type": "choice", "question": "把無主荒地按戶授給農民耕作的「均田制」，最早由哪個朝代開始推行？", "options": ["北魏", "西晉", "隋朝", "唐朝"], "answer": 0, "explanation": "北魏孝文帝於485年頒布均田令，後來北齊、北周、隋、唐大致沿用這套制度。", "fun_fact": "均田制到唐代中期因人口增加、土地兼併而難以維持，最後被兩稅法取代。", "region": "中國"}, {"id": "cn-098", "topic": "history", "category": "宋元", "difficulty": 3, "type": "choice", "question": "推行青苗法、募役法等新法的王安石，是在哪位皇帝支持下變法？", "options": ["宋太祖", "宋真宗", "宋仁宗", "宋神宗"], "answer": 3, "explanation": "王安石在宋神宗熙寧年間主持變法，希望富國強兵、改善財政。", "fun_fact": "新法引發舊黨強烈反對，司馬光就是反對變法最有名的代表人物。", "region": "中國"}, {"id": "cn-099", "topic": "history", "category": "近代", "difficulty": 3, "type": "choice", "question": "1898年推動戊戌變法（百日維新）的清朝皇帝是誰？", "options": ["光緒帝", "道光帝", "咸豐帝", "同治帝"], "answer": 0, "explanation": "光緒帝採納康有為、梁啟超的主張推動變法，因慈禧太后發動政變而失敗。", "fun_fact": "變法從頒布詔書到結束只維持了一百多天，所以又稱「百日維新」。", "region": "中國"}, {"id": "cn-100", "topic": "history", "category": "先秦", "difficulty": 3, "type": "choice", "question": "戰國時期蘇秦等人主張的「合縱」策略，主要是為了對抗哪一國？", "options": ["秦國", "齊國", "楚國", "趙國"], "answer": 0, "explanation": "合縱是山東六國由北到南聯合起來共同抗秦；秦國則以張儀的「連橫」加以分化。", "fun_fact": "「縱」指南北向的聯合，「橫」指東西向的結盟，成語「合縱連橫」即由此而來。", "region": "中國"}, {"id": "wd-008", "category": "歷史", "difficulty": 1, "type": "choice", "question": "名畫《蒙娜麗莎》的作者是誰？", "options": ["米開朗基羅", "梵谷", "畢卡索", "達文西"], "answer": 3, "explanation": "《蒙娜麗莎》是達文西的作品，收藏於巴黎羅浮宮。", "fun_fact": "這幅畫在 1911 年曾經被偷走，兩年後才找回來。", "topic": "history", "region": "世界"}, {"id": "wd-009", "category": "歷史", "difficulty": 1, "type": "choice", "question": "美國的自由女神像是哪一個國家贈送的？", "options": ["英國", "法國", "西班牙", "荷蘭"], "answer": 1, "explanation": "自由女神像是法國送給美國的禮物，1886 年落成。", "fun_fact": "雕像內部的鋼鐵骨架是由艾菲爾鐵塔的設計者艾菲爾參與設計。", "topic": "history", "region": "世界"}, {"id": "wd-010", "category": "歷史", "difficulty": 2, "type": "choice", "question": "巴黎艾菲爾鐵塔當初是為了哪個活動而建造？", "options": ["世界博覽會", "國王加冕", "奧運", "戰爭勝利紀念"], "answer": 0, "explanation": "艾菲爾鐵塔是為 1889 年巴黎世界博覽會而建。", "fun_fact": "剛建成時很多藝術家反對，覺得它醜。", "topic": "history", "region": "世界"}, {"id": "wd-011", "category": "歷史", "difficulty": 2, "type": "order", "question": "請依時間先後排出這些事件：", "options": ["美國發表獨立宣言", "哥倫布抵達美洲", "人類首次登陸月球", "第一次世界大戰爆發"], "answer": [1, 0, 3, 2], "explanation": "1492 → 1776 → 1914 → 1969。", "fun_fact": "阿波羅 11 號登月時，阿姆斯壯說：「這是個人的一小步，人類的一大步。」", "topic": "history", "region": "世界"}, {"id": "wd-012", "category": "歷史", "difficulty": 2, "type": "choice", "question": "埃及最有名的三座大金字塔位在哪裡？", "options": ["阿斯旺", "路克索", "亞歷山大港", "吉薩"], "answer": 3, "explanation": "三座大金字塔位於開羅近郊的吉薩。", "fun_fact": "古夫金字塔是古代世界七大奇蹟中，唯一保存到今天的。", "topic": "history", "region": "世界"}, {"id": "wd-028", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1903 年完成公認為人類第一次「有動力、可操控」飛機飛行的是誰？", "options": ["林白", "愛迪生", "萊特兄弟", "貝爾"], "answer": 2, "explanation": "美國的萊特兄弟在 1903 年 12 月 17 日，於北卡羅來納州成功完成首次有動力、可操控的飛行。", "fun_fact": "第一次飛行只持續了約 12 秒，距離約 36 公尺，比一架波音 747 的翼展還短。", "topic": "history", "region": "世界"}, {"id": "wd-029", "category": "歷史", "difficulty": 1, "type": "choice", "question": "古羅馬城市「龐貝」是被哪一座火山爆發所掩埋？", "options": ["富士山", "維蘇威火山", "埃特納火山", "聖海倫斯火山"], "answer": 1, "explanation": "西元 79 年，義大利的維蘇威火山爆發，大量火山灰將龐貝城整個掩埋。", "fun_fact": "因為被火山灰封存，龐貝城連壁畫、麵包店和街上的塗鴉都保留了下來。", "topic": "history", "region": "世界"}, {"id": "wd-030", "category": "歷史", "difficulty": 2, "type": "choice", "question": "15 世紀在歐洲發明金屬活字印刷術，讓書籍得以大量印製的是誰？", "options": ["馬丁·路德", "伽利略", "古騰堡", "哥白尼"], "answer": 2, "explanation": "德國人古騰堡約在 1450 年發展出金屬活字印刷術，大幅推動了知識在歐洲的傳播。", "fun_fact": "其實東亞更早就有活字印刷：現存最古老的金屬活字印刷書是韓國 1377 年印製的《直指》。", "topic": "history", "region": "世界"}, {"id": "wd-031", "category": "歷史", "difficulty": 2, "type": "choice", "question": "率領船隊出發、進行人類第一次環球航行的航海家是誰？", "options": ["庫克船長", "達伽馬", "麥哲倫", "哥倫布"], "answer": 2, "explanation": "麥哲倫在 1519 年率西班牙船隊出發，但他在 1521 年死於菲律賓，最後由艾爾卡諾帶領剩下的船員於 1522 年回到西班牙，完成環球航行。", "fun_fact": "出發時有 5 艘船、約 240 至 270 人（各家說法不一），最後只有「維多利亞號」1 艘船、18 人回到西班牙。", "topic": "history", "region": "世界"}, {"id": "wd-032", "category": "歷史", "difficulty": 2, "type": "choice", "question": "第二次世界大戰在歐洲的爆發，是因為德國在 1939 年入侵了哪個國家？", "options": ["波蘭", "法國", "挪威", "蘇聯"], "answer": 0, "explanation": "1939 年 9 月 1 日德國入侵波蘭，英、法兩國隨即在 9 月 3 日對德宣戰，第二次世界大戰爆發。", "fun_fact": "", "topic": "history", "region": "世界"}, {"id": "wd-033", "category": "歷史", "difficulty": 2, "type": "choice", "question": "象徵冷戰的「柏林圍牆」是在哪一年倒塌的？", "options": ["1961 年", "1989 年", "1975 年", "1991 年"], "answer": 1, "explanation": "柏林圍牆在 1989 年 11 月 9 日開放，隔年東西德統一。1961 年是圍牆開始興建的年份。", "fun_fact": "圍牆開放的起因之一，是東德官員在記者會上誤說新的出境規定「立即生效」。", "topic": "history", "region": "世界"}, {"id": "wd-034", "category": "歷史", "difficulty": 2, "type": "choice", "question": "法國皇帝拿破崙其實是個特別矮小的人。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。拿破崙身高約 168 至 170 公分，在當時的法國男性中算是一般身高。「矮個子」的印象多半來自法制與英制單位換算的誤會，以及英國漫畫的醜化。", "fun_fact": "俗稱的「拿破崙情結」（形容矮個子愛逞強），就是從這個刻板印象而來的。", "topic": "history", "region": "世界"}, {"id": "wd-035", "category": "歷史", "difficulty": 3, "type": "choice", "question": "拿破崙最後一次戰敗的「滑鐵盧戰役」，戰場位於今天的哪個國家？", "options": ["荷蘭", "德國", "法國", "比利時"], "answer": 3, "explanation": "1815 年的滑鐵盧戰役發生在今天比利時布魯塞爾的南方，拿破崙戰敗後被流放到南大西洋的聖赫勒拿島。", "fun_fact": "從此「滑鐵盧」就成了「慘敗」的代名詞。", "topic": "history", "region": "世界"}, {"id": "wd-036", "category": "歷史", "difficulty": 3, "type": "choice", "question": "幫助學者破解古埃及象形文字的關鍵文物是什麼？", "options": ["死海古卷", "羅塞塔石碑", "納斯卡線", "圖坦卡門黃金面具"], "answer": 1, "explanation": "羅塞塔石碑上用象形文字、埃及世俗體和古希臘文刻了同一段內容，法國學者商博良在 1822 年藉此破解了象形文字。", "fun_fact": "羅塞塔石碑是 1799 年由法國士兵發現的，現在收藏在倫敦的大英博物館。", "topic": "history", "region": "世界"}, {"id": "wd-037", "category": "歷史", "difficulty": 3, "type": "choice", "question": "埃及豔后克麗奧佩脫拉七世生活的年代，距離大金字塔建成的時間，比距離人類登陸月球的時間還要近。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。古夫大金字塔約建於西元前 2560 年，克麗奧佩脫拉七世死於西元前 30 年，相距約 2,500 年；而她離 1969 年人類登月只有約 2,000 年。", "fun_fact": "對埃及豔后來說，大金字塔已經是「古蹟」了。", "topic": "history", "region": "世界"}, {"id": "wd-038", "category": "歷史", "difficulty": 3, "type": "order", "question": "請依發生時間先後，排出下列歷史事件：", "options": ["聯合國成立", "法國大革命爆發", "蘇伊士運河通航", "英國《大憲章》簽署"], "answer": [3, 1, 2, 0], "explanation": "《大憲章》1215 年 → 法國大革命 1789 年 → 蘇伊士運河 1869 年 → 聯合國 1945 年。", "fun_fact": "《大憲章》限制了國王的權力，被視為近代憲政思想的重要源頭。", "topic": "history", "region": "世界"}, {"id": "wd-078", "topic": "history", "category": "古文明", "difficulty": 1, "type": "choice", "question": "被稱為「文明搖籃」的美索不達米亞平原，主要位於今天哪個國家境內？", "options": ["伊朗", "伊拉克", "埃及", "土耳其"], "answer": 1, "explanation": "美索不達米亞意為「兩河之間的土地」，指底格里斯河與幼發拉底河之間的平原，主要範圍在今天的伊拉克。", "fun_fact": "蘇美人在這裡發展出楔形文字，是目前已知最早的文字系統之一。", "region": "世界"}, {"id": "wd-079", "topic": "history", "category": "古文明", "difficulty": 1, "type": "choice", "question": "古代奧林匹克運動會起源於下列哪一個古文明？", "options": ["古埃及", "古羅馬", "古希臘", "古印度"], "answer": 2, "explanation": "古代奧運會約從西元前 776 年起在古希臘的奧林匹亞舉行，是為了祭祀主神宙斯而辦的競技大會。", "fun_fact": "現代奧運在 1896 年於希臘雅典重新舉辦第一屆。", "region": "世界"}, {"id": "wd-080", "topic": "history", "category": "法國大革命", "difficulty": 1, "type": "choice", "question": "1789 年 7 月 14 日，巴黎群眾攻陷了哪個地方，成為法國大革命的象徵？", "options": ["巴黎聖母院", "楓丹白露宮", "凡爾賽宮", "巴士底監獄"], "answer": 3, "explanation": "巴士底監獄被視為王權專制的象徵，群眾在 1789 年 7 月 14 日攻陷它，這一天後來成為法國國慶日。", "fun_fact": "攻陷當天，監獄裡其實只關了 7 名囚犯。", "region": "世界"}, {"id": "wd-081", "topic": "history", "category": "美國獨立", "difficulty": 1, "type": "choice", "question": "美國《獨立宣言》是在哪一年正式發表的？", "options": ["1620 年", "1776 年", "1789 年", "1812 年"], "answer": 1, "explanation": "北美十三州的代表在 1776 年 7 月 4 日通過《獨立宣言》，這一天成為美國國慶日。", "fun_fact": "宣言的主要起草人是後來成為第三任總統的傑佛遜。", "region": "世界"}, {"id": "wd-082", "topic": "history", "category": "第一次世界大戰", "difficulty": 1, "type": "choice", "question": "第一次世界大戰爆發於哪一年？", "options": ["1904 年", "1914 年", "1918 年", "1939 年"], "answer": 1, "explanation": "1914 年奧匈帝國皇儲在塞拉耶佛遇刺後，各國依同盟關係相繼參戰，第一次世界大戰爆發，1918 年結束。", "fun_fact": "當時很多人以為這場仗「耶誕節前就會打完」，結果打了四年多。", "region": "世界"}, {"id": "wd-083", "topic": "history", "category": "太空競賽", "difficulty": 1, "type": "choice", "question": "人類史上第一位進入太空的太空人是誰？", "options": ["加加林", "阿姆斯壯", "葛倫", "艾德林"], "answer": 0, "explanation": "蘇聯太空人加加林在 1961 年 4 月 12 日搭乘東方一號繞行地球一圈，成為第一位進入太空的人類。", "fun_fact": "整趟飛行只有約 108 分鐘。", "region": "世界"}, {"id": "wd-084", "topic": "history", "category": "第二次世界大戰", "difficulty": 1, "type": "choice", "question": "美國正式加入第二次世界大戰的直接導火線是哪一起事件？", "options": ["日本偷襲珍珠港", "德軍空襲倫敦", "德國入侵法國", "義大利進攻希臘"], "answer": 0, "explanation": "1941 年 12 月 7 日日本偷襲夏威夷珍珠港的美軍基地，美國隔天對日宣戰，正式參戰。", "fun_fact": "在此之前，美國國內主張不介入歐戰的聲音一直相當強。", "region": "世界"}, {"id": "wd-085", "topic": "history", "category": "科學革命", "difficulty": 1, "type": "choice", "question": "提出萬有引力定律與三大運動定律的科學家是誰？", "options": ["伽利略", "克卜勒", "牛頓", "波以耳"], "answer": 2, "explanation": "牛頓在 1687 年出版《自然哲學的數學原理》，提出三大運動定律與萬有引力定律，奠定古典力學基礎。", "fun_fact": "「被蘋果砸到而想到重力」的故事，是他晚年向友人講述的回憶，細節已難以查證。", "region": "世界"}, {"id": "wd-086", "topic": "history", "category": "科學革命", "difficulty": 1, "type": "choice", "question": "最早提出「地球繞著太陽運行」日心說的近代天文學家是誰？", "options": ["亞里斯多德", "托勒密", "伽利略", "哥白尼"], "answer": 3, "explanation": "波蘭天文學家哥白尼在 1543 年出版《天體運行論》，主張太陽而非地球位於中心，挑戰了托勒密的地心說。", "fun_fact": "這本書據說在他臨終那年才印行出版。", "region": "世界"}, {"id": "wd-087", "topic": "history", "category": "中世紀與十字軍", "difficulty": 1, "type": "choice", "question": "中世紀十字軍東征的主要目標，是要奪取哪一座城市？", "options": ["君士坦丁堡", "大馬士革", "耶路撒冷", "亞歷山大港"], "answer": 2, "explanation": "十字軍東征以奪回被視為聖地的耶路撒冷為號召，第一次東征在 1099 年攻下該城。", "fun_fact": "十字軍東征前後延續了將近兩百年。", "region": "世界"}, {"id": "wd-088", "topic": "history", "category": "古文明", "difficulty": 1, "type": "choice", "question": "古埃及人最常用來書寫的紙狀材料是什麼？", "options": ["莎草紙", "羊皮紙", "竹簡", "泥板"], "answer": 0, "explanation": "古埃及人把尼羅河畔的莎草莖剖成薄片，交錯壓製成莎草紙來書寫。泥板是兩河流域的用法，竹簡則出自古代中國。", "fun_fact": "英文的 paper（紙）就來自莎草紙的名稱 papyrus。", "region": "世界"}, {"id": "wd-089", "topic": "history", "category": "第二次世界大戰", "difficulty": 1, "type": "choice", "question": "第二次世界大戰在哪一年結束？", "options": ["1943 年", "1944 年", "1945 年", "1946 年"], "answer": 2, "explanation": "德國在 1945 年 5 月投降，日本在同年 8 月宣布投降、9 月簽署降書，第二次世界大戰結束。", "fun_fact": "同一年 10 月，聯合國正式成立。", "region": "世界"}, {"id": "wd-090", "topic": "history", "category": "古文明", "difficulty": 2, "type": "choice", "question": "著名的《漢摩拉比法典》出自下列哪一個古文明？", "options": ["尼羅河畔的古埃及", "印度河畔的古印度", "兩河流域的巴比倫", "黃河流域的古中國"], "answer": 2, "explanation": "《漢摩拉比法典》約在西元前 18 世紀由古巴比倫國王漢摩拉比頒布，是現存最完整的早期成文法典之一。", "fun_fact": "刻著法典的黑色石柱現在收藏在巴黎羅浮宮。", "region": "世界"}, {"id": "wd-091", "topic": "history", "category": "工業革命", "difficulty": 2, "type": "choice", "question": "18 世紀的工業革命最早發生在哪一個國家？", "options": ["法國", "德國", "美國", "英國"], "answer": 3, "explanation": "工業革命約於 18 世紀中葉從英國的紡織業與煤鐵工業開始，之後才擴散到歐陸與美國。", "fun_fact": "當時英國的棉紡織廠先集中在曼徹斯特一帶，那裡因此被稱為「棉都」。", "region": "世界"}, {"id": "wd-092", "topic": "history", "category": "工業革命", "difficulty": 2, "type": "choice", "question": "大幅改良蒸汽機效率、對工業革命影響深遠的蘇格蘭工程師是誰？", "options": ["史蒂芬生", "法拉第", "富爾頓", "瓦特"], "answer": 3, "explanation": "瓦特在 1769 年取得分離式冷凝器的專利，大幅提升蒸汽機效率，讓蒸汽動力得以廣泛應用於工廠與運輸。", "fun_fact": "功率單位「瓦特」就是以他命名的。", "region": "世界"}, {"id": "wd-093", "topic": "history", "category": "重要條約", "difficulty": 2, "type": "choice", "question": "第一次世界大戰結束後，協約國與德國在 1919 年簽訂的和約是？", "options": ["凡爾賽條約", "烏得勒支條約", "維也納和約", "樸茨茅斯條約"], "answer": 0, "explanation": "1919 年協約國與德國在巴黎近郊的凡爾賽宮簽訂《凡爾賽條約》，正式結束第一次世界大戰。", "fun_fact": "簽約地點鏡廳，正是 1871 年德意志帝國宣告成立的同一個大廳。", "region": "世界"}, {"id": "wd-094", "topic": "history", "category": "文藝復興", "difficulty": 2, "type": "choice", "question": "歐洲文藝復興最早發源於哪一個國家？", "options": ["法國", "義大利", "荷蘭", "西班牙"], "answer": 1, "explanation": "文藝復興於 14 世紀從義大利的佛羅倫斯等城市開始，之後才向西歐與北歐擴散。", "fun_fact": "佛羅倫斯的梅迪奇家族長期贊助藝術家，對文藝復興的發展影響很大。", "region": "世界"}, {"id": "wd-095", "topic": "history", "category": "宗教改革", "difficulty": 2, "type": "choice", "question": "1517 年發表《九十五條論綱》、引發歐洲宗教改革的是誰？", "options": ["喀爾文", "伊拉斯謨", "馬丁路德", "亨利八世"], "answer": 2, "explanation": "德國神學家馬丁路德在 1517 年提出《九十五條論綱》，質疑贖罪券的作法，引發宗教改革。", "fun_fact": "他把《聖經》譯成德文，對現代德語的定型也有很大影響。", "region": "世界"}, {"id": "wd-096", "topic": "history", "category": "太空競賽", "difficulty": 2, "type": "choice", "question": "人類第一顆人造衛星「史普尼克一號」是由哪個國家發射的？", "options": ["美國", "蘇聯", "德國", "英國"], "answer": 1, "explanation": "蘇聯在 1957 年 10 月 4 日發射史普尼克一號，成為第一顆繞地球運行的人造衛星，也揭開太空競賽序幕。", "fun_fact": "它只是個直徑約 58 公分的金屬球，靠無線電持續發出「嗶、嗶」的訊號。", "region": "世界"}, {"id": "wd-097", "topic": "history", "category": "大航海時代", "difficulty": 2, "type": "choice", "question": "1498 年繞過非洲南端、開通歐洲直達印度海路的葡萄牙航海家是誰？", "options": ["迪亞士", "哥倫布", "卡布拉爾", "達伽馬"], "answer": 3, "explanation": "達伽馬在 1497 年出發，繞過好望角後於 1498 年抵達印度西岸的卡利刻特，開通歐印海路。迪亞士則是更早繞行好望角，但沒有抵達印度。", "fun_fact": "這條航線讓葡萄牙能直接買到香料，繞開了原本由中東與威尼斯商人把持的轉手貿易。", "region": "世界"}, {"id": "wd-098", "topic": "history", "category": "古文明", "difficulty": 2, "type": "choice", "question": "亞歷山大大帝少年時期的老師是哪一位哲學家？", "options": ["蘇格拉底", "柏拉圖", "畢達哥拉斯", "亞里斯多德"], "answer": 3, "explanation": "馬其頓國王腓力二世聘請亞里斯多德擔任王子亞歷山大的老師，教導他哲學、文學與科學。", "fun_fact": "這三位哲學家剛好是師徒相承：蘇格拉底教柏拉圖，柏拉圖教亞里斯多德。", "region": "世界"}, {"id": "wd-099", "topic": "history", "category": "中世紀", "difficulty": 3, "type": "choice", "question": "1453 年攻陷君士坦丁堡、終結東羅馬帝國的是哪一個勢力？", "options": ["鄂圖曼帝國", "波斯帝國", "蒙古帝國", "阿拉伯帝國"], "answer": 0, "explanation": "鄂圖曼蘇丹穆罕默德二世在 1453 年攻下君士坦丁堡，東羅馬（拜占庭）帝國滅亡，該城後來稱為伊斯坦堡。", "fun_fact": "許多史家把這一年當作中世紀結束、近代開始的分界之一。", "region": "世界"}, {"id": "wd-100", "topic": "history", "category": "重要條約", "difficulty": 3, "type": "choice", "question": "結束歐洲三十年戰爭、常被視為近代主權國家體系起點的和約是？", "options": ["奧格斯堡和約", "烏得勒支條約", "維也納和約", "西發里亞和約"], "answer": 3, "explanation": "1648 年簽訂的《西發里亞和約》結束三十年戰爭，確立各邦國領土主權互不干涉的原則。", "fun_fact": "國際關係學界至今仍常用「西發里亞體系」來指稱以主權國家為單位的國際秩序。", "region": "世界"}, {"id": "wd-101", "topic": "history", "category": "第二次世界大戰", "difficulty": 3, "type": "choice", "question": "1945 年 2 月的雅爾達會議，是由哪三個國家的領袖會談？", "options": ["美國、英國、蘇聯", "美國、英國、法國", "美國、蘇聯、中國", "英國、法國、蘇聯"], "answer": 0, "explanation": "雅爾達會議由美國羅斯福、英國邱吉爾與蘇聯史達林在克里米亞的雅爾達舉行，商討戰後歐洲安排與對日作戰。", "fun_fact": "同年 7 月的波茨坦會議再度召開時，羅斯福已過世、邱吉爾也在會議期間因大選失利而換人。", "region": "世界"}, {"id": "wd-102", "topic": "history", "category": "古文明", "difficulty": 3, "type": "choice", "question": "一般史書把西羅馬帝國滅亡訂在西元哪一年？", "options": ["西元 395 年", "西元 476 年", "西元 800 年", "西元 1453 年"], "answer": 1, "explanation": "西元 476 年，日耳曼將領奧多亞塞廢黜西羅馬末代皇帝羅慕路斯·奧古斯都路斯，通常以此作為西羅馬帝國滅亡之年。", "fun_fact": "羅馬帝國在 395 年分裂為東西兩部分，東羅馬帝國又延續了將近一千年。", "region": "世界"}], "human": [{"id": "tw-011", "category": "文化", "difficulty": 1, "type": "choice", "question": "俗語「北天燈、南蜂炮」說的是哪一個節日的活動？", "options": ["中秋節", "端午節", "中元節", "元宵節"], "answer": 3, "explanation": "元宵節時，新北平溪放天燈、台南鹽水放蜂炮。", "fun_fact": "參加鹽水蜂炮要全副武裝：安全帽、口罩、厚外套一樣都不能少。", "topic": "human", "region": "台灣"}, {"id": "tw-012", "category": "文化", "difficulty": 1, "type": "choice", "question": "媽祖信仰最初主要守護的是哪一類人？", "options": ["商人", "讀書人", "農夫", "航海者與漁民"], "answer": 3, "explanation": "媽祖被視為海上守護神，保佑航海平安。", "fun_fact": "大甲媽祖遶境是台灣最有名的宗教活動之一，徒步行程長達九天八夜。", "topic": "human", "region": "台灣"}, {"id": "tw-013", "category": "文化", "difficulty": 1, "type": "choice", "question": "珍珠奶茶起源於台灣。", "options": ["對", "錯"], "answer": 0, "explanation": "珍珠奶茶在 1980 年代於台灣誕生。", "fun_fact": "到底是哪一家店發明的，台中和台南各有說法。", "topic": "human", "region": "台灣"}, {"id": "tw-014", "category": "文化", "difficulty": 2, "type": "choice", "question": "每年四、五月，客家庄常舉辦以哪一種花為主題的節慶？", "options": ["荷花", "櫻花", "油桐花", "向日葵"], "answer": 2, "explanation": "客家桐花祭在油桐花盛開的季節舉辦。", "fun_fact": "油桐花落滿地像下雪一樣，被稱為「五月雪」。", "topic": "human", "region": "台灣"}, {"id": "tw-015", "category": "文化", "difficulty": 2, "type": "choice", "question": "台語「呷飯皇帝大」的意思最接近下列哪一個？", "options": ["吃飯要有禮貌", "吃太多會變胖", "皇帝吃飯的排場最大", "吃飯最重要，什麼事都等吃完再說"], "answer": 3, "explanation": "意思是吃飯最大，再重要的事也要先讓人好好吃飯。", "fun_fact": "類似的俗語還有「食飯配菜脯，儉錢開店鋪」。", "topic": "human", "region": "台灣"}, {"id": "tw-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "蘭嶼達悟族最重要的歲時祭儀，與哪一種魚的季節洄游有關？", "options": ["鮭魚", "虱目魚", "飛魚", "鯛魚"], "answer": 2, "explanation": "每年春夏飛魚隨黑潮而來，達悟族依飛魚季節安排祭儀、捕撈與生活禁忌。", "fun_fact": "達悟族傳統的拼板舟由許多木板拼接而成，船頭常雕有象徵「船眼」的同心圓圖案。", "topic": "human", "region": "台灣"}, {"id": "tw-040", "category": "文化", "difficulty": 3, "type": "choice", "question": "每兩年舉辦一次、每十年一次大祭的「矮靈祭」，是哪一族的祭典？", "options": ["賽夏族", "阿美族", "布農族", "排灣族"], "answer": 0, "explanation": "矮靈祭（paSta'ay）是賽夏族最重要的祭典，主要在苗栗南庄與新竹五峰舉行。", "fun_fact": "相傳矮人曾教導賽夏族農耕與歌舞，後來雙方發生衝突，族人便以祭典安撫矮靈。", "topic": "human", "region": "台灣"}, {"id": "tw-041", "category": "文化", "difficulty": 2, "type": "choice", "question": "以「八部合音」（祈禱小米豐收歌）聞名的原住民族是？", "options": ["布農族", "達悟族", "魯凱族", "泰雅族"], "answer": 0, "explanation": "布農族的「祈禱小米豐收歌」（pasibutbut）以多聲部合唱著稱，俗稱八部合音。", "fun_fact": "1943 年日本學者黑澤隆朝來台調查時錄下這首歌，1952 年將錄音寄給國際民俗音樂協會，引起西方音樂學界的注意。", "topic": "human", "region": "台灣"}, {"id": "tw-042", "category": "文化", "difficulty": 3, "type": "choice", "question": "過去以「紋面」象徵成年，女子要擅長織布才能紋面的原住民族是？", "options": ["泰雅族", "阿美族", "排灣族", "達悟族"], "answer": 0, "explanation": "泰雅族傳統上男子要能狩獵、女子要會織布，才有資格紋面，象徵成年與榮耀。", "fun_fact": "除了泰雅族，太魯閣族和賽德克族也有紋面傳統。", "topic": "human", "region": "台灣"}, {"id": "tw-043", "category": "文化", "difficulty": 2, "type": "choice", "question": "台南小吃「棺材板」的外皮，是用什麼做成的？", "options": ["蛋皮", "厚片吐司", "麵餅", "米糕"], "answer": 1, "explanation": "棺材板是把厚片吐司炸酥後挖空，填入雞肉、海鮮、蔬菜等勾芡內餡，再蓋上吐司蓋。", "fun_fact": "據說它原本叫「雞肝板」，後來有位教授覺得外型像棺材，才有了這個名字。", "topic": "human", "region": "台灣"}, {"id": "tw-044", "category": "文化", "difficulty": 3, "type": "choice", "question": "客家人在農曆正月二十過「天穿日」，是紀念哪一位神話人物？", "options": ["嫦娥", "女媧", "盤古", "后羿"], "answer": 1, "explanation": "相傳女媧在這一天煉石補天，所以稱為「天穿日」。", "fun_fact": "客家委員會曾在 2010 年將天穿日訂為「全國客家日」，2022 年起改為 12 月 28 日的「還我母語運動日」。", "topic": "human", "region": "台灣"}, {"id": "tw-045", "category": "文化", "difficulty": 1, "type": "choice", "question": "台語俗諺「呷緊弄破碗」的意思是？", "options": ["動作快的人比較能幹", "吃飯時要小心拿好碗", "打破碗會帶來好運", "做事太急反而容易出錯"], "answer": 3, "explanation": "字面意思是吃太快會把碗打破，比喻做事心急反而會壞事。", "fun_fact": "意思和成語「欲速則不達」很接近。", "topic": "human", "region": "台灣"}, {"id": "tw-046", "category": "文化", "difficulty": 2, "type": "choice", "question": "民間俗稱「土地公」的神明，正式名稱是？", "options": ["開漳聖王", "福德正神", "保生大帝", "清水祖師"], "answer": 1, "explanation": "土地公的正式神號是「福德正神」，是台灣最普遍的民間信仰神明之一。", "fun_fact": "農曆二月初二土地公生是商家的「頭牙」，十二月十六的「尾牙」也是祭拜土地公的日子。", "topic": "human", "region": "台灣"}, {"id": "tw-047", "category": "文化", "difficulty": 2, "type": "choice", "question": "電視布袋戲《雲州大儒俠》的主角是誰？", "options": ["史艷文", "素還真", "楚留香", "孫悟空"], "answer": 0, "explanation": "《雲州大儒俠》由黃俊雄製作，1970 年在台視播出，主角史艷文紅遍全台。", "fun_fact": "據說當年收視率一度超過九成，播出時街上幾乎看不到人。", "topic": "human", "region": "台灣"}, {"id": "tw-048", "category": "文化", "difficulty": 2, "type": "choice", "question": "歌仔戲是在台灣發展形成的戲曲，一般認為起源於宜蘭。", "options": ["對", "錯"], "answer": 0, "explanation": "一般認為歌仔戲由宜蘭一帶的「本地歌仔」發展而來，是少數在台灣形成的傳統戲曲。", "fun_fact": "位於宜蘭五結的國立傳統藝術中心宜蘭傳藝園區，常有歌仔戲演出。", "topic": "human", "region": "台灣"}, {"id": "tw-049", "category": "文化", "difficulty": 1, "type": "choice", "question": "蚵仔煎裡的「蚵仔」指的是蛤蜊。", "options": ["對", "錯"], "answer": 1, "explanation": "蚵仔指的是牡蠣，蛤蜊在台語中則叫「蚶仔」或「粉蟯」。", "fun_fact": "蚵仔煎的粉漿主要用番薯粉調製，才會有 Q 彈的口感。", "topic": "human", "region": "台灣"}, {"id": "tw-050", "category": "文化", "difficulty": 1, "type": "choice", "question": "台灣民間的「中元普渡」是在農曆八月十五日。", "options": ["對", "錯"], "answer": 1, "explanation": "中元節是農曆七月十五日；農曆八月十五日是中秋節。", "fun_fact": "整個農曆七月俗稱「鬼月」，基隆中元祭的放水燈是很有名的活動。", "topic": "human", "region": "台灣"}, {"id": "tw-051", "category": "文化", "difficulty": 1, "type": "order", "question": "請依農曆日期先後排出這些節日：", "options": ["端午節", "元宵節", "七夕", "中秋節"], "answer": [1, 0, 2, 3], "explanation": "元宵節正月十五 → 端午節五月初五 → 七夕七月初七 → 中秋節八月十五。", "fun_fact": "台南有在七夕為滿 16 歲孩子舉辦「做十六歲」成年禮的習俗。", "topic": "human", "region": "台灣"}, {"id": "cn-005", "category": "文化", "difficulty": 1, "type": "choice", "question": "下列哪一項「不是」中國古代的四大發明？", "options": ["指南針", "火藥", "造紙術", "地動儀"], "answer": 3, "explanation": "四大發明是造紙術、印刷術、火藥和指南針。", "fun_fact": "地動儀是東漢張衡發明的，用來偵測地震的方位。", "topic": "human", "region": "中國"}, {"id": "cn-006", "category": "文化", "difficulty": 1, "type": "choice", "question": "傳說端午節是為了紀念哪一位人物？", "options": ["屈原", "岳飛", "孔子", "諸葛亮"], "answer": 0, "explanation": "一般流傳端午節是紀念戰國時代楚國的屈原。", "fun_fact": "包粽子、划龍舟，據說都是為了不讓魚蝦吃掉屈原。", "topic": "human", "region": "中國"}, {"id": "cn-007", "category": "文化", "difficulty": 1, "type": "choice", "question": "十二生肖中排第一的是？", "options": ["鼠", "虎", "龍", "牛"], "answer": 0, "explanation": "十二生肖依序為鼠、牛、虎、兔、龍、蛇、馬、羊、猴、雞、狗、豬。", "fun_fact": "傳說老鼠騎在牛背上，在終點前一跳就搶到了第一名。", "topic": "human", "region": "中國"}, {"id": "cn-008", "category": "文化", "difficulty": 2, "type": "choice", "question": "京劇臉譜中，紅色臉通常代表什麼性格？", "options": ["忠勇正直", "滑稽搞笑", "兇猛暴躁", "陰險狡詐"], "answer": 0, "explanation": "紅臉象徵忠勇正直。", "fun_fact": "最有名的紅臉就是關公；白臉則常用來表示奸詐，例如曹操。", "topic": "human", "region": "中國"}, {"id": "cn-009", "category": "文化", "difficulty": 2, "type": "choice", "question": "「學而時習之，不亦說乎」出自哪一部經典？", "options": ["孟子", "道德經", "大學", "論語"], "answer": 3, "explanation": "這句話是《論語》的第一句。", "fun_fact": "這裡的「說」讀作「悅」，意思是快樂。", "topic": "human", "region": "中國"}, {"id": "cn-010", "category": "文化", "difficulty": 2, "type": "choice", "question": "一般認為《西遊記》的作者是誰？", "options": ["羅貫中", "曹雪芹", "吳承恩", "施耐庵"], "answer": 2, "explanation": "《西遊記》一般認為是明代吳承恩所作。", "fun_fact": "唐僧的原型是唐代真實存在的高僧玄奘。", "topic": "human", "region": "中國"}, {"id": "cn-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "在北半球，二十四節氣中白天最長的是哪一個？", "options": ["立夏", "春分", "冬至", "夏至"], "answer": 3, "explanation": "夏至時太陽直射北回歸線，北半球白天最長；冬至則是白天最短。", "fun_fact": "北回歸線通過台灣的嘉義和花蓮，夏至正午時太陽幾乎就在頭頂正上方。", "topic": "human", "region": "中國"}, {"id": "cn-040", "category": "文化", "difficulty": 3, "type": "choice", "question": "二十四節氣是根據月亮的圓缺（陰曆）制定的。", "options": ["對", "錯"], "answer": 1, "explanation": "二十四節氣是依太陽在黃道上的位置劃分的，其實屬於陽曆系統。", "fun_fact": "所以節氣在國曆上的日期幾乎固定，例如清明大多落在 4 月 4 日或 5 日。", "topic": "human", "region": "中國"}, {"id": "cn-041", "category": "文化", "difficulty": 1, "type": "choice", "question": "「麻婆豆腐」屬於哪一個菜系？", "options": ["魯菜", "粵菜", "淮揚菜", "川菜"], "answer": 3, "explanation": "麻婆豆腐是四川名菜，以花椒的「麻」和辣椒的「辣」為特色。", "fun_fact": "相傳這道菜出自清代成都一家小飯館的老闆娘，因她臉上有麻子，人稱「陳麻婆」。", "topic": "human", "region": "中國"}, {"id": "cn-042", "category": "文化", "difficulty": 1, "type": "choice", "question": "名菜「東坡肉」相傳與哪位文人有關？", "options": ["蘇軾", "李白", "白居易", "杜甫"], "answer": 0, "explanation": "蘇軾號東坡居士，相傳他愛吃燉豬肉，東坡肉因此得名。", "fun_fact": "蘇軾還寫過〈豬肉頌〉：「淨洗鐺，少著水，柴頭罨煙焰不起。待他自熟莫催他，火候足時他自美。」", "topic": "human", "region": "中國"}, {"id": "cn-043", "category": "文化", "difficulty": 2, "type": "choice", "question": "京劇角色分為「生、旦、淨、丑」，其中「旦」指的是？", "options": ["丑角", "女性角色", "畫臉譜的花臉", "老年男性"], "answer": 1, "explanation": "「旦」是京劇中的女性角色；生是男性，淨是花臉，丑是丑角。", "fun_fact": "早期京劇的旦角多由男性演員扮演，梅蘭芳就是著名的男旦。", "topic": "human", "region": "中國"}, {"id": "cn-044", "category": "文化", "difficulty": 2, "type": "choice", "question": "被尊為「書聖」，寫下《蘭亭集序》的書法家是？", "options": ["柳公權", "王羲之", "顏真卿", "蘇軾"], "answer": 1, "explanation": "東晉王羲之的行書《蘭亭集序》被譽為「天下第一行書」。", "fun_fact": "相傳《蘭亭集序》真跡被唐太宗帶進陵墓陪葬，今日所見都是摹本。", "topic": "human", "region": "中國"}, {"id": "cn-045", "category": "文化", "difficulty": 1, "type": "choice", "question": "《三國演義》中「桃園三結義」的三個人，不包括誰？", "options": ["張飛", "趙雲", "關羽", "劉備"], "answer": 1, "explanation": "桃園三結義是劉備、關羽、張飛三人結為兄弟。", "fun_fact": "「桃園結義」是小說情節，正史《三國志》並沒有這段記載。", "topic": "human", "region": "中國"}, {"id": "cn-046", "category": "文化", "difficulty": 1, "type": "choice", "question": "「文房四寶」不包括下列哪一項？", "options": ["印章", "筆", "墨", "硯"], "answer": 0, "explanation": "文房四寶是筆、墨、紙、硯。", "fun_fact": "其中最有名的是湖筆、徽墨、宣紙和端硯。", "topic": "human", "region": "中國"}, {"id": "cn-047", "category": "文化", "difficulty": 2, "type": "choice", "question": "成語「朝三暮四」的典故中，被騙的是哪種動物？", "options": ["羊", "猴子", "雞", "馬"], "answer": 1, "explanation": "《莊子．齊物論》記載養猴人說早上給三份、晚上給四份橡實，猴子大怒；改成早上四份、晚上三份，猴子就高興了。", "fun_fact": "這個成語原本是指用手段欺騙人，後來才多用來形容反覆無常。", "topic": "human", "region": "中國"}, {"id": "cn-048", "category": "文化", "difficulty": 3, "type": "choice", "question": "傳說「寒食節」禁火吃冷食，是為了紀念哪位人物？", "options": ["晉文公", "屈原", "伍子胥", "介之推"], "answer": 3, "explanation": "相傳晉文公放火燒山想逼介之推出來做官，介之推卻抱樹而死，於是訂下這天禁火。", "fun_fact": "寒食節就在清明前一兩天，後來習俗逐漸和清明節合併。", "topic": "human", "region": "中國"}, {"id": "cn-049", "category": "文化", "difficulty": 1, "type": "choice", "question": "民間傳說中，過年貼春聯、放鞭炮，是為了嚇跑怕紅色和巨響的「年獸」。", "options": ["對", "錯"], "answer": 0, "explanation": "相傳年獸會在除夕出來傷人，但牠害怕紅色、火光和聲響，人們就用這些方法驅趕牠。", "fun_fact": "民間也有一說，「過年」的意思就是平安度過年獸這一關。", "topic": "human", "region": "中國"}, {"id": "wd-013", "category": "文化", "difficulty": 1, "type": "choice", "question": "奧運五環象徵的是什麼？", "options": ["五種美德", "五種運動", "五大洲的團結", "五個創始國"], "answer": 2, "explanation": "五環代表五大洲的團結與相聚。", "fun_fact": "據創辦人顧拜旦的說法，五環的五種顏色加上白色底，可以組出當時所有參賽國國旗上的顏色。", "topic": "human", "region": "世界"}, {"id": "wd-014", "category": "文化", "difficulty": 2, "type": "choice", "question": "依聯合國估計，印度的人口已經超越中國，成為世界第一。", "options": ["對", "錯"], "answer": 0, "explanation": "聯合國估計印度人口在 2023 年超越中國。", "fun_fact": "這是自有人口統計以來，中國第一次不是世界人口最多的國家。", "topic": "human", "region": "世界"}, {"id": "wd-015", "category": "文化", "difficulty": 3, "type": "choice", "question": "「相對論」是由哪一位科學家提出的？", "options": ["霍金", "牛頓", "愛因斯坦", "居禮夫人"], "answer": 2, "explanation": "愛因斯坦在 1905 年提出狹義相對論，1915 年提出廣義相對論。", "fun_fact": "愛因斯坦的諾貝爾獎其實是因為「光電效應」，不是相對論。", "topic": "human", "region": "世界"}, {"id": "wd-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "以互丟番茄聞名的「番茄大戰」節慶，是在哪個國家舉行？", "options": ["西班牙", "葡萄牙", "墨西哥", "義大利"], "answer": 0, "explanation": "番茄大戰（La Tomatina）每年 8 月最後一個星期三，在西班牙瓦倫西亞地區的小鎮布尼奧爾舉行。", "fun_fact": "為了安全，規定參加者丟番茄前要先把番茄捏爛，免得砸傷人。", "topic": "human", "region": "世界"}, {"id": "wd-040", "category": "文化", "difficulty": 1, "type": "choice", "question": "迪士尼皮克斯電影《可可夜總會》的故事背景，是哪個國家的「亡靈節」？", "options": ["西班牙", "墨西哥", "秘魯", "巴西"], "answer": 1, "explanation": "亡靈節是墨西哥的傳統節日，人們在 11 月初布置祭壇，迎接過世親人的靈魂回家團聚。", "fun_fact": "亡靈節常用橘色的萬壽菊裝飾，相傳花的顏色和香氣能為亡靈指引回家的路。", "topic": "human", "region": "世界"}, {"id": "wd-041", "category": "文化", "difficulty": 1, "type": "choice", "question": "名畫《星夜》是哪一位畫家的作品？", "options": ["畢卡索", "雷諾瓦", "莫內", "梵谷"], "answer": 3, "explanation": "《星夜》是荷蘭畫家梵谷在 1889 年的作品，現藏於紐約現代藝術博物館。", "fun_fact": "梵谷畫這幅畫時住在法國聖雷米的療養院，畫的是他從房間窗戶望出去的景色（再加上想像）。", "topic": "human", "region": "世界"}, {"id": "wd-042", "category": "文化", "difficulty": 1, "type": "choice", "question": "馬拉松全程的標準距離是多少公里？", "options": ["40 公里", "45 公里", "42.195 公里", "50 公里"], "answer": 2, "explanation": "馬拉松全程的標準距離是 42.195 公里。", "fun_fact": "這個有零有整的數字，一般認為來自 1908 年倫敦奧運，為了讓終點落在王室包廂前而定下的路線長度。", "topic": "human", "region": "世界"}, {"id": "wd-043", "category": "文化", "difficulty": 1, "type": "choice", "question": "泰國的「潑水節」（宋干節）是在慶祝什麼？", "options": ["國王生日", "雨季開始", "稻米豐收", "傳統新年"], "answer": 3, "explanation": "宋干節是泰國的傳統新年，在每年 4 月中旬，人們互相潑水，象徵洗去霉運、迎接新年。", "fun_fact": "潑水原本是很溫和的儀式，是向長輩的手上輕輕灑水表示祝福。", "topic": "human", "region": "世界"}, {"id": "wd-044", "category": "文化", "difficulty": 2, "type": "choice", "question": "韓文（諺文）是由朝鮮王朝哪一位國王主導創制的？", "options": ["高宗", "太祖李成桂", "正祖", "世宗大王"], "answer": 3, "explanation": "世宗大王在 1443 年創制韓文，並於 1446 年以《訓民正音》頒布，讓一般百姓也能讀寫。", "fun_fact": "韓國一萬元紙鈔上的人像，就是世宗大王。", "topic": "human", "region": "世界"}, {"id": "wd-045", "category": "文化", "difficulty": 2, "type": "choice", "question": "日本的傳統節日「七五三」，是為哪些人祈福？", "options": ["新婚夫妻", "兒童", "考生", "長輩"], "answer": 1, "explanation": "七五三是日本家長帶 3 歲、5 歲、7 歲的孩子到神社參拜，感謝並祈求孩子健康成長的節日，通常在 11 月。", "fun_fact": "孩子會拿到細長的「千歲飴」糖果，象徵長命百歲。", "topic": "human", "region": "世界"}, {"id": "wd-046", "category": "文化", "difficulty": 2, "type": "choice", "question": "貝多芬創作《第九號交響曲》（包含《快樂頌》）的時候，聽力已經幾乎完全喪失。", "options": ["對", "錯"], "answer": 0, "explanation": "正確。貝多芬在 1824 年首演第九號交響曲時已經幾乎全聾，平日要靠「對話簿」與人筆談，只能憑內心的聽覺與記憶完成這部作品。", "fun_fact": "相傳首演結束時他聽不到掌聲，是一位歌手把他轉過身來，他才看到觀眾熱烈鼓掌。", "topic": "human", "region": "世界"}, {"id": "wd-047", "category": "文化", "difficulty": 2, "type": "order", "question": "請依「第一次舉辦夏季奧運」的年份先後，排出這四座城市：", "options": ["雪梨", "巴黎", "東京", "首爾"], "answer": [1, 2, 3, 0], "explanation": "巴黎 1900 年 → 東京 1964 年 → 首爾 1988 年 → 雪梨 2000 年。", "fun_fact": "東京原本取得 1940 年奧運的主辦權，後來因為中日戰爭而在 1938 年放棄主辦。", "topic": "human", "region": "世界"}, {"id": "wd-048", "category": "文化", "difficulty": 3, "type": "choice", "question": "萬聖節的「傑克燈」，最早就是用南瓜雕刻而成的。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。一般認為傑克燈的傳統來自愛爾蘭和蘇格蘭，最早是用蕪菁等根莖類蔬菜雕刻；移民到美洲後，才改用又大又好刻的南瓜。南瓜原產於美洲，歐洲早期也沒有南瓜可用。", "fun_fact": "", "topic": "human", "region": "世界"}, {"id": "wd-049", "category": "文化", "difficulty": 3, "type": "choice", "question": "電影《印第安納瓊斯：聖戰奇兵》取景的玫瑰色古城「佩特拉」，位於哪個國家？", "options": ["伊朗", "約旦", "埃及", "土耳其"], "answer": 1, "explanation": "佩特拉位於約旦南部，是古代納巴泰人在砂岩峭壁上鑿出的城市，已列為世界遺產。", "fun_fact": "因為岩石呈現粉紅色，佩特拉又被稱為「玫瑰城」。", "topic": "human", "region": "世界"}, {"id": "wd-050", "category": "文化", "difficulty": 3, "type": "choice", "question": "西班牙名菜「西班牙燉飯」（Paella）發源於哪個地區？", "options": ["塞維亞", "巴塞隆納", "馬德里", "瓦倫西亞"], "answer": 3, "explanation": "西班牙燉飯發源於東部的瓦倫西亞，Paella 原本指的是煮飯用的淺底雙耳平底鍋。", "fun_fact": "傳統的瓦倫西亞燉飯其實是放雞肉、兔肉和豆子，並不是海鮮。", "topic": "human", "region": "世界"}, {"id": "po-001", "category": "接句", "difficulty": 1, "type": "choice", "question": "「床前明月光，疑是地上霜」的下一句是？", "options": ["明月幾時有", "低頭思故鄉", "月落烏啼霜滿天", "舉頭望明月"], "answer": 3, "explanation": "出自李白〈靜夜思〉：床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。", "fun_fact": "這裡的「床」，有學者認為指的是井邊的欄杆。", "topic": "human", "region": "古典詩詞"}, {"id": "po-002", "category": "接句", "difficulty": 1, "type": "choice", "question": "「白日依山盡，黃河入海流」的下一句是？", "options": ["孤帆遠影碧空盡", "欲窮千里目", "春風不度玉門關", "更上一層樓"], "answer": 1, "explanation": "出自王之渙〈登鸛雀樓〉：欲窮千里目，更上一層樓。", "fun_fact": "鸛雀樓位在今天的山西永濟。", "topic": "human", "region": "古典詩詞"}, {"id": "po-003", "category": "接句", "difficulty": 1, "type": "choice", "question": "「野火燒不盡」的下一句是？", "options": ["離離原上草", "春風吹又生", "遠芳侵古道", "一歲一枯榮"], "answer": 1, "explanation": "出自白居易〈賦得古原草送別〉。", "fun_fact": "傳說白居易年輕時靠這首詩讓前輩顧況刮目相看。", "topic": "human", "region": "古典詩詞"}, {"id": "po-004", "category": "作者", "difficulty": 1, "type": "choice", "question": "「春眠不覺曉，處處聞啼鳥」的作者是？", "options": ["杜甫", "孟浩然", "王維", "李白"], "answer": 1, "explanation": "出自孟浩然〈春曉〉。", "fun_fact": "孟浩然是唐代山水田園詩的代表人物之一。", "topic": "human", "region": "古典詩詞"}, {"id": "po-005", "category": "作者", "difficulty": 1, "type": "choice", "question": "「誰知盤中飧，粒粒皆辛苦」的作者是？", "options": ["李商隱", "白居易", "杜牧", "李紳"], "answer": 3, "explanation": "出自李紳〈憫農〉。", "fun_fact": "「飧」讀作「ㄙㄨㄣ」，指熟食、飯菜。", "topic": "human", "region": "古典詩詞"}, {"id": "po-006", "category": "作者", "difficulty": 1, "type": "choice", "question": "「慈母手中線，遊子身上衣」出自哪一首詩？", "options": ["靜夜思", "春曉", "遊子吟", "相思"], "answer": 2, "explanation": "出自孟郊〈遊子吟〉。", "fun_fact": "孟郊五十歲才當上小官，這首詩寫於迎接母親同住之時。", "topic": "human", "region": "古典詩詞"}, {"id": "po-007", "category": "作者", "difficulty": 2, "type": "choice", "question": "被後人稱為「詩聖」的是哪一位詩人？", "options": ["白居易", "杜甫", "李白", "王維"], "answer": 1, "explanation": "杜甫被稱為詩聖，李白是詩仙，王維是詩佛。", "fun_fact": "李賀因為詩風奇詭，被稱為「詩鬼」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-008", "category": "作者", "difficulty": 2, "type": "choice", "question": "「海內存知己，天涯若比鄰」的作者是？", "options": ["王維", "王昌齡", "王之渙", "王勃"], "answer": 3, "explanation": "出自王勃〈送杜少府之任蜀州〉。", "fun_fact": "王勃也寫了名篇〈滕王閣序〉，卻在二十多歲就英年早逝。", "topic": "human", "region": "古典詩詞"}, {"id": "po-009", "category": "作者", "difficulty": 2, "type": "choice", "question": "「大江東去，浪淘盡，千古風流人物」是誰的詞？", "options": ["柳永", "辛棄疾", "李清照", "蘇軾"], "answer": 3, "explanation": "出自蘇軾〈念奴嬌・赤壁懷古〉。", "fun_fact": "蘇軾也是美食家，「東坡肉」就是以他的名號命名的。", "topic": "human", "region": "古典詩詞"}, {"id": "po-010", "category": "作者", "difficulty": 3, "type": "choice", "question": "「人生自古誰無死，留取丹心照汗青」的作者是？", "options": ["岳飛", "于謙", "陸游", "文天祥"], "answer": 3, "explanation": "出自南宋文天祥〈過零丁洋〉。", "fun_fact": "「汗青」指史冊，古代在竹簡上寫字前要先烤出水分，好像出汗一樣。", "topic": "human", "region": "古典詩詞"}, {"id": "po-011", "category": "情境", "difficulty": 1, "type": "choice", "question": "「但願人長久，千里共嬋娟」最常在哪一個節日被引用？", "options": ["中秋節", "清明節", "端午節", "春節"], "answer": 0, "explanation": "出自蘇軾〈水調歌頭〉，寫於中秋，「嬋娟」指月亮。", "fun_fact": "這首詞是蘇軾思念弟弟蘇轍時寫的。", "topic": "human", "region": "古典詩詞"}, {"id": "po-012", "category": "情境", "difficulty": 2, "type": "choice", "question": "「獨在異鄉為異客，每逢佳節倍思親」寫的是哪個節日？", "options": ["重陽節", "元宵節", "七夕", "中秋節"], "answer": 0, "explanation": "出自王維〈九月九日憶山東兄弟〉，九月九日是重陽節。", "fun_fact": "詩中「遍插茱萸少一人」，插茱萸正是重陽習俗。", "topic": "human", "region": "古典詩詞"}, {"id": "po-013", "category": "情境", "difficulty": 2, "type": "choice", "question": "杜甫「會當凌絕頂，一覽眾山小」描寫的是哪一座山？", "options": ["廬山", "泰山", "華山", "黃山"], "answer": 1, "explanation": "出自杜甫〈望嶽〉，「嶽」指東嶽泰山。", "fun_fact": "這是杜甫年輕時的作品，充滿壯志。", "topic": "human", "region": "古典詩詞"}, {"id": "po-014", "category": "情境", "difficulty": 3, "type": "choice", "question": "于謙〈石灰吟〉「粉身碎骨渾不怕，要留清白在人間」歌詠的是什麼？", "options": ["石灰", "玉石", "白雪", "白梅"], "answer": 0, "explanation": "這首詩以石灰自比，表達不怕犧牲、堅守清白的志節。", "fun_fact": "石灰要經過開採、火燒、化成粉，正好對應詩中的過程。", "topic": "human", "region": "古典詩詞"}, {"id": "po-015", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "《唐詩三百首》是唐朝人編選的。", "options": ["對", "錯"], "answer": 1, "explanation": "《唐詩三百首》是清代的蘅塘退士（孫洙）編選的。", "fun_fact": "書中實際收錄的詩超過三百首。", "topic": "human", "region": "古典詩詞"}, {"id": "po-016", "category": "冷知識", "difficulty": 2, "type": "order", "question": "請依年代先後排出這些文人：", "options": ["屈原", "陶淵明", "李白", "蘇軾"], "answer": [0, 1, 2, 3], "explanation": "屈原（戰國）→ 陶淵明（東晉）→ 李白（唐）→ 蘇軾（北宋）。", "fun_fact": "陶淵明的「採菊東籬下，悠然見南山」是田園詩的經典。", "topic": "human", "region": "古典詩詞"}, {"id": "po-017", "category": "接句", "difficulty": 1, "type": "choice", "question": "「兩個黃鸝鳴翠柳」的下一句是？", "options": ["窗含西嶺千秋雪", "門泊東吳萬里船", "一行白鷺上青天", "孤帆遠影碧空盡"], "answer": 2, "explanation": "出自杜甫〈絕句〉：兩個黃鸝鳴翠柳，一行白鷺上青天。窗含西嶺千秋雪，門泊東吳萬里船。", "fun_fact": "這是杜甫住在成都草堂時所寫〈絕句四首〉中的一首。", "topic": "human", "region": "古典詩詞"}, {"id": "po-018", "category": "接句", "difficulty": 1, "type": "choice", "question": "「紅豆生南國」的下一句是？", "options": ["此物最相思", "春風又綠江南岸", "人面桃花相映紅", "春來發幾枝"], "answer": 3, "explanation": "出自王維〈相思〉：紅豆生南國，春來發幾枝。以紅豆寄託相思之情。（此句以通行本為準，另有版本作「秋來發故枝」。）", "fun_fact": "紅豆又被稱為「相思子」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-019", "category": "接句", "difficulty": 1, "type": "choice", "question": "「少小離家老大回」的下一句是？", "options": ["兒童相見不相識", "近鄉情更怯", "鄉音無改鬢毛衰", "笑問客從何處來"], "answer": 2, "explanation": "出自賀知章〈回鄉偶書〉：少小離家老大回，鄉音無改鬢毛衰。寫久別返鄉的感慨。（此句以通行本為準，「衰」另有版本作「催」。）", "fun_fact": "賀知章八十多歲才辭官回鄉，他也是稱李白為「謫仙人」的人。", "topic": "human", "region": "古典詩詞"}, {"id": "po-020", "category": "接句", "difficulty": 1, "type": "choice", "question": "「朝辭白帝彩雲間」的下一句是？", "options": ["千里江陵一日還", "煙花三月下揚州", "兩岸猿聲啼不住", "輕舟已過萬重山"], "answer": 0, "explanation": "出自李白〈早發白帝城〉：朝辭白帝彩雲間，千里江陵一日還。寫順江而下的輕快。", "fun_fact": "一般認為此詩寫於李白被流放夜郎途中遇赦東歸之時，難怪心情如此輕快。", "topic": "human", "region": "古典詩詞"}, {"id": "po-021", "category": "接句", "difficulty": 1, "type": "choice", "question": "「千山鳥飛絕」的下一句是？", "options": ["野渡無人舟自橫", "獨釣寒江雪", "孤舟蓑笠翁", "萬徑人蹤滅"], "answer": 3, "explanation": "出自柳宗元〈江雪〉：千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪。", "fun_fact": "把四句的第一個字連起來，正好是「千萬孤獨」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-022", "category": "接句", "difficulty": 2, "type": "choice", "question": "「在天願作比翼鳥」的下一句是？", "options": ["在地願為連理枝", "七月七日長生殿", "此恨綿綿無絕期", "天長地久有時盡"], "answer": 0, "explanation": "出自白居易〈長恨歌〉，寫唐玄宗與楊貴妃的誓言。", "fun_fact": "傳說比翼鳥只有一隻眼睛、一邊翅膀，必須兩隻並肩才能飛。", "topic": "human", "region": "古典詩詞"}, {"id": "po-023", "category": "接句", "difficulty": 2, "type": "choice", "question": "「勸君更盡一杯酒」的下一句是？", "options": ["客舍青青柳色新", "西出陽關無故人", "一片冰心在玉壺", "春風不度玉門關"], "answer": 1, "explanation": "出自王維〈送元二使安西〉：勸君更盡一杯酒，西出陽關無故人。是送別詩的經典。", "fun_fact": "這首詩後來被譜成琴曲〈陽關三疊〉，流傳至今。", "topic": "human", "region": "古典詩詞"}, {"id": "po-024", "category": "接句", "difficulty": 2, "type": "choice", "question": "「姑蘇城外寒山寺」的下一句是？", "options": ["夜半鐘聲到客船", "江楓漁火對愁眠", "煙籠寒水月籠沙", "月落烏啼霜滿天"], "answer": 0, "explanation": "出自張繼〈楓橋夜泊〉：姑蘇城外寒山寺，夜半鐘聲到客船。寫旅人夜泊的愁思。", "fun_fact": "「姑蘇」就是今天的蘇州，寒山寺因這首詩而名揚天下。", "topic": "human", "region": "古典詩詞"}, {"id": "po-025", "category": "接句", "difficulty": 2, "type": "choice", "question": "「山重水複疑無路」的下一句是？", "options": ["柳暗花明又一村", "衣冠簡樸古風存", "豐年留客足雞豚", "行到水窮處"], "answer": 0, "explanation": "出自陸游〈遊山西村〉：山重水複疑無路，柳暗花明又一村。常用來比喻困境中出現轉機。", "fun_fact": "詩中的「山西村」位在陸游的家鄉浙江紹興一帶，不是山西省。", "topic": "human", "region": "古典詩詞"}, {"id": "po-026", "category": "接句", "difficulty": 3, "type": "choice", "question": "辛棄疾〈破陣子〉「醉裡挑燈看劍」的下一句是？", "options": ["氣吞萬里如虎", "沙場秋點兵", "可憐白髮生", "夢回吹角連營"], "answer": 3, "explanation": "出自辛棄疾〈破陣子・為陳同甫賦壯詞以寄之〉：醉裡挑燈看劍，夢回吹角連營。抒發報國壯志。", "fun_fact": "詞中「馬作的盧飛快」的「的盧」，正是三國時劉備騎過的名馬。", "topic": "human", "region": "古典詩詞"}, {"id": "po-027", "category": "接句", "difficulty": 1, "type": "order", "question": "請依正確順序排出李白〈贈汪倫〉的四句：", "options": ["不及汪倫送我情", "桃花潭水深千尺", "忽聞岸上踏歌聲", "李白乘舟將欲行"], "answer": [3, 2, 1, 0], "explanation": "李白〈贈汪倫〉：李白乘舟將欲行，忽聞岸上踏歌聲。桃花潭水深千尺，不及汪倫送我情。", "fun_fact": "桃花潭位在今天的安徽涇縣。", "topic": "human", "region": "古典詩詞"}, {"id": "po-028", "category": "接句", "difficulty": 3, "type": "order", "question": "請依正確順序排出王翰〈涼州詞〉的四句：", "options": ["欲飲琵琶馬上催", "葡萄美酒夜光杯", "古來征戰幾人回", "醉臥沙場君莫笑"], "answer": [1, 0, 3, 2], "explanation": "王翰〈涼州詞〉：葡萄美酒夜光杯，欲飲琵琶馬上催。醉臥沙場君莫笑，古來征戰幾人回？", "fun_fact": "「涼州詞」其實是曲調名，王之渙也寫過同題的「羌笛何須怨楊柳」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-029", "category": "作者", "difficulty": 1, "type": "choice", "question": "「飛流直下三千尺，疑是銀河落九天」的作者是？", "options": ["李白", "白居易", "杜甫", "王維"], "answer": 0, "explanation": "出自李白〈望廬山瀑布〉，以誇張手法寫瀑布的氣勢。", "fun_fact": "首句「日照香爐生紫煙」的「香爐」，指的是廬山的香爐峰。", "topic": "human", "region": "古典詩詞"}, {"id": "po-030", "category": "作者", "difficulty": 1, "type": "choice", "question": "「國破山河在，城春草木深」的作者是？", "options": ["杜牧", "李白", "陸游", "杜甫"], "answer": 3, "explanation": "出自杜甫〈春望〉，寫安史之亂時長安殘破的景象。", "fun_fact": "同一首詩的「烽火連三月，家書抵萬金」也是千古名句。", "topic": "human", "region": "古典詩詞"}, {"id": "po-031", "category": "作者", "difficulty": 1, "type": "choice", "question": "「天生我材必有用，千金散盡還復來」是李白的詩句。", "options": ["對", "錯"], "answer": 0, "explanation": "出自李白〈將進酒〉，展現他豪放自信的個性。", "fun_fact": "「將進酒」的「將」讀作「ㄑㄧㄤ」，是「請」的意思。", "topic": "human", "region": "古典詩詞"}, {"id": "po-032", "category": "作者", "difficulty": 2, "type": "choice", "question": "「尋尋覓覓，冷冷清清，淒淒慘慘戚戚」是哪位詞人的作品？", "options": ["辛棄疾", "李清照", "蘇軾", "柳永"], "answer": 1, "explanation": "出自李清照〈聲聲慢〉，寫國破家亡、晚年孤苦的愁緒。", "fun_fact": "開頭一口氣連用了十四個疊字，歷來被視為神來之筆。", "topic": "human", "region": "古典詩詞"}, {"id": "po-033", "category": "作者", "difficulty": 2, "type": "choice", "question": "「但使龍城飛將在，不教胡馬度陰山」的作者是？", "options": ["王之渙", "岑參", "高適", "王昌齡"], "answer": 3, "explanation": "出自王昌齡〈出塞〉，「飛將」一般認為指漢代名將李廣。（「龍城」為通行本寫法，清人閻若璩主張應作「盧城」。）", "fun_fact": "據明代王世貞《藝苑卮言》記載，李攀龍認為唐人絕句應以這首「秦時明月漢時關」為壓卷之作。", "topic": "human", "region": "古典詩詞"}, {"id": "po-034", "category": "作者", "difficulty": 2, "type": "choice", "question": "「王師北定中原日，家祭無忘告乃翁」的作者是？", "options": ["岳飛", "辛棄疾", "文天祥", "陸游"], "answer": 3, "explanation": "出自陸游〈示兒〉，是他臨終前寫給兒子的詩，至死不忘收復中原。", "fun_fact": "陸游現存詩作九千多首，是存詩最多的古代詩人之一。", "topic": "human", "region": "古典詩詞"}, {"id": "po-035", "category": "作者", "difficulty": 2, "type": "choice", "question": "「停車坐愛楓林晚，霜葉紅於二月花」出自哪一首詩？", "options": ["山行", "楓橋夜泊", "江雪", "秋夕"], "answer": 0, "explanation": "出自杜牧〈山行〉，描寫秋天山中楓葉比春花還紅豔。", "fun_fact": "句中的「坐」不是坐下，而是「因為」的意思。", "topic": "human", "region": "古典詩詞"}, {"id": "po-036", "category": "作者", "difficulty": 3, "type": "choice", "question": "「身無彩鳳雙飛翼，心有靈犀一點通」的作者是？", "options": ["李賀", "溫庭筠", "杜牧", "李商隱"], "answer": 3, "explanation": "出自李商隱〈無題〉（昨夜星辰昨夜風），寫戀人心意相通。", "fun_fact": "李商隱寫了許多以〈無題〉為名的詩，詩意隱晦，至今仍眾說紛紜。", "topic": "human", "region": "古典詩詞"}, {"id": "po-037", "category": "作者", "difficulty": 3, "type": "choice", "question": "「楊柳岸，曉風殘月」出自哪位詞人的作品？", "options": ["柳永", "秦觀", "李清照", "晏殊"], "answer": 0, "explanation": "出自柳永〈雨霖鈴〉：今宵酒醒何處？楊柳岸，曉風殘月。寫離別的淒涼。", "fun_fact": "柳永的詞流行到「凡有井水飲處，即能歌柳詞」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-038", "category": "作者", "difficulty": 3, "type": "choice", "question": "「老驥伏櫪，志在千里」的作者是？", "options": ["劉備", "曹植", "曹操", "諸葛亮"], "answer": 2, "explanation": "出自曹操〈龜雖壽〉：老驥伏櫪，志在千里；烈士暮年，壯心不已。", "fun_fact": "「驥」是千里馬，「櫪」是馬槽，比喻年老仍懷壯志。", "topic": "human", "region": "古典詩詞"}, {"id": "po-039", "category": "情境", "difficulty": 1, "type": "choice", "question": "王安石〈元日〉「爆竹聲中一歲除，春風送暖入屠蘇」描寫的是哪個節日？", "options": ["清明節", "端午節", "春節", "元宵節"], "answer": 2, "explanation": "「元日」就是農曆正月初一，詩中寫放爆竹、喝屠蘇酒的過年景象。", "fun_fact": "詩末「總把新桃換舊符」的「桃符」，就是春聯的前身。", "topic": "human", "region": "古典詩詞"}, {"id": "po-040", "category": "情境", "difficulty": 1, "type": "choice", "question": "楊萬里「接天蓮葉無窮碧，映日荷花別樣紅」描寫的是哪個季節？", "options": ["冬天", "春天", "秋天", "夏天"], "answer": 3, "explanation": "出自楊萬里〈曉出淨慈寺送林子方〉，寫農曆六月西湖荷花盛開的景色。", "fun_fact": "前兩句是「畢竟西湖六月中，風光不與四時同」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-041", "category": "情境", "difficulty": 1, "type": "choice", "question": "杜甫「好雨知時節，當春乃發生」描寫的是什麼？", "options": ["秋霜", "夏日雷陣雨", "春雨", "冬雪"], "answer": 2, "explanation": "出自杜甫〈春夜喜雨〉，讚美春雨適時而來、滋潤萬物。", "fun_fact": "同一首詩的「隨風潛入夜，潤物細無聲」也常被用來形容默默付出。", "topic": "human", "region": "古典詩詞"}, {"id": "po-042", "category": "情境", "difficulty": 2, "type": "choice", "question": "秦觀「金風玉露一相逢，便勝卻人間無數」描寫的是哪個節日？", "options": ["元宵節", "中秋節", "重陽節", "七夕"], "answer": 3, "explanation": "出自秦觀〈鵲橋仙〉，寫牛郎織女七夕相會。", "fun_fact": "同一首詞的結尾「兩情若是久長時，又豈在朝朝暮暮」是著名的愛情名句。", "topic": "human", "region": "古典詩詞"}, {"id": "po-043", "category": "情境", "difficulty": 2, "type": "choice", "question": "辛棄疾「東風夜放花千樹，更吹落、星如雨」描寫的是哪個節日？", "options": ["元宵節", "中秋節", "春節", "端午節"], "answer": 0, "explanation": "出自辛棄疾〈青玉案・元夕〉，「元夕」就是元宵夜，詞中描寫滿城花燈。", "fun_fact": "同一首詞的「燈火闌珊處」，「闌珊」是燈火稀落的意思。", "topic": "human", "region": "古典詩詞"}, {"id": "po-044", "category": "情境", "difficulty": 2, "type": "choice", "question": "岑參「北風捲地白草折，胡天八月即飛雪」描寫的是哪種地方？", "options": ["江南水鄉", "東南海濱", "西北邊塞", "京城宮殿"], "answer": 2, "explanation": "出自岑參〈白雪歌送武判官歸京〉，寫邊塞農曆八月就下雪的奇寒。", "fun_fact": "同一首詩「忽如一夜春風來，千樹萬樹梨花開」是把雪比作梨花。", "topic": "human", "region": "古典詩詞"}, {"id": "po-045", "category": "情境", "difficulty": 2, "type": "choice", "question": "李白〈月下獨酌〉「舉杯邀明月，對影成三人」主要表達什麼心情？", "options": ["戰爭悲憤", "孤獨寂寞", "離別不捨", "思念家鄉"], "answer": 1, "explanation": "前兩句是「花間一壺酒，獨酌無相親」，只能邀月亮和影子作伴，寫出詩人的孤獨。", "fun_fact": "〈月下獨酌〉共有四首，這是其中第一首。", "topic": "human", "region": "古典詩詞"}, {"id": "po-046", "category": "情境", "difficulty": 3, "type": "choice", "question": "《詩經》〈蒹葭〉「蒹葭蒼蒼，白露為霜」描寫的是哪個季節？", "options": ["秋天", "冬天", "春天", "夏天"], "answer": 0, "explanation": "出自《詩經・秦風・蒹葭》，露水凝結成霜，是深秋景象。", "fun_fact": "「蒹葭」是蘆荻、蘆葦一類的水草。", "topic": "human", "region": "古典詩詞"}, {"id": "po-047", "category": "冷知識", "difficulty": 3, "type": "choice", "question": "「青蓮居士」是哪一位詩人的別號？", "options": ["杜甫", "白居易", "王維", "李白"], "answer": 3, "explanation": "李白自號青蓮居士，由來有兩說：一說取自佛典中象徵清淨的青蓮花（他曾在詩中自比維摩詰）；另一說與他少年時居住的四川清廉鄉（今江油市青蓮鎮）有關。", "fun_fact": "白居易號香山居士，杜甫自稱少陵野老。", "topic": "human", "region": "古典詩詞"}, {"id": "po-048", "category": "冷知識", "difficulty": 3, "type": "choice", "question": "成語「青梅竹馬」出自哪一位詩人的作品？", "options": ["白居易", "李白", "王維", "杜甫"], "answer": 1, "explanation": "出自李白〈長干行〉：郎騎竹馬來，遶床弄青梅。形容男女童年時天真的情誼。", "fun_fact": "同一首詩的「同居長干里，兩小無嫌猜」也衍生出成語「兩小無猜」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-049", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "「春蠶到死絲方盡，蠟炬成灰淚始乾」原本是一首歌頌老師無私奉獻的詩。", "options": ["對", "錯"], "answer": 1, "explanation": "出自李商隱〈無題〉（相見時難別亦難），原本是表達堅貞不渝的愛情。", "fun_fact": "後人才借用這兩句來比喻老師的奉獻。", "topic": "human", "region": "古典詩詞"}, {"id": "po-050", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "宋詞原本是可以配合音樂演唱的歌詞。", "options": ["對", "錯"], "answer": 0, "explanation": "詞起源於隋唐的曲子詞，依曲調填寫，所以作詞又叫「填詞」。", "fun_fact": "〈水調歌頭〉、〈念奴嬌〉這類「詞牌」其實是曲調名，不是題目。", "topic": "human", "region": "古典詩詞"}, {"id": "po-051", "category": "冷知識", "difficulty": 2, "type": "order", "question": "請依年代先後排出這些文人：", "options": ["馬致遠", "曹植", "辛棄疾", "王昌齡"], "answer": [1, 3, 2, 0], "explanation": "曹植（三國魏）→ 王昌齡（唐）→ 辛棄疾（南宋）→ 馬致遠（元）。", "fun_fact": "馬致遠的〈天淨沙・秋思〉被譽為「秋思之祖」。", "topic": "human", "region": "古典詩詞"}, {"id": "po-052", "topic": "human", "category": "文言文名篇", "difficulty": 1, "type": "choice", "question": "「先天下之憂而憂，後天下之樂而樂」出自哪一篇文章？", "options": ["出師表", "醉翁亭記", "岳陽樓記", "桃花源記"], "answer": 2, "explanation": "出自北宋范仲淹〈岳陽樓記〉，表達士人以天下為己任的胸襟。", "fun_fact": "范仲淹寫這篇文章時人並不在岳陽，是應好友滕子京之請、看著寄來的圖畫寫成的。", "region": "古典詩詞"}, {"id": "po-053", "topic": "human", "category": "書法文房", "difficulty": 1, "type": "choice", "question": "傳統所說的「文房四寶」是指哪四樣東西？", "options": ["筆、墨、紙、硯", "琴、棋、書、畫", "詩、書、禮、樂", "梅、蘭、竹、菊"], "answer": 0, "explanation": "文房四寶是書房中最基本的四種用具：毛筆、墨、紙、硯台。", "fun_fact": "文人講究「湖筆、徽墨、宣紙、端硯」，各自來自不同的名產地。", "region": "古典詩詞"}, {"id": "po-054", "topic": "human", "category": "傳統節慶", "difficulty": 1, "type": "choice", "question": "端午節吃粽子、划龍舟，最普遍的說法是為了紀念哪一位人物？", "options": ["介之推", "屈原", "伍子胥", "文天祥"], "answer": 1, "explanation": "相傳戰國楚國詩人屈原於農曆五月五日投汨羅江，百姓划船打撈、投粽入江，形成端午習俗。", "fun_fact": "介之推的故事對應的是另一個節日——寒食節。", "region": "古典詩詞"}, {"id": "po-055", "topic": "human", "category": "文言文名篇", "difficulty": 1, "type": "choice", "question": "描寫漁人誤入世外桃源的〈桃花源記〉，作者是誰？", "options": ["陶淵明", "王羲之", "柳宗元", "歐陽脩"], "answer": 0, "explanation": "〈桃花源記〉是東晉陶淵明的作品，描繪一個沒有戰亂、與世隔絕的理想社會。", "fun_fact": "「世外桃源」「豁然開朗」這兩個常用詞，都是從這篇文章來的。", "region": "古典詩詞"}, {"id": "po-056", "topic": "human", "category": "四書五經", "difficulty": 1, "type": "choice", "question": "「學而時習之，不亦說乎」出自下列哪一部經典？", "options": ["《孟子》", "《大學》", "《論語》", "《中庸》"], "answer": 2, "explanation": "這是《論語・學而》的開篇第一章，記錄孔子的言論。", "fun_fact": "句中的「說」要讀作「ㄩㄝˋ」，同「悅」，是高興的意思。", "region": "古典詩詞"}, {"id": "po-057", "topic": "human", "category": "二十四節氣", "difficulty": 1, "type": "choice", "question": "在北半球，一年當中白天最長、黑夜最短的節氣是？", "options": ["冬至", "夏至", "春分", "立夏"], "answer": 1, "explanation": "夏至這天太陽直射北回歸線，北半球白晝最長；冬至則相反，是白晝最短的一天。", "fun_fact": "台灣嘉義、花蓮一帶有北回歸線標誌，夏至正午時分幾乎看不到影子。", "region": "古典詩詞"}, {"id": "po-058", "topic": "human", "category": "成語典故", "difficulty": 1, "type": "choice", "question": "成語「破釜沉舟」講的是哪一位人物的故事？", "options": ["韓信", "勾踐", "劉邦", "項羽"], "answer": 3, "explanation": "項羽在鉅鹿之戰渡河後砸破鍋子、鑿沉船隻，斷絕退路以示決一死戰。", "fun_fact": "勾踐的故事對應的是另一個成語「臥薪嘗膽」。", "region": "古典詩詞"}, {"id": "po-059", "topic": "human", "category": "文言文名篇", "difficulty": 1, "type": "choice", "question": "「臣本布衣，躬耕於南陽」出自〈出師表〉，這篇文章的作者是？", "options": ["曹操", "周瑜", "司馬懿", "諸葛亮"], "answer": 3, "explanation": "〈出師表〉是諸葛亮北伐前上呈蜀漢後主劉禪的奏章。", "fun_fact": "文中「鞠躬盡瘁」後來與「死而後已」連用，成為形容盡忠職守的成語。", "region": "古典詩詞"}, {"id": "po-060", "topic": "human", "category": "文言文名篇", "difficulty": 2, "type": "choice", "question": "「醉翁之意不在酒，在乎山水之間也」出自〈醉翁亭記〉，作者是誰？", "options": ["蘇軾", "王安石", "范仲淹", "歐陽脩"], "answer": 3, "explanation": "〈醉翁亭記〉是歐陽脩貶官滁州時所作，「醉翁」正是他的自號。", "fun_fact": "歐陽脩晚年又自號「六一居士」，指藏書一萬卷、金石一千卷、琴一張、棋一局、酒一壺，加上他自己一個老翁。", "region": "古典詩詞"}, {"id": "po-061", "topic": "human", "category": "文言文名篇", "difficulty": 2, "type": "choice", "question": "「山不在高，有仙則名；水不在深，有龍則靈」出自哪一篇？", "options": ["愛蓮說", "陋室銘", "師說", "阿房宮賦"], "answer": 1, "explanation": "出自唐代劉禹錫〈陋室銘〉，全篇藉簡陋居室表明主人品德高潔。", "fun_fact": "文章最後一句「孔子云：何陋之有」，是引用《論語》來收尾。", "region": "古典詩詞"}, {"id": "po-062", "topic": "human", "category": "文言文名篇", "difficulty": 2, "type": "choice", "question": "「師者，所以傳道、受業、解惑也」出自〈師說〉，作者是唐宋八大家中的哪一位？", "options": ["柳宗元", "韓愈", "蘇洵", "曾鞏"], "answer": 1, "explanation": "〈師說〉是韓愈為勉勵學生李蟠而作，強調從師問學的重要。", "fun_fact": "文中「弟子不必不如師，師不必賢於弟子」，是很早就出現的教學相長觀念。", "region": "古典詩詞"}, {"id": "po-063", "topic": "human", "category": "成語典故", "difficulty": 2, "type": "choice", "question": "農夫守著樹樁等兔子撞上來——成語「守株待兔」的寓言出自哪一部先秦典籍？", "options": ["《莊子》", "《孟子》", "《韓非子》", "《左傳》"], "answer": 2, "explanation": "出自《韓非子・五蠹》，韓非用這個故事諷刺一味守舊、不知變通的人。", "fun_fact": "韓非是法家代表人物，主張治國要因時制宜，不能死守古法。", "region": "古典詩詞"}, {"id": "po-064", "topic": "human", "category": "四書五經", "difficulty": 2, "type": "choice", "question": "「四書」除了《論語》和《孟子》，還包括哪兩部？", "options": ["《大學》、《中庸》", "《詩經》、《尚書》", "《荀子》、《墨子》", "《易經》、《春秋》"], "answer": 0, "explanation": "四書指《大學》、《中庸》、《論語》、《孟子》，由南宋朱熹合編並作注。", "fun_fact": "《大學》和《中庸》原本是《禮記》中的兩篇，被朱熹抽出來單獨成書。", "region": "古典詩詞"}, {"id": "po-065", "topic": "human", "category": "二十四節氣", "difficulty": 2, "type": "choice", "question": "二十四節氣中，緊接在「清明」之後的節氣是？", "options": ["立夏", "小滿", "穀雨", "芒種"], "answer": 2, "explanation": "春季六個節氣依序是立春、雨水、驚蟄、春分、清明、穀雨，穀雨之後才進入立夏。", "fun_fact": "「穀雨」得名於此時雨水增多、有利穀物生長，台灣茶農也講究採「雨前茶」。", "region": "古典詩詞"}, {"id": "po-066", "topic": "human", "category": "對聯常識", "difficulty": 2, "type": "choice", "question": "依傳統貼春聯的方式，面對大門時，上聯應該貼在哪裡？", "options": ["面對大門的右邊", "面對大門的左邊", "門楣的正中央", "門框的最下方"], "answer": 0, "explanation": "傳統橫批由右至左書寫，因此上聯貼在面對大門的右手邊，下聯在左。（若橫批改為由左至右書寫，則左右相反。）", "fun_fact": "分辨上下聯還有一個訣竅：上聯最後一字多為仄聲，下聯最後一字多為平聲。", "region": "古典詩詞"}, {"id": "po-067", "topic": "human", "category": "書法文房", "difficulty": 2, "type": "choice", "question": "被譽為「天下第一行書」的〈蘭亭集序〉，出自哪位書法家之手？", "options": ["顏真卿", "王羲之", "柳公權", "歐陽詢"], "answer": 1, "explanation": "〈蘭亭集序〉是東晉王羲之所書，他也被後世尊稱為「書聖」。", "fun_fact": "相傳〈蘭亭集序〉的真跡被唐太宗帶進了陵墓，今天看到的都是摹本。", "region": "古典詩詞"}, {"id": "po-068", "topic": "human", "category": "元曲戲劇", "difficulty": 2, "type": "choice", "question": "元代雜劇名作《竇娥冤》的作者是誰？", "options": ["王實甫", "白樸", "馬致遠", "關漢卿"], "answer": 3, "explanation": "《竇娥冤》是關漢卿的代表作，寫竇娥蒙冤受刑、血濺白練、六月飛雪的故事。", "fun_fact": "俗語「六月雪」用來形容天大的冤情，典故正是出自這齣戲。", "region": "古典詩詞"}, {"id": "po-069", "topic": "human", "category": "諸子百家", "difficulty": 2, "type": "choice", "question": "主張「兼愛」、「非攻」，反對厚葬與奢侈的是先秦哪一家？", "options": ["儒家", "道家", "法家", "墨家"], "answer": 3, "explanation": "墨子創立墨家，主張不分親疏地愛人（兼愛）、反對侵略戰爭（非攻），並提倡節用節葬。", "fun_fact": "「墨守成規」原本是稱讚墨家守城技術高明，後來詞義才轉為貶義。", "region": "古典詩詞"}, {"id": "po-070", "topic": "human", "category": "文言文名篇", "difficulty": 3, "type": "choice", "question": "「寄蜉蝣於天地，渺滄海之一粟」出自哪一篇文章？", "options": ["赤壁賦", "岳陽樓記", "滕王閣序", "阿房宮賦"], "answer": 0, "explanation": "出自蘇軾〈前赤壁賦〉，以蜉蝣、米粒形容人在天地間的渺小短暫。", "fun_fact": "蘇軾遊的黃州赤壁（赤鼻磯），其實與三國赤壁之戰的戰場並非同一處。", "region": "古典詩詞"}, {"id": "po-071", "topic": "human", "category": "成語典故", "difficulty": 3, "type": "choice", "question": "成語「洛陽紙貴」是因為哪一部作品太受歡迎、大家爭相抄寫？", "options": ["左思〈三都賦〉", "曹植〈洛神賦〉", "班固〈兩都賦〉", "張衡〈二京賦〉"], "answer": 0, "explanation": "據《晉書・左思傳》，左思〈三都賦〉問世後豪門競相傳抄，使得洛陽的紙價因此上漲。", "fun_fact": "左思為了寫〈三都賦〉構思了十年，據說家中處處放著紙筆，想到一句就馬上記下來。", "region": "古典詩詞"}, {"id": "po-072", "topic": "human", "category": "文人軼事", "difficulty": 3, "type": "choice", "question": "為了「僧敲月下門」該用「推」還是「敲」而反覆斟酌，留下「推敲」典故的詩人是？", "options": ["孟郊", "賈島", "李賀", "盧仝"], "answer": 1, "explanation": "相傳賈島騎驢苦思用字，衝撞了韓愈的儀仗，韓愈建議用「敲」字，後人便以「推敲」比喻斟酌字句。", "fun_fact": "賈島與孟郊詩風都清冷瘦硬，蘇軾因此有「郊寒島瘦」的評語。", "region": "古典詩詞"}, {"id": "po-073", "topic": "human", "category": "諸子百家", "difficulty": 3, "type": "choice", "question": "與孟子「性善說」針鋒相對，主張「人之性惡」的先秦儒家思想家是？", "options": ["墨子", "莊子", "荀子", "董仲舒"], "answer": 2, "explanation": "荀子在〈性惡〉篇主張人性本惡，必須靠後天的禮義教化與學習來矯正。", "fun_fact": "「青出於藍而勝於藍」就出自荀子〈勸學〉，正好呼應他重視學習的立場。", "region": "古典詩詞"}, {"id": "po-074", "topic": "human", "category": "二十四節氣", "difficulty": 3, "type": "choice", "question": "二十四節氣是依據什麼來劃分的？", "options": ["月亮的圓缺週期", "北斗七星的方位", "太陽的週年位置", "海水潮汐的漲落"], "answer": 2, "explanation": "節氣是依太陽在黃道上的位置（每十五度一個節氣）劃分，屬於陽曆的性質，所以對應的國曆日期每年幾乎固定。", "fun_fact": "清明大多落在國曆四月四日或五日，冬至多在十二月二十一至二十三日之間，就是這個道理。", "region": "古典詩詞"}, {"id": "po-075", "topic": "human", "category": "書法文房", "difficulty": 3, "type": "choice", "question": "書畫家愛用、以耐久不蛀著稱的「宣紙」，原產地在哪一省？", "options": ["浙江", "江蘇", "湖南", "安徽"], "answer": 3, "explanation": "宣紙因產於唐代宣州（今安徽宣城一帶，以涇縣最著名）而得名。", "fun_fact": "宣紙有「紙壽千年」之稱，主要原料是青檀樹皮與稻草。", "region": "古典詩詞"}], "tech": [{"id": "tc-001", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "電腦突然斷電時，下列哪一個地方還沒存檔的資料會直接消失？", "options": ["SSD 固態硬碟", "RAM（主記憶體）", "傳統機械硬碟", "USB 隨身碟"], "answer": 1, "explanation": "RAM 是「揮發性記憶體」，必須持續供電才能保住資料；硬碟與隨身碟則是非揮發性的，斷電後資料仍在。", "fun_fact": "所以打報告打到一半跳電會欲哭無淚——因為內容還躺在 RAM 裡，沒被寫進硬碟。", "region": "科技"}, {"id": "tc-002", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "電腦世界裡，1 個位元組（byte）等於幾個位元（bit）？", "options": ["4 個", "1024 個", "16 個", "8 個"], "answer": 3, "explanation": "1 byte = 8 bit。位元是 0 與 1 的最小單位，8 個位元組成一個位元組，剛好可以表示 0 到 255 共 256 種數值。", "fun_fact": "網路速度常寫成「100 Mbps」，那個小寫 b 是 bit 不是 byte，所以實際下載速度大約只有 12.5 MB/s。", "region": "科技"}, {"id": "tc-003", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "下列哪一個「不是」作業系統？", "options": ["Adobe Photoshop", "Ubuntu", "Android", "macOS"], "answer": 0, "explanation": "Photoshop 是跑在作業系統上的應用軟體；macOS、Android、Ubuntu 都是作業系統。", "fun_fact": "作業系統的工作是管理硬體與分配資源，就像餐廳的內場經理，應用軟體則是客人點的菜。", "region": "科技"}, {"id": "tc-004", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "網域名稱結尾是「.edu.tw」，通常代表這是什麼單位的網站？", "options": ["台灣的公司行號", "台灣的教育機構（學校）", "台灣的政府機關", "台灣的民間社團組織"], "answer": 1, "explanation": "在台灣的網域分類中，.edu.tw 給教育機構、.gov.tw 給政府機關、.com.tw 給公司、.org.tw 給民間組織。", "fun_fact": "最後的 .tw 叫「國碼頂級網域」，是依國際標準分配給台灣的代碼。", "region": "科技"}, {"id": "tc-005", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "把照片上傳到「雲端硬碟」之後，檔案實際上存放在哪裡？", "options": ["漂浮在大氣層的資料衛星上", "網際網路路由器的暫存空間", "你手機裡的一塊隱藏分割區", "服務業者資料中心裡的實體伺服器硬碟"], "answer": 3, "explanation": "所謂「雲端」其實就是別人家的電腦——業者蓋在世界各地的資料中心，裡面滿滿都是實體伺服器和硬碟。", "fun_fact": "資料中心最大的開銷之一是冷氣，有些業者乾脆把機房蓋在北歐，或直接沉到海底散熱。", "region": "科技"}, {"id": "tc-006", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "二進位的「1011」換算成十進位是多少？", "options": ["13", "11", "15", "9"], "answer": 1, "explanation": "由右至左各位數代表 1、2、4、8：1011 = 8 + 0 + 2 + 1 = 11。", "fun_fact": "工程師的冷笑話：「世界上有 10 種人，懂二進位的和不懂的。」這裡的 10 就是二進位的 2。", "region": "科技"}, {"id": "tc-007", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "下列哪一種常見圖片格式屬於「有失真壓縮」，每重新存檔一次畫質就會再差一點？", "options": ["BMP", "GIF", "JPEG", "PNG"], "answer": 2, "explanation": "JPEG 靠丟掉人眼較不敏感的細節來縮小檔案，屬於有失真壓縮；PNG 與 GIF 是無失真壓縮，BMP 則幾乎不壓縮。", "fun_fact": "網路迷因圖之所以糊到像被洗過，就是因為被反覆下載、截圖、再存成 JPEG，俗稱「JPEG 化」。", "region": "科技"}, {"id": "tc-008", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "家裡的 Wi-Fi 路由器常配給手機、筆電像「192.168.0.5」這樣的位址，這類位址稱為什麼？", "options": ["DNS 位址", "私有 IP 位址", "公有 IP 位址", "MAC 位址"], "answer": 1, "explanation": "192.168 開頭的位址是保留給區域網路使用的私有 IP，只在你家網路內有效，外面的人無法直接連到它。", "fun_fact": "全家的裝置對外其實共用同一個公有 IP，由路由器負責轉換，這個機制叫 NAT（網路位址轉譯）。", "region": "科技"}, {"id": "tc-009", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "「Wi-Fi」這個名字是「Wireless Fidelity（無線保真）」的英文縮寫。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！Wi-Fi 純粹是 Wi-Fi 聯盟找品牌顧問公司 Interbrand 想出來的商標名稱，本身不代表任何字。當年是為了取代拗口的技術規格名「IEEE 802.11b Direct Sequence」。", "fun_fact": "聯盟創始成員 Belanger 說，「Wireless Fidelity」是同事事後硬加上去的標語，因為大家不好意思承認這名字根本沒有意思——他形容那是個「錯誤」。", "source": "https://www.techradar.com/news/we-finally-know-what-wi-fi-stands-for-and-its-not-what-you-think", "region": "科技"}, {"id": "tc-010", "topic": "tech", "category": "電腦", "difficulty": 3, "type": "choice", "question": "無線傳輸技術「Bluetooth（藍牙）」這個名字是怎麼來的？", "options": ["取自十世紀統一丹麥與挪威的國王 Harald「藍牙」Gormsson", "因為發明人的女兒小名叫 Blue", "因為訊號在示波器上會顯示成藍色鋸齒波", "因為早期的藍牙晶片外殼一律漆成藍色"], "answer": 0, "explanation": "1990 年代 Intel、Ericsson 與 Nokia 合作制定這套規格時，借用了維京國王 Harald Bluetooth 的名號——他統一了丹麥與挪威，象徵把各家不同的裝置「統一」起來。", "fun_fact": "藍牙的圖示其實是北歐符文 ᚼ（H）和 ᛒ（B）疊在一起，正是 Harald Bluetooth 的姓名縮寫；「藍牙」的綽號則來自他那顆變成深藍灰色的死牙。", "source": "https://www.bluetooth.com/about-us/bluetooth-origin/", "region": "科技"}, {"id": "tc-011", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "二戰期間在英國布萊切利園帶領團隊破解德軍 Enigma 密碼機、被譽為「電腦科學之父」的數學家是誰？", "options": ["克勞德·夏農（Claude Shannon）", "諾伯特·維納（Norbert Wiener）", "艾倫·圖靈（Alan Turing）", "查爾斯·巴貝奇（Charles Babbage）"], "answer": 2, "explanation": "圖靈設計的解密機器大幅加快 Enigma 的破譯速度，一般認為讓二戰提早結束；他也提出了「圖靈機」這個計算理論的基礎模型。", "fun_fact": "他在 1950 年提出著名的「圖靈測試」：如果人類在純文字對話中分不出對方是人還是機器，那就可以說這台機器「會思考」。", "region": "科技"}, {"id": "tc-012", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "現代電腦「把程式和資料一起放在同一個記憶體裡」的基本設計，一般稱為什麼架構？", "options": ["巴貝奇架構", "圖靈架構", "馮紐曼架構", "香農架構"], "answer": 2, "explanation": "馮紐曼（John von Neumann）提出的「儲存程式」概念，讓電腦不必重接線路就能換工作，只要載入不同程式即可，這是通用電腦的關鍵。", "fun_fact": "因為 CPU 讀指令和讀資料要共用同一條通道，速度容易卡住，這個先天限制被戲稱為「馮紐曼瓶頸」。", "region": "科技"}, {"id": "tc-013", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1946 年公開亮相、一般被視為第一部通用電子數位計算機的機器是？", "options": ["IBM PC", "Apple I", "ENIAC", "Altair 8800"], "answer": 2, "explanation": "ENIAC 由賓州大學建造，用了約 1.8 萬支真空管，重達 27 公噸，佔滿整個房間。Apple I（1976）、Altair 8800（1975）、IBM PC（1981）都晚了三十年以上。", "fun_fact": "ENIAC 最早的六位程式設計師全是女性數學家，但當年的宣傳照片幾乎不提她們的名字，直到近幾十年才被重新肯定。", "region": "科技"}, {"id": "tc-014", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1991 年寫出 Linux 作業系統核心、當時還是芬蘭赫爾辛基大學學生的人是誰？", "options": ["Richard Stallman", "Linus Torvalds", "Steve Wozniak", "Bill Gates"], "answer": 1, "explanation": "Torvalds 在 1991 年 8 月把作品貼上 Usenet 新聞群組，謙虛地說這「只是個興趣，不會像 GNU 那樣又大又專業」。", "fun_fact": "結果這個「興趣」如今跑在絕大多數的雲端伺服器、所有 Android 手機和超級電腦上；吉祥物企鵝 Tux 的靈感據說來自他被企鵝咬了一口。", "region": "科技"}, {"id": "tc-015", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "choice", "question": "1964 年在 SRI 誕生的第一個滑鼠原型，外殼是用什麼材質做的？", "options": ["木頭（紅木）", "鋁合金", "玻璃", "陶瓷"], "answer": 0, "explanation": "由 Douglas Engelbart 構想、工程師 Bill English 打造的第一個滑鼠，外殼是 SRI 機工房用紅木削出來的，底下只有兩個互相垂直的滾輪。", "fun_fact": "據 Engelbart 回憶，因為電線從尾端拉出來像老鼠尾巴，大家就順口叫它 mouse，至於是誰先這樣叫的，已經沒人記得了。", "source": "https://computerhistory.org/sri-mouse-mn052024/", "region": "科技"}, {"id": "tc-016", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "choice", "question": "1971 年 Ray Tomlinson 送出第一封跨電腦的網路電子郵件，他選用的「@」符號是用來做什麼的？", "options": ["標示信件已經加密", "表示這封信是緊急信件", "分隔使用者名稱與他所在的電腦主機", "代表寄件時間的時區"], "answer": 2, "explanation": "Tomlinson 需要一個絕對不會出現在人名裡的符號，來寫出「使用者@主機」這種位址格式，鍵盤上的 @ 剛好符合，這個寫法就沿用至今。", "fun_fact": "@ 在各國有各種可愛綽號：義大利叫「蝸牛」、荷蘭叫「猴子尾巴」、丹麥叫「大象鼻子」、希臘叫「小鴨子」。", "source": "https://www.internethalloffame.org/official-biography-raymond-tomlinson/", "region": "科技"}, {"id": "tc-017", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "choice", "question": "全球資訊網（World Wide Web）是 Tim Berners-Lee 在 1989 年於哪個機構工作時提出的構想？", "options": ["美國國防部先進研究計畫署（DARPA）", "美國國家航空暨太空總署（NASA）", "美國麻省理工學院（MIT）", "歐洲核子研究組織（CERN）"], "answer": 3, "explanation": "Berners-Lee 當時在 CERN 服務，為了解決各國研究人員之間資料難以共享的問題，提出用超連結串起文件的構想，並寫出 HTML、HTTP 與第一個瀏覽器。", "fun_fact": "1993 年 CERN 宣布放棄全球資訊網的所有權利、讓它永久免費公開，這個決定被認為是網路得以爆炸成長的關鍵。", "region": "科技"}, {"id": "tc-018", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "order", "question": "請把下列資訊科技的里程碑依發生時間先後排列：", "options": ["全球資訊網構想提出", "第一個滑鼠原型問世", "第一封跨電腦的網路電子郵件", "ENIAC 公開亮相"], "answer": [3, 1, 2, 0], "explanation": "ENIAC 公開（1946）→ 第一個滑鼠原型（1964）→ 第一封網路電子郵件（1971）→ 全球資訊網構想提出（1989）。", "fun_fact": "從佔滿一整個房間的 ENIAC 到全球資訊網，中間只隔了 43 年，比很多人的爸媽還年輕。", "region": "科技"}, {"id": "tc-019", "topic": "tech", "category": "歷史", "difficulty": 3, "type": "choice", "question": "自由軟體的 GPL 授權有個核心規定叫「copyleft」，它的意思是什麼？", "options": ["修改之後必須把著作權轉讓給自由軟體基金會", "你可以自由修改、散布，但散布出去的版本也必須用同樣的開源授權", "程式碼只能自己用，完全不得用於商業用途", "所有使用者都必須付一筆授權費給原作者"], "answer": 1, "explanation": "copyleft 是把著作權「反過來用」：不是拿來禁止散布，而是用來保證自由不會在下一手被收回，所以衍生作品也得繼續開源。", "fun_fact": "copyleft 這個字是對 copyright 的雙關玩笑，連符號都把 © 左右翻轉寫成 ↄ。GPL 完全允許商業使用，Linux 就是靠它養活了一整個產業。", "region": "科技"}, {"id": "tc-020", "topic": "tech", "category": "歷史", "difficulty": 3, "type": "choice", "question": "蘋果公司（Apple）最早其實有三位共同創辦人，其中一位在公司成立後不到兩週就賣掉自己的股份離開了。", "options": ["對", "錯"], "answer": 0, "explanation": "真的！1976 年蘋果由 Steve Jobs、Steve Wozniak 和 Ronald Wayne 三人創立，Wayne 持有一成股份，但擔心要承擔公司債務的風險，不到兩週就以 800 美元把股份賣回給另外兩人。", "fun_fact": "Wayne 本人多次公開表示不後悔，說自己當年做的是「當下最合理的決定」，而且他也畫了蘋果最早那個牛頓坐在蘋果樹下的公司標誌。", "source": "https://www.cnbc.com/2018/08/02/why-ronald-wayne-sold-his-10-percent-stake-in-apple-for-800-dollars.html", "region": "科技"}, {"id": "tc-021", "topic": "tech", "category": "軟體", "difficulty": 1, "type": "choice", "question": "程式語言 Python 的名字是從哪裡來的？", "options": ["創造者養的一條寵物蛇", "英國喜劇團體「Monty Python（蒙提·派森）」", "蟒蛇，因為程式碼像蛇一樣蜿蜒", "希臘神話中被阿波羅殺死的巨蟒"], "answer": 1, "explanation": "根據 Python 官方文件，作者 Guido van Rossum 動手開發時正在讀 BBC 喜劇《Monty Python's Flying Circus》的劇本，他想要一個「簡短、獨特、又有點神祕」的名字，就這麼定了。", "fun_fact": "官方 FAQ 還俏皮地問：「我一定要喜歡 Monty Python 嗎？」答案是：「不用，但會有幫助。:)」", "source": "https://docs.python.org/3/faq/general.html", "region": "科技"}, {"id": "tc-022", "topic": "tech", "category": "軟體", "difficulty": 1, "type": "choice", "question": "程式設計師常用的工具「Git」主要是拿來做什麼的？", "options": ["把原始碼翻譯成機器碼的編譯器", "把檔案壓縮成更小的壓縮檔", "版本控制：記錄程式碼每次修改，隨時能回到舊版本", "掃描並清除程式裡的電腦病毒"], "answer": 2, "explanation": "Git 是分散式版本控制系統，會記錄每一次修改是誰、什麼時候、改了哪幾行，讓多人協作不會互相覆蓋，出錯還能回溯。", "fun_fact": "Git 是 Linux 之父 Linus Torvalds 在 2005 年親手打造的，因為他原本用的版本控制工具突然不給 Linux 社群免費使用了——短短幾天內他就做出了第一個能用的版本。", "region": "科技"}, {"id": "tc-023", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "「JavaScript」和「Java」這兩個語言是什麼關係？", "options": ["兩者是各自獨立的語言，當年取這個名字主要是為了搭 Java 的熱潮", "JavaScript 是 Java 的簡化版，語法完全相容", "JavaScript 是 Java 專門用在網頁上的官方版本", "JavaScript 是後來才推出的 Java 第二代"], "answer": 0, "explanation": "JavaScript 由 Netscape 在 1995 年推出，原本叫 LiveScript，因為當時 Java 正紅，行銷考量才改成 JavaScript，兩者的設計與用途其實大不相同。", "fun_fact": "程式圈有個經典比喻：Java 和 JavaScript 的關係，就像「車」和「車厘子」——名字很像，完全兩回事。", "region": "科技"}, {"id": "tc-024", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "「編譯式語言」和「直譯式語言」最主要的差別是什麼？", "options": ["直譯式語言寫出來的程式一定比較安全，不會有漏洞", "編譯式先把整份原始碼翻成機器碼再執行；直譯式則是執行時一行一行邊翻譯邊跑", "編譯式語言只能在 Windows 執行，直譯式語言只能在 Linux 執行", "編譯式語言不必寫原始碼，畫流程圖就能直接產生程式"], "answer": 1, "explanation": "編譯（如 C、Go）先整份翻譯、產生執行檔，跑起來通常比較快；直譯（如 Python）邊翻邊跑，改完馬上能測試，開發比較靈活。", "fun_fact": "現在界線已經模糊：Java 先編譯成中介的位元組碼再由虛擬機執行，很多直譯器也會用 JIT 在執行中即時編譯熱點程式碼。", "region": "科技"}, {"id": "tc-025", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "Git 和 GitHub 其實是同一個東西，一定要註冊 GitHub 帳號才能使用 Git。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！Git 是安裝在自己電腦上的版本控制工具，完全離線也能用；GitHub 只是一家提供 Git 遠端代管服務的網站，同類型的還有 GitLab、Bitbucket 等。", "fun_fact": "GitHub 的吉祥物是一隻章魚貓「Octocat」，牠有貓的臉配上章魚的觸手，已經衍生出上百種造型。", "region": "科技"}, {"id": "tc-026", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "1947 年哈佛 Mark II 電腦故障，工程師在繼電器裡找到一隻昆蟲，把牠貼進日誌本並寫下「第一次真正抓到 bug」。那是什麼昆蟲？", "options": ["蟑螂", "螞蟻", "飛蛾", "獨角仙"], "answer": 2, "explanation": "那是一隻卡在繼電器裡的飛蛾。要注意的是，工程師早在 1870 年代（愛迪生的年代）就用 bug 形容機器的小毛病，所以這次不是「發明」這個字，而是第一次真的抓到一隻蟲。", "fun_fact": "那本日誌連同那隻飛蛾至今收藏在美國史密森尼國家美國歷史博物館；當年 Mark II 團隊中的 Grace Hopper 很愛講這個故事，讓它變得家喻戶曉。", "source": "https://americanhistory.si.edu/collections/object/nmah_334663", "region": "科技"}, {"id": "tc-027", "topic": "tech", "category": "軟體", "difficulty": 3, "type": "choice", "question": "同樣是開源授權，下列哪一種最寬鬆——只要保留原作者的版權宣告，就能拿去修改成閉源的商業產品？", "options": ["CC BY-SA 授權", "GPL 授權", "AGPL 授權", "MIT 授權"], "answer": 3, "explanation": "MIT 屬於「寬鬆式（permissive）」授權，幾乎只要求保留版權與免責聲明；GPL 與 AGPL 都是 copyleft，衍生作品必須繼續開源，CC BY-SA 也要求「相同方式分享」。", "fun_fact": "正因為限制少，MIT 是 GitHub 上最常見的授權之一，React、Vue、jQuery 等知名專案都採用它。", "region": "科技"}, {"id": "tc-028", "topic": "tech", "category": "軟體", "difficulty": 3, "type": "choice", "question": "下列四個程式語言，哪一個誕生得最早？", "options": ["Fortran", "Python", "C", "Java"], "answer": 0, "explanation": "Fortran 誕生於 1950 年代（1957 年釋出第一版編譯器），C 是 1970 年代初，Python 於 1991 年公開，Java 則是 1995 年。", "fun_fact": "Fortran 專為科學與工程運算而生，將近七十年後的今天，許多氣象預報與物理模擬的核心程式仍然是 Fortran 寫的。", "region": "科技"}, {"id": "tc-029", "topic": "tech", "category": "AI", "difficulty": 1, "type": "choice", "question": "深度學習是機器學習的一種，而機器學習又是人工智慧底下的一個分支。", "options": ["對", "錯"], "answer": 0, "explanation": "真的！三者是層層包含的關係：人工智慧範圍最大，機器學習是其中「讓機器從資料中自己學規則」的做法，深度學習則是機器學習裡使用多層類神經網路的分支。", "fun_fact": "早期的人工智慧多半是人工寫死的規則（專家系統），跟「從資料學習」完全是兩條路線。", "region": "科技"}, {"id": "tc-030", "topic": "tech", "category": "AI", "difficulty": 1, "type": "choice", "question": "1997 年擊敗西洋棋世界冠軍卡斯帕洛夫的 IBM 超級電腦，名字叫什麼？", "options": ["大藍（Big Blue）", "藍色基因（Blue Gene）", "華生（Watson）", "深藍（Deep Blue）"], "answer": 3, "explanation": "深藍在 1997 年的六局對戰中以 3.5 比 2.5 擊敗世界冠軍卡斯帕洛夫，是電腦首次在正式比賽中擊敗在位的西洋棋世界冠軍。", "fun_fact": "深藍靠的是超高速搜尋與人工調校的評估函式，和今天從資料自己學棋的 AI 是完全不同的思路。", "region": "科技"}, {"id": "tc-031", "topic": "tech", "category": "AI", "difficulty": 1, "type": "choice", "question": "2016 年 AlphaGo 以 4 比 1 擊敗南韓棋王李世乭，他們下的是什麼棋？", "options": ["日本將棋", "象棋", "圍棋", "西洋棋"], "answer": 2, "explanation": "AlphaGo 由 DeepMind 開發，2016 年 3 月在首爾擊敗世界頂尖棋士李世乭。圍棋的變化數量遠超過西洋棋，過去被認為電腦還要很多年才能攻克。", "fun_fact": "第二局那手「第 37 手」當下被解說員認為是失誤，事後卻證明是妙手，讓不少職業棋士開始重新研究圍棋的定石。", "region": "科技"}, {"id": "tc-032", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "訓練一個類神經網路時，電腦實際上是在反覆調整什麼？", "options": ["程式碼的行數與註解內容", "訓練圖片的解析度與色彩飽和度", "CPU 的時脈與散熱風扇的轉速", "神經元之間連結的「權重」，也就是模型的參數"], "answer": 3, "explanation": "訓練就是不斷比對模型的輸出和正確答案，再依誤差微調每條連結的權重，讓下一次猜得更準，這個調整過程的核心演算法叫反向傳播。", "fun_fact": "所謂「模型有多少參數」，指的就是這些權重的數量；模型檔案本質上是一大包數字，沒有任何一行寫著「這是貓」。", "region": "科技"}, {"id": "tc-033", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "模型訓練完成後，拿它來回答問題、產生結果的這個階段，在 AI 領域稱為什麼？", "options": ["推論（inference）", "除錯（debugging）", "編譯（compile）", "訓練（training）"], "answer": 0, "explanation": "訓練是「學」，推論是「用」。訓練通常要大量運算資源、跑上數週；推論則是每次使用時即時執行，成本低得多。", "fun_fact": "這也是為什麼 AI 服務的費用多半是按使用量計價——你付的是推論的錢，訓練的成本早就先被業者付掉了。", "region": "科技"}, {"id": "tc-034", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "機器學習裡說的「過擬合（overfitting）」是指什麼情況？", "options": ["訓練時間太長，導致電腦過熱當機", "模型的參數數量少於訓練資料的筆數", "模型把訓練資料學得太細，連雜訊都背下來，遇到沒看過的新資料反而表現變差", "模型檔案太大，硬碟空間不夠存放"], "answer": 2, "explanation": "過擬合就像學生只把考古題答案背起來，模擬考滿分，正式考換個題型就崩潰——模型記住了訓練集，卻沒學到可以推廣的規律。", "fun_fact": "對付過擬合的常見招數包括增加資料量、提早停止訓練，以及訓練時故意隨機「關掉」部分神經元的 dropout。", "region": "科技"}, {"id": "tc-035", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "大型語言模型處理文字時，會先把句子切成一個個基本單位再計算。這個單位叫什麼？", "options": ["vector（向量）", "token（詞元）", "frame（影格）", "pixel（像素）"], "answer": 1, "explanation": "模型不是逐字也不是逐詞處理，而是切成 token——可能是一個完整的字、一個詞、或是單字的一小段，再轉換成數字送進模型。", "fun_fact": "英文大約 4 個字元算一個 token，中文則常常一個字就佔一到兩個 token，所以同樣的內容用中文寫，token 數往往比英文多。", "region": "科技"}, {"id": "tc-036", "topic": "tech", "category": "AI", "difficulty": 3, "type": "choice", "question": "2017 年一篇名為〈Attention Is All You Need〉的論文提出了什麼模型架構，成為今天大型語言模型共同的基礎？", "options": ["卷積神經網路（CNN）", "支援向量機（SVM）", "Transformer", "長短期記憶網路（LSTM）"], "answer": 2, "explanation": "這篇由 Google 團隊發表的論文提出 Transformer，用「注意力機制」取代了原本逐步處理序列的遞迴結構，讓訓練可以大規模平行化。", "fun_fact": "GPT 的 T 就是 Transformer；這個架構後來還被反過來用在影像上，成了 Vision Transformer。", "source": "https://en.wikipedia.org/wiki/Attention_Is_All_You_Need", "region": "科技"}, {"id": "tc-037", "topic": "tech", "category": "AI", "difficulty": 3, "type": "order", "question": "請把下列人工智慧的里程碑事件依發生時間先後排列：", "options": ["AlexNet 在 ImageNet 影像辨識大賽奪冠", "深藍擊敗西洋棋世界冠軍卡斯帕洛夫", "AlphaGo 擊敗南韓棋王李世乭", "〈Attention Is All You Need〉論文發表"], "answer": [1, 0, 2, 3], "explanation": "深藍（1997）→ AlexNet 奪下 ImageNet 冠軍（2012）→ AlphaGo 勝李世乭（2016）→ Transformer 論文發表（2017）。", "fun_fact": "2012 年的 AlexNet 大幅領先第二名約 10 個百分點奪冠，被視為深度學習熱潮真正的起跑槍聲。", "region": "科技"}, {"id": "tc-038", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "關於密碼，下列哪一個做法最安全？", "options": ["把密碼寫在便利貼，貼在螢幕邊框上", "每個網站設定不同的長密碼，統一交給密碼管理器保管", "想一組超複雜的密碼，所有網站都用同一組", "用生日加上姓名縮寫，好記又有數字"], "answer": 1, "explanation": "密碼外洩幾乎無可避免，重點是「不要一把鑰匙開所有門」。密碼管理器讓你只需要記住一組主密碼，其餘交給它產生與保管。", "fun_fact": "駭客最愛的攻擊叫「撞庫」：拿 A 網站外洩的帳密，直接去 B 網站、C 網站一個個試——密碼重複使用就會全軍覆沒。", "region": "科技"}, {"id": "tc-039", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "雙因素驗證（2FA）之所以比只有密碼更安全，是因為它同時要求哪兩類證明？", "options": ["兩組完全不同的密碼", "你「知道」的東西（密碼）＋ 你「擁有」的東西（手機驗證碼或實體金鑰）", "帳號名稱＋密碼", "電子郵件地址＋手機號碼"], "answer": 1, "explanation": "2FA 的精神是混用不同「類別」的憑證：知識（密碼）、持有物（手機、金鑰）、生物特徵（指紋、臉）。只要不同類，被偷一項也還有第二道防線。", "fun_fact": "資安專家普遍認為，簡訊驗證碼是 2FA 中相對較弱的一種，因為有被「SIM 卡挾持」的風險；驗證器 App 或實體安全金鑰更保險。", "region": "科技"}, {"id": "tc-040", "topic": "tech", "category": "資安", "difficulty": 1, "type": "cho
