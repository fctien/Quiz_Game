的星星"], "answer": 2, "explanation": "Moo Deng 是泰國考溪開放動物園的侏儒河馬，名字由網友投票選出，泰文意思是「彈跳豬肉」，指一種 Q 彈的肉丸。", "fun_fact": "侏儒河馬原產於西非，野外只剩約 2,000 到 3,000 隻，是瀕危物種。", "source": "https://www.cbsnews.com/news/moo-deng-baby-hippo-thailand-zoo-bouncy-pork-goes-viral/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-002", "category": "時事", "difficulty": 1, "type": "choice", "question": "2024 年，澳洲墨爾本水族館的國王企鵝寶寶「Pesto」在網路爆紅，牠為什麼這麼出名？", "options": ["牠自己游出水族館跑去逛街", "牠會用鰭拍打出音樂節拍", "才 9 個月大，體重就將近爸媽的兩倍", "牠是全身雪白的罕見白化企鵝"], "answer": 2, "explanation": "Pesto 9 個月大時重約 22.5 公斤，而牠的爸媽只有 11 到 12 公斤，毛茸茸的巨大身材讓牠成為網路明星。", "fun_fact": "保育員說 Pesto 的爸爸以前就是該館「最大隻企鵝」的紀錄保持者，大個子可能是遺傳。", "source": "https://www.abc.net.au/news/2024-09-24/pesto-penguin-biggest-chick-at-melbourne-aquarium/104385040", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-003", "category": "時事", "difficulty": 2, "type": "choice", "question": "真新聞還是假新聞？2023 年泰勒絲在美國西雅圖開唱，現場造成的地面震動被地震儀記錄下來，相當於規模約 2.3 的地震。", "options": ["對", "錯"], "answer": 0, "explanation": "真新聞！2023 年 7 月泰勒絲在西雅圖連開兩場演唱會，地震學家測得的震動相當於規模約 2.3，被稱為「Swift Quake」。", "fun_fact": "這次震動比 2011 年美式足球賽引發的知名「Beast Quake」（約規模 2.0）還強。", "source": "https://amp.cbc.ca/news/science/taylor-swift-seattle-concert-seismology-1.6921705", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-004", "category": "時事", "difficulty": 1, "type": "choice", "question": "2024 年巴黎奧運，一位 51 歲的土耳其選手單手插口袋、只戴普通眼鏡和小耳塞就拿下銀牌而爆紅。他參加的是哪一項運動？", "options": ["射擊（10 公尺空氣手槍）", "射箭", "擊劍", "滑板"], "answer": 0, "explanation": "土耳其選手迪凱奇在 10 公尺空氣手槍混合團體賽奪銀，他不戴專業護目鏡和大耳罩，一派輕鬆的模樣讓全球網友瘋狂模仿。", "fun_fact": "他賽後說：「我不需要特殊裝備，我是天生的射手。」", "source": "https://www.nbcnews.com/news/sports/sharpshooter-yusuf-dikec-silver-olympics-minimal-gear-internet-sensati-rcna164685", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-005", "category": "時事", "difficulty": 2, "type": "choice", "question": "真新聞還是假新聞？2024 年 1 月，日本探月器 SLIM 成功登陸月球，但落地時是「倒栽蔥」的姿勢。", "options": ["對", "錯"], "answer": 0, "explanation": "真新聞！SLIM 在降落前一具主引擎失去推力，最後以倒立的姿勢著陸，但降落位置距離目標只有約 55 公尺，精準度驚人。", "fun_fact": "SLIM 的外號是「月球狙擊手」，日本也因此成為第 5 個成功登月的國家。", "source": "https://www.pbs.org/newshour/science/japans-1st-moon-lander-has-hit-its-target-but-it-appears-to-be-upside-down", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-006", "category": "時事", "difficulty": 2, "type": "choice", "question": "2025 年 4 月，流行歌手凱蒂佩芮搭乘藍色起源公司的太空船進行約 10 分鐘的太空飛行。她帶了什麼上太空？", "options": ["一朵雛菊", "一隻泰迪熊", "一瓶香水", "一把吉他"], "answer": 0, "explanation": "凱蒂佩芮帶著一朵雛菊登上太空船，還在飛行中清唱了〈What a Wonderful World〉。", "fun_fact": "這趟 6 名女性組成的飛行，是 1963 年以來第一次全女性的太空飛行。", "source": "https://www.npr.org/2025/04/14/nx-s1-5364460/blue-origin-launch-female-space-flight-katy-perry", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-007", "category": "時事", "difficulty": 1, "type": "choice", "question": "2024 年巴黎奧運期間，一位挪威游泳選手在網路上大推選手村的某種食物，讓它意外爆紅。那是什麼？", "options": ["馬卡龍", "法式可頌", "巧克力瑪芬", "鹹派"], "answer": 2, "explanation": "挪威泳將克里斯蒂安森在 TikTok 上給選手村的巧克力瑪芬打了「11 分（滿分 10 分）」，被網友封為「瑪芬人」。", "fun_fact": "許多其他國家的選手也跟著拍影片試吃，瑪芬成了巴黎奧運最紅的「非正式明星」。", "source": "https://globalnews.ca/news/10686295/olympic-chocolate-muffin-man-henrik-christiansen/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-008", "category": "時事", "difficulty": 2, "type": "choice", "question": "真新聞還是假新聞？在 2024 年巴黎奧運首度登場的霹靂舞，也會在 2028 年洛杉磯奧運繼續舉行。", "options": ["對", "錯"], "answer": 1, "explanation": "假新聞！霹靂舞在巴黎奧運首次成為正式項目，但沒有被列入 2028 年洛杉磯奧運的比賽項目。", "fun_fact": "洛杉磯奧運新增的項目包括板球、腰旗美式足球、袋棍球和壁球，棒壘球也重返奧運。", "source": "https://www.forbes.com/sites/jasonpu/2024/08/15/breaking-will-not-be-in-the-2028-los-angeles-olympics-whats-next/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-009", "category": "時事", "difficulty": 3, "type": "choice", "question": "2024 年，臺北市立動物園新生的馬來貘寶寶經過網路票選，最後取了什麼名字？", "options": ["貘範生", "貘茶", "貘睏霸", "莉姆路"], "answer": 3, "explanation": "「莉姆路」以 3,547 票勝出，保育員沿用媽媽「貘莉」名字的最後一個字，再聯想日本輕小說與漫畫主角的名字而取名。", "fun_fact": "決選中第二名是得到 3,209 票的「貘茶」，「莉姆路」只贏了 338 票。", "source": "https://www.zoo.gov.taipei/News_Content.aspx?n=BD065B2FA7782989&sms=72544237BBE4C5F6&s=0FD8E053FD089A60", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-010", "category": "時事", "difficulty": 3, "type": "choice", "question": "臺北市立動物園在 2024 年 10 月舉辦了大型慶生活動，那一年動物園滿幾歲？", "options": ["110 歲", "150 歲", "50 歲", "80 歲"], "answer": 0, "explanation": "臺北市立動物園 1914 年在圓山創立，到 2024 年正好 110 歲。", "fun_fact": "動物園在 1986 年才從圓山搬到現在的木柵。", "source": "https://www.cna.com.tw/news/ahel/202410260122.aspx", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-011", "category": "時事", "difficulty": 1, "type": "choice", "question": "2026 年 1 月，美國攀岩家霍諾德在全球直播下，不用繩索徒手爬上了台灣哪一棟大樓？", "options": ["高雄 85 大樓", "台北 101", "台中國家歌劇院", "新光摩天大樓"], "answer": 1, "explanation": "霍諾德在 2026 年 1 月 25 日無繩徒手攀登台北 101，約 91 分鐘就登頂，全程在網路上直播。", "fun_fact": "原本預定前一天攀登，因為下雨延期了一天。", "source": "https://www.storm.mg/lifestyle/11098054", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-012", "category": "時事", "difficulty": 2, "type": "choice", "question": "2026 年 4 月，NASA「阿提米絲 2 號」的 4 名太空人完成了什麼任務？", "options": ["登陸月球南極並插上旗子", "在月球表面建立第一座基地", "繞月飛行後返回地球，是半世紀以來人類首度前往月球", "成為第一批登陸火星的人類"], "answer": 2, "explanation": "阿提米絲 2 號在 2026 年 4 月 1 日發射、4 月 10 日返回，太空人繞過月球，是 1972 年阿波羅計畫之後人類首次前往月球。", "fun_fact": "他們飛到距離地球約 40 萬公里遠，打破了 1970 年阿波羅 13 號創下的人類最遠飛行紀錄。", "source": "https://www.nasa.gov/news-release/nasa-welcomes-record-setting-artemis-ii-moonfarers-back-to-earth/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-013", "category": "時事", "difficulty": 1, "type": "choice", "question": "真新聞還是假新聞？2022 年，一名日本男子花了約 200 萬日圓，請專業公司訂製超逼真的狗狗裝，實現他「變成動物」的夢想。", "options": ["對", "錯"], "answer": 0, "explanation": "真新聞！這套牧羊犬造型裝由專做影視道具的日本公司花了約 40 天製作，照片一出就在網路上爆紅。", "fun_fact": "製作公司說，狗和人的骨架結構差很多，他們花了很多時間研究怎麼讓人穿起來看起來像真的狗。", "source": "https://www.newsweek.com/its-too-real-man-spends-thousands-incredibly-lifelike-dog-costume-twitter-1710504", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-014", "category": "時事", "difficulty": 3, "type": "choice", "question": "2022 年，NASA 讓 DART 太空船故意撞上一顆小行星，結果發生了什麼事？", "options": ["小行星的繞行週期縮短了約 32 分鐘", "小行星被撞成碎片消失", "小行星被推進太陽燒掉", "太空船撞偏了，完全沒有打中"], "answer": 0, "explanation": "DART 撞擊後，小行星「迪莫弗斯」繞行主星的時間從 11 小時 55 分縮短為 11 小時 23 分，是人類第一次刻意改變天體的軌道。", "fun_fact": "NASA 原本預估大約只會縮短 10 分鐘，實際效果是預估的 3 倍多。", "source": "https://www.npr.org/2022/10/11/1128132956/nasa-dart-success-asteroid-dimorphos", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-015", "category": "時事", "difficulty": 1, "type": "choice", "question": "2026 年世界盃足球賽首度由美國、墨西哥、加拿大三國合辦，也有三隻吉祥物。代表加拿大的吉祥物是什麼動物？", "options": ["駝鹿", "北極熊", "白頭海鵰", "美洲豹"], "answer": 0, "explanation": "三隻吉祥物分別是代表加拿大的駝鹿 Maple、代表墨西哥的美洲豹 Zayu，以及代表美國的白頭海鵰 Clutch。", "fun_fact": "國際足總在 2025 年 9 月公布這三隻吉祥物，距離 2026 年 6 月 11 日世界盃開幕不到 9 個月。", "source": "https://www.foxsports.com/articles/soccer/2026-world-cup-mascots-include-bald-eagle-clutch-jaguar-zayu-and-moose-maple", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-016", "category": "紀錄", "difficulty": 2, "type": "choice", "question": "金氏世界紀錄「持續最久的彩虹」長達 8 小時 58 分鐘，是在哪裡觀測到的？（資料時間：2026 年）", "options": ["美國夏威夷", "台灣台北陽明山", "紐西蘭皇后鎮", "冰島雷克雅維克"], "answer": 1, "explanation": "2017 年 11 月 30 日，中國文化大學大氣科學系在陽明山觀測到從早上 6:57 到下午 3:55 都有彩虹，獲金氏世界紀錄認證。", "fun_fact": "那天最多曾同時出現 4 道彩虹。", "source": "https://www.guinnessworldrecords.com/world-records/66553-longest-lasting-rainbow", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-017", "category": "紀錄", "difficulty": 3, "type": "choice", "question": "金氏世界紀錄「世界最長個人姓名」的保持者，是一名在紐西蘭出生、現居澳洲的男子。他的全名大約由多少個名字組成？（資料時間：2026 年）", "options": ["約 2,250 個", "約 22 個", "約 22,500 個", "約 225 個"], "answer": 0, "explanation": "他在 24 歲時依法改名，全名由 2,253 個名字組成，1990 年獲金氏世界紀錄認證，保持至今。", "fun_fact": "他在紐西蘭申請改名時一度被拒，上訴到高等法院才獲准，之後紐西蘭政府還因此修改了兩條法律，避免有人再這樣改名。", "source": "https://www.guinnessworldrecords.com/news/2025/10/meet-the-man-with-the-worlds-longest-name-who-had-to-win-a-legal-battle-to-keep-it", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-018", "category": "紀錄", "difficulty": 3, "type": "choice", "question": "2025 年，一名日本男子用雙手雙腳著地、像猩猩一樣奔跑，創下「四足跑 100 公尺」的金氏世界紀錄。他的成績大約是幾秒？（資料時間：2025 年）", "options": ["約 30 秒", "約 14.6 秒", "約 9.6 秒", "約 1 分鐘"], "answer": 1, "explanation": "這位 22 歲男子在 2025 年 9 月跑出 14.55 秒，打破美國人 2022 年創下的 15.66 秒紀錄。", "fun_fact": "他從國中開始就自己研究這種奔跑方式。", "source": "https://www.cna.com.tw/news/aspt/202509250273.aspx", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-019", "category": "紀錄", "difficulty": 2, "type": "choice", "question": "2024 年，法國麵包師傅烤出長達約 140 公尺的法國長棍麵包，創下世界最長法棍紀錄。他們是從哪個國家手中搶回這項紀錄的？（資料時間：2024 年）", "options": ["義大利", "德國", "美國", "日本"], "answer": 0, "explanation": "巴黎近郊敘雷訥的 12 位麵包師傅烤出 140.53 公尺的法棍，打破義大利 2019 年創下的 132.62 公尺紀錄。", "fun_fact": "法國平均每秒大約賣出 320 根法棍，難怪法國麵包師傅說要把這項紀錄「帶回家」。", "source": "https://www.cna.com.tw/news/aopl/202405060036.aspx", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-020", "category": "紀錄", "difficulty": 3, "type": "choice", "question": "日本與澳洲研究團隊在深海拍到一條「蝸牛魚」游動的畫面，被金氏世界紀錄認證為「最深處的魚」。牠被拍到的深度大約是多少？（資料時間：2026 年）", "options": ["約 500 公尺", "約 3,800 公尺", "約 8,300 公尺", "約 1,000 公尺"], "answer": 2, "explanation": "這條半透明的蝸牛魚（獅子魚科）是 2022 年在日本南方的伊豆－小笠原海溝約 8,336 公尺深處被拍到的，2023 年獲得金氏紀錄認證，至今仍是紀錄保持者。", "fun_fact": "那個深度的水壓大約是每平方公分 800 公斤。", "source": "https://www.cna.com.tw/news/aopl/202304040243.aspx", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-021", "category": "紀錄", "difficulty": 3, "type": "choice", "question": "日本海洋冒險家堀江謙一在 2022 年單人駕駛帆船、中途不停靠橫越太平洋，成為完成這項壯舉最年長的人。他當時幾歲？（資料時間：2026 年）", "options": ["83 歲", "73 歲", "93 歲", "63 歲"], "answer": 0, "explanation": "堀江謙一在 83 歲時花了 69 天完成航程，獲金氏世界紀錄認證。", "fun_fact": "2026 年 9 月他在 88 歲生日宣布，要在 2027 年再挑戰一次，刷新自己的紀錄。", "source": "https://www.cna.com.tw/news/aopl/202609080149.aspx", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-023", "category": "紀錄", "difficulty": 2, "type": "order", "question": "請把下列摩天大樓依高度由高到低排列。（資料時間：2026 年）", "options": ["上海中心大廈", "吉隆坡默迪卡 118", "杜拜哈里發塔", "台北 101"], "answer": [2, 1, 0, 3], "explanation": "哈里發塔約 828 公尺、默迪卡 118 約 679 公尺、上海中心約 632 公尺、台北 101 約 508 公尺。", "fun_fact": "默迪卡 118 在 2023 年完工後，擠下上海中心成為世界第二高樓。", "source": "https://www.skyscrapercenter.com/buildings", "asof": "2026-09", "expires": "2027-09-01", "region": "趣聞", "topic": "fun"}, {"id": "fn-024", "category": "冷知識", "difficulty": 1, "type": "choice", "question": "玩具品牌「樂高」（LEGO）的名字來自丹麥文，原本是什麼意思？", "options": ["玩得好", "快樂的孩子", "蓋房子", "小積木"], "answer": 0, "explanation": "LEGO 來自丹麥文「leg godt」，意思是「玩得好」，由創辦人在 1936 年取名。", "fun_fact": "巧合的是，LEGO 在拉丁文裡有「我收集」的意思，但取名時樂高還沒開始做積木。", "source": "https://www.lego.com/en-us/aboutus/news/2026/february/90-year-history-of-the-lego-name", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-025", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "瑞典家具品牌「IKEA」這四個字母是怎麼來的？", "options": ["瑞典文「溫暖的家」的縮寫", "創辦人家裡養的狗的名字", "四位創辦人姓氏的第一個字母", "創辦人姓名加上他家農場和村莊名稱的字首"], "answer": 3, "explanation": "IKEA 是 Ingvar Kamprad（創辦人）、Elmtaryd（家中農場）、Agunnaryd（家鄉村莊）的字首組合。", "fun_fact": "創辦人 1943 年成立 IKEA 時才 17 歲，因為還未成年，得經過監護人同意才能登記公司。", "source": "https://ikeamuseum.com/en/explore/the-story-of-ikea/meet-ingvar-kamprad/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-026", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "真的還是假的？冰淇淋品牌「哈根達斯」（Häagen-Dazs）來自丹麥，名字是丹麥文。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！哈根達斯是 1961 年在美國紐約布朗克斯創立的品牌，名字是創辦人刻意編出來、聽起來很像北歐語言的字，其實沒有任何意思。", "fun_fact": "丹麥文根本不使用「ä」這種上面加兩點的字母，這個名字也不符合丹麥文的拼法。", "source": "https://www.atlasobscura.com/articles/haagen-dazs-fake-foreign-branding", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-027", "category": "冷知識", "difficulty": 1, "type": "choice", "question": "放了鳳梨和火腿的「夏威夷披薩」，其實是在哪個國家發明的？", "options": ["加拿大", "美國夏威夷", "澳洲", "義大利"], "answer": 0, "explanation": "夏威夷披薩是 1962 年在加拿大安大略省的一家餐廳發明的，名稱來自當時使用的鳳梨罐頭品牌。", "fun_fact": "發明者是從希臘移民到加拿大的餐廳老闆，他說當初只是「好玩加加看」。", "source": "https://time.com/4814056/hawaiian-pizza-pineapple-sam-panopoulos-death/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-028", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "1958 年發明泡麵（雞汁拉麵）、創立日清食品的安藤百福，出生在台灣的哪裡？", "options": ["台南安平", "彰化鹿港", "基隆", "嘉義朴子"], "answer": 3, "explanation": "「泡麵之父」安藤百福原名吳百福，1910 年出生於嘉義朴子，後來到日本發展並發明了泡麵。", "fun_fact": "推出雞汁拉麵的同一年，他的公司也正式定名為「日清食品」。", "source": "https://news.ltn.com.tw/news/life/breakingnews/2254062", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-029", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "無線傳輸技術「藍牙」（Bluetooth）的名字，是紀念哪一位歷史人物？", "options": ["一位牙齒發藍的英國發明家", "希臘神話中的海神", "一位愛吃藍莓的瑞典工程師", "一位外號「藍牙」的丹麥國王"], "answer": 3, "explanation": "藍牙以 10 世紀的丹麥國王哈拉爾「藍牙」命名，他統一了丹麥和挪威，就像這項技術想統一電腦與手機的連線方式。", "fun_fact": "藍牙的標誌是把國王名字縮寫的兩個北歐古文字母疊在一起。", "source": "https://www.bluetooth.com/about-us/bluetooth-origin/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-030", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "咖啡品牌「星巴克」（Starbucks）的名字，靈感來自哪裡？", "options": ["西雅圖的一條老街", "小說《白鯨記》裡捕鯨船的大副", "創辦人家鄉的一座燈塔", "一種會發光的海星"], "answer": 1, "explanation": "星巴克的名字來自梅爾維爾小說《白鯨記》中捕鯨船「皮廓德號」的大副 Starbuck。", "fun_fact": "創辦人之一原本想直接把公司叫做「皮廓德號」（Pequod），但被設計師否決了。", "source": "https://about.starbucks.com/history/our-name/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-031", "category": "冷知識", "difficulty": 1, "type": "choice", "question": "哪一種動物的大便是「方塊形」的？", "options": ["袋熊", "袋鼠", "無尾熊", "水豚"], "answer": 0, "explanation": "澳洲的袋熊因為腸道不同部位的彈性和收縮速度不一樣，會把大便塑形成小方塊。", "fun_fact": "方塊大便不容易滾走，袋熊會把它放在石頭上標記地盤。", "source": "https://www.smithsonianmag.com/smart-news/scientists-have-solved-mystery-how-wombats-poop-cubes-180976898/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-032", "category": "冷知識", "difficulty": 1, "type": "choice", "question": "章魚有幾顆心臟？", "options": ["3 顆", "1 顆", "2 顆", "8 顆"], "answer": 0, "explanation": "章魚有 3 顆心臟：2 顆負責把血液送到鰓，1 顆負責把血液送到全身。", "fun_fact": "章魚的血液含銅，所以是藍色的；而且游泳時送血到全身的那顆心臟會停止跳動，所以章魚比較喜歡用爬的。", "source": "https://www.smithsonianmag.com/science-nature/ten-wild-facts-about-octopuses-they-have-three-hearts-big-brains-and-blue-blood-7625828/", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-033", "category": "冷知識", "difficulty": 3, "type": "choice", "question": "巴黎艾菲爾鐵塔 1889 年完工時高 312 公尺，現在卻有 330 公尺。它「長高」的主要原因是什麼？", "options": ["每年夏天熱脹後沒有完全縮回去", "塔頂陸續加裝了廣播和電視天線", "後來又加蓋了一層觀景台", "地底下的地層慢慢隆起"], "answer": 1, "explanation": "艾菲爾鐵塔在 1957 年、2000 年和 2022 年陸續加裝天線，才從 312 公尺增加到 330 公尺。", "fun_fact": "晴天時鐵塔被太陽照到的一面會受熱膨脹，塔頂會跟著移動，畫出直徑約 15 公分的圓。", "source": "https://www.toureiffel.paris/en/news/history-and-culture/why-does-eiffel-tower-change-size", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-034", "category": "冷知識", "difficulty": 1, "type": "choice", "question": "真的還是假的？以植物學的定義來說，香蕉屬於「漿果」，草莓反而不是。", "options": ["對", "錯"], "answer": 0, "explanation": "真的！漿果是由花的子房發育成、果肉多汁並包著種子的果實，香蕉符合定義；草莓的果肉則是由花托發育而來，屬於「假果」。", "fun_fact": "照這個定義，南瓜、小黃瓜也都算漿果。", "source": "https://www.mcgill.ca/oss/article/did-you-know/bananas-are-berries-raspberries-are-not", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-035", "category": "冷知識", "difficulty": 2, "type": "order", "question": "請把下列經典品牌或角色，依「誕生年份」由早到晚排列。", "options": ["泡麵（雞汁拉麵）問世", "可口可樂首次販售", "米老鼠首次登場", "任天堂創立"], "answer": [1, 3, 2, 0], "explanation": "可口可樂 1886 年在美國亞特蘭大開賣，任天堂 1889 年在京都創立，米老鼠 1928 年在《汽船威利》登場，泡麵則在 1958 年問世。", "fun_fact": "任天堂一開始是做花札紙牌的公司，比米老鼠還早出生快 40 年。", "source": "https://www.coca-colacompany.com/about-us/history/the-birth-of-a-refreshing-idea", "asof": "2026-09", "region": "趣聞", "topic": "fun"}, {"id": "fn-036", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "哪一種動物的指紋和人類的指紋極為相似，放大之後連專家都可能認錯？", "options": ["無尾熊", "黑猩猩", "袋鼠", "浣熊"], "answer": 0, "explanation": "澳洲的研究發現無尾熊指尖也有弓紋、箕紋、斗紋等完整的指紋構造，紋路的形態和人類幾乎分不出差別。", "fun_fact": "人類與無尾熊親緣關係非常遠，這是各自演化出來的「趨同演化」——抓握樹枝與嫩葉時，指紋能增加觸覺敏銳度與抓力。", "source": "https://www.mcgill.ca/oss/article/did-you-know/koalas-have-fingerprints-just-humans", "region": "趣聞"}, {"id": "fn-037", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "長頸鹿的脖子那麼長，牠的頸椎總共有幾塊？", "options": ["32 塊，接近蛇的數量", "21 塊，比人類多一倍", "7 塊，和人類一樣多", "14 塊，是人類的兩倍"], "answer": 2, "explanation": "幾乎所有哺乳類的頸椎都是 7 塊，長頸鹿也不例外，只是每一塊都被拉長到約 25 公分。", "fun_fact": "老鼠、鯨魚、人類的頸椎同樣是 7 塊；哺乳類中少數的例外是樹懶和海牛。", "source": "https://en.wikipedia.org/wiki/Giraffe", "region": "趣聞"}, {"id": "fn-038", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "夏天在耳邊嗡嗡叫、還會叮人的蚊子，是哪一種？", "options": ["只有剛羽化的年輕蚊子吸血", "只有母蚊會吸血，公蚊吸花蜜", "只有公蚊會吸血，母蚊吸花蜜", "公蚊母蚊都吸血，母蚊吸較多"], "answer": 1, "explanation": "母蚊需要血液中的蛋白質才能讓卵發育成熟，公蚊的口器根本無法刺穿皮膚，一生只吸花蜜與植物汁液。", "fun_fact": "母蚊靠人呼出的二氧化碳、體溫與皮膚上的氣味找到你，所以運動完、流汗時特別容易被叮。", "source": "https://en.wikipedia.org/wiki/Mosquito", "region": "趣聞"}, {"id": "fn-039", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "下列哪一種動物是唯一能真正拍動翅膀持續飛行的哺乳類？", "options": ["飛鼠", "蜜袋鼯", "鼯猴", "蝙蝠"], "answer": 3, "explanation": "飛鼠、蜜袋鼯、鼯猴都只能靠皮膜滑翔，飛行途中會持續下降；只有蝙蝠的前肢演化成真正的翅膀，能拍翅飛行甚至爬升。", "fun_fact": "蝙蝠的翅膀其實是被皮膜連起來的「手」，五根指骨拉得又細又長，翼展比身體大上好幾倍。", "source": "https://en.wikipedia.org/wiki/Bat", "region": "趣聞"}, {"id": "fn-040", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "駱駝背上的駝峰裡面，主要儲存的是什麼？", "options": ["可調節體溫的空氣囊", "大量可以直接飲用的水", "可以代謝產能的脂肪", "額外的肌肉與軟骨組織"], "answer": 2, "explanation": "駝峰其實是一大團脂肪，能在缺乏食物時分解供應能量；駱駝耐渴靠的是特殊的紅血球與腎臟，不是駝峰儲水。", "fun_fact": "脂肪集中堆在背上而不是平均分布全身，反而讓身體其他部位更容易散熱，這在沙漠是很划算的設計。", "source": "https://en.wikipedia.org/wiki/Camel", "region": "趣聞"}, {"id": "fn-041", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "哺乳類幾乎都是胎生，但有一小群哺乳類是「下蛋」的，牠們是誰？", "options": ["鴨嘴獸和針鼴", "樹懶和食蟻獸", "袋鼠和無尾熊", "蝙蝠和鼩鼱"], "answer": 0, "explanation": "鴨嘴獸與針鼴屬於「單孔類」，會產卵並孵蛋，但寶寶孵出後仍靠母獸的乳汁長大，所以確實是哺乳類。", "fun_fact": "單孔類沒有乳頭，乳汁是從腹部特定區域的皮膚滲出來，寶寶直接用舔的。", "source": "https://en.wikipedia.org/wiki/Monotreme", "region": "趣聞"}, {"id": "fn-042", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "紅鶴（火鶴）身上漂亮的粉紅色，主要是怎麼來的？", "options": ["是羽毛本身的粉紅色素", "靠曬太陽後慢慢變色", "是求偶期才長的羽毛", "來自食物裡的天然色素"], "answer": 3, "explanation": "紅鶴以藻類和小型甲殼類為食，這些食物含有類胡蘿蔔素，色素隨血液沉積到羽毛上，就成了粉紅色。", "fun_fact": "動物園若不在飼料裡補充類胡蘿蔔素，紅鶴的羽毛會慢慢褪成白色；剛孵化的紅鶴寶寶本來也是灰白色的。", "source": "https://en.wikipedia.org/wiki/Flamingo", "region": "趣聞"}, {"id": "fn-043", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "鯊魚的骨骼和一般魚類最大的不同是什麼？", "options": ["牠的骨骼中空且充滿空氣", "牠的骨骼完全由軟骨構成", "牠的骨骼比一般魚更堅硬", "牠根本沒有任何骨骼構造"], "answer": 1, "explanation": "鯊魚屬於軟骨魚類，全身骨架是軟骨而不是硬骨，重量較輕、彈性較好，有助於在水中維持浮力與靈活度。", "fun_fact": "軟骨不容易形成化石，所以古代鯊魚留下來的化石絕大多數只有牙齒。", "source": "https://en.wikipedia.org/wiki/Chondrichthyes", "region": "趣聞"}, {"id": "fn-044", "topic": "fun", "category": "動物", "difficulty": 1, "type": "choice", "question": "為什麼在北極看不到野生的企鵝？", "options": ["北極的日照時間不適合", "企鵝全都分布在南半球", "北極的海水對牠們太冷", "北極熊把企鵝都吃光了"], "answer": 1, "explanation": "全世界的野生企鵝都分布在南半球，最北只到赤道附近的加拉巴哥群島，從來沒有自然分布到北極。", "fun_fact": "「penguin」這個字最早其實是指北大西洋的大海雀，牠外型像企鵝卻沒有親緣關係，在 19 世紀已經滅絕。", "source": "https://en.wikipedia.org/wiki/Penguin", "region": "趣聞"}, {"id": "fn-045", "topic": "fun", "category": "海洋", "difficulty": 1, "type": "choice", "question": "水母的身體構造非常特別，牠的體重大約有多少比例是水？", "options": ["約 30%", "約 50%", "約 70%", "約 95%"], "answer": 3, "explanation": "水母沒有骨骼、心臟，也沒有大腦，身體約 95% 以上是水，靠傘狀身體收縮把水推開前進。", "fun_fact": "正因為含水量極高，水母被沖上沙灘後很快就會「蒸發」得只剩下薄薄一層膜。", "source": "https://en.wikipedia.org/wiki/Jellyfish", "region": "趣聞"}, {"id": "fn-046", "topic": "fun", "category": "人體", "difficulty": 1, "type": "choice", "question": "剛出生的嬰兒和成年人相比，全身的骨頭數量如何？", "options": ["嬰兒比較多，之後會癒合", "兩者一樣，只是尺寸不同", "嬰兒比較少，之後會增生", "嬰兒比較少，成年後倍增"], "answer": 0, "explanation": "新生兒約有 300 塊骨頭（其中很多還是軟骨），成長過程中許多骨頭會互相癒合，成人大約只剩 206 塊。", "fun_fact": "頭骨出生時是分開的好幾片，中間留有柔軟的「囟門」，方便通過產道，也讓大腦有空間快速長大。", "source": "https://en.wikipedia.org/wiki/List_of_bones_of_the_human_skeleton", "region": "趣聞"}, {"id": "fn-047", "topic": "fun", "category": "人體", "difficulty": 1, "type": "choice", "question": "以重量和面積來說，人體最大的器官是哪一個？", "options": ["大腸", "肝臟", "皮膚", "肺臟"], "answer": 2, "explanation": "成人的皮膚攤開約有 1.5 到 2 平方公尺，重量可達數公斤，是人體面積與重量都最大的器官。", "fun_fact": "皮膚最外層的角質細胞不斷剝落更新，家裡累積的灰塵當中，有相當比例就是人和寵物脫落的皮屑。", "source": "https://en.wikipedia.org/wiki/Human_skin", "region": "趣聞"}, {"id": "fn-048", "topic": "fun", "category": "人體", "difficulty": 1, "type": "choice", "question": "人的舌頭能分辨五種基本味覺，甜、鹹、酸、苦之外的第五種是什麼？", "options": ["涼味", "辣味", "澀味", "鮮味"], "answer": 3, "explanation": "第五種基本味覺是「鮮味」，由麩胺酸等物質引發，1908 年由日本學者池田菊苗從昆布高湯中發現並命名。", "fun_fact": "昆布、柴魚、番茄、菇類和熟成起司都富含麩胺酸，這也是它們吃起來特別「回甘」的原因。", "source": "https://en.wikipedia.org/wiki/Umami", "region": "趣聞"}, {"id": "fn-049", "topic": "fun", "category": "人體", "difficulty": 1, "type": "choice", "question": "看到別人打哈欠，自己也忍不住跟著打，這個現象叫什麼？", "options": ["生理時鐘同步", "傳染性打哈欠", "條件反射作用", "集體缺氧反應"], "answer": 1, "explanation": "這叫「傳染性打哈欠」，看到、聽到，甚至只是讀到打哈欠的文字描述都可能被引發，一般認為和同理心與社會連結有關。", "fun_fact": "狗也會被人類的哈欠「傳染」，而且研究發現牠們對熟悉的主人反應比對陌生人更明顯。", "source": "https://en.wikipedia.org/wiki/Yawn", "region": "趣聞"}, {"id": "fn-050", "topic": "fun", "category": "天氣", "difficulty": 1, "type": "choice", "question": "颱風、颶風和氣旋這三個名詞，彼此的關係是什麼？", "options": ["分別發生在海上陸上和高空", "依旋轉方向不同分成三類", "同一種天氣系統的不同稱呼", "三種強度完全不同的風暴"], "answer": 2, "explanation": "三者都是熱帶氣旋，只是名稱隨海域而異：西北太平洋叫颱風，北大西洋與東北太平洋叫颶風，印度洋與南太平洋叫氣旋。", "fun_fact": "因此同一個風暴若從東邊跨過換日線進入西北太平洋，稱呼也會跟著從颶風改叫颱風。", "source": "https://oceanservice.noaa.gov/facts/cyclone.html", "region": "趣聞"}, {"id": "fn-051", "topic": "fun", "category": "天氣", "difficulty": 1, "type": "choice", "question": "晴朗的白天，天空看起來是藍色的，主要原因是什麼？", "options": ["陽光的藍光最容易被空氣散射", "天空反射了海洋表面的顏色", "大氣層本身含有藍色的氣體", "臭氧層把其他顏色都吸收掉"], "answer": 0, "explanation": "空氣分子對波長較短的藍光散射效率遠高於紅光（瑞利散射），藍光被散射到四面八方，我們抬頭就看到滿天藍色。", "fun_fact": "日出日落時陽光要斜穿過更厚的大氣，藍光幾乎被散射殆盡，剩下紅橙光直達眼睛，天空就轉為橘紅。", "source": "https://en.wikipedia.org/wiki/Rayleigh_scattering", "region": "趣聞"}, {"id": "fn-052", "topic": "fun", "category": "海洋", "difficulty": 1, "type": "choice", "question": "漂浮在海面上的冰山，大約有多少比例藏在水面底下？", "options": ["約 90%", "約 25%", "約 10%", "約 50%"], "answer": 0, "explanation": "冰的密度比海水略小，冰山露出水面的部分只佔大約十分之一，其餘約九成都沉在水面下。", "fun_fact": "「冰山一角」這句話就是這樣來的；船隻真正要閃避的，是水面下往往比看得見的部分更寬大的冰體。", "source": "https://en.wikipedia.org/wiki/Iceberg", "region": "趣聞"}, {"id": "fn-053", "topic": "fun", "category": "植物", "difficulty": 1, "type": "choice", "question": "關於鳳梨的生長方式，下列哪一項是正確的？", "options": ["結在攀爬的藤蔓上面", "結在高大喬木的枝條上", "長在貼地草本植物中央", "像馬鈴薯一樣長在地下"], "answer": 2, "explanation": "鳳梨是鳳梨科的草本植物，植株像一叢劍狀的葉子，果實就結在葉叢正中央，高度大約到成人的腰部。", "fun_fact": "一株鳳梨要一年半到兩年才結出第一顆果實，而且一次只結一顆，是相當慢工出細活的水果。", "source": "https://en.wikipedia.org/wiki/Pineapple", "region": "趣聞"}, {"id": "fn-054", "topic": "fun", "category": "自然", "difficulty": 1, "type": "choice", "question": "從氣象學的定義來看，南極洲其實屬於下列哪一種地區？", "options": ["草原", "沙漠", "雨林", "濕地"], "answer": 1, "explanation": "沙漠的定義是年降水量極少。南極內陸的年降水量折合僅約 50 毫米甚至更低，比許多熱沙漠還乾，屬於典型的「寒漠」。", "fun_fact": "南極的「乾谷」地區已經數百萬年幾乎沒有降雪，環境乾冷到 NASA 曾把它當作火星的模擬場地。", "source": "https://en.wikipedia.org/wiki/Climate_of_Antarctica", "region": "趣聞"}, {"id": "fn-055", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "工蜂回到蜂巢後跳的「搖擺舞」，是在傳達什麼訊息？", "options": ["蜂后即將分巢遷移", "巢內溫度需要調節", "警告附近出現天敵", "蜜源的方向和距離"], "answer": 3, "explanation": "工蜂會沿一條直線擺動腹部再繞回原點，直線與重力方向的夾角代表蜜源相對太陽的方位，擺動時間長短則代表距離。", "fun_fact": "破解這套「舞蹈語言」的奧地利學者弗里希，因此獲得 1973 年的諾貝爾生理醫學獎。", "source": "https://en.wikipedia.org/wiki/Waggle_dance", "region": "趣聞"}, {"id": "fn-056", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "「鴕鳥遇到危險就把頭埋進沙裡」這個說法，實際情況是什麼？", "options": ["是誤解，牠其實是把頭埋進草叢", "確實如此，但只有幼鳥會這樣", "是誤解，牠是低頭翻動巢中的蛋", "確實如此，這是牠的防禦本能"], "answer": 2, "explanation": "鴕鳥在沙地挖淺坑築巢，會不時把頭伸進坑裡翻動蛋，遠看就像把頭埋進沙中；真的遇到危險時牠多半是拔腿就跑或用腳猛踢。", "fun_fact": "鴕鳥奔跑時速可達 70 公里，腿力驚人，一腳踢出的力量足以造成致命傷。", "source": "https://en.wikipedia.org/wiki/Common_ostrich", "region": "趣聞"}, {"id": "fn-057", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "流傳很廣的「金魚記憶只有七秒」，實驗結果其實是怎樣？", "options": ["金魚能記住訓練內容達數個月", "金魚的記憶大約只有三十秒", "金魚完全沒有任何學習能力", "金魚只記得住同種的同伴"], "answer": 0, "explanation": "實驗中金魚能學會在特定聲音或顏色出現時前往餵食點取食，把牠移走數個月後再放回來仍然記得，記憶遠遠不只七秒。", "fun_fact": "「七秒記憶」找不到任何原始研究出處，是典型以訛傳訛的都市傳說。", "source": "https://en.wikipedia.org/wiki/Goldfish", "region": "趣聞"}, {"id": "fn-058", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "蛇不停地吐出分岔的舌頭，主要是在做什麼？", "options": ["恐嚇靠近的敵人或獵物", "感測周圍環境的溫度", "幫身體散熱降低體溫", "採集空氣中的氣味分子"], "answer": 3, "explanation": "蛇的舌頭把空氣與地面的氣味分子帶回口腔上方的「犁鼻器」分析；舌尖分岔能比較左右兩側的濃度差，像立體嗅覺一樣判斷方向。", "fun_fact": "響尾蛇等蝮蛇還另外有位在眼鼻之間的「頰窩」，能偵測紅外線，在全黑環境中也能「看見」溫血獵物。", "source": "https://en.wikipedia.org/wiki/Vomeronasal_organ", "region": "趣聞"}, {"id": "fn-059", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "蝴蝶停在葉子上時，會先用哪個部位判斷這株植物適不適合產卵？", "options": ["口器，得先吸一口才知道", "腳，牠的腳上有味覺受器", "觸角，靠上面的絨毛判斷", "翅膀，靠鱗片感應化學物"], "answer": 1, "explanation": "許多蝴蝶的跗節（腳的末端）分布著化學感受器，一踩上葉面就能「嘗」出植物種類，確認是幼蟲吃的食草才會產卵。", "fun_fact": "有些蝴蝶還會用腳把葉面刮出一點汁液讓氣味更明顯，再決定要不要把卵下在這裡。", "source": "https://en.wikipedia.org/wiki/Butterfly", "region": "趣聞"}, {"id": "fn-060", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "三趾樹懶幾乎整天待在樹上，大約多久才會爬下樹排便一次？", "options": ["大約一天一次", "大約一週一次", "大約一年一次", "大約一小時一次"], "answer": 1, "explanation": "三趾樹懶新陳代謝極慢，約每週才下樹一趟，在樹根旁挖個小坑排便，一次排掉的重量可達體重的兩三成。", "fun_fact": "下樹是樹懶最危險的時刻，多數被掠食的紀錄都發生在地面；有研究認為牠甘冒這個險，和毛髮裡共生的蛾與藻類有關。", "source": "https://www.scientificamerican.com/article/why-sloths-leave-the-trees-to-defecate/", "region": "趣聞"}, {"id": "fn-061", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "北極熊看起來一身雪白，但牠的毛和皮膚實際上是什麼顏色？", "options": ["毛是白色的，皮膚是粉紅", "毛是灰色的，皮膚是白色", "毛是透明的，皮膚是粉紅", "毛是透明的，皮膚是黑色"], "answer": 3, "explanation": "北極熊的護毛不含白色色素，是中空透明的管狀構造，因為散射光線才看起來雪白；毛底下的皮膚則是黑色的。", "fun_fact": "在動物園裡，若中空的毛管內長了藻類，北極熊有時候會整隻變成淡綠色。", "source": "https://www.loc.gov/everyday-mysteries/categories/zoology/item/is-a-polar-bears-fur-transparent/", "region": "趣聞"}, {"id": "fn-062", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "帝王企鵝在南極最嚴寒的冬天繁殖，把蛋放在腳背上孵的是誰？", "options": ["公企鵝，母企鵝出海覓食", "母企鵝，公企鵝出海覓食", "公母輪流，每天換一次班", "由族群裡的年長個體負責"], "answer": 0, "explanation": "母企鵝產下蛋後便交給公企鵝，自己出海補充體力；公企鵝把蛋放在腳背、用腹部的皮褶蓋住，禁食約兩個月直到蛋孵化。", "fun_fact": "孵蛋期間公企鵝們會擠成一大團並且不斷輪流換位置，讓每一隻都有機會待在比較溫暖的中心。", "source": "https://en.wikipedia.org/wiki/Emperor_penguin", "region": "趣聞"}, {"id": "fn-063", "topic": "fun", "category": "動物", "difficulty": 2, "type": "choice", "question": "蟑螂被切掉頭之後，為什麼還能存活相當長一段時間？", "options": ["牠能在幾天內從斷口重新長出頭部", "牠會立刻進入完全不需氧氣的休眠", "牠用體側氣孔呼吸，血壓也不會潰堤", "牠的頭部本來就沒有任何重要的器官"], "answer": 2, "explanation": "蟑螂不靠頭部和肺呼吸，而是由體節兩側的氣門把空氣直接送到全身；牠的循環系統是開放式、血壓很低，斷口很快就凝結封住。", "fun_fact": "科學家實測無頭蟑螂可以活上一星期左右，最後死因通常是渴死或餓死，而不是失血。", "source": "https://www.scientificamerican.com/article/fact-or-fiction-cockroach-can-live-without-head/", "region": "趣聞"}, {"id": "fn-064", "topic": "fun", "category": "人體", "difficulty": 2, "type": "choice", "question": "課本上常見的「舌頭味覺地圖」（舌尖嘗甜、兩側嘗酸），現在被認為如何？", "options": ["是對的，已被現代研究再次證實", "只有嬰兒時期的舌頭才符合這張圖", "只有甜味的分區正確其餘都錯誤", "是錯的，各區都能嘗到各種味道"], "answer": 3, "explanation": "這張圖源自 20 世紀初一篇德文論文被誤譯與過度簡化；實際上舌頭各區的味蕾都能偵測五種基本味覺，只是敏感度略有高低。", "fun_fact": "你可以自己驗證：把一點糖水沾在舌頭兩側或舌根，照樣嘗得出甜味。", "source": "https://www.smithsonianmag.com/science-nature/neat-and-tidy-map-tastes-tongue-you-learned-school-all-wrong-180963407/", "region": "趣聞"}, {"id": "fn-065", "topic": "fun", "category": "人體", "difficulty": 2, "type": "choice", "question": "「打噴嚏的瞬間心臟會停止跳動」這個說法正確嗎？", "options": ["正確，所以不能連續打噴嚏", "不正確，心跳只是節律略有變化", "正確，心臟會停跳約一秒鐘", "不正確，心跳反而會突然加倍"], "answer": 1, "explanation": "打噴嚏時胸腔壓力急遽改變，可能讓心跳節律稍微變慢或延後一拍，但心臟並不會真的停止跳動。", "fun_fact": "「打噴嚏一定得閉上眼睛」同樣是迷思——閉眼只是常見的連帶反射，硬撐著睜眼並不會發生什麼可怕的事。", "source": "https://en.wikipedia.org/wiki/Sneeze", "region": "趣聞"}, {"id": "fn-066", "topic": "fun", "category": "人體", "difficulty": 2, "type": "choice", "question": "人感到寒冷或緊張時起「雞皮疙瘩」，皮膚上發生了什麼事？", "options": ["汗腺急速收縮擠出少量汗水", "表皮細胞吸水後局部地膨脹", "毛囊旁的立毛肌收縮把毛豎起", "皮下的微血管瞬間大量充血"], "answer": 2, "explanation": "每根汗毛底部都連著一小條「立毛肌」，受交感神經刺激收縮時把毛拉直，毛囊周圍隆起，就成了一顆顆的雞皮疙瘩。", "fun_fact": "這是祖先留下的反應：毛髮豎起能蓬鬆保暖，也能讓身體看起來更大以嚇阻對手——貓狗「炸毛」用的正是同一套機制。", "source": "https://en.wikipedia.org/wiki/Goose_bumps", "region": "趣聞"}, {"id": "fn-067", "topic": "fun", "category": "人體", "difficulty": 2, "type": "choice", "question": "「人死後指甲和頭髮還會繼續生長」的說法，真相是什麼？", "options": ["是錯覺，皮膚脫水後往後退縮", "是真的，細胞還能再活好幾天", "是錯覺，其實是指甲慢慢變形", "是真的，但只有指甲會繼續長"], "answer": 0, "explanation": "死亡後細胞停止分裂，指甲與頭髮都不會再長；真正發生的是皮膚失水收縮，讓原本埋在皮下的甲根與髮根露出來，看起來像變長了。", "fun_fact": "這個錯覺被認為是吸血鬼與殭屍傳說的來源之一——開棺時看到遺體「指甲變長」，把人嚇壞了。", "source": "https://en.wikipedia.org/wiki/List_of_common_misconceptions", "region": "趣聞"}, {"id": "fn-068", "topic": "fun", "category": "人體", "difficulty": 2, "type": "choice", "question": "一般來說，手指甲和腳趾甲的生長速度相比如何？", "options": ["手指甲大約是腳趾甲的兩三倍", "兩者的速度幾乎完全一樣", "腳趾甲大約是手指甲的兩倍", "腳趾甲長到一定長度會停止"], "answer": 0, "explanation": "手指甲每個月約長 3 公釐多，腳趾甲只有約 1 公釐多，相差兩三倍；一般認為與血液循環、使用頻率和受到的刺激有關。", "fun_fact": "慣用手的指甲通常長得比另一隻手略快，而中指的指甲又比小指長得快。", "source": "https://en.wikipedia.org/wiki/Nail_(anatomy)", "region": "趣聞"}, {"id": "fn-069", "topic": "fun", "category": "海洋", "difficulty": 2, "type": "choice", "question": "地球大氣中的氧氣，估計至少有一半是由什麼產生的？", "options": ["陸地上的各種草原", "高山上的針葉林帶", "海洋裡的浮游植物", "亞馬遜雨林的樹木"], "answer": 2, "explanation": "海洋中的浮游植物行光合作用，貢獻了地球至少一半的氧氣產量；陸地森林雖然重要，但呼吸與分解也會消耗掉自己產生的大部分氧氣。", "fun_fact": "一茶匙海水裡就可能有上百萬個浮游生物，牠們肉眼看不見，卻撐起了整個海洋食物網的底層。", "source": "https://oceanservice.noaa.gov/facts/ocean-oxygen.html", "region": "趣聞"}, {"id": "fn-070", "topic": "fun", "category": "天氣", "difficulty": 2, "type": "choice", "question": "一道閃電通過時，周圍空氣被瞬間加熱到的溫度大約是什麼等級？", "options": ["大約和火山熔岩相當", "約太陽表面溫度的五倍", "大約和沸水差不多高", "約太陽表面溫度的一半"], "answer": 1, "explanation": "閃電通道的溫度可達約攝氏三萬度，大約是太陽可見表面（約攝氏五千五百度）的五倍。", "fun_fact": "雷聲就是這股高溫讓空氣瞬間劇烈膨脹造成的衝擊波；因為光比聲音快得多，所以總是先看到閃電、後聽到雷聲。", "source": "https://en.wikipedia.org/wiki/Lightning", "region": "趣聞"}, {"id": "fn-071", "topic": "fun", "category": "天氣", "difficulty": 2, "type": "choice", "question": "正在空中落下的雨滴，實際上是什麼形狀？", "options": ["像細針一樣的長條形", "完全不規則的碎片形", "上尖下圓的淚滴形狀", "接近球形或漢堡形狀"], "answer": 3, "explanation": "小雨滴受表面張力影響接近球形；較大的雨滴因為底部受空氣阻力擠壓，會變成底部扁平、像漢堡麵包的形狀，而不是童書畫的淚滴形。", "fun_fact": "雨滴大到一定程度（直徑約 4 公釐以上）就會被氣流撕裂成好幾顆小雨滴，所以雨滴不會無限長大。", "source": "https://en.wikipedia.org/wiki/Rain", "region": "趣聞"}, {"id": "fn-072", "topic": "fun", "category": "植物", "difficulty": 2, "type": "choice", "question": "從植物分類來看，竹子比較接近下列哪一類植物？", "options": ["闊葉樹木", "大型蕨類", "禾本科的草", "針葉樹木"], "answer": 2, "explanation": "竹子屬於禾本科，和稻米、小麥、玉米是親戚，莖是中空有節的「稈」，沒有一般樹木的年輪和逐年增粗的次生生長。", "fun_fact": "竹子在生長季的抽高速度驚人，某些種類一天可長高數十公分；許多竹種要數十年才開一次花，開完花後整片竹林常一起枯死。", "source": "https://en.wikipedia.org/wiki/Bamboo", "region": "趣聞"}, {"id": "fn-073", "topic": "fun", "category": "植物", "difficulty": 3, "type": "choice", "question": "向日葵會「追著太陽轉」，但研究發現成熟開花之後，花盤多半會怎麼樣？", "options": ["固定朝著東方不動", "固定朝著西方不動", "固定朝著正上方不動", "成熟後仍整天追著太陽"], "answer": 0, "explanation": "幼株的莖在白天向西彎、夜裡再轉回東方；開花成熟後莖部停止這種不對稱生長，花盤就大致定格朝向東方。", "fun_fact": "研究指出朝東的花盤在早晨升溫較快，比朝西的花更能吸引蜜蜂等授粉者前來造訪。", "source": "https://www.science.org/doi/10.1126/science.aaf9793", "region": "趣聞"}, {"id": "fn-074", "topic": "fun", "category": "植物", "difficulty": 3, "type": "choice", "question": "一棵大樹長出來的木材（乾重）主要是從哪裡來的？", "options": ["土壤裡的礦物養分", "根部吸收的大量水分", "陽光直接轉成的物質", "空氣中的二氧化碳"], "answer": 3, "explanation": "光合作用把空氣中的二氧化碳與水合成醣類，再構築成纖維素與木質素；木材裡的碳幾乎全部來自空氣，土壤提供的礦物質只佔極小比例。", "fun_fact": "17 世紀的范海爾蒙特把柳樹種在秤過重量的土裡養五年，樹重了約 74 公斤，土卻幾乎沒變輕，是這個觀念最早的關鍵實驗。", "source": "https://en.wikipedia.org/wiki/Jan_Baptist_van_Helmont", "region": "趣聞"}, {"id": "fn-075", "topic": "fun", "category": "動物", "difficulty": 3, "type": "choice", "question": "研究發現家貓對甜食普遍興趣缺缺，最主要的原因是什麼？", "options": ["貓只在幼年時期嘗得到甜", "牠的甜味受體基因失去功能", "甜味會讓貓覺得口腔不適", "貓的味蕾數量太少嘗不出"], "answer": 1, "explanation": "甜味受體由 Tas1r2 與 Tas1r3 兩個基因共同組成，而貓科動物的 Tas1r2 已經變成沒有功能的「偽基因」，因此嘗不到甜味。", "fun_fact": "這被認為和貓演化成純肉食動物有關；有些貓愛舔冰淇淋，真正吸引牠的是脂肪與奶香，不是糖。", "source": "https://journals.plos.org/plosgenetics/article?id=10.1371%2Fjournal.pgen.0010003", "region": "趣聞"}, {"id": "fn-076", "topic": "fun", "category": "人體", "difficulty": 3, "type": "choice", "question": "依照 2016 年較新的估算，成年人體內的細菌細胞數和自身細胞數比例大約是多少？", "options": ["大約 1 比 10", "大約 1 比 1", "大約 10 比 1", "大約 100 比 1"], "answer": 1, "explanation": "過去長年引用的「細菌是人體細胞的十倍」來自很粗略的估計；2016 年重新計算後，成年男性體內約有 38 兆個細菌細胞與 30 兆個人體細胞，比例接近 1 比 1。", "fun_fact": "人體細胞當中數量最多的是紅血球，一個人的細胞有八成以上都是它。", "source": "https://journals.plos.org/plosbiology/article?id=10.1371%2Fjournal.pbio.1002533", "region": "趣聞"}, {"id": "fn-077", "topic": "fun", "category": "人體", "difficulty": 3, "type": "choice", "question": "人的「小腸」和「大腸」，名字裡的大小其實是在比什麼？", "options": ["管子的長度，大腸確實比較長", "吸收的效率，大腸效率比較高", "所在的位置，大腸位置比較高", "管子的粗細，小腸反而比較長"], "answer": 3, "explanation": "成人小腸長約 6 到 7 公尺、管徑約 3 公分；大腸只有約 1.5 公尺，管徑卻約 6 公分。大小指的是口徑，不是長度。", "fun_fact": "小腸內壁佈滿環狀皺褶、絨毛與微絨毛，把實際吸收面積放大了數十倍，遠遠超過管子本身的表面積。", "source": "https://en.wikipedia.org/wiki/Small_intestine", "region": "趣聞"}, {"id": "fn-078", "topic": "fun", "category": "人體", "difficulty": 3, "type": "choice", "question": "手指在水裡泡久了會起皺，近年研究認為主要機制是什麼？", "options": ["神經指揮血管收縮造成的", "皮膚細胞吸水後膨脹撐開", "角質層被水溶解後變軟", "汗腺大量排水使皮膚縮水"], "answer": 0, "explanation": "手指起皺不是單純吸水膨脹：實驗發現指神經受損的手指泡水後不會起皺，顯示這是自律神經讓皮下血管收縮、把表皮拉出溝紋的主動反應。", "fun_fact": "有研究讓受試者在水中搬移濕滑的物體，皺皮的手明顯抓得比較快，推測溝紋可能像輪胎的排水紋一樣有助抓握。", "source": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3639753/", "region": "趣聞"}, {"id": "fn-079", "topic": "fun", "category": "自然", "difficulty": 3, "type": "choice", "question": "衛星觀測發現，亞馬遜雨林土壤中不斷被雨水沖走的磷，有相當一部分靠什麼補回來？", "options": ["定期氾濫的亞馬遜河泥沙", "雨林自身落葉腐化的養分", "飄越大西洋的撒哈拉沙塵", "安地斯山崩落下來的岩屑"], "answer": 2, "explanation": "NASA 以衛星光達估算，每年約有數千萬噸撒哈拉沙塵飄越大西洋落在亞馬遜，其中所含的磷大致補上了雨林流失的量。", "fun_fact": "這些沙塵有很大比例來自查德北部的博德萊窪地——一座乾涸古湖的湖床，堆滿了富含磷的微生物遺骸。", "source": "https://www.nasa.gov/centers-and-facilities/goddard/nasa-satellite-reveals-how-much-saharan-dust-feeds-amazons-plants/", "region": "趣聞"}, {"id": "fn-080", "topic": "fun", "category": "天氣", "difficulty": 3, "type": "choice", "question": "西北太平洋颱風的名字是怎麼決定的？", "options": ["由最先觀測到的國家當場命名", "依照該年英文字母的順序排列", "由聯合國每年統一抽籤來決定", "由 14 個成員提供名字輪用"], "answer": 3, "explanation": "颱風委員會的 14 個成員各提供 10 個名字，共 140 個名字分成 5 組依序輪流使用，用完之後再從第一組開始。", "fun_fact": "造成重大災害的颱風名字會被「除名」，再由原本提供該名字的成員補提一個新名字遞補。", "source": "https://www.cna.com.tw/news/ahel/202406060261.aspx", "region": "趣聞"}, {"id": "fn-081", "topic": "fun", "category": "天氣", "difficulty": 3, "type": "choice", "question": "彩虹實際上的完整形狀是什麼？我們在地面看到的只是一部分。", "options": ["一個橢圓形光環", "一個完整的圓形", "一段固定的半圓", "一條筆直的光帶"], "answer": 1, "explanation": "彩虹是陽光在水滴中折射與反射後，在以「反日點」為圓心、張角約 42 度的圓錐面上形成的，本質是一整個圓，只是地平線擋住了下半部。", "fun_fact": "在飛機上或高處的瀑布旁，有機會看到完整不缺角的圓形彩虹。", "source": "https://en.wikipedia.org/wiki/Rainbow", "region": "趣聞"}, {"id": "fn-082", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "「三明治」（sandwich）這個名字最早是怎麼來的？", "options": ["來自法文「夾起來」的動詞", "來自一種古老的三層麵包", "來自荷蘭一個港口的地名", "來自一位英國伯爵的封號"], "answer": 3, "explanation": "18 世紀英國的第四代三明治伯爵孟塔古，習慣請人把肉夾在兩片麵包中間送上來，方便他一邊吃一邊做事，旁人便照他的封號稱呼這種吃法。", "fun_fact": "南太平洋的夏威夷群島曾被庫克船長命名為「三明治群島」，紀念的也是同一位伯爵。", "source": "https://www.britannica.com/biography/John-Montagu-4th-Earl-of-Sandwich", "region": "趣聞"}, {"id": "fn-083", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "珍珠奶茶裡 Q 彈的「珍珠」，主要原料是什麼？", "options": ["糯米磨成的濕米漿", "樹薯（木薯）的澱粉", "海藻萃取的洋菜膠", "馬鈴薯澱粉加蛋白"], "answer": 1, "explanation": "珍珠（粉圓）主要由樹薯澱粉加水揉製、搓成小球後煮熟，澱粉糊化後才會有那種彈牙的口感。", "fun_fact": "樹薯原產南美洲，生的塊根含有氰化物，必須經加工去毒才能食用，做成澱粉後就沒有毒性了。", "source": "https://www.britannica.com/plant/cassava", "region": "趣聞"}, {"id": "fn-084", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "可口可樂在 1886 年剛問世時，最早是在哪裡販售的？", "options": ["球場的小販推車", "藥局的汽水櫃檯", "火車站的餐車", "百貨公司的頂樓"], "answer": 1, "explanation": "可口可樂由亞特蘭大的藥劑師彭伯頓調製，最初當成提神的藥用飲料，在藥局的汽水櫃檯一杯五分錢賣出。", "fun_fact": "推出的第一年平均一天只賣出九杯左右，收入還不夠付當年的廣告費。", "source": "https://www.coca-colacompany.com/about-us/history/the-birth-of-a-refreshing-idea", "region": "趣聞"}, {"id": "fn-085", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "英文 hamburger（漢堡）這個字，最早是從哪裡來的？", "options": ["發明它的美國廚師姓氏", "英文「火腿」加上麵包", "荷蘭文「碎肉餅」的音譯", "德國的漢堡這座城市"], "answer": 3, "explanation": "19 世紀德國漢堡港的移民把碎牛肉排帶到美國，這種肉排被稱作「漢堡牛排」，夾進圓麵包後就成了 hamburger。", "fun_fact": "因為字尾看起來像 ham（火腿），美國人後來把 -burger 當成可以自由替換的字尾，才有了起司堡、雞肉堡這些說法。", "source": "https://www.merriam-webster.com/dictionary/hamburger", "region": "趣聞"}, {"id": "fn-086", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "在義大利的咖啡館直接點一杯「latte」，店員會端來什麼？", "options": ["一杯濃縮咖啡", "一杯熱可可", "一杯加水的美式", "一杯純鮮奶"], "answer": 3, "explanation": "義大利文 latte 就是「牛奶」，咖啡牛奶要說 caffè latte，只講 latte，端上桌的會是一杯鮮奶。", "fun_fact": "在義大利，加了大量牛奶的咖啡多半只在早餐時段喝，午餐後點卡布奇諾，在當地人眼中有點不尋常。", "source": "https://www.treccani.it/vocabolario/latte/", "region": "趣聞"}, {"id": "fn-087", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "中美洲的馬雅人和阿茲特克人，最早是怎麼享用巧克力的？", "options": ["當成一種苦的飲料喝", "做成方塊狀的甜點", "磨成粉撒在水果上", "混進麵糊裡烤成餅"], "answer": 0, "explanation": "可可最早是磨碎後加水調成的飲料，味道苦而帶辛辣，常加入辣椒或香料，並不加糖。", "fun_fact": "固體的巧克力磚要到 19 世紀才出現，牛奶巧克力更晚，1875 年前後才在瑞士問世。", "source": "https://www.smithsonianmag.com/arts-culture/a-brief-history-of-chocolate-21860917/", "region": "趣聞"}, {"id": "fn-088", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "名字聽起來很紐西蘭的「奇異果」，原產地其實是哪裡？", "options": ["紐西蘭南島", "中國長江流域", "澳洲東岸", "南美智利"], "answer": 1, "explanation": "奇異果原名「獼猴桃」，原產於中國，20 世紀初種子被帶到紐西蘭栽培改良，才發展成外銷水果。", "fun_fact": "它一度被叫做「中國鵝莓」，紐西蘭出口商在 1950 年代改名為 kiwifruit，名字取自紐西蘭的國鳥奇異鳥。", "source": "https://www.britannica.com/plant/kiwi-fruit", "region": "趣聞"}, {"id": "fn-089", "topic": "fun", "category": "飲食", "difficulty": 1, "type": "choice", "question": "以植物學分類來說，花生其實屬於下列哪一類？", "options": ["堅果類果實", "穀類作物", "豆科植物", "塊莖作物"], "answer": 2, "explanation": "花生是豆科植物，跟豌豆、黃豆是親戚，只是果莢在開花後會鑽入土中成熟，所以又叫「落花生」。", "fun_fact": "也因此，對樹生堅果（腰果、核桃等）過敏的人不一定會對花生過敏，兩者是不同的過敏原。", "source": "https://www.britannica.com/plant/peanut", "region": "趣聞"}, {"id": "fn-090", "topic": "fun", "category": "料理科學", "difficulty": 1, "type": "choice", "question": "吃到很辣的東西時，喝下列哪一種最能有效解辣？", "options": ["全脂牛奶", "冰礦泉水", "含糖氣泡水", "無糖冰紅茶"], "answer": 0, "explanation": "辣椒素是脂溶性的，水沖不掉；牛奶裡的脂肪能溶解辣椒素，其中的酪蛋白也有助於把它從受器上帶走。", "fun_fact": "同樣道理，吃到很辣時含一口優格、冰淇淋或一小塊起司，都比猛灌冰水有效。", "source": "https://www.acs.org/pressroom/newsreleases/2018/august/why-milk-is-the-best-way-to-douse-the-fire-of-spicy-food.html", "region": "趣聞"}, {"id": "fn-091", "topic": "fun", "category": "料理科學", "difficulty": 1, "type": "choice", "question": "在高山上用一般鍋子煮飯常常煮不熟，主要原因是什麼？", "options": ["空氣稀薄，爐火燒不太起來", "山上的水礦物質太多，米不易吸水", "氣壓低，水不到 100 度就沸騰", "氣溫太低，米粒吸不到足夠的水"], "answer": 2, "explanation": "海拔愈高氣壓愈低，水的沸點跟著下降，例如玉山山頂的水大約 90 度就滾了，溫度不夠，米芯自然難熟透。", "fun_fact": "這也是壓力鍋好用的原因：鍋內加壓後沸點可以升到 120 度左右，食物熟得更快。", "source": "https://www.nist.gov/pml/owm/si-units-temperature", "region": "趣聞"}, {"id": "fn-092", "topic": "fun", "category": "生活設計", "difficulty": 1, "type": "choice", "question": "微波爐加熱食物，主要是靠什麼原理？", "options": ["用紅外線直接烤熱表面", "靠金屬內壁反射高溫熱氣循環", "讓食物裡的水分子劇烈振動", "利用高頻電流通過食物"], "answer": 2, "explanation": "微波會讓食物中的水分子快速來回轉動，分子彼此摩擦生熱，所以含水多的部分熱得特別快。", "fun_fact": "完全乾燥的東西（例如乾的陶瓷盤）在微波爐裡幾乎不會變熱，盤子會燙通常是被食物傳過來的。", "source": "https://www.fda.gov/radiation-emitting-products/resources-you-radiation-emitting-products/microwave-oven-radiation", "region": "趣聞"}, {"id": "fn-093", "topic": "fun", "category": "生活設計", "difficulty": 1, "type": "choice", "question": "牛仔褲右前口袋裡那個小小的口袋，當初是設計來放什麼的？", "options": ["備用的金屬鈕扣", "隨身攜帶的懷錶", "防潮用的小火柴盒", "捲菸用的菸草紙"], "answer": 1, "explanation": "這個小口袋出現在 19 世紀的工作褲上，是給工人放懷錶用的，Levi's 官方也一直稱它為 watch pocket。", "fun_fact": "手錶普及後小口袋早就失去用途，卻因為太經典而被保留下來，成了牛仔褲的招牌細節。", "source": "https://www.levistrauss.com/2017/07/06/what-is-that-little-pocket-for/", "region": "趣聞"}, {"id": "fn-094", "topic": "fun", "category": "生活設計", "difficulty": 1, "type": "choice", "question": "電腦鍵盤上 F 和 J 兩個鍵凸起的小橫槓，作用是什麼？", "options": ["標示最常按到的兩個鍵", "提醒這兩個鍵有特殊的快捷功能", "防止兩個鍵被同時按下", "讓左右食指不用看就能歸位"], "answer": 3, "explanation": "這兩個凸點是盲打的定位點：左右食指摸到凸起就找到基準位置，其他手指自然落在正確的鍵上。", "fun_fact": "數字鍵盤的 5 通常也有一個凸點，道理一樣，是給中指定位用的。", "source": "https://www.britannica.com/technology/typewriter", "region": "趣聞"}, {"id": "fn-095", "topic": "fun", "category": "生活設計", "difficulty": 1, "type": "choice", "question": "許多原子筆的筆蓋頂端都開一個小洞，主要目的是什麼？", "options": ["讓筆芯裡的空氣可以順利進出", "方便用繩子把筆掛起來", "萬一被吞下仍能維持呼吸", "讓乾掉的墨水重新流動"], "answer": 2, "explanation": "筆蓋很容易被小孩含在嘴裡誤吞，頂端開孔可在卡住氣管時保留通氣空間，是國際安全規範促成的設計。", "fun_fact": "筆廠同時也把筆蓋做得比較大、不容易整個滑進氣管，兩種設計是搭配著用的。", "source": "https://www.bicworld.com/en/our-company/our-commitments/product-safety", "region": "趣聞"}, {"id": "fn-096", "topic": "fun", "category": "世界風俗", "difficulty": 1, "type": "choice", "question": "全世界的國旗幾乎都是長方形，目前只有哪一國的國旗不是四邊形？", "options": ["斯里蘭卡", "不丹", "蒙古", "尼泊爾"], "answer": 3, "explanation": "尼泊爾國旗由上下兩個三角形疊成，是目前唯一非四邊形的國旗，形狀源自兩面三角旗的合併。", "fun_fact": "尼泊爾憲法的附錄裡還附了用幾何作圖一步步畫出國旗的精確步驟，在各國憲法中相當少見。", "source": "https://www.britannica.com/topic/flag-of-Nepal", "region": "趣聞"}, {"id": "fn-097", "topic": "fun", "category": "世界風俗", "difficulty": 1, "type": "choice", "question": "美國國旗上的 13 條紅白橫條，代表的是什麼？", "options": ["獨立戰爭總共打了 13 年", "最早建國的 13 個殖民地", "簽署獨立宣言的 13 個人", "最早通過的 13 條憲法修正案"], "answer": 1, "explanation": "13 條橫條代表 1776 年宣布獨立的 13 個英屬殖民地，星星的數量則隨著加入的州數增加，現在是 50 顆。", "fun_fact": "19 世紀初曾一度改成 15 條，後來國會決定橫條固定回 13 條，新加入的州只增加星星。", "source": "https://www.britannica.com/topic/flag-of-the-United-States-of-America", "region": "趣聞"}, {"id": "fn-098", "topic": "fun", "category": "世界風俗", "difficulty": 1, "type": "choice", "question": "泰國每年 4 月中旬的「潑水節」（宋干節），在當地相當於什麼節日？", "options": ["農作物的豐收節", "紀念國王的生日", "傳統的新年", "佛陀誕辰紀念日"], "answer": 2, "explanation": "宋干節是泰國傳統曆法的新年，潑水原本是把水輕輕淋在長輩手上表示祝福、洗去厄運，後來才演變成全民狂歡。", "fun_fact": "2023 年，宋干節被聯合國教科文組織列入人類非物質文化遺產代表名錄。", "source": "https://ich.unesco.org/en/RL/songkran-in-thailand-traditional-thai-new-year-festival-01719", "region": "趣聞"}, {"id": "fn-099", "topic": "fun", "category": "世界風俗", "difficulty": 1, "type": "choice", "question": "墨西哥的「亡靈節」是什麼性質的節日？", "options": ["熱鬧歡慶、迎接祖先回家", "全家肅穆守夜、禁止喧嘩", "驅趕惡靈的除魔儀式", "紀念戰爭陣亡者的國定假日"], "answer": 0, "explanation": "亡靈節在 11 月 1 日至 2 日，人們用萬壽菊、糖骷髏和亡者生前愛吃的食物布置祭壇，熱鬧地迎接親人的靈魂回來團聚。", "fun_fact": "這個節日已被聯合國教科文組織列為非物質文化遺產，也是動畫《可可夜總會》的靈感來源。", "source": "https://ich.unesco.org/en/RL/indigenous-festivity-dedicated-to-the-dead-00054", "region": "趣聞"}, {"id": "fn-100", "topic": "fun", "category": "度量衡與時間", "difficulty": 1, "type": "choice", "question": "台灣房屋常用的面積單位「一坪」，大約等於多少平方公尺？", "options": ["約 1.8 平方公尺", "約 6.6 平方公尺", "約 10 平方公尺", "約 3.3 平方公尺"], "answer": 3, "explanation": "一坪是邊長六台尺（約 1.818 公尺）的正方形，面積約 3.306 平方公尺。", "fun_fact": "坪來自日治時期引進的日本度量衡，日本本地同樣稱為「坪」，換算的數字也完全一樣。", "source": "https://www.boca.gov.tw/", "region": "趣聞"}, {"id": "fn-101", "topic": "fun", "category": "飲食", "difficulty": 2, "type": "choice", "question": "市面上常見的一般鳳梨酥，內餡除了鳳梨之外，最常混入哪一種材料？", "options": ["南瓜", "冬瓜", "蘋果", "地瓜"], "answer": 1, "explanation": "純鳳梨餡纖維粗、酸度高，業者多半加入冬瓜醬來調整口感與甜度；完全使用鳳梨的通常會標示為「土鳳梨酥」。", "fun_fact": "冬瓜本身味道很淡、久煮會變得透明軟糯，也常被拿來當成各種果醬與蜜餞的基底。", "source": "https://www.flavornews.com.tw/review/373", "region": "趣聞"}, {"id": "fn-102", "topic": "fun", "category": "飲食", "difficulty": 2, "type": "choice", "question": "一般被視為法國代表性麵包的可頌（牛角麵包），最早的原型出現在哪裡？", "options": ["法國巴黎", "義大利米蘭", "奧地利維也納", "瑞士日內瓦"], "answer": 2, "explanation": "可頌源自奧地利的新月形麵包 kipferl，19 世紀由維也納的麵包師傅帶進巴黎，法國人才發展出千層奶油麵團的做法。", "fun_fact": "法文把可頌這類麵包歸類為 viennoiserie，字面意思就是「維也納的東西」，等於在名字裡承認了出身。", "source": "https://www.britannica.com/topic/croissant", "region": "趣聞"}, {"id": "fn-103", "topic": "fun", "category": "飲食", "difficulty": 2, "type": "choice", "question": "義大利甜點「提拉米蘇」（tiramisù），名字在義大利文裡是什麼意思？", "options": ["把我拉起來", "咖啡的雲朵", "媽媽的味道", "山上的雪花"], "answer": 0, "explanation": "tiramisù 由 tira mi sù 三個字組成，字面意思是「把我拉起來」，引申為提神、讓人打起精神。", "fun_fact": "這道甜點其實很年輕，一般認為 1970 年代才在義大利東北部的餐廳出現，比許多人想像的晚得多。", "source": "https://www.treccani.it/vocabolario/tiramisu/", "region": "趣聞"}, {"id": "fn-104", "topic": "fun", "category": "飲食", "difficulty": 2, "type": "choice", "question": "「卡布奇諾」（cappuccino）這個名字是怎麼來的？", "options": ["修士長袍的顏色", "發明者本人的名字", "義大利文的小帽子", "一種咖啡豆的品種"], "answer": 0, "explanation": "這款咖啡的顏色很像天主教嘉布遣會（Cappuccini）修士身上的褐色長袍，因而得名。", "fun_fact": "嘉布遣會的名字又來自修士袍上的尖頭兜帽 cappuccio，同一個字根一路生出了 cappuccino。", "source": "https://www.merriam-webster.com/dictionary/cappuccino", "region": "趣聞"}, {"id": "fn-105", "topic": "fun", "category": "料理科學", "difficulty": 2, "type": "choice", "question": "為什麼密封保存的純蜂蜜幾乎不會腐壞？", "options": ["蜜蜂採蜜時加入了一種天然防腐成分", "糖分濃度極高、水分極少，微生物難以繁殖", "蜂蜜的酸鹼值恰好能殺死所有細菌", "蜂蜜屬於無機物質，本來就不會腐敗"], "answer": 1, "explanation": "蜂蜜的糖濃度極高、水分很少，會把微生物體內的水分吸走，加上偏酸並含有少量過氧化氫，微生物幾乎無法繁殖。", "fun_fact": "考古學家曾在埃及古墓中找到數千年前的蜂蜜，狀態仍然完好。", "source": "https://www.smithsonianmag.com/science-nature/the-science-behind-honeys-eternal-shelf-life-1218690/", "region": "趣聞"}, {"id": "fn-106", "topic": "fun", "category": "料理科學", "difficulty": 2, "type": "choice", "question": "切洋蔥會讓人流眼淚，主要是因為什麼？", "options": ["洋蔥釋出的辛辣粉塵刺激角膜", "洋蔥汁液裡的強酸隨著切菜濺入眼睛", "洋蔥表面的花粉引起過敏反應", "細胞破裂後生成的揮發性含硫氣體"], "answer": 3, "explanation": "切開時細胞破裂，酵素與含硫化合物反應生成揮發性的催淚物質，飄到眼睛後刺激神經，眼睛便自動分泌淚水沖洗。", "fun_fact": "把洋蔥先冰過、或在水下切，都能減少催淚氣體揮發，比戴蛙鏡實際一點。", "source": "https://www.acs.org/molecule-of-the-week/archive/s/syn-propanethial-s-oxide.html", "region": "趣聞"}, {"id": "fn-107", "topic": "fun", "category": "度量衡與時間", "difficulty": 2, "type": "choice", "question": "英文九月 September 的字根是「七」、十月 October 是「八」，為什麼對不上？", "options": ["古羅馬人算月份時會先跳過兩個月", "翻譯時把拉丁文的數字抄錯了", "古羅馬曆法一年是從三月開始的", "教會曾經把整套曆法往後挪兩個月"], "answer": 2, "explanation": "早期的羅馬曆以三月為歲首，September 正好是第七個月；後來把一月、二月移到年初，這些名字卻沒有跟著改。", "fun_fact": "七月 July 和八月 August 則是後來為了紀念凱撒與奧古斯都而改的名字，原本也是照數字叫的。", "source": "https://www.britannica.com/topic/Roman-republican-calendar", "region": "趣聞"}, {"id": "fn-108", "topic": "fun", "category": "料理科學", "difficulty": 2, "type": "choice", "question": "為什麼吃辣會覺得「熱」，喝冰水卻只能暫時緩解？", "options": ["辣椒素活化了感覺高溫的痛覺受器", "辣椒素真的會讓口腔溫度上升", "辣椒素會讓味蕾暫時失去分辨能力", "辣椒素刺激唾液分泌造成灼熱"], "answer": 0, "explanation": "辣不是味覺，而是辣椒素活化了偵測高溫與疼痛的 TRPV1 受器，大腦因此收到「燙」的訊號，口腔溫度其實沒有升高。", "fun_fact": "薄荷的清涼感是同一套機制的反面：薄荷醇活化的是負責感知低溫的受器。", "source": "https://www.nobelprize.org/prizes/medicine/2021/press-release/", "region": "趣聞"}, {"id": "fn-109", "topic": "fun", "category": "生活設計", "difficulty": 2, "type": "choice", "question": "拉鍊上常看到的「YKK」三個字母，代表的是什麼？", "options": ["日本一家拉鍊製造商", "拉鍊強度的國際分級", "三種金屬材質的縮寫", "拉鍊發明人的姓名縮寫"], "answer": 0, "explanation": "YKK 是日本「吉田工業株式會社」的羅馬字縮寫，成立於 1934 年，是全球規模最大的拉鍊製造商之一。", "fun_fact": "YKK 連做拉鍊要用的黃銅、生產機器甚至紙箱都自己生產，為的是確保每一條拉鍊品質一致。", "source": "https://www.ykkfastening.com/global/company/history/", "region": "趣聞"}, {"id": "fn-110", "topic": "fun", "category": "生活設計", "difficulty": 2, "type": "choice", "question": "牛仔褲口袋角落那些小小的金屬鉚釘，最初是為了什麼加上去的？", "options": ["用來區分不同尺碼的褲子", "讓褲子看起來比較有工業感", "方便工人把工具掛在腰帶上", "補強最容易被扯裂的地方"], "answer": 3, "explanation": "1873 年裁縫師戴維斯與布商李維·史特勞斯取得專利，在口袋受力最大的接縫處打上鉚釘，解決工人褲子一扯就破的問題。", "fun_fact": "早期連褲襠下方也有一顆鉚釘，據說蹲在營火旁會被燙到，後來就取消了。", "source": "https://www.levistrauss.com/2013/05/20/levi-strauss-jacob-davis-patent/", "region": "趣聞"}, {"id": "fn-111", "topic": "fun", "category": "生活設計", "difficulty": 2, "type": "choice", "question": "飛機在夜間起飛和降落時，客艙燈光通常會調暗，主要原因是什麼？", "options": ["節省飛機起降時的用電量", "讓乘客的眼睛先適應黑暗", "避免燈光干擾機師的視線", "讓乘客比較容易放鬆入睡"], "answer": 1, "explanation": "起降是意外風險最高的階段，燈光調暗可讓眼睛預先適應暗處，萬一需要緊急疏散，乘客能立刻看清逃生路線。", "fun_fact": "基於同樣理由，起降時也會要求拉開遮陽板，好讓機組員和乘客看得到機外的狀況。", "source": "https://www.iata.org/en/programs/safety/cabin-safety/", "region": "趣聞"}, {"id": "fn-112", "topic": "fun", "category": "生活設計", "difficulty": 2, "type": "choice", "question": "交通號誌採用紅、黃、綠三色，最直接是沿用了哪一種既有的系統？", "options": ["航海用的船舶燈號", "軍隊使用的旗語系統", "鐵路的行車號誌", "消防隊的警報燈"], "answer": 2, "explanation": "世界第一座交通號誌 1868 年裝在倫敦西敏寺外，由鐵路號誌工程師設計，直接把鐵路上紅停綠行的燈號搬到馬路上。", "fun_fact": "鐵路早期其實用白燈代表通行，後來因為紅色濾片一破就變成白光、害列車誤判，才改用綠色。", "source": "https://www.nbcnews.com/news/world/150-years-seeing-red-traffic-light-marks-milestone-n943461", "region": "趣聞"}, {"id": "fn-113", "topic": "fun", "category": "語言", "difficulty": 2, "type": "choice", "question": "中文的「杯葛」（抵制）是英文音譯，這個英文字最早是怎麼產生的？", "options": ["取自一種捕魚用的網具名稱", "取自古英語中表示「拒絕」的動詞", "取自一位被集體排擠的人的姓氏", "取自一場著名罷工的發生地"], "answer": 2, "explanation": "boycott 來自 19 世紀愛爾蘭的土地管理人查爾斯·博伊科特，佃農拒絕替他工作、商家拒絕與他往來，他的姓氏就成了「集體抵制」的代名詞。", "fun_fact": "這個字在事件當年就被報紙大量使用，短短幾個月內便傳入法文、德文等多種語言。", "source": "https://www.britannica.com/biography/Charles-Cunningham-Boycott", "region": "趣聞"}, {"id": "fn-114", "topic": "fun", "category": "語言", "difficulty": 2, "type": "choice", "question": "台灣小吃「甜不辣」的名稱，是從哪個語言借來的？", "options": ["日語的「てんぷら」", "英語的「tender」", "台語原有的形容詞", "荷蘭語的魚漿製品"], "answer": 0, "explanation": "「甜不辣」是日語てんぷら（天婦羅）的音譯；在日本關西與九州，てんぷら本來就常指炸魚漿製品，和台灣的甜不辣一致。", "fun_fact": "日語的てんぷら本身也是外來語，一般認為源自葡萄牙語，是 16 世紀由傳教士帶進日本的。", "source": "https://kotobank.jp/word/%E5%A4%A9%E3%81%B7%E3%82%89-101387", "region": "趣聞"}, {"id": "fn-115", "topic": "fun", "category": "語言", "difficulty": 2, "type": "choice", "question": "國際通用的求救訊號「SOS」，這三個字母是怎麼來的？", "options": ["Save Our Souls 的縮寫", "摩斯電碼裡好記又好辨認的組合", "Save Our Ship 的縮寫", "第一艘發出求救的船的名字"], "answer": 1, "explanation": "SOS 不是任何句子的縮寫，而是因為它的摩斯電碼「三短、三長、三短」連續好打、不易與其他訊號混淆，1906 年被國際會議選為統一的求救訊號。", "fun_fact": "Save Our Souls 之類的說法是事後才附會上去的，這種倒推出來的解釋叫做「逆向縮寫」。", "source": "https://www.britannica.com/topic/SOS-distress-signal", "region": "趣聞"}, {"id": "fn-116", "topic": "fun", "category": "世界風俗", "difficulty": 2, "type": "choice", "question": "西班牙人在跨年鐘聲響起時，有什麼特別的習俗？", "options": ["把舊盤子摔在鄰居家門口", "跟著鐘聲吃下十二顆葡萄", "穿著紅色衣服跳過火堆", "在窗邊點燃十二支蠟燭"], "answer": 1, "explanation": "西班牙人會配合午夜的十二響鐘聲，一響吃一顆葡萄，總共十二顆，象徵新的一年十二個月都順利。", "fun_fact": "這個習俗在 20 世紀初開始流行，一般認為與葡萄盛產、農民想推廣銷路有關，後來也傳到不少拉丁美洲國家。", "source": "https://www.bbc.com/news/world-europe-38463683", "region": "趣聞"}, {"id": "fn-117", "topic": "fun", "category": "世界風俗", "difficulty": 2, "type": "choice", "question": "南美洲國家「厄瓜多」（Ecuador）的國名，在西班牙文裡是什麼意思？", "options": ["赤道", "高原", "金礦", "海岸"], "answer": 0, "explanation": "Ecuador 在西班牙文就是「赤道」的意思，因為赤道正好通過這個國家的北部。", "fun_fact": "首都基多近郊立有赤道紀念碑，是熱門景點；不過後來的精確測量顯示，真正的赤道線離紀念碑還有約 240 公尺。", "source": "https://www.britannica.com/place/Ecuador", "region": "趣聞"}, {"id": "fn-118", "topic": "fun", "category": "度量衡與時間", "difficulty": 2, "type": "choice", "question": "一個星期為什麼是七天？最普遍被接受的說法是源自什麼？", "options": ["月亮盈虧剛好分成七段", "古埃及金字塔的七層設計", "古希臘城邦的七天市集", "古人肉眼可見的七個天體"], "answer": 3, "explanation": "七天一週的制度一般追溯到古巴比倫，與肉眼可見的日、月、水星、金星、火星、木星、土星七個天體對應，再經由猶太教與羅馬帝國傳遍各地。", "fun_fact": "日文、韓文的星期名稱直接保留了這套對應：日、月、火、水、木、金、土，正好就是那七個天體。", "source": "https://www.britannica.com/science/week", "region": "趣聞"}, {"id": "fn-119", "topic": "fun", "category": "語言", "difficulty": 3, "type": "choice", "question": "英文 ketchup（番茄醬）這個字，語言學界一般認為最早來自什麼？", "options": ["墨西哥原住民語的番茄", "閩南語中一種魚露的名稱", "法文「濃縮醬汁」的說法", "一位美國食品商的姓氏"], "answer": 1, "explanation": "ketchup 一般認為源自閩南語中指稱魚露類調味汁的詞（kê-tsiap），17、18 世紀經由東南亞傳到英國，當時完全不含番茄。", "fun_fact": "早期英國的 ketchup 有蘑菇、蠔、核桃等口味，番茄版本要到 19 世紀初才出現，後來才變成唯一的主流。", "source": "https://www.npr.org/sections/codeswitch/2013/12/02/248195661/ketchup-the-all-american-condiment-that-comes-from-asia", "region": "趣聞"}, {"id": "fn-120", "topic": "fun", "category": "語言", "difficulty": 3, "type": "choice", "question": "英文 toast 同時有「烤麵包」和「舉杯祝酒」兩個意思，兩者的關聯是什麼？", "options": ["祝酒時要把麵包高舉過頭", "烤麵包的焦香被當作好運的象徵", "古代會在酒裡放一片烤麵包調味", "兩個字其實是拼法碰巧相同"], "answer": 2, "explanation": "近代早期的英國人習慣在葡萄酒裡放一片加了香料的烤麵包，用來增添風味、掩蓋酒的酸味，「為某人乾杯」的說法便由此而來。", "fun_fact": "被大家舉杯致敬的對象因此被稱為 the toast，英文裡「全城的風雲人物」至今仍叫 the toast of the town。", "source": "https://www.merriam-webster.com/wordplay/word-history-of-toast-drinks-cheers", "region": "趣聞"}, {"id": "fn-121", "topic": "fun", "category": "生活設計", "difficulty": 3, "type": "choice", "question": "條紋牙膏能擠出整齊的彩色條紋，靠的是什麼設計？", "options": ["彩色膏體經由管頸的小孔擠入", "膏體遇到空氣才會顯出顏色", "軟管內部有一條旋轉的隔板", "白色膏體會自動吸附色素"], "answer": 0, "explanation": "軟管前端有一根細管，白膏從細管中央被推出，彩色膏則存放在細管外圍，經由管頸上的幾個小孔擠到白膏表面，形成固定位置的條紋。", "fun_fact": "這個構造早在 1950 年代就取得專利，也因此不管擠到剩多少，條紋的位置與顏色比例幾乎都不會跑掉。", "source": "https://patents.google.com/patent/US3881529A/en", "region": "趣聞"}, {"id": "fn-122", "topic": "fun", "category": "生活設計", "difficulty": 3, "type": "choice", "question": "日本與台灣許多洗髮精瓶身側面有一排凹凸紋路，潤髮乳則沒有，用意是什麼？", "options": ["標示瓶身可回收的材質種類", "讓手濕滑時比較不會拿不穩", "顯示瓶內剩餘容量的刻度", "閉眼或看不見時能分辨兩瓶"], "answer": 3, "explanation": "洗頭時常閉著眼睛，視障者也無法看標籤，因此業界統一在洗髮精瓶身與壓頭上加了摸得到的刻紋，潤髮乳保持光滑，靠手感就能分辨。", "fun_fact": "這項做法由日本花王在 1991 年率先導入，後來被同業採用並納入日本工業規格，是通用設計的經典案例。", "source": "https://www.kao.com/global/en/sustainability/me/universal-design/shampoo-notches/", "region": "趣聞"}, {"id": "fn-123", "topic": "fun", "category": "語言", "difficulty": 3, "type": "choice", "question": "成語「空穴來風」出自宋玉〈風賦〉，它原本的意思比較接近下列哪一個？", "options": ["毫無根據的傳言", "消息傳得非常快速", "事情的發生必有原因", "局勢突然出現變化"], "answer": 2, "explanation": "原文的意思是有了孔洞才會有風灌進來，比喻事情發生一定有它的緣由；現代中文卻普遍被反過來用成「傳言毫無根據」。", "fun_fact": "教育部《成語典》同時收錄了這兩種用法，並註明後者是後來衍生、與原義相反的用法。", "source": "https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=420", "region": "趣聞"}, {"id": "fn-124", "topic": "fun", "category": "語言", "difficulty": 3, "type": "choice", "question": "成語「呆若木雞」出自《莊子》，在原文裡其實是什麼樣的評價？", "options": ["稱讚鬥雞已練到沉穩不動的境界", "嘲笑鬥雞笨拙得像塊木頭一樣不動", "形容鬥雞受到驚嚇不敢動彈", "比喻馴獸師訓練失敗的結果"], "answer": 0, "explanation": "《莊子·達生》記載紀渻子替君王養鬥雞，養到雞「望之似木雞」、神定氣閒，別的雞看到掉頭就走，原文是最高等級的讚美。", "fun_fact": "這個成語後來詞義完全翻轉，如今只用來形容人嚇傻了、發愣的樣子。", "source": "https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=1078", "region": "趣聞"}, {"id": "fn-125", "topic": "fun", "category": "語言", "difficulty": 3, "type": "choice", "question": "英文 quarantine（檢疫隔離）源自義大利文，原本指的是什麼？", "options": ["港口外的隔離島", "船上的醫護艙房", "海關檢查的關卡", "四十天的期間"], "answer": 3, "explanation": "黑死病時期的威尼斯等地規定，來自疫區的船隻必須在港外停泊四十天才能上岸，義大利文的「四十天」（quaranta giorni）就演變成了 quarantine。", "fun_fact": "更早的規定其實是三十天、稱為 trentino，後來才延長成四十天，這個數字也與宗教上四十天齋戒的傳統有關。", "source": "https://www.mcgill.ca/oss/article/did-you-know-health/word-quarantine-comes-italian-word-forty-days", "region": "趣聞"}, {"id": "fn-126", "topic": "fun", "category": "度量衡與時間", "difficulty": 3, "type": "choice", "question": "1790 年代法國制訂「公尺」時，一公尺最初是怎麼定義的？", "options": ["地球赤道周長的四千萬分之一", "巴黎天文台鐘擺一秒的擺幅", "北極到赤道距離的千萬分之一", "當時法國國王前臂的標準長度"], "answer": 2, "explanation": "1791 年法國科學院決定，一公尺為通過巴黎的子午線上、從北極到赤道距離的一千萬分之一，並實測敦克爾克到巴塞隆納的弧長來推算。", "fun_fact": "後來的精密測量顯示當年算出的長度短了約 0.2 公釐；現在一公尺已改用光在真空中 1/299,792,458 秒走的距離來定義。", "source": "https://www.bipm.org/en/measurement-units/history-si/evolution-metre", "region": "趣聞"}], "tt": [{"id": "tt-001", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "在桌球單打比賽中，一局比賽通常先得到幾分就獲勝？", "options": ["7 分", "11 分", "15 分", "21 分"], "answer": 1, "explanation": "現行規則一局先得 11 分者勝，10 平之後則須領先 2 分。", "fun_fact": "2001 年之前是 21 分制，改成 11 分制是為了讓比賽更緊湊、更適合轉播。", "region": "桌球"}, {"id": "tt-002", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "一局打到 10:10 平手時，要怎樣才能拿下該局？", "options": ["先搶到第 11 分的一方獲勝", "接下來連續得 3 分才獲勝", "領先對方 2 分的一方獲勝", "先搶到第 15 分的一方獲勝"], "answer": 2, "explanation": "10 平（deuce）之後沒有上限，必須比對方多得 2 分才算贏下該局。", "fun_fact": "所以理論上一局可以打到 20:18、30:28，沒有分數天花板。", "region": "桌球"}, {"id": "tt-003", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "現行國際桌球比賽用球的直徑是多少？", "options": ["44 公釐", "42 公釐", "40 公釐", "38 公釐"], "answer": 2, "explanation": "ITTF 規定比賽用球直徑為 40 公釐。", "fun_fact": "2000 年之前是 38 公釐，加大球徑是為了讓球速變慢、回合變長。", "region": "桌球"}, {"id": "tt-004", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "桌球球網上緣離檯面的高度是多少？", "options": ["12.25 公分", "15.25 公分", "18.25 公分", "21.25 公分"], "answer": 1, "explanation": "球網全長各處的上緣離檯面高度都是 15.25 公分。", "fun_fact": "15.25 公分剛好等於 6 英吋，是這項運動源自英國留下的痕跡。", "region": "桌球"}, {"id": "tt-005", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "標準桌球檯的長度是多少？", "options": ["2.14 公尺", "2.34 公尺", "2.54 公尺", "2.74 公尺"], "answer": 3, "explanation": "ITTF 規定球檯長 2.74 公尺、寬 1.525 公尺。", "fun_fact": "2.74 公尺就是 9 英尺，桌球檯的規格幾乎都是從英制換算來的。", "region": "桌球"}, {"id": "tt-006", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "標準桌球檯的寬度是多少？", "options": ["1.525 公尺", "1.675 公尺", "1.825 公尺", "1.975 公尺"], "answer": 0, "explanation": "ITTF 規定球檯寬 1.525 公尺，長 2.74 公尺。", "fun_fact": "1.525 公尺等於 5 英尺，長寬比剛好是 9:5。", "region": "桌球"}, {"id": "tt-007", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "標準桌球檯的檯面離地面有多高？", "options": ["66 公分", "71 公分", "76 公分", "81 公分"], "answer": 2, "explanation": "ITTF 規定檯面必須水平，離地面 76 公分。", "fun_fact": "76 公分約等於 2.5 英尺，差不多是一般書桌的高度。", "region": "桌球"}, {"id": "tt-008", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "依照 ITTF 規定，比賽用球可以是哪些顏色？", "options": ["只能是純粹的白色", "只能是螢光的黃色", "黑色或者是深藍色", "白色或者是橘色"], "answer": 3, "explanation": "比賽用球為白色或橘色，而且必須是霧面不反光的。", "fun_fact": "選哪個顏色要看場地與檯面顏色，原則是讓觀眾與選手看得最清楚。", "region": "桌球"}, {"id": "tt-009", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "關於球拍兩面覆蓋物的顏色，ITTF 的規定是什麼？", "options": ["兩面都必須是沒有反光的霧面黑色", "一面霧面黑色、另一面為鮮明顏色", "兩面可以使用完全相同的顏色", "覆蓋物顏色完全由選手自行決定"], "answer": 1, "explanation": "球拍兩面顏色必須明顯不同，一面為霧面黑色，另一面為鮮明的顏色。", "fun_fact": "早期規定另一面只能是紅色，後來 ITTF 放寬，藍、綠、粉紅、紫都可以用。", "region": "桌球"}, {"id": "tt-010", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "在 10 平之前，桌球比賽每幾分交換一次發球權？", "options": ["每 2 分", "每 3 分", "每 5 分", "每 6 分"], "answer": 0, "explanation": "11 分制下每 2 分換發球一次，10 平之後改為每 1 分換發球。", "fun_fact": "21 分制時代是每 5 分才換一次發球權。", "region": "桌球"}, {"id": "tt-011", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "一般情況下，選手在什麼時候要交換場地？", "options": ["整場比賽都不交換場地", "每得 5 分就交換一次", "每一局結束後交換一次", "每打滿 10 分鐘交換一次"], "answer": 2, "explanation": "每一局結束後雙方交換場地，決勝局則在任一方先得 5 分時交換。", "fun_fact": "交換場地是為了平衡燈光、背景與氣流對雙方造成的差異。", "region": "桌球"}, {"id": "tt-012", "topic": "tt", "category": "發球", "difficulty": 1, "type": "choice", "question": "發球時，球一開始必須放在哪裡？", "options": ["平放在球拍的拍面正中央", "攤平的不持拍手手掌上", "用手指夾住後直接拋出", "放在球檯端線的白線上"], "answer": 1, "explanation": "發球員必須把球放在不持拍手張開攤平的手掌上，再近乎垂直向上拋起。", "fun_fact": "手掌攤平是為了避免選手用手指搓球製造隱藏的旋轉。", "region": "桌球"}, {"id": "tt-013", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "發球時球擦到球網，但仍落入對方正確的區域，該怎麼判？", "options": ["判發球方失 1 分", "判接發球方失 1 分", "算有效發球，繼續比賽", "重發球，該分重新發過"], "answer": 3, "explanation": "發球擦網後仍落入正確區域屬於重發球（let），該分重來、不計分。", "fun_fact": "重發球沒有次數限制，比賽中曾出現連續好幾次擦網重發的畫面。", "region": "桌球"}, {"id": "tt-014", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "每場比賽中，一位選手（或一對）可以要求幾次暫停？", "options": ["1 次，最長 1 分鐘", "2 次，每次 1 分鐘", "3 次，每次 30 秒", "不限次數，1 分鐘"], "answer": 0, "explanation": "每場比賽每位選手或每一對雙打組合只能要求 1 次暫停，最長 1 分鐘。", "fun_fact": "因為只有一次，教練通常會留到關鍵局的關鍵分才喊。", "region": "桌球"}, {"id": "tt-015", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "國際頂級賽事（如奧運、世錦賽）的單打比賽多半採用幾勝制？", "options": ["三戰兩勝", "五戰三勝", "七戰四勝", "九戰五勝"], "answer": 2, "explanation": "國際頂級賽事多為七戰四勝，一般賽事則常用五戰三勝或三戰兩勝。", "fun_fact": "比賽局數一定是奇數，才不會出現平手的情況。", "region": "桌球"}, {"id": "tt-016", "topic": "tt", "category": "器材", "difficulty": 1, "type": "choice", "question": "一顆標準比賽用桌球的重量是多少？", "options": ["1.7 公克", "2.7 公克", "3.7 公克", "4.7 公克"], "answer": 1, "explanation": "ITTF 規定比賽用球重 2.7 公克、直徑 40 公釐。", "fun_fact": "2.7 公克比一枚新台幣 1 元硬幣（約 3.8 公克）還輕，一顆球用兩根手指就捏得起來。", "region": "桌球"}, {"id": "tt-017", "topic": "tt", "category": "雙打", "difficulty": 1, "type": "choice", "question": "雙打比賽中，發球必須怎麼發？", "options": ["從右半區斜線發到對方右半區", "從左半區斜線發到對方左半區", "從任一半區發到對方任一半區", "從右半區直線發到對方左半區"], "answer": 0, "explanation": "雙打發球必須由發球方的右半區，斜線發到接發球方的右半區。", "fun_fact": "球檯中央那條 3 公釐的白線，就是專門為了雙打發球畫的。", "region": "桌球"}, {"id": "tt-018", "topic": "tt", "category": "比賽規則", "difficulty": 1, "type": "choice", "question": "在決勝局中，什麼時候要交換場地？", "options": ["決勝局中不交換場地", "任一方先得 3 分時", "打滿 5 分鐘的時候", "任一方先得 5 分時"], "answer": 3, "explanation": "決勝局中，任一方先得到 5 分時雙方立刻交換場地。", "fun_fact": "這是為了讓決勝局的兩邊場地條件盡量公平。", "region": "桌球"}, {"id": "tt-019", "topic": "tt", "category": "發球", "difficulty": 2, "type": "choice", "question": "依規則，發球拋球時球至少要上升多少距離？", "options": ["6 公分", "11 公分", "16 公分", "21 公分"], "answer": 2, "explanation": "球離開手掌後必須近乎垂直向上升至少 16 公分。", "fun_fact": "16 公分大約是球檯網高的一倍多，裁判多半靠目測判斷。", "region": "桌球"}, {"id": "tt-020", "topic": "tt", "category": "器材", "difficulty": 2, "type": "choice", "question": "球拍底板的厚度中，天然木材至少要佔多少比例？", "options": ["75%", "85%", "90%", "100%"], "answer": 1, "explanation": "ITTF 規定底板厚度至少 85% 必須是天然木材。", "fun_fact": "剩下的部分可以用碳纖維、芳基纖維等材料補強，但這層纖維不得超過總厚度的 7.5% 或 0.35 公釐。", "region": "桌球"}, {"id": "tt-021", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "比分來到 10:10 之後，換發球的規則有什麼改變？", "options": ["仍然維持每 2 分換發一次", "改成每 3 分換發球一次", "由該局落後的一方連續發球", "改成每 1 分就換發球一次"], "answer": 3, "explanation": "10 平之後改為每 1 分就交換發球權，直到分出勝負。", "fun_fact": "所以 deuce 之後沒有人能靠連續兩個發球局搶下該局。", "region": "桌球"}, {"id": "tt-022", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "輪換發球法（expedite）在什麼條件下會啟動？", "options": ["一局打滿 10 分鐘且雙方未各得 9 分", "一局打滿 15 分鐘且雙方未各得 12 分", "一局打滿 10 分鐘且雙方都還沒得到 5 分", "一局打滿 20 分鐘且雙方未各得 20 分"], "answer": 0, "explanation": "一局打滿 10 分鐘仍未結束，且雙方並非都已得到 9 分（含）以上時啟動；雙方同意也可以提前啟動。", "fun_fact": "這條規則是削球對削球的年代留下來的，用來避免一局打上大半天。", "region": "桌球"}, {"id": "tt-023", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "啟動輪換發球法後，接發球方成功回擊幾板就可以得分？", "options": ["9 板", "11 板", "13 板", "15 板"], "answer": 2, "explanation": "啟動後接發球方若連續完成 13 次合法還擊，該分就判給接發球方。", "fun_fact": "這等於逼發球方一定要在 13 板之內進攻得分，大幅提高比賽節奏。", "region": "桌球"}, {"id": "tt-024", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "依規則，選手在一局當中什麼時候可以擦汗？", "options": ["任何一分結束後都可以擦汗", "每 6 分以及決勝局交換場地時", "只有在要求暫停時才能擦汗", "每 4 分以及決勝局交換場地時"], "answer": 1, "explanation": "規則允許每一局從開始起每 6 分（6、12、18…）以及決勝局交換場地時短暫擦汗；局與局之間本來就有 1 分鐘休息。", "fun_fact": "所以你會看到選手在特定比分才走向擋板邊，那不是拖延而是規則允許的。", "region": "桌球"}, {"id": "tt-025", "topic": "tt", "category": "器材", "difficulty": 2, "type": "choice", "question": "國際賽事從哪一年起改用塑膠球，取代原本的賽璐珞球？", "options": ["2000 年", "2008 年", "2014 年", "2020 年"], "answer": 2, "explanation": "2014 年起國際賽事改用塑膠（poly）球，賽璐珞球走入歷史。", "fun_fact": "換材質後球速與旋轉都略微下降，選手的器材與打法也跟著調整。", "region": "桌球"}, {"id": "tt-026", "topic": "tt", "category": "器材", "difficulty": 2, "type": "choice", "question": "依 ITTF 規定，球網柱的外緣要超出球檯邊線多少距離？", "options": ["5.25 公分", "9.25 公分", "12.25 公分", "15.25 公分"], "answer": 3, "explanation": "網柱外緣必須超出邊線外 15.25 公分，與球網高度的數字相同。", "fun_fact": "球網組合件包含網、網柱與夾鉗，球碰到其中任何一部分效果都一樣。", "region": "桌球"}, {"id": "tt-027", "topic": "tt", "category": "雙打", "difficulty": 2, "type": "choice", "question": "雙打比賽中，同一隊的兩位選手要如何擊球？", "options": ["同一隊兩人必須輪流交替擊球", "由站位比較靠近來球的人擊球", "誰方便接到球誰就可以擊球", "由場邊教練指定由誰來擊球"], "answer": 0, "explanation": "雙打的擊球順序固定，同隊兩人必須輪流交替擊球，不能連續擊球兩次。", "fun_fact": "這也是為什麼雙打選手要不斷走位讓開，讓搭檔有空間接下一板。", "region": "桌球"}, {"id": "tt-028", "topic": "tt", "category": "雙打", "difficulty": 2, "type": "choice", "question": "雙打換發球時，新的發球員是誰？", "options": ["原發球員的搭檔接著發球", "原本的接發球員來發球", "由對方指定其中一人發球", "上一分得分的那位選手發球"], "answer": 1, "explanation": "換發球時原本的接發球員成為發球員，原發球員的搭檔則變成接發球員。", "fun_fact": "這個輪轉讓四個人在一局中都會輪到發球，順序完全固定。", "region": "桌球"}, {"id": "tt-029", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "發球時接發球方明顯還沒準備好，裁判應該怎麼判？", "options": ["判發球方得 1 分", "判接發球方得 1 分", "判重發球，不計分", "警告接發球方一次"], "answer": 2, "explanation": "接發球方尚未準備好時該球判為重發球（let），該分重來、不計分。", "fun_fact": "不過接發球方若已經試圖擊球，就視同已經準備好了。", "region": "桌球"}, {"id": "tt-030", "topic": "tt", "category": "發球", "difficulty": 2, "type": "choice", "question": "關於「遮擋發球」，下列敘述何者正確？", "options": ["球從拋起到擊出必須讓對手看得見", "只要主審裁判看得見就算合法發球", "用身體擋住球是允許的戰術之一", "只有在決勝局才禁止遮擋發球"], "answer": 0, "explanation": "從拋球到擊球的全程，球都必須讓接發球員與裁判看得見，不得遮擋。", "fun_fact": "2002 年起實施無遮擋發球後，發球搶攻的威力明顯下降，回合變長了。", "region": "桌球"}, {"id": "tt-031", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "對打中球擦過球檯上緣的邊角後落到地上，該怎麼判？", "options": ["出界，擊球方失分", "重發球，該分重打", "由主審裁判自由心證", "算好球，擊球方得分"], "answer": 3, "explanation": "球檯上緣的邊線屬於比賽檯面，擦到上緣算好球；只有擦到垂直側面才算出界。", "fun_fact": "所以擦到檯面上緣的「擦邊球」幾乎救不起來，但擦到垂直側面的「擦側球」反而是擊球方失分。", "region": "桌球"}, {"id": "tt-032", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "對打中球打到球網柱之後，落進對方的檯區，該怎麼判？", "options": ["擊球方失分，對方得 1 分", "算好球，比賽繼續進行", "一律判重發球，該分重打", "球網柱以外都算球出界了"], "answer": 1, "explanation": "網柱屬於球網組合件的一部分，球碰到後仍落入對方檯區，比賽照常繼續。", "fun_fact": "這和擦網的道理一樣，只是碰到的是網的兩端而不是網面。", "region": "桌球"}, {"id": "tt-033", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "比賽進行中，選手的非持拍手碰到了比賽檯面，該怎麼判？", "options": ["沒有關係，比賽繼續進行", "判重發球，該分重新打過", "失 1 分，對方得該分", "裁判先給予一次口頭警告"], "answer": 2, "explanation": "規則明定不持拍手觸及比賽檯面即失一分，對方得分。", "fun_fact": "碰到球檯側面或用持拍手扶檯面則不違例，關鍵在於是否碰到比賽檯面。", "region": "桌球"}, {"id": "tt-034", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "選手撲救時衣服碰到了球網，該怎麼判？", "options": ["該選手失分，對方得該分", "只要球有過網就仍算好球", "判重發球，這一分重新打過", "只有碰到球網柱才算違例"], "answer": 0, "explanation": "選手本人或其穿戴的任何東西碰到球網組合件，就判該選手失一分。", "fun_fact": "球網組合件包含網面、網柱與夾鉗，碰到任何一部分都算。", "region": "桌球"}, {"id": "tt-035", "topic": "tt", "category": "比賽規則", "difficulty": 2, "type": "choice", "question": "對手擊來的球在你這一邊的檯面上彈跳了兩次，該怎麼判？", "options": ["判重發球，該分重新打過", "你失 1 分，對方得該分", "對方失 1 分，你得該分", "算界外球，該分不計分"], "answer": 1, "explanation": "球在自己這半邊彈跳兩次代表未能合法還擊，該分判給對方。", "fun_fact": "合法還擊只允許球在自己這一側彈跳一次，這是桌球和網球很不同的地方。", "region": "桌球"}, {"id": "tt-036", "topic": "tt", "category": "發球", "difficulty": 2, "type": "choice", "question": "從拋球到擊球的整個過程中，球必須位於哪個範圍？", "options": ["球檯端線之前、檯面之上", "球網高度以上的任何位置", "發球方本方的半區正上方", "球檯端線之後、檯面之上"], "answer": 3, "explanation": "發球全程球都必須在發球員的端線之後、比賽檯面的水平面之上。", "fun_fact": "「檯面之上」指的是高度要高於檯面，而位置必須留在端線後方，所以不能把球拋到球檯正上方再擊出。", "region": "桌球"}, {"id": "tt-037", "topic": "tt", "category": "比賽規則", "difficulty": 3, "type": "choice", "question": "單打比賽由甲先發球，現在比分是 6:5，接下來這一分該由誰發球？", "options": ["甲，且甲還要再發 1 分", "甲，且這是甲的第 2 球", "乙，且這是乙的第 2 球", "乙，且乙還要再發 2 分"], "answer": 2, "explanation": "已打完 11 分，每 2 分換發：1-2 甲、3-4 乙、5-6 甲、7-8 乙、9-10 甲、11-12 乙，第 12 分是乙的第 2 球。", "fun_fact": "現場記分時只要看「總分除以 2」的奇偶，就能立刻判斷輪到誰發球。", "region": "桌球"}, {"id": "tt-038", "topic": "tt", "category": "比賽規則", "difficulty": 3, "type": "choice", "question": "決勝局比分 4:4，甲再得 1 分變成 5:4，此時會發生什麼事？", "options": ["兩邊立刻交換場地後繼續比賽", "該局立刻結束，判定由甲獲勝", "雙方各獲得一次 1 分鐘暫停", "立刻啟動輪換發球法繼續打"], "answer": 0, "explanation": "決勝局中任一方先得 5 分時，雙方立刻交換場地再繼續比賽。", "fun_fact": "換邊時發球權與分數都不變，只是位置對調。", "region": "桌球"}, {"id": "tt-039", "topic": "tt", "category": "雙打", "difficulty": 3, "type": "choice", "question": "雙打中 A 發球給 X，接下來這一回合的擊球順序是什麼？", "options": ["A → X → A → X 反覆進行", "A → X → B → Y 輪流進行", "A → X → Y → B 輪流進行", "A → B → X → Y 輪流進行"], "answer": 1, "explanation": "雙打擊球順序固定為 A→X→B→Y，四個人依序輪流，不可連擊。", "fun_fact": "這也是雙打常見的失誤來源：一時搶球變成同隊連續擊球，直接失分。", "region": "桌球"}, {"id": "tt-040", "topic": "tt", "category": "雙打", "difficulty": 3, "type": "choice", "question": "雙打決勝局中一方先得 5 分時，除了交換場地還要做什麼？", "options": ["不需要做其他任何調整", "雙方各換上一位替補選手", "重新抽籤決定誰先發球", "接發球方要交換接球方位"], "answer": 3, "explanation": "雙打決勝局換邊時，接發球方還必須交換接發球的方位。", "fun_fact": "這是為了讓每個人在決勝局中接到兩位對手發球的機會盡量平均。", "region": "桌球"}, {"id": "tt-041", "topic": "tt", "category": "比賽規則", "difficulty": 3, "type": "choice", "question": "關於輪換發球法（expedite），下列敘述何者正確？", "options": ["一旦啟動，該場剩下的各局都要適用", "啟動後只有當局適用，下一局恢復正常", "啟動後雙方仍然維持每 2 分換發一次", "只要有一方領先 5 分就可以提前結束"], "answer": 0, "explanation": "輪換發球法一旦啟動，該場比賽剩下的每一局都必須繼續適用。", "fun_fact": "啟動後改為雙方輪流各發 1 分，節奏和平常完全不同。", "region": "桌球"}, {"id": "tt-042", "topic": "tt", "category": "發球", "difficulty": 3, "type": "choice", "question": "整場比賽中，裁判第一次對發球的合法性有疑慮時，依規則應該怎麼處理？", "options": ["中斷比賽提出警告，該分不判失分", "直接判該分失分，並登記一次警告", "立刻取消該選手接下來的發球權利", "要求重新發球，同時扣除該方 1 分"], "answer": 0, "explanation": "整場比賽的第一次有疑慮時，裁判可中斷比賽並警告發球員，不判失分；之後該選手（雙打含其搭檔）再發出不明確合法的球就直接判失分。", "fun_fact": "所以這個警告一場只有一次，之後裁判不會再提醒。", "region": "桌球"}, {"id": "tt-043", "topic": "tt", "category": "比賽規則", "difficulty": 3, "type": "choice", "question": "關於「重發球（let）」，下列敘述何者正確？", "options": ["每一局最多只能出現 3 次重發球", "重發球不計分，而且沒有次數限制", "重發球會讓發球方損失一次發球權", "重發球後由接發球方改為發球方"], "answer": 1, "explanation": "重發球是不予判分的回合，雙方分數與發球權都不變，也沒有次數上限。", "fun_fact": "擦網重發、接發球方未準備好、場外球滾進來，都可能被判重發球。", "region": "桌球"}, {"id": "tt-044", "topic": "tt", "category": "比賽規則", "difficulty": 3, "type": "choice", "question": "發球時球擦到球網後，直接落到對方檯面之外，該怎麼判？", "options": ["判重發球，發球方重新發過", "算好球，發球方得到該分", "警告發球方，該分重新打過", "發球方失分，對方得該分"], "answer": 3, "explanation": "擦網只有在球仍落入正確區域時才算重發球；沒有落到對方檯區就是發球失誤，對方得分。", "fun_fact": "很多人以為「擦網一律重發」，其實關鍵在球最後有沒有落進去。", "region": "桌球"}, {"id": "tt-045", "topic": "tt", "category": "器材", "difficulty": 3, "type": "choice", "question": "關於現行桌球器材的規定，下列敘述何者正確？", "options": ["球檯的垂直側面也算是比賽檯面", "比賽用球必須是有光澤的亮面球", "球網柱屬於球網組合件的一部分", "球拍底板必須完全由天然木材製成"], "answer": 2, "explanation": "網柱與夾鉗都屬於球網組合件；側面不算檯面、球必須霧面、底板天然木材至少 85%。", "fun_fact": "正因為網柱算球網組合件，球碰到網柱再落入對方檯區才算好球。", "region": "桌球"}, {"id": "tt-046", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "桌球界常講的「WTT」，是下列哪一個組織的簡稱？", "options": ["世界桌球職業大聯盟", "國際桌球總會", "世界桌球名人堂", "亞洲桌球聯合會"], "answer": 0, "explanation": "WTT 是 World Table Tennis，中文譯為世界桌球職業大聯盟，負責營運國際桌球的商業賽事體系。", "fun_fact": "國際桌球總會的簡稱是 ITTF，WTT 是它旗下負責辦賽的單位。", "region": "桌球"}, {"id": "tt-047", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "在 WTT 的賽事分級中，等級最高的是哪一種？", "options": ["WTT 挑戰賽", "WTT 冠軍賽", "WTT 支線賽", "WTT 大滿貫"], "answer": 3, "explanation": "大滿貫 Grand Smash 是 WTT 最高等級的賽事，冠軍可拿 2000 積分，賽期長達十天左右。", "fun_fact": "Grand Smash 的規格對標網球四大公開賽，一站就打十天。", "region": "桌球"}, {"id": "tt-048", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "在 WTT 的賽事分級中，等級最低的是哪一種？", "options": ["WTT 冠軍賽", "WTT 球星挑戰賽", "WTT 支線賽", "WTT 挑戰賽"], "answer": 2, "explanation": "支線賽 Feeder 是 WTT 體系中層級最低的一層，主要讓區域選手與復出球員累積積分。", "fun_fact": "Feeder 的意思就是「支線、供應者」，是新秀進入 WTT 體系的入口。", "region": "桌球"}, {"id": "tt-049", "topic": "tt", "category": "歷史", "difficulty": 1, "type": "choice", "question": "國際桌球總會（ITTF）成立於哪一年？", "options": ["1901 年", "1926 年", "1952 年", "1988 年"], "answer": 1, "explanation": "ITTF 於 1926 年成立，同年就舉辦了第一屆世界桌球錦標賽。", "fun_fact": "2026 年正好是 ITTF 成立一百週年。", "region": "桌球"}, {"id": "tt-050", "topic": "tt", "category": "世錦賽", "difficulty": 1, "type": "choice", "question": "史上第一屆世界桌球錦標賽在哪個城市舉行？", "options": ["法國巴黎", "英國倫敦", "德國柏林", "奧地利維也納"], "answer": 1, "explanation": "1926 年第一屆世界桌球錦標賽在倫敦舉行，與 ITTF 成立同一年。", "fun_fact": "桌球本來就發源於 19 世紀末的英國，第一屆世錦賽回到老家很合理。", "region": "桌球"}, {"id": "tt-051", "topic": "tt", "category": "世錦賽", "difficulty": 1, "type": "choice", "question": "世界團體錦標賽的男子團體冠軍獎盃叫什麼名字？", "options": ["考比倫盃", "湯姆斯盃", "戴維斯盃", "斯韋思林盃"], "answer": 3, "explanation": "男子團體冠軍捧的是斯韋思林盃（Swaythling Cup），女子團體則是考比倫盃。", "fun_fact": "湯姆斯盃是羽球、戴維斯盃是網球的團體賽獎盃，很容易混淆。", "region": "桌球"}, {"id": "tt-052", "topic": "tt", "category": "世錦賽", "difficulty": 1, "type": "choice", "question": "世界團體錦標賽的女子團體冠軍獎盃叫什麼名字？", "options": ["斯韋思林盃", "尤伯盃", "考比倫盃", "蘇迪曼盃"], "answer": 2, "explanation": "女子團體冠軍捧的是考比倫盃（Corbillon Cup），男子團體則是斯韋思林盃。", "fun_fact": "考比倫盃以法國桌球協會前主席 Marcel Corbillon 命名，1934 年起開始爭奪。", "region": "桌球"}, {"id": "tt-053", "topic": "tt", "category": "奧運", "difficulty": 1, "type": "choice", "question": "桌球是從哪一屆奧運開始成為正式比賽項目？", "options": ["1984 洛杉磯奧運", "1988 首爾奧運", "1992 巴塞隆納奧運", "1996 亞特蘭大奧運"], "answer": 1, "explanation": "桌球在 1988 年首爾奧運首度列為正式項目，當時設男女單打與男女雙打共四項。", "fun_fact": "主辦國南韓在首屆就拿下男單與女雙兩面金牌。", "region": "桌球"}, {"id": "tt-054", "topic": "tt", "category": "奧運", "difficulty": 1, "type": "choice", "question": "奧運桌球開辦以來的金牌，絕大多數由哪一個國家拿下？", "options": ["日本", "南韓", "瑞典", "中國"], "answer": 3, "explanation": "奧運桌球至今產生的 42 面金牌中，中國隊就拿下 37 面，統治力驚人。", "fun_fact": "除了中國，只有南韓、日本、瑞典拿過奧運桌球金牌。", "region": "桌球"}, {"id": "tt-055", "topic": "tt", "category": "奧運", "difficulty": 1, "type": "choice", "question": "奧運桌球的混合雙打是從哪一屆開始列為正式項目？", "options": ["2008 北京奧運", "2012 倫敦奧運", "2016 里約奧運", "2020 東京奧運"], "answer": 3, "explanation": "混合雙打在 2020 東京奧運首度列入，讓奧運桌球項目從四項增為五項。", "fun_fact": "中華台北的林昀儒與鄭怡靜就是在東京混雙拿下銅牌。", "region": "桌球"}, {"id": "tt-056", "topic": "tt", "category": "世錦賽", "difficulty": 1, "type": "choice", "question": "2026 年的世界團體錦標賽選在哪個城市舉行，作為百年紀念？", "options": ["英國倫敦", "日本東京", "南韓釜山", "中國成都"], "answer": 0, "explanation": "2026 年適逢 ITTF 與世錦賽百年，賽事回到 1926 年的創辦地倫敦舉行。", "fun_fact": "整整一百年前的第一屆世錦賽，也是在倫敦舉行。", "region": "桌球"}, {"id": "tt-057", "topic": "tt", "category": "世錦賽", "difficulty": 1, "type": "choice", "question": "2026 年倫敦世界團體錦標賽的男子團體冠軍是哪一隊？", "options": ["日本", "德國", "中國", "南韓"], "answer": 2, "explanation": "中國男團在 2026 年倫敦世錦賽奪冠，日本拿下亞軍。", "fun_fact": "這是中國男團隊史第 24 座世界團體冠軍，改寫紀錄。", "region": "桌球"}, {"id": "tt-058", "topic": "tt", "category": "世錦賽", "difficulty": 1, "type": "choice", "question": "2026 年倫敦世界團體錦標賽，中華台北男子團體拿下什麼成績？", "options": ["金牌", "銀牌", "銅牌", "第五名"], "answer": 2, "explanation": "中華台北男團在 2026 年倫敦世錦賽拿下銅牌，是台灣男團的重大突破。", "fun_fact": "同樣拿下男團銅牌的還有法國隊。", "region": "桌球"}, {"id": "tt-059", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "2026 年的 WTT 大滿貫（Grand Smash）全年共有幾站？", "options": ["兩站", "三站", "四站", "六站"], "answer": 2, "explanation": "2026 年共有四站大滿貫，分別在新加坡、美國、歐洲（瑞典）與中國舉行。", "fun_fact": "四站的設計，靈感就是來自網球的四大公開賽。", "region": "桌球"}, {"id": "tt-060", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "下列哪一個地點是 2026 年 WTT 大滿貫的主辦地之一？", "options": ["新加坡", "菲律賓", "阿根廷", "南非"], "answer": 0, "explanation": "2026 年四站大滿貫分別在新加坡、美國、瑞典與中國舉行，新加坡是其中一站。", "fun_fact": "新加坡大滿貫排在二月底，是 2026 年的開春第一站大滿貫。", "region": "桌球"}, {"id": "tt-061", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "2026 年的 WTT 總決賽（WTT Finals）在哪裡舉行？", "options": ["香港", "澳門", "杜哈", "新加坡"], "answer": 0, "explanation": "2026 年的 WTT 總決賽於 12 月在香港舉行，是年終的壓軸賽事。", "fun_fact": "總決賽門檻極高，只有年度排名前 16 的選手才有資格參賽。", "region": "桌球"}, {"id": "tt-062", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "2026 年新加坡大滿貫的男子單打冠軍是誰？", "options": ["王楚欽", "樊振東", "張本智和", "馬龍"], "answer": 0, "explanation": "2026 年新加坡大滿貫男單冠軍由中國選手王楚欽拿下。", "fun_fact": "同一站的女單冠軍是孫穎莎，中國隊包辦兩項單打金牌。", "region": "桌球"}, {"id": "tt-063", "topic": "tt", "category": "WTT賽制", "difficulty": 1, "type": "choice", "question": "2026 年新加坡大滿貫的女子單打冠軍是誰？", "options": ["陳夢", "孫穎莎", "王曼昱", "早田希娜"], "answer": 1, "explanation": "2026 年新加坡大滿貫女單冠軍是孫穎莎，這已是她第三度在這一站奪冠。", "fun_fact": "新加坡大滿貫幾乎成了孫穎莎的主場。", "region": "桌球"}, {"id": "tt-064", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "在 WTT 體系中，拿下一站大滿貫（Grand Smash）冠軍可得到多少世界排名積分？", "options": ["1000 分", "1500 分", "2000 分", "2500 分"], "answer": 2, "explanation": "大滿貫冠軍積分為 2000 分，與奧運、世界錦標賽的冠軍積分同級。", "fun_fact": "這也是 WTT 體系裡單站能拿到的最高積分。", "region": "桌球"}, {"id": "tt-065", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 冠軍賽（Champions）的單打冠軍可以拿到多少積分？", "options": ["600 分", "800 分", "1000 分", "1200 分"], "answer": 2, "explanation": "冠軍賽 Champions 的冠軍積分是 1000 分，排在大滿貫與總決賽之後。", "fun_fact": "冠軍賽只設單打，冠軍積分排在大滿貫與總決賽之後，是頂尖選手的必爭之地。", "region": "桌球"}, {"id": "tt-066", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 球星挑戰賽（Star Contender）的冠軍積分是多少？", "options": ["400 分", "500 分", "600 分", "800 分"], "answer": 2, "explanation": "球星挑戰賽冠軍可拿 600 分，比一般挑戰賽的 400 分高一級。", "fun_fact": "Star Contender 常被當成大滿貫之前的重要暖身站。", "region": "桌球"}, {"id": "tt-067", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 挑戰賽（Contender）的冠軍積分是多少？", "options": ["400 分", "300 分", "200 分", "600 分"], "answer": 0, "explanation": "挑戰賽 Contender 的冠軍積分為 400 分，是 WTT 體系中站數最多的一級。", "fun_fact": "Contender 站數多、分布廣，是多數選手累積積分的主力戰場。", "region": "桌球"}, {"id": "tt-068", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 支線賽（Feeder）的冠軍積分是多少？", "options": ["75 分", "125 分", "200 分", "250 分"], "answer": 1, "explanation": "支線賽 Feeder 冠軍只有 125 分，是 WTT 各級賽事中最低的。", "fun_fact": "積分雖少，卻是排名還不夠高的選手打進正賽的重要跳板。", "region": "桌球"}, {"id": "tt-069", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 總決賽（WTT Finals）的冠軍積分是多少？", "options": ["1000 分", "1200 分", "1500 分", "2000 分"], "answer": 2, "explanation": "總決賽冠軍積分為 1500 分，僅次於大滿貫的 2000 分。", "fun_fact": "世界盃冠軍的積分同樣是 1500 分。", "region": "桌球"}, {"id": "tt-070", "topic": "tt", "category": "世界排名", "difficulty": 2, "type": "choice", "question": "桌球世界排名的積分，是把選手的哪些成績加總計算？", "options": ["最好的 5 站", "最好的 10 站", "全部站數加總", "最好的 8 站"], "answer": 3, "explanation": "世界排名採計選手最好的 8 站成績加總，而不是全部比賽通通累加。", "fun_fact": "所以多打不一定多分，關鍵是要在大賽打出好成績。", "region": "桌球"}, {"id": "tt-071", "topic": "tt", "category": "世界排名", "difficulty": 2, "type": "choice", "question": "選手在一站比賽拿到的世界排名積分，有效期間大約多久？", "options": ["半年", "一年", "兩年", "永久保留"], "answer": 1, "explanation": "每一筆排名積分的效期約為一年，過期後就會從總分中扣掉。", "fun_fact": "這就是為什麼選手常要在同一站賽事「保分」。", "region": "桌球"}, {"id": "tt-072", "topic": "tt", "category": "世界排名", "difficulty": 2, "type": "choice", "question": "洲際賽事（例如亞錦賽、歐錦賽）的成績，在世界排名中最多採計幾站？", "options": ["1 站", "2 站", "3 站", "不限站數"], "answer": 0, "explanation": "洲際賽事最多只採計 1 站，冠軍積分上限為 500 分。", "fun_fact": "這個上限是為了避免不同洲際的賽制差異造成排名失衡。", "region": "桌球"}, {"id": "tt-073", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "要取得 WTT 總決賽的參賽資格，選手必須排在年度排名的前幾名？", "options": ["前 8 名", "前 24 名", "前 32 名", "前 16 名"], "answer": 3, "explanation": "WTT 總決賽只有年度排名前 16 的選手取得資格，是年終的菁英賽。", "fun_fact": "打進總決賽本身就被視為一整年成績穩定的證明。", "region": "桌球"}, {"id": "tt-074", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 冠軍賽（Champions）的正賽籤表是多少人？", "options": ["16 人", "32 人", "24 人", "48 人"], "answer": 1, "explanation": "冠軍賽採 32 人籤表，且只設單打項目，沒有雙打。", "fun_fact": "32 人籤表代表冠軍只要贏五場就能到手。", "region": "桌球"}, {"id": "tt-075", "topic": "tt", "category": "WTT賽制", "difficulty": 2, "type": "choice", "question": "WTT 冠軍賽（Champions）設有哪些比賽項目？", "options": ["只有單打", "只有雙打", "單打與雙打", "單打與混雙"], "answer": 0, "explanation": "冠軍賽只設男女單打，不辦雙打項目，是它與大滿貫最明顯的差別之一。", "fun_fact": "少了雙打，賽程更精簡，明星單打對決也更集中。", "region": "桌球"}, {"id": "tt-076", "topic": "tt", "category": "奧運", "difficulty": 2, "type": "choice", "question": "從哪一屆奧運開始，桌球把男女雙打改成男女團體賽？", "options": ["2004 雅典奧運", "2008 北京奧運", "2012 倫敦奧運", "2016 里約奧運"], "answer": 1, "explanation": "2008 北京奧運起，原本的男女雙打被團體賽取代，項目數維持四項。", "fun_fact": "1988 到 2004 年的五屆奧運，桌球都還有男女雙打。", "region": "桌球"}, {"id": "tt-077", "topic": "tt", "category": "奧運", "difficulty": 2, "type": "choice", "question": "2028 洛杉磯奧運的桌球將新增哪一個項目？", "options": ["混合雙打", "男女雙打", "男女團體", "混合團體"], "answer": 3, "explanation": "洛杉磯奧運桌球將擴為六項，新增混合團體賽，男女團體則取消、改回男女雙打。", "fun_fact": "六項的組合是男女單打、男女雙打、混合雙打與混合團體。", "region": "桌球"}, {"id": "tt-078", "topic": "tt", "category": "奧運", "difficulty": 2, "type": "choice", "question": "奧運桌球開辦以來的 42 面金牌中，中國隊拿下幾面？", "options": ["28 面", "32 面", "40 面", "37 面"], "answer": 3, "explanation": "42 面金牌裡中國隊拿走 37 面，等於近九成的奧運桌球金牌都屬於中國。", "fun_fact": "剩下的 5 面分別由南韓、日本與瑞典瓜分。", "region": "桌球"}, {"id": "tt-079", "topic": "tt", "category": "奧運", "difficulty": 2, "type": "choice", "question": "除了中國以外，還有哪三個國家拿過奧運桌球金牌？", "options": ["南韓、日本、瑞典", "南韓、德國、法國", "日本、德國、瑞典", "南韓、日本、德國"], "answer": 0, "explanation": "奧運桌球金牌除中國外，只被南韓、日本與瑞典三國拿過。", "fun_fact": "德國男團雖多次打進奧運決賽，卻始終差一步沒拿到金牌。", "region": "桌球"}, {"id": "tt-080", "topic": "tt", "category": "奧運", "difficulty": 2, "type": "choice", "question": "1988 年首爾奧運的桌球男子單打金牌，由哪一國選手拿下？", "options": ["中國", "瑞典", "日本", "南韓"], "answer": 3, "explanation": "首屆奧運男單金牌由地主南韓的劉南奎奪得，不是由中國拿下。", "fun_fact": "劉南奎因此成為奧運史上第一位桌球男單冠軍。", "re
