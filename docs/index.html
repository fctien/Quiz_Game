 "wd-064", "category": "地理", "difficulty": 3, "type": "choice", "question": "全世界「最早」進入新的一天、最先迎接新年的時區是？", "options": ["UTC+10", "UTC+13", "UTC+12", "UTC+14"], "answer": 3, "explanation": "太平洋島國吉里巴斯的萊恩群島使用 UTC+14，是全世界最早進入新一天的地方。", "fun_fact": "吉里巴斯在 1995 年調整國際換日線，讓原本被換日線分成「兩天」的國土統一在同一天，換日線因此出現一個明顯的凸出。", "topic": "geo", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}, {"id": "wd-069", "category": "地理", "difficulty": 2, "type": "order", "question": "請依山峰高度由高到低，排出下列四座山：", "options": ["富士山", "白朗峰", "聖母峰", "吉力馬札羅山"], "answer": [2, 3, 1, 0], "explanation": "聖母峰約 8,849 公尺，非洲的吉力馬札羅山約 5,895 公尺，歐洲阿爾卑斯山的白朗峰約 4,800 公尺，日本的富士山約 3,776 公尺。", "fun_fact": "白朗峰山頂覆蓋著厚厚的冰雪，冰雪厚度每年不同，所以每次測量出來的高度都會略有差異。", "topic": "geo", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}, {"id": "wd-070", "category": "地理", "difficulty": 3, "type": "order", "question": "請依緯度由北到南，排出下列四座城市：", "options": ["台北", "東京", "首爾", "新加坡"], "answer": [2, 1, 0, 3], "explanation": "首爾約北緯 37.6 度，東京約北緯 35.7 度，台北約北緯 25 度，新加坡約北緯 1.3 度。", "fun_fact": "很多人以為東京比首爾更北，其實首爾的緯度比東京還要高約 2 度。", "topic": "geo", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}, {"id": "wd-073", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "世界五大洋之中，面積最小的是哪一個？", "options": ["印度洋", "大西洋", "北冰洋", "南冰洋"], "answer": 2, "explanation": "北冰洋面積約 1,400 多萬平方公里，是五大洋中最小、也最淺的一個。", "fun_fact": "北冰洋中央終年覆蓋海冰，北極點底下不是陸地，而是幾千公尺深的海水。", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}], "history": [{"id": "tw-001", "category": "歷史", "difficulty": 1, "type": "choice", "question": "荷蘭人在台灣建立的「熱蘭遮城」，位於今天的哪座城市？", "options": ["新竹", "高雄", "基隆", "台南"], "answer": 3, "explanation": "熱蘭遮城於 1624 年起興建，位於今台南安平。", "fun_fact": "熱蘭遮城的遺址就是今天的「安平古堡」。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-002", "category": "歷史", "difficulty": 2, "type": "order", "question": "請依時間先後排出這些事件：", "options": ["馬關條約割讓台灣", "清軍攻台，明鄭結束", "荷蘭人興建熱蘭遮城", "鄭成功驅逐荷蘭人"], "answer": [2, 3, 1, 0], "explanation": "1624 熱蘭遮城 → 1662 鄭成功驅荷 → 1683 明鄭降清 → 1895 馬關條約。", "fun_fact": "明鄭在台灣統治約 21 年，歷經鄭成功、鄭經、鄭克塽三代。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-003", "category": "歷史", "difficulty": 2, "type": "choice", "question": "台灣建省後的首任巡撫，推動鐵路與電報建設的是誰？", "options": ["沈葆楨", "林爽文", "丘逢甲", "劉銘傳"], "answer": 3, "explanation": "劉銘傳於 1885 年台灣建省後出任首任巡撫。", "fun_fact": "他主持興建的鐵路從基隆通到台北，後來再延伸到新竹。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-004", "category": "歷史", "difficulty": 3, "type": "choice", "question": "日治時期設計烏山頭水庫與嘉南大圳的日本工程師是？", "options": ["後藤新平", "兒玉源太郎", "八田與一", "伊能嘉矩"], "answer": 2, "explanation": "八田與一主持興建嘉南大圳，大幅改善嘉南平原的灌溉。", "fun_fact": "烏山頭水庫旁有八田與一的銅像，每年都有紀念活動。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-017", "category": "歷史", "difficulty": 2, "type": "choice", "question": "台灣目前已知最早的史前文化「長濱文化」，其代表遺址八仙洞位於哪個縣？", "options": ["屏東縣", "宜蘭縣", "花蓮縣", "台東縣"], "answer": 3, "explanation": "長濱文化以台東縣長濱鄉的八仙洞遺址為代表，屬於舊石器時代晚期文化。", "fun_fact": "八仙洞原本是海浪侵蝕出的海蝕洞，因為地殼不斷抬升，現在高掛在山壁上。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-018", "category": "歷史", "difficulty": 3, "type": "choice", "question": "1980 年興建南迴鐵路卑南新站（今台東車站）時，意外挖出上千座石板棺的史前遺址是？", "options": ["卑南遺址", "長濱八仙洞遺址", "圓山遺址", "十三行遺址"], "answer": 0, "explanation": "卑南遺址在興建南迴鐵路卑南新站（今台東車站）時被發現，搶救發掘出土約 1,600 座石板棺與大量玉器、陶器。", "fun_fact": "遺址現已規劃為卑南遺址公園，屬於國立臺灣史前文化博物館。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-019", "category": "歷史", "difficulty": 2, "type": "choice", "question": "新北八里的十三行文化史前居民，已經懂得煉鐵。", "options": ["對", "錯"], "answer": 0, "explanation": "十三行遺址出土煉鐵遺留與鐵器，十三行人是目前唯一確定擁有煉鐵技術的台灣史前居民，屬於鐵器時代。", "fun_fact": "這處遺址是 1955 年一位空軍飛官飛越觀音山時，發現羅盤指針異常，才循線找到的。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-020", "category": "歷史", "difficulty": 3, "type": "choice", "question": "1626 年西班牙人在台灣北部建立的「聖薩爾瓦多城」，位於今天的哪裡？", "options": ["基隆和平島", "淡水紅毛城", "宜蘭頭城", "新竹南寮"], "answer": 0, "explanation": "西班牙人於 1626 年佔領基隆的社寮島（今和平島），並在島上興建聖薩爾瓦多城。", "fun_fact": "西班牙人在北台灣只待了約 16 年，1642 年就被荷蘭人趕走了。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-021", "category": "歷史", "difficulty": 1, "type": "choice", "question": "俗諺「一府二鹿三艋舺」中的「鹿」，指的是今天的哪裡？", "options": ["鹿草", "鹿谷", "鹿港", "鹿野"], "answer": 2, "explanation": "這句話描述清代台灣最繁榮的三大港市：府城台南、彰化鹿港、台北艋舺（萬華）。", "fun_fact": "一般認為「艋舺」源自原住民語中的「獨木舟」（Bangka），因為早年常有原住民划獨木舟來此交易。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-022", "category": "歷史", "difficulty": 3, "type": "choice", "question": "1874 年牡丹社事件後，奉命來台籌辦防務、在台南興建「億載金城」的清朝官員是？", "options": ["施琅", "劉永福", "劉銘傳", "沈葆楨"], "answer": 3, "explanation": "沈葆楨來台處理牡丹社事件後續防務，興建億載金城砲台，並推動開山撫番等措施。", "fun_fact": "他也奏請朝廷為鄭成功建祠，就是今天台南的延平郡王祠。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-023", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1908 年全線通車、從基隆一路通到打狗（高雄）的鐵路是？", "options": ["北迴鐵路", "阿里山森林鐵路", "縱貫線鐵路", "南迴鐵路"], "answer": 2, "explanation": "日治時期興建的縱貫線鐵路於 1908 年全線通車，大幅縮短了台灣南北的交通時間。", "fun_fact": "當年的通車典禮在台中公園舉行，公園裡著名的「湖心亭」就是為了這場典禮而蓋的。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-024", "category": "歷史", "difficulty": 1, "type": "choice", "question": "阿里山森林鐵路在日治時期興建，最初主要是為了什麼？", "options": ["運送軍隊與物資", "載遊客上山看日出", "運送山上的木材", "運送茶葉下山"], "answer": 2, "explanation": "日本人看中阿里山豐富的檜木資源，興建森林鐵路把木材運下山。", "fun_fact": "為了爬上陡峭的山坡，鐵路設計了「之字形」折返路線，還會在獨立山繞圈螺旋爬升。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-025", "category": "歷史", "difficulty": 2, "type": "choice", "question": "下列哪一項「不」屬於 1970 年代推動的「十大建設」？", "options": ["台北捷運", "桃園國際機場", "中山高速公路", "北迴鐵路"], "answer": 0, "explanation": "十大建設包括中山高速公路、北迴鐵路、鐵路電氣化、桃園國際機場（當時稱中正國際機場）等；台北捷運第一條路線到 1996 年才通車。", "fun_fact": "中山高速公路於 1978 年全線通車，是台灣第一條南北高速公路。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-026", "category": "歷史", "difficulty": 2, "type": "order", "question": "請依時間先後排出這些事件：", "options": ["牡丹社事件", "郁永河來台採硫磺", "台灣建省", "台北捷運第一條路線通車"], "answer": [1, 0, 2, 3], "explanation": "1697 郁永河來台採硫 → 1874 牡丹社事件 → 1885 台灣建省 → 1996 台北捷運木柵線通車。", "fun_fact": "郁永河把來台採硫的見聞寫成《裨海紀遊》，是認識清初台灣的重要史料。", "topic": "history", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-079", "topic": "history", "category": "明鄭時期", "difficulty": 1, "type": "choice", "question": "鄭成功被民間尊稱為「國姓爺」，是因為他被明朝皇帝賜姓什麼？", "options": ["朱", "李", "劉", "趙"], "answer": 0, "explanation": "南明隆武帝賜鄭成功國姓「朱」並改名成功，民間因此稱他為「國姓爺」。", "fun_fact": "「國姓爺」的閩南語發音 Koxinga，至今仍是西方文獻對鄭成功的通稱。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-080", "topic": "history", "category": "日治時期", "difficulty": 1, "type": "choice", "question": "1895 年清朝把台灣與澎湖割讓給日本，依據的是哪一個條約？", "options": ["北京條約", "馬關條約", "南京條約", "辛丑和約"], "answer": 1, "explanation": "甲午戰爭後，清日兩國於 1895 年簽訂馬關條約，將台灣與澎湖割讓給日本。", "fun_fact": "條約在日本山口縣下關（舊稱馬關）的春帆樓簽訂，所以稱為馬關條約。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-081", "topic": "history", "category": "日治時期", "difficulty": 1, "type": "choice", "question": "台灣的日本統治時期從 1895 年開始、到 1945 年結束，前後大約多少年？", "options": ["約三十年", "約四十年", "約五十年", "約六十年"], "answer": 2, "explanation": "日治時期自 1895 年馬關條約生效起，至 1945 年二次大戰結束為止，共約五十年。", "fun_fact": "日治五十年間，台灣總督府一共換過十九任總督。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-082", "topic": "history", "category": "戰後台灣", "difficulty": 1, "type": "choice", "question": "二二八事件發生於哪一年？", "options": ["1937 年", "1945 年", "1947 年", "1949 年"], "answer": 2, "explanation": "二二八事件起於 1947 年 2 月 27 日台北的查緝私菸衝突，隔日擴大為全島性事件。", "fun_fact": "1995 年起，每年 2 月 28 日訂為「和平紀念日」，是國定假日。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-083", "topic": "history", "category": "戰後台灣", "difficulty": 1, "type": "choice", "question": "台灣本島宣布解除戒嚴，是在哪一年？", "options": ["1987 年", "1991 年", "1996 年", "2000 年"], "answer": 0, "explanation": "政府於 1987 年 7 月 15 日解除在台灣本島與澎湖實施的戒嚴令。", "fun_fact": "金門與馬祖因位處前線，一直到 1992 年才解除戰地政務。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-084", "topic": "history", "category": "戰後台灣", "difficulty": 1, "type": "choice", "question": "台灣第一次由人民直接投票選出總統，是在哪一年？", "options": ["1988 年", "1992 年", "1996 年", "2000 年"], "answer": 2, "explanation": "1996 年舉行首次總統、副總統公民直選，在此之前總統由國民大會選出。", "fun_fact": "1991 年國民大會代表全面改選，是直選總統前的重要一步。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-085", "topic": "history", "category": "明鄭時期", "difficulty": 1, "type": "choice", "question": "1683 年率清軍在澎湖海戰擊敗明鄭水師、使明鄭政權結束的將領是？", "options": ["施琅", "姚啟聖", "沈有容", "藍鼎元"], "answer": 0, "explanation": "施琅於 1683 年在澎湖擊敗明鄭水師，鄭克塽隨後投降，明鄭統治告終。", "fun_fact": "施琅原本是鄭成功的部將，後來投效清朝，最終率軍攻下台灣。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-086", "topic": "history", "category": "日治時期", "difficulty": 1, "type": "choice", "question": "日治時期落成的「台灣總督府」建築，現在是哪一個機關的所在地？", "options": ["監察院", "行政院", "司法院", "總統府"], "answer": 3, "explanation": "台灣總督府廳舍於 1919 年完工，戰後修復改稱介壽館，現為總統府。", "fun_fact": "這棟建築從空中看呈「日」字形，中央塔樓高約 60 公尺。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-087", "topic": "history", "category": "史前與原住民族", "difficulty": 1, "type": "choice", "question": "台灣原住民族所使用的語言，屬於下列哪一個語系？", "options": ["漢藏語系", "南島語系", "印歐語系", "阿爾泰語系"], "answer": 1, "explanation": "台灣原住民族語言都屬於南島語系，這個語系分布從馬達加斯加一路到太平洋各島。", "fun_fact": "不少語言學者認為台灣是南島語族擴散的重要起點，語言多樣性在南島世界名列前茅。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-088", "topic": "history", "category": "大航海時代", "difficulty": 1, "type": "choice", "question": "十六世紀歐洲人以「Formosa（福爾摩沙）」稱呼台灣，一般認為這個稱呼來自哪一國船員？", "options": ["英國", "西班牙", "荷蘭", "葡萄牙"], "answer": 3, "explanation": "一般說法是葡萄牙船員航經台灣時讚嘆「Ilha Formosa」（美麗之島），這個名字後來被歐洲地圖廣泛沿用。", "fun_fact": "Formosa 在葡萄牙文裡就是「美麗的」，當年被用來命名的島嶼其實不只台灣一個。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-089", "topic": "history", "category": "日治時期", "difficulty": 1, "type": "choice", "question": "1930 年霧社事件中，率領族人武裝反抗日本統治的賽德克族領袖是？", "options": ["莫那魯道", "拉荷阿雷", "羅福星", "林少貓"], "answer": 0, "explanation": "霧社事件由馬赫坡社頭目莫那魯道率領賽德克族人發動，是日治時期規模最大的原住民抗日事件。", "fun_fact": "事件發生地在今南投縣仁愛鄉，當年的霧社公學校運動會是事件的起點。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-090", "topic": "history", "category": "清領時期", "difficulty": 1, "type": "choice", "question": "清領時期渡海來台開墾的漢人移民，主要來自中國的哪兩個省份？", "options": ["江蘇與浙江", "福建與廣東", "山東與河北", "湖南與江西"], "answer": 1, "explanation": "來台漢人以福建的漳州、泉州人最多，其次是廣東東部的客家移民。", "fun_fact": "早年渡過台灣海峽風險極高，因此留下「六死三留一回頭」的說法。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-091", "topic": "history", "category": "清領時期", "difficulty": 2, "type": "choice", "question": "清末台灣開港通商之後，最主要的三項出口商品是？", "options": ["茶、糖與樟腦", "絲綢、瓷器與鹽", "稻米、煤礦與鐵", "木材、藥材與布"], "answer": 0, "explanation": "1860 年代開港後，北部的茶與樟腦、南部的蔗糖成為台灣三大出口品，帶動經濟重心北移。", "fun_fact": "外商約翰・陶德引進茶苗並外銷「Formosa Oolong Tea」，讓台灣烏龍茶打進美國市場。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-092", "topic": "history", "category": "清領時期", "difficulty": 2, "type": "choice", "question": "1721 年在台灣南部起事、因養鴨維生而被稱為「鴨母王」的民變領袖是？", "options": ["戴潮春", "林爽文", "朱一貴", "吳沙"], "answer": 2, "explanation": "朱一貴於 1721 年在羅漢門（今高雄內門）起事，因以養鴨為業而有「鴨母王」之稱。", "fun_fact": "朱一貴事件、林爽文事件與戴潮春事件，合稱清代台灣三大民變。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-093", "topic": "history", "category": "日治時期", "difficulty": 2, "type": "choice", "question": "1895 年台灣官紳為抵抗日本接收而成立的短暫政權，名稱是什麼？", "options": ["台灣自治國", "台灣民主國", "東寧共和國", "福爾摩沙國"], "answer": 1, "explanation": "1895 年 5 月台灣官紳成立台灣民主國，推唐景崧為總統，但不到半年即告瓦解。", "fun_fact": "台灣民主國的國旗是「藍地黃虎旗」，年號則訂為「永清」。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-094", "topic": "history", "category": "日治時期", "difficulty": 2, "type": "choice", "question": "1921 年由蔣渭水等人在台北成立、以文化啟蒙為宗旨的團體是？", "options": ["台灣民眾黨", "台灣文化協會", "台灣農民組合", "台灣自治聯盟"], "answer": 1, "explanation": "台灣文化協會成立於 1921 年，透過演講會、讀報社與文化劇推動思想啟蒙。", "fun_fact": "蔣渭水本業是醫師，他曾寫下〈臨床講義〉，把台灣當成病人來「診斷」，說台灣患的是「知識營養不良症」。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-095", "topic": "history", "category": "日治時期", "difficulty": 2, "type": "choice", "question": "日本在台灣推行的「皇民化運動」，主要是從哪個時間點之後加緊推動？", "options": ["1895 年日本領台之初", "1920 年地方制度改革後", "1930 年霧社事件發生後", "1937 年中日戰爭爆發後"], "answer": 3, "explanation": "1937 年中日戰爭爆發後，總督府加強推動皇民化，包括國語（日語）運動、改姓名、寺廟整理與參拜神社等。", "fun_fact": "皇民化時期報紙的漢文欄被廢止，傳統戲曲也被要求改演「皇民劇」。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-096", "topic": "history", "category": "戰後台灣", "difficulty": 2, "type": "choice", "question": "1953 年實施、由政府徵收地主超額耕地再轉售給佃農的土地改革政策是？", "options": ["公地放領", "三七五減租", "耕者有其田", "農地重劃"], "answer": 2, "explanation": "耕者有其田於 1953 年實施，政府徵收地主超額出租耕地，轉賣給承租的佃農，使其成為自耕農。", "fun_fact": "政府以實物土地債券和台泥、台紙等四大公營公司股票作為補償，不少地主因此轉為工商業經營者。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-097", "topic": "history", "category": "戰後台灣", "difficulty": 2, "type": "choice", "question": "1966 年台灣設立第一個加工出口區，帶動出口導向的工業發展，地點在哪個城市？", "options": ["台中", "台北", "高雄", "新竹"], "answer": 2, "explanation": "高雄加工出口區於 1966 年正式啟用，結合自由貿易區與工業區的概念，吸引外資設廠、擴大出口。", "fun_fact": "加工出口區當年吸納大量女性勞動力，「女工」成為 1960、70 年代台灣工業化的重要身影。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-098", "topic": "history", "category": "戰後台灣", "difficulty": 2, "type": "choice", "question": "中華民國退出聯合國，是在哪一年？", "options": ["1965 年", "1971 年", "1978 年", "1979 年"], "answer": 1, "explanation": "1971 年聯合國大會通過第 2758 號決議，中華民國代表隨即退出聯合國。", "fun_fact": "此後幾年台灣接連面臨斷交衝擊，政府也在這段期間加速推動十大建設。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-099", "topic": "history", "category": "戰後台灣", "difficulty": 2, "type": "choice", "question": "台灣第一座科學園區於 1980 年正式設立，位在哪個縣市？", "options": ["台南市", "台中市", "桃園市", "新竹市"], "answer": 3, "explanation": "新竹科學園區於 1980 年成立，鄰近清華、交通兩所大學與工研院，成為台灣半導體產業的起點。", "fun_fact": "台積電於 1987 年在新竹科學園區創立，是園區最早的積體電路公司之一。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-100", "topic": "history", "category": "清領時期", "difficulty": 2, "type": "choice", "question": "1684 年清朝在台灣設置「台灣府」，當時這個府隸屬於哪一個省？", "options": ["廣東省", "江蘇省", "浙江省", "福建省"], "answer": 3, "explanation": "1684 年清朝設一府三縣（台灣府，轄台灣、鳳山、諸羅三縣），隸屬福建省，直到 1885 年台灣才單獨建省。", "fun_fact": "清初曾有官員主張放棄台灣，施琅上〈恭陳台灣棄留疏〉力主保留，朝廷才決定設府治理。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-101", "topic": "history", "category": "大航海時代", "difficulty": 3, "type": "choice", "question": "1652 年荷蘭統治時期，台灣爆發了由誰領導的大規模漢人反抗事件？", "options": ["顏思齊", "郭懷一", "何斌", "李旦"], "answer": 1, "explanation": "郭懷一事件是荷治時期規模最大的漢人武裝反抗，起因與沉重的稅賦與人頭稅有關，最後遭荷蘭人與原住民聯手鎮壓。", "fun_fact": "何斌後來把台灣的港道圖獻給鄭成功，被認為是鄭軍順利登陸鹿耳門的關鍵之一。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-102", "topic": "history", "category": "清領時期", "difficulty": 3, "type": "choice", "question": "清代「諸羅」因為在哪一場民變中軍民守城有功，被乾隆皇帝賜名為「嘉義」？", "options": ["朱一貴事件", "林爽文事件", "戴潮春事件", "施九緞事件"], "answer": 1, "explanation": "1786 年林爽文起事，諸羅城軍民長期困守不降，乾隆皇帝嘉許其忠義，於 1787 年將諸羅改名為嘉義。", "fun_fact": "林爽文事件最後由清朝派福康安領軍平定，事件平息後朝廷在台灣各地立碑紀念。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-103", "topic": "history", "category": "大航海時代", "difficulty": 3, "type": "choice", "question": "荷蘭時期傳教士用羅馬字為原住民拼寫語言，留下的「新港文書」記錄的是哪一族的語言？", "options": ["西拉雅族", "凱達格蘭族", "巴宰族", "道卡斯族"], "answer": 0, "explanation": "荷蘭傳教士以羅馬字書寫台南一帶西拉雅族新港社的語言，用來傳教與訂立契約，這些文書被稱為新港文書。", "fun_fact": "民間把這些夾雜羅馬字的契約俗稱為「番仔契」，最晚的一份寫於荷蘭人離台超過一百年之後。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-104", "topic": "history", "category": "日治時期", "difficulty": 3, "type": "choice", "question": "1915 年爆發、由余清芳等人領導，被視為漢人最後一次大規模武裝抗日的事件是？", "options": ["羅福星事件", "北埔事件", "西來庵事件", "霧社事件"], "answer": 2, "explanation": "西來庵事件因余清芳等人以台南西來庵為據點策劃起事而得名，主戰場在噍吧哖（今台南玉井），又稱噍吧哖事件。", "fun_fact": "事件之後，漢人的抗日方式逐漸從武裝行動轉向議會請願、結社與辦報等非武裝路線。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-105", "topic": "history", "category": "戰後台灣", "difficulty": 3, "type": "choice", "question": "1979 年 12 月 10 日發生的美麗島事件，地點在哪個城市？", "options": ["台北", "台中", "台南", "高雄"], "answer": 3, "explanation": "美麗島事件發生於 1979 年 12 月 10 日世界人權日，《美麗島》雜誌社在高雄舉辦遊行，過程中與警方發生衝突，事後多名參與者遭到逮捕與審判。", "fun_fact": "事件相關的軍事審判在隔年公開進行，審判過程經由報紙刊登，是台灣民主化歷程中常被提及的一段。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "history-TW-001", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台灣新石器時代最早、被認為可能是南島語族祖先的史前文化是？", "options": ["圓山文化", "大坌坑文化", "卑南文化", "十三行文化"], "answer": 1, "explanation": "大坌坑文化距今約七千至四千七百年，是台灣新石器時代最早的一層，學界多認為與南島語族起源有關。", "fun_fact": "它最早在新北八里的大坌坑遺址被發現，因此得名。"}, {"id": "history-TW-002", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "每兩年舉行一次的傳統祭典「矮靈祭」，是哪一族的祭典？", "options": ["阿美族", "布農族", "賽夏族", "排灣族"], "answer": 2, "explanation": "矮靈祭（paSta'ay）是賽夏族紀念矮人的祭典，每兩年一次、每十年一次大祭。", "fun_fact": "祭場分南北兩處，分別在苗栗向天湖與新竹五峰大隘。"}, {"id": "history-TW-003", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 1, "type": "choice", "question": "荷蘭人在赤崁蓋的「普羅民遮城」，是今天台南的哪個古蹟？", "options": ["赤崁樓", "億載金城", "安平古堡", "延平郡王祠"], "answer": 0, "explanation": "普羅民遮城建於一六五〇年代，後來在原址上改建成今日的赤崁樓。", "fun_fact": "赤崁樓下的九座御龜碑，是清代乾隆皇帝為平定民變所立。"}, {"id": "history-TW-004", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 1, "type": "choice", "question": "荷蘭時代統治台灣、經營大員商館的，是哪一個組織？", "options": ["英國東印度公司", "葡萄牙皇家商會", "西班牙東印度公司", "荷蘭東印度公司"], "answer": 3, "explanation": "一六二四到一六六二年的台灣，是由荷蘭聯合東印度公司（VOC）代表尼德蘭共和國經營的貿易據點。", "fun_fact": "VOC 是世界最早發行股票的股份公司之一。"}, {"id": "history-TW-005", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "1661 年鄭成功船隊趁漲潮通過哪個水道，開進台江內海？", "options": ["鹿耳門", "安平港", "打狗港", "笨港口"], "answer": 0, "explanation": "鄭軍避開荷蘭砲台，趁大潮由鹿耳門水道進入台江內海，再由禾寮港登陸。", "fun_fact": "鹿耳門因此有「台灣之門」的稱號。"}, {"id": "history-TW-006", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "建議鄭經蓋孔廟、設學校，替台灣打下教育基礎的明鄭重臣是？", "options": ["馮錫範", "陳永華", "劉國軒", "沈光文"], "answer": 1, "explanation": "陳永華主張先建聖廟、立學校以培養人才，一六六五年台南孔子廟因此落成。", "fun_fact": "民間傳說中的天地會「陳近南」，常被附會成陳永華。"}, {"id": "history-TW-007", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 3, "type": "choice", "question": "1664 年鄭經把父親所設的「東都」改名為什麼？", "options": ["東瀛", "明京", "東寧", "承天"], "answer": 2, "explanation": "鄭經重劃行政區，把東都改稱東寧，並將天興、萬年兩縣升格為州。", "fun_fact": "因此明鄭政權也常被稱作「東寧王國」。"}, {"id": "history-TW-008", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 3, "type": "choice", "question": "清代台灣三大民變中，1862 年在彰化起事、歷時最久的是？", "options": ["朱一貴事件", "林爽文事件", "郭懷一事件", "戴潮春事件"], "answer": 3, "explanation": "戴潮春事件從一八六二年延燒到一八六五年，前後三年多，是清代台灣持續最久的民變。", "fun_fact": "戴潮春原本是協助官府維持地方治安的地方頭人。"}, {"id": "history-TW-009", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 3, "type": "choice", "question": "1875 年清朝「開山撫番」時，總兵吳光亮開闢的中路古道是？", "options": ["八通關古道", "淡蘭古道", "浸水營古道", "蘇花古道"], "answer": 0, "explanation": "吳光亮率兵自竹山林圯埔向東開路，翻越中央山脈抵達璞石閣（今玉里），即八通關古道。", "fun_fact": "日治時期另闢的八通關越嶺道，路線幾乎與清代古道完全不重疊。"}, {"id": "history-TW-010", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "日治時期的第一任台灣總督是誰？", "options": ["乃木希典", "樺山資紀", "兒玉源太郎", "明石元二郎"], "answer": 1, "explanation": "海軍大將樺山資紀於一八九五年五月就任首任台灣總督，任期約一年。", "fun_fact": "他早在一八七三年就曾來台調查，替日本出兵台灣預作準備。"}, {"id": "history-TW-011", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "1921 年起由林獻堂等人發起、向日本帝國議會請願的運動是？", "options": ["六三法撤廢運動", "台灣農民組合運動", "台灣議會設置請願運動", "台灣地方自治聯盟運動"], "answer": 2, "explanation": "台灣議會設置請願運動自一九二一年到一九三四年共提出十五回請願，要求設置民選的台灣議會。", "fun_fact": "十五次請願全被以「不採擇」或「審議未了」擱置。"}, {"id": "history-TW-012", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 3, "type": "choice", "question": "1945 年 10 月 25 日的台灣省受降典禮，在台北哪棟建築舉行？", "options": ["台灣總督府", "台北州廳", "台北賓館", "台北公會堂"], "answer": 3, "explanation": "中國戰區台灣省受降典禮在台北公會堂舉行，該建築戰後改名為中山堂。", "fun_fact": "舉行典禮的大廳因此被命名為「光復廳」。"}, {"id": "history-TW-013", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 2, "type": "choice", "question": "1949 年幣制改革，舊台幣多少元才能換到新台幣一元？", "options": ["四萬元", "四千元", "四百元", "四十萬元"], "answer": 0, "explanation": "一九四九年六月發行新台幣，規定舊台幣四萬元折合新台幣一元，用以收拾惡性通膨。", "fun_fact": "「四萬換一塊」因此成為長輩口中的時代記憶。"}, {"id": "history-TW-014", "topic": "history", "unit": "TW", "unit_name": "台灣", "category": "歷史", "region": "台灣", "difficulty": 1, "type": "choice", "question": "台灣把國民義務教育從六年延長為九年，是哪一年開始實施？", "options": ["1958 年", "1968 年", "1978 年", "1988 年"], "answer": 1, "explanation": "一九六八年起實施九年國民義務教育，國民學校改稱國民小學，並增設國民中學。", "fun_fact": "政策上路後，初中入學考試也隨之走入歷史。"}, {"id": "cn-001", "category": "歷史", "difficulty": 1, "type": "choice", "question": "第一個統一中國、自稱「始皇帝」的是誰？", "options": ["嬴政", "劉邦", "漢武帝", "項羽"], "answer": 0, "explanation": "秦王嬴政於西元前 221 年統一六國，自稱始皇帝。", "fun_fact": "他也統一了文字、貨幣和度量衡。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-002", "category": "歷史", "difficulty": 1, "type": "order", "question": "請依時間先後排出這些朝代：", "options": ["宋", "漢", "唐", "隋"], "answer": [1, 3, 2, 0], "explanation": "順序是 漢 → 隋 → 唐 → 宋。", "fun_fact": "隋朝雖然只有短短三十多年，卻開鑿了大運河。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-003", "category": "歷史", "difficulty": 2, "type": "choice", "question": "漢武帝時奉命出使西域、開拓絲路的是誰？", "options": ["班超", "鄭和", "玄奘", "張騫"], "answer": 3, "explanation": "張騫出使西域，打通了中原與西域的交通。", "fun_fact": "葡萄、苜蓿等作物據說就是那時傳進中原的。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-004", "category": "歷史", "difficulty": 2, "type": "choice", "question": "明朝的鄭和一共下西洋幾次？", "options": ["3 次", "10 次", "7 次", "5 次"], "answer": 2, "explanation": "鄭和在永樂、宣德年間共七次下西洋。", "fun_fact": "他的船隊最遠到達東非沿岸。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-017", "category": "歷史", "difficulty": 2, "type": "choice", "question": "一般認為，中國的「科舉制度」創始於哪個朝代？", "options": ["隋朝", "元朝", "漢朝", "宋朝"], "answer": 0, "explanation": "隋朝開始以考試選拔官員，隋煬帝時設立進士科，一般視為科舉的開端。", "fun_fact": "科舉在清末 1905 年正式廢除，前後實行了約 1300 年。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-018", "category": "歷史", "difficulty": 1, "type": "choice", "question": "成語「臥薪嘗膽」說的是哪一位君王忍辱復國的故事？", "options": ["漢高祖劉邦", "西楚霸王項羽", "吳王夫差", "越王勾踐"], "answer": 3, "explanation": "越王勾踐被吳國打敗後刻苦自勵，最終滅了吳國。", "fun_fact": "《史記》其實只記載勾踐「嘗膽」，「臥薪」是後人附加上去的說法。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-019", "category": "歷史", "difficulty": 1, "type": "choice", "question": "成語「破釜沉舟」出自哪位人物在鉅鹿之戰的決戰行動？", "options": ["劉邦", "韓信", "項羽", "曹操"], "answer": 2, "explanation": "項羽渡河後下令鑿沉船隻、打破煮飯的鍋，只帶三天糧食，表示不勝不歸。", "fun_fact": "這一戰項羽以少勝多大破秦軍主力，從此威震諸侯。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-020", "category": "歷史", "difficulty": 1, "type": "choice", "question": "民間傳說「岳母刺字」，母親在誰的背上刺下「精忠報國」？", "options": ["戚繼光", "文天祥", "岳飛", "關羽"], "answer": 2, "explanation": "這是南宋名將岳飛的著名傳說。", "fun_fact": "據《宋史》記載，岳飛背上刺的是「盡忠報國」四字，至於是否為岳母所刺並無史料根據。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-021", "category": "歷史", "difficulty": 1, "type": "choice", "question": "歷史上被稱為「貞觀之治」的盛世，是哪位皇帝在位時？", "options": ["漢武帝", "唐太宗", "唐玄宗", "宋太祖"], "answer": 1, "explanation": "「貞觀」是唐太宗李世民的年號，他在位時政治清明、國力強盛。", "fun_fact": "唐太宗曾說魏徵是他的鏡子：「以人為鏡，可以明得失」。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-022", "category": "歷史", "difficulty": 3, "type": "choice", "question": "中國唯一的正統女皇帝武則天登基後，改國號為什麼？", "options": ["周", "魏", "齊", "唐"], "answer": 0, "explanation": "武則天於 690 年稱帝，改國號為「周」，史稱「武周」。", "fun_fact": "她晚年被迫退位後，國號又改回「唐」。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-023", "category": "歷史", "difficulty": 2, "type": "choice", "question": "北宋發明「活字印刷術」的是哪一位？", "options": ["張衡", "畢昇", "郭守敬", "蔡倫"], "answer": 1, "explanation": "北宋平民畢昇發明膠泥活字，事蹟記載於沈括的《夢溪筆談》。", "fun_fact": "畢昇的活字是用黏土刻字再用火燒硬，比歐洲古騰堡的活字印刷早了約四百年。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-024", "category": "歷史", "difficulty": 2, "type": "choice", "question": "南北朝時期，把圓周率精確推算到小數點後第 7 位的數學家是誰？", "options": ["沈括", "張衡", "郭守敬", "祖沖之"], "answer": 3, "explanation": "祖沖之算出圓周率介於 3.1415926 與 3.1415927 之間。", "fun_fact": "他還提出「密率」355/113，是非常精準又好記的近似分數。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-025", "category": "歷史", "difficulty": 2, "type": "choice", "question": "明太祖朱元璋在建立明朝之前，曾經出家當過和尚。", "options": ["對", "錯"], "answer": 0, "explanation": "朱元璋幼年家貧、親人死於饑荒，曾到皇覺寺出家，後來才投身起義軍。", "fun_fact": "他從放牛娃、和尚一路成為開國皇帝，是中國史上出身最寒微的皇帝之一。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-026", "category": "歷史", "difficulty": 2, "type": "choice", "question": "「罷黜百家，獨尊儒術」是秦始皇推行的政策。", "options": ["對", "錯"], "answer": 1, "explanation": "這是漢武帝時採納董仲舒的建議而推行的；秦始皇反而是「焚書坑儒」。", "fun_fact": "從漢武帝之後，儒家思想成為中國兩千年來的官方正統學說。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-027", "category": "歷史", "difficulty": 3, "type": "choice", "question": "成語「紙上談兵」諷刺的是戰國時代哪位將領？", "options": ["廉頗", "孫臏", "白起", "趙括"], "answer": 3, "explanation": "趙括熟讀兵書卻缺乏實戰經驗，在長平之戰中大敗於秦將白起。", "fun_fact": "趙括的母親曾事先上書趙王，說兒子不能當大將，請求萬一失敗不要株連家人。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-028", "category": "歷史", "difficulty": 3, "type": "order", "question": "請依發生時間先後排列這些歷史事件：", "options": ["靖難之役", "陳橋兵變", "赤壁之戰", "玄武門之變"], "answer": [2, 3, 1, 0], "explanation": "赤壁之戰（208 年，東漢末）→ 玄武門之變（626 年，唐）→ 陳橋兵變（960 年，北宋建立）→ 靖難之役（1399 年起，明）。", "fun_fact": "成語「黃袍加身」就是出自趙匡胤的陳橋兵變。", "topic": "history", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-074", "topic": "history", "category": "先秦", "difficulty": 1, "type": "choice", "question": "儒家創始人孔子是春秋時代哪一個諸侯國的人？", "options": ["齊國", "楚國", "魯國", "秦國"], "answer": 2, "explanation": "孔子生於春秋時代的魯國陬邑，也就是今天的山東曲阜一帶。", "fun_fact": "曲阜的孔廟、孔林、孔府合稱「三孔」，1994年列入世界文化遺產。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-075", "topic": "history", "category": "三國", "difficulty": 1, "type": "choice", "question": "赤壁之戰中，孫權與劉備的聯軍擊敗了哪一方的大軍？", "options": ["袁紹", "曹操", "董卓", "呂布"], "answer": 1, "explanation": "西元208年，孫劉聯軍在赤壁以火攻大破曹操南下的軍隊。", "fun_fact": "赤壁之戰後形成魏、蜀、吳三方鼎立的局面。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-076", "topic": "history", "category": "隋唐", "difficulty": 1, "type": "choice", "question": "唐代高僧玄奘西行求取佛經，最終抵達的是當時的哪個地區？", "options": ["波斯（今伊朗）", "大秦（今羅馬）", "天竺（今印度）", "扶桑（今日本）"], "answer": 2, "explanation": "玄奘從長安出發，經西域前往天竺（印度）取經，在那爛陀寺學習多年。", "fun_fact": "他回國後口述、由弟子筆錄成《大唐西域記》，是研究當時中亞與印度的重要史料。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-077", "topic": "history", "category": "近代", "difficulty": 1, "type": "choice", "question": "鴉片戰爭戰敗後，清朝與英國簽訂的第一個不平等條約是？", "options": ["北京條約", "天津條約", "南京條約", "馬關條約"], "answer": 2, "explanation": "1842年清朝與英國簽訂《南京條約》，割讓香港島並開放五口通商。", "fun_fact": "《南京條約》是在停泊於南京江面的英國軍艦「皋華麗號」上簽訂的。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-078", "topic": "history", "category": "近代", "difficulty": 1, "type": "choice", "question": "1911年辛亥革命的首義，發生在哪一座城市？", "options": ["南京", "廣州", "上海", "武昌"], "answer": 3, "explanation": "1911年10月10日革命黨人在武昌發動起義，各省接連響應，史稱辛亥革命。", "fun_fact": "因為起義發生在農曆辛亥年，所以稱為辛亥革命；10月10日後來成為「雙十節」。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-079", "topic": "history", "category": "秦漢", "difficulty": 1, "type": "choice", "question": "秦朝末年發動中國史上第一次大規模民變的領袖是誰？", "options": ["項羽、項梁", "陳勝、吳廣", "劉邦、蕭何", "張角、張梁"], "answer": 1, "explanation": "西元前209年陳勝、吳廣在大澤鄉起事，揭開反秦民變的序幕。", "fun_fact": "「王侯將相寧有種乎」就是《史記》記載陳勝說過的話。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-080", "topic": "history", "category": "先秦", "difficulty": 1, "type": "choice", "question": "刻在龜甲與獸骨上的「甲骨文」，主要出自哪一個朝代？", "options": ["夏朝", "商朝", "西周", "春秋"], "answer": 1, "explanation": "甲骨文是商朝晚期的占卜紀錄，大量出土於河南安陽的殷墟。", "fun_fact": "甲骨文是1899年由清朝官員王懿榮在中藥材「龍骨」上發現的。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-081", "topic": "history", "category": "宋元", "difficulty": 1, "type": "choice", "question": "建立元朝、定都大都（今北京）的是哪一位君主？", "options": ["成吉思汗", "窩闊台", "忽必烈", "努爾哈赤"], "answer": 2, "explanation": "成吉思汗的孫子忽必烈於1271年定國號為「大元」，1279年滅南宋統一全國。", "fun_fact": "義大利人馬可波羅相傳就是在忽必烈在位期間來到中國。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-082", "topic": "history", "category": "明清", "difficulty": 1, "type": "choice", "question": "清朝最後一位皇帝溥儀，在位時使用的年號是？", "options": ["咸豐", "同治", "光緒", "宣統"], "answer": 3, "explanation": "溥儀1908年即位，年號宣統，1912年清帝退位，清朝結束。", "fun_fact": "溥儀即位時還不滿三歲，是清朝年紀最小的皇帝。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-083", "topic": "history", "category": "三國", "difficulty": 1, "type": "choice", "question": "成語「三顧茅廬」中，劉備三次登門請出山的是誰？", "options": ["周瑜", "司馬懿", "龐統", "諸葛亮"], "answer": 3, "explanation": "劉備三次前往隆中拜訪諸葛亮，請他出山輔佐，這段記載見於《三國志》。", "fun_fact": "諸葛亮在〈出師表〉中自述「三顧臣於草廬之中」，就是指這件事。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-084", "topic": "history", "category": "隋唐", "difficulty": 1, "type": "choice", "question": "唐朝由盛轉衰的關鍵事件，一般認為是哪一場動亂？", "options": ["安史之亂", "黃巾之亂", "八王之亂", "黃巢之亂"], "answer": 0, "explanation": "755年安祿山、史思明起兵叛亂，歷時八年，唐朝國力自此大幅衰退。", "fun_fact": "杜甫的〈春望〉「國破山河在，城春草木深」就寫於安史之亂期間。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-085", "topic": "history", "category": "秦漢", "difficulty": 1, "type": "choice", "question": "秦始皇連接、修築長城，主要是為了防禦北方哪一個游牧民族？", "options": ["匈奴", "契丹", "女真", "蒙古"], "answer": 0, "explanation": "秦統一後派蒙恬北擊匈奴，並把戰國時代各國的長城連接修築起來。", "fun_fact": "今天看到的磚砌長城大多是明代重修的，秦代長城多為夯土構築，位置也更偏北。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-086", "topic": "history", "category": "先秦", "difficulty": 2, "type": "choice", "question": "戰國時代商鞅推行變法，使哪一個國家國力大為增強？", "options": ["秦國", "齊國", "趙國", "魏國"], "answer": 0, "explanation": "商鞅在秦孝公支持下兩次變法，獎勵耕戰、推行法治，奠定秦國富強的基礎。", "fun_fact": "「徙木立信」的故事就是商鞅為了讓百姓相信新法會確實執行而設計的。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-087", "topic": "history", "category": "先秦", "difficulty": 2, "type": "choice", "question": "主張「兼愛」「非攻」的先秦思想家是誰？", "options": ["莊子", "韓非", "荀子", "墨子"], "answer": 3, "explanation": "墨子提倡兼愛（平等地愛人）與非攻（反對侵略戰爭），創立墨家學派。", "fun_fact": "墨家弟子擅長守城器械，「墨守成規」的「墨」就是指墨子善於守城。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-088", "topic": "history", "category": "秦漢", "difficulty": 2, "type": "choice", "question": "中國第一部紀傳體通史《史記》的作者是誰？", "options": ["班固", "司馬遷", "司馬光", "陳壽"], "answer": 1, "explanation": "西漢司馬遷著《史記》，記事上起黃帝、下至漢武帝，是第一部紀傳體通史。", "fun_fact": "《漢書》作者是班固，《資治通鑑》作者是司馬光，《三國志》作者是陳壽。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-089", "topic": "history", "category": "魏晉南北朝", "difficulty": 2, "type": "choice", "question": "東晉以少勝多、擊敗前秦苻堅大軍的戰役是？", "options": ["官渡之戰", "昆陽之戰", "淝水之戰", "鉅鹿之戰"], "answer": 2, "explanation": "383年淝水之戰，東晉謝安、謝玄以少數兵力大敗前秦苻堅，保住南方政權。", "fun_fact": "成語「草木皆兵」「風聲鶴唳」都出自苻堅戰敗後潰逃的情景。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-090", "topic": "history", "category": "隋唐", "difficulty": 2, "type": "choice", "question": "貫通南北的大運河，是在哪一位皇帝在位時大規模開鑿？", "options": ["隋文帝", "隋煬帝", "唐太宗", "唐玄宗"], "answer": 1, "explanation": "隋煬帝在位期間徵調大量民力開鑿運河，連通了海河、黃河、淮河與長江流域。", "fun_fact": "大運河便利了南北漕運，但沉重的徭役也是隋朝迅速滅亡的原因之一。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-091", "topic": "history", "category": "宋元", "difficulty": 2, "type": "choice", "question": "北宋滅亡、徽欽二帝被金人擄往北方的事件，史稱什麼？", "options": ["土木之變", "玄武門之變", "陳橋兵變", "靖康之變"], "answer": 3, "explanation": "1127年金軍攻破開封，擄走宋徽宗與宋欽宗，北宋滅亡，史稱靖康之變。", "fun_fact": "岳飛〈滿江紅〉中「靖康恥，猶未雪」說的就是這件事。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-092", "topic": "history", "category": "明清", "difficulty": 2, "type": "choice", "question": "明代在東南沿海率軍抗擊倭寇、戰功卓著的名將是誰？", "options": ["鄭成功", "戚繼光", "袁崇煥", "文天祥"], "answer": 1, "explanation": "戚繼光在浙江、福建一帶練兵抗倭，他所帶的部隊被稱為「戚家軍」。", "fun_fact": "戚繼光創的「鴛鴦陣」讓長槍、盾牌、狼筅等兵器互相掩護，專門剋制倭寇的刀法。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-093", "topic": "history", "category": "近代", "difficulty": 2, "type": "choice", "question": "甲午戰爭清朝戰敗後，與日本簽訂的條約是？", "options": ["辛丑條約", "北京條約", "馬關條約", "璦琿條約"], "answer": 2, "explanation": "1895年清朝與日本簽訂《馬關條約》，割讓台灣、澎湖並賠款兩億兩白銀。", "fun_fact": "條約在日本下關（舊稱馬關）春帆樓簽訂，因此稱為《馬關條約》。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-094", "topic": "history", "category": "近代", "difficulty": 2, "type": "choice", "question": "太平天國的領導者、自稱「天王」的是誰？", "options": ["洪秀全", "李鴻章", "曾國藩", "石達開"], "answer": 0, "explanation": "洪秀全1851年在廣西金田起事，建號太平天國，自稱天王，後來定都南京。", "fun_fact": "太平天國歷時十餘年，最後由曾國藩率領的湘軍攻破南京而結束。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-095", "topic": "history", "category": "明清", "difficulty": 2, "type": "choice", "question": "明代李時珍編成、收錄近兩千種藥物的醫藥學巨著是哪一部？", "options": ["天工開物", "本草綱目", "齊民要術", "夢溪筆談"], "answer": 1, "explanation": "《本草綱目》是李時珍花費約二十七年編成的藥物學著作，明代萬曆年間刊行。", "fun_fact": "《天工開物》是明代宋應星的工藝技術專書，《齊民要術》則是北魏賈思勰的農書。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-096", "topic": "history", "category": "隋唐", "difficulty": 3, "type": "choice", "question": "唐代三省六部制中，負責審核並可以駁回詔令的是哪一省？", "options": ["中書省", "尚書省", "門下省", "御史臺"], "answer": 2, "explanation": "中書省草擬詔令，門下省負責審核封駁，尚書省負責執行，六部隸屬尚書省。", "fun_fact": "門下省若認為詔令不妥可以退回重擬，這種權力稱為「封駁」。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-097", "topic": "history", "category": "魏晉南北朝", "difficulty": 3, "type": "choice", "question": "把無主荒地按戶授給農民耕作的「均田制」，最早由哪個朝代開始推行？", "options": ["北魏", "西晉", "隋朝", "唐朝"], "answer": 0, "explanation": "北魏孝文帝於485年頒布均田令，後來北齊、北周、隋、唐大致沿用這套制度。", "fun_fact": "均田制到唐代中期因人口增加、土地兼併而難以維持，最後被兩稅法取代。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-098", "topic": "history", "category": "宋元", "difficulty": 3, "type": "choice", "question": "推行青苗法、募役法等新法的王安石，是在哪位皇帝支持下變法？", "options": ["宋太祖", "宋真宗", "宋仁宗", "宋神宗"], "answer": 3, "explanation": "王安石在宋神宗熙寧年間主持變法，希望富國強兵、改善財政。", "fun_fact": "新法引發舊黨強烈反對，司馬光就是反對變法最有名的代表人物。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-099", "topic": "history", "category": "近代", "difficulty": 3, "type": "choice", "question": "1898年推動戊戌變法（百日維新）的清朝皇帝是誰？", "options": ["光緒帝", "道光帝", "咸豐帝", "同治帝"], "answer": 0, "explanation": "光緒帝採納康有為、梁啟超的主張推動變法，因慈禧太后發動政變而失敗。", "fun_fact": "變法從頒布詔書到結束只維持了一百多天，所以又稱「百日維新」。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-100", "topic": "history", "category": "先秦", "difficulty": 3, "type": "choice", "question": "戰國時期蘇秦等人主張的「合縱」策略，主要是為了對抗哪一國？", "options": ["秦國", "齊國", "楚國", "趙國"], "answer": 0, "explanation": "合縱是山東六國由北到南聯合起來共同抗秦；秦國則以張儀的「連橫」加以分化。", "fun_fact": "「縱」指南北向的聯合，「橫」指東西向的結盟，成語「合縱連橫」即由此而來。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "history-CN-001", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 1, "type": "choice", "question": "東漢時改良造紙術、用樹皮和破布造紙的是誰？", "options": ["蔡倫", "張仲景", "華佗", "許慎"], "answer": 0, "explanation": "蔡倫是東漢宦官，約在西元 105 年用樹皮、麻頭、破布和魚網造出便宜好用的紙，後世稱「蔡侯紙」。", "fun_fact": "在他之前，官方文書多寫在竹簡或昂貴的絲帛上，一部書可能要用一整車竹簡來載。"}, {"id": "history-CN-002", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 1, "type": "choice", "question": "秦始皇陵的兵馬俑，是在今天哪一個省出土的？", "options": ["河南省", "山西省", "陝西省", "甘肅省"], "answer": 2, "explanation": "兵馬俑坑位於陝西省西安市臨潼區，緊鄰秦始皇陵，1974 年由當地農民打井時意外挖到。", "fun_fact": "考古發現這些陶俑原本都有彩繪，只是顏料接觸空氣後很快剝落。"}, {"id": "history-CN-003", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 1, "type": "choice", "question": "以休養生息、輕徭薄賦著稱的「文景之治」，出現在哪個朝代？", "options": ["秦朝", "漢朝", "唐朝", "南北朝"], "answer": 1, "explanation": "「文景之治」指西漢文帝與景帝在位期間，減輕賦稅徭役、與民休息所形成的治世。", "fun_fact": "這段累積下來的國力，成為後來大規模對外用兵的本錢。"}, {"id": "history-CN-004", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 2, "type": "choice", "question": "戰國時代主持修築都江堰水利工程的蜀郡太守是誰？", "options": ["西門豹", "鄭國", "史祿", "李冰"], "answer": 3, "explanation": "李冰任秦國蜀郡太守時，率眾在岷江上修築都江堰，以無壩引水的方式分洪灌溉。", "fun_fact": "都江堰運作兩千多年到今天仍在灌溉成都平原，已列入世界文化遺產。"}, {"id": "history-CN-005", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 2, "type": "choice", "question": "出土青銅縱目面具的四川三星堆遺址，屬於哪一個古文明？", "options": ["良渚文明", "古蜀文明", "紅山文明", "二里頭文明"], "answer": 1, "explanation": "三星堆位於四川廣漢，年代大致與商代同時，一般認為是古蜀王國留下的遺址。", "fun_fact": "縱目面具的眼球像圓柱一樣往外凸出，造型和中原的青銅器風格差很多。"}, {"id": "history-CN-006", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 2, "type": "choice", "question": "曹操「挾天子以令諸侯」，他挾持的天子是哪位皇帝？", "options": ["漢靈帝", "漢少帝", "漢獻帝", "漢光武帝"], "answer": 2, "explanation": "西元 196 年曹操把漢獻帝迎到許，以皇帝名義發號施令，取得政治上的正當性。", "fun_fact": "漢獻帝退位後被封為山陽公，反而比曹操本人多活了十幾年。"}, {"id": "history-CN-007", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 2, "type": "choice", "question": "北宋編成的編年體通史《資治通鑑》，主編者是誰？", "options": ["歐陽脩", "范仲淹", "蘇軾", "司馬光"], "answer": 3, "explanation": "《資治通鑑》由北宋司馬光主持編纂，歷時十九年完成，按年月順序記事。", "fun_fact": "全書從戰國寫到五代，共 294 卷、約三百萬字，書名是宋神宗取的。"}, {"id": "history-CN-008", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 2, "type": "choice", "question": "唐代六次東渡、把佛教戒律傳入日本的高僧是誰？", "options": ["鑑真", "鳩摩羅什", "法顯", "義淨"], "answer": 0, "explanation": "鑑真前後嘗試六次才成功抵達日本，把律宗戒律制度傳入，後於奈良開創唐招提寺。", "fun_fact": "他在多次失敗的航行途中失明，仍堅持完成最後一次東渡。"}, {"id": "history-CN-009", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 2, "type": "choice", "question": "春秋時代最早稱霸、任用管仲改革的國君是誰？", "options": ["齊桓公", "晉文公", "楚莊王", "吳王闔閭"], "answer": 0, "explanation": "齊桓公重用管仲推行改革，打出「尊王攘夷」旗號會盟諸侯，成為春秋最早的霸主。", "fun_fact": "管仲原本是敵對陣營的人，還曾經射過齊桓公一箭。"}, {"id": "history-CN-010", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 3, "type": "choice", "question": "明成祖朱棣是靠哪一場戰事奪得皇位的？", "options": ["奪門之變", "靖難之役", "土木堡之變", "玄武門之變"], "answer": 1, "explanation": "1399 至 1402 年，燕王朱棣以「靖難」為名起兵，攻入南京推翻建文帝後即位，年號永樂。", "fun_fact": "他即位後把首都從南京遷到北京，今天的紫禁城就是在他任內動工的。"}, {"id": "history-CN-011", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 3, "type": "choice", "question": "清朝與俄國劃定東北邊界的《尼布楚條約》，簽於哪位皇帝在位時？", "options": ["順治帝", "雍正帝", "康熙帝", "乾隆帝"], "answer": 2, "explanation": "《尼布楚條約》簽訂於 1689 年康熙年間，是中國與歐洲國家簽訂的第一個正式邊界條約。", "fun_fact": "條約正本用拉丁文寫成，談判時還請了耶穌會傳教士當翻譯。"}, {"id": "history-CN-012", "topic": "history", "unit": "CN", "unit_name": "中國", "category": "歷史", "region": "中國", "difficulty": 3, "type": "choice", "question": "漢武帝採納主父偃的建議，用哪項政策削弱諸侯王？", "options": ["察舉制", "均輸法", "鹽鐵官營", "推恩令"], "answer": 3, "explanation": "推恩令要求諸侯把封地分給各個兒子，封國越分越小，中央不必動武就削弱了地方勢力。", "fun_fact": "後世常說這是「陽謀」：諸侯明知吃虧，卻很難拒絕分給自家兒子。"}, {"id": "history-EA-001", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "中國史書《魏志倭人傳》記載的倭國女王是誰？", "options": ["推古天皇", "神功皇后", "卑彌呼", "持統天皇"], "answer": 2, "explanation": "《三國志．魏志倭人傳》記載邪馬台國女王卑彌呼曾遣使到魏，是日本最早見於文獻的統治者。", "fun_fact": ""}, {"id": "history-EA-002", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "制定「十七條憲法」、輔佐推古天皇的攝政者是誰？", "options": ["聖德太子", "中大兄皇子", "藤原鎌足", "桓武天皇"], "answer": 0, "explanation": "聖德太子任推古天皇的攝政，推行冠位十二階與十七條憲法，並派遣使節前往隋朝。", "fun_fact": ""}, {"id": "history-EA-003", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "645年大化革新中被打倒的豪族是哪一家？", "options": ["物部氏", "大伴氏", "葛城氏", "蘇我氏"], "answer": 3, "explanation": "中大兄皇子與中臣鎌足在乙巳之變中誅殺蘇我入鹿，終結蘇我氏專權，隨即展開大化革新。", "fun_fact": ""}, {"id": "history-EA-004", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本奈良時代的都城平城京，位於今天的哪座城市？", "options": ["京都", "奈良", "大阪", "名古屋"], "answer": 1, "explanation": "平城京於710年成為都城，格局仿照唐代長安，遺址就在今天的奈良市。", "fun_fact": ""}, {"id": "history-EA-005", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "794年桓武天皇遷都的平安京，就是今天的哪座城市？", "options": ["京都", "鎌倉", "東京", "名古屋"], "answer": 0, "explanation": "桓武天皇把都城遷到平安京，此後一千多年這裡都是天皇所在地，也就是今日的京都。", "fun_fact": ""}, {"id": "history-EA-006", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本在894年決定停止派遣、前往中國的使節團是？", "options": ["遣隋使", "遣明使", "遣唐使", "朱印船隊"], "answer": 2, "explanation": "遣唐使自七世紀起赴唐學習，894年在菅原道真建議下停派，日本文化隨後走向國風化。", "fun_fact": ""}, {"id": "history-EA-007", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "1185年壇之浦之戰後，哪一個家族幾乎被消滅？", "options": ["源氏", "平氏", "北條氏", "藤原氏"], "answer": 1, "explanation": "壇之浦海戰是源平合戰的最後決戰，平氏一族戰敗覆滅，年幼的安德天皇也隨之沉海。", "fun_fact": ""}, {"id": "history-EA-008", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本第一個幕府「鎌倉幕府」的創立者是誰？", "options": ["平清盛", "足利尊氏", "德川家康", "源賴朝"], "answer": 3, "explanation": "源賴朝在源平合戰後掌握實權，於鎌倉開設幕府，開啟武家政權統治日本的時代。", "fun_fact": ""}, {"id": "history-EA-009", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "元軍兩度渡海攻日失敗，日本把摧毀元軍的颱風稱為？", "options": ["黑潮", "季風", "龍捲風", "神風"], "answer": 3, "explanation": "1274與1281年元軍兩次征日，船隊都遇上颱風潰散，日本人視之為神明護佑的「神風」。", "fun_fact": ""}, {"id": "history-EA-010", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "被視為日本戰國時代開端的內亂是哪一場？", "options": ["承久之亂", "應仁之亂", "保元之亂", "治承壽永之亂"], "answer": 1, "explanation": "1467年爆發的應仁之亂打了十年，幕府權威崩壞、各地大名割據，日本進入戰國時代。", "fun_fact": ""}, {"id": "history-EA-011", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "室町幕府的創立者是哪一位？", "options": ["足利尊氏", "足利義滿", "新田義貞", "後醍醐天皇"], "answer": 0, "explanation": "足利尊氏推翻建武新政後在京都開設幕府，因第三代將軍居於室町而稱室町幕府。", "fun_fact": ""}, {"id": "history-EA-012", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "1575年長篠之戰中，織田、德川聯軍大敗哪一家？", "options": ["今川氏", "毛利氏", "武田氏", "長宗我部氏"], "answer": 2, "explanation": "長篠之戰中織田信長大量運用鐵炮，擊潰以騎兵著稱的武田軍，武田家從此一蹶不振。", "fun_fact": ""}, {"id": "history-EA-013", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "1582年本能寺之變中背叛織田信長的家臣是誰？", "options": ["柴田勝家", "明智光秀", "前田利家", "佐久間信盛"], "answer": 1, "explanation": "明智光秀突襲京都本能寺逼死織田信長，十多天後即在山崎之戰中敗亡。", "fun_fact": ""}, {"id": "history-EA-014", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "統一日本後兩度出兵朝鮮的日本統治者是誰？", "options": ["織田信長", "德川家康", "伊達政宗", "豐臣秀吉"], "answer": 3, "explanation": "豐臣秀吉統一日本後，於1592與1597年兩度派兵渡海攻打朝鮮，最後無功而返。", "fun_fact": ""}, {"id": "history-EA-015", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "1600年德川家康獲勝、奠定幕府基礎的戰役是？", "options": ["桶狹間之戰", "川中島之戰", "關原之戰", "大坂夏之陣"], "answer": 2, "explanation": "關原之戰中德川家康率領的東軍擊敗石田三成的西軍，三年後開創
