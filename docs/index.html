ice", "question": "澳洲原住民世界觀中，祖靈創造萬物的概念稱為？", "options": ["大洪水時期", "天狼星之紀", "夢創時代", "漫長黑夜紀"], "answer": 2, "explanation": "夢創時代（The Dreaming）不是一段過去的歷史，而是同時涵蓋過去、現在與未來的秩序。", "fun_fact": ""}, {"id": "human-OTH-052", "topic": "human", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "人文", "region": "中東・非洲・大洋洲", "difficulty": 3, "type": "choice", "question": "澳洲聖地烏魯魯的傳統擁有者是哪一個原住民族群？", "options": ["毛利人", "巴布亞人", "查莫洛人", "阿南古人"], "answer": 3, "explanation": "阿南古人（Aṉangu）視烏魯魯為聖地，園區已與國家共管並列入世界遺產。", "fun_fact": ""}, {"id": "human-OTH-053", "topic": "human", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "人文", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "英文 tattoo（刺青）一詞源自哪個地區的語言？", "options": ["玻里尼西亞", "北歐斯堪地", "東南亞群島", "中南美洲"], "answer": 0, "explanation": "它來自 tatau 一字，隨庫克船長的南太平洋航行被帶回歐洲而成為英文詞彙。", "fun_fact": ""}, {"id": "human-OTH-054", "topic": "human", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "category": "人文", "region": "中東・非洲・大洋洲", "difficulty": 2, "type": "choice", "question": "南太平洋島國在迎賓與儀式場合飲用的傳統飲料是？", "options": ["馬黛茶", "卡瓦酒", "椰花酒", "小米酒"], "answer": 1, "explanation": "卡瓦（kava）以胡椒科植物的根磨碎加水調製，入口令口腔微麻並帶來放鬆感。", "fun_fact": ""}, {"id": "wd-013", "category": "文化", "difficulty": 1, "type": "choice", "question": "奧運五環象徵的是什麼？", "options": ["五種美德", "五種運動", "五大洲的團結", "五個創始國"], "answer": 2, "explanation": "五環代表五大洲的團結與相聚。", "fun_fact": "據創辦人顧拜旦的說法，五環的五種顏色加上白色底，可以組出當時所有參賽國國旗上的顏色。", "topic": "human", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}, {"id": "wd-042", "category": "文化", "difficulty": 1, "type": "choice", "question": "馬拉松全程的標準距離是多少公里？", "options": ["40 公里", "45 公里", "42.195 公里", "50 公里"], "answer": 2, "explanation": "馬拉松全程的標準距離是 42.195 公里。", "fun_fact": "這個有零有整的數字，一般認為來自 1908 年倫敦奧運，為了讓終點落在王室包廂前而定下的路線長度。", "topic": "human", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}, {"id": "wd-047", "category": "文化", "difficulty": 2, "type": "order", "question": "請依「第一次舉辦夏季奧運」的年份先後，排出這四座城市：", "options": ["雪梨", "巴黎", "東京", "首爾"], "answer": [1, 2, 3, 0], "explanation": "巴黎 1900 年 → 東京 1964 年 → 首爾 1988 年 → 雪梨 2000 年。", "fun_fact": "東京原本取得 1940 年奧運的主辦權，後來因為中日戰爭而在 1938 年放棄主辦。", "topic": "human", "unit": "GLOBAL", "unit_name": "全球・跨區", "region": "全球・跨區"}, {"id": "po-001", "category": "接句", "difficulty": 1, "type": "choice", "question": "「床前明月光，疑是地上霜」的下一句是？", "options": ["明月幾時有", "低頭思故鄉", "月落烏啼霜滿天", "舉頭望明月"], "answer": 3, "explanation": "出自李白〈靜夜思〉：床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。", "fun_fact": "這裡的「床」，有學者認為指的是井邊的欄杆。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-002", "category": "接句", "difficulty": 1, "type": "choice", "question": "「白日依山盡，黃河入海流」的下一句是？", "options": ["孤帆遠影碧空盡", "欲窮千里目", "春風不度玉門關", "更上一層樓"], "answer": 1, "explanation": "出自王之渙〈登鸛雀樓〉：欲窮千里目，更上一層樓。", "fun_fact": "鸛雀樓位在今天的山西永濟。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-003", "category": "接句", "difficulty": 1, "type": "choice", "question": "「野火燒不盡」的下一句是？", "options": ["離離原上草", "春風吹又生", "遠芳侵古道", "一歲一枯榮"], "answer": 1, "explanation": "出自白居易〈賦得古原草送別〉。", "fun_fact": "傳說白居易年輕時靠這首詩讓前輩顧況刮目相看。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-004", "category": "作者", "difficulty": 1, "type": "choice", "question": "「春眠不覺曉，處處聞啼鳥」的作者是？", "options": ["杜甫", "孟浩然", "王維", "李白"], "answer": 1, "explanation": "出自孟浩然〈春曉〉。", "fun_fact": "孟浩然是唐代山水田園詩的代表人物之一。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-005", "category": "作者", "difficulty": 1, "type": "choice", "question": "「誰知盤中飧，粒粒皆辛苦」的作者是？", "options": ["李商隱", "白居易", "杜牧", "李紳"], "answer": 3, "explanation": "出自李紳〈憫農〉。", "fun_fact": "「飧」讀作「ㄙㄨㄣ」，指熟食、飯菜。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-006", "category": "作者", "difficulty": 1, "type": "choice", "question": "「慈母手中線，遊子身上衣」出自哪一首詩？", "options": ["靜夜思", "春曉", "遊子吟", "相思"], "answer": 2, "explanation": "出自孟郊〈遊子吟〉。", "fun_fact": "孟郊五十歲才當上小官，這首詩寫於迎接母親同住之時。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-007", "category": "作者", "difficulty": 2, "type": "choice", "question": "被後人稱為「詩聖」的是哪一位詩人？", "options": ["白居易", "杜甫", "李白", "王維"], "answer": 1, "explanation": "杜甫被稱為詩聖，李白是詩仙，王維是詩佛。", "fun_fact": "李賀因為詩風奇詭，被稱為「詩鬼」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-008", "category": "作者", "difficulty": 2, "type": "choice", "question": "「海內存知己，天涯若比鄰」的作者是？", "options": ["王維", "王昌齡", "王之渙", "王勃"], "answer": 3, "explanation": "出自王勃〈送杜少府之任蜀州〉。", "fun_fact": "王勃也寫了名篇〈滕王閣序〉，卻在二十多歲就英年早逝。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-009", "category": "作者", "difficulty": 2, "type": "choice", "question": "「大江東去，浪淘盡，千古風流人物」是誰的詞？", "options": ["柳永", "辛棄疾", "李清照", "蘇軾"], "answer": 3, "explanation": "出自蘇軾〈念奴嬌・赤壁懷古〉。", "fun_fact": "蘇軾也是美食家，「東坡肉」就是以他的名號命名的。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-010", "category": "作者", "difficulty": 3, "type": "choice", "question": "「人生自古誰無死，留取丹心照汗青」的作者是？", "options": ["岳飛", "于謙", "陸游", "文天祥"], "answer": 3, "explanation": "出自南宋文天祥〈過零丁洋〉。", "fun_fact": "「汗青」指史冊，古代在竹簡上寫字前要先烤出水分，好像出汗一樣。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-011", "category": "情境", "difficulty": 1, "type": "choice", "question": "「但願人長久，千里共嬋娟」最常在哪一個節日被引用？", "options": ["中秋節", "清明節", "端午節", "春節"], "answer": 0, "explanation": "出自蘇軾〈水調歌頭〉，寫於中秋，「嬋娟」指月亮。", "fun_fact": "這首詞是蘇軾思念弟弟蘇轍時寫的。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-012", "category": "情境", "difficulty": 2, "type": "choice", "question": "「獨在異鄉為異客，每逢佳節倍思親」寫的是哪個節日？", "options": ["重陽節", "元宵節", "七夕", "中秋節"], "answer": 0, "explanation": "出自王維〈九月九日憶山東兄弟〉，九月九日是重陽節。", "fun_fact": "詩中「遍插茱萸少一人」，插茱萸正是重陽習俗。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-013", "category": "情境", "difficulty": 2, "type": "choice", "question": "杜甫「會當凌絕頂，一覽眾山小」描寫的是哪一座山？", "options": ["廬山", "泰山", "華山", "黃山"], "answer": 1, "explanation": "出自杜甫〈望嶽〉，「嶽」指東嶽泰山。", "fun_fact": "這是杜甫年輕時的作品，充滿壯志。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-014", "category": "情境", "difficulty": 3, "type": "choice", "question": "于謙〈石灰吟〉「粉身碎骨渾不怕，要留清白在人間」歌詠的是什麼？", "options": ["石灰", "玉石", "白雪", "白梅"], "answer": 0, "explanation": "這首詩以石灰自比，表達不怕犧牲、堅守清白的志節。", "fun_fact": "石灰要經過開採、火燒、化成粉，正好對應詩中的過程。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-015", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "《唐詩三百首》是唐朝人編選的。", "options": ["對", "錯"], "answer": 1, "explanation": "《唐詩三百首》是清代的蘅塘退士（孫洙）編選的。", "fun_fact": "書中實際收錄的詩超過三百首。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-016", "category": "冷知識", "difficulty": 2, "type": "order", "question": "請依年代先後排出這些文人：", "options": ["屈原", "陶淵明", "李白", "蘇軾"], "answer": [0, 1, 2, 3], "explanation": "屈原（戰國）→ 陶淵明（東晉）→ 李白（唐）→ 蘇軾（北宋）。", "fun_fact": "陶淵明的「採菊東籬下，悠然見南山」是田園詩的經典。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-017", "category": "接句", "difficulty": 1, "type": "choice", "question": "「兩個黃鸝鳴翠柳」的下一句是？", "options": ["窗含西嶺千秋雪", "門泊東吳萬里船", "一行白鷺上青天", "孤帆遠影碧空盡"], "answer": 2, "explanation": "出自杜甫〈絕句〉：兩個黃鸝鳴翠柳，一行白鷺上青天。窗含西嶺千秋雪，門泊東吳萬里船。", "fun_fact": "這是杜甫住在成都草堂時所寫〈絕句四首〉中的一首。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-018", "category": "接句", "difficulty": 1, "type": "choice", "question": "「紅豆生南國」的下一句是？", "options": ["此物最相思", "春風又綠江南岸", "人面桃花相映紅", "春來發幾枝"], "answer": 3, "explanation": "出自王維〈相思〉：紅豆生南國，春來發幾枝。以紅豆寄託相思之情。（此句以通行本為準，另有版本作「秋來發故枝」。）", "fun_fact": "紅豆又被稱為「相思子」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-019", "category": "接句", "difficulty": 1, "type": "choice", "question": "「少小離家老大回」的下一句是？", "options": ["兒童相見不相識", "近鄉情更怯", "鄉音無改鬢毛衰", "笑問客從何處來"], "answer": 2, "explanation": "出自賀知章〈回鄉偶書〉：少小離家老大回，鄉音無改鬢毛衰。寫久別返鄉的感慨。（此句以通行本為準，「衰」另有版本作「催」。）", "fun_fact": "賀知章八十多歲才辭官回鄉，他也是稱李白為「謫仙人」的人。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-020", "category": "接句", "difficulty": 1, "type": "choice", "question": "「朝辭白帝彩雲間」的下一句是？", "options": ["千里江陵一日還", "煙花三月下揚州", "兩岸猿聲啼不住", "輕舟已過萬重山"], "answer": 0, "explanation": "出自李白〈早發白帝城〉：朝辭白帝彩雲間，千里江陵一日還。寫順江而下的輕快。", "fun_fact": "一般認為此詩寫於李白被流放夜郎途中遇赦東歸之時，難怪心情如此輕快。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-021", "category": "接句", "difficulty": 1, "type": "choice", "question": "「千山鳥飛絕」的下一句是？", "options": ["野渡無人舟自橫", "獨釣寒江雪", "孤舟蓑笠翁", "萬徑人蹤滅"], "answer": 3, "explanation": "出自柳宗元〈江雪〉：千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪。", "fun_fact": "把四句的第一個字連起來，正好是「千萬孤獨」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-022", "category": "接句", "difficulty": 2, "type": "choice", "question": "「在天願作比翼鳥」的下一句是？", "options": ["在地願為連理枝", "七月七日長生殿", "此恨綿綿無絕期", "天長地久有時盡"], "answer": 0, "explanation": "出自白居易〈長恨歌〉，寫唐玄宗與楊貴妃的誓言。", "fun_fact": "傳說比翼鳥只有一隻眼睛、一邊翅膀，必須兩隻並肩才能飛。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-023", "category": "接句", "difficulty": 2, "type": "choice", "question": "「勸君更盡一杯酒」的下一句是？", "options": ["客舍青青柳色新", "西出陽關無故人", "一片冰心在玉壺", "春風不度玉門關"], "answer": 1, "explanation": "出自王維〈送元二使安西〉：勸君更盡一杯酒，西出陽關無故人。是送別詩的經典。", "fun_fact": "這首詩後來被譜成琴曲〈陽關三疊〉，流傳至今。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-024", "category": "接句", "difficulty": 2, "type": "choice", "question": "「姑蘇城外寒山寺」的下一句是？", "options": ["夜半鐘聲到客船", "江楓漁火對愁眠", "煙籠寒水月籠沙", "月落烏啼霜滿天"], "answer": 0, "explanation": "出自張繼〈楓橋夜泊〉：姑蘇城外寒山寺，夜半鐘聲到客船。寫旅人夜泊的愁思。", "fun_fact": "「姑蘇」就是今天的蘇州，寒山寺因這首詩而名揚天下。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-025", "category": "接句", "difficulty": 2, "type": "choice", "question": "「山重水複疑無路」的下一句是？", "options": ["柳暗花明又一村", "衣冠簡樸古風存", "豐年留客足雞豚", "行到水窮處"], "answer": 0, "explanation": "出自陸游〈遊山西村〉：山重水複疑無路，柳暗花明又一村。常用來比喻困境中出現轉機。", "fun_fact": "詩中的「山西村」位在陸游的家鄉浙江紹興一帶，不是山西省。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-026", "category": "接句", "difficulty": 3, "type": "choice", "question": "辛棄疾〈破陣子〉「醉裡挑燈看劍」的下一句是？", "options": ["氣吞萬里如虎", "沙場秋點兵", "可憐白髮生", "夢回吹角連營"], "answer": 3, "explanation": "出自辛棄疾〈破陣子・為陳同甫賦壯詞以寄之〉：醉裡挑燈看劍，夢回吹角連營。抒發報國壯志。", "fun_fact": "詞中「馬作的盧飛快」的「的盧」，正是三國時劉備騎過的名馬。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-027", "category": "接句", "difficulty": 1, "type": "order", "question": "請依正確順序排出李白〈贈汪倫〉的四句：", "options": ["不及汪倫送我情", "桃花潭水深千尺", "忽聞岸上踏歌聲", "李白乘舟將欲行"], "answer": [3, 2, 1, 0], "explanation": "李白〈贈汪倫〉：李白乘舟將欲行，忽聞岸上踏歌聲。桃花潭水深千尺，不及汪倫送我情。", "fun_fact": "桃花潭位在今天的安徽涇縣。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-028", "category": "接句", "difficulty": 3, "type": "order", "question": "請依正確順序排出王翰〈涼州詞〉的四句：", "options": ["欲飲琵琶馬上催", "葡萄美酒夜光杯", "古來征戰幾人回", "醉臥沙場君莫笑"], "answer": [1, 0, 3, 2], "explanation": "王翰〈涼州詞〉：葡萄美酒夜光杯，欲飲琵琶馬上催。醉臥沙場君莫笑，古來征戰幾人回？", "fun_fact": "「涼州詞」其實是曲調名，王之渙也寫過同題的「羌笛何須怨楊柳」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-029", "category": "作者", "difficulty": 1, "type": "choice", "question": "「飛流直下三千尺，疑是銀河落九天」的作者是？", "options": ["李白", "白居易", "杜甫", "王維"], "answer": 0, "explanation": "出自李白〈望廬山瀑布〉，以誇張手法寫瀑布的氣勢。", "fun_fact": "首句「日照香爐生紫煙」的「香爐」，指的是廬山的香爐峰。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-030", "category": "作者", "difficulty": 1, "type": "choice", "question": "「國破山河在，城春草木深」的作者是？", "options": ["杜牧", "李白", "陸游", "杜甫"], "answer": 3, "explanation": "出自杜甫〈春望〉，寫安史之亂時長安殘破的景象。", "fun_fact": "同一首詩的「烽火連三月，家書抵萬金」也是千古名句。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-031", "category": "作者", "difficulty": 1, "type": "choice", "question": "「天生我材必有用，千金散盡還復來」是李白的詩句。", "options": ["對", "錯"], "answer": 0, "explanation": "出自李白〈將進酒〉，展現他豪放自信的個性。", "fun_fact": "「將進酒」的「將」讀作「ㄑㄧㄤ」，是「請」的意思。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-032", "category": "作者", "difficulty": 2, "type": "choice", "question": "「尋尋覓覓，冷冷清清，淒淒慘慘戚戚」是哪位詞人的作品？", "options": ["辛棄疾", "李清照", "蘇軾", "柳永"], "answer": 1, "explanation": "出自李清照〈聲聲慢〉，寫國破家亡、晚年孤苦的愁緒。", "fun_fact": "開頭一口氣連用了十四個疊字，歷來被視為神來之筆。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-033", "category": "作者", "difficulty": 2, "type": "choice", "question": "「但使龍城飛將在，不教胡馬度陰山」的作者是？", "options": ["王之渙", "岑參", "高適", "王昌齡"], "answer": 3, "explanation": "出自王昌齡〈出塞〉，「飛將」一般認為指漢代名將李廣。（「龍城」為通行本寫法，清人閻若璩主張應作「盧城」。）", "fun_fact": "據明代王世貞《藝苑卮言》記載，李攀龍認為唐人絕句應以這首「秦時明月漢時關」為壓卷之作。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-034", "category": "作者", "difficulty": 2, "type": "choice", "question": "「王師北定中原日，家祭無忘告乃翁」的作者是？", "options": ["岳飛", "辛棄疾", "文天祥", "陸游"], "answer": 3, "explanation": "出自陸游〈示兒〉，是他臨終前寫給兒子的詩，至死不忘收復中原。", "fun_fact": "陸游現存詩作九千多首，是存詩最多的古代詩人之一。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-035", "category": "作者", "difficulty": 2, "type": "choice", "question": "「停車坐愛楓林晚，霜葉紅於二月花」出自哪一首詩？", "options": ["山行", "楓橋夜泊", "江雪", "秋夕"], "answer": 0, "explanation": "出自杜牧〈山行〉，描寫秋天山中楓葉比春花還紅豔。", "fun_fact": "句中的「坐」不是坐下，而是「因為」的意思。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-036", "category": "作者", "difficulty": 3, "type": "choice", "question": "「身無彩鳳雙飛翼，心有靈犀一點通」的作者是？", "options": ["李賀", "溫庭筠", "杜牧", "李商隱"], "answer": 3, "explanation": "出自李商隱〈無題〉（昨夜星辰昨夜風），寫戀人心意相通。", "fun_fact": "李商隱寫了許多以〈無題〉為名的詩，詩意隱晦，至今仍眾說紛紜。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-037", "category": "作者", "difficulty": 3, "type": "choice", "question": "「楊柳岸，曉風殘月」出自哪位詞人的作品？", "options": ["柳永", "秦觀", "李清照", "晏殊"], "answer": 0, "explanation": "出自柳永〈雨霖鈴〉：今宵酒醒何處？楊柳岸，曉風殘月。寫離別的淒涼。", "fun_fact": "柳永的詞流行到「凡有井水飲處，即能歌柳詞」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-038", "category": "作者", "difficulty": 3, "type": "choice", "question": "「老驥伏櫪，志在千里」的作者是？", "options": ["劉備", "曹植", "曹操", "諸葛亮"], "answer": 2, "explanation": "出自曹操〈龜雖壽〉：老驥伏櫪，志在千里；烈士暮年，壯心不已。", "fun_fact": "「驥」是千里馬，「櫪」是馬槽，比喻年老仍懷壯志。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-039", "category": "情境", "difficulty": 1, "type": "choice", "question": "王安石〈元日〉「爆竹聲中一歲除，春風送暖入屠蘇」描寫的是哪個節日？", "options": ["清明節", "端午節", "春節", "元宵節"], "answer": 2, "explanation": "「元日」就是農曆正月初一，詩中寫放爆竹、喝屠蘇酒的過年景象。", "fun_fact": "詩末「總把新桃換舊符」的「桃符」，就是春聯的前身。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-040", "category": "情境", "difficulty": 1, "type": "choice", "question": "楊萬里「接天蓮葉無窮碧，映日荷花別樣紅」描寫的是哪個季節？", "options": ["冬天", "春天", "秋天", "夏天"], "answer": 3, "explanation": "出自楊萬里〈曉出淨慈寺送林子方〉，寫農曆六月西湖荷花盛開的景色。", "fun_fact": "前兩句是「畢竟西湖六月中，風光不與四時同」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-041", "category": "情境", "difficulty": 1, "type": "choice", "question": "杜甫「好雨知時節，當春乃發生」描寫的是什麼？", "options": ["秋霜", "夏日雷陣雨", "春雨", "冬雪"], "answer": 2, "explanation": "出自杜甫〈春夜喜雨〉，讚美春雨適時而來、滋潤萬物。", "fun_fact": "同一首詩的「隨風潛入夜，潤物細無聲」也常被用來形容默默付出。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-042", "category": "情境", "difficulty": 2, "type": "choice", "question": "秦觀「金風玉露一相逢，便勝卻人間無數」描寫的是哪個節日？", "options": ["元宵節", "中秋節", "重陽節", "七夕"], "answer": 3, "explanation": "出自秦觀〈鵲橋仙〉，寫牛郎織女七夕相會。", "fun_fact": "同一首詞的結尾「兩情若是久長時，又豈在朝朝暮暮」是著名的愛情名句。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-043", "category": "情境", "difficulty": 2, "type": "choice", "question": "辛棄疾「東風夜放花千樹，更吹落、星如雨」描寫的是哪個節日？", "options": ["元宵節", "中秋節", "春節", "端午節"], "answer": 0, "explanation": "出自辛棄疾〈青玉案・元夕〉，「元夕」就是元宵夜，詞中描寫滿城花燈。", "fun_fact": "同一首詞的「燈火闌珊處」，「闌珊」是燈火稀落的意思。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-044", "category": "情境", "difficulty": 2, "type": "choice", "question": "岑參「北風捲地白草折，胡天八月即飛雪」描寫的是哪種地方？", "options": ["江南水鄉", "東南海濱", "西北邊塞", "京城宮殿"], "answer": 2, "explanation": "出自岑參〈白雪歌送武判官歸京〉，寫邊塞農曆八月就下雪的奇寒。", "fun_fact": "同一首詩「忽如一夜春風來，千樹萬樹梨花開」是把雪比作梨花。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-045", "category": "情境", "difficulty": 2, "type": "choice", "question": "李白〈月下獨酌〉「舉杯邀明月，對影成三人」主要表達什麼心情？", "options": ["戰爭悲憤", "孤獨寂寞", "離別不捨", "思念家鄉"], "answer": 1, "explanation": "前兩句是「花間一壺酒，獨酌無相親」，只能邀月亮和影子作伴，寫出詩人的孤獨。", "fun_fact": "〈月下獨酌〉共有四首，這是其中第一首。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-046", "category": "情境", "difficulty": 3, "type": "choice", "question": "《詩經》〈蒹葭〉「蒹葭蒼蒼，白露為霜」描寫的是哪個季節？", "options": ["秋天", "冬天", "春天", "夏天"], "answer": 0, "explanation": "出自《詩經・秦風・蒹葭》，露水凝結成霜，是深秋景象。", "fun_fact": "「蒹葭」是蘆荻、蘆葦一類的水草。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-047", "category": "冷知識", "difficulty": 3, "type": "choice", "question": "「青蓮居士」是哪一位詩人的別號？", "options": ["杜甫", "白居易", "王維", "李白"], "answer": 3, "explanation": "李白自號青蓮居士，由來有兩說：一說取自佛典中象徵清淨的青蓮花（他曾在詩中自比維摩詰）；另一說與他少年時居住的四川清廉鄉（今江油市青蓮鎮）有關。", "fun_fact": "白居易號香山居士，杜甫自稱少陵野老。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-048", "category": "冷知識", "difficulty": 3, "type": "choice", "question": "成語「青梅竹馬」出自哪一位詩人的作品？", "options": ["白居易", "李白", "王維", "杜甫"], "answer": 1, "explanation": "出自李白〈長干行〉：郎騎竹馬來，遶床弄青梅。形容男女童年時天真的情誼。", "fun_fact": "同一首詩的「同居長干里，兩小無嫌猜」也衍生出成語「兩小無猜」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-049", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "「春蠶到死絲方盡，蠟炬成灰淚始乾」原本是一首歌頌老師無私奉獻的詩。", "options": ["對", "錯"], "answer": 1, "explanation": "出自李商隱〈無題〉（相見時難別亦難），原本是表達堅貞不渝的愛情。", "fun_fact": "後人才借用這兩句來比喻老師的奉獻。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-050", "category": "冷知識", "difficulty": 2, "type": "choice", "question": "宋詞原本是可以配合音樂演唱的歌詞。", "options": ["對", "錯"], "answer": 0, "explanation": "詞起源於隋唐的曲子詞，依曲調填寫，所以作詞又叫「填詞」。", "fun_fact": "〈水調歌頭〉、〈念奴嬌〉這類「詞牌」其實是曲調名，不是題目。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-051", "category": "冷知識", "difficulty": 2, "type": "order", "question": "請依年代先後排出這些文人：", "options": ["馬致遠", "曹植", "辛棄疾", "王昌齡"], "answer": [1, 3, 2, 0], "explanation": "曹植（三國魏）→ 王昌齡（唐）→ 辛棄疾（南宋）→ 馬致遠（元）。", "fun_fact": "馬致遠的〈天淨沙・秋思〉被譽為「秋思之祖」。", "topic": "human", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-052", "topic": "human", "category": "文言文名篇", "difficulty": 1, "type": "choice", "question": "「先天下之憂而憂，後天下之樂而樂」出自哪一篇文章？", "options": ["出師表", "醉翁亭記", "岳陽樓記", "桃花源記"], "answer": 2, "explanation": "出自北宋范仲淹〈岳陽樓記〉，表達士人以天下為己任的胸襟。", "fun_fact": "范仲淹寫這篇文章時人並不在岳陽，是應好友滕子京之請、看著寄來的圖畫寫成的。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-053", "topic": "human", "category": "書法文房", "difficulty": 1, "type": "choice", "question": "傳統所說的「文房四寶」是指哪四樣東西？", "options": ["筆、墨、紙、硯", "琴、棋、書、畫", "詩、書、禮、樂", "梅、蘭、竹、菊"], "answer": 0, "explanation": "文房四寶是書房中最基本的四種用具：毛筆、墨、紙、硯台。", "fun_fact": "文人講究「湖筆、徽墨、宣紙、端硯」，各自來自不同的名產地。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-054", "topic": "human", "category": "傳統節慶", "difficulty": 1, "type": "choice", "question": "端午節吃粽子、划龍舟，最普遍的說法是為了紀念哪一位人物？", "options": ["介之推", "屈原", "伍子胥", "文天祥"], "answer": 1, "explanation": "相傳戰國楚國詩人屈原於農曆五月五日投汨羅江，百姓划船打撈、投粽入江，形成端午習俗。", "fun_fact": "介之推的故事對應的是另一個節日——寒食節。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-055", "topic": "human", "category": "文言文名篇", "difficulty": 1, "type": "choice", "question": "描寫漁人誤入世外桃源的〈桃花源記〉，作者是誰？", "options": ["陶淵明", "王羲之", "柳宗元", "歐陽脩"], "answer": 0, "explanation": "〈桃花源記〉是東晉陶淵明的作品，描繪一個沒有戰亂、與世隔絕的理想社會。", "fun_fact": "「世外桃源」「豁然開朗」這兩個常用詞，都是從這篇文章來的。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-056", "topic": "human", "category": "四書五經", "difficulty": 1, "type": "choice", "question": "「學而時習之，不亦說乎」出自下列哪一部經典？", "options": ["《孟子》", "《大學》", "《論語》", "《中庸》"], "answer": 2, "explanation": "這是《論語・學而》的開篇第一章，記錄孔子的言論。", "fun_fact": "句中的「說」要讀作「ㄩㄝˋ」，同「悅」，是高興的意思。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-057", "topic": "human", "category": "二十四節氣", "difficulty": 1, "type": "choice", "question": "在北半球，一年當中白天最長、黑夜最短的節氣是？", "options": ["冬至", "夏至", "春分", "立夏"], "answer": 1, "explanation": "夏至這天太陽直射北回歸線，北半球白晝最長；冬至則相反，是白晝最短的一天。", "fun_fact": "台灣嘉義、花蓮一帶有北回歸線標誌，夏至正午時分幾乎看不到影子。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-058", "topic": "human", "category": "成語典故", "difficulty": 1, "type": "choice", "question": "成語「破釜沉舟」講的是哪一位人物的故事？", "options": ["韓信", "勾踐", "劉邦", "項羽"], "answer": 3, "explanation": "項羽在鉅鹿之戰渡河後砸破鍋子、鑿沉船隻，斷絕退路以示決一死戰。", "fun_fact": "勾踐的故事對應的是另一個成語「臥薪嘗膽」。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-059", "topic": "human", "category": "文言文名篇", "difficulty": 1, "type": "choice", "question": "「臣本布衣，躬耕於南陽」出自〈出師表〉，這篇文章的作者是？", "options": ["曹操", "周瑜", "司馬懿", "諸葛亮"], "answer": 3, "explanation": "〈出師表〉是諸葛亮北伐前上呈蜀漢後主劉禪的奏章。", "fun_fact": "文中「鞠躬盡瘁」後來與「死而後已」連用，成為形容盡忠職守的成語。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-060", "topic": "human", "category": "文言文名篇", "difficulty": 2, "type": "choice", "question": "「醉翁之意不在酒，在乎山水之間也」出自〈醉翁亭記〉，作者是誰？", "options": ["蘇軾", "王安石", "范仲淹", "歐陽脩"], "answer": 3, "explanation": "〈醉翁亭記〉是歐陽脩貶官滁州時所作，「醉翁」正是他的自號。", "fun_fact": "歐陽脩晚年又自號「六一居士」，指藏書一萬卷、金石一千卷、琴一張、棋一局、酒一壺，加上他自己一個老翁。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-061", "topic": "human", "category": "文言文名篇", "difficulty": 2, "type": "choice", "question": "「山不在高，有仙則名；水不在深，有龍則靈」出自哪一篇？", "options": ["愛蓮說", "陋室銘", "師說", "阿房宮賦"], "answer": 1, "explanation": "出自唐代劉禹錫〈陋室銘〉，全篇藉簡陋居室表明主人品德高潔。", "fun_fact": "文章最後一句「孔子云：何陋之有」，是引用《論語》來收尾。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-062", "topic": "human", "category": "文言文名篇", "difficulty": 2, "type": "choice", "question": "「師者，所以傳道、受業、解惑也」出自〈師說〉，作者是唐宋八大家中的哪一位？", "options": ["柳宗元", "韓愈", "蘇洵", "曾鞏"], "answer": 1, "explanation": "〈師說〉是韓愈為勉勵學生李蟠而作，強調從師問學的重要。", "fun_fact": "文中「弟子不必不如師，師不必賢於弟子」，是很早就出現的教學相長觀念。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-063", "topic": "human", "category": "成語典故", "difficulty": 2, "type": "choice", "question": "農夫守著樹樁等兔子撞上來——成語「守株待兔」的寓言出自哪一部先秦典籍？", "options": ["《莊子》", "《孟子》", "《韓非子》", "《左傳》"], "answer": 2, "explanation": "出自《韓非子・五蠹》，韓非用這個故事諷刺一味守舊、不知變通的人。", "fun_fact": "韓非是法家代表人物，主張治國要因時制宜，不能死守古法。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-064", "topic": "human", "category": "四書五經", "difficulty": 2, "type": "choice", "question": "「四書」除了《論語》和《孟子》，還包括哪兩部？", "options": ["《大學》、《中庸》", "《詩經》、《尚書》", "《荀子》、《墨子》", "《易經》、《春秋》"], "answer": 0, "explanation": "四書指《大學》、《中庸》、《論語》、《孟子》，由南宋朱熹合編並作注。", "fun_fact": "《大學》和《中庸》原本是《禮記》中的兩篇，被朱熹抽出來單獨成書。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-065", "topic": "human", "category": "二十四節氣", "difficulty": 2, "type": "choice", "question": "二十四節氣中，緊接在「清明」之後的節氣是？", "options": ["立夏", "小滿", "穀雨", "芒種"], "answer": 2, "explanation": "春季六個節氣依序是立春、雨水、驚蟄、春分、清明、穀雨，穀雨之後才進入立夏。", "fun_fact": "「穀雨」得名於此時雨水增多、有利穀物生長，台灣茶農也講究採「雨前茶」。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-066", "topic": "human", "category": "對聯常識", "difficulty": 2, "type": "choice", "question": "依傳統貼春聯的方式，面對大門時，上聯應該貼在哪裡？", "options": ["面對大門的右邊", "面對大門的左邊", "門楣的正中央", "門框的最下方"], "answer": 0, "explanation": "傳統橫批由右至左書寫，因此上聯貼在面對大門的右手邊，下聯在左。（若橫批改為由左至右書寫，則左右相反。）", "fun_fact": "分辨上下聯還有一個訣竅：上聯最後一字多為仄聲，下聯最後一字多為平聲。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-067", "topic": "human", "category": "書法文房", "difficulty": 2, "type": "choice", "question": "被譽為「天下第一行書」的〈蘭亭集序〉，出自哪位書法家之手？", "options": ["顏真卿", "王羲之", "柳公權", "歐陽詢"], "answer": 1, "explanation": "〈蘭亭集序〉是東晉王羲之所書，他也被後世尊稱為「書聖」。", "fun_fact": "相傳〈蘭亭集序〉的真跡被唐太宗帶進了陵墓，今天看到的都是摹本。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-068", "topic": "human", "category": "元曲戲劇", "difficulty": 2, "type": "choice", "question": "元代雜劇名作《竇娥冤》的作者是誰？", "options": ["王實甫", "白樸", "馬致遠", "關漢卿"], "answer": 3, "explanation": "《竇娥冤》是關漢卿的代表作，寫竇娥蒙冤受刑、血濺白練、六月飛雪的故事。", "fun_fact": "俗語「六月雪」用來形容天大的冤情，典故正是出自這齣戲。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-069", "topic": "human", "category": "諸子百家", "difficulty": 2, "type": "choice", "question": "主張「兼愛」、「非攻」，反對厚葬與奢侈的是先秦哪一家？", "options": ["儒家", "道家", "法家", "墨家"], "answer": 3, "explanation": "墨子創立墨家，主張不分親疏地愛人（兼愛）、反對侵略戰爭（非攻），並提倡節用節葬。", "fun_fact": "「墨守成規」原本是稱讚墨家守城技術高明，後來詞義才轉為貶義。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-070", "topic": "human", "category": "文言文名篇", "difficulty": 3, "type": "choice", "question": "「寄蜉蝣於天地，渺滄海之一粟」出自哪一篇文章？", "options": ["赤壁賦", "岳陽樓記", "滕王閣序", "阿房宮賦"], "answer": 0, "explanation": "出自蘇軾〈前赤壁賦〉，以蜉蝣、米粒形容人在天地間的渺小短暫。", "fun_fact": "蘇軾遊的黃州赤壁（赤鼻磯），其實與三國赤壁之戰的戰場並非同一處。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-071", "topic": "human", "category": "成語典故", "difficulty": 3, "type": "choice", "question": "成語「洛陽紙貴」是因為哪一部作品太受歡迎、大家爭相抄寫？", "options": ["左思〈三都賦〉", "曹植〈洛神賦〉", "班固〈兩都賦〉", "張衡〈二京賦〉"], "answer": 0, "explanation": "據《晉書・左思傳》，左思〈三都賦〉問世後豪門競相傳抄，使得洛陽的紙價因此上漲。", "fun_fact": "左思為了寫〈三都賦〉構思了十年，據說家中處處放著紙筆，想到一句就馬上記下來。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-072", "topic": "human", "category": "文人軼事", "difficulty": 3, "type": "choice", "question": "為了「僧敲月下門」該用「推」還是「敲」而反覆斟酌，留下「推敲」典故的詩人是？", "options": ["孟郊", "賈島", "李賀", "盧仝"], "answer": 1, "explanation": "相傳賈島騎驢苦思用字，衝撞了韓愈的儀仗，韓愈建議用「敲」字，後人便以「推敲」比喻斟酌字句。", "fun_fact": "賈島與孟郊詩風都清冷瘦硬，蘇軾因此有「郊寒島瘦」的評語。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-073", "topic": "human", "category": "諸子百家", "difficulty": 3, "type": "choice", "question": "與孟子「性善說」針鋒相對，主張「人之性惡」的先秦儒家思想家是？", "options": ["墨子", "莊子", "荀子", "董仲舒"], "answer": 2, "explanation": "荀子在〈性惡〉篇主張人性本惡，必須靠後天的禮義教化與學習來矯正。", "fun_fact": "「青出於藍而勝於藍」就出自荀子〈勸學〉，正好呼應他重視學習的立場。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-074", "topic": "human", "category": "二十四節氣", "difficulty": 3, "type": "choice", "question": "二十四節氣是依據什麼來劃分的？", "options": ["月亮的圓缺週期", "北斗七星的方位", "太陽的週年位置", "海水潮汐的漲落"], "answer": 2, "explanation": "節氣是依太陽在黃道上的位置（每十五度一個節氣）劃分，屬於陽曆的性質，所以對應的國曆日期每年幾乎固定。", "fun_fact": "清明大多落在國曆四月四日或五日，冬至多在十二月二十一至二十三日之間，就是這個道理。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}, {"id": "po-075", "topic": "human", "category": "書法文房", "difficulty": 3, "type": "choice", "question": "書畫家愛用、以耐久不蛀著稱的「宣紙」，原產地在哪一省？", "options": ["浙江", "江蘇", "湖南", "安徽"], "answer": 3, "explanation": "宣紙因產於唐代宣州（今安徽宣城一帶，以涇縣最著名）而得名。", "fun_fact": "宣紙有「紙壽千年」之稱，主要原料是青檀樹皮與稻草。", "unit": "POEM", "unit_name": "古典詩詞", "region": "古典詩詞"}], "tech": [{"id": "tc-001", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "電腦突然斷電時，下列哪一個地方還沒存檔的資料會直接消失？", "options": ["SSD 固態硬碟", "RAM（主記憶體）", "傳統機械硬碟", "USB 隨身碟"], "answer": 1, "explanation": "RAM 是「揮發性記憶體」，必須持續供電才能保住資料；硬碟與隨身碟則是非揮發性的，斷電後資料仍在。", "fun_fact": "所以打報告打到一半跳電會欲哭無淚——因為內容還躺在 RAM 裡，沒被寫進硬碟。", "region": "科技"}, {"id": "tc-002", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "電腦世界裡，1 個位元組（byte）等於幾個位元（bit）？", "options": ["4 個", "1024 個", "16 個", "8 個"], "answer": 3, "explanation": "1 byte = 8 bit。位元是 0 與 1 的最小單位，8 個位元組成一個位元組，剛好可以表示 0 到 255 共 256 種數值。", "fun_fact": "網路速度常寫成「100 Mbps」，那個小寫 b 是 bit 不是 byte，所以實際下載速度大約只有 12.5 MB/s。", "region": "科技"}, {"id": "tc-003", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "下列哪一個「不是」作業系統？", "options": ["Adobe Photoshop", "Ubuntu", "Android", "macOS"], "answer": 0, "explanation": "Photoshop 是跑在作業系統上的應用軟體；macOS、Android、Ubuntu 都是作業系統。", "fun_fact": "作業系統的工作是管理硬體與分配資源，就像餐廳的內場經理，應用軟體則是客人點的菜。", "region": "科技"}, {"id": "tc-004", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "網域名稱結尾是「.edu.tw」，通常代表這是什麼單位的網站？", "options": ["台灣的公司行號", "台灣的教育機構（學校）", "台灣的政府機關", "台灣的民間社團組織"], "answer": 1, "explanation": "在台灣的網域分類中，.edu.tw 給教育機構、.gov.tw 給政府機關、.com.tw 給公司、.org.tw 給民間組織。", "fun_fact": "最後的 .tw 叫「國碼頂級網域」，是依國際標準分配給台灣的代碼。", "region": "科技"}, {"id": "tc-005", "topic": "tech", "category": "電腦", "difficulty": 1, "type": "choice", "question": "把照片上傳到「雲端硬碟」之後，檔案實際上存放在哪裡？", "options": ["漂浮在大氣層的資料衛星上", "網際網路路由器的暫存空間", "你手機裡的一塊隱藏分割區", "服務業者資料中心裡的實體伺服器硬碟"], "answer": 3, "explanation": "所謂「雲端」其實就是別人家的電腦——業者蓋在世界各地的資料中心，裡面滿滿都是實體伺服器和硬碟。", "fun_fact": "資料中心最大的開銷之一是冷氣，有些業者乾脆把機房蓋在北歐，或直接沉到海底散熱。", "region": "科技"}, {"id": "tc-006", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "二進位的「1011」換算成十進位是多少？", "options": ["13", "11", "15", "9"], "answer": 1, "explanation": "由右至左各位數代表 1、2、4、8：1011 = 8 + 0 + 2 + 1 = 11。", "fun_fact": "工程師的冷笑話：「世界上有 10 種人，懂二進位的和不懂的。」這裡的 10 就是二進位的 2。", "region": "科技"}, {"id": "tc-007", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "下列哪一種常見圖片格式屬於「有失真壓縮」，每重新存檔一次畫質就會再差一點？", "options": ["BMP", "GIF", "JPEG", "PNG"], "answer": 2, "explanation": "JPEG 靠丟掉人眼較不敏感的細節來縮小檔案，屬於有失真壓縮；PNG 與 GIF 是無失真壓縮，BMP 則幾乎不壓縮。", "fun_fact": "網路迷因圖之所以糊到像被洗過，就是因為被反覆下載、截圖、再存成 JPEG，俗稱「JPEG 化」。", "region": "科技"}, {"id": "tc-008", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "家裡的 Wi-Fi 路由器常配給手機、筆電像「192.168.0.5」這樣的位址，這類位址稱為什麼？", "options": ["DNS 位址", "私有 IP 位址", "公有 IP 位址", "MAC 位址"], "answer": 1, "explanation": "192.168 開頭的位址是保留給區域網路使用的私有 IP，只在你家網路內有效，外面的人無法直接連到它。", "fun_fact": "全家的裝置對外其實共用同一個公有 IP，由路由器負責轉換，這個機制叫 NAT（網路位址轉譯）。", "region": "科技"}, {"id": "tc-009", "topic": "tech", "category": "電腦", "difficulty": 2, "type": "choice", "question": "「Wi-Fi」這個名字是「Wireless Fidelity（無線保真）」的英文縮寫。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！Wi-Fi 純粹是 Wi-Fi 聯盟找品牌顧問公司 Interbrand 想出來的商標名稱，本身不代表任何字。當年是為了取代拗口的技術規格名「IEEE 802.11b Direct Sequence」。", "fun_fact": "聯盟創始成員 Belanger 說，「Wireless Fidelity」是同事事後硬加上去的標語，因為大家不好意思承認這名字根本沒有意思——他形容那是個「錯誤」。", "source": "https://www.techradar.com/news/we-finally-know-what-wi-fi-stands-for-and-its-not-what-you-think", "region": "科技"}, {"id": "tc-010", "topic": "tech", "category": "電腦", "difficulty": 3, "type": "choice", "question": "無線傳輸技術「Bluetooth（藍牙）」這個名字是怎麼來的？", "options": ["取自十世紀統一丹麥與挪威的國王 Harald「藍牙」Gormsson", "因為發明人的女兒小名叫 Blue", "因為訊號在示波器上會顯示成藍色鋸齒波", "因為早期的藍牙晶片外殼一律漆成藍色"], "answer": 0, "explanation": "1990 年代 Intel、Ericsson 與 Nokia 合作制定這套規格時，借用了維京國王 Harald Bluetooth 的名號——他統一了丹麥與挪威，象徵把各家不同的裝置「統一」起來。", "fun_fact": "藍牙的圖示其實是北歐符文 ᚼ（H）和 ᛒ（B）疊在一起，正是 Harald Bluetooth 的姓名縮寫；「藍牙」的綽號則來自他那顆變成深藍灰色的死牙。", "source": "https://www.bluetooth.com/about-us/bluetooth-origin/", "region": "科技"}, {"id": "tc-011", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "二戰期間在英國布萊切利園帶領團隊破解德軍 Enigma 密碼機、被譽為「電腦科學之父」的數學家是誰？", "options": ["克勞德·夏農（Claude Shannon）", "諾伯特·維納（Norbert Wiener）", "艾倫·圖靈（Alan Turing）", "查爾斯·巴貝奇（Charles Babbage）"], "answer": 2, "explanation": "圖靈設計的解密機器大幅加快 Enigma 的破譯速度，一般認為讓二戰提早結束；他也提出了「圖靈機」這個計算理論的基礎模型。", "fun_fact": "他在 1950 年提出著名的「圖靈測試」：如果人類在純文字對話中分不出對方是人還是機器，那就可以說這台機器「會思考」。", "region": "科技"}, {"id": "tc-012", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "現代電腦「把程式和資料一起放在同一個記憶體裡」的基本設計，一般稱為什麼架構？", "options": ["巴貝奇架構", "圖靈架構", "馮紐曼架構", "香農架構"], "answer": 2, "explanation": "馮紐曼（John von Neumann）提出的「儲存程式」概念，讓電腦不必重接線路就能換工作，只要載入不同程式即可，這是通用電腦的關鍵。", "fun_fact": "因為 CPU 讀指令和讀資料要共用同一條通道，速度容易卡住，這個先天限制被戲稱為「馮紐曼瓶頸」。", "region": "科技"}, {"id": "tc-013", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1946 年公開亮相、一般被視為第一部通用電子數位計算機的機器是？", "options": ["IBM PC", "Apple I", "ENIAC", "Altair 8800"], "answer": 2, "explanation": "ENIAC 由賓州大學建造，用了約 1.8 萬支真空管，重達 27 公噸，佔滿整個房間。Apple I（1976）、Altair 8800（1975）、IBM PC（1981）都晚了三十年以上。", "fun_fact": "ENIAC 最早的六位程式設計師全是女性數學家，但當年的宣傳照片幾乎不提她們的名字，直到近幾十年才被重新肯定。", "region": "科技"}, {"id": "tc-014", "topic": "tech", "category": "歷史", "difficulty": 1, "type": "choice", "question": "1991 年寫出 Linux 作業系統核心、當時還是芬蘭赫爾辛基大學學生的人是誰？", "options": ["Richard Stallman", "Linus Torvalds", "Steve Wozniak", "Bill Gates"], "answer": 1, "explanation": "Torvalds 在 1991 年 8 月把作品貼上 Usenet 新聞群組，謙虛地說這「只是個興趣，不會像 GNU 那樣又大又專業」。", "fun_fact": "結果這個「興趣」如今跑在絕大多數的雲端伺服器、所有 Android 手機和超級電腦上；吉祥物企鵝 Tux 的靈感據說來自他被企鵝咬了一口。", "region": "科技"}, {"id": "tc-015", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "choice", "question": "1964 年在 SRI 誕生的第一個滑鼠原型，外殼是用什麼材質做的？", "options": ["木頭（紅木）", "鋁合金", "玻璃", "陶瓷"], "answer": 0, "explanation": "由 Douglas Engelbart 構想、工程師 Bill English 打造的第一個滑鼠，外殼是 SRI 機工房用紅木削出來的，底下只有兩個互相垂直的滾輪。", "fun_fact": "據 Engelbart 回憶，因為電線從尾端拉出來像老鼠尾巴，大家就順口叫它 mouse，至於是誰先這樣叫的，已經沒人記得了。", "source": "https://computerhistory.org/sri-mouse-mn052024/", "region": "科技"}, {"id": "tc-016", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "choice", "question": "1971 年 Ray Tomlinson 送出第一封跨電腦的網路電子郵件，他選用的「@」符號是用來做什麼的？", "options": ["標示信件已經加密", "表示這封信是緊急信件", "分隔使用者名稱與他所在的電腦主機", "代表寄件時間的時區"], "answer": 2, "explanation": "Tomlinson 需要一個絕對不會出現在人名裡的符號，來寫出「使用者@主機」這種位址格式，鍵盤上的 @ 剛好符合，這個寫法就沿用至今。", "fun_fact": "@ 在各國有各種可愛綽號：義大利叫「蝸牛」、荷蘭叫「猴子尾巴」、丹麥叫「大象鼻子」、希臘叫「小鴨子」。", "source": "https://www.internethalloffame.org/official-biography-raymond-tomlinson/", "region": "科技"}, {"id": "tc-017", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "choice", "question": "全球資訊網（World Wide Web）是 Tim Berners-Lee 在 1989 年於哪個機構工作時提出的構想？", "options": ["美國國防部先進研究計畫署（DARPA）", "美國國家航空暨太空總署（NASA）", "美國麻省理工學院（MIT）", "歐洲核子研究組織（CERN）"], "answer": 3, "explanation": "Berners-Lee 當時在 CERN 服務，為了解決各國研究人員之間資料難以共享的問題，提出用超連結串起文件的構想，並寫出 HTML、HTTP 與第一個瀏覽器。", "fun_fact": "1993 年 CERN 宣布放棄全球資訊網的所有權利、讓它永久免費公開，這個決定被認為是網路得以爆炸成長的關鍵。", "region": "科技"}, {"id": "tc-018", "topic": "tech", "category": "歷史", "difficulty": 2, "type": "order", "question": "請把下列資訊科技的里程碑依發生時間先後排列：", "options": ["全球資訊網構想提出", "第一個滑鼠原型問世", "第一封跨電腦的網路電子郵件", "ENIAC 公開亮相"], "answer": [3, 1, 2, 0], "explanation": "ENIAC 公開（1946）→ 第一個滑鼠原型（1964）→ 第一封網路電子郵件（1971）→ 全球資訊網構想提出（1989）。", "fun_fact": "從佔滿一整個房間的 ENIAC 到全球資訊網，中間只隔了 43 年，比很多人的爸媽還年輕。", "region": "科技"}, {"id": "tc-019", "topic": "tech", "category": "歷史", "difficulty": 3, "type": "choice", "question": "自由軟體的 GPL 授權有個核心規定叫「copyleft」，它的意思是什麼？", "options": ["修改之後必須把著作權轉讓給自由軟體基金會", "你可以自由修改、散布，但散布出去的版本也必須用同樣的開源授權", "程式碼只能自己用，完全不得用於商業用途", "所有使用者都必須付一筆授權費給原作者"], "answer": 1, "explanation": "copyleft 是把著作權「反過來用」：不是拿來禁止散布，而是用來保證自由不會在下一手被收回，所以衍生作品也得繼續開源。", "fun_fact": "copyleft 這個字是對 copyright 的雙關玩笑，連符號都把 © 左右翻轉寫成 ↄ。GPL 完全允許商業使用，Linux 就是靠它養活了一整個產業。", "region": "科技"}, {"id": "tc-020", "topic": "tech", "category": "歷史", "difficulty": 3, "type": "choice", "question": "蘋果公司（Apple）最早其實有三位共同創辦人，其中一位在公司成立後不到兩週就賣掉自己的股份離開了。", "options": ["對", "錯"], "answer": 0, "explanation": "真的！1976 年蘋果由 Steve Jobs、Steve Wozniak 和 Ronald Wayne 三人創立，Wayne 持有一成股份，但擔心要承擔公司債務的風險，不到兩週就以 800 美元把股份賣回給另外兩人。", "fun_fact": "Wayne 本人多次公開表示不後悔，說自己當年做的是「當下最合理的決定」，而且他也畫了蘋果最早那個牛頓坐在蘋果樹下的公司標誌。", "source": "https://www.cnbc.com/2018/08/02/why-ronald-wayne-sold-his-10-percent-stake-in-apple-for-800-dollars.html", "region": "科技"}, {"id": "tc-021", "topic": "tech", "category": "軟體", "difficulty": 1, "type": "choice", "question": "程式語言 Python 的名字是從哪裡來的？", "options": ["創造者養的一條寵物蛇", "英國喜劇團體「Monty Python（蒙提·派森）」", "蟒蛇，因為程式碼像蛇一樣蜿蜒", "希臘神話中被阿波羅殺死的巨蟒"], "answer": 1, "explanation": "根據 Python 官方文件，作者 Guido van Rossum 動手開發時正在讀 BBC 喜劇《Monty Python's Flying Circus》的劇本，他想要一個「簡短、獨特、又有點神祕」的名字，就這麼定了。", "fun_fact": "官方 FAQ 還俏皮地問：「我一定要喜歡 Monty Python 嗎？」答案是：「不用，但會有幫助。:)」", "source": "https://docs.python.org/3/faq/general.html", "region": "科技"}, {"id": "tc-022", "topic": "tech", "category": "軟體", "difficulty": 1, "type": "choice", "question": "程式設計師常用的工具「Git」主要是拿來做什麼的？", "options": ["把原始碼翻譯成機器碼的編譯器", "把檔案壓縮成更小的壓縮檔", "版本控制：記錄程式碼每次修改，隨時能回到舊版本", "掃描並清除程式裡的電腦病毒"], "answer": 2, "explanation": "Git 是分散式版本控制系統，會記錄每一次修改是誰、什麼時候、改了哪幾行，讓多人協作不會互相覆蓋，出錯還能回溯。", "fun_fact": "Git 是 Linux 之父 Linus Torvalds 在 2005 年親手打造的，因為他原本用的版本控制工具突然不給 Linux 社群免費使用了——短短幾天內他就做出了第一個能用的版本。", "region": "科技"}, {"id": "tc-023", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "「JavaScript」和「Java」這兩個語言是什麼關係？", "options": ["兩者是各自獨立的語言，當年取這個名字主要是為了搭 Java 的熱潮", "JavaScript 是 Java 的簡化版，語法完全相容", "JavaScript 是 Java 專門用在網頁上的官方版本", "JavaScript 是後來才推出的 Java 第二代"], "answer": 0, "explanation": "JavaScript 由 Netscape 在 1995 年推出，原本叫 LiveScript，因為當時 Java 正紅，行銷考量才改成 JavaScript，兩者的設計與用途其實大不相同。", "fun_fact": "程式圈有個經典比喻：Java 和 JavaScript 的關係，就像「車」和「車厘子」——名字很像，完全兩回事。", "region": "科技"}, {"id": "tc-024", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "「編譯式語言」和「直譯式語言」最主要的差別是什麼？", "options": ["直譯式語言寫出來的程式一定比較安全，不會有漏洞", "編譯式先把整份原始碼翻成機器碼再執行；直譯式則是執行時一行一行邊翻譯邊跑", "編譯式語言只能在 Windows 執行，直譯式語言只能在 Linux 執行", "編譯式語言不必寫原始碼，畫流程圖就能直接產生程式"], "answer": 1, "explanation": "編譯（如 C、Go）先整份翻譯、產生執行檔，跑起來通常比較快；直譯（如 Python）邊翻邊跑，改完馬上能測試，開發比較靈活。", "fun_fact": "現在界線已經模糊：Java 先編譯成中介的位元組碼再由虛擬機執行，很多直譯器也會用 JIT 在執行中即時編譯熱點程式碼。", "region": "科技"}, {"id": "tc-025", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "Git 和 GitHub 其實是同一個東西，一定要註冊 GitHub 帳號才能使用 Git。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！Git 是安裝在自己電腦上的版本控制工具，完全離線也能用；GitHub 只是一家提供 Git 遠端代管服務的網站，同類型的還有 GitLab、Bitbucket 等。", "fun_fact": "GitHub 的吉祥物是一隻章魚貓「Octocat」，牠有貓的臉配上章魚的觸手，已經衍生出上百種造型。", "region": "科技"}, {"id": "tc-026", "topic": "tech", "category": "軟體", "difficulty": 2, "type": "choice", "question": "1947 年哈佛 Mark II 電腦故障，工程師在繼電器裡找到一隻昆蟲，把牠貼進日誌本並寫下「第一次真正抓到 bug」。那是什麼昆蟲？", "options": ["蟑螂", "螞蟻", "飛蛾", "獨角仙"], "answer": 2, "explanation": "那是一隻卡在繼電器裡的飛蛾。要注意的是，工程師早在 1870 年代（愛迪生的年代）就用 bug 形容機器的小毛病，所以這次不是「發明」這個字，而是第一次真的抓到一隻蟲。", "fun_fact": "那本日誌連同那隻飛蛾至今收藏在美國史密森尼國家美國歷史博物館；當年 Mark II 團隊中的 Grace Hopper 很愛講這個故事，讓它變得家喻戶曉。", "source": "https://americanhistory.si.edu/collections/object/nmah_334663", "region": "科技"}, {"id": "tc-027", "topic": "tech", "category": "軟體", "difficulty": 3, "type": "choice", "question": "同樣是開源授權，下列哪一種最寬鬆——只要保留原作者的版權宣告，就能拿去修改成閉源的商業產品？", "options": ["CC BY-SA 授權", "GPL 授權", "AGPL 授權", "MIT 授權"], "answer": 3, "explanation": "MIT 屬於「寬鬆式（permissive）」授權，幾乎只要求保留版權與免責聲明；GPL 與 AGPL 都是 copyleft，衍生作品必須繼續開源，CC BY-SA 也要求「相同方式分享」。", "fun_fact": "正因為限制少，MIT 是 GitHub 上最常見的授權之一，React、Vue、jQuery 等知名專案都採用它。", "region": "科技"}, {"id": "tc-028", "topic": "tech", "category": "軟體", "difficulty": 3, "type": "choice", "question": "下列四個程式語言，哪一個誕生得最早？", "options": ["Fortran", "Python", "C", "Java"], "answer": 0, "explanation": "Fortran 誕生於 1950 年代（1957 年釋出第一版編譯器），C 是 1970 年代初，Python 於 1991 年公開，Java 則是 1995 年。", "fun_fact": "Fortran 專為科學與工程運算而生，將近七十年後的今天，許多氣象預報與物理模擬的核心程式仍然是 Fortran 寫的。", "region": "科技"}, {"id": "tc-029", "topic": "tech", "category": "AI", "difficulty": 1, "type": "choice", "question": "深度學習是機器學習的一種，而機器學習又是人工智慧底下的一個分支。", "options": ["對", "錯"], "answer": 0, "explanation": "真的！三者是層層包含的關係：人工智慧範圍最大，機器學習是其中「讓機器從資料中自己學規則」的做法，深度學習則是機器學習裡使用多層類神經網路的分支。", "fun_fact": "早期的人工智慧多半是人工寫死的規則（專家系統），跟「從資料學習」完全是兩條路線。", "region": "科技"}, {"id": "tc-030", "topic": "tech", "category": "AI", "difficulty": 1, "type": "choice", "question": "1997 年擊敗西洋棋世界冠軍卡斯帕洛夫的 IBM 超級電腦，名字叫什麼？", "options": ["大藍（Big Blue）", "藍色基因（Blue Gene）", "華生（Watson）", "深藍（Deep Blue）"], "answer": 3, "explanation": "深藍在 1997 年的六局對戰中以 3.5 比 2.5 擊敗世界冠軍卡斯帕洛夫，是電腦首次在正式比賽中擊敗在位的西洋棋世界冠軍。", "fun_fact": "深藍靠的是超高速搜尋與人工調校的評估函式，和今天從資料自己學棋的 AI 是完全不同的思路。", "region": "科技"}, {"id": "tc-031", "topic": "tech", "category": "AI", "difficulty": 1, "type": "choice", "question": "2016 年 AlphaGo 以 4 比 1 擊敗南韓棋王李世乭，他們下的是什麼棋？", "options": ["日本將棋", "象棋", "圍棋", "西洋棋"], "answer": 2, "explanation": "AlphaGo 由 DeepMind 開發，2016 年 3 月在首爾擊敗世界頂尖棋士李世乭。圍棋的變化數量遠超過西洋棋，過去被認為電腦還要很多年才能攻克。", "fun_fact": "第二局那手「第 37 手」當下被解說員認為是失誤，事後卻證明是妙手，讓不少職業棋士開始重新研究圍棋的定石。", "region": "科技"}, {"id": "tc-032", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "訓練一個類神經網路時，電腦實際上是在反覆調整什麼？", "options": ["程式碼的行數與註解內容", "訓練圖片的解析度與色彩飽和度", "CPU 的時脈與散熱風扇的轉速", "神經元之間連結的「權重」，也就是模型的參數"], "answer": 3, "explanation": "訓練就是不斷比對模型的輸出和正確答案，再依誤差微調每條連結的權重，讓下一次猜得更準，這個調整過程的核心演算法叫反向傳播。", "fun_fact": "所謂「模型有多少參數」，指的就是這些權重的數量；模型檔案本質上是一大包數字，沒有任何一行寫著「這是貓」。", "region": "科技"}, {"id": "tc-033", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "模型訓練完成後，拿它來回答問題、產生結果的這個階段，在 AI 領域稱為什麼？", "options": ["推論（inference）", "除錯（debugging）", "編譯（compile）", "訓練（training）"], "answer": 0, "explanation": "訓練是「學」，推論是「用」。訓練通常要大量運算資源、跑上數週；推論則是每次使用時即時執行，成本低得多。", "fun_fact": "這也是為什麼 AI 服務的費用多半是按使用量計價——你付的是推論的錢，訓練的成本早就先被業者付掉了。", "region": "科技"}, {"id": "tc-034", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "機器學習裡說的「過擬合（overfitting）」是指什麼情況？", "options": ["訓練時間太長，導致電腦過熱當機", "模型的參數數量少於訓練資料的筆數", "模型把訓練資料學得太細，連雜訊都背下來，遇到沒看過的新資料反而表現變差", "模型檔案太大，硬碟空間不夠存放"], "answer": 2, "explanation": "過擬合就像學生只把考古題答案背起來，模擬考滿分，正式考換個題型就崩潰——模型記住了訓練集，卻沒學到可以推廣的規律。", "fun_fact": "對付過擬合的常見招數包括增加資料量、提早停止訓練，以及訓練時故意隨機「關掉」部分神經元的 dropout。", "region": "科技"}, {"id": "tc-035", "topic": "tech", "category": "AI", "difficulty": 2, "type": "choice", "question": "大型語言模型處理文字時，會先把句子切成一個個基本單位再計算。這個單位叫什麼？", "options": ["vector（向量）", "token（詞元）", "frame（影格）", "pixel（像素）"], "answer": 1, "explanation": "模型不是逐字也不是逐詞處理，而是切成 token——可能是一個完整的字、一個詞、或是單字的一小段，再轉換成數字送進模型。", "fun_fact": "英文大約 4 個字元算一個 token，中文則常常一個字就佔一到兩個 token，所以同樣的內容用中文寫，token 數往往比英文多。", "region": "科技"}, {"id": "tc-036", "topic": "tech", "category": "AI", "difficulty": 3, "type": "choice", "question": "2017 年一篇名為〈Attention Is All You Need〉的論文提出了什麼模型架構，成為今天大型語言模型共同的基礎？", "options": ["卷積神經網路（CNN）", "支援向量機（SVM）", "Transformer", "長短期記憶網路（LSTM）"], "answer": 2, "explanation": "這篇由 Google 團隊發表的論文提出 Transformer，用「注意力機制」取代了原本逐步處理序列的遞迴結構，讓訓練可以大規模平行化。", "fun_fact": "GPT 的 T 就是 Transformer；這個架構後來還被反過來用在影像上，成了 Vision Transformer。", "source": "https://en.wikipedia.org/wiki/Attention_Is_All_You_Need", "region": "科技"}, {"id": "tc-037", "topic": "tech", "category": "AI", "difficulty": 3, "type": "order", "question": "請把下列人工智慧的里程碑事件依發生時間先後排列：", "options": ["AlexNet 在 ImageNet 影像辨識大賽奪冠", "深藍擊敗西洋棋世界冠軍卡斯帕洛夫", "AlphaGo 擊敗南韓棋王李世乭", "〈Attention Is All You Need〉論文發表"], "answer": [1, 0, 2, 3], "explanation": "深藍（1997）→ AlexNet 奪下 ImageNet 冠軍（2012）→ AlphaGo 勝李世乭（2016）→ Transformer 論文發表（2017）。", "fun_fact": "2012 年的 AlexNet 大幅領先第二名約 10 個百分點奪冠，被視為深度學習熱潮真正的起跑槍聲。", "region": "科技"}, {"id": "tc-038", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "關於密碼，下列哪一個做法最安全？", "options": ["把密碼寫在便利貼，貼在螢幕邊框上", "每個網站設定不同的長密碼，統一交給密碼管理器保管", "想一組超複雜的密碼，所有網站都用同一組", "用生日加上姓名縮寫，好記又有數字"], "answer": 1, "explanation": "密碼外洩幾乎無可避免，重點是「不要一把鑰匙開所有門」。密碼管理器讓你只需要記住一組主密碼，其餘交給它產生與保管。", "fun_fact": "駭客最愛的攻擊叫「撞庫」：拿 A 網站外洩的帳密，直接去 B 網站、C 網站一個個試——密碼重複使用就會全軍覆沒。", "region": "科技"}, {"id": "tc-039", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "雙因素驗證（2FA）之所以比只有密碼更安全，是因為它同時要求哪兩類證明？", "options": ["兩組完全不同的密碼", "你「知道」的東西（密碼）＋ 你「擁有」的東西（手機驗證碼或實體金鑰）", "帳號名稱＋密碼", "電子郵件地址＋手機號碼"], "answer": 1, "explanation": "2FA 的精神是混用不同「類別」的憑證：知識（密碼）、持有物（手機、金鑰）、生物特徵（指紋、臉）。只要不同類，被偷一項也還有第二道防線。", "fun_fact": "資安專家普遍認為，簡訊驗證碼是 2FA 中相對較弱的一種，因為有被「SIM 卡挾持」的風險；驗證器 App 或實體安全金鑰更保險。", "region": "科技"}, {"id": "tc-040", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "下列哪一個最可能是釣魚（phishing）信件的特徵？", "options": ["信件只有純文字，沒有附件也沒有連結", "信件附上該公司官方網站的網址，但沒有要求任何動作", "信件寄到你的公司信箱而不是私人信箱", "用「24 小時內未處理將停用帳號」製造急迫感，並附連結要你輸入帳號密碼"], "answer": 3, "explanation": "釣魚信的共同套路就是「製造恐慌 + 催你立刻動作 + 引導你到假網站輸入帳密」，因為一慌張就不會仔細看網址。", "fun_fact": "更精準的版本叫「魚叉式釣魚」：攻擊者會先查好你的姓名、職稱與同事名字，信件看起來像主管親自寄的，命中率高得多。", "region": "科技"}, {"id": "tc-041", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "收到簡訊說「您的銀行帳戶有異常，請點此連結登入確認」，最安全的處理方式是？", "options": ["先點進去看看網頁長得像不像官網再決定", "直接回覆簡訊，問對方是不是銀行", "照著輸入帳密，但故意先打錯一次測試反應", "不要點簡訊裡的連結，改用官方 App、自己輸入官網網址，或打客服電話查證"], "answer": 3, "explanation": "只要是對方主動送上門的連結或電話號碼，一律不要用。自己從已知的官方管道重新發起聯絡，才能確保沒有被中間人騙。", "fun_fact": "假網站可以做得跟官網一模一樣，連網址都只差一個字母（例如把 l 換成 1），肉眼幾乎分不出來。", "region": "科技"}, {"id": "tc-042", "topic": "tech", "category": "資安", "difficulty": 2, "type": "choice", "question": "只要網址開頭是 https、瀏覽器網址列顯示鎖頭圖示，就代表這個網站一定是合法、不會騙人的。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！鎖頭只保證「你和這個網站之間的連線經過加密」，別人在中間偷看不到內容，但它完全不保證網站背後的人是好人。", "fun_fact": "現在免費憑證隨手可得，絕大多數詐騙網站也都是 https 開頭；真正該看的是網址的網域名稱本身對不對。", "region": "科技"}, {"id": "tc-043", "topic": "tech", "category": "資安", "difficulty": 2, "type": "choice", "question": "資料備份的「3-2-1 原則」是指什麼？", "options": ["分成 3 個資料夾，放在 2 台電腦，用 1 個帳號管理", "每 3 天備份一次，保留 2 個版本，1 年整理一次", "資料保留 3 份副本，存放在 2 種不同的儲存媒體，其中 1 份放在異地", "密碼要含 3 個大寫字母、2 個數字、1 個符號"], "answer": 2, "explanation": "3 份副本讓單一損壞不致命，2 種媒體避免同一類裝置同時故障，1 份異地則能扛住火災、竊盜或勒索軟體整個網域加密。", "fun_fact": "勒索軟體之所以可怕，就是它會連同接在電腦上的備份硬碟一起加密——所以那「1 份異地」最好是離線或不常掛載的。", "region": "科技"}, {"id": "tc-044", "topic": "tech", "category": "資安", "difficulty": 3, "type": "choice", "question": "公開金鑰加密（非對稱加密）的運作方式是什麼？", "options": ["只要知道所使用的加密演算法，就能直接把內容解開", "用公開的「公鑰」加密，只有持有對應「私鑰」的人才解得開", "把資料壓縮成亂碼，任何人輸入檔名就能還原", "加密和解密都使用同一把大家共用的鑰匙"], "answer": 1, "explanation": "公鑰可以大方公開給任何人，私鑰則必須自己牢牢保管。這解決了古典加密最大的難題：雙方不必先安全地交換同一把密鑰。", "fun_fact": "反過來用私鑰加密、公鑰驗證，就成了「數位簽章」，可以證明訊息確實出自某人且沒被竄改，HTTPS 憑證就是這樣運作的。", "region": "科技"}, {"id": "tc-045", "topic": "tech", "category": "資安", "difficulty": 3, "type": "choice", "question": "資安專家建議不要把登機證的照片貼上社群媒體，主要原因是什麼？", "options": ["條碼被掃描後會自動從信用卡扣款", "條碼裡藏著訂位代號等個資，別人掃描後可能查到你的行程，甚至更改或取消機位", "條碼會讓照片檔案異常變大，佔用手機空間", "航空公司規定登機證一律禁止拍照"], "answer": 1, "explanation": "登機證條碼依國際航空運輸協會的規格編碼，含有姓名、班次與訂位代號等資訊，網路上隨便一個解碼器就能讀出來。拿到訂位代號加姓名，往往就能登入航空公司網站查看甚至異動行程。", "fun_fact": "資安記者 Brian Krebs 實測過，光靠一張被丟進垃圾桶的登機證，就能查出旅客未來的所有航班與部分常客資料。", "source": "https://krebsonsecurity.com/2017/08/why-its-still-a-bad-idea-to-post-or-trash-your-airline-boarding-pass/", "region": "科技"}, {"id": "tc-046", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "電腦規格表上寫的「CPU」，中文一般翻譯成什麼？", "options": ["固態硬碟", "圖形顯示晶片", "中央處理器", "主記憶體"], "answer": 2, "explanation": "CPU 是 Central Processing Unit 的縮寫，負責執行程式指令與運算，中文稱為中央處理器。", "fun_fact": "手機裡的處理器多半叫 SoC，把 CPU、繪圖、通訊等模組全部整合在同一顆晶片上。", "region": "科技"}, {"id": "tc-047", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "上網時的 DNS 系統，最主要的工作是什麼？", "options": ["把網域名稱轉換成 IP 位址", "替連線中的資料加密並驗證身分", "把網頁裡的圖片壓縮後再傳送", "分配家中無線網路使用的頻道"], "answer": 0, "explanation": "人記得住 www 開頭的名字，機器只認得 IP 位址，DNS 就像網路的電話簿，負責把名字查成位址。", "fun_fact": "DNS 查詢結果會被暫存一段時間，所以改完網域設定往往要等幾小時才會全世界都生效。", "region": "科技"}, {"id": "tc-048", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "電腦裡的 GPU，最初是為了處理什麼而設計的？", "options": ["硬碟資料的讀寫排程", "螢幕影像的繪圖運算", "網路封包的收送處理", "鍵盤滑鼠的訊號輸入"], "answer": 1, "explanation": "GPU 是 Graphics Processing Unit，原本專門負責畫面繪製，強項是同時做大量重複的計算。", "fun_fact": "正因為擅長平行運算，GPU 後來被大量拿去訓練 AI 模型，變成完全不同的生意。", "region": "科技"}, {"id": "tc-049", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "固態硬碟（SSD）和傳統硬碟（HDD）最主要的差別是什麼？", "options": ["SSD 的容量一定比 HDD 大", "SSD 只能讀取資料不能寫入", "SSD 必須外接電源才能運作", "SSD 用快閃記憶體，沒有碟片"], "answer": 3, "explanation": "傳統硬碟靠馬達轉動磁碟、磁頭移動讀寫；SSD 用快閃記憶體晶片，沒有機械動作，所以更快也更耐摔。", "fun_fact": "沒有馬達也代表 SSD 幾乎完全安靜，早期很多人換上去第一個感覺是「電腦怎麼不叫了」。", "region": "科技"}, {"id": "tc-050", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "使用 VPN 上網時，實際上發生了什麼事？", "options": ["資料經加密通道，從遠端伺服器連出", "電腦會自動掃描並清除系統裡的病毒", "家中網路的下載頻寬會自動變成兩倍", "手機螢幕會切換成較省電的夜間模式"], "answer": 0, "explanation": "VPN 會在你的裝置和一台遠端伺服器之間建立加密通道，對外看起來像是從那台伺服器所在的網路連出去。", "fun_fact": "VPN 最早是企業拿來讓員工遠端連回公司內網用的，翻牆或隱藏位置是後來衍生的用途。", "region": "科技"}, {"id": "tc-051", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "手機掃的「QR code」，其中 QR 兩個字母是什麼的縮寫？", "options": ["Quality Rating（品質評等）", "Quick Response（快速回應）", "Query Record（查詢紀錄）", "Quantum Reader（量子讀取）"], "answer": 1, "explanation": "QR 是 Quick Response 的縮寫，強調它比傳統條碼更快被讀取。", "fun_fact": "QR code 一九九四年由日本電裝公司為汽車零件管理而發明，發明者選擇不收授權費，才讓它普及全世界。", "region": "科技"}, {"id": "tc-052", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "公文與表單常用 PDF 檔，PDF 格式最主要的特色是什麼？", "options": ["檔案一定比 Word 檔小很多", "打開之後就不能再加註解", "只有微軟出的軟體打得開", "在不同裝置上排版都一致"], "answer": 3, "explanation": "PDF 把字型與版面資訊一起包在檔案裡，所以換電腦、換系統開啟時排版都不會跑掉。", "fun_fact": "PDF 是 Portable Document Format，二○○八年成為國際標準，任何人都可以自由實作。", "region": "科技"}, {"id": "tc-053", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "全世界積極推動 IPv6 的最主要原因是什麼？", "options": ["IPv4 的位址數量已經不夠分配", "IPv4 沒有辦法用在無線網路上", "IPv6 可以讓上網速度快上十倍", "IPv6 連線時完全不需要密碼"], "answer": 0, "explanation": "IPv4 只有三十二位元、約四十多億個位址，早已不敷全球裝置使用；IPv6 改用一百二十八位元，位址幾乎用不完。", "fun_fact": "IPv6 的位址多到可以替地球上每一粒沙都編號還綽綽有餘。", "region": "科技"}, {"id": "tc-054", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "家用 Wi-Fi 的 5GHz 頻段，和 2.4GHz 相比有什麼特性？", "options": ["傳輸距離較遠，但速度慢很多", "只有手機能用，筆電連不上", "速度較快，但穿透牆壁較差", "必須另外向電信業者申請"], "answer": 2, "explanation": "頻率越高、波長越短，繞射與穿透能力越差，但可用頻寬大、干擾少，所以 5GHz 近距離快、隔牆就弱。", "fun_fact": "2.4GHz 會塞車的原因之一是微波爐、藍牙裝置也用這個頻段。", "region": "科技"}, {"id": "tc-055", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "CPU 內部的「快取記憶體（cache）」主要作用是什麼？", "options": ["在停電時提供短暫的備用電力", "暫存常用資料，減少等待時間", "永久保存關機後仍要用的檔案", "負責把畫面輸出到螢幕上顯示"], "answer": 1, "explanation": "CPU 的運算速度遠快於主記憶體，快取把最近常用的資料放在離核心最近的地方，減少等待。", "fun_fact": "快取通常分成 L1、L2、L3 三層，越靠近核心的越小也越快。", "region": "科技"}, {"id": "tc-056", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "電子郵件「寄出」信件時，使用的標準通訊協定是哪一個？", "options": ["FTP", "HTTP", "DHCP", "SMTP"], "answer": 3, "explanation": "SMTP（Simple Mail Transfer Protocol）負責把信件送出與在郵件伺服器之間轉送；收信則常用 IMAP 或 POP3。", "fun_fact": "SMTP 一九八二年就定稿，是今天還在大量使用的最古老網路協定之一。", "region": "科技"}, {"id": "tc-057", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "瀏覽器裡常被提到的「Cookie」是什麼東西？", "options": ["瀏覽器內建的病毒掃描程式", "網頁上播放影片用的元件", "網站存在瀏覽器裡的小資料", "電腦連線時自動更換的位址"], "answer": 2, "explanation": "Cookie 是網站存放在瀏覽器裡的小段資料，用來記住登入狀態、購物車或偏好設定。", "fun_fact": "也因為可以跨網站追蹤使用者，歐盟才規定網站要先徵求同意，於是到處都跳出同意視窗。", "region": "科技"}, {"id": "tc-058", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "像網頁版信箱、線上文件這種打開瀏覽器就能用、不必安裝的雲端服務，屬於哪一種模式？", "options": ["IaaS（基礎設施即服務）", "PaaS（平台即服務）", "SaaS（軟體即服務）", "VPS（虛擬專用主機）"], "answer": 2, "explanation": "直接以完成品的軟體形式提供給使用者，稱為 SaaS；IaaS 提供的是虛擬機器與儲存，PaaS 提供的是開發平台。", "fun_fact": "雲端業界常用披薩比喻：IaaS 是買食材自己烤，PaaS 是叫外送，SaaS 則是直接上餐廳吃。", "region": "科技"}, {"id": "tc-059", "topic": "tech", "category": "電腦與網路", "difficulty": 3, "type": "choice", "question": "網路傳輸協定 UDP 和 TCP 相比，最主要的差別是什麼？", "options": ["不保證封包送達，但延遲較低", "一定比 TCP 更安全而且更可靠", "只能用在區域網路裡面傳輸", "傳送前一定要先把資料加密"], "answer": 0, "explanation": "TCP 會建立連線、確認並重傳遺失的封包，代價是延遲；UDP 送出就不管了，適合直播與線上遊戲這類怕延遲的應用。", "fun_fact": "視訊通話寧可掉一兩格畫面也不要卡住，正是選用 UDP 的典型理由。", "region": "科技"}, {"id": "tc-060", "topic": "tech", "category": "電腦與網路", "difficulty": 3, "type": "choice", "question": "三十二位元的作業系統最多只能用到約 4GB 記憶體，原因是什麼？", "options": ["硬體規定記憶體插槽最多只有四條", "三十二位元位址能編出的數量有上限", "三十二位元系統並不支援雙通道技術", "記憶體一超過 4GB 就會嚴重發熱"], "answer": 1, "explanation": "位址有幾位元就決定能標示幾個位置，二的三十二次方約四十三億，剛好就是 4GB 的位元組數。", "fun_fact": "六十四位元系統理論上可定址一千六百萬 TB，短期內完全不必擔心不夠用。", "region": "科技"}, {"id": "tc-061", "topic": "tech", "category": "電腦與網路", "difficulty": 3, "type": "choice", "question": "網路卡的 MAC 位址和 IP 位址，最主要的差別是什麼？", "options": ["IP 由網卡出廠燒錄，MAC 可自行設定", "MAC 只用在無線網路，IP 用在有線", "兩者其實只是同一組編號的不同寫法", "MAC 由網卡固定，IP 隨網路而變"], "answer": 3, "explanation": "MAC 位址是網卡出廠時的實體識別碼，用於同一個區域網路內定位；IP 位址則由所在網路配發，換網路就會換。", "fun_fact": "同一台筆電從家裡帶到公司，MAC 位址不變，IP 位址通常整組都不一樣。", "region": "科技"}, {"id": "tc-062", "topic": "tech", "category": "人工智慧", "difficulty": 1, "type": "choice", "question": "圖靈測試是用來判斷什麼？", "options": ["測電腦的運算速度是否夠快", "測人能否分辨回應來自機器", "測程式碼裡有沒有語法錯誤", "測電腦能不能順利連上網路"], "answer": 1, "explanation": "圖靈提出用對話來判斷：如果人隔著螢幕聊天卻分不出對方是人還是機器，就算通過測試。", "fun_fact": "圖靈一九五○年提出時把它叫做「模仿遊戲」，圖靈測試是後人給的名字。", "region": "科技"}, {"id": "tc-063", "topic": "tech", "category": "人工智慧", "difficulty": 1, "type": "choice", "question": "常聽到的「生成式 AI」，指的是哪一類人工智慧？", "options": ["能自行產生文字或圖像等內容", "只能判斷資料屬於哪一個分類", "專門用來偵測電腦病毒的程式", "負責控制工廠機械手臂的系統"], "answer": 0, "explanation": "生成式 AI 的輸出是新的內容（文章、圖片、程式碼、音樂），而不是只回答「是或否」「屬於哪一類」。", "fun_fact": "分類型 AI 判斷「這是不是貓」，生成式 AI 則直接畫一隻沒人看過的貓。", "region": "科技"}, {"id": "tc-064", "topic": "tech", "category": "人工智慧", "difficulty": 1, "type": "choice", "question": "對手機語音助理說話時，要先把聲音轉成文字，這項技術稱為什麼？", "options": ["影像辨識", "機器翻譯", "語音辨識", "資料壓縮"], "answer": 2, "explanation": "把聲音訊號轉成文字稱為語音辨識；之後才由語言模型理解語意並產生回答。", "fun_fact": "反過來把文字唸出來的技術叫語音合成，兩者合起來才構成完整的語音助理。", "region": "科技"}, {"id": "tc-065", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "機器學習裡的「監督式學習」，關鍵特徵是什麼？", "options": ["監督式學習一定要有人在旁監看", "監督式學習只能處理影像類資料", "監督式學習完全不需要訓練資料", "監督式學習的資料附有正確答案"], "answer": 3, "explanation": "監督式學習的每筆訓練資料都帶有標註好的正確答案，模型靠比對答案來修正自己；非監督式學習則沒有標註。", "fun_fact": "替資料上標註往往是最貴的一步，很多 AI 專案的成本大半花在請人標資料。", "region": "科技"}, {"id": "tc-066", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "大型語言模型有時講得頭頭是道，內容卻是憑空捏造的，這種現象業界稱為什麼？", "options": ["模型漂移", "回應延遲", "模型幻覺", "資料雜訊"], "answer": 2, "explanation": "模型是依統計規律接續最可能的文字，本身沒有查證機制，因此會產生看似合理卻不存在的內容，業界稱為幻覺（hallucination）。", "fun_fact": "最常見的幻覺之一是捏造參考文獻：格式完全正確，但那篇論文根本不存在。", "region": "科技"}, {"id": "tc-067", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "「深度學習」的「深」，指的是什麼？", "options": ["訓練花費的時間非常長", "類神經網路的層數很多", "分析的主題非常專業", "需要的硬碟容量很大"], "answer": 1, "explanation": "深度指的是類神經網路堆疊了很多層，層層抽取越來越抽象的特徵。", "fun_fact": "早期網路只有兩三層，現代大型模型動輒上百層，深度正是效能突破的關鍵之一。", "region": "科技"}, {"id": "tc-068", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "訓練深度學習模型時偏好使用 GPU 而非只靠 CPU，主要原因是什麼？", "options": ["能同時平行處理大量矩陣運算", "儲存容量比 CPU 大上許多倍", "不需要作業系統就可以運作", "單一核心的時脈遠高於 CPU"], "answer": 0, "explanation": "神經網路訓練的核心是大量矩陣乘法，GPU 擁有數千個較簡單的核心可同時計算，效率遠勝核心數少的 CPU。", "fun_fact": "單看單核速度，GPU 其實比 CPU 慢，它贏在人海戰術。", "region": "科技"}, {"id": "tc-069", "topic": "tech", "category": "人工智慧", "difficulty": 3, "type": "choice", "question": "讓程式反覆嘗試、依照輸贏或得分回饋來自行調整策略，這種學習方式叫什麼？", "options": ["監督式學習", "轉移學習", "聯邦學習", "強化學習"], "answer": 3, "explanation": "強化學習沒有標準答案，靠環境給的獎勵訊號去學會什麼行為划算，下棋與機器人控制是典型應用。", "fun_fact": "AlphaGo 後續版本乾脆不看人類棋譜，純靠自我對弈的強化學習就練到更強。", "region": "科技"}, {"id": "tc-070", "topic": "tech", "category": "人工智慧", "difficulty": 3, "type": "choice", "question": "「人工智慧（Artificial Intelligence）」這個名詞，最早是在哪一場活動上被正式提出的？", "options": ["一九五六年美國達特茅斯學院研討會", "一九六九年美國阿波羅計畫成果發表", "一九四五年英國布萊切利園密碼會議", "一九七七年美國西岸個人電腦展覽"], "answer": 0, "explanation": "一九五六年麥卡錫等人在達特茅斯學院舉辦暑期研討會，會議提案書首次使用 Artificial Intelligence 一詞，被視為 AI 學門的起點。", "fun_fact": "當年的提案書樂觀地認為，一群人花一個暑假就能在這些問題上取得重大進展。", "region": "科技"}, {"id": "tc-071", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "手機的 NFC 功能，最常見的日常用途是什麼？", "options": ["長距離的衛星定位", "高速下載大型檔案", "感應式支付與門禁", "替其他手機充電"], "answer": 2, "explanation": "NFC 是近場通訊，有效距離只有幾公分，正好適合刷卡付款、感應門禁與電子票證。", "fun_fact": "距離短其實是安全設計：要盜刷就得幾乎貼到你的手機。", "region": "科技"}, {"id": "tc-072", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "藍牙（Bluetooth）最典型的用途是什麼？", "options": ["讓手機直接連上電信基地台", "短距離連接耳機喇叭等裝置", "把網路訊號延伸到整棟大樓", "替手機提供全球定位的座標"], "answer": 1, "explanation": "藍牙是為了取代裝置之間的短距離纜線而設計，常見於耳機、喇叭、鍵盤、手錶等周邊。", "fun_fact": "一般藍牙裝置的有效距離約十公尺，為了省電，功率刻意設定得很低。", "region": "科技"}, {"id": "tc-073", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "手機地圖能標出「你在這裡」，最主要是靠什麼？", "options": ["手機內建陀螺儀自行推算", "電信公司人工回報位置", "藍牙與附近手機互相比對", "繞地球運行的衛星訊號"], "answer": 3, "explanation": "手機接收多顆定位衛星的訊號，比較訊號抵達的時間差算出自己的座標。", "fun_fact": "室內收不到衛星訊號時，手機會改用附近 Wi-Fi 熱點與基地台輔助定位。", "region": "科技"}, {"id": "tc-074", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "手機轉個方向，畫面就跟著自動旋轉，靠的是哪一種感測器？", "options": ["環境光感測器", "加速度感測器", "指紋感測器", "溫度感測器"], "answer": 1, "explanation": "加速度感測器可以偵測重力方向，手機因此知道自己目前是直的還是橫的。", "fun_fact": "環境光感測器負責的是另一件事：依照周圍亮度自動調整螢幕亮度。", "region": "科技"}, {"id": "tc-075", "topic": "tech", "category": "手機與消費電子", "difficulty": 2, "type": "choice", "question": "OLED 螢幕和 LCD 螢幕最關鍵的差別是什麼？", "options": ["每個像素自己發光，不必背光", "解析度一定比 LCD 螢幕更高", "只能顯示黑白兩色不能顯示彩色", "一定要外接電源才能顯示畫面"], "answer": 0, "explanation": "LCD 需要一整片背光再由液晶控制透光，OLED 的每個像素自行發光，要黑就直接不亮，因此對比更高也更薄。", "fun_fact": "正因為黑色像素完全不發光，深色模式在 OLED 手機上真的比較省電。", "region": "科技"}, {"id": "tc-076", "topic": "tech", "category": "手機與消費電子", "difficulty": 2, "type": "choice", "question": "手機快充常常前半段衝很快，快充飽時卻明顯變慢，為什麼？", "options": ["電量越高，電池容量就越小", "接近滿電改用小電流保護電池", "高電量時會停用所有背景程式", "充電線在後段自動切換成慢速"], "answer": 1, "explanation": "鋰電池充電分階段：先用大電流快速充到約八成，之後改成定電壓小電流慢慢補滿，以免過充傷害電池。", "fun_fact": "所以廣告寫的「三十分鐘充到八成」通常不會寫成「三十分鐘充飽」，最後兩成特別慢。", "region": "科技"}, {"id": "tc-077", "topic": "tech", "category": "手機與消費電子", "difficulty": 2, "type": "choice", "question": "手機標示的防護等級「IP68」，兩個數字分別代表什麼？", "options": ["螢幕亮度與電池容量", "訊號強度與傳輸速率", "防塵等級與防水等級", "外殼硬度與抗摔高度"], "answer": 2, "explanation": "IP 等級的第一個數字是防塵能力（最高 6），第二個是防水能力（常見到 8），數字越大越強。", "fun_fact": "防水測試用的是清水，泡海水或熱水並不在保固範圍內。", "region": "科技"}, {"id": "tc-078", "topic": "tech", "category": "手機與消費電子", "difficulty": 3, "type": "choice", "question": "一般手機螢幕戴著普通棉手套就按不動，最主要的原因是什麼？", "options": ["螢幕需要一定壓力才會判定按下", "手套會擋住螢幕下方的紅外線", "手套讓螢幕的溫度感測器失效", "螢幕靠手指導電偵測電場變化"], "answer": 3, "explanation": "現在的電容式觸控螢幕是偵測導電的手指造成的電場變化，棉布不導電，隔著手套就沒有訊號。", "fun_fact": "觸控手套的做法是在指尖織入導電纖維，讓電流能通到螢幕表面。", "region": "科技"}, {"id": "tc-079", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 1, "type": "choice", "question": "製造半導體晶片用的晶圓，主要材料是哪一種元素？", "options": ["矽", "銅", "鋁", "鍺"], "answer": 0, "explanation": "絕大多數晶片都做在高純度的單晶矽晶圓上，矽蘊藏量大、性質穩定且容易形成良好的絕緣氧化層。", "fun_fact": "矽谷的名字正是來自這個元素，因為早期當地聚集了大量矽半導體公司。", "region": "科技"}, {"id": "tc-080", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 1, "type": "choice", "question": "電子產品規格上常見的「IC」，中文是什麼？", "options": ["感應線圈", "絕緣塗層", "積體電路", "印刷電池"], "answer": 2, "explanation": "IC 是 Integrated Circuit 的縮寫，指把大量電晶體等元件整合在一小片半導體上的電路。", "fun_fact": "積體電路一九五八年問世前，電子設備得靠一顆顆電晶體手工接線組裝。", "region": "科技"}, {"id": "tc-081", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 2, "type": "choice", "question": "半導體業經常提到的「摩爾定律」，說的是什麼？", "options": ["晶片的售價每兩年會下降一半", "晶圓直徑每十年會增加一倍", "螢幕解析度每年都提升一倍", "電晶體數量約每兩年翻一倍"], "answer": 3, "explanation": "摩爾觀察到積體電路上可容納的電晶體數量大約每兩年增加一倍，這個趨勢推動了數十年的效能成長。", "fun_fact": "摩爾定律是經驗觀察而非物理定律，業界其實是把它當成努力達成的目標在追。", "region": "科技"}, {"id": "tc-082", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 2, "type": "choice", "question": "半導體業說的「無晶圓廠（fabless）」公司，是什麼樣的公司？", "options": ["只做封裝與測試，不碰電路設計", "只做 IC 設計，不自己製造", "只賣半導體機台，不生產晶片", "只做通路批發，不投入研發"], "answer": 1, "explanation": "fabless 公司專注於晶片設計與銷售，自己不蓋昂貴的晶圓廠，把製造委託給晶圓代工廠。", "fun_fact": "設計與製造分工的商業模式，正是晶圓代工興起後才成立的產業結構。", "region": "科技"}, {"id": "tc-083", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 2, "type": "choice", "question": "業界常說的「十二吋晶圓」，十二吋指的是什麼？", "options": ["圓形矽晶片的直徑", "單顆晶片的對角線", "無塵室天花板高度", "一片晶圓的總厚度"], "answer": 0, "explanation": "晶圓是圓形的矽薄片，十二吋（約三百公釐）指的是它的直徑；直徑越大，一片能切出的晶片越多。", "fun_fact": "從八吋換到十二吋，單片面積增加超過一倍，是壓低單顆成本的重要一步。", "region": "科技"}, {"id": "tc-084", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 3, "type": "choice", "question": "先進製程使用的 EUV（極紫外光）微影設備，主要好處是什麼？", "options": ["可以省下所有化學清洗步驟", "能讓晶圓的尺寸做得更大", "用更短波長刻出更細線路", "能直接把晶片封裝進外殼"], "answer": 2, "explanation": "微影能畫多細，受限於光的波長。EUV 波長只有十三點五奈米，遠短於原本的深紫外光，才能刻出更精細的電路。", "fun_fact": "EUV 光會被空氣吸收，整套曝光過程必須在真空中進行。", "region": "科技"}, {"id": "tc-085", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 3, "type": "choice", "question": "半導體產業鏈裡的「封裝測試」，主要在做什麼？", "options": ["設計晶片內部的電路邏輯", "把矽原料拉成單晶晶柱", "在晶圓上塗光阻並曝光", "把晶粒裝進外殼並做檢測"], "answer": 3, "explanation": "晶圓製造完成後要切割成一顆顆晶粒，封裝廠替它接上接腳、裝進保護外殼，再測試功能是否正常。", "fun_fact": "先進封裝可以把多顆不同製程的晶粒疊合在一起，成為近年提升效能的另一條路。", "region": "科技"}, {"id": "tc-086", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "同樣的聲音，在下列哪一種介質中傳播得最快？", "options": ["空氣", "水", "鋼鐵", "真空"], "answer": 2, "explanation": "聲音靠介質粒子的振動一個接一個傳遞，粒子排列越緊密傳得越快，所以固體最快、液體次之、氣體最慢；真空中沒有介質，聲音根本無法傳播。", "fun_fact": "聲音在空氣中約每秒 340 公尺，在水中約 1500 公尺，在鋼鐵中可達每秒約 5000 公尺。", "region": "科技"}, {"id": "tc-087", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "家電上標示的「110V」，其中的 V（伏特）量的是什麼？", "options": ["電壓", "電流", "電阻", "電功率"], "answer": 0, "explanation": "伏特是電壓（電位差）的單位；電流的單位是安培、電阻是歐姆、電功率則是瓦特。", "fun_fact": "台灣一般插座是 110 伏特，冷氣與電熱水器這類大電力設備則多半走 220 伏特專用迴路。", "region": "科技"}, {"id": "tc-088", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "光在真空中的速度，大約是下列哪一個數值？", "options": ["每秒約 3 千公里", "每秒約 3 萬公里", "每秒約 30 萬公里", "每秒約 300 萬公里"], "answer": 2, "explanation": "光速約為每秒 299,792,458 公尺，也就是每秒約 30 萬公里，繞地球赤道一圈只需要大約 0.13 秒。", "fun_fact": "現在的「公尺」反過來由光速定義：1 公尺就是光在真空中行進 1/299792458 秒所走的距離。", "region": "科技"}, {"id": "tc-089", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "打雷時總是先看到閃電，隔幾秒才聽到雷聲，主要原因是什麼？", "options": ["雷聲要比閃電晚幾秒才產生", "閃電釋放的能量比雷聲大很多", "空氣會把低頻的雷聲先擋住", "光的傳播速度遠比聲音快"], "answer": 3, "explanation": "閃電與雷聲幾乎同時發生，但光每秒走 30 萬公里、聲音每秒只走約 340 公尺，距離越遠，兩者抵達的時間差就越大。", "fun_fact": "看到閃電後開始數秒數，再把秒數除以 3，大約就是雷擊處離你幾公里。", "region": "科技"}, {"id": "tc-090", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "一個 10 歐姆的電阻通過 2 安培的電流，它兩端的電壓是多少？", "options": ["5 伏特", "12 伏特", "20 伏特", "0.2 伏特"], "answer": 2, "explanation": "依歐姆定律 V = I × R，電壓等於電流乘以電阻，2 安培 × 10 歐姆 = 20 伏特。", "fun_fact": "歐姆在 1827 年提出這個關係時幾乎被同行忽視，直到十多年後才獲得肯定，電阻單位也因此以他命名。", "region": "科技"}, {"id": "tc-091", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "吊重物時若只裝一個固定在上方的「定滑輪」，它的作用是什麼？", "options": ["可以把需要的施力減少一半", "只改變施力方向，不省力", "可以讓重物自動輕鬆上升", "把重物的實際重量減半"], "answer": 1, "explanation": "定滑輪的轉軸固定、兩側力臂相等，所以完全不省力，只是把「向下拉」變成「向上升」，比較好使力；要省力必須用動滑輪。", "fun_fact": "動滑輪能讓施力減半，但繩子得多拉一倍長度——省力不省功，這是所有簡單機械共同的鐵則。", "region": "科技"}, {"id": "tc-092", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "晴天時抬頭看到的天空是藍色的，主要原因是什麼？", "options": ["陽光穿過臭氧層之後會變成藍色", "空氣對藍光的散射遠比紅光強", "大氣層裡本來就含有藍色的氣體", "海面把藍色反射到天空上去了"], "answer": 1, "explanation": "陽光進入大氣後被空氣分子散射，波長越短散射越強，藍光被散射到四面八方，我們抬頭才會看到滿天藍光。", "fun_fact": "夕陽偏紅是同一個道理：斜射的陽光要穿過更厚的大氣，藍光幾乎都被散射掉，只剩紅橙光直達眼睛。", "region": "科技"}, {"id": "tc-093", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "保溫瓶的瓶身做成雙層、中間抽成真空，主要是為了阻斷哪兩種熱傳遞方式？", "options": ["輻射與對流", "蒸發與凝結", "輻射與傳導", "傳導與對流"], "answer": 3, "explanation": "傳導與對流都需要介質才能進行，中間抽成真空就幾乎斷了這兩條路；至於不需要介質的輻射，則靠內壁鍍上的反光鏡面反射回去。", "fun_fact": "這種構造由英國科學家杜瓦在 1892 年為了保存低溫液態氣體而發明，所以又叫「杜瓦瓶」。", "region": "科技"}, {"id": "tc-094", "topic": "tech", "category": "物理與工程", "difficulty": 3, "type": "choice", "question": "攝氏與華氏是兩套不同的溫標，在哪一個溫度時，兩者的讀數剛好相同？", "options": ["零下 40 度", "零下 273 度", "正 32 度", "正 100 度"], "answer": 0, "explanation": "華氏與攝氏的換算是 F = 1.8C + 32，令 F 等於 C 解方程式可得 C = −40，所以攝氏零下 40 度就等於華氏零下 40 度。", "fun_fact": "這是唯一不必說明單位的溫度——說「零下四十度」時，講攝氏或華氏都對。", "region": "科技"}, {"id": "tc-095", "topic": "tech", "category": "物理與工程", "difficulty": 3, "type": "choice", "question": "同一個房間裡的金屬椅和木頭椅溫度其實一樣，為什麼摸起來金屬明顯比較冰？", "options": ["金屬的溫度其實比木頭低了幾度", "金屬導熱快，迅速把手的熱帶走", "金屬表面比較光滑，摩擦力較小", "木頭本身會緩慢地自己產生熱量"], "answer": 1, "explanation": "皮膚感覺到的其實不是溫度本身，而是熱量流失的快慢。金屬導熱係數高，一接觸就把手上的熱迅速抽走，所以覺得特別冰。", "fun_fact": "同理，冬天摸金屬門把特別冷、夏天踩柏油路特別燙，都是導熱快慢在騙你的觸覺。", "region": "科技"}, {"id": "tc-096", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "太陽系的八大行星中，體積與質量都最大的是哪一顆？", "options": ["土星", "木星", "天王星", "海王星"], "answer": 1, "explanation": "木星的直徑約為地球的 11 倍，質量比其他七顆行星加起來還要大上一倍以上。", "fun_fact": "木星表面的「大紅斑」是一個已經持續數百年的巨大風暴，大到足以把整顆地球裝進去。", "region": "科技"}, {"id": "tc-097", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "天文學上常講的「一光年」，是哪一種量的單位？", "options": ["時間", "距離", "亮度", "質量"], "answer": 1, "explanation": "一光年是光在真空中行進一年所走的距離，約 9.46 兆公里，專門用來描述恆星之間的遙遠距離。", "fun_fact": "離太陽最近的恆星「比鄰星」約 4.2 光年遠，代表我們現在看到的它，其實是四年多以前的模樣。", "region": "科技"}, {"id": "tc-098", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "1969 年阿波羅 11 號任務中，第一個踏上月球表面的太空人是誰？", "options": ["巴茲·艾德林", "麥可·柯林斯", "尼爾·阿姆斯壯", "尤里·加加林"], "answer": 2, "explanation": "阿姆斯壯先走出登月艙，艾德林隨後成為第二人，柯林斯則留守繞月的指揮艙；加加林是 1961 年首位進入太空的人，與登月任務無關。", "fun_fact": "他那句「這是我個人的一小步，卻是人類的一大步」，是踏上月面時透過無線電傳回地球的。", "region": "科技"}, {"id": "tc-099", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "地球上之所以會有春夏秋冬四季，最主要的原因是什麼？", "options": ["地球自轉軸相對公轉面是傾斜的", "地球繞太陽的公轉軌道是橢圓形", "太陽本身的亮度會週期性地變化", "月球的引力週期性改變地球氣候"], "answer": 0, "explanation": "地軸約傾斜 23.5 度，使同一地點一年當中接收到的陽光角度與日照長度不斷改變，才產生冷熱之別；與地球離太陽遠近幾乎無關。", "fun_fact": "地球其實在每年一月初離太陽最近，而那正是北半球的隆冬；南北半球季節相反，也直接推翻了「遠近說」。", "region": "科技"}, {"id": "tc-100", "topic": "tech", "category": "太空與天文", "difficulty": 2, "type": "choice", "question": "我們在地球上永遠只看得到月球的同一面，這是為什麼？", "options": ["月球本身完全不會自轉，只繞著地球", "月球有一半的表面永遠照不到陽光", "地球的自轉剛好把另外半面遮住了", "月球自轉一圈的時間等於公轉一圈"], "answer": 3, "explanation": "這叫「潮汐鎖定」：月球的自轉週期與繞地球公轉的週期都約 27.3 天，兩者同步，所以永遠以同一面朝向我們。", "fun_fact": "月球背面一直要到 1959 年蘇聯「月球 3 號」探測器繞過去拍照，人類才第一次見到它的樣子。", "region": "科技"}, {"id": "tc-101", "topic": "tech", "category": "太空與天文", "difficulty": 2, "type": "choice", "question": "火箭在幾乎真空的太空中沒有空氣可以推，為什麼還能繼續加速？", "options": ["靠太陽風從後面吹著推進", "靠地球磁場的拉力牽引", "靠高速噴出燃氣的反作用力", "靠殘留的稀薄空氣提供反作用力"], "answer": 2, "explanation": "依牛頓第三運動定律，火箭向後高速噴出大量燃氣，燃氣就對火箭施加大小相等、方向相反的推力，完全不需要外界有東西可以推。", "fun_fact": "火箭在真空中效率反而更好——既沒有空氣阻力，也沒有大氣壓力抵消噴嘴的推力。", "region": "科技"}, {"id": "tc-102", "topic": "tech", "category": "太空與天文", "difficulty": 2, "type": "choice", "question": "國際太空站裡的太空人會飄浮起來，主要是因為什麼？", "options": ["太空站的高度已經超出地球引力範圍", "太空站與太空人一起繞著地球落下", "太空站內部刻意抽成了真空的狀態", "太空站用磁場抵消掉了地球的重力"], "answer": 1, "explanation": "太空站約在 400 公里高，那裡的地球重力仍有地表的九成左右；飄浮是因為太空站與人以相同速度不斷「墜向地球」卻一直落空，處於自由落體狀態。", "fun_fact": "所以正確說法是「微重力」而非「無重力」——太空站等於一直在墜落，只是橫向速度夠快，永遠掉不到地面。", "region": "科技"}, {"id": "tc-103", "topic": "tech", "category": "太空與天文", "difficulty": 3, "type": "choice", "question": "黑洞的「事件視界（event horizon）」指的是什麼？", "options": ["黑洞中心密度無限大的那一點", "黑洞周圍高速旋轉的發光吸積盤", "連光都無法再逃出來的那道邊界", "黑洞把周圍恆星撕碎的作用範圍"], "answer": 2, "explanation": "事件視界是黑洞的「不歸點」，一旦越過，任何物質與訊號（包括光）都再也無法傳回外界，因此我們看不到裡面發生什麼事。", "fun_fact": "2019 年公布的第一張黑洞影像，拍到的其實是事件視界外側發光物質形成的亮環，以及中央那片陰影。", "region": "科技"}, {"id": "tc-104", "topic": "tech", "category": "太空與天文", "difficulty": 3, "type": "choice", "question": "把望遠鏡花大錢送上太空軌道，最主要的好處是什麼？", "options": ["在太空中的望遠鏡可以造得更大更重", "距離觀測的天體更近，看起來更大", "太空中沒有重力，鏡片就不會變形", "避開大氣的擾動與吸收，影像更清晰"], "answer": 3, "explanation": "大氣湍流會讓星光閃爍模糊，大氣也會吸收紫外線與大部分紅外線；到了大氣層之外，這兩個問題都不存在。", "fun_fact": "「離天體更近」完全幫不上忙——幾百公里的軌道高度，比起動輒以光年計的距離根本可以忽略不計。", "region": "科技"}, {"id": "tc-105", "topic": "tech", "category": "生物與醫學科技", "difficulty": 1, "type": "choice", "question": "DNA 分子的立體結構，一般被形容成什麼形狀？", "options": ["雙螺旋", "正六邊形", "同心圓環", "正四面體"], "answer": 0, "explanation": "1953 年華生與克里克提出 DNA 由兩條長鏈互相纏繞成雙螺旋，中間以鹼基配對相連，看起來像一座旋轉樓梯。", "fun_fact": "推導這個結構的關鍵證據，是富蘭克林（Rosalind Franklin）拍下的 X 光繞射影像「51 號照片」。", "region": "科技"}, {"id": "tc-106", "topic": "tech", "category": "生物與醫學科技", "difficulty": 1, "type": "choice", "question": "疫苗之所以能預防疾病，最基本的原理是什麼？", "options": ["直接殺死已經侵入體內的病原體", "中和血液中累積的各種有害毒素", "替身體補充對抗疾病所需的營養", "讓免疫系統先認識病原並記住它"], "answer": 3, "explanation": "疫苗把減毒的病原、病原的片段或製造片段的指令送進體內，訓練免疫系統產生抗體與記憶細胞；真正遇到病原時，身體就能快速反應。", "fun_fact": "世界上第一支疫苗是 1796 年金納用牛痘預防天花；vaccine 這個字正源自拉丁文的「牛」。", "region": "科技"}, {"id": "tc-107", "topic": "tech", "category": "生物與醫學科技", "difficulty": 1, "type": "choice", "question": "感冒時醫師常說「抗生素對你沒用」，因為抗生素主要是用來對付什麼？", "options": ["細菌", "病毒", "黴菌", "過敏原"], "answer": 0, "explanation": "抗生素攻擊的是細菌特有的構造（例如細胞壁）或代謝途徑，而多數感冒由病毒引起，吃抗生素不但無效，還會篩選出抗藥性細菌。", "fun_fact": "1928 年弗萊明的培養皿被黴菌污染，他注意到黴菌周圍的細菌都死光了，因而發現了青黴素。", "region": "科技"}, {"id": "tc-108", "topic": "tech", "category": "生物與醫學科技", "difficulty": 2, "type": "choice", "question": "DNA 的兩股之間靠鹼基兩兩配對相連，其中腺嘌呤（A）固定和誰配對？", "options": ["鳥嘌呤（G）", "胸腺嘧啶（T）", "胞嘧啶（C）", "尿嘧啶（U）"], "answer": 1, "explanation": "DNA 的配對規則是 A 對 T、G 對 C；尿嘧啶（U）只出現在 RNA 中，在那裡取代 T 的位置與 A 配對。", "fun_fact": "正因為配對規則固定，只要知道其中一股的序列就能推出另一股，這也是 DNA 能精準複製的關鍵。", "region": "科技"}, {"id": "tc-109", "topic": "tech", "category": "生物與醫學科技", "difficulty": 2, "type": "choice", "question": "照 X 光時，為什麼骨頭在影像上會呈現白色？", "options": ["骨頭會把 X 光反射回底片上", "骨頭本身會發出微弱的螢光", "骨頭密度高，吸收掉較多 X 光", "骨頭表面塗有顯影用的藥劑"], "answer": 2, "explanation": "X 光穿過人體後打在偵測器上，穿透越多的地方顯示越黑；含鈣的骨骼吸收多、讓 X 光穿過去的少，因此留下白色影像。", "fun_fact": "1895 年侖琴發現 X 光後，第一張人體 X 光片拍的是他太太的手，她看到自己的骨頭時說：「我看見我的死亡了。」", "region": "科技"}, {"id": "tc-110", "topic": "tech", "category": "生物與醫學科技", "difficulty": 2, "type": "choice", "question": "正常人的體細胞裡，總共有多少條染色體？", "options": ["23 條", "46 條", "64 條", "92 條"], "answer": 1, "explanation": "人類體細胞有 23 對、合計 46 條染色體，其中一對是性染色體；精子與卵子這類生殖細胞則各只帶 23 條。", "fun_fact": "染色體數量跟生物複雜程度沒有關係——狗有 78 條，某些蕨類植物甚至超過一千條。", "region": "科技"}, {"id": "tc-111", "topic": "tech", "category": "生物與醫學科技", "difficulty": 3, "type": "choice", "question": "電子顯微鏡能看到比光學顯微鏡細小得多的構造，關鍵原因是什麼？", "options": ["電子顯微鏡的鏡片磨得更加精密", "放大倍率的旋鈕可以調得更高", "樣本放在真空中會自然變得清晰", "電子束的波長遠比可見光短"], "answer": 3, "explanation": "顯微鏡能分辨的最小尺度受限於所用的波長，可見光波長約 400 到 700 奈米，高速電子的等效波長卻可短到千分之一奈米等級，因此能看到接近原子的細節。", "fun_fact": "代價是樣本通常得置於真空中、還要鍍上導電薄膜，所以電子顯微鏡多半看不了活生生的生物。", "region": "科技"}, {"id": "tc-112", "topic": "tech", "category": "生物與醫學科技", "difficulty": 3, "type": "choice", "question": "醫院的 MRI（磁振造影）和 CT（電腦斷層）相比，最關鍵的差別是什麼？", "options": ["不用游離輻射，靠磁場與電波成像", "檢查所需要的時間遠比電腦斷層短", "只能用來檢查骨骼與關節部位病變", "一定要先注射顯影劑才能取得影像"], "answer": 0, "explanation": "CT 是用 X 光從多個角度掃描再重建影像；MRI 則以強磁場排列人體內的氫原子核，再用無線電波激發並接收訊號，沒有游離輻射，對軟組織的對比也更好。", "fun_fact": "因為磁場極強，受檢者身上不能有鐵磁性金屬——國外曾發生過氧氣鋼瓶被吸進機器造成傷亡的意外。", "region": "科技"}, {"id": "tc-113", "topic": "tech", "category": "交通與能源", "difficulty": 1, "type": "choice", "question": "現在的電動車與手機，絕大多數使用哪一類可充電電池？", "options": ["鉛酸電池", "鎳氫電池", "鋰離子電池", "拋棄式鹼性電池"], "answer": 2, "explanation": "鋰離子電池能量密度高、重量輕、可反覆充放電，是目前電動車與行動裝置的主流；鹼性電池則是不能充電的一次性電池。", "fun_fact": "鋰離子電池的三位開發者古迪納夫、惠廷安與吉野彰共同獲得 2019 年諾貝爾化學獎，當時古迪納夫 97 歲，是史上最年長的得主。", "region": "科技"}, {"id": "tc-114", "topic": "tech", "category": "交通與能源", "difficulty": 1, "type": "choice", "question": "飛機能夠飛在空中，最主要是靠什麼力量克服重力？", "options": ["機翼在空氣中產生的升力", "機身裡填充的輕質氣體", "引擎持續向下噴射的氣流", "高空的氣壓把飛機往上頂"], "answer": 0, "explanation": "機翼快速穿過空氣時，上下表面的氣流速度與壓力不同，形成向上的升力；引擎的推力則負責讓飛機取得足夠的前進速度。", "fun_fact": "這也是飛機起降要逆風的原因——迎面而來的風提高了機翼相對空氣的速度，可以縮短需要的跑道長度。", "region": "科技"}, {"id": "tc-115", "topic": "tech", "category": "交通與能源", "difficulty": 1, "type": "choice", "question": "目前世界各地運轉中的核能發電廠，是利用哪一種反應產生熱？", "options": ["核融合", "核分裂", "化學燃燒", "放射性衰變"], "answer": 1, "explanation": "商用核電廠靠鈾原子核被中子撞擊後分裂成較小的原子核並釋放大量能量，再用這些熱把水變成蒸汽推動渦輪發電。", "fun_fact": "太陽發光靠的則是核融合——把氫融合成氦；地面上的核融合發電至今仍停留在研究與實驗階段。", "region": "科技"}, {"id": "tc-116", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "汽油引擎的「四行程循環」，正確的順序是下列哪一個？", "options": ["壓縮 → 進氣 → 排氣 → 動力", "進氣 → 壓縮 → 動力 → 排氣", "動力 → 進氣 → 壓縮 → 排氣", "進氣 → 動力 → 壓縮 → 排氣"], "answer": 1, "explanation": "活塞先吸入油氣混合（進氣），再把它壓縮，接著由火星塞點火推動活塞做功（動力），最後把廢氣推出汽缸（排氣）。", "fun_fact": "這個循環由德國工程師奧托在 1876 年實用化，因此又叫「奧托循環」；柴油引擎則靠壓縮產生的高溫自行點燃，不需要火星塞。", "region": "科技"}, {"id": "tc-117", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "下列哪一種能源「不」屬於再生能源？", "options": ["風力", "地熱", "天然氣", "太陽能"], "answer": 2, "explanation": "天然氣是化石燃料，蘊藏量有限、燃燒也會排放二氧化碳；風力、地熱與太陽能則可以持續取得、不會耗竭。", "fun_fact": "天然氣常被稱作「比較乾淨的化石燃料」，因為發同樣一度電的二氧化碳排放量約只有燃煤的一半，但它依然不是再生能源。", "region": "科技"}, {"id": "tc-118", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "電動車與油電混合車的「再生煞車」，在減速時做了什麼事？", "options": ["馬達反轉成發電機，把電充回電池", "把多餘的動能轉成熱能排到車外去", "自動切換到低速檔位以增加阻力", "放出反向的氣流讓車身產生風阻"], "answer": 0, "explanation": "減速時車輪反過來帶動馬達，讓它變成發電機，把車子的動能轉成電能回充電池，同時產生制動力，因此既省煞車皮又能增加續航。", "fun_fact": "傳統車輛煞車時，動能全部變成碟盤的熱白白散掉；在走走停停的市區路況，再生煞車的回收效益最明顯。", "region": "科技"}, {"id": "tc-119", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "行動電源上標示的「10000 mAh」，這個數字描述的是什麼？", "options": ["充飽這顆電池所需要的總時間", "電池輸出時的最高電壓數值", "電池可以重複充電的總次數", "電池可以儲存的電荷容量"], "answer": 3, "explanation": "mAh（毫安培小時）是電荷量的單位，10000 mAh 表示理論上可以用 1000 毫安培的電流連續供電約 10 小時。", "fun_fact": "比較兩顆行動電源不能只看 mAh，還得看電壓——真正的能量是電壓乘以電荷量，單位是瓦時（Wh）。", "region": "科技"}, {"id": "tc-120", "topic": "tech", "category": "交通與能源", "difficulty": 3, "type": "choice", "question": "長距離輸電時，電力公司會先把電壓升到數十萬伏特再送出去，為什麼？", "options": ["高電壓可以讓電流傳得比較遠", "高電壓的電線比較不容易被雷擊中", "電壓越高電線的絕緣層就越安全", "電流變小，電線發熱的損耗大減"], "answer": 3, "explanation": "輸電線的損耗與電流的平方成正比，在輸送功率固定的情況下把電壓升高，電流就等比例變小，損耗以平方倍下降；到了用戶端再用變壓器降壓。", "fun_fact": "這正是十九世紀末「電流大戰」中交流電勝出的關鍵——交流電可以用變壓器輕鬆升壓降壓，當年的直流電做不到。", "region": "科技"}, {"id": "tc-121", "topic": "tech", "category": "數學與度量", "difficulty": 1, "type": "choice", "question": "圓周率 π 是圓的哪兩個量相除得到的比值？", "options": ["面積與半徑", "周長與半徑", "面積與直徑", "周長與直徑"], "answer": 3, "explanation": "π 的定義就是圓周長除以直徑，約等於 3.14159；無論圓是大是小，這個比值永遠相同。", "fun_fact": "3 月 14 日因此被稱為「圓周率日」，剛好也是愛因斯坦的生日。", "region": "科技"}, {"id": "tc-122", "topic": "tech", "category": "數學與度量", "difficulty": 1, "type": "choice", "question": "電費單上算的「1 度電」，相當於多少用電量？", "options": ["1000 瓦的電器連續使用一小時", "100 瓦的電器連續使用一小時", "1 瓦的電器連續使用一整天", "1000 瓦的電器連續使用一分鐘"], "answer": 0, "explanation": "1 度電就是 1 千瓦小時（kWh），也就是 1000 瓦的電器連續使用一小時所耗掉的電能。", "fun_fact": "一台 800 瓦的微波爐連續加熱約 75 分鐘，差不多就用掉 1 度電。", "region": "科技"}, {"id": "tc-123", "topic": "tech", "category": "數學與度量", "difficulty": 2, "type": "choice", "question": "數學上與 π 齊名的常數 e（自然對數的底），數值最接近下列何者？", "options": ["1.414", "1.618", "2.718", "3.142"], "answer": 2, "explanation": "e 約等於 2.71828，是自然對數的底，也出現在連續複利、放射性衰變等描述連續成長與衰減的公式裡。", "fun_fact": "另外三個也都是常見常數：1.414 是根號 2、1.618 是黃金比例、3.142 則是圓周率。", "region": "科技"}, {"id": "tc-124", "topic": "tech", "category": "數學與度量", "difficulty": 2, "type": "choice", "question": "一個房間裡大約要有多少人，「至少有兩人同月同日生」的機率才會超過一半？", "options": ["23 人", "60 人", "100 人", "183 人"], "answer": 0, "explanation": "這就是有名的「生日悖論」：要看的是所有人兩兩配對的組合，而不是你和其他人比對，23 人就有 253 種配對，機率因此超過 50%。", "fun_fact": "人數到 70 時機率已超過 99.9%，但若要百分之百保證，仍然需要 367 個人。", "region": "科技"}, {"id": "tc-125", "topic": "tech", "category": "數學與度量", "difficulty": 3, "type": "choice", "question": "密碼學裡的「雜湊函數（hash）」有一個關鍵特性，是下列哪一個？", "options": ["同一份輸入每次算出的結果都不同", "計算的結果可以用金鑰還原回原文", "輸出長度會隨輸入變大而跟著變長", "單向計算，無法由結果反推原文"], "answer": 3, "explanation": "雜湊把任意長度的資料壓成固定長度的值，同樣的輸入永遠得到同樣的結果，但實務上無法從雜湊值反推回原始內容，因此常用來驗證檔案完整性與保存密碼。", "fun_fact": "網站正確的做法是只存密碼的雜湊值並加上隨機的「鹽」，這樣即使資料庫外洩，也不會直接暴露使用者的密碼原文。", "region": "科技"}], "star": [{"id": "st-001", "category": "音樂", "difficulty": 2, "type": "choice", "question": "五月天的團名「Mayday」，原本是哪位團員在BBS上的網路代號？", "options": ["瑪莎", "怪獸", "阿信", "石頭"], "answer": 0, "explanation": "五月天前身是「So Band」，1997年為了報名野台開唱，借用貝斯手瑪莎的BBS代號「MayDay」當團名，並改名「五月天」。", "fun_fact": "「Mayday」同時也是國際通用的無線電求救信號。", "source": "https://zh.wikipedia.org/wiki/%E4%BA%94%E6%9C%88%E5%A4%A9", "asof": "2026-09", "region": "明星", "topic": "star"}, {"id": "st-002", "category": "音樂", "difficulty": 1, "type": "choice", "question": "周杰倫在2000年發行的首張錄音室專輯叫什麼？", "options": ["《葉惠美》", "《八度空間》", "《Jay》", "《范特西》"], "answer": 2, "explanation": "周杰倫的首張專輯是2000年11月發行的同名專輯《Jay》，全碟由他作曲並擔任製作人。", "fun_fact": "這張出道專輯就拿下第12屆金曲獎最佳流行音樂演唱專輯獎。", "source": "https://www.jvrmusic.com/news/detail/1275679152900542464", "asof": "2026-09", "region": "明星", "topic": "star"}, {"id": "st-003", "category": "音樂", "difficulty": 3, "type": "order", "question": "請依發行時間由早到晚，排列周杰倫這四張專輯。", "options": ["《葉惠美》", "《范特西
