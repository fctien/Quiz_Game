ice", "question": "下列哪一個最可能是釣魚（phishing）信件的特徵？", "options": ["信件只有純文字，沒有附件也沒有連結", "信件附上該公司官方網站的網址，但沒有要求任何動作", "信件寄到你的公司信箱而不是私人信箱", "用「24 小時內未處理將停用帳號」製造急迫感，並附連結要你輸入帳號密碼"], "answer": 3, "explanation": "釣魚信的共同套路就是「製造恐慌 + 催你立刻動作 + 引導你到假網站輸入帳密」，因為一慌張就不會仔細看網址。", "fun_fact": "更精準的版本叫「魚叉式釣魚」：攻擊者會先查好你的姓名、職稱與同事名字，信件看起來像主管親自寄的，命中率高得多。", "region": "科技"}, {"id": "tc-041", "topic": "tech", "category": "資安", "difficulty": 1, "type": "choice", "question": "收到簡訊說「您的銀行帳戶有異常，請點此連結登入確認」，最安全的處理方式是？", "options": ["先點進去看看網頁長得像不像官網再決定", "直接回覆簡訊，問對方是不是銀行", "照著輸入帳密，但故意先打錯一次測試反應", "不要點簡訊裡的連結，改用官方 App、自己輸入官網網址，或打客服電話查證"], "answer": 3, "explanation": "只要是對方主動送上門的連結或電話號碼，一律不要用。自己從已知的官方管道重新發起聯絡，才能確保沒有被中間人騙。", "fun_fact": "假網站可以做得跟官網一模一樣，連網址都只差一個字母（例如把 l 換成 1），肉眼幾乎分不出來。", "region": "科技"}, {"id": "tc-042", "topic": "tech", "category": "資安", "difficulty": 2, "type": "choice", "question": "只要網址開頭是 https、瀏覽器網址列顯示鎖頭圖示，就代表這個網站一定是合法、不會騙人的。", "options": ["對", "錯"], "answer": 1, "explanation": "假的！鎖頭只保證「你和這個網站之間的連線經過加密」，別人在中間偷看不到內容，但它完全不保證網站背後的人是好人。", "fun_fact": "現在免費憑證隨手可得，絕大多數詐騙網站也都是 https 開頭；真正該看的是網址的網域名稱本身對不對。", "region": "科技"}, {"id": "tc-043", "topic": "tech", "category": "資安", "difficulty": 2, "type": "choice", "question": "資料備份的「3-2-1 原則」是指什麼？", "options": ["分成 3 個資料夾，放在 2 台電腦，用 1 個帳號管理", "每 3 天備份一次，保留 2 個版本，1 年整理一次", "資料保留 3 份副本，存放在 2 種不同的儲存媒體，其中 1 份放在異地", "密碼要含 3 個大寫字母、2 個數字、1 個符號"], "answer": 2, "explanation": "3 份副本讓單一損壞不致命，2 種媒體避免同一類裝置同時故障，1 份異地則能扛住火災、竊盜或勒索軟體整個網域加密。", "fun_fact": "勒索軟體之所以可怕，就是它會連同接在電腦上的備份硬碟一起加密——所以那「1 份異地」最好是離線或不常掛載的。", "region": "科技"}, {"id": "tc-044", "topic": "tech", "category": "資安", "difficulty": 3, "type": "choice", "question": "公開金鑰加密（非對稱加密）的運作方式是什麼？", "options": ["只要知道所使用的加密演算法，就能直接把內容解開", "用公開的「公鑰」加密，只有持有對應「私鑰」的人才解得開", "把資料壓縮成亂碼，任何人輸入檔名就能還原", "加密和解密都使用同一把大家共用的鑰匙"], "answer": 1, "explanation": "公鑰可以大方公開給任何人，私鑰則必須自己牢牢保管。這解決了古典加密最大的難題：雙方不必先安全地交換同一把密鑰。", "fun_fact": "反過來用私鑰加密、公鑰驗證，就成了「數位簽章」，可以證明訊息確實出自某人且沒被竄改，HTTPS 憑證就是這樣運作的。", "region": "科技"}, {"id": "tc-045", "topic": "tech", "category": "資安", "difficulty": 3, "type": "choice", "question": "資安專家建議不要把登機證的照片貼上社群媒體，主要原因是什麼？", "options": ["條碼被掃描後會自動從信用卡扣款", "條碼裡藏著訂位代號等個資，別人掃描後可能查到你的行程，甚至更改或取消機位", "條碼會讓照片檔案異常變大，佔用手機空間", "航空公司規定登機證一律禁止拍照"], "answer": 1, "explanation": "登機證條碼依國際航空運輸協會的規格編碼，含有姓名、班次與訂位代號等資訊，網路上隨便一個解碼器就能讀出來。拿到訂位代號加姓名，往往就能登入航空公司網站查看甚至異動行程。", "fun_fact": "資安記者 Brian Krebs 實測過，光靠一張被丟進垃圾桶的登機證，就能查出旅客未來的所有航班與部分常客資料。", "source": "https://krebsonsecurity.com/2017/08/why-its-still-a-bad-idea-to-post-or-trash-your-airline-boarding-pass/", "region": "科技"}, {"id": "tc-046", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "電腦規格表上寫的「CPU」，中文一般翻譯成什麼？", "options": ["固態硬碟", "圖形顯示晶片", "中央處理器", "主記憶體"], "answer": 2, "explanation": "CPU 是 Central Processing Unit 的縮寫，負責執行程式指令與運算，中文稱為中央處理器。", "fun_fact": "手機裡的處理器多半叫 SoC，把 CPU、繪圖、通訊等模組全部整合在同一顆晶片上。", "region": "科技"}, {"id": "tc-047", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "上網時的 DNS 系統，最主要的工作是什麼？", "options": ["把網域名稱轉換成 IP 位址", "替連線中的資料加密並驗證身分", "把網頁裡的圖片壓縮後再傳送", "分配家中無線網路使用的頻道"], "answer": 0, "explanation": "人記得住 www 開頭的名字，機器只認得 IP 位址，DNS 就像網路的電話簿，負責把名字查成位址。", "fun_fact": "DNS 查詢結果會被暫存一段時間，所以改完網域設定往往要等幾小時才會全世界都生效。", "region": "科技"}, {"id": "tc-048", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "電腦裡的 GPU，最初是為了處理什麼而設計的？", "options": ["硬碟資料的讀寫排程", "螢幕影像的繪圖運算", "網路封包的收送處理", "鍵盤滑鼠的訊號輸入"], "answer": 1, "explanation": "GPU 是 Graphics Processing Unit，原本專門負責畫面繪製，強項是同時做大量重複的計算。", "fun_fact": "正因為擅長平行運算，GPU 後來被大量拿去訓練 AI 模型，變成完全不同的生意。", "region": "科技"}, {"id": "tc-049", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "固態硬碟（SSD）和傳統硬碟（HDD）最主要的差別是什麼？", "options": ["SSD 的容量一定比 HDD 大", "SSD 只能讀取資料不能寫入", "SSD 必須外接電源才能運作", "SSD 用快閃記憶體，沒有碟片"], "answer": 3, "explanation": "傳統硬碟靠馬達轉動磁碟、磁頭移動讀寫；SSD 用快閃記憶體晶片，沒有機械動作，所以更快也更耐摔。", "fun_fact": "沒有馬達也代表 SSD 幾乎完全安靜，早期很多人換上去第一個感覺是「電腦怎麼不叫了」。", "region": "科技"}, {"id": "tc-050", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "使用 VPN 上網時，實際上發生了什麼事？", "options": ["資料經加密通道，從遠端伺服器連出", "電腦會自動掃描並清除系統裡的病毒", "家中網路的下載頻寬會自動變成兩倍", "手機螢幕會切換成較省電的夜間模式"], "answer": 0, "explanation": "VPN 會在你的裝置和一台遠端伺服器之間建立加密通道，對外看起來像是從那台伺服器所在的網路連出去。", "fun_fact": "VPN 最早是企業拿來讓員工遠端連回公司內網用的，翻牆或隱藏位置是後來衍生的用途。", "region": "科技"}, {"id": "tc-051", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "手機掃的「QR code」，其中 QR 兩個字母是什麼的縮寫？", "options": ["Quality Rating（品質評等）", "Quick Response（快速回應）", "Query Record（查詢紀錄）", "Quantum Reader（量子讀取）"], "answer": 1, "explanation": "QR 是 Quick Response 的縮寫，強調它比傳統條碼更快被讀取。", "fun_fact": "QR code 一九九四年由日本電裝公司為汽車零件管理而發明，發明者選擇不收授權費，才讓它普及全世界。", "region": "科技"}, {"id": "tc-052", "topic": "tech", "category": "電腦與網路", "difficulty": 1, "type": "choice", "question": "公文與表單常用 PDF 檔，PDF 格式最主要的特色是什麼？", "options": ["檔案一定比 Word 檔小很多", "打開之後就不能再加註解", "只有微軟出的軟體打得開", "在不同裝置上排版都一致"], "answer": 3, "explanation": "PDF 把字型與版面資訊一起包在檔案裡，所以換電腦、換系統開啟時排版都不會跑掉。", "fun_fact": "PDF 是 Portable Document Format，二○○八年成為國際標準，任何人都可以自由實作。", "region": "科技"}, {"id": "tc-053", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "全世界積極推動 IPv6 的最主要原因是什麼？", "options": ["IPv4 的位址數量已經不夠分配", "IPv4 沒有辦法用在無線網路上", "IPv6 可以讓上網速度快上十倍", "IPv6 連線時完全不需要密碼"], "answer": 0, "explanation": "IPv4 只有三十二位元、約四十多億個位址，早已不敷全球裝置使用；IPv6 改用一百二十八位元，位址幾乎用不完。", "fun_fact": "IPv6 的位址多到可以替地球上每一粒沙都編號還綽綽有餘。", "region": "科技"}, {"id": "tc-054", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "家用 Wi-Fi 的 5GHz 頻段，和 2.4GHz 相比有什麼特性？", "options": ["傳輸距離較遠，但速度慢很多", "只有手機能用，筆電連不上", "速度較快，但穿透牆壁較差", "必須另外向電信業者申請"], "answer": 2, "explanation": "頻率越高、波長越短，繞射與穿透能力越差，但可用頻寬大、干擾少，所以 5GHz 近距離快、隔牆就弱。", "fun_fact": "2.4GHz 會塞車的原因之一是微波爐、藍牙裝置也用這個頻段。", "region": "科技"}, {"id": "tc-055", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "CPU 內部的「快取記憶體（cache）」主要作用是什麼？", "options": ["在停電時提供短暫的備用電力", "暫存常用資料，減少等待時間", "永久保存關機後仍要用的檔案", "負責把畫面輸出到螢幕上顯示"], "answer": 1, "explanation": "CPU 的運算速度遠快於主記憶體，快取把最近常用的資料放在離核心最近的地方，減少等待。", "fun_fact": "快取通常分成 L1、L2、L3 三層，越靠近核心的越小也越快。", "region": "科技"}, {"id": "tc-056", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "電子郵件「寄出」信件時，使用的標準通訊協定是哪一個？", "options": ["FTP", "HTTP", "DHCP", "SMTP"], "answer": 3, "explanation": "SMTP（Simple Mail Transfer Protocol）負責把信件送出與在郵件伺服器之間轉送；收信則常用 IMAP 或 POP3。", "fun_fact": "SMTP 一九八二年就定稿，是今天還在大量使用的最古老網路協定之一。", "region": "科技"}, {"id": "tc-057", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "瀏覽器裡常被提到的「Cookie」是什麼東西？", "options": ["瀏覽器內建的病毒掃描程式", "網頁上播放影片用的元件", "網站存在瀏覽器裡的小資料", "電腦連線時自動更換的位址"], "answer": 2, "explanation": "Cookie 是網站存放在瀏覽器裡的小段資料，用來記住登入狀態、購物車或偏好設定。", "fun_fact": "也因為可以跨網站追蹤使用者，歐盟才規定網站要先徵求同意，於是到處都跳出同意視窗。", "region": "科技"}, {"id": "tc-058", "topic": "tech", "category": "電腦與網路", "difficulty": 2, "type": "choice", "question": "像網頁版信箱、線上文件這種打開瀏覽器就能用、不必安裝的雲端服務，屬於哪一種模式？", "options": ["IaaS（基礎設施即服務）", "PaaS（平台即服務）", "SaaS（軟體即服務）", "VPS（虛擬專用主機）"], "answer": 2, "explanation": "直接以完成品的軟體形式提供給使用者，稱為 SaaS；IaaS 提供的是虛擬機器與儲存，PaaS 提供的是開發平台。", "fun_fact": "雲端業界常用披薩比喻：IaaS 是買食材自己烤，PaaS 是叫外送，SaaS 則是直接上餐廳吃。", "region": "科技"}, {"id": "tc-059", "topic": "tech", "category": "電腦與網路", "difficulty": 3, "type": "choice", "question": "網路傳輸協定 UDP 和 TCP 相比，最主要的差別是什麼？", "options": ["不保證封包送達，但延遲較低", "一定比 TCP 更安全而且更可靠", "只能用在區域網路裡面傳輸", "傳送前一定要先把資料加密"], "answer": 0, "explanation": "TCP 會建立連線、確認並重傳遺失的封包，代價是延遲；UDP 送出就不管了，適合直播與線上遊戲這類怕延遲的應用。", "fun_fact": "視訊通話寧可掉一兩格畫面也不要卡住，正是選用 UDP 的典型理由。", "region": "科技"}, {"id": "tc-060", "topic": "tech", "category": "電腦與網路", "difficulty": 3, "type": "choice", "question": "三十二位元的作業系統最多只能用到約 4GB 記憶體，原因是什麼？", "options": ["硬體規定記憶體插槽最多只有四條", "三十二位元位址能編出的數量有上限", "三十二位元系統並不支援雙通道技術", "記憶體一超過 4GB 就會嚴重發熱"], "answer": 1, "explanation": "位址有幾位元就決定能標示幾個位置，二的三十二次方約四十三億，剛好就是 4GB 的位元組數。", "fun_fact": "六十四位元系統理論上可定址一千六百萬 TB，短期內完全不必擔心不夠用。", "region": "科技"}, {"id": "tc-061", "topic": "tech", "category": "電腦與網路", "difficulty": 3, "type": "choice", "question": "網路卡的 MAC 位址和 IP 位址，最主要的差別是什麼？", "options": ["IP 由網卡出廠燒錄，MAC 可自行設定", "MAC 只用在無線網路，IP 用在有線", "兩者其實只是同一組編號的不同寫法", "MAC 由網卡固定，IP 隨網路而變"], "answer": 3, "explanation": "MAC 位址是網卡出廠時的實體識別碼，用於同一個區域網路內定位；IP 位址則由所在網路配發，換網路就會換。", "fun_fact": "同一台筆電從家裡帶到公司，MAC 位址不變，IP 位址通常整組都不一樣。", "region": "科技"}, {"id": "tc-062", "topic": "tech", "category": "人工智慧", "difficulty": 1, "type": "choice", "question": "圖靈測試是用來判斷什麼？", "options": ["測電腦的運算速度是否夠快", "測人能否分辨回應來自機器", "測程式碼裡有沒有語法錯誤", "測電腦能不能順利連上網路"], "answer": 1, "explanation": "圖靈提出用對話來判斷：如果人隔著螢幕聊天卻分不出對方是人還是機器，就算通過測試。", "fun_fact": "圖靈一九五○年提出時把它叫做「模仿遊戲」，圖靈測試是後人給的名字。", "region": "科技"}, {"id": "tc-063", "topic": "tech", "category": "人工智慧", "difficulty": 1, "type": "choice", "question": "常聽到的「生成式 AI」，指的是哪一類人工智慧？", "options": ["能自行產生文字或圖像等內容", "只能判斷資料屬於哪一個分類", "專門用來偵測電腦病毒的程式", "負責控制工廠機械手臂的系統"], "answer": 0, "explanation": "生成式 AI 的輸出是新的內容（文章、圖片、程式碼、音樂），而不是只回答「是或否」「屬於哪一類」。", "fun_fact": "分類型 AI 判斷「這是不是貓」，生成式 AI 則直接畫一隻沒人看過的貓。", "region": "科技"}, {"id": "tc-064", "topic": "tech", "category": "人工智慧", "difficulty": 1, "type": "choice", "question": "對手機語音助理說話時，要先把聲音轉成文字，這項技術稱為什麼？", "options": ["影像辨識", "機器翻譯", "語音辨識", "資料壓縮"], "answer": 2, "explanation": "把聲音訊號轉成文字稱為語音辨識；之後才由語言模型理解語意並產生回答。", "fun_fact": "反過來把文字唸出來的技術叫語音合成，兩者合起來才構成完整的語音助理。", "region": "科技"}, {"id": "tc-065", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "機器學習裡的「監督式學習」，關鍵特徵是什麼？", "options": ["監督式學習一定要有人在旁監看", "監督式學習只能處理影像類資料", "監督式學習完全不需要訓練資料", "監督式學習的資料附有正確答案"], "answer": 3, "explanation": "監督式學習的每筆訓練資料都帶有標註好的正確答案，模型靠比對答案來修正自己；非監督式學習則沒有標註。", "fun_fact": "替資料上標註往往是最貴的一步，很多 AI 專案的成本大半花在請人標資料。", "region": "科技"}, {"id": "tc-066", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "大型語言模型有時講得頭頭是道，內容卻是憑空捏造的，這種現象業界稱為什麼？", "options": ["模型漂移", "回應延遲", "模型幻覺", "資料雜訊"], "answer": 2, "explanation": "模型是依統計規律接續最可能的文字，本身沒有查證機制，因此會產生看似合理卻不存在的內容，業界稱為幻覺（hallucination）。", "fun_fact": "最常見的幻覺之一是捏造參考文獻：格式完全正確，但那篇論文根本不存在。", "region": "科技"}, {"id": "tc-067", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "「深度學習」的「深」，指的是什麼？", "options": ["訓練花費的時間非常長", "類神經網路的層數很多", "分析的主題非常專業", "需要的硬碟容量很大"], "answer": 1, "explanation": "深度指的是類神經網路堆疊了很多層，層層抽取越來越抽象的特徵。", "fun_fact": "早期網路只有兩三層，現代大型模型動輒上百層，深度正是效能突破的關鍵之一。", "region": "科技"}, {"id": "tc-068", "topic": "tech", "category": "人工智慧", "difficulty": 2, "type": "choice", "question": "訓練深度學習模型時偏好使用 GPU 而非只靠 CPU，主要原因是什麼？", "options": ["能同時平行處理大量矩陣運算", "儲存容量比 CPU 大上許多倍", "不需要作業系統就可以運作", "單一核心的時脈遠高於 CPU"], "answer": 0, "explanation": "神經網路訓練的核心是大量矩陣乘法，GPU 擁有數千個較簡單的核心可同時計算，效率遠勝核心數少的 CPU。", "fun_fact": "單看單核速度，GPU 其實比 CPU 慢，它贏在人海戰術。", "region": "科技"}, {"id": "tc-069", "topic": "tech", "category": "人工智慧", "difficulty": 3, "type": "choice", "question": "讓程式反覆嘗試、依照輸贏或得分回饋來自行調整策略，這種學習方式叫什麼？", "options": ["監督式學習", "轉移學習", "聯邦學習", "強化學習"], "answer": 3, "explanation": "強化學習沒有標準答案，靠環境給的獎勵訊號去學會什麼行為划算，下棋與機器人控制是典型應用。", "fun_fact": "AlphaGo 後續版本乾脆不看人類棋譜，純靠自我對弈的強化學習就練到更強。", "region": "科技"}, {"id": "tc-070", "topic": "tech", "category": "人工智慧", "difficulty": 3, "type": "choice", "question": "「人工智慧（Artificial Intelligence）」這個名詞，最早是在哪一場活動上被正式提出的？", "options": ["一九五六年美國達特茅斯學院研討會", "一九六九年美國阿波羅計畫成果發表", "一九四五年英國布萊切利園密碼會議", "一九七七年美國西岸個人電腦展覽"], "answer": 0, "explanation": "一九五六年麥卡錫等人在達特茅斯學院舉辦暑期研討會，會議提案書首次使用 Artificial Intelligence 一詞，被視為 AI 學門的起點。", "fun_fact": "當年的提案書樂觀地認為，一群人花一個暑假就能在這些問題上取得重大進展。", "region": "科技"}, {"id": "tc-071", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "手機的 NFC 功能，最常見的日常用途是什麼？", "options": ["長距離的衛星定位", "高速下載大型檔案", "感應式支付與門禁", "替其他手機充電"], "answer": 2, "explanation": "NFC 是近場通訊，有效距離只有幾公分，正好適合刷卡付款、感應門禁與電子票證。", "fun_fact": "距離短其實是安全設計：要盜刷就得幾乎貼到你的手機。", "region": "科技"}, {"id": "tc-072", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "藍牙（Bluetooth）最典型的用途是什麼？", "options": ["讓手機直接連上電信基地台", "短距離連接耳機喇叭等裝置", "把網路訊號延伸到整棟大樓", "替手機提供全球定位的座標"], "answer": 1, "explanation": "藍牙是為了取代裝置之間的短距離纜線而設計，常見於耳機、喇叭、鍵盤、手錶等周邊。", "fun_fact": "一般藍牙裝置的有效距離約十公尺，為了省電，功率刻意設定得很低。", "region": "科技"}, {"id": "tc-073", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "手機地圖能標出「你在這裡」，最主要是靠什麼？", "options": ["手機內建陀螺儀自行推算", "電信公司人工回報位置", "藍牙與附近手機互相比對", "繞地球運行的衛星訊號"], "answer": 3, "explanation": "手機接收多顆定位衛星的訊號，比較訊號抵達的時間差算出自己的座標。", "fun_fact": "室內收不到衛星訊號時，手機會改用附近 Wi-Fi 熱點與基地台輔助定位。", "region": "科技"}, {"id": "tc-074", "topic": "tech", "category": "手機與消費電子", "difficulty": 1, "type": "choice", "question": "手機轉個方向，畫面就跟著自動旋轉，靠的是哪一種感測器？", "options": ["環境光感測器", "加速度感測器", "指紋感測器", "溫度感測器"], "answer": 1, "explanation": "加速度感測器可以偵測重力方向，手機因此知道自己目前是直的還是橫的。", "fun_fact": "環境光感測器負責的是另一件事：依照周圍亮度自動調整螢幕亮度。", "region": "科技"}, {"id": "tc-075", "topic": "tech", "category": "手機與消費電子", "difficulty": 2, "type": "choice", "question": "OLED 螢幕和 LCD 螢幕最關鍵的差別是什麼？", "options": ["每個像素自己發光，不必背光", "解析度一定比 LCD 螢幕更高", "只能顯示黑白兩色不能顯示彩色", "一定要外接電源才能顯示畫面"], "answer": 0, "explanation": "LCD 需要一整片背光再由液晶控制透光，OLED 的每個像素自行發光，要黑就直接不亮，因此對比更高也更薄。", "fun_fact": "正因為黑色像素完全不發光，深色模式在 OLED 手機上真的比較省電。", "region": "科技"}, {"id": "tc-076", "topic": "tech", "category": "手機與消費電子", "difficulty": 2, "type": "choice", "question": "手機快充常常前半段衝很快，快充飽時卻明顯變慢，為什麼？", "options": ["電量越高，電池容量就越小", "接近滿電改用小電流保護電池", "高電量時會停用所有背景程式", "充電線在後段自動切換成慢速"], "answer": 1, "explanation": "鋰電池充電分階段：先用大電流快速充到約八成，之後改成定電壓小電流慢慢補滿，以免過充傷害電池。", "fun_fact": "所以廣告寫的「三十分鐘充到八成」通常不會寫成「三十分鐘充飽」，最後兩成特別慢。", "region": "科技"}, {"id": "tc-077", "topic": "tech", "category": "手機與消費電子", "difficulty": 2, "type": "choice", "question": "手機標示的防護等級「IP68」，兩個數字分別代表什麼？", "options": ["螢幕亮度與電池容量", "訊號強度與傳輸速率", "防塵等級與防水等級", "外殼硬度與抗摔高度"], "answer": 2, "explanation": "IP 等級的第一個數字是防塵能力（最高 6），第二個是防水能力（常見到 8），數字越大越強。", "fun_fact": "防水測試用的是清水，泡海水或熱水並不在保固範圍內。", "region": "科技"}, {"id": "tc-078", "topic": "tech", "category": "手機與消費電子", "difficulty": 3, "type": "choice", "question": "一般手機螢幕戴著普通棉手套就按不動，最主要的原因是什麼？", "options": ["螢幕需要一定壓力才會判定按下", "手套會擋住螢幕下方的紅外線", "手套讓螢幕的溫度感測器失效", "螢幕靠手指導電偵測電場變化"], "answer": 3, "explanation": "現在的電容式觸控螢幕是偵測導電的手指造成的電場變化，棉布不導電，隔著手套就沒有訊號。", "fun_fact": "觸控手套的做法是在指尖織入導電纖維，讓電流能通到螢幕表面。", "region": "科技"}, {"id": "tc-079", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 1, "type": "choice", "question": "製造半導體晶片用的晶圓，主要材料是哪一種元素？", "options": ["矽", "銅", "鋁", "鍺"], "answer": 0, "explanation": "絕大多數晶片都做在高純度的單晶矽晶圓上，矽蘊藏量大、性質穩定且容易形成良好的絕緣氧化層。", "fun_fact": "矽谷的名字正是來自這個元素，因為早期當地聚集了大量矽半導體公司。", "region": "科技"}, {"id": "tc-080", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 1, "type": "choice", "question": "電子產品規格上常見的「IC」，中文是什麼？", "options": ["感應線圈", "絕緣塗層", "積體電路", "印刷電池"], "answer": 2, "explanation": "IC 是 Integrated Circuit 的縮寫，指把大量電晶體等元件整合在一小片半導體上的電路。", "fun_fact": "積體電路一九五八年問世前，電子設備得靠一顆顆電晶體手工接線組裝。", "region": "科技"}, {"id": "tc-081", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 2, "type": "choice", "question": "半導體業經常提到的「摩爾定律」，說的是什麼？", "options": ["晶片的售價每兩年會下降一半", "晶圓直徑每十年會增加一倍", "螢幕解析度每年都提升一倍", "電晶體數量約每兩年翻一倍"], "answer": 3, "explanation": "摩爾觀察到積體電路上可容納的電晶體數量大約每兩年增加一倍，這個趨勢推動了數十年的效能成長。", "fun_fact": "摩爾定律是經驗觀察而非物理定律，業界其實是把它當成努力達成的目標在追。", "region": "科技"}, {"id": "tc-082", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 2, "type": "choice", "question": "半導體業說的「無晶圓廠（fabless）」公司，是什麼樣的公司？", "options": ["只做封裝與測試，不碰電路設計", "只做 IC 設計，不自己製造", "只賣半導體機台，不生產晶片", "只做通路批發，不投入研發"], "answer": 1, "explanation": "fabless 公司專注於晶片設計與銷售，自己不蓋昂貴的晶圓廠，把製造委託給晶圓代工廠。", "fun_fact": "設計與製造分工的商業模式，正是晶圓代工興起後才成立的產業結構。", "region": "科技"}, {"id": "tc-083", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 2, "type": "choice", "question": "業界常說的「十二吋晶圓」，十二吋指的是什麼？", "options": ["圓形矽晶片的直徑", "單顆晶片的對角線", "無塵室天花板高度", "一片晶圓的總厚度"], "answer": 0, "explanation": "晶圓是圓形的矽薄片，十二吋（約三百公釐）指的是它的直徑；直徑越大，一片能切出的晶片越多。", "fun_fact": "從八吋換到十二吋，單片面積增加超過一倍，是壓低單顆成本的重要一步。", "region": "科技"}, {"id": "tc-084", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 3, "type": "choice", "question": "先進製程使用的 EUV（極紫外光）微影設備，主要好處是什麼？", "options": ["可以省下所有化學清洗步驟", "能讓晶圓的尺寸做得更大", "用更短波長刻出更細線路", "能直接把晶片封裝進外殼"], "answer": 2, "explanation": "微影能畫多細，受限於光的波長。EUV 波長只有十三點五奈米，遠短於原本的深紫外光，才能刻出更精細的電路。", "fun_fact": "EUV 光會被空氣吸收，整套曝光過程必須在真空中進行。", "region": "科技"}, {"id": "tc-085", "topic": "tech", "category": "半導體與台灣產業", "difficulty": 3, "type": "choice", "question": "半導體產業鏈裡的「封裝測試」，主要在做什麼？", "options": ["設計晶片內部的電路邏輯", "把矽原料拉成單晶晶柱", "在晶圓上塗光阻並曝光", "把晶粒裝進外殼並做檢測"], "answer": 3, "explanation": "晶圓製造完成後要切割成一顆顆晶粒，封裝廠替它接上接腳、裝進保護外殼，再測試功能是否正常。", "fun_fact": "先進封裝可以把多顆不同製程的晶粒疊合在一起，成為近年提升效能的另一條路。", "region": "科技"}, {"id": "tc-086", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "同樣的聲音，在下列哪一種介質中傳播得最快？", "options": ["空氣", "水", "鋼鐵", "真空"], "answer": 2, "explanation": "聲音靠介質粒子的振動一個接一個傳遞，粒子排列越緊密傳得越快，所以固體最快、液體次之、氣體最慢；真空中沒有介質，聲音根本無法傳播。", "fun_fact": "聲音在空氣中約每秒 340 公尺，在水中約 1500 公尺，在鋼鐵中可達每秒約 5000 公尺。", "region": "科技"}, {"id": "tc-087", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "家電上標示的「110V」，其中的 V（伏特）量的是什麼？", "options": ["電壓", "電流", "電阻", "電功率"], "answer": 0, "explanation": "伏特是電壓（電位差）的單位；電流的單位是安培、電阻是歐姆、電功率則是瓦特。", "fun_fact": "台灣一般插座是 110 伏特，冷氣與電熱水器這類大電力設備則多半走 220 伏特專用迴路。", "region": "科技"}, {"id": "tc-088", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "光在真空中的速度，大約是下列哪一個數值？", "options": ["每秒約 3 千公里", "每秒約 3 萬公里", "每秒約 30 萬公里", "每秒約 300 萬公里"], "answer": 2, "explanation": "光速約為每秒 299,792,458 公尺，也就是每秒約 30 萬公里，繞地球赤道一圈只需要大約 0.13 秒。", "fun_fact": "現在的「公尺」反過來由光速定義：1 公尺就是光在真空中行進 1/299792458 秒所走的距離。", "region": "科技"}, {"id": "tc-089", "topic": "tech", "category": "物理與工程", "difficulty": 1, "type": "choice", "question": "打雷時總是先看到閃電，隔幾秒才聽到雷聲，主要原因是什麼？", "options": ["雷聲要比閃電晚幾秒才產生", "閃電釋放的能量比雷聲大很多", "空氣會把低頻的雷聲先擋住", "光的傳播速度遠比聲音快"], "answer": 3, "explanation": "閃電與雷聲幾乎同時發生，但光每秒走 30 萬公里、聲音每秒只走約 340 公尺，距離越遠，兩者抵達的時間差就越大。", "fun_fact": "看到閃電後開始數秒數，再把秒數除以 3，大約就是雷擊處離你幾公里。", "region": "科技"}, {"id": "tc-090", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "一個 10 歐姆的電阻通過 2 安培的電流，它兩端的電壓是多少？", "options": ["5 伏特", "12 伏特", "20 伏特", "0.2 伏特"], "answer": 2, "explanation": "依歐姆定律 V = I × R，電壓等於電流乘以電阻，2 安培 × 10 歐姆 = 20 伏特。", "fun_fact": "歐姆在 1827 年提出這個關係時幾乎被同行忽視，直到十多年後才獲得肯定，電阻單位也因此以他命名。", "region": "科技"}, {"id": "tc-091", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "吊重物時若只裝一個固定在上方的「定滑輪」，它的作用是什麼？", "options": ["可以把需要的施力減少一半", "只改變施力方向，不省力", "可以讓重物自動輕鬆上升", "把重物的實際重量減半"], "answer": 1, "explanation": "定滑輪的轉軸固定、兩側力臂相等，所以完全不省力，只是把「向下拉」變成「向上升」，比較好使力；要省力必須用動滑輪。", "fun_fact": "動滑輪能讓施力減半，但繩子得多拉一倍長度——省力不省功，這是所有簡單機械共同的鐵則。", "region": "科技"}, {"id": "tc-092", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "晴天時抬頭看到的天空是藍色的，主要原因是什麼？", "options": ["陽光穿過臭氧層之後會變成藍色", "空氣對藍光的散射遠比紅光強", "大氣層裡本來就含有藍色的氣體", "海面把藍色反射到天空上去了"], "answer": 1, "explanation": "陽光進入大氣後被空氣分子散射，波長越短散射越強，藍光被散射到四面八方，我們抬頭才會看到滿天藍光。", "fun_fact": "夕陽偏紅是同一個道理：斜射的陽光要穿過更厚的大氣，藍光幾乎都被散射掉，只剩紅橙光直達眼睛。", "region": "科技"}, {"id": "tc-093", "topic": "tech", "category": "物理與工程", "difficulty": 2, "type": "choice", "question": "保溫瓶的瓶身做成雙層、中間抽成真空，主要是為了阻斷哪兩種熱傳遞方式？", "options": ["輻射與對流", "蒸發與凝結", "輻射與傳導", "傳導與對流"], "answer": 3, "explanation": "傳導與對流都需要介質才能進行，中間抽成真空就幾乎斷了這兩條路；至於不需要介質的輻射，則靠內壁鍍上的反光鏡面反射回去。", "fun_fact": "這種構造由英國科學家杜瓦在 1892 年為了保存低溫液態氣體而發明，所以又叫「杜瓦瓶」。", "region": "科技"}, {"id": "tc-094", "topic": "tech", "category": "物理與工程", "difficulty": 3, "type": "choice", "question": "攝氏與華氏是兩套不同的溫標，在哪一個溫度時，兩者的讀數剛好相同？", "options": ["零下 40 度", "零下 273 度", "正 32 度", "正 100 度"], "answer": 0, "explanation": "華氏與攝氏的換算是 F = 1.8C + 32，令 F 等於 C 解方程式可得 C = −40，所以攝氏零下 40 度就等於華氏零下 40 度。", "fun_fact": "這是唯一不必說明單位的溫度——說「零下四十度」時，講攝氏或華氏都對。", "region": "科技"}, {"id": "tc-095", "topic": "tech", "category": "物理與工程", "difficulty": 3, "type": "choice", "question": "同一個房間裡的金屬椅和木頭椅溫度其實一樣，為什麼摸起來金屬明顯比較冰？", "options": ["金屬的溫度其實比木頭低了幾度", "金屬導熱快，迅速把手的熱帶走", "金屬表面比較光滑，摩擦力較小", "木頭本身會緩慢地自己產生熱量"], "answer": 1, "explanation": "皮膚感覺到的其實不是溫度本身，而是熱量流失的快慢。金屬導熱係數高，一接觸就把手上的熱迅速抽走，所以覺得特別冰。", "fun_fact": "同理，冬天摸金屬門把特別冷、夏天踩柏油路特別燙，都是導熱快慢在騙你的觸覺。", "region": "科技"}, {"id": "tc-096", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "太陽系的八大行星中，體積與質量都最大的是哪一顆？", "options": ["土星", "木星", "天王星", "海王星"], "answer": 1, "explanation": "木星的直徑約為地球的 11 倍，質量比其他七顆行星加起來還要大上一倍以上。", "fun_fact": "木星表面的「大紅斑」是一個已經持續數百年的巨大風暴，大到足以把整顆地球裝進去。", "region": "科技"}, {"id": "tc-097", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "天文學上常講的「一光年」，是哪一種量的單位？", "options": ["時間", "距離", "亮度", "質量"], "answer": 1, "explanation": "一光年是光在真空中行進一年所走的距離，約 9.46 兆公里，專門用來描述恆星之間的遙遠距離。", "fun_fact": "離太陽最近的恆星「比鄰星」約 4.2 光年遠，代表我們現在看到的它，其實是四年多以前的模樣。", "region": "科技"}, {"id": "tc-098", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "1969 年阿波羅 11 號任務中，第一個踏上月球表面的太空人是誰？", "options": ["巴茲·艾德林", "麥可·柯林斯", "尼爾·阿姆斯壯", "尤里·加加林"], "answer": 2, "explanation": "阿姆斯壯先走出登月艙，艾德林隨後成為第二人，柯林斯則留守繞月的指揮艙；加加林是 1961 年首位進入太空的人，與登月任務無關。", "fun_fact": "他那句「這是我個人的一小步，卻是人類的一大步」，是踏上月面時透過無線電傳回地球的。", "region": "科技"}, {"id": "tc-099", "topic": "tech", "category": "太空與天文", "difficulty": 1, "type": "choice", "question": "地球上之所以會有春夏秋冬四季，最主要的原因是什麼？", "options": ["地球自轉軸相對公轉面是傾斜的", "地球繞太陽的公轉軌道是橢圓形", "太陽本身的亮度會週期性地變化", "月球的引力週期性改變地球氣候"], "answer": 0, "explanation": "地軸約傾斜 23.5 度，使同一地點一年當中接收到的陽光角度與日照長度不斷改變，才產生冷熱之別；與地球離太陽遠近幾乎無關。", "fun_fact": "地球其實在每年一月初離太陽最近，而那正是北半球的隆冬；南北半球季節相反，也直接推翻了「遠近說」。", "region": "科技"}, {"id": "tc-100", "topic": "tech", "category": "太空與天文", "difficulty": 2, "type": "choice", "question": "我們在地球上永遠只看得到月球的同一面，這是為什麼？", "options": ["月球本身完全不會自轉，只繞著地球", "月球有一半的表面永遠照不到陽光", "地球的自轉剛好把另外半面遮住了", "月球自轉一圈的時間等於公轉一圈"], "answer": 3, "explanation": "這叫「潮汐鎖定」：月球的自轉週期與繞地球公轉的週期都約 27.3 天，兩者同步，所以永遠以同一面朝向我們。", "fun_fact": "月球背面一直要到 1959 年蘇聯「月球 3 號」探測器繞過去拍照，人類才第一次見到它的樣子。", "region": "科技"}, {"id": "tc-101", "topic": "tech", "category": "太空與天文", "difficulty": 2, "type": "choice", "question": "火箭在幾乎真空的太空中沒有空氣可以推，為什麼還能繼續加速？", "options": ["靠太陽風從後面吹著推進", "靠地球磁場的拉力牽引", "靠高速噴出燃氣的反作用力", "靠殘留的稀薄空氣提供反作用力"], "answer": 2, "explanation": "依牛頓第三運動定律，火箭向後高速噴出大量燃氣，燃氣就對火箭施加大小相等、方向相反的推力，完全不需要外界有東西可以推。", "fun_fact": "火箭在真空中效率反而更好——既沒有空氣阻力，也沒有大氣壓力抵消噴嘴的推力。", "region": "科技"}, {"id": "tc-102", "topic": "tech", "category": "太空與天文", "difficulty": 2, "type": "choice", "question": "國際太空站裡的太空人會飄浮起來，主要是因為什麼？", "options": ["太空站的高度已經超出地球引力範圍", "太空站與太空人一起繞著地球落下", "太空站內部刻意抽成了真空的狀態", "太空站用磁場抵消掉了地球的重力"], "answer": 1, "explanation": "太空站約在 400 公里高，那裡的地球重力仍有地表的九成左右；飄浮是因為太空站與人以相同速度不斷「墜向地球」卻一直落空，處於自由落體狀態。", "fun_fact": "所以正確說法是「微重力」而非「無重力」——太空站等於一直在墜落，只是橫向速度夠快，永遠掉不到地面。", "region": "科技"}, {"id": "tc-103", "topic": "tech", "category": "太空與天文", "difficulty": 3, "type": "choice", "question": "黑洞的「事件視界（event horizon）」指的是什麼？", "options": ["黑洞中心密度無限大的那一點", "黑洞周圍高速旋轉的發光吸積盤", "連光都無法再逃出來的那道邊界", "黑洞把周圍恆星撕碎的作用範圍"], "answer": 2, "explanation": "事件視界是黑洞的「不歸點」，一旦越過，任何物質與訊號（包括光）都再也無法傳回外界，因此我們看不到裡面發生什麼事。", "fun_fact": "2019 年公布的第一張黑洞影像，拍到的其實是事件視界外側發光物質形成的亮環，以及中央那片陰影。", "region": "科技"}, {"id": "tc-104", "topic": "tech", "category": "太空與天文", "difficulty": 3, "type": "choice", "question": "把望遠鏡花大錢送上太空軌道，最主要的好處是什麼？", "options": ["在太空中的望遠鏡可以造得更大更重", "距離觀測的天體更近，看起來更大", "太空中沒有重力，鏡片就不會變形", "避開大氣的擾動與吸收，影像更清晰"], "answer": 3, "explanation": "大氣湍流會讓星光閃爍模糊，大氣也會吸收紫外線與大部分紅外線；到了大氣層之外，這兩個問題都不存在。", "fun_fact": "「離天體更近」完全幫不上忙——幾百公里的軌道高度，比起動輒以光年計的距離根本可以忽略不計。", "region": "科技"}, {"id": "tc-105", "topic": "tech", "category": "生物與醫學科技", "difficulty": 1, "type": "choice", "question": "DNA 分子的立體結構，一般被形容成什麼形狀？", "options": ["雙螺旋", "正六邊形", "同心圓環", "正四面體"], "answer": 0, "explanation": "1953 年華生與克里克提出 DNA 由兩條長鏈互相纏繞成雙螺旋，中間以鹼基配對相連，看起來像一座旋轉樓梯。", "fun_fact": "推導這個結構的關鍵證據，是富蘭克林（Rosalind Franklin）拍下的 X 光繞射影像「51 號照片」。", "region": "科技"}, {"id": "tc-106", "topic": "tech", "category": "生物與醫學科技", "difficulty": 1, "type": "choice", "question": "疫苗之所以能預防疾病，最基本的原理是什麼？", "options": ["直接殺死已經侵入體內的病原體", "中和血液中累積的各種有害毒素", "替身體補充對抗疾病所需的營養", "讓免疫系統先認識病原並記住它"], "answer": 3, "explanation": "疫苗把減毒的病原、病原的片段或製造片段的指令送進體內，訓練免疫系統產生抗體與記憶細胞；真正遇到病原時，身體就能快速反應。", "fun_fact": "世界上第一支疫苗是 1796 年金納用牛痘預防天花；vaccine 這個字正源自拉丁文的「牛」。", "region": "科技"}, {"id": "tc-107", "topic": "tech", "category": "生物與醫學科技", "difficulty": 1, "type": "choice", "question": "感冒時醫師常說「抗生素對你沒用」，因為抗生素主要是用來對付什麼？", "options": ["細菌", "病毒", "黴菌", "過敏原"], "answer": 0, "explanation": "抗生素攻擊的是細菌特有的構造（例如細胞壁）或代謝途徑，而多數感冒由病毒引起，吃抗生素不但無效，還會篩選出抗藥性細菌。", "fun_fact": "1928 年弗萊明的培養皿被黴菌污染，他注意到黴菌周圍的細菌都死光了，因而發現了青黴素。", "region": "科技"}, {"id": "tc-108", "topic": "tech", "category": "生物與醫學科技", "difficulty": 2, "type": "choice", "question": "DNA 的兩股之間靠鹼基兩兩配對相連，其中腺嘌呤（A）固定和誰配對？", "options": ["鳥嘌呤（G）", "胸腺嘧啶（T）", "胞嘧啶（C）", "尿嘧啶（U）"], "answer": 1, "explanation": "DNA 的配對規則是 A 對 T、G 對 C；尿嘧啶（U）只出現在 RNA 中，在那裡取代 T 的位置與 A 配對。", "fun_fact": "正因為配對規則固定，只要知道其中一股的序列就能推出另一股，這也是 DNA 能精準複製的關鍵。", "region": "科技"}, {"id": "tc-109", "topic": "tech", "category": "生物與醫學科技", "difficulty": 2, "type": "choice", "question": "照 X 光時，為什麼骨頭在影像上會呈現白色？", "options": ["骨頭會把 X 光反射回底片上", "骨頭本身會發出微弱的螢光", "骨頭密度高，吸收掉較多 X 光", "骨頭表面塗有顯影用的藥劑"], "answer": 2, "explanation": "X 光穿過人體後打在偵測器上，穿透越多的地方顯示越黑；含鈣的骨骼吸收多、讓 X 光穿過去的少，因此留下白色影像。", "fun_fact": "1895 年侖琴發現 X 光後，第一張人體 X 光片拍的是他太太的手，她看到自己的骨頭時說：「我看見我的死亡了。」", "region": "科技"}, {"id": "tc-110", "topic": "tech", "category": "生物與醫學科技", "difficulty": 2, "type": "choice", "question": "正常人的體細胞裡，總共有多少條染色體？", "options": ["23 條", "46 條", "64 條", "92 條"], "answer": 1, "explanation": "人類體細胞有 23 對、合計 46 條染色體，其中一對是性染色體；精子與卵子這類生殖細胞則各只帶 23 條。", "fun_fact": "染色體數量跟生物複雜程度沒有關係——狗有 78 條，某些蕨類植物甚至超過一千條。", "region": "科技"}, {"id": "tc-111", "topic": "tech", "category": "生物與醫學科技", "difficulty": 3, "type": "choice", "question": "電子顯微鏡能看到比光學顯微鏡細小得多的構造，關鍵原因是什麼？", "options": ["電子顯微鏡的鏡片磨得更加精密", "放大倍率的旋鈕可以調得更高", "樣本放在真空中會自然變得清晰", "電子束的波長遠比可見光短"], "answer": 3, "explanation": "顯微鏡能分辨的最小尺度受限於所用的波長，可見光波長約 400 到 700 奈米，高速電子的等效波長卻可短到千分之一奈米等級，因此能看到接近原子的細節。", "fun_fact": "代價是樣本通常得置於真空中、還要鍍上導電薄膜，所以電子顯微鏡多半看不了活生生的生物。", "region": "科技"}, {"id": "tc-112", "topic": "tech", "category": "生物與醫學科技", "difficulty": 3, "type": "choice", "question": "醫院的 MRI（磁振造影）和 CT（電腦斷層）相比，最關鍵的差別是什麼？", "options": ["不用游離輻射，靠磁場與電波成像", "檢查所需要的時間遠比電腦斷層短", "只能用來檢查骨骼與關節部位病變", "一定要先注射顯影劑才能取得影像"], "answer": 0, "explanation": "CT 是用 X 光從多個角度掃描再重建影像；MRI 則以強磁場排列人體內的氫原子核，再用無線電波激發並接收訊號，沒有游離輻射，對軟組織的對比也更好。", "fun_fact": "因為磁場極強，受檢者身上不能有鐵磁性金屬——國外曾發生過氧氣鋼瓶被吸進機器造成傷亡的意外。", "region": "科技"}, {"id": "tc-113", "topic": "tech", "category": "交通與能源", "difficulty": 1, "type": "choice", "question": "現在的電動車與手機，絕大多數使用哪一類可充電電池？", "options": ["鉛酸電池", "鎳氫電池", "鋰離子電池", "拋棄式鹼性電池"], "answer": 2, "explanation": "鋰離子電池能量密度高、重量輕、可反覆充放電，是目前電動車與行動裝置的主流；鹼性電池則是不能充電的一次性電池。", "fun_fact": "鋰離子電池的三位開發者古迪納夫、惠廷安與吉野彰共同獲得 2019 年諾貝爾化學獎，當時古迪納夫 97 歲，是史上最年長的得主。", "region": "科技"}, {"id": "tc-114", "topic": "tech", "category": "交通與能源", "difficulty": 1, "type": "choice", "question": "飛機能夠飛在空中，最主要是靠什麼力量克服重力？", "options": ["機翼在空氣中產生的升力", "機身裡填充的輕質氣體", "引擎持續向下噴射的氣流", "高空的氣壓把飛機往上頂"], "answer": 0, "explanation": "機翼快速穿過空氣時，上下表面的氣流速度與壓力不同，形成向上的升力；引擎的推力則負責讓飛機取得足夠的前進速度。", "fun_fact": "這也是飛機起降要逆風的原因——迎面而來的風提高了機翼相對空氣的速度，可以縮短需要的跑道長度。", "region": "科技"}, {"id": "tc-115", "topic": "tech", "category": "交通與能源", "difficulty": 1, "type": "choice", "question": "目前世界各地運轉中的核能發電廠，是利用哪一種反應產生熱？", "options": ["核融合", "核分裂", "化學燃燒", "放射性衰變"], "answer": 1, "explanation": "商用核電廠靠鈾原子核被中子撞擊後分裂成較小的原子核並釋放大量能量，再用這些熱把水變成蒸汽推動渦輪發電。", "fun_fact": "太陽發光靠的則是核融合——把氫融合成氦；地面上的核融合發電至今仍停留在研究與實驗階段。", "region": "科技"}, {"id": "tc-116", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "汽油引擎的「四行程循環」，正確的順序是下列哪一個？", "options": ["壓縮 → 進氣 → 排氣 → 動力", "進氣 → 壓縮 → 動力 → 排氣", "動力 → 進氣 → 壓縮 → 排氣", "進氣 → 動力 → 壓縮 → 排氣"], "answer": 1, "explanation": "活塞先吸入油氣混合（進氣），再把它壓縮，接著由火星塞點火推動活塞做功（動力），最後把廢氣推出汽缸（排氣）。", "fun_fact": "這個循環由德國工程師奧托在 1876 年實用化，因此又叫「奧托循環」；柴油引擎則靠壓縮產生的高溫自行點燃，不需要火星塞。", "region": "科技"}, {"id": "tc-117", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "下列哪一種能源「不」屬於再生能源？", "options": ["風力", "地熱", "天然氣", "太陽能"], "answer": 2, "explanation": "天然氣是化石燃料，蘊藏量有限、燃燒也會排放二氧化碳；風力、地熱與太陽能則可以持續取得、不會耗竭。", "fun_fact": "天然氣常被稱作「比較乾淨的化石燃料」，因為發同樣一度電的二氧化碳排放量約只有燃煤的一半，但它依然不是再生能源。", "region": "科技"}, {"id": "tc-118", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "電動車與油電混合車的「再生煞車」，在減速時做了什麼事？", "options": ["馬達反轉成發電機，把電充回電池", "把多餘的動能轉成熱能排到車外去", "自動切換到低速檔位以增加阻力", "放出反向的氣流讓車身產生風阻"], "answer": 0, "explanation": "減速時車輪反過來帶動馬達，讓它變成發電機，把車子的動能轉成電能回充電池，同時產生制動力，因此既省煞車皮又能增加續航。", "fun_fact": "傳統車輛煞車時，動能全部變成碟盤的熱白白散掉；在走走停停的市區路況，再生煞車的回收效益最明顯。", "region": "科技"}, {"id": "tc-119", "topic": "tech", "category": "交通與能源", "difficulty": 2, "type": "choice", "question": "行動電源上標示的「10000 mAh」，這個數字描述的是什麼？", "options": ["充飽這顆電池所需要的總時間", "電池輸出時的最高電壓數值", "電池可以重複充電的總次數", "電池可以儲存的電荷容量"], "answer": 3, "explanation": "mAh（毫安培小時）是電荷量的單位，10000 mAh 表示理論上可以用 1000 毫安培的電流連續供電約 10 小時。", "fun_fact": "比較兩顆行動電源不能只看 mAh，還得看電壓——真正的能量是電壓乘以電荷量，單位是瓦時（Wh）。", "region": "科技"}, {"id": "tc-120", "topic": "tech", "category": "交通與能源", "difficulty": 3, "type": "choice", "question": "長距離輸電時，電力公司會先把電壓升到數十萬伏特再送出去，為什麼？", "options": ["高電壓可以讓電流傳得比較遠", "高電壓的電線比較不容易被雷擊中", "電壓越高電線的絕緣層就越安全", "電流變小，電線發熱的損耗大減"], "answer": 3, "explanation": "輸電線的損耗與電流的平方成正比，在輸送功率固定的情況下把電壓升高，電流就等比例變小，損耗以平方倍下降；到了用戶端再用變壓器降壓。", "fun_fact": "這正是十九世紀末「電流大戰」中交流電勝出的關鍵——交流電可以用變壓器輕鬆升壓降壓，當年的直流電做不到。", "region": "科技"}, {"id": "tc-121", "topic": "tech", "category": "數學與度量", "difficulty": 1, "type": "choice", "question": "圓周率 π 是圓的哪兩個量相除得到的比值？", "options": ["面積與半徑", "周長與半徑", "面積與直徑", "周長與直徑"], "answer": 3, "explanation": "π 的定義就是圓周長除以直徑，約等於 3.14159；無論圓是大是小，這個比值永遠相同。", "fun_fact": "3 月 14 日因此被稱為「圓周率日」，剛好也是愛因斯坦的生日。", "region": "科技"}, {"id": "tc-122", "topic": "tech", "category": "數學與度量", "difficulty": 1, "type": "choice", "question": "電費單上算的「1 度電」，相當於多少用電量？", "options": ["1000 瓦的電器連續使用一小時", "100 瓦的電器連續使用一小時", "1 瓦的電器連續使用一整天", "1000 瓦的電器連續使用一分鐘"], "answer": 0, "explanation": "1 度電就是 1 千瓦小時（kWh），也就是 1000 瓦的電器連續使用一小時所耗掉的電能。", "fun_fact": "一台 800 瓦的微波爐連續加熱約 75 分鐘，差不多就用掉 1 度電。", "region": "科技"}, {"id": "tc-123", "topic": "tech", "category": "數學與度量", "difficulty": 2, "type": "choice", "question": "數學上與 π 齊名的常數 e（自然對數的底），數值最接近下列何者？", "options": ["1.414", "1.618", "2.718", "3.142"], "answer": 2, "explanation": "e 約等於 2.71828，是自然對數的底，也出現在連續複利、放射性衰變等描述連續成長與衰減的公式裡。", "fun_fact": "另外三個也都是常見常數：1.414 是根號 2、1.618 是黃金比例、3.142 則是圓周率。", "region": "科技"}, {"id": "tc-124", "topic": "tech", "category": "數學與度量", "difficulty": 2, "type": "choice", "question": "一個房間裡大約要有多少人，「至少有兩人同月同日生」的機率才會超過一半？", "options": ["23 人", "60 人", "100 人", "183 人"], "answer": 0, "explanation": "這就是有名的「生日悖論」：要看的是所有人兩兩配對的組合，而不是你和其他人比對，23 人就有 253 種配對，機率因此超過 50%。", "fun_fact": "人數到 70 時機率已超過 99.9%，但若要百分之百保證，仍然需要 367 個人。", "region": "科技"}, {"id": "tc-125", "topic": "tech", "category": "數學與度量", "difficulty": 3, "type": "choice", "question": "密碼學裡的「雜湊函數（hash）」有一個關鍵特性，是下列哪一個？", "options": ["同一份輸入每次算出的結果都不同", "計算的結果可以用金鑰還原回原文", "輸出長度會隨輸入變大而跟著變長", "單向計算，無法由結果反推原文"], "answer": 3, "explanation": "雜湊把任意長度的資料壓成固定長度的值，同樣的輸入永遠得到同樣的結果，但實務上無法從雜湊值反推回原始內容，因此常用來驗證檔案完整性與保存密碼。", "fun_fact": "網站正確的做法是只存密碼的雜湊值並加上隨機的「鹽」，這樣即使資料庫外洩，也不會直接暴露使用者的密碼原文。", "region": "科技"}], "star": [{"id": "st-001", "category": "音樂", "difficulty": 2, "type": "choice", "question": "五月天的團名「Mayday」，原本是哪位團員在BBS上的網路代號？", "options": ["瑪莎", "怪獸", "阿信", "石頭"], "answer": 0, "explanation": "五月天前身是「So Band」，1997年為了報名野台開唱，借用貝斯手瑪莎的BBS代號「MayDay」當團名，並改名「五月天」。", "fun_fact": "「Mayday」同時也是國際通用的無線電求救信號。", "source": "https://zh.wikipedia.org/wiki/%E4%BA%94%E6%9C%88%E5%A4%A9", "asof": "2026-09", "region": "明星", "topic": "star"}, {"id": "st-002", "category": "音樂", "difficulty": 1, "type": "choice", "question": "周杰倫在2000年發行的首張錄音室專輯叫什麼？", "options": ["《葉惠美》", "《八度空間》", "《Jay》", "《范特西》"], "answer":
