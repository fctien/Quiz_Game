"human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-012", "category": "文化", "difficulty": 1, "type": "choice", "question": "媽祖信仰最初主要守護的是哪一類人？", "options": ["商人", "讀書人", "農夫", "航海者與漁民"], "answer": 3, "explanation": "媽祖被視為海上守護神，保佑航海平安。", "fun_fact": "大甲媽祖遶境是台灣最有名的宗教活動之一，徒步行程長達九天八夜。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-013", "category": "文化", "difficulty": 1, "type": "choice", "question": "珍珠奶茶起源於台灣。", "options": ["對", "錯"], "answer": 0, "explanation": "珍珠奶茶在 1980 年代於台灣誕生。", "fun_fact": "到底是哪一家店發明的，台中和台南各有說法。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-014", "category": "文化", "difficulty": 2, "type": "choice", "question": "每年四、五月，客家庄常舉辦以哪一種花為主題的節慶？", "options": ["荷花", "櫻花", "油桐花", "向日葵"], "answer": 2, "explanation": "客家桐花祭在油桐花盛開的季節舉辦。", "fun_fact": "油桐花落滿地像下雪一樣，被稱為「五月雪」。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-015", "category": "文化", "difficulty": 2, "type": "choice", "question": "台語「呷飯皇帝大」的意思最接近下列哪一個？", "options": ["吃飯要有禮貌", "吃太多會變胖", "皇帝吃飯的排場最大", "吃飯最重要，什麼事都等吃完再說"], "answer": 3, "explanation": "意思是吃飯最大，再重要的事也要先讓人好好吃飯。", "fun_fact": "類似的俗語還有「食飯配菜脯，儉錢開店鋪」。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "蘭嶼達悟族最重要的歲時祭儀，與哪一種魚的季節洄游有關？", "options": ["鮭魚", "虱目魚", "飛魚", "鯛魚"], "answer": 2, "explanation": "每年春夏飛魚隨黑潮而來，達悟族依飛魚季節安排祭儀、捕撈與生活禁忌。", "fun_fact": "達悟族傳統的拼板舟由許多木板拼接而成，船頭常雕有象徵「船眼」的同心圓圖案。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-040", "category": "文化", "difficulty": 3, "type": "choice", "question": "每兩年舉辦一次、每十年一次大祭的「矮靈祭」，是哪一族的祭典？", "options": ["賽夏族", "阿美族", "布農族", "排灣族"], "answer": 0, "explanation": "矮靈祭（paSta'ay）是賽夏族最重要的祭典，主要在苗栗南庄與新竹五峰舉行。", "fun_fact": "相傳矮人曾教導賽夏族農耕與歌舞，後來雙方發生衝突，族人便以祭典安撫矮靈。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-041", "category": "文化", "difficulty": 2, "type": "choice", "question": "以「八部合音」（祈禱小米豐收歌）聞名的原住民族是？", "options": ["布農族", "達悟族", "魯凱族", "泰雅族"], "answer": 0, "explanation": "布農族的「祈禱小米豐收歌」（pasibutbut）以多聲部合唱著稱，俗稱八部合音。", "fun_fact": "1943 年日本學者黑澤隆朝來台調查時錄下這首歌，1952 年將錄音寄給國際民俗音樂協會，引起西方音樂學界的注意。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-042", "category": "文化", "difficulty": 3, "type": "choice", "question": "過去以「紋面」象徵成年，女子要擅長織布才能紋面的原住民族是？", "options": ["泰雅族", "阿美族", "排灣族", "達悟族"], "answer": 0, "explanation": "泰雅族傳統上男子要能狩獵、女子要會織布，才有資格紋面，象徵成年與榮耀。", "fun_fact": "除了泰雅族，太魯閣族和賽德克族也有紋面傳統。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-043", "category": "文化", "difficulty": 2, "type": "choice", "question": "台南小吃「棺材板」的外皮，是用什麼做成的？", "options": ["蛋皮", "厚片吐司", "麵餅", "米糕"], "answer": 1, "explanation": "棺材板是把厚片吐司炸酥後挖空，填入雞肉、海鮮、蔬菜等勾芡內餡，再蓋上吐司蓋。", "fun_fact": "據說它原本叫「雞肝板」，後來有位教授覺得外型像棺材，才有了這個名字。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-044", "category": "文化", "difficulty": 3, "type": "choice", "question": "客家人在農曆正月二十過「天穿日」，是紀念哪一位神話人物？", "options": ["嫦娥", "女媧", "盤古", "后羿"], "answer": 1, "explanation": "相傳女媧在這一天煉石補天，所以稱為「天穿日」。", "fun_fact": "客家委員會曾在 2010 年將天穿日訂為「全國客家日」，2022 年起改為 12 月 28 日的「還我母語運動日」。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-045", "category": "文化", "difficulty": 1, "type": "choice", "question": "台語俗諺「呷緊弄破碗」的意思是？", "options": ["動作快的人比較能幹", "吃飯時要小心拿好碗", "打破碗會帶來好運", "做事太急反而容易出錯"], "answer": 3, "explanation": "字面意思是吃太快會把碗打破，比喻做事心急反而會壞事。", "fun_fact": "意思和成語「欲速則不達」很接近。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-046", "category": "文化", "difficulty": 2, "type": "choice", "question": "民間俗稱「土地公」的神明，正式名稱是？", "options": ["開漳聖王", "福德正神", "保生大帝", "清水祖師"], "answer": 1, "explanation": "土地公的正式神號是「福德正神」，是台灣最普遍的民間信仰神明之一。", "fun_fact": "農曆二月初二土地公生是商家的「頭牙」，十二月十六的「尾牙」也是祭拜土地公的日子。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-047", "category": "文化", "difficulty": 2, "type": "choice", "question": "電視布袋戲《雲州大儒俠》的主角是誰？", "options": ["史艷文", "素還真", "楚留香", "孫悟空"], "answer": 0, "explanation": "《雲州大儒俠》由黃俊雄製作，1970 年在台視播出，主角史艷文紅遍全台。", "fun_fact": "據說當年收視率一度超過九成，播出時街上幾乎看不到人。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-048", "category": "文化", "difficulty": 2, "type": "choice", "question": "歌仔戲是在台灣發展形成的戲曲，一般認為起源於宜蘭。", "options": ["對", "錯"], "answer": 0, "explanation": "一般認為歌仔戲由宜蘭一帶的「本地歌仔」發展而來，是少數在台灣形成的傳統戲曲。", "fun_fact": "位於宜蘭五結的國立傳統藝術中心宜蘭傳藝園區，常有歌仔戲演出。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-049", "category": "文化", "difficulty": 1, "type": "choice", "question": "蚵仔煎裡的「蚵仔」指的是蛤蜊。", "options": ["對", "錯"], "answer": 1, "explanation": "蚵仔指的是牡蠣，蛤蜊在台語中則叫「蚶仔」或「粉蟯」。", "fun_fact": "蚵仔煎的粉漿主要用番薯粉調製，才會有 Q 彈的口感。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-050", "category": "文化", "difficulty": 1, "type": "choice", "question": "台灣民間的「中元普渡」是在農曆八月十五日。", "options": ["對", "錯"], "answer": 1, "explanation": "中元節是農曆七月十五日；農曆八月十五日是中秋節。", "fun_fact": "整個農曆七月俗稱「鬼月」，基隆中元祭的放水燈是很有名的活動。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-051", "category": "文化", "difficulty": 1, "type": "order", "question": "請依農曆日期先後排出這些節日：", "options": ["端午節", "元宵節", "七夕", "中秋節"], "answer": [1, 0, 2, 3], "explanation": "元宵節正月十五 → 端午節五月初五 → 七夕七月初七 → 中秋節八月十五。", "fun_fact": "台南有在七夕為滿 16 歲孩子舉辦「做十六歲」成年禮的習俗。", "topic": "human", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "human-TW-001", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "台灣原住民族中，人口最多的是哪一族？", "options": ["泰雅族", "排灣族", "布農族", "阿美族"], "answer": 3, "explanation": "阿美族主要分布在花東縱谷與海岸山脈一帶，是台灣原住民族中人數最多的族群。", "fun_fact": "阿美族傳統上偏向母系社會，家族事務多由女性繼承。"}, {"id": "human-TW-002", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "鄒族的「庫巴」（kuba）是什麼樣的建築？", "options": ["男子集會訓練的會所", "族人共用的小米穀倉", "頭目家族居住的宅邸", "安放祖先遺骨的家屋"], "answer": 0, "explanation": "庫巴是高架干欄式的男子會所，是鄒族學習文化知識與狩獵、戰鬥訓練的場所，重要祭儀也在此舉行。", "fun_fact": "庫巴旁通常種有一棵神聖的赤榕，祭典時族人會圍繞它進行儀式。"}, {"id": "human-TW-003", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "排灣族五年祭（Maljeveq）最著名的儀式是什麼？", "options": ["射日", "賽跑", "刺球", "盪鞦韆"], "answer": 2, "explanation": "族人手持十幾公尺長的竹竿，爭相刺向祭司拋向空中的藤球，用以祈福並趨吉避凶。", "fun_fact": "每顆祭球代表不同涵義，從象徵邪靈的第一顆，到象徵健康、財富與豐收的後續各球。"}, {"id": "human-TW-004", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "魯凱族視為聖花、常配戴在頭飾上的是哪一種花？", "options": ["山櫻花", "朱槿花", "百合花", "野薑花"], "answer": 2, "explanation": "百合花在魯凱族文化中象徵貞潔、勇氣與榮譽，男子要有狩獵功績、女子要品行端正才能配戴。", "fun_fact": ""}, {"id": "human-TW-005", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "邵族的傳統居住地位在哪一座湖泊周邊？", "options": ["鯉魚潭", "日月潭", "龍鑾潭", "澄清湖"], "answer": 1, "explanation": "邵族世居南投日月潭一帶，主要聚落在魚池鄉伊達邵。", "fun_fact": "邵族婦女以木杵敲擊石板演奏的「杵音」，原本是用來召喚山上打獵的男人回部落。"}, {"id": "human-TW-006", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "噶瑪蘭族原本的居住地是哪一片平原？", "options": ["蘭陽平原", "嘉南平原", "屏東平原", "彰化平原"], "answer": 0, "explanation": "噶瑪蘭族原居宜蘭的蘭陽平原，十八世紀末後被迫南遷到花蓮、台東沿海一帶。", "fun_fact": ""}, {"id": "human-TW-007", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "台灣原住民族的語言屬於哪一個語系？", "options": ["南島語系", "漢藏語系", "阿爾泰語系", "南亞語系"], "answer": 0, "explanation": "台灣原住民族語言全屬南島語系，且保留了該語系中最分歧的語言分支。", "fun_fact": "不少語言學者認為台灣是南島語族向太平洋與印度洋擴散的起點。"}, {"id": "human-TW-008", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台語裡說的「牽手」，指的是誰？", "options": ["自己的太太", "自己的母親", "自己的姊姊", "自己的女兒"], "answer": 0, "explanation": "台語「牽手」（khan-tshiú）是妻子、太太的意思。", "fun_fact": ""}, {"id": "human-TW-009", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台語「鬥跤手」的意思最接近下列哪一個？", "options": ["吵架", "散步", "偷懶", "幫忙"], "answer": 3, "explanation": "「鬥跤手」（tàu-kha-tshiú）是幫忙、幫人做事或解決困難的意思。", "fun_fact": ""}, {"id": "human-TW-010", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "台語裡的「歐巴桑」「多桑」是從哪種語言借來的？", "options": ["日語", "英語", "荷蘭語", "西班牙語"], "answer": 0, "explanation": "台語在日治時期吸收了大量日語借詞，「歐巴桑」「多桑」都是其中的例子。", "fun_fact": ""}, {"id": "human-TW-011", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "客語裡向人道謝時說的「承蒙你」，意思是？", "options": ["對不起", "請進來", "恭喜你", "謝謝你"], "answer": 3, "explanation": "「承蒙你」是客語中受人幫助時表達感謝的客套話。", "fun_fact": "這句話主要是海陸腔的講法，四縣腔道謝多說「恁仔細」。"}, {"id": "human-TW-012", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "台灣客語的兩大優勢腔是哪兩種？", "options": ["四縣腔與海陸腔", "大埔腔與饒平腔", "詔安腔與永定腔", "長樂腔與詔安腔"], "answer": 0, "explanation": "台灣客語以四縣腔與海陸腔使用人口最多，公共場合的客語播音多採四縣腔。", "fun_fact": "客語各腔調常被合稱為「四海永樂大平安」，各取一字而成。"}, {"id": "human-TW-013", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "屏東東港的迎王平安祭典多久舉行一次？", "options": ["每年一次", "五年一次", "十年一次", "三年一次"], "answer": 3, "explanation": "東港迎王平安祭典為「三年一科」，祭典尾聲的燒王船最為震撼。", "fun_fact": ""}, {"id": "human-TW-014", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "大甲媽祖遶境進香的折返點是哪一間廟？", "options": ["北港朝天宮", "新港奉天宮", "鹿港天后宮", "彰化南瑤宮"], "answer": 1, "explanation": "大甲鎮瀾宮媽祖九天八夜的遶境，南下的終點是嘉義新港奉天宮，再折返大甲。", "fun_fact": ""}, {"id": "human-TW-015", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "白沙屯媽祖進香最特別的地方是什麼？", "options": ["路線由神轎臨時決定", "全程都在夜間行進", "每年都走同一條路", "只走高速公路"], "answer": 0, "explanation": "白沙屯媽祖進香沒有事先規劃的固定路線，行進方向由神轎當下決定；又因鑾轎頂覆蓋粉紅色帆布、行進速度極快，信眾暱稱為「粉紅超跑」。", "fun_fact": ""}, {"id": "human-TW-016", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台南著名的「做十六歲」成年禮，通常在哪個節日舉行？", "options": ["端午節", "七夕（七娘媽生）", "中元節", "冬至"], "answer": 1, "explanation": "府城在農曆七月七日七娘媽生日這天為滿十六歲的青少年舉行成年禮，一生只做一次。", "fun_fact": ""}, {"id": "human-TW-017", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "民俗活動「搶孤」中最著名的頭城搶孤，在哪一個縣市？", "options": ["新竹縣", "雲林縣", "宜蘭縣", "台東縣"], "answer": 2, "explanation": "頭城搶孤在宜蘭縣頭城鎮舉行，參賽者要攀上塗滿牛油的孤棚搶奪祭品與順風旗。", "fun_fact": ""}, {"id": "human-TW-018", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "台東元宵節「炮炸寒單爺」裡的寒單爺，被視為哪一類神明？", "options": ["醫藥神", "武財神", "海神", "土地神"], "answer": 1, "explanation": "寒單爺一般被認為是趙公明，民間視為武財神；相傳他怕冷，所以信眾投擲鞭炮為他驅寒。", "fun_fact": "肉身寒單爺只穿短褲、手持榕樹葉，站在四人扛的椅轎上接受炮炸。"}, {"id": "human-TW-019", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "三山國王常被視為台灣哪一個族群帶來的守護神？", "options": ["泉州人", "客家人", "漳州人", "福州人"], "answer": 1, "explanation": "三山國王源自廣東潮州一帶的巾山、明山、獨山三位山神，隨潮州移民傳入台灣。因早期潮州移民中客家人比例高，民間常把它當成客家人的守護神；但學者指出宜蘭等地的三山國王廟多由福佬人興建，並非客家專屬信仰。", "fun_fact": ""}, {"id": "human-TW-020", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "有「全臺首學」之稱的是下列哪一座建築？", "options": ["彰化孔廟", "臺北孔廟", "臺南孔廟", "高雄孔廟"], "answer": 2, "explanation": "臺南孔廟創建於明鄭時期，清領初期曾是全台童生唯一的入學之處，故有「全臺首學」之譽。", "fun_fact": ""}, {"id": "human-TW-021", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "民間信仰中的保生大帝，主要掌管什麼？", "options": ["科舉功名", "航海平安", "醫藥治病", "農作豐收"], "answer": 2, "explanation": "保生大帝本名吳夲，是北宋泉州同安的名醫，過世後被奉為醫神，俗稱「大道公」。", "fun_fact": ""}, {"id": "human-TW-022", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "被譽為「台灣交趾陶第一人」的匠師是誰？", "options": ["洪坤福", "葉王", "林添木", "陳三火"], "answer": 1, "explanation": "葉王是嘉義人，也是第一位台灣本地出身的交趾陶藝師，作品被讚為「台灣絕技」。", "fun_fact": ""}, {"id": "human-TW-023", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "廟宇屋脊上色彩鮮豔的「剪黏」，主要用什麼材料拼貼？", "options": ["彩色瓷片", "彩色玻璃", "貝殼碎片", "琉璃磚塊"], "answer": 0, "explanation": "剪黏又稱剪瓷雕，工匠把彩色瓷碗瓷盤剪敲成小片，再拼貼成人物花鳥，耐曬耐鹹風不褪色。", "fun_fact": ""}, {"id": "human-TW-024", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "傳統三合院裡，正身兩側的廂房通常稱為什麼？", "options": ["門樓", "燕尾", "護龍", "埕斗"], "answer": 2, "explanation": "三合院由正身與兩側的護龍（廂房）組成，因房屋分立三個方向而得名。", "fun_fact": ""}, {"id": "human-TW-025", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "台北大稻埕的霞海城隍廟，以求姻緣拜哪位神明最為出名？", "options": ["註生娘娘", "月下老人", "文昌帝君", "關聖帝君"], "answer": 1, "explanation": "霞海城隍廟的月下老人香火鼎盛，是許多人求姻緣必訪之處。", "fun_fact": ""}, {"id": "human-TW-026", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "布袋戲在台灣還常被稱為什麼戲？", "options": ["皮影戲", "傀儡戲", "掌中戲", "車鼓戲"], "answer": 2, "explanation": "因為演師是用雙手掌控戲偶演出，所以布袋戲又叫掌中戲。", "fun_fact": ""}, {"id": "human-TW-027", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "恆春民謠大師陳達，最著名的伴奏樂器是什麼？", "options": ["二胡", "嗩吶", "洞簫", "月琴"], "answer": 3, "explanation": "陳達彈月琴自彈自唱，把恆春民謠的說唱傳統帶進當代，是台灣民謠採集的代表人物。", "fun_fact": ""}, {"id": "human-TW-028", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台語歌〈望春風〉的作曲者是誰？", "options": ["李臨秋", "周添旺", "鄧雨賢", "楊三郎"], "answer": 2, "explanation": "〈望春風〉1933年問世，由鄧雨賢譜曲，是傳唱最久的台語歌謠之一。", "fun_fact": "鄧雨賢也寫了〈雨夜花〉〈四季紅〉〈月夜愁〉，合稱「四月望雨」。"}, {"id": "human-TW-029", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "被尊為「台灣新文學之父」的作家是誰？", "options": ["楊逵", "鍾理和", "龍瑛宗", "賴和"], "answer": 3, "explanation": "彰化醫師賴和以白話文寫作、提攜後進，被譽為台灣新文學之父，也有「台灣的魯迅」之稱。", "fun_fact": "他行醫仁厚，鄉親叫他「彰化媽祖」。"}, {"id": "human-TW-030", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "小說《亞細亞的孤兒》的作者是誰？", "options": ["張文環", "吳濁流", "呂赫若", "王禎和"], "answer": 1, "explanation": "新竹客家作家吳濁流以主角胡太明的遭遇，寫出殖民地知識分子的身分困境。", "fun_fact": ""}, {"id": "human-TW-031", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "侯孝賢的電影《悲情城市》在哪個影展奪下最高獎？", "options": ["坎城影展", "威尼斯影展", "柏林影展", "東京影展"], "answer": 1, "explanation": "《悲情城市》1989年在威尼斯影展獲得金獅獎，是首部在世界三大影展奪下首獎的台灣電影。", "fun_fact": "電影帶動了拍攝場景九份的再一次繁榮。"}, {"id": "human-TW-032", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "電影《海角七號》的故事發生在哪一個小鎮？", "options": ["屏東恆春", "台東成功", "花蓮玉里", "雲林口湖"], "answer": 0, "explanation": "魏德聖執導的《海角七號》以台灣最南端的屏東恆春鎮為背景。", "fun_fact": ""}, {"id": "human-TW-033", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台南「擔仔麵」名稱中的「擔仔」，在台語裡指什麼？", "options": ["一種大陶碗", "路邊的攤位", "挑東西的扁擔", "小份量的意思"], "answer": 2, "explanation": "「擔仔」（tàⁿ-á）就是挑肩擔的意思，早年小販挑著扁擔沿街叫賣而得名。", "fun_fact": ""}, {"id": "human-TW-034", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 2, "type": "choice", "question": "刈包在台灣民間的俗稱是什麼？", "options": ["龍含珠", "貓吞魚", "獅咬球", "虎咬豬"], "answer": 3, "explanation": "刈包形狀像老虎張口咬住一塊滷豬肉，因此台語俗稱「虎咬豬」。", "fun_fact": "刈包也是尾牙宴常見的菜色，因外型像鼓鼓的錢包，象徵來年發財。"}, {"id": "human-TW-035", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "清涼消暑的「愛玉」，名字是怎麼來的？", "options": ["一位清代官員的封號", "原住民族語的音譯", "日本人取的商品名", "賣愛玉的商人之女的名字"], "answer": 3, "explanation": "連橫《臺灣通史》記載，清道光年間有商人在嘉義山區發現此物，由名叫愛玉的女兒販售而得名。", "fun_fact": ""}, {"id": "human-TW-036", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 3, "type": "choice", "question": "傳統鳳梨酥的內餡，除了鳳梨還常混入什麼？", "options": ["南瓜", "冬瓜", "山藥", "蘋果"], "answer": 1, "explanation": "傳統鳳梨酥多用冬瓜醬混合鳳梨製成，口感較不酸也更軟綿。", "fun_fact": "純土鳳梨製作的則酸度較高，另稱土鳳梨酥。"}, {"id": "human-TW-037", "topic": "human", "unit": "TW", "unit_name": "台灣", "category": "人文", "region": "台灣", "difficulty": 1, "type": "choice", "question": "擂茶是台灣哪一個族群的傳統飲食？", "options": ["閩南人", "原住民族", "荷蘭移民", "客家人"], "answer": 3, "explanation": "擂茶是客家人的傳統茶食，把茶葉、芝麻、花生等材料放進擂缽研磨後沖泡，新竹北埔最為知名。", "fun_fact": ""}, {"id": "cn-005", "category": "文化", "difficulty": 1, "type": "choice", "question": "下列哪一項「不是」中國古代的四大發明？", "options": ["指南針", "火藥", "造紙術", "地動儀"], "answer": 3, "explanation": "四大發明是造紙術、印刷術、火藥和指南針。", "fun_fact": "地動儀是東漢張衡發明的，用來偵測地震的方位。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-006", "category": "文化", "difficulty": 1, "type": "choice", "question": "傳說端午節是為了紀念哪一位人物？", "options": ["屈原", "岳飛", "孔子", "諸葛亮"], "answer": 0, "explanation": "一般流傳端午節是紀念戰國時代楚國的屈原。", "fun_fact": "包粽子、划龍舟，據說都是為了不讓魚蝦吃掉屈原。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-007", "category": "文化", "difficulty": 1, "type": "choice", "question": "十二生肖中排第一的是？", "options": ["鼠", "虎", "龍", "牛"], "answer": 0, "explanation": "十二生肖依序為鼠、牛、虎、兔、龍、蛇、馬、羊、猴、雞、狗、豬。", "fun_fact": "傳說老鼠騎在牛背上，在終點前一跳就搶到了第一名。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-008", "category": "文化", "difficulty": 2, "type": "choice", "question": "京劇臉譜中，紅色臉通常代表什麼性格？", "options": ["忠勇正直", "滑稽搞笑", "兇猛暴躁", "陰險狡詐"], "answer": 0, "explanation": "紅臉象徵忠勇正直。", "fun_fact": "最有名的紅臉就是關公；白臉則常用來表示奸詐，例如曹操。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-009", "category": "文化", "difficulty": 2, "type": "choice", "question": "「學而時習之，不亦說乎」出自哪一部經典？", "options": ["孟子", "道德經", "大學", "論語"], "answer": 3, "explanation": "這句話是《論語》的第一句。", "fun_fact": "這裡的「說」讀作「悅」，意思是快樂。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-010", "category": "文化", "difficulty": 2, "type": "choice", "question": "一般認為《西遊記》的作者是誰？", "options": ["羅貫中", "曹雪芹", "吳承恩", "施耐庵"], "answer": 2, "explanation": "《西遊記》一般認為是明代吳承恩所作。", "fun_fact": "唐僧的原型是唐代真實存在的高僧玄奘。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "在北半球，二十四節氣中白天最長的是哪一個？", "options": ["立夏", "春分", "冬至", "夏至"], "answer": 3, "explanation": "夏至時太陽直射北回歸線，北半球白天最長；冬至則是白天最短。", "fun_fact": "北回歸線通過台灣的嘉義和花蓮，夏至正午時太陽幾乎就在頭頂正上方。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-040", "category": "文化", "difficulty": 3, "type": "choice", "question": "二十四節氣是根據月亮的圓缺（陰曆）制定的。", "options": ["對", "錯"], "answer": 1, "explanation": "二十四節氣是依太陽在黃道上的位置劃分的，其實屬於陽曆系統。", "fun_fact": "所以節氣在國曆上的日期幾乎固定，例如清明大多落在 4 月 4 日或 5 日。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-041", "category": "文化", "difficulty": 1, "type": "choice", "question": "「麻婆豆腐」屬於哪一個菜系？", "options": ["魯菜", "粵菜", "淮揚菜", "川菜"], "answer": 3, "explanation": "麻婆豆腐是四川名菜，以花椒的「麻」和辣椒的「辣」為特色。", "fun_fact": "相傳這道菜出自清代成都一家小飯館的老闆娘，因她臉上有麻子，人稱「陳麻婆」。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-042", "category": "文化", "difficulty": 1, "type": "choice", "question": "名菜「東坡肉」相傳與哪位文人有關？", "options": ["蘇軾", "李白", "白居易", "杜甫"], "answer": 0, "explanation": "蘇軾號東坡居士，相傳他愛吃燉豬肉，東坡肉因此得名。", "fun_fact": "蘇軾還寫過〈豬肉頌〉：「淨洗鐺，少著水，柴頭罨煙焰不起。待他自熟莫催他，火候足時他自美。」", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-043", "category": "文化", "difficulty": 2, "type": "choice", "question": "京劇角色分為「生、旦、淨、丑」，其中「旦」指的是？", "options": ["丑角", "女性角色", "畫臉譜的花臉", "老年男性"], "answer": 1, "explanation": "「旦」是京劇中的女性角色；生是男性，淨是花臉，丑是丑角。", "fun_fact": "早期京劇的旦角多由男性演員扮演，梅蘭芳就是著名的男旦。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-044", "category": "文化", "difficulty": 2, "type": "choice", "question": "被尊為「書聖」，寫下《蘭亭集序》的書法家是？", "options": ["柳公權", "王羲之", "顏真卿", "蘇軾"], "answer": 1, "explanation": "東晉王羲之的行書《蘭亭集序》被譽為「天下第一行書」。", "fun_fact": "相傳《蘭亭集序》真跡被唐太宗帶進陵墓陪葬，今日所見都是摹本。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-045", "category": "文化", "difficulty": 1, "type": "choice", "question": "《三國演義》中「桃園三結義」的三個人，不包括誰？", "options": ["張飛", "趙雲", "關羽", "劉備"], "answer": 1, "explanation": "桃園三結義是劉備、關羽、張飛三人結為兄弟。", "fun_fact": "「桃園結義」是小說情節，正史《三國志》並沒有這段記載。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-046", "category": "文化", "difficulty": 1, "type": "choice", "question": "「文房四寶」不包括下列哪一項？", "options": ["印章", "筆", "墨", "硯"], "answer": 0, "explanation": "文房四寶是筆、墨、紙、硯。", "fun_fact": "其中最有名的是湖筆、徽墨、宣紙和端硯。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-047", "category": "文化", "difficulty": 2, "type": "choice", "question": "成語「朝三暮四」的典故中，被騙的是哪種動物？", "options": ["羊", "猴子", "雞", "馬"], "answer": 1, "explanation": "《莊子．齊物論》記載養猴人說早上給三份、晚上給四份橡實，猴子大怒；改成早上四份、晚上三份，猴子就高興了。", "fun_fact": "這個成語原本是指用手段欺騙人，後來才多用來形容反覆無常。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-048", "category": "文化", "difficulty": 3, "type": "choice", "question": "傳說「寒食節」禁火吃冷食，是為了紀念哪位人物？", "options": ["晉文公", "屈原", "伍子胥", "介之推"], "answer": 3, "explanation": "相傳晉文公放火燒山想逼介之推出來做官，介之推卻抱樹而死，於是訂下這天禁火。", "fun_fact": "寒食節就在清明前一兩天，後來習俗逐漸和清明節合併。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-049", "category": "文化", "difficulty": 1, "type": "choice", "question": "民間傳說中，過年貼春聯、放鞭炮，是為了嚇跑怕紅色和巨響的「年獸」。", "options": ["對", "錯"], "answer": 0, "explanation": "相傳年獸會在除夕出來傷人，但牠害怕紅色、火光和聲響，人們就用這些方法驅趕牠。", "fun_fact": "民間也有一說，「過年」的意思就是平安度過年獸這一關。", "topic": "human", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "human-CN-001", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "「日、月、山、水」這類直接描摹外形的造字法，六書中稱為？", "options": ["指事", "會意", "象形", "形聲"], "answer": 2, "explanation": "象形是依物體外形描畫而成的造字法，日、月、山、水都是典型例子。", "fun_fact": "六書另有指事、會意、形聲、轉注、假借五類。"}, {"id": "human-CN-002", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "中國第一部系統分析字形字義的字典《說文解字》，作者是誰？", "options": ["班固", "許慎", "鄭玄", "劉向"], "answer": 1, "explanation": "《說文解字》為東漢許慎所編，以部首統攝全書，是漢字研究的奠基之作。", "fun_fact": "書中首創的五百四十個部首，是後世字典部首制度的源頭。"}, {"id": "human-CN-003", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "成語「刻舟求劍」的故事出自哪一部古籍？", "options": ["《戰國策》", "《淮南子》", "《世說新語》", "《呂氏春秋》"], "answer": 3, "explanation": "這則寓言見於《呂氏春秋．察今》，比喻拘泥舊法、不知變通。", "fun_fact": "故事裡的人在船舷刻記號，上岸後才下水找劍，當然撈不到。"}, {"id": "human-CN-004", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "「守株待兔」的寓言出自下列哪一部子書？", "options": ["《韓非子》", "《戰國策》", "《莊子》", "《列子》"], "answer": 0, "explanation": "《韓非子．五蠹》記載宋國農夫因兔子撞樹而死，從此守著樹樁不再耕田。", "fun_fact": "韓非用這個故事諷刺一味效法古制的人。"}, {"id": "human-CN-005", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "「陵、陡、陽」這些字左邊的「阝」，本義是指什麼？", "options": ["城市聚落", "高山土丘", "流水河川", "房屋屋簷"], "answer": 1, "explanation": "左邊的「阝」是「阜」的變形，本義為土山，所以這類字多與高地、坡度有關。", "fun_fact": "同樣寫法的「阝」放在右邊時是「邑」，與城鎮有關，例如「郡」「都」。"}, {"id": "human-CN-006", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "已知最早成體系的漢字，主要刻寫在什麼材料上？", "options": ["青銅禮器", "竹簡木牘", "絲綢帛書", "龜甲獸骨"], "answer": 3, "explanation": "甲骨文是商代晚期王室占卜時刻在龜甲和獸骨上的文字，為目前所見最早的成熟漢字系統。", "fun_fact": "甲骨文十九世紀末才在河南安陽殷墟被大量發現。"}, {"id": "human-CN-007", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "中秋節是農曆哪一天？", "options": ["七月十五", "八月十五", "九月十五", "正月十五"], "answer": 1, "explanation": "農曆八月十五恰逢秋季正中，月亮最圓，因而稱為中秋。", "fun_fact": "古代把農曆八月稱作仲秋，中秋之名即由此而來。"}, {"id": "human-CN-008", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "元宵節除了賞花燈，最有名的傳統活動是？", "options": ["猜燈謎", "放風箏", "賽龍舟", "盪鞦韆"], "answer": 0, "explanation": "元宵夜把謎題貼在燈上供人猜射，稱為猜燈謎，是元宵最具代表性的遊戲。", "fun_fact": "元宵節是農曆新年後第一個月圓之夜，又叫上元節、燈節。"}, {"id": "human-CN-009", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "重陽節登高時，傳統上會佩戴哪一種植物？", "options": ["艾草", "菖蒲", "茱萸", "桂花"], "answer": 2, "explanation": "重陽節有登高、佩茱萸的習俗，古人相信茱萸可以避邪去災。", "fun_fact": "重陽在農曆九月初九，兩個陽數相重，故名重陽。"}, {"id": "human-CN-010", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "七夕傳說中，牛郎織女相會的橋是由哪種鳥搭成的？", "options": ["喜鵲", "白鶴", "燕子", "鴻雁"], "answer": 0, "explanation": "傳說每年七月初七，成群喜鵲飛上銀河搭成鵲橋，讓牛郎織女渡河相見。", "fun_fact": "七夕又稱乞巧節，古代女子會在這天向織女祈求手藝靈巧。"}, {"id": "human-CN-011", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "端午節時，民間習慣在門口懸掛哪兩種植物驅邪？", "options": ["柳枝與桃枝", "艾草與菖蒲", "茱萸與菊花", "松枝與梅花"], "answer": 1, "explanation": "端午正值初夏疫病易生，民間便懸掛氣味濃烈的艾草與菖蒲來驅蟲避邪。", "fun_fact": "菖蒲葉形似劍，又被稱為「蒲劍」。"}, {"id": "human-CN-012", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "名菜「佛跳牆」屬於八大菜系中的哪一系？", "options": ["粵菜", "蘇菜", "閩菜", "浙菜"], "answer": 2, "explanation": "佛跳牆是福州名菜，屬閩菜系，以多種山珍海味慢火煨製而成。", "fun_fact": "菜名相傳出自「罈啟葷香飄四鄰，佛聞棄禪跳牆來」的讚語。"}, {"id": "human-CN-013", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "「西湖醋魚」屬於哪一個菜系？", "options": ["湘菜", "徽菜", "魯菜", "浙菜"], "answer": 3, "explanation": "西湖醋魚是杭州名菜，屬浙菜系，以糖醋芡汁淋草魚著稱。", "fun_fact": "浙菜講究鮮嫩清爽，與同屬江南的蘇菜風格相近。"}, {"id": "human-CN-014", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "下列哪一項「不屬於」中國八大菜系？", "options": ["徽菜", "湘菜", "魯菜", "京菜"], "answer": 3, "explanation": "八大菜系是魯、川、粵、蘇、閩、浙、湘、徽，並不包含京菜。", "fun_fact": "八大菜系的說法大致在清末民初定型。"}, {"id": "human-CN-015", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "烏龍茶（青茶）的發酵程度屬於下列哪一種？", "options": ["不發酵", "半發酵", "全發酵", "後發酵"], "answer": 1, "explanation": "烏龍茶介於綠茶與紅茶之間，屬半發酵茶，香氣濃郁而滋味醇厚。", "fun_fact": "綠茶不發酵、紅茶全發酵，普洱則屬後發酵茶。"}, {"id": "human-CN-016", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "北京傳統民居「四合院」的「四合」是指什麼？", "options": ["四面房屋圍成一院", "四戶人家共住一院", "四進院落層層相通", "四層樓高的院落"], "answer": 0, "explanation": "四合院由正房、廂房、倒座四面房屋圍合而成，中間留出天井院落。", "fun_fact": "坐北朝南的正房採光最好，通常由長輩居住。"}, {"id": "human-CN-017", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "中國古代建築中，等級最高的屋頂形式是？", "options": ["歇山頂", "硬山頂", "懸山頂", "廡殿頂"], "answer": 3, "explanation": "廡殿頂四面斜坡、沒有山牆，等級最高，多用於宮殿與重要壇廟。", "fun_fact": "北京故宮太和殿用的是規格更高的重檐廡殿頂。"}, {"id": "human-CN-018", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "「白牆黑瓦」是哪一派傳統民居最鮮明的招牌？", "options": ["徽派民居", "客家土樓", "陝北窯洞", "蒙古氈包"], "answer": 0, "explanation": "徽派建築以白牆黑瓦著稱，高聳的馬頭牆是其最顯眼的特徵。", "fun_fact": "徽派民居主要分布在皖南的歙縣、黟縣一帶。"}, {"id": "human-CN-019", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "蘇州拙政園是下列哪一類園林的代表作？", "options": ["北方皇家園林", "寺廟附屬園林", "江南私家園林", "陵墓紀念園林"], "answer": 2, "explanation": "拙政園始建於明代，是江南私家園林的典範，也被列入世界文化遺產。", "fun_fact": "它與留園、獅子林、滄浪亭同為蘇州名園。"}, {"id": "human-CN-020", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "崑曲名劇《牡丹亭》的作者是誰？", "options": ["關漢卿", "湯顯祖", "王實甫", "孔尚任"], "answer": 1, "explanation": "《牡丹亭》是明代湯顯祖的代表作，敘述杜麗娘為情而死、又因情復生的故事。", "fun_fact": "《牡丹亭》與《紫釵記》等合稱「臨川四夢」。"}, {"id": "human-CN-021", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "元雜劇《竇娥冤》的作者是誰？", "options": ["馬致遠", "白樸", "鄭光祖", "關漢卿"], "answer": 3, "explanation": "《竇娥冤》是關漢卿的代表作，寫竇娥含冤被斬、六月飛雪的故事。", "fun_fact": "關漢卿被視為元曲四大家之首。"}, {"id": "human-CN-022", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "名畫《清明上河圖》描繪的是哪個朝代都城的市井風貌？", "options": ["唐朝", "北宋", "元朝", "明朝"], "answer": 1, "explanation": "《清明上河圖》為北宋張擇端所繪，描寫都城汴京的街市與虹橋景象。", "fun_fact": "畫中密密麻麻的攤販、船隻與行人，是研究古代城市生活的珍貴材料。"}, {"id": "human-CN-023", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "傳統樂器「二胡」有幾條弦？", "options": ["兩條", "三條", "四條", "五條"], "answer": 0, "explanation": "二胡只有兩條弦，琴弓夾在兩弦之間拉奏，音色近似人聲。", "fun_fact": "二胡由唐宋時期的奚琴演變而來，屬拉弦樂器。"}, {"id": "human-CN-024", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "下列哪一部「不是」中國古典四大名著？", "options": ["《紅樓夢》", "《水滸傳》", "《聊齋誌異》", "《三國演義》"], "answer": 2, "explanation": "四大名著指《三國演義》《水滸傳》《西遊記》《紅樓夢》，《聊齋誌異》是文言短篇小說集。", "fun_fact": "《聊齋誌異》的作者是清代的蒲松齡。"}, {"id": "human-CN-025", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "《紅樓夢》一般認為的作者是誰？", "options": ["施耐庵", "羅貫中", "蒲松齡", "曹雪芹"], "answer": 3, "explanation": "《紅樓夢》前八十回一般認為出自清代曹雪芹之手，又名《石頭記》。", "fun_fact": "後四十回通常認為由高鶚整理續補。"}, {"id": "human-CN-026", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "《水滸傳》中梁山泊聚義的好漢一共有幾位？", "options": ["三十六位", "七十二位", "一百零八位", "一百二十位"], "answer": 2, "explanation": "梁山好漢共一百零八位，對應三十六天罡星與七十二地煞星。", "fun_fact": "故事以宋江為首，最後接受朝廷招安。"}, {"id": "human-CN-027", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "《西遊記》中孫悟空的兵器是什麼？", "options": ["如意金箍棒", "方天畫戟", "青龍偃月刀", "丈八蛇矛"], "answer": 0, "explanation": "孫悟空的武器是從東海龍宮取得的如意金箍棒，可隨心意變大變小。", "fun_fact": "金箍棒原名「定海神針鐵」。"}, {"id": "human-CN-028", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "神話中女媧補天，煉的是什麼材料？", "options": ["崑崙玉", "五色石", "黃金砂", "青銅塊"], "answer": 1, "explanation": "傳說天崩地裂後，女媧煉五色石補住蒼天，又斷鰲足立為四極。", "fun_fact": "女媧的另一項功績是摶土造人。"}, {"id": "human-CN-029", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "傳說后羿一共射下了幾個太陽？", "options": ["七個", "八個", "九個", "十個"], "answer": 2, "explanation": "傳說天上同時出現十個太陽，后羿射落九個，只留下一個照耀大地。", "fun_fact": "這則神話較完整的記載見於《淮南子》。"}, {"id": "human-CN-030", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "「精衛填海」故事中，精衛原本是誰？", "options": ["炎帝的小女兒", "黃帝的小女兒", "東海龍王之女", "西王母的侍女"], "answer": 0, "explanation": "精衛原是炎帝的小女兒女娃，溺死於東海後化為神鳥，日日銜木石填海。", "fun_fact": "這則神話最早見於《山海經．北山經》。"}, {"id": "human-CN-031", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "潑水節是哪一個民族最重要的新年節日？", "options": ["苗族", "彝族", "白族", "傣族"], "answer": 3, "explanation": "潑水節是雲南傣族的新年，人們互相潑水祝福、洗去舊年的晦氣。", "fun_fact": "東南亞的泰國、緬甸等地也過同一個節日。"}, {"id": "human-CN-032", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "「那達慕」大會是哪一個民族的傳統盛會？", "options": ["藏族", "蒙古族", "維吾爾族", "哈薩克族"], "answer": 1, "explanation": "那達慕是蒙古族一年一度的競技盛會，意思就是「遊戲」或「比賽」。", "fun_fact": "大會上的摔角、賽馬、射箭合稱「男兒三藝」。"}, {"id": "human-CN-033", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "「火把節」是哪一個民族最盛大的傳統節日？", "options": ["彝族", "侗族", "壯族", "瑤族"], "answer": 0, "explanation": "火把節是彝族最隆重的節日，人們舉著火把繞行村寨田間，祈求驅蟲豐收。", "fun_fact": "白族、納西族等西南民族也有過火把節的習俗。"}, {"id": "human-CN-034", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "青花瓷上的藍色花紋，主要來自哪一種金屬的礦物顏料？", "options": ["銅", "鐵", "錳", "鈷"], "answer": 3, "explanation": "青花是以含鈷的礦料在胎上繪畫，再罩透明釉高溫燒成的釉下彩瓷。", "fun_fact": "青花瓷白地藍花的組合，成為外銷世界的中國瓷器代表。"}, {"id": "human-CN-035", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "工藝品「景泰藍」的學名是什麼？", "options": ["銅胎掐絲琺瑯", "青銅錯金銀器", "剔紅雕漆工藝", "釉裡紅瓷器"], "answer": 0, "explanation": "景泰藍學名銅胎掐絲琺瑯，先以銅絲掐出花紋，再填入琺瑯釉料燒製磨光。", "fun_fact": "名稱相傳與明代景泰年間盛行、釉色多藍有關。"}, {"id": "human-CN-036", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 2, "type": "choice", "question": "「唐三彩」的三彩，主要是指哪三種顏色？", "options": ["紅、藍、黑", "黃、綠、白", "青、紫、金", "灰、粉、橙"], "answer": 1, "explanation": "唐三彩釉色雖多，但以黃、綠、白（褐）三色為主，因而得名。", "fun_fact": "唐三彩多作為陪葬明器，駱駝與馬俑最為著名。"}, {"id": "human-CN-037", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 1, "type": "choice", "question": "十二生肖中「沒有」下列哪一種動物？", "options": ["蛇", "羊", "貓", "猴"], "answer": 2, "explanation": "十二生肖依序是鼠、牛、虎、兔、龍、蛇、馬、羊、猴、雞、狗、豬，其中並沒有貓。", "fun_fact": "民間才有「貓被老鼠騙了才錯過報名」的傳說。"}, {"id": "human-CN-038", "topic": "human", "unit": "CN", "unit_name": "中國", "category": "人文", "region": "中國", "difficulty": 3, "type": "choice", "question": "天干與地支兩兩相配，一輪循環共有幾年？", "options": ["十二年", "三十年", "六十年", "一百二十年"], "answer": 2, "explanation": "十天干配十二地支，可組成六十組不重複的干支，因此一輪為六十年，稱為一甲子。", "fun_fact": "「花甲之年」指的就是滿六十歲。"}, {"id": "wd-044", "category": "文化", "difficulty": 2, "type": "choice", "question": "韓文（諺文）是由朝鮮王朝哪一位國王主導創制的？", "options": ["高宗", "太祖李成桂", "正祖", "世宗大王"], "answer": 3, "explanation": "世宗大王在 1443 年創制韓文，並於 1446 年以《訓民正音》頒布，讓一般百姓也能讀寫。", "fun_fact": "韓國一萬元紙鈔上的人像，就是世宗大王。", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "region": "日韓・東亞"}, {"id": "wd-045", "category": "文化", "difficulty": 2, "type": "choice", "question": "日本的傳統節日「七五三」，是為哪些人祈福？", "options": ["新婚夫妻", "兒童", "考生", "長輩"], "answer": 1, "explanation": "七五三是日本家長帶 3 歲、5 歲、7 歲的孩子到神社參拜，感謝並祈求孩子健康成長的節日，通常在 11 月。", "fun_fact": "孩子會拿到細長的「千歲飴」糖果，象徵長命百歲。", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "region": "日韓・東亞"}, {"id": "human-EA-001", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "現代日語中，片假名最主要用來書寫什麼？", "options": ["外來語與擬聲詞", "助詞與動詞語尾", "人名地名的漢字", "佛經與古典漢文"], "answer": 0, "explanation": "片假名主要用於轉寫外來語（外來語）、擬聲擬態詞與強調，相當於歐語的斜體用法。", "fun_fact": "片假名是九世紀僧侶擷取漢字「片」段筆畫當速記符號而來，名字就叫「片假名」。"}, {"id": "human-EA-002", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日語的平假名是由漢字的哪一種書體簡化而來？", "options": ["楷書", "隸書", "草書", "篆書"], "answer": 2, "explanation": "平假名是經由萬葉假名的草書體逐步簡化而成，字形圓潤流暢。", "fun_fact": "平假名早期被稱為「女手」，因為它先在宮廷女性之間流行起來。"}, {"id": "human-EA-003", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日語敬語中，「です・ます」的說法屬於哪一類？", "options": ["尊敬語", "謙讓語", "丁寧語", "美化語"], "answer": 2, "explanation": "以句尾「です」「ます」表達對聽話者的禮貌，屬於丁寧語（禮貌語）。", "fun_fact": "丁寧語可以和其他敬語疊用，所以句子常常同時出現兩種敬語形式。"}, {"id": "human-EA-004", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "立在神社入口、象徵神域與人間分界的牌坊叫什麼？", "options": ["狛犬", "鳥居", "石燈籠", "注連繩"], "answer": 1, "explanation": "鳥居是神道神社的門，通過它代表從世俗進入神聖空間。", "fun_fact": "日本地圖與 Google 地圖上，神社的符號畫的就是一座鳥居。"}, {"id": "human-EA-005", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "參拜日本神社時，最通行的禮法是下列哪一種？", "options": ["一禮一拍手一禮", "二禮二拍手一禮", "三禮三拍手三禮", "二禮四拍手二禮"], "answer": 1, "explanation": "一般神社的標準作法是鞠躬兩次、拍手兩次，最後再深深一鞠躬。", "fun_fact": "少數神社有自己的規矩，例如出雲大社就要拍四次手。"}, {"id": "human-EA-006", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本人在除夕夜有吃哪一種麵的習慣？", "options": ["烏龍麵", "素麵", "拉麵", "蕎麥麵"], "answer": 3, "explanation": "「年越蕎麥麵」在十二月三十一日吃，蕎麥麵易斷，象徵斬斷一年的厄運。", "fun_fact": "蕎麥能耐惡劣天候，所以也被拿來象徵堅韌；細長的麵條則代表長壽。"}, {"id": "human-EA-007", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本「節分」這一天，人們撒的是什麼？", "options": ["炒過的黃豆", "曬乾的紅豆", "生的白米", "炒過的芝麻"], "answer": 0, "explanation": "節分的「撒豆」用炒過的黃豆（福豆），一邊喊「鬼在外、福在內」。", "fun_fact": "撒完之後要撿豆子來吃，吃的數量是自己的歲數再加一顆。"}, {"id": "human-EA-008", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本的盂蘭盆節（お盆）主要是為了迎接什麼？", "options": ["保佑豐收的田神", "鎮守村莊的山神", "驅趕疫病的瘟神", "返家的祖先靈魂"], "answer": 3, "explanation": "盂蘭盆節結合了日本固有的祖靈信仰與佛教供養習俗，相信祖先靈魂會回到家中。", "fun_fact": "盆舞（盆踊）已有近六百年歷史，各地舞法與配樂都不一樣。"}, {"id": "human-EA-009", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本在五月五日兒童節當天會懸掛什麼？", "options": ["風鈴", "雛人形", "破魔矢", "鯉魚旗"], "answer": 3, "explanation": "鯉魚旗（鯉幟）在端午／兒童節懸掛，祝福孩子像鯉魚躍龍門一樣健康成長。", "fun_fact": "一整組通常是黑鯉代表父親、紅鯉代表母親，小鯉則代表每個孩子。"}, {"id": "human-EA-010", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "京都著名的祇園祭，是哪一座神社的祭典？", "options": ["伏見稻荷大社", "八坂神社", "北野天滿宮", "下鴨神社"], "answer": 1, "explanation": "祇園祭是坐落於祇園一帶的八坂神社的祭典，每年七月整月舉行。", "fun_fact": "祭典的主角是稱為「山鉾」的巨大花車，大型的叫鉾、小型的叫山。"}, {"id": "human-EA-011", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "集日本「侘茶」之大成、奠定茶道精神的茶人是誰？", "options": ["松尾芭蕉", "世阿彌", "千利休", "狩野永德"], "answer": 2, "explanation": "千利休把樸素簡約的美學帶進茶會，是茶道史上影響最深遠的人物。", "fun_fact": "他設計的草庵茶室極小，其中僅兩張榻榻米的「待庵」現在是日本國寶。"}, {"id": "human-EA-012", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "下列哪一種日本傳統表演藝術，演員是戴著面具演出的？", "options": ["能劇", "歌舞伎", "文樂", "落語"], "answer": 0, "explanation": "能劇的主角（仕手）戴著以日本檜木雕成的「能面」演出。", "fun_fact": "能面約有六十個基本類型、四百五十種以上的變化，角度一變表情就跟著變。"}, {"id": "human-EA-013", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "歌舞伎中專門扮演女性角色的男演員稱作什麼？", "options": ["立役", "黑衣", "太夫", "女形"], "answer": 3, "explanation": "自女性被禁止登台後，歌舞伎的女性角色改由稱為「女形」的男演員擔任。", "fun_fact": "女形要專門受訓，學習女性的化妝、身段與假聲說話方式。"}, {"id": "human-EA-014", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "浮世繪名作《神奈川沖浪裏》的作者是誰？", "options": ["歌川廣重", "葛飾北齋", "喜多川歌麿", "東洲齋寫樂"], "answer": 1, "explanation": "《神奈川沖浪裏》是葛飾北齋《富嶽三十六景》系列的第一幅。", "fun_fact": "這套版畫太受歡迎，北齋後來又追加了十幅，所以「三十六景」其實有四十六幅。"}, {"id": "human-EA-015", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本俳句的標準音節格式是？", "options": ["七五七", "五七七", "五七五", "七七五"], "answer": 2, "explanation": "俳句由五、七、五共十七個音節（音拍）組成。", "fun_fact": "俳句通常還要放入表示季節的「季語」，季語有專門的辭典可查。"}, {"id": "human-EA-016", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "平安時代的長篇小說《源氏物語》作者是誰？", "options": ["紫式部", "清少納言", "和泉式部", "小野小町"], "answer": 0, "explanation": "《源氏物語》成書於十一世紀初，作者紫式部是平安宮廷的女官。", "fun_fact": "它常被視為世界上第一部長篇小說，也是最早獲得國際聲譽的女性作品。"}, {"id": "human-EA-017", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本傳統樂器「三味線」有幾條弦？", "options": ["兩條", "三條", "四條", "五條"], "answer": 1, "explanation": "三味線的名字就來自它的三條弦，用稱為「撥」的大型撥子彈奏。", "fun_fact": "琴身前後蒙皮，敲到皮面時會發出明顯的打擊聲，音色帶點沙啞。"}, {"id": "human-EA-018", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本花道歷史最悠久的流派是哪一個？", "options": ["池坊", "草月流", "小原流", "嵯峨御流"], "answer": 0, "explanation": "池坊是花道最古老也最大的流派，以京都六角堂為根據地。", "fun_fact": "流派名稱來自六角堂旁的水池（池）與僧人居住的小屋（坊）。"}, {"id": "human-EA-019", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "白川鄉「合掌造」民家的屋頂做得特別陡，主要原因是？", "options": ["方便屋內採光", "加強抗震能力", "便於通風除濕", "讓厚重積雪滑落"], "answer": 3, "explanation": "當地冬季豪雪，陡峭的茅草屋頂能讓積雪自然滑落、減輕屋頂負荷。", "fun_fact": "屋頂形狀像雙手合十，「合掌造」的名字就是這麼來的。"}, {"id": "human-EA-020", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "京都龍安寺最著名的是哪一種庭園？", "options": ["池泉迴遊式庭園", "茶庭（露地）", "枯山水石庭", "淨土式庭園"], "answer": 2, "explanation": "龍安寺的方丈庭園是枯山水（乾式山水）的代表作，只用白砂與石組。", "fun_fact": "庭中十五顆石頭刻意排成從任何一個角度都看不全的位置。"}, {"id": "human-EA-021", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "京都金閣寺的正式名稱是什麼？", "options": ["慈照寺", "鹿苑寺", "相國寺", "建仁寺"], "answer": 1, "explanation": "金閣寺是俗稱，正式寺名為鹿苑寺，意思是「鹿苑之寺」。", "fun_fact": "銀閣寺同樣也是俗稱，兩座寺院都屬於相國寺派。"}, {"id": "human-EA-022", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "被列為世界遺產的姬路城，因外觀潔白而有什麼別稱？", "options": ["金烏城", "舞鶴城", "青葉城", "白鷺城"], "answer": 3, "explanation": "姬路城外牆雪白、姿態像展翅的白鷺，因此有「白鷺城」（Shirasagi-jō）的別稱。", "fun_fact": "它在一九九三年入選，是日本最早一批登錄的世界遺產之一。"}, {"id": "human-EA-023", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "富士山是以哪一個類別登錄世界遺產的？", "options": ["文化遺產", "自然遺產", "複合遺產", "文化景觀"], "answer": 0, "explanation": "富士山以「信仰對象與藝術泉源」的名義登錄為文化遺產，不是自然遺產。", "fun_fact": "登錄範圍包含山體以外的神社、登山道與周邊湖泊等多處構成資產。"}, {"id": "human-EA-024", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本和菓子「羊羹」主要是用什麼做成的？", "options": ["糯米與黃豆粉", "雞蛋與麵粉", "紅豆餡與寒天", "地瓜與砂糖"], "answer": 2, "explanation": "羊羹是把紅豆餡加糖，再用寒天（洋菜）凝固成塊的傳統和菓子。", "fun_fact": "它的名字來自中國的羊肉羹，傳到日本後才變成完全植物性的甜點。"}, {"id": "human-EA-025", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "「豚骨拉麵」乳白色的湯頭發源於日本哪個地方？", "options": ["北海道", "東北地方", "關西地方", "九州地方"], "answer": 3, "explanation": "豚骨拉麵源自九州福岡縣久留米，是九州的代表性拉麵。", "fun_fact": "豬骨要熬上十幾個小時，湯才會乳化成不透明的白色。"}, {"id": "human-EA-026", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "現在常見的「握壽司」最早是在哪座城市誕生的？", "options": ["大坂", "江戶", "京都", "長崎"], "answer": 1, "explanation": "握壽司在十九世紀前期的江戶（今東京）出現，屬於快速供應的庶民食物。", "fun_fact": "「江戶前」原指江戶灣捕到的海鮮，現在則成了高品質壽司的代名詞。"}, {"id": "human-EA-027", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "浴衣與一般和服最大的差別是什麼？", "options": ["無襯裡的棉質單衣", "以絲綢織成的禮服", "冬季專用的厚外衣", "只有男性可以穿著"], "answer": 0, "explanation": "浴衣是不加襯裡的棉或麻製單衣，屬於夏季祭典等場合的休閒穿著。", "fun_fact": "浴衣字面意思是「沐浴用的衣服」，現在溫泉旅館還會提供給房客。"}, {"id": "human-EA-028", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "被譽為「漫畫之神」、創作《原子小金剛》的日本漫畫家是誰？", "options": ["水木茂", "宮崎駿", "手塚治虫", "赤塚不二夫"], "answer": 2, "explanation": "手塚治虫確立了現代日本漫畫與動畫的形式，被尊稱為漫畫之神。", "fun_fact": "他一生留下的原稿超過十五萬頁，常被拿來和華特迪士尼相提並論。"}, {"id": "human-EA-029", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓文字母原本的名稱《訓民正音》意思是什麼？", "options": ["百姓通用的方便文字", "教導百姓的正確聲音", "朝鮮王朝的官方語言", "由漢字簡化來的字母"], "answer": 1, "explanation": "「訓民正音」直譯就是「教導百姓的正確聲音」，是這套文字最初的名稱。", "fun_fact": "《訓民正音》解例本在一九九七年被登錄為聯合國教科文組織的世界記憶遺產。"}, {"id": "human-EA-030", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "現代韓文（諺文）的基本字母共有幾個？", "options": ["14個", "20個", "24個", "28個"], "answer": 2, "explanation": "現代諺文使用二十四個基本字母，其中子音十四個、母音十個。", "fun_fact": "創制之初其實有二十八個字母，有幾個後來廢棄不用了。"}, {"id": "human-EA-031", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "諺文的字母在書寫時是怎麼排列的？", "options": ["由左至右排成一直線", "像漢字一樣一字一音", "由上而下排成一直行", "組合成方塊狀的音節"], "answer": 3, "explanation": "諺文採「聚寫」原則，把初聲、中聲、終聲組合成一個方塊狀的音節。", "fun_fact": "母音筆畫直的排在子音右邊、橫的排在下面，收尾的子音則放最底下。"}, {"id": "human-EA-032", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "諺文的基本子音字形是模仿什麼設計出來的？", "options": ["發音時的口腔器官", "天地人三才的形狀", "漢字偏旁的簡化形", "八卦符號的排列法"], "answer": 0, "explanation": "ㄱ、ㄴ、ㅁ、ㅅ、ㅇ 五個基本子音分別描摹牙（舌根）、舌、唇、齒、喉的發音器官形狀，再加筆畫衍生其他字母。", "fun_fact": "母音則是另一套設計原理，靈感來源和子音完全不同。"}, {"id": "human-EA-033", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國傳統說唱藝術「盤索里」的標準演出組合是？", "options": ["兩名歌手輪流對唱", "一名唱者與一名鼓手", "一名唱者加伴舞群", "四人小組合唱伴奏"], "answer": 1, "explanation": "盤索里由一名手持摺扇的唱者，搭配一名擊鼓的「鼓手」共同演出。", "fun_fact": "韓國有句話說「一鼓手抵兩名唱者」，可見鼓手的分量。"}, {"id": "human-EA-034", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "韓國假面舞（탈춤）最常拿來嘲諷的對象是？", "options": ["異國來的商人", "市集的小販", "兩班貴族階級", "邊境的軍官"], "answer": 2, "explanation": "假面舞常用詩句與雙關語揶揄兩班，反映庶民對特權階級的不滿。", "fun_fact": "假面舞在二〇二二年被列入聯合國教科文組織的人類非物質文化遺產名錄。"}, {"id": "human-EA-035", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國大量醃製越冬泡菜的「Kimjang（김장）」通常在何時進行？", "options": ["春耕前的初春", "盛夏的三伏天", "梅雨結束之後", "入冬前的晚秋"], "answer": 3, "explanation": "Kimjang（越冬泡菜醃製）是入冬前、約陽曆十一月由家族與鄰里一起大量醃製泡菜，以備整個冬天食用，二○一三年列入聯合國教科文組織人類非物質文化遺產。", "fun_fact": "這項共同醃製的習俗在二〇一三年登錄為人類非物質文化遺產。"}, {"id": "human-EA-036", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國中秋節必吃的傳統米糕是哪一種？", "options": ["年糕湯", "打糕", "炒年糕", "松片"], "answer": 3, "explanation": "松片（송편）是包餡的半月形米糕，蒸的時候會鋪上一層松針。", "fun_fact": "松針不只防沾黏，還會把香氣帶進米糕裡。"}, {"id": "human-EA-037", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "韓國人把農曆八月十五的中秋節稱作什麼？", "options": ["寒食", "秋夕", "端午", "冬至"], "answer": 1, "explanation": "秋夕是韓國最重要的秋收節日，在農曆八月十五滿月之日。", "fun_fact": "南韓的秋夕連前後一天共放三天假，是一年中返鄉人潮最多的時候。"}, {"id": "human-EA-038", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國人在農曆新年喝年糕湯，傳統上代表什麼意思？", "options": ["祈求整年不生病", "感謝祖先的庇佑", "代表又長了一歲", "希望五穀能豐收"], "answer": 2, "explanation": "韓國人相信喝完年糕湯就算多長一歲，所以新年一定要吃。", "fun_fact": "湯裡的年糕是長條狀切片，長長的形狀被拿來象徵福氣延伸。"}, {"id": "human-EA-039", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國傳統住宅裡的「溫突」是什麼設備？", "options": ["地板下的暖房系統", "牆內的通風管道", "屋頂上的集水槽", "廚房用的醃菜缸"], "answer": 0, "explanation": "溫突是把灶火的煙引到厚石板地板底下流通的地暖系統。", "fun_fact": "現代韓國公寓雖然改用熱水管，但仍沿用「溫突」這個名字。"}, {"id": "human-EA-040", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國哪一座城市以拌飯（비빔밥）聞名？", "options": ["安東", "全州", "慶州", "水原"], "answer": 1, "explanation": "全州拌飯是最有名的地方版本，米飯用牛腱高湯炊煮，還會加生拌牛肉。", "fun_fact": "拌飯的韓文字面意思就是「拌起來的飯」，非常直白。"}, {"id": "human-EA-041", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "韓國人習慣在什麼時節吃蔘雞湯？", "options": ["寒流來襲的隆冬", "梅雨綿綿的初夏", "農曆新年的假期", "最炎熱的三伏天"], "answer": 3, "explanation": "蔘雞湯是三伏天的進補食物，用以補回流汗消耗掉的體力。", "fun_fact": "一整隻童子雞肚子裡塞了糯米、人參、紅棗與大蒜一起燉。"}, {"id": "human-EA-042", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "女性韓服由上衣「赤古里」搭配什麼組成？", "options": ["長裙", "寬褲", "披風", "圍裙"], "answer": 0, "explanation": "女性韓服是短上衣「赤古里」（저고리）加上蓬鬆的長裙「치마（chima）」。", "fun_fact": "男性韓服則是赤古里配上便於盤腿而坐的寬鬆長褲。"}, {"id": "human-EA-043", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "韓國傳統樂器「伽倻琴」通常有幾條弦？", "options": ["六條", "八條", "十二條", "二十五條"], "answer": 2, "explanation": "傳統伽倻琴有十二條弦，右手撥弦、左手在琴橋左側按壓製造餘韻。", "fun_fact": "現代為了演奏西洋曲目，也出現十八、二十一甚至二十五弦的改良琴。"}, {"id": "human-EA-044", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "佛國寺與石窟庵這組世界遺產位於韓國哪座城市？", "options": ["扶餘", "慶州", "開城", "江陵"], "answer": 1, "explanation": "佛國寺與石窟庵都在慶州吐含山一帶，一九九五年共同登錄世界遺產。", "fun_fact": "佛國寺至今仍是韓國佛教曹溪宗的重要寺院。"}, {"id": "human-EA-045", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "首爾的景福宮是哪一個王朝的正宮？", "options": ["朝鮮王朝", "高麗王朝", "新羅王朝", "百濟王朝"], "answer": 0, "explanation": "景福宮建於一三九五年，是朝鮮王朝的第一座也是最主要的王宮。", "fun_fact": "宮名取自《詩經》，意思是「盛大的福氣」。"}, {"id": "human-EA-046", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "被列入世界遺產的韓國「書院」，是哪一種思想的教育機構？", "options": ["佛教禪宗", "道教全真", "薩滿信仰", "儒家性理學"], "answer": 3, "explanation": "書院是朝鮮時代結合孔廟與私學的性理學（新儒學）書院。", "fun_fact": "九處書院在二〇一九年以「韓國新儒學書院」之名一起登錄世界遺產。"}, {"id": "human-EA-047", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "韓國國旗「太極旗」中央的圓形圖案代表什麼？", "options": ["日月的運行", "陰陽的調和", "四季的循環", "五行的相生"], "answer": 1, "explanation": "中央的太極由紅藍兩半組成，紅為陽、藍為陰，象徵陰陽調和。", "fun_fact": "四角的四個卦象分別是乾、坤、坎、離，各自對應天地與日月。"}, {"id": "human-EA-048", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "韓國人在春節與秋夕早上舉行的祭祖儀式叫什麼？", "options": ["歲拜", "祭祀", "茶禮", "告祀"], "answer": 2, "explanation": "重要節日早上舉行的祖先祭祀稱為「茶禮（차례）」，一年數次。", "fun_fact": "忌日當天舉行的那一種祭祖儀式名稱不同，別搞混了。"}, {"id": "human-EA-049", "topic": "human", "unit": "EA", "unit_name": "日韓・東亞", "category": "人文", "region": "日韓・東亞", "  "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "印度的官方語言印地語使用哪種文字？", "options": ["孟加拉文", "天城文", "阿拉伯字母", "坦米爾文"], "answer": 1, "explanation": "天城文由古代婆羅米文演變而來，也用來書寫尼泊爾語與梵語。", "fun_fact": ""}, {"id": "human-SEA-052", "topic": "human", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "人文", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "巴基斯坦的國語是哪一種語言？", "options": ["孟加拉語", "旁遮普方言", "烏爾都語", "印地語"], "answer": 2, "explanation": "烏爾都語是巴基斯坦的國語與通用語，以波斯─阿拉伯字母書寫。", "fun_fact": ""}, {"id": "human-SEA-053", "topic": "human", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "人文", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "印度女性傳統服裝「紗麗」的特色是？", "options": ["以金線刺繡的短衫", "上下兩件式的套裝", "由皮革縫製的長袍", "一整塊未縫製的布"], "answer": 3, "explanation": "紗麗是一塊數公尺長的布，纏繞腰身後把一端披在肩上。", "fun_fact": ""}, {"id": "wd-015", "category": "文化", "difficulty": 3, "type": "choice", "question": "「相對論」是由哪一位科學家提出的？", "options": ["霍金", "牛頓", "愛因斯坦", "居禮夫人"], "answer": 2, "explanation": "愛因斯坦在 1905 年提出狹義相對論，1915 年提出廣義相對論。", "fun_fact": "愛因斯坦的諾貝爾獎其實是因為「光電效應」，不是相對論。", "topic": "human", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-039", "category": "文化", "difficulty": 1, "type": "choice", "question": "以互丟番茄聞名的「番茄大戰」節慶，是在哪個國家舉行？", "options": ["西班牙", "葡萄牙", "墨西哥", "義大利"], "answer": 0, "explanation": "番茄大戰（La Tomatina）每年 8 月最後一個星期三，在西班牙瓦倫西亞地區的小鎮布尼奧爾舉行。", "fun_fact": "為了安全，規定參加者丟番茄前要先把番茄捏爛，免得砸傷人。", "topic": "human", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-041", "category": "文化", "difficulty": 1, "type": "choice", "question": "名畫《星夜》是哪一位畫家的作品？", "options": ["畢卡索", "雷諾瓦", "莫內", "梵谷"], "answer": 3, "explanation": "《星夜》是荷蘭畫家梵谷在 1889 年的作品，現藏於紐約現代藝術博物館。", "fun_fact": "梵谷畫這幅畫時住在法國聖雷米的療養院，畫的是他從房間窗戶望出去的景色（再加上想像）。", "topic": "human", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-046", "category": "文化", "difficulty": 2, "type": "choice", "question": "貝多芬創作《第九號交響曲》（包含《快樂頌》）的時候，聽力已經幾乎完全喪失。", "options": ["對", "錯"], "answer": 0, "explanation": "正確。貝多芬在 1824 年首演第九號交響曲時已經幾乎全聾，平日要靠「對話簿」與人筆談，只能憑內心的聽覺與記憶完成這部作品。", "fun_fact": "相傳首演結束時他聽不到掌聲，是一位歌手把他轉過身來，他才看到觀眾熱烈鼓掌。", "topic": "human", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-048", "category": "文化", "difficulty": 3, "type": "choice", "question": "萬聖節的「傑克燈」，最早就是用南瓜雕刻而成的。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。一般認為傑克燈的傳統來自愛爾蘭和蘇格蘭，最早是用蕪菁等根莖類蔬菜雕刻；移民到美洲後，才改用又大又好刻的南瓜。南瓜原產於美洲，歐洲早期也沒有南瓜可用。", "fun_fact": "", "topic": "human", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-050", "category": "文化", "difficulty": 3, "type": "choice", "question": "西班牙名菜「西班牙燉飯」（Paella）發源於哪個地區？", "options": ["塞維亞", "巴塞隆納", "馬德里", "瓦倫西亞"], "answer": 3, "explanation": "西班牙燉飯發源於東部的瓦倫西亞，Paella 原本指的是煮飯用的淺底雙耳平底鍋。", "fun_fact": "傳統的瓦倫西亞燉飯其實是放雞肉、兔肉和豆子，並不是海鮮。", "topic": "human", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "human-EU-001", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "下列哪一個歐洲語言不屬於印歐語系？", "options": ["匈牙利語", "葡萄牙語", "希臘語", "立陶宛語"], "answer": 0, "explanation": "匈牙利語與芬蘭語、愛沙尼亞語同屬烏拉爾語系，其餘三者都是印歐語系成員。", "fun_fact": ""}, {"id": "human-EU-002", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "法語、西班牙語、義大利語同屬哪一個語族？", "options": ["日耳曼語族", "斯拉夫語族", "羅曼語族", "凱爾特語族"], "answer": 2, "explanation": "這三種語言都由通俗拉丁語演變而來，合稱羅曼語族。", "fun_fact": ""}, {"id": "human-EU-003", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "下列哪一種斯拉夫語言用拉丁字母而非西里爾字母書寫？", "options": ["俄語", "保加利亞語", "波蘭語", "烏克蘭語"], "answer": 2, "explanation": "波蘭語屬西斯拉夫語支，長期受天主教文化影響，採用加了附加符號的拉丁字母。", "fun_fact": ""}, {"id": "human-EU-004", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "瑞士的四種國家語言中，除了德語、法語、義大利語還有哪一種？", "options": ["加泰隆尼亞語", "佛萊明語", "羅曼什語", "巴斯克語"], "answer": 2, "explanation": "羅曼什語通行於瑞士東南部山區，一九三八年起成為國家語言，也是一種羅曼語。", "fun_fact": ""}, {"id": "human-EU-005", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "西歐哪一種語言被認為是「孤立語言」，與周邊語言毫無親屬關係？", "options": ["愛爾蘭語", "巴斯克語", "加泰隆尼亞語", "冰島語"], "answer": 1, "explanation": "巴斯克語通行於西班牙與法國交界的庇里牛斯山西端，是歐洲唯一公認的孤立語言。", "fun_fact": ""}, {"id": "human-EU-006", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "荷蘭語在語言分類上屬於哪一個語族？", "options": ["羅曼語族", "斯拉夫語族", "日耳曼語族", "烏拉爾語族"], "answer": 2, "explanation": "荷蘭語是西日耳曼語言，常被形容為介於德語與英語之間。", "fun_fact": ""}, {"id": "human-EU-007", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "部分東正教會的耶誕節落在一月七日，主要原因是什麼？", "options": ["沿用儒略曆", "紀念東方三博士", "避開新年假期", "配合月亮的盈虧"], "answer": 0, "explanation": "這些教會的節期仍依儒略曆，其十二月二十五日相當於現行公曆的一月七日。", "fun_fact": ""}, {"id": "human-EU-008", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "以「奔牛」聞名的聖費爾明節，在西班牙哪一座城市舉行？", "options": ["塞維亞", "瓦倫西亞", "潘普洛納", "畢爾包"], "answer": 2, "explanation": "潘普洛納每年七月的聖費爾明節，清晨的奔牛活動吸引世界各地遊客。", "fun_fact": ""}, {"id": "human-EU-009", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "德國慕尼黑啤酒節最早是為了慶祝什麼而舉辦？", "options": ["一場葡萄豐收祭", "新教堂的落成", "王儲的婚禮", "啤酒稅正式取消"], "answer": 2, "explanation": "一八一○年巴伐利亞王儲路德維希成婚，慶典辦在特蕾西亞草坪，後來演變成年度啤酒節。", "fun_fact": ""}, {"id": "human-EU-010", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "以華麗面具與斗篷聞名的嘉年華，在義大利哪一座城市舉行？", "options": ["威尼斯", "佛羅倫斯", "拿坡里", "波隆那"], "answer": 0, "explanation": "威尼斯嘉年華以造型誇張的面具著稱，於四旬期前的懺悔星期二落幕。", "fun_fact": ""}, {"id": "human-EU-011", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "瑞典的仲夏節慶祝的是一年當中的哪個時刻？", "options": ["春分時節", "秋收結束", "初雪降臨", "夏至時節"], "answer": 3, "explanation": "仲夏節在六月下旬舉行，慶祝北歐白晝最長、近乎不夜的時節，人們豎起花柱唱歌跳舞。", "fun_fact": ""}, {"id": "human-EU-012", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "傳統義式培根蛋麵（Carbonara）靠什麼做出滑順的醬汁？", "options": ["雞蛋", "鮮奶油", "奶油麵糊", "原味優格"], "answer": 0, "explanation": "正統作法用蛋液與 Pecorino 起司拌入熱麵，靠餘溫乳化成醬，義大利本地食譜並不加鮮奶油。", "fun_fact": ""}, {"id": "human-EU-013", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "米其林指南最早是由什麼樣的公司推出的？", "options": ["鐵路公司", "輪胎公司", "報社", "釀酒廠"], "answer": 1, "explanation": "一九○○年米其林兄弟的輪胎公司免費發送這本手冊，想鼓勵人多開車、多換輪胎。", "fun_fact": ""}, {"id": "human-EU-014", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "西班牙安達魯西亞的名菜 Gazpacho 是哪一種料理？", "options": ["炭烤的羊肉串", "油炸的海鮮盤", "冰涼的蔬菜湯", "燉煮的豆子湯"], "answer": 2, "explanation": "用番茄、小黃瓜、甜椒、麵包與橄欖油打成後冰鎮飲用，是夏日消暑的冷湯。", "fun_fact": ""}, {"id": "human-EU-015", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "瑞典以氣味驚人聞名的罐頭 surströmming，裡面裝的是什麼？", "options": ["醃漬鮭魚", "發酵鯡魚", "燻烤鰻魚", "鹽漬鱈魚"], "answer": 1, "explanation": "波羅的海鯡魚以淡鹽水發酵數月後裝罐，罐內持續發酵而鼓脹，開罐時氣味極為濃烈。", "fun_fact": ""}, {"id": "human-EU-016", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "帕瑪森起司（Parmigiano Reggiano）主要產自義大利哪一個大區？", "options": ["托斯卡尼", "西西里", "艾米利亞-羅馬涅", "皮埃蒙特"], "answer": 2, "explanation": "這款硬質牛乳起司的法定產區以帕爾馬、雷焦艾米利亞等省為核心。", "fun_fact": ""}, {"id": "human-EU-017", "topic": "human", "unit": "EU", "unit_name": "歐洲", "category": "人文", "region": "歐洲",
