er": 3, "explanation": "李承晚由制憲國會選出，成為大韓民國首任總統，1960年因四一九革命而下台。", "fun_fact": ""}, {"id": "history-EA-041", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "傳說中建立朝鮮半島最早國家「古朝鮮」的是誰？", "options": ["朱蒙", "溫祚", "赫居世", "檀君"], "answer": 3, "explanation": "《三國遺事》記載檀君建立古朝鮮，韓國把傳說中的建國之年訂為檀紀元年。", "fun_fact": ""}, {"id": "history-EA-042", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "新羅在唐朝協助下於668年滅掉哪一王國而統一三國？", "options": ["百濟", "高句麗", "伽倻", "渤海王國"], "answer": 1, "explanation": "新羅先聯合唐軍滅百濟，再於668年攻滅高句麗，隨後逐退唐軍，完成半島的統一。", "fun_fact": ""}, {"id": "history-EA-043", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "朝鮮王朝中透過科舉出仕的世襲統治階層稱為？", "options": ["兩班", "中人", "常民", "白丁賤民"], "answer": 0, "explanation": "兩班原指文班與武班，後來成為壟斷科舉與官職的世襲士大夫階層。", "fun_fact": ""}, {"id": "history-EA-044", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "1377年印行的《直指心體要節》創下什麼世界紀錄？", "options": ["現存最早的木刻版佛經全集", "現存最長的手抄佛經卷軸", "現存最早的金屬活字印本", "現存最早的漢字銅活字盤"], "answer": 2, "explanation": "《直指》比古騰堡印製聖經早了約七十八年，2001年列入世界記憶名錄，現藏於法國國家圖書館。", "fun_fact": ""}, {"id": "history-EA-045", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "1876年日本藉江華島事件與朝鮮簽訂的條約是？", "options": ["漢城條約", "江華島條約", "天津條約", "朝鮮通商章程"], "answer": 1, "explanation": "江華島條約是朝鮮第一個不平等條約，開放釜山等港口，也否定了清朝對朝鮮的宗主權。", "fun_fact": ""}, {"id": "history-EA-046", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "1894年爆發、間接引發甲午戰爭的朝鮮民變是？", "options": ["壬午軍亂", "甲申政變", "乙未義兵抗日運動", "東學農民運動"], "answer": 3, "explanation": "東學農民軍起事後朝鮮向清朝求援，日本也隨即出兵，兩國衝突最終演成一場大戰。", "fun_fact": ""}, {"id": "history-EA-047", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "1897年高宗稱帝後，把國號改成什麼？", "options": ["朝鮮帝國", "高麗帝國", "大韓帝國", "大朝鮮帝國"], "answer": 2, "explanation": "高宗在圜丘壇即皇帝位，改國號為大韓帝國、年號光武，宣示脫離與清朝的宗藩關係。", "fun_fact": ""}, {"id": "history-EA-048", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "吉林的巨大石碑「好太王碑」紀念哪一位高句麗君主？", "options": ["廣開土王", "長壽王", "東明聖王", "故國原王"], "answer": 0, "explanation": "好太王碑由長壽王在414年為父親廣開土王所立，碑文記錄了高句麗的建國傳說與征戰。", "fun_fact": ""}, {"id": "history-EA-049", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "1206年統一蒙古各部、被推舉為成吉思汗的人本名是？", "options": ["忽必烈", "窩闊台", "鐵木真", "脫斡鄰勒"], "answer": 2, "explanation": "鐵木真統一蒙古諸部後，在斡難河源舉行的大會上被推舉為「成吉思汗」。", "fun_fact": ""}, {"id": "history-EA-050", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "琉球王國在1879年被日本併吞後，改設為哪一個縣？", "options": ["沖繩縣", "鹿兒島縣", "長崎縣", "宮崎縣"], "answer": 0, "explanation": "明治政府推行琉球處分，廢除琉球藩並設置沖繩縣，四百多年的琉球王國就此終結。", "fun_fact": ""}, {"id": "history-EA-051", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "成吉思汗之孫拔都西征後，在欽察草原建立的汗國是？", "options": ["察合台汗國", "伊兒汗國", "窩闊台汗國", "金帳汗國"], "answer": 3, "explanation": "拔都西征橫掃東歐後建立金帳汗國（欽察汗國），統治俄羅斯各公國達兩百多年。", "fun_fact": ""}, {"id": "history-EA-052", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "1924年成立的蒙古人民共和國，是世界第幾個社會主義國家？", "options": ["第一個", "第二個", "第三個", "第五個"], "answer": 1, "explanation": "蒙古人民共和國僅次於蘇聯成立，是全世界第二個社會主義國家。", "fun_fact": ""}, {"id": "history-EA-053", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "1609年入侵琉球、使琉球王國成為附庸的日本藩是？", "options": ["薩摩藩", "長州藩", "土佐藩", "肥前佐賀藩"], "answer": 0, "explanation": "薩摩藩出兵俘虜琉球國王尚寧，此後琉球一面向中國朝貢，一面受薩摩藩支配。", "fun_fact": ""}, {"id": "history-EA-054", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "1911年外蒙古宣布獨立時擁立的宗教領袖稱號是什麼？", "options": ["達賴喇嘛", "章嘉呼圖克圖", "博克多汗", "班禪額爾德尼"], "answer": 2, "explanation": "清朝覆亡之際外蒙古宣布獨立，由第八世哲布尊丹巴呼圖克圖即位，稱博克多汗。", "fun_fact": ""}, {"id": "history-EA-055", "topic": "history", "unit": "EA", "unit_name": "日韓・東亞", "category": "歷史", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "蒙古帝國在窩闊台汗時期營建的首都是哪一座城市？", "options": ["大都", "哈拉和林", "上都", "撒馬爾罕"], "answer": 1, "explanation": "窩闊台在1235年築城建宮，哈拉和林成為蒙古帝國的政治中心，遺址在今蒙古國中部。", "fun_fact": ""}, {"id": "wd-097", "topic": "history", "category": "大航海時代", "difficulty": 2, "type": "choice", "question": "1498 年繞過非洲南端、開通歐洲直達印度海路的葡萄牙航海家是誰？", "options": ["迪亞士", "哥倫布", "卡布拉爾", "達伽馬"], "answer": 3, "explanation": "達伽馬在 1497 年出發，繞過好望角後於 1498 年抵達印度西岸的卡利刻特，開通歐印海路。迪亞士則是更早繞行好望角，但沒有抵達印度。", "fun_fact": "這條航線讓葡萄牙能直接買到香料，繞開了原本由中東與威尼斯商人把持的轉手貿易。", "unit": "SEA", "unit_name": "東南亞・南亞", "region": "東南亞・南亞"}, {"id": "history-SEA-001", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "吳哥窟是哪一位高棉國王在十二世紀所興建的？", "options": ["蘇利耶跋摩二世", "闍耶跋摩七世", "闍耶跋摩二世", "因陀羅跋摩一世"], "answer": 0, "explanation": "吳哥窟約在西元 1113 至 1150 年間、蘇利耶跋摩二世在位時建成，是高棉帝國國力的高峰之作。", "fun_fact": "它原名意思是「毗濕奴的神聖居所」，本來是一座印度教神殿，後來才改為佛寺。"}, {"id": "history-SEA-002", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "吳哥城中央、以巨大人面石塔聞名的寺廟是哪一座？", "options": ["巴肯寺", "巴戎寺", "塔普倫寺", "女王宮"], "answer": 1, "explanation": "巴戎寺位於大吳哥（吳哥城）正中央，塔上雕著數十張巨大的微笑人面，是闍耶跋摩七世時期的代表作。", "fun_fact": "那些石雕人面常被說成「高棉的微笑」，一座塔往往四面都有臉，朝向東西南北。"}, {"id": "history-SEA-003", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "世界最大的佛教遺跡婆羅浮屠位於印尼哪一座島上？", "options": ["爪哇島", "蘇門答臘", "峇里島", "蘇拉威西"], "answer": 0, "explanation": "婆羅浮屠位於中爪哇的日惹附近，是九世紀夏連特拉王朝留下的大乘佛教建築。", "fun_fact": "整座塔是一個立體的壇城，信徒要繞著層層迴廊往上走，等於走完一趟修行之路。"}, {"id": "history-SEA-004", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "以海上貿易稱霸的室利佛逝王國，中心在哪一座島？", "options": ["蘇門答臘", "爪哇島", "婆羅洲", "蘇拉威西"], "answer": 0, "explanation": "室利佛逝以蘇門答臘的巨港（巴鄰旁）為核心，七到十一世紀控制麻六甲海峽一帶的海路。", "fun_fact": "唐代高僧義淨西行取經時曾在這裡停留，稱讚當地僧人上千、佛學風氣極盛。"}, {"id": "history-SEA-005", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "十四世紀稱霸南洋的滿者伯夷王國，核心位於哪座島？", "options": ["峇里島", "婆羅洲", "爪哇島", "蘇門答臘"], "answer": 2, "explanation": "滿者伯夷以東爪哇的滿者伯夷城（今特羅武蘭一帶）為都城，是印尼史上勢力最大的印度教王國。", "fun_fact": "今天印尼的國家格言「殊途同歸」，就出自滿者伯夷時代的古爪哇文詩篇。"}, {"id": "history-SEA-006", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "立下「不統一群島誓不安享」誓言的滿者伯夷宰相是誰？", "options": ["拉登巴達", "加查馬達", "哈奄武祿", "肯阿羅"], "answer": 1, "explanation": "加查馬達是滿者伯夷的權相，相傳他就職時立下誓言，不完成群島統一絕不享樂。", "fun_fact": "印尼把他的名字用在最負盛名的大學上，日惹的加查馬達大學就是這樣來的。"}, {"id": "history-SEA-007", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "十一世紀統一伊洛瓦底江流域、開創蒲甘王朝的國王是誰？", "options": ["江喜陀", "莽應龍", "那羅梯訶波帝", "阿奴律陀"], "answer": 3, "explanation": "阿奴律陀在 1044 年即位，把一個小邦擴張成緬甸史上第一個統一王朝，並大力推行上座部佛教。", "fun_fact": "蒲甘平原上至今還留著兩千多座磚塔，密度高到日出時放眼望去整片都是塔尖。"}, {"id": "history-SEA-008", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "緬甸古都蒲甘坐落在哪一條大河的沿岸？", "options": ["伊洛瓦底江", "薩爾溫江", "湄公河", "昭披耶河"], "answer": 0, "explanation": "蒲甘位於緬甸中部的伊洛瓦底江東岸，這條河自古就是緬甸的南北交通命脈。", "fun_fact": "蒲甘王朝十三世紀末在蒙古大軍的壓力下瓦解，塔林卻留了下來。"}, {"id": "history-SEA-009", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "被認為創制了泰文字母的素可泰王朝國王是誰？", "options": ["那萊王", "鄭信", "蘭甘亨", "拉瑪一世"], "answer": 2, "explanation": "蘭甘亨大帝在位於十三世紀後期，傳世的 1292 年石碑被視為泰文字母的起點。", "fun_fact": "那塊「蘭甘亨碑」已經被聯合國教科文組織列入世界記憶名錄。"}, {"id": "history-SEA-010", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "泰國大城（阿瑜陀耶）王朝的首都在 1767 年被哪一國攻陷？", "options": ["越南", "寮國", "緬甸", "高棉"], "answer": 2, "explanation": "1767 年緬甸貢榜王朝的軍隊圍城十四個月後攻破大城，結束了這個延續四百多年的王朝。", "fun_fact": "大城被燒毀後，暹羅很快在吞武里、曼谷重建政權，古城廢墟今天是世界遺產。"}, {"id": "history-SEA-011", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "今天泰國的王室，屬於下列哪一個王朝？", "options": ["大城王朝", "吞武里王朝", "卻克里王朝", "素可泰王朝"], "answer": 2, "explanation": "卻克里王朝由拉瑪一世在 1782 年建立，同時把首都遷到曼谷，一直延續至今。", "fun_fact": "泰國國王的稱號一律叫「拉瑪某世」，這個用法就是從卻克里王朝開始的。"}, {"id": "history-SEA-012", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "東南亞唯一從未被歐洲列強殖民的國家是哪一國？", "options": ["緬甸", "越南", "菲律賓", "泰國"], "answer": 3, "explanation": "泰國（暹羅）夾在英國與法國的勢力之間，靠著割地、改革與外交手腕維持住獨立地位。", "fun_fact": "英法在 1896 年講好把昭披耶河流域當成兩國之間的緩衝地帶，泰國因此保住主權。"}, {"id": "history-SEA-013", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1428 年擊退明朝大軍、開創後黎朝的越南領袖是誰？", "options": ["阮惠", "陳興道", "李公蘊", "黎利"], "answer": 3, "explanation": "黎利領導藍山起義，1427 年逼退明軍，隔年稱帝建立後黎朝，恢復大越的獨立。", "fun_fact": "河內市中心的還劍湖，傳說就是黎利把神劍還給湖中金龜的地方。"}, {"id": "history-SEA-014", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "越南最後一個王朝阮朝，把首都設在哪一座城市？", "options": ["峴港", "順化", "河內", "西貢"], "answer": 1, "explanation": "1802 年阮福映稱帝（嘉隆帝）建立阮朝，定都順化，這是越南史上最後一個王朝。", "fun_fact": "順化的皇城仿照北京紫禁城的格局興建，現在是越南第一處世界文化遺產。"}, {"id": "history-SEA-015", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "古代的占婆王國，領域大致位於今天哪一個國家？", "options": ["柬埔寨", "泰國", "寮國", "越南"], "answer": 3, "explanation": "占婆人自二世紀起在今越南中南部沿海建國，長期信奉印度教，留下美山聖地等磚砌塔群。", "fun_fact": "美山的磚塔不用灰漿黏合，工法至今仍沒有被完全解開。"}, {"id": "history-SEA-016", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "1954 年法軍在哪一場戰役慘敗，被迫退出印度支那？", "options": ["溪山戰役", "諒山戰役", "奠邊府戰役", "順化春節戰役"], "answer": 2, "explanation": "1954 年 3 到 5 月，越盟在武元甲指揮下圍殲奠邊府的法軍據點，直接促成法國撤出中南半島。", "fun_fact": "越盟把大砲拆解後用人力和單車搬上山，法軍完全沒料到山頭會出現重砲。"}, {"id": "history-SEA-017", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1521 年在麥克坦島擊敗並殺死麥哲倫的當地酋長是誰？", "options": ["西卡圖納", "拉普拉普", "荷馬本", "蘇萊曼"], "answer": 1, "explanation": "麥哲倫率領的船隊抵達菲律賓後介入當地紛爭，在麥克坦島被酋長拉普拉普的戰士擊殺。", "fun_fact": "麥哲倫本人沒能繞完地球，他的船隊由部下接手，才完成人類第一次環球航行。"}, {"id": "history-SEA-018", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1896 年被西班牙殖民當局槍決、被視為菲律賓國父的作家是誰？", "options": ["阿奎納多", "波尼法秀", "馬比尼", "黎剎"], "answer": 3, "explanation": "黎剎以小說揭露西班牙教會與殖民體制的弊病，1896 年在馬尼拉被以叛亂罪處決，成為革命象徵。", "fun_fact": "他是個標準的通才，會醫學、雕塑、詩文，還通曉十幾種語言。"}, {"id": "history-SEA-019", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "1898 年美西戰爭後，西班牙依巴黎條約把菲律賓割讓給哪一國？", "options": ["荷蘭", "美國", "英國", "日本"], "answer": 1, "explanation": "1898 年的巴黎條約結束美西戰爭，西班牙放棄古巴，並把菲律賓、關島、波多黎各交給美國。", "fun_fact": "美國為了菲律賓付給西班牙兩千萬美元，菲律賓人卻沒被問過意見，隨即爆發美菲戰爭。"}, {"id": "history-SEA-020", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1986 年菲律賓的「人民力量革命」推翻了哪一位總統？", "options": ["奎松", "馬可仕", "艾斯特拉達", "阿羅育"], "answer": 1, "explanation": "1986 年 2 月馬尼拉數十萬民眾湧上街頭，迫使統治二十年的馬可仕流亡海外，由艾奎諾夫人接任總統。", "fun_fact": "群眾當時擠在一條叫 EDSA 的大道上，所以這場革命也被稱作「EDSA 革命」。"}, {"id": "history-SEA-021", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "1945 年 8 月宣布印尼脫離荷蘭獨立的領導人是誰？", "options": ["哈比比", "蘇卡諾", "蘇哈托", "尤多約諾"], "answer": 1, "explanation": "1945 年 8 月 17 日，蘇卡諾在雅加達宣讀獨立宣言，成為印尼共和國的第一任總統。", "fun_fact": "宣言只有短短兩句話，念完不到一分鐘，卻換來四年的獨立戰爭。"}, {"id": "history-SEA-022", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "荷蘭東印度公司在亞洲的總部「巴達維亞」，是今天哪座城市？", "options": ["雅加達", "馬尼拉", "新加坡", "麻六甲"], "answer": 0, "explanation": "1619 年荷蘭人在爪哇建立巴達維亞，作為東印度公司的亞洲營運中心；1942 年日軍占領後把市名改為雅加達，1945 年印尼獨立後沿用至今。", "fun_fact": "荷蘭人把運河城市的規劃直接搬到熱帶，結果水道成了瘧蚊溫床，死亡率高得嚇人。"}, {"id": "history-SEA-023", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1511 年攻佔麻六甲、掌握麻六甲海峽的歐洲國家是哪一國？", "options": ["荷蘭", "英國", "葡萄牙", "西班牙"], "answer": 2, "explanation": "1511 年葡萄牙印度總督阿布奎克率軍攻下麻六甲蘇丹國，在當地築起「法摩沙堡」控制海峽。", "fun_fact": "麻六甲後來又被荷蘭、英國接手，一座小城換了三個歐洲主人。"}, {"id": "history-SEA-024", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "寮國歷史上的「瀾滄王國」，國名的意思是什麼？", "options": ["萬佛之邦", "百萬大象", "千島之國", "金色高原"], "answer": 1, "explanation": "瀾滄意為「百萬大象與白傘」，由法昂王在 1353 年建立，是寮國民族認同的源頭。", "fun_fact": "大象在當時是戰力也是王權象徵，寮國的舊王室旗幟上就畫著三頭白象。"}, {"id": "history-SEA-025", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "緬甸獨立運動領袖翁山，和翁山蘇姬是什麼關係？", "options": ["兄妹", "夫妻", "叔姪", "父女"], "answer": 3, "explanation": "翁山是緬甸獨立運動的核心人物，1947 年遭暗殺身亡，當時翁山蘇姬只有兩歲。", "fun_fact": "他談成獨立協議後半年就被刺殺，沒能親眼看到 1948 年緬甸正式獨立。"}, {"id": "history-SEA-026", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "新加坡在 1965 年脫離哪一個國家、成為獨立共和國？", "options": ["英國", "汶萊", "馬來西亞", "印度尼西亞"], "answer": 2, "explanation": "新加坡 1963 年併入馬來西亞，兩年後因政治與族群問題分道揚鑣，1965 年 8 月 9 日獨立建國。", "fun_fact": "李光耀宣布分家的記者會上一度哽咽落淚，那段影像成了新加坡的集體記憶。"}, {"id": "history-SEA-027", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "1955 年第一次亞非會議（萬隆會議）在哪一個國家舉行？", "options": ["印度", "埃及", "緬甸", "印尼"], "answer": 3, "explanation": "萬隆會議 1955 年 4 月在印尼西爪哇的萬隆召開，二十九個亞非國家出席，主張反殖民與和平共處。", "fun_fact": "這場會議奠下的原則，六年後促成了「不結盟運動」正式成立。"}, {"id": "history-SEA-028", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "東南亞國家協會（東協）1967 年在哪一座城市宣告成立？", "options": ["雅加達", "馬尼拉", "新加坡", "曼谷"], "answer": 3, "explanation": "1967 年 8 月 8 日，五國外長在曼谷簽署《東協宣言》，創始成員是印尼、馬來西亞、菲律賓、新加坡和泰國。", "fun_fact": "所以八月八日被訂為「東協日」，成員後來慢慢擴充到十國。"}, {"id": "history-SEA-029", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1975 至 1979 年統治柬埔寨的紅色高棉，最高領導人是誰？", "options": ["施亞努", "龍諾", "洪森", "波布"], "answer": 3, "explanation": "紅色高棉在波布領導下把國名改為「民主柬埔寨」，強制清空城市、廢除貨幣，最後被越南出兵推翻。", "fun_fact": "他們把 1975 年定為「元年」，等於宣稱歷史要從頭重算。"}, {"id": "history-SEA-030", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "東帝汶在 2002 年獨立之前，最早的殖民母國是哪一國？", "options": ["荷蘭", "西班牙", "英國", "葡萄牙"], "answer": 3, "explanation": "東帝汶自十六世紀起就是葡萄牙殖民地，1975 年葡萄牙撤出後被印尼併吞，2002 年才正式獨立。", "fun_fact": "同一個帝汶島被切成兩半，西半部走荷蘭路線成了印尼領土，東半部講葡萄牙語。"}, {"id": "history-SEA-031", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "印度河流域文明的摩亨佐達羅和哈拉帕，位於今天哪一國？", "options": ["斯里蘭卡", "尼泊爾", "巴基斯坦", "印度"], "answer": 2, "explanation": "這兩座青銅時代大城的遺址都在今天的巴基斯坦境內，以棋盤式街道和完善的下水道聞名。", "fun_fact": "他們留下的印章文字至今沒有人能解讀，連那是不是一種語言都還有爭論。"}, {"id": "history-SEA-032", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "印度史上第一個統一次大陸大部分地區的王朝是哪一個？", "options": ["孔雀王朝", "笈多王朝", "貴霜王朝", "巽伽王朝"], "answer": 0, "explanation": "孔雀王朝由旃陀羅笈多在西元前四世紀末建立，以摩揭陀的華氏城為都，版圖涵蓋次大陸絕大部分。", "fun_fact": "旃陀羅笈多的謀士考底利耶寫下《政事論》，被稱為古印度版的權謀教科書。"}, {"id": "history-SEA-033", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "阿育王是在哪一場戰爭之後深感悔悟、轉而護持佛教的？", "options": ["普拉西戰役", "羯陵伽戰爭", "俱盧之戰", "帕尼帕特戰役"], "answer": 1, "explanation": "阿育王征服東岸的羯陵伽時死傷慘重，他在自己的石刻詔書中表達悔意，此後改以佛法治國。", "fun_fact": "印度國徽上的四隻獅子，就是取自他豎立在鹿野苑的石柱柱頭。"}, {"id": "history-SEA-034", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "佛陀的誕生地藍毘尼，位於今天哪一個國家？", "options": ["尼泊爾", "印度", "不丹", "斯里蘭卡"], "answer": 0, "explanation": "藍毘尼在尼泊爾南部的平原上，阿育王曾親自來此立柱，柱上銘文確認這裡就是佛陀出生地。", "fun_fact": "這根石柱在十九世紀末被重新發現，等於用考古證據替傳說蓋章。"}, {"id": "history-SEA-035", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "佛陀是在下列哪一個地方悟道成佛的？", "options": ["菩提伽耶", "鹿野苑", "拘尸那羅", "王舍城"], "answer": 0, "explanation": "佛陀在菩提伽耶的菩提樹下悟道，這裡與出生地、初轉法輪處、涅槃處並列佛教四大聖地。", "fun_fact": "鹿野苑是他第一次說法的地方，拘尸那羅則是涅槃之地，四個點串起他的一生。"}, {"id": "history-SEA-036", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "玄奘在印度求法時留學的那爛陀寺，遺址位於今天哪一邦？", "options": ["比哈爾邦", "旁遮普邦", "拉賈斯坦邦", "喀拉拉邦"], "answer": 0, "explanation": "那爛陀寺是古代最著名的佛教大學，遺址在印度東部的比哈爾邦，玄奘曾在此隨戒賢學習約兩年。", "fun_fact": "玄奘回國時帶走六百多部梵文經典，靠的是馬隊一路馱回長安。"}, {"id": "history-SEA-037", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "被稱為印度「黃金時代」、出了阿耶波多等學者的王朝是哪一個？", "options": ["笈多王朝", "孔雀王朝", "貴霜王朝", "遮婁其王朝"], "answer": 0, "explanation": "笈多王朝時期文學、藝術與數學都有突破，世界上最早的十進位位值記數法就源於這個時代的印度。", "fun_fact": "阿耶波多在那時就主張地球會自轉，還把圓周率算到小數點後四位。"}, {"id": "history-SEA-038", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "德里的顧特卜塔是哪一個政權留下的勝利塔？", "options": ["蒙兀兒帝國", "笈多王朝", "馬拉塔聯盟", "德里蘇丹國"], "answer": 3, "explanation": "顧特卜塔由德里蘇丹國的開國者庫特布丁・艾伊拜克在 1199 年動工，是南亞現存最高的磚砌尖塔。", "fun_fact": "塔旁邊有一根一千六百年前的鐵柱，露天立到今天卻幾乎不生鏽。"}, {"id": "history-SEA-039", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1526 年在帕尼帕特擊敗德里蘇丹、開創蒙兀兒帝國的是誰？", "options": ["奧朗則布", "巴布爾", "阿克巴", "沙賈汗"], "answer": 1, "explanation": "巴布爾在 1526 年第一次帕尼帕特戰役中以火砲與騎兵擊潰易卜拉欣・洛迪，就此建立蒙兀兒帝國。", "fun_fact": "他來自中亞的費爾干納，父系出自帖木兒、母系出自成吉思汗。"}, {"id": "history-SEA-040", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "蒙兀兒皇帝阿克巴為了爭取非穆斯林支持，廢除了什麼？", "options": ["關稅", "鹽稅", "人頭稅", "土地稅"], "answer": 2, "explanation": "阿克巴廢除向非穆斯林徵收的人頭稅（吉茲亞），並任用印度教貴族擔任高官與將領。", "fun_fact": "他還在宮中辦跨宗教辯論會，找來印度教、耆那教、祆教甚至耶穌會士同場論道。"}, {"id": "history-SEA-041", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "泰姬瑪哈陵是蒙兀兒皇帝沙賈汗為誰而建的？", "options": ["他的父親", "他的長子", "他的愛妻", "他的母親"], "answer": 2, "explanation": "沙賈汗為紀念過世的愛妻慕塔芝瑪哈，在阿格拉的亞穆納河畔以白色大理石建造這座陵墓。", "fun_fact": "陵墓的鑲嵌花紋用上二十多種寶石與半寶石，材料從中亞、西藏甚至中國運來。"}, {"id": "history-SEA-042", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "把父親沙賈汗囚禁在阿格拉堡、奪得皇位的蒙兀兒皇帝是誰？", "options": ["奧朗則布", "賈汗季", "胡馬雍", "巴哈杜爾沙"], "answer": 0, "explanation": "奧朗則布在 1658 年的繼位鬥爭中勝出，宣稱父親無力理政而將他軟禁在阿格拉堡直到過世。", "fun_fact": "蒙兀兒帝國的版圖在他手上達到最大，卻也因長年征戰把國庫掏空。"}, {"id": "history-SEA-043", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "1757 年普拉西戰役中率領英國東印度公司軍隊獲勝的是誰？", "options": ["黑斯廷斯", "威靈頓", "寇松", "克萊夫"], "answer": 3, "explanation": "克萊夫在普拉西擊敗孟加拉的納瓦布，讓東印度公司實際掌握孟加拉的財政與行政大權。", "fun_fact": "這場仗其實靠收買對方將領才贏，真正的戰鬥只打了幾個小時。"}, {"id": "history-SEA-044", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1857 年印度民族起義之後，統治印度的權力落到了誰手上？", "options": ["英國王室", "東印度公司", "蒙兀兒皇帝", "地方土邦聯盟"], "answer": 0, "explanation": "起義被鎮壓後，英國國會通過法案解散東印度公司，改由英國政府直接統治印度，開啟「英屬印度」時期。", "fun_fact": "起義的導火線是新式子彈的塗油傳聞，士兵得用嘴咬開，印度教徒與穆斯林都無法接受。"}, {"id": "history-SEA-045", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "1857 年起義失敗後，末代蒙兀兒皇帝被英國流放到哪裡？", "options": ["加爾各答", "倫敦", "錫蘭", "仰光"], "answer": 3, "explanation": "巴哈杜爾沙二世被英軍逮捕後流放到緬甸仰光，並在當地過世，蒙兀兒帝國就此走入歷史。", "fun_fact": "他其實是個相當有名的烏爾都語詩人，晚年在流放地寫下不少哀嘆之作。"}, {"id": "history-SEA-046", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "1919 年英軍屠殺群眾的札連瓦拉園慘案發生在哪座城市？", "options": ["孟買", "阿姆利則", "德里", "加爾各答"], "answer": 1, "explanation": "1919 年 4 月，戴爾准將下令封住出口向園內群眾開火，這場慘案發生在旁遮普的阿姆利則。", "fun_fact": "這件事讓許多原本溫和的印度知識分子徹底轉向，泰戈爾因此退回英國授予的爵位。"}, {"id": "history-SEA-047", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "甘地 1930 年「食鹽進軍」的終點，是哪一個海邊村莊？", "options": ["蘇拉特", "孟買", "丹地", "果阿"], "answer": 2, "explanation": "甘地率眾徒步約 380 公里走到古吉拉特海邊的丹地，親手取鹽，公開違反英國的食鹽專賣法。", "fun_fact": "他說除了空氣和水，鹽大概是最不可少的東西，拿它開刀最能讓每個人都有感。"}, {"id": "history-SEA-048", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "1947 年印巴分治時，負責劃定兩國邊界的英國律師是誰？", "options": ["寇松勳爵", "雷德克里夫", "蒙巴頓勳爵", "羅伯・克萊夫"], "answer": 1, "explanation": "英國律師雷德克里夫在短短數週內畫出印巴邊界，旁遮普與孟加拉因此被一刀切成兩半。", "fun_fact": "他在動筆之前從沒到過印度，畫完之後也再沒回去過。"}, {"id": "history-SEA-049", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "印度獨立後的第一任總理是誰？", "options": ["拉達克里希南", "尼赫魯", "甘地", "帕特爾"], "answer": 1, "explanation": "尼赫魯在 1947 年印度獨立後出任第一任總理，任職到 1964 年過世為止。", "fun_fact": "他女兒甘地夫人與外孫拉吉夫後來也都當過印度總理。"}, {"id": "history-SEA-050", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 2, "type": "choice", "question": "被尊為巴基斯坦國父的政治領袖是誰？", "options": ["阿尤布汗", "布托", "真納", "伊克巴爾"], "answer": 2, "explanation": "真納長期領導全印穆斯林聯盟，主張穆斯林建國，1947 年出任巴基斯坦第一任總督。", "fun_fact": "巴基斯坦人稱他「偉大領袖」，他的頭像出現在幾乎每一種面額的鈔票上。"}, {"id": "history-SEA-051", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "孟加拉在 1971 年獨立之前，原本是哪一個國家的一部分？", "options": ["巴基斯坦", "印度", "緬甸", "斯里蘭卡"], "answer": 0, "explanation": "孟加拉原本是與西巴基斯坦相隔一千多公里的「東巴基斯坦」，1971 年在印度介入下打贏獨立戰爭。", "fun_fact": "語言問題是導火線之一：東邊講孟加拉語，卻被要求以烏爾都語為唯一國語。"}, {"id": "history-SEA-052", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 1, "type": "choice", "question": "舊稱「錫蘭」的，是今天哪一個國家？", "options": ["孟加拉", "緬甸", "斯里蘭卡", "馬爾地夫"], "answer": 2, "explanation": "這座島在英國統治時期稱為錫蘭，1948 年獨立，1972 年改制共和後正式改名斯里蘭卡。", "fun_fact": "它先後被葡萄牙、荷蘭、英國統治過，內陸的康提王國一直撐到 1815 年才失守。"}, {"id": "history-SEA-053", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "19 世紀在旁遮普建立錫克帝國、定都拉合爾的君主是誰？", "options": ["蘭吉特·辛格", "提普蘇丹", "希瓦吉", "巴哈杜爾沙二世"], "answer": 0, "explanation": "蘭吉特·辛格 1801 年稱王，以拉合爾為都建立錫克帝國，是英國在印度西北最難對付的對手。", "fun_fact": ""}, {"id": "history-SEA-054", "topic": "history", "unit": "SEA", "unit_name": "東南亞・南亞", "category": "歷史", "region": "東南亞・南亞", "difficulty": 3, "type": "choice", "question": "統一尼泊爾的沙阿王朝，原本是哪一個山城小國？", "options": ["帕坦", "廓爾喀", "加德滿都", "巴克塔布"], "answer": 1, "explanation": "十八世紀廓爾喀國王普利特維・納拉揚・沙阿逐一併吞加德滿都谷地各邦，建立統一的尼泊爾王國。", "fun_fact": "「廓爾喀兵」的名號就從這裡來，英軍打過幾場硬仗後乾脆開始招募他們。"}, {"id": "wd-008", "category": "歷史", "difficulty": 1, "type": "choice", "question": "名畫《蒙娜麗莎》的作者是誰？", "options": ["米開朗基羅", "梵谷", "畢卡索", "達文西"], "answer": 3, "explanation": "《蒙娜麗莎》是達文西的作品，收藏於巴黎羅浮宮。", "fun_fact": "這幅畫在 1911 年曾經被偷走，兩年後才找回來。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-010", "category": "歷史", "difficulty": 2, "type": "choice", "question": "巴黎艾菲爾鐵塔當初是為了哪個活動而建造？", "options": ["世界博覽會", "國王加冕", "奧運", "戰爭勝利紀念"], "answer": 0, "explanation": "艾菲爾鐵塔是為 1889 年巴黎世界博覽會而建。", "fun_fact": "剛建成時很多藝術家反對，覺得它醜。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-029", "category": "歷史", "difficulty": 1, "type": "choice", "question": "古羅馬城市「龐貝」是被哪一座火山爆發所掩埋？", "options": ["富士山", "維蘇威火山", "埃特納火山", "聖海倫斯火山"], "answer": 1, "explanation": "西元 79 年，義大利的維蘇威火山爆發，大量火山灰將龐貝城整個掩埋。", "fun_fact": "因為被火山灰封存，龐貝城連壁畫、麵包店和街上的塗鴉都保留了下來。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-030", "category": "歷史", "difficulty": 2, "type": "choice", "question": "15 世紀在歐洲發明金屬活字印刷術，讓書籍得以大量印製的是誰？", "options": ["馬丁·路德", "伽利略", "古騰堡", "哥白尼"], "answer": 2, "explanation": "德國人古騰堡約在 1450 年發展出金屬活字印刷術，大幅推動了知識在歐洲的傳播。", "fun_fact": "其實東亞更早就有活字印刷：現存最古老的金屬活字印刷書是韓國 1377 年印製的《直指》。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-031", "category": "歷史", "difficulty": 2, "type": "choice", "question": "率領船隊出發、進行人類第一次環球航行的航海家是誰？", "options": ["庫克船長", "達伽馬", "麥哲倫", "哥倫布"], "answer": 2, "explanation": "麥哲倫在 1519 年率西班牙船隊出發，但他在 1521 年死於菲律賓，最後由艾爾卡諾帶領剩下的船員於 1522 年回到西班牙，完成環球航行。", "fun_fact": "出發時有 5 艘船、約 240 至 270 人（各家說法不一），最後只有「維多利亞號」1 艘船、18 人回到西班牙。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-032", "category": "歷史", "difficulty": 2, "type": "choice", "question": "第二次世界大戰在歐洲的爆發，是因為德國在 1939 年入侵了哪個國家？", "options": ["波蘭", "法國", "挪威", "蘇聯"], "answer": 0, "explanation": "1939 年 9 月 1 日德國入侵波蘭，英、法兩國隨即在 9 月 3 日對德宣戰，第二次世界大戰爆發。", "fun_fact": "", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-033", "category": "歷史", "difficulty": 2, "type": "choice", "question": "象徵冷戰的「柏林圍牆」是在哪一年倒塌的？", "options": ["1961 年", "1989 年", "1975 年", "1991 年"], "answer": 1, "explanation": "柏林圍牆在 1989 年 11 月 9 日開放，隔年東西德統一。1961 年是圍牆開始興建的年份。", "fun_fact": "圍牆開放的起因之一，是東德官員在記者會上誤說新的出境規定「立即生效」。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-034", "category": "歷史", "difficulty": 2, "type": "choice", "question": "法國皇帝拿破崙其實是個特別矮小的人。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。拿破崙身高約 168 至 170 公分，在當時的法國男性中算是一般身高。「矮個子」的印象多半來自法制與英制單位換算的誤會，以及英國漫畫的醜化。", "fun_fact": "俗稱的「拿破崙情結」（形容矮個子愛逞強），就是從這個刻板印象而來的。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-035", "category": "歷史", "difficulty": 3, "type": "choice", "question": "拿破崙最後一次戰敗的「滑鐵盧戰役」，戰場位於今天的哪個國家？", "options": ["荷蘭", "德國", "法國", "比利時"], "answer": 3, "explanation": "1815 年的滑鐵盧戰役發生在今天比利時布魯塞爾的南方，拿破崙戰敗後被流放到南大西洋的聖赫勒拿島。", "fun_fact": "從此「滑鐵盧」就成了「慘敗」的代名詞。", "topic": "history", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-079", "topic": "history", "category": "古文明", "difficulty": 1, "type": "choice", "question": "古代奧林匹克運動會起源於下列哪一個古文明？", "options": ["古埃及", "古羅馬", "古希臘", "古印度"], "answer": 2, "explanation": "古代奧運會約從西元前 776 年起在古希臘的奧林匹亞舉行，是為了祭祀主神宙斯而辦的競技大會。", "fun_fact": "現代奧運在 1896 年於希臘雅典重新舉辦第一屆。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-080", "topic": "history", "category": "法國大革命", "difficulty": 1, "type": "choice", "question": "1789 年 7 月 14 日，巴黎群眾攻陷了哪個地方，成為法國大革命的象徵？", "options": ["巴黎聖母院", "楓丹白露宮", "凡爾賽宮", "巴士底監獄"], "answer": 3, "explanation": "巴士底監獄被視為王權專制的象徵，群眾在 1789 年 7 月 14 日攻陷它，這一天後來成為法國國慶日。", "fun_fact": "攻陷當天，監獄裡其實只關了 7 名囚犯。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-082", "topic": "history", "category": "第一次世界大戰", "difficulty": 1, "type": "choice", "question": "第一次世界大戰爆發於哪一年？", "options": ["1904 年", "1914 年", "1918 年", "1939 年"], "answer": 1, "explanation": "1914 年奧匈帝國皇儲在塞拉耶佛遇刺後，各國依同盟關係相繼參戰，第一次世界大戰爆發，1918 年結束。", "fun_fact": "當時很多人以為這場仗「耶誕節前就會打完」，結果打了四年多。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-083", "topic": "history", "category": "太空競賽", "difficulty": 1, "type": "choice", "question": "人類史上第一位進入太空的太空人是誰？", "options": ["加加林", "阿姆斯壯", "葛倫", "艾德林"], "answer": 0, "explanation": "蘇聯太空人加加林在 1961 年 4 月 12 日搭乘東方一號繞行地球一圈，成為第一位進入太空的人類。", "fun_fact": "整趟飛行只有約 108 分鐘。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-085", "topic": "history", "category": "科學革命", "difficulty": 1, "type": "choice", "question": "提出萬有引力定律與三大運動定律的科學家是誰？", "options": ["伽利略", "克卜勒", "牛頓", "波以耳"], "answer": 2, "explanation": "牛頓在 1687 年出版《自然哲學的數學原理》，提出三大運動定律與萬有引力定律，奠定古典力學基礎。", "fun_fact": "「被蘋果砸到而想到重力」的故事，是他晚年向友人講述的回憶，細節已難以查證。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-086", "topic": "history", "category": "科學革命", "difficulty": 1, "type": "choice", "question": "最早提出「地球繞著太陽運行」日心說的近代天文學家是誰？", "options": ["亞里斯多德", "托勒密", "伽利略", "哥白尼"], "answer": 3, "explanation": "波蘭天文學家哥白尼在 1543 年出版《天體運行論》，主張太陽而非地球位於中心，挑戰了托勒密的地心說。", "fun_fact": "這本書據說在他臨終那年才印行出版。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-091", "topic": "history", "category": "工業革命", "difficulty": 2, "type": "choice", "question": "18 世紀的工業革命最早發生在哪一個國家？", "options": ["法國", "德國", "美國", "英國"], "answer": 3, "explanation": "工業革命約於 18 世紀中葉從英國的紡織業與煤鐵工業開始，之後才擴散到歐陸與美國。", "fun_fact": "當時英國的棉紡織廠先集中在曼徹斯特一帶，那裡因此被稱為「棉都」。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-092", "topic": "history", "category": "工業革命", "difficulty": 2, "type": "choice", "question": "大幅改良蒸汽機效率、對工業革命影響深遠的蘇格蘭工程師是誰？", "options": ["史蒂芬生", "法拉第", "富爾頓", "瓦特"], "answer": 3, "explanation": "瓦特在 1769 年取得分離式冷凝器的專利，大幅提升蒸汽機效率，讓蒸汽動力得以廣泛應用於工廠與運輸。", "fun_fact": "功率單位「瓦特」就是以他命名的。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-093", "topic": "history", "category": "重要條約", "difficulty": 2, "type": "choice", "question": "第一次世界大戰結束後，協約國與德國在 1919 年簽訂的和約是？", "options": ["凡爾賽條約", "烏得勒支條約", "維也納和約", "樸茨茅斯條約"], "answer": 0, "explanation": "1919 年協約國與德國在巴黎近郊的凡爾賽宮簽訂《凡爾賽條約》，正式結束第一次世界大戰。", "fun_fact": "簽約地點鏡廳，正是 1871 年德意志帝國宣告成立的同一個大廳。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-094", "topic": "history", "category": "文藝復興", "difficulty": 2, "type": "choice", "question": "歐洲文藝復興最早發源於哪一個國家？", "options": ["法國", "義大利", "荷蘭", "西班牙"], "answer": 1, "explanation": "文藝復興於 14 世紀從義大利的佛羅倫斯等城市開始，之後才向西歐與北歐擴散。", "fun_fact": "佛羅倫斯的梅迪奇家族長期贊助藝術家，對文藝復興的發展影響很大。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-095", "topic": "history", "category": "宗教改革", "difficulty": 2, "type": "choice", "question": "1517 年發表《九十五條論綱》、引發歐洲宗教改革的是誰？", "options": ["喀爾文", "伊拉斯謨", "馬丁路德", "亨利八世"], "answer": 2, "explanation": "德國神學家馬丁路德在 1517 年提出《九十五條論綱》，質疑贖罪券的作法，引發宗教改革。", "fun_fact": "他把《聖經》譯成德文，對現代德語的定型也有很大影響。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-096", "topic": "history", "category": "太空競賽", "difficulty": 2, "type": "choice", "question": "人類第一顆人造衛星「史普尼克一號」是由哪個國家發射的？", "options": ["美國", "蘇聯", "德國", "英國"], "answer": 1, "explanation": "蘇聯在 1957 年 10 月 4 日發射史普尼克一號，成為第一顆繞地球運行的人造衛星，也揭開太空競賽序幕。", "fun_fact": "它只是個直徑約 58 公分的金屬球，靠無線電持續發出「嗶、嗶」的訊號。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-098", "topic": "history", "category": "古文明", "difficulty": 2, "type": "choice", "question": "亞歷山大大帝少年時期的老師是哪一位哲學家？", "options": ["蘇格拉底", "柏拉圖", "畢達哥拉斯", "亞里斯多德"], "answer": 3, "explanation": "馬其頓國王腓力二世聘請亞里斯多德擔任王子亞歷山大的老師，教導他哲學、文學與科學。", "fun_fact": "這三位哲學家剛好是師徒相承：蘇格拉底教柏拉圖，柏拉圖教亞里斯多德。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-099", "topic": "history", "category": "中世紀", "difficulty": 3, "type": "choice", "question": "1453 年攻陷君士坦丁堡、終結東羅馬帝國的是哪一個勢力？", "options": ["鄂圖曼帝國", "波斯帝國", "蒙古帝國", "阿拉伯帝國"], "answer": 0, "explanation": "鄂圖曼蘇丹穆罕默德二世在 1453 年攻下君士坦丁堡，東羅馬（拜占庭）帝國滅亡，該城後來稱為伊斯坦堡。", "fun_fact": "許多史家把這一年當作中世紀結束、近代開始的分界之一。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-100", "topic": "history", "category": "重要條約", "difficulty": 3, "type": "choice", "question": "結束歐洲三十年戰爭、常被視為近代主權國家體系起點的和約是？", "options": ["奧格斯堡和約", "烏得勒支條約", "維也納和約", "西發里亞和約"], "answer": 3, "explanation": "1648 年簽訂的《西發里亞和約》結束三十年戰爭，確立各邦國領土主權互不干涉的原則。", "fun_fact": "國際關係學界至今仍常用「西發里亞體系」來指稱以主權國家為單位的國際秩序。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-101", "topic": "history", "category": "第二次世界大戰", "difficulty": 3, "type": "choice", "question": "1945 年 2 月的雅爾達會議，是由哪三個國家的領袖會談？", "options": ["美國、英國、蘇聯", "美國、英國、法國", "美國、蘇聯、中國", "英國、法國、蘇聯"], "answer": 0, "explanation": "雅爾達會議由美國羅斯福、英國邱吉爾與蘇聯史達林在克里米亞的雅爾達舉行，商討戰後歐洲安排與對日作戰。", "fun_fact": "同年 7 月的波茨坦會議再度召開時，羅斯福已過世、邱吉爾也在會議期間因大選失利而換人。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "wd-102", "topic": "history", "category": "古文明", "difficulty": 3, "type": "choice", "question": "一般史書把西羅馬帝國滅亡訂在西元哪一年？", "options": ["西元 395 年", "西元 476 年", "西元 800 年", "西元 1453 年"], "answer": 1, "explanation": "西元 476 年，日耳曼將領奧多亞塞廢黜西羅馬末代皇帝羅慕路斯·奧古斯都路斯，通常以此作為西羅馬帝國滅亡之年。", "fun_fact": "羅馬帝國在 395 年分裂為東西兩部分，東羅馬帝國又延續了將近一千年。", "unit": "EU", "unit_name": "歐洲", "region": "歐洲"}, {"id": "history-EU-001", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "雅典衛城上的帕德嫩神廟，主要供奉哪一位神祇？", "options": ["阿波羅", "波賽頓", "雅典娜", "阿特米斯"], "answer": 2, "explanation": "帕德嫩神廟是為雅典守護神雅典娜而建，神廟內原本立有巨大的雅典娜神像。", "fun_fact": ""}, {"id": "history-EU-002", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "西元前 490 年雅典擊退波斯大軍的著名戰役是哪一場？", "options": ["溫泉關戰役", "薩拉米斯海戰", "普拉提亞戰役", "馬拉松戰役"], "answer": 3, "explanation": "馬拉松戰役中雅典重裝步兵大敗來犯的波斯軍，是波希戰爭中希臘人的第一場大勝。", "fun_fact": ""}, {"id": "history-EU-003", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "長達近三十年的伯羅奔尼撒戰爭，最後由哪一方獲勝？", "options": ["雅典", "斯巴達", "科林斯", "馬其頓王國"], "answer": 1, "explanation": "戰爭從西元前 431 年打到前 404 年，雅典投降，由斯巴達領導的伯羅奔尼撒聯盟取得勝利。", "fun_fact": ""}, {"id": "history-EU-004", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "古羅馬最早的成文法，因刻在銅牌上公布而得名，稱為什麼？", "options": ["漢摩拉比法典", "十二銅表法", "查士丁尼法典", "拿破崙法典"], "answer": 1, "explanation": "十二銅表法約制定於西元前 450 年，刻在十二塊銅牌上公開展示，被視為羅馬法的源頭。", "fun_fact": ""}, {"id": "history-EU-005", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "西元前 44 年在元老院被一群議員刺殺的羅馬領袖是誰？", "options": ["屋大維", "凱撒", "龐培", "西塞羅"], "answer": 1, "explanation": "終身獨裁官凱撒於西元前 44 年 3 月 15 日在元老院集會時，被以布魯圖斯為首的議員刺殺身亡。", "fun_fact": ""}, {"id": "history-EU-006", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "一般公認羅馬帝國的第一位皇帝是誰？", "options": ["尼祿", "圖拉真", "屋大維", "哈德良"], "answer": 2, "explanation": "屋大維在西元前 27 年獲元老院獻上「奧古斯都」尊號，被視為羅馬帝國的開端。", "fun_fact": ""}, {"id": "history-EU-007", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "1066 年黑斯廷斯戰役後入主英格蘭的是哪一位統治者？", "options": ["諾曼第公爵威廉", "丹麥國王克努特", "挪威國王哈拉爾", "法蘭西國王路易"], "answer": 0, "explanation": "諾曼第公爵威廉在黑斯廷斯擊敗英王哈羅德，隨後加冕為英格蘭國王，史稱諾曼征服。", "fun_fact": ""}, {"id": "history-EU-008", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "1215 年英格蘭貴族逼迫約翰王用印、限制王權的文件是什麼？", "options": ["大憲章", "權利法案", "獨立宣言", "人身保護令"], "answer": 0, "explanation": "大憲章於 1215 年由約翰王用印，確立國王也須受法律約束，後世視為憲政傳統的起點。", "fun_fact": ""}, {"id": "history-EU-009", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "14 世紀中葉橫掃歐洲、奪走大量人口的大瘟疫俗稱什麼？", "options": ["西班牙流感", "霍亂大流行", "黑死病", "天花大流行"], "answer": 2, "explanation": "黑死病是 1347 年起蔓延全歐的鼠疫大流行，估計奪走當時歐洲三分之一以上的人口。", "fun_fact": ""}, {"id": "history-EU-010", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "1095 年在克萊蒙會議上號召發動第一次十字軍東征的教宗是誰？", "options": ["格列高利七世", "英諾森三世", "烏爾班二世", "良十世"], "answer": 2, "explanation": "教宗烏爾班二世在 1095 年的克萊蒙會議演說中呼籲西歐騎士出兵，掀起了十字軍東征。", "fun_fact": ""}, {"id": "history-EU-011", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "英法百年戰爭中率軍解除奧爾良之圍的法國少女是誰？", "options": ["瑪蒂達", "艾蓮諾", "布蘭琪", "貞德"], "answer": 3, "explanation": "1429 年貞德帶兵解圍奧爾良，扭轉了法國在百年戰爭中的頹勢，後世稱她為聖女貞德。", "fun_fact": ""}, {"id": "history-EU-012", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "雕出《大衛像》、又畫了西斯汀禮拜堂天頂畫的藝術家是誰？", "options": ["米開朗基羅", "波提且利", "多那太羅", "布魯內雷斯基"], "answer": 0, "explanation": "米開朗基羅既是雕刻家也是畫家，《大衛像》與西斯汀禮拜堂天頂畫都出自他之  "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "法國大革命期間被送上斷頭台處死的法國國王是誰？", "options": ["路易十四", "路易十六", "路易十五", "查理十世"], "answer": 1, "explanation": "路易十六於 1793 年 1 月被國民公會判處死刑，在巴黎的斷頭台上被處決。", "fun_fact": ""}, {"id": "history-EU-020", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "主導法國大革命「恐怖統治」、最後在熱月政變中被處死的是誰？", "options": ["拉法葉侯爵", "喬治·丹敦", "羅伯斯比爾", "米拉波伯爵"], "answer": 2, "explanation": "雅各賓派領袖羅伯斯比爾推行恐怖統治，1794 年熱月政變後隨即被送上斷頭台。", "fun_fact": ""}, {"id": "history-EU-021", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 3, "type": "choice", "question": "打造蒸汽機車「火箭號」、被稱為「鐵路之父」的英國人是誰？", "options": ["特里維西克", "史蒂芬生", "阿克萊特", "哈格里夫斯"], "answer": 1, "explanation": "史蒂芬生父子打造的「火箭號」在 1829 年雷恩希爾機車競賽中勝出，奠定了蒸汽鐵路的基礎。", "fun_fact": ""}, {"id": "history-EU-022", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "1851 年倫敦萬國博覽會以鋼鐵和玻璃搭建的主場館叫什麼？", "options": ["白金漢宮", "皇家亞伯特廳", "西敏寺", "水晶宮"], "answer": 3, "explanation": "水晶宮由帕克斯頓設計，用鑄鐵骨架與大量玻璃組成，是 1851 年萬國博覽會的展覽館。", "fun_fact": ""}, {"id": "history-EU-023", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 1, "type": "choice", "question": "在塞拉耶佛遇刺、引爆第一次世界大戰的斐迪南大公是哪國皇儲？", "options": ["德意志帝國", "俄羅斯帝國", "鄂圖曼帝國", "奧匈帝國"], "answer": 3, "explanation": "斐迪南大公是奧匈帝國皇位繼承人，1914 年在塞拉耶佛遇刺後，奧匈向塞爾維亞宣戰。", "fun_fact": ""}, {"id": "history-EU-024", "topic": "history", "unit": "EU", "unit_name": "歐洲", "category": "歷史", "region": "歐洲", "difficulty": 2, "type": "choice", "question": "一戰中被稱為「絞肉機」、1916 年法德長期血戰的戰役是？", "options": ["索姆河戰役", "馬恩河戰役", "坦能堡戰役", "凡爾登戰役"], "answer": 3, "explanation": "凡爾登戰役從 1916 年 2 月打到 12 月，雙方死傷慘重，被稱為「凡爾登絞肉機」。", "fun_fact": ""}, {"id": "history-EU-025", "topic": "history", "unit": "EU", "uni options": ["林白", "愛迪生", "萊特兄弟", "貝爾"], "answer": 2, "explanation": "美國的萊特兄弟在 1903 年 12 月 17 日，於北卡羅來納州成功完成首次有動力、可操控的飛行。", "fun_fact": "第一次飛行只持續了約 12 秒，距離約 36 公尺，比一架波音 747 的翼展還短。", "topic": "history", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-081", "topic": "history", "category": "美國獨立", "difficulty": 1, "type": "choice", "question": "美國《獨立宣言》是在哪一年正式發表的？", "options": ["1620 年", "1776 年", "1789 年", "1812 年"], "answer": 1, "explanation": "北美十三州的代表在 1776 年 7 月 4 日通過《獨立宣言》，這一天成為美國國慶日。", "fun_fact": "宣言的主要起草人是後來成為第三任總統的傑佛遜。", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "wd-084", "topic": "history", "category": "第二次世界大戰", "difficulty": 1, "type": "choice", "question": "美國正式加入第二次世界大戰的直接導火線是哪一起事件？", "options": ["日本偷襲珍珠港", "德軍空襲倫敦", "德國入侵法國", "義大利進攻希臘"], "answer": 0, "explanation": "1941 年 12 月 7 日日本偷襲夏威夷珍珠港的美軍基地，美國隔天對日宣戰，正式參戰。", "fun_fact": "在此之前，美國國內主張不介入歐戰的聲音一直相當強。", "unit": "AM", "unit_name": "美洲", "region": "美洲"}, {"id": "history-AM-001", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "英國人在北美建立的第一個永久殖民地是哪裡？", "options": ["詹姆斯敦", "波士頓", "羅安諾克", "普利茅斯"], "answer": 0, "explanation": "1607 年建於維吉尼亞的詹姆斯敦，是英國在美洲第一個撐下來的殖民地。", "fun_fact": "頭幾年鬧飢荒，靠約翰·羅爾夫種菸草才轉虧為盈。"}, {"id": "history-AM-002", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "1620 年五月花號上的清教徒登陸在今天哪一州？", "options": ["康乃狄克州", "麻薩諸塞州", "維吉尼亞州", "紐約州"], "answer": 1, "explanation": "他們原本要去維吉尼亞，卻被吹到今天麻州的鱈魚角一帶落腳。", "fun_fact": "上岸前船上乘客簽下《五月花號公約》，被視為自治政府的雛形。"}, {"id": "history-AM-003", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1692 年北美著名的獵巫審判發生在哪個小鎮？", "options": ["康科德", "列星頓", "塞勒姆", "普洛威頓斯"], "answer": 2, "explanation": "麻薩諸塞灣殖民地的塞勒姆在 1692 年掀起獵巫風潮，二十人因此喪命。", "fun_fact": "當年被指控的多半是鄰里糾紛的對象，指控者常是少女。"}, {"id": "history-AM-004", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "1773 年波士頓茶葉事件中被倒進海裡的貨物是什麼？", "options": ["蔗糖", "棉花", "菸草", "茶葉"], "answer": 3, "explanation": "示威者裝扮成原住民登船，把東印度公司的整批茶葉倒進波士頓港。", "fun_fact": "他們抗議的與其說是茶稅，不如說是東印度公司的銷售專賣權。"}, {"id": "history-AM-005", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "美國《獨立宣言》的主要起草人是誰？", "options": ["湯瑪斯·傑佛遜", "班傑明·富蘭克林", "喬治·華盛頓", "約翰·亞當斯"], "answer": 0, "explanation": "五人委員會推舉傑佛遜執筆，他在 1776 年六月完成初稿。", "fun_fact": "他晚年最得意的三件事之一，就是寫了這份宣言。"}, {"id": "history-AM-006", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "美國獨立戰爭中英軍主力投降的決定性戰役是哪一場？", "options": ["邦克山戰役", "約克鎮戰役", "長島戰役", "薩拉托加戰役"], "answer": 1, "explanation": "1781 年康瓦利斯在維吉尼亞的約克鎮投降，英國自此無心再戰。", "fun_fact": "美法聯軍圍城時，法國艦隊先封鎖了海口，英軍才無路可退。"}, {"id": "history-AM-007", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "1787 年制定美國憲法的制憲會議在哪座城市召開？", "options": ["巴爾的摩", "紐約", "費城", "波士頓"], "answer": 2, "explanation": "各州代表齊聚費城的獨立廳，整個夏天閉門討論出新憲法。", "fun_fact": "會議全程保密，連窗戶都釘死，代表們熱得滿頭大汗。"}, {"id": "history-AM-008", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1803 年美國的路易斯安那購地是向哪一國買的？", "options": ["西班牙", "英國", "荷蘭", "法國"], "answer": 3, "explanation": "拿破崙急需戰費，把這片廣大土地賣給了傑佛遜政府。", "fun_fact": "這筆交易讓美國國土一口氣增加了將近一倍。"}, {"id": "history-AM-009", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "隨路易斯與克拉克遠征隊擔任翻譯與嚮導的原住民女性是誰？", "options": ["薩卡加維亞", "瑪拉琳切", "南西·沃德", "波卡虹塔斯"], "answer": 0, "explanation": "休休尼族的薩卡加維亞隨隊西行，靠她溝通才換得越山的馬匹。", "fun_fact": "她一路揹著襁褓中的兒子走完全程。"}, {"id": "history-AM-010", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "1812 年戰爭期間放火燒掉白宮的是哪一國軍隊？", "options": ["西班牙", "英國", "墨西哥", "法國"], "answer": 1, "explanation": "1814 年英軍攻進華盛頓，燒了白宮與國會大廈才撤走。", "fun_fact": "據說一場突如其來的暴風雨澆熄了大火，救下不少建築。"}, {"id": "history-AM-011", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1823 年宣示反對歐洲列強再插手美洲的外交主張是什麼？", "options": ["昭昭天命", "睦鄰政策", "門羅主義", "杜魯門主義"], "answer": 2, "explanation": "門羅總統在國情咨文中畫下界線：美洲不再是歐洲可殖民的地方。", "fun_fact": "當時美國海軍其實不強，真正在海上撐腰的是英國。"}, {"id": "history-AM-012", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "1830 年代切羅基人被迫西遷的慘劇通稱為什麼？", "options": ["西進之路", "傷膝河事件", "大遷徙", "淚之路"], "answer": 3, "explanation": "《印地安人遷移法案》通過後，切羅基人被押解到今奧克拉荷馬，沿途大量死亡。", "fun_fact": "切羅基人曾打贏最高法院官司，行政部門卻沒有照著執行。"}, {"id": "history-AM-013", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "1848 年薩特磨坊發現黃金，引爆哪一州的淘金熱？", "options": ["加利福尼亞州", "奧勒岡州", "內華達州", "科羅拉多州"], "answer": 0, "explanation": "消息傳開後，1849 年湧入大批淘金客，被稱為「四九人」。", "fun_fact": "真正賺到錢的常是賣鏟子和牛仔褲的商人。"}, {"id": "history-AM-014", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "美國南北戰爭的第一砲是在哪座要塞打響的？", "options": ["提康德羅加堡", "桑特堡", "麥克亨利堡", "諾克斯堡"], "answer": 1, "explanation": "1861 年南軍砲擊查爾斯頓港的桑特堡，內戰正式爆發。", "fun_fact": "三十多小時的砲擊竟然沒有人陣亡，死者出現在受降儀式上。"}, {"id": "history-AM-015", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1962 年古巴飛彈危機發生時的美國總統是誰？", "options": ["詹森", "杜魯門", "甘迺迪", "艾森豪"], "answer": 2, "explanation": "甘迺迪下令海上封鎖，十三天後雙方各退一步化解僵局。", "fun_fact": "美國私下也答應撤走部署在土耳其的飛彈。"}, {"id": "history-AM-016", "topic": "history", "unit": 歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "1929 年華爾街股市崩盤揭開了哪一段時期的序幕？", "options": ["咆哮的二十年代", "經濟大恐慌", "重建時期", "進步時代"], "answer": 1, "explanation": "十月的「黑色星期二」股價狂瀉，全球陷入長達十年的大蕭條。", "fun_fact": "崩盤前不少人是借錢炒股，股價一跌就血本無歸。"}, {"id": "history-AM-023", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "1930 年代推行「新政」的美國總統是誰？", "options": ["威爾遜", "杜魯門", "小羅斯福", "胡佛"], "answer": 2, "explanation": "小羅斯福上任後推動一連串救濟、改革與公共工程措施。", "fun_fact": "他透過廣播「爐邊談話」直接對全國人民說明政策。"}, {"id": "history-AM-024", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "二戰期間美國研發原子彈的計畫代號叫什麼？", "options": ["阿波羅計畫", "霸王行動", "雪崩行動", "曼哈頓計畫"], "answer": 3, "explanation": "曼哈頓計畫在新墨西哥州的洛斯阿拉莫斯完成設計，1945 年七月試爆成功。", "fun_fact": "參與人數達十多萬，多數人並不知道自己在造什麼。"}, {"id": "history-AM-025", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "金恩博士發表「我有一個夢想」演說的地點是哪裡？", "options": ["林肯紀念堂前", "白宮南草坪", "自由鐘廣場", "國會大廈前"], "answer": 0, "explanation": "1963 年華盛頓大遊行時，他站在林肯紀念堂台階上發表這場演說。", "fun_fact": "最後那段「我有一個夢想」據說是他臨場即興加上去的。"}, {"id": "history-AM-026", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1969 年阿波羅 11 號任務中，獨自留在指揮艙繞月的太空人是誰？", "options": ["艾德林", "柯林斯", "葛倫", "阿姆斯壯"], "answer": 1, "explanation": "阿姆斯壯與艾德林登陸月面時，柯林斯留在指揮艙「哥倫比亞號」待命。", "fun_fact": "他繞到月球背面時完全收不到訊號，被稱為最孤獨的人。"}, {"id": "history-AM-027", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "1608 年建立魁北克城的法國探險家是誰？", "options": ["卡伯特", "卡蒂埃", "尚普蘭", "拉薩爾"], "answer": 2, "explanation": "尚普蘭在聖羅倫斯河畔設立據點，後人稱他為「新法蘭西之父」。", "fun_fact": "他選的位置正好扼住河道最窄處，易守難攻。"}, {"id": "history-AM-028", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1759 年亞伯拉罕平原戰役中擊敗法軍的是哪一國？", "options": ["西班牙", "荷蘭", "美國", "英國"], "answer": 3, "explanation": "英軍在魁北克城外的亞伯拉罕平原取勝，新法蘭西自此易主。", "fun_fact": "英法兩軍主將沃爾夫與蒙卡爾姆都在這場戰役中傷重不治。"}, {"id": "history-AM-029", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "加拿大自治領是在哪一年正式成立的？", "options": ["1867 年", "1931 年", "1776 年", "1812 年"], "answer": 0, "explanation": "1867 年 7 月 1 日，四個省合組為加拿大自治領，這天成為加拿大國慶日。", "fun_fact": "最初只有安大略、魁北克、新斯科細亞與新伯倫瑞克四省。"}, {"id": "history-AM-030", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1999 年從西北地區分出、以因紐特人為主的地區是哪裡？", "options": ["育空", "努納福特", "拉布拉多", "亞伯達"], "answer": 1, "explanation": "努納福特於 1999 年成立，名稱在因紐特語中意為「我們的土地」。", "fun_fact": "它的面積佔加拿大國土的五分之一左右。"}, {"id": "history-AM-031", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1896 年的克朗代克淘金熱發生在加拿大哪一個地區？", "options": ["薩克其萬", "紐芬蘭", "育空", "曼尼托巴"], "answer": 2, "explanation": "育空的克朗代克河支流發現金礦，引來數萬人翻山越嶺湧入道森市。", "fun_fact": "警方規定入境者得自備一年份糧食，否則不准過關。"}, {"id": "history-AM-032", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "第一次世界大戰中加拿大軍團一戰成名的是哪場戰役？", "options": ["馬恩河戰役", "索姆河戰役", "凡爾登戰役", "維米嶺戰役"], "answer": 3, "explanation": "1917 年四月，加拿大四個師首次並肩作戰攻下維米嶺。", "fun_fact": "許多加拿大人把這場勝仗視為國族意識的起點。"}, {"id": "history-AM-033", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "哥倫布首次橫渡大西洋抵達美洲是在哪一年？", "options": ["1492 年", "1519 年", "1588 年", "1453 年"], "answer": 0, "explanation": "1492 年十月，他的船隊在今巴哈馬群島登陸，稱之為聖薩爾瓦多。", "fun_fact": "他到死都還以為自己抵達的是亞洲的邊緣。"}, {"id": "history-AM-034", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "「美洲」這個名字是取自哪位航海家？", "options": ["瓦斯科·達伽馬", "亞美利哥·維斯普奇", "喬瓦尼·卡伯特", "巴爾托洛梅烏·迪亞士"], "answer": 1, "explanation": "德國製圖師瓦爾德澤米勒 1507 年繪製世界地圖時，用他的名字標示新大陸。", "fun_fact": "他最早主張這片土地是「新大陸」，不是亞洲。"}, {"id": "history-AM-035", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1494 年《托爾德西利亞斯條約》瓜分新世界的是哪兩國？", "options": ["英格蘭與法蘭西", "荷蘭與葡萄牙", "西班牙與葡萄牙", "葡萄牙與法蘭西"], "answer": 2, "explanation": "兩國在大西洋上畫一條分界線，線東歸葡萄牙、線西歸西班牙。", "fun_fact": "這條線剛好切到南美東端，巴西因此說葡萄牙語。"}, {"id": "history-AM-036", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "阿茲提克首都特諾奇提特蘭的遺址位於今天哪座城市？", "options": ["利馬", "波哥大", "瓜地馬拉市", "墨西哥城"], "answer": 3, "explanation": "西班牙人摧毀這座湖上都城後，就地蓋起了今天的墨西哥城。", "fun_fact": "當年全城靠堤道對外聯絡，還有引水道送淡水進城。"}, {"id": "history-AM-037", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1521 年率兵消滅阿茲提克帝國的西班牙征服者是誰？", "options": ["科爾特斯", "皮薩羅", "德索托", "巴爾波亞"], "answer": 0, "explanation": "科爾特斯結合周邊不滿阿茲提克的城邦，圍城數月後攻陷首都。", "fun_fact": "天花在圍城期間橫掃守軍，成了隱形的幫兇。"}, {"id": "history-AM-038", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "印加帝國的首都設在哪座城市？", "options": ["基多", "庫斯科", "利馬", "波托西"], "answer": 1, "explanation": "庫斯科是印加人心目中的世界中心，四大地區由此向外輻射。", "fun_fact": "印加語把帝國叫作「四方之地」。"}, {"id": "history-AM-039", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "在卡哈馬卡俘虜印加皇帝阿塔瓦爾帕的西班牙人是誰？", "options": ["巴爾波亞", "德索托", "皮薩羅", "阿爾瓦拉多"], "answer": 2, "explanation": "1532 年皮薩羅以不到兩百人設伏擒王，印加帝國從此崩解。", "fun_fact": "印加人交出滿屋黃金贖人，皇帝最後仍遭處死。"}, {"id": "history-AM-040", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "沒有文字的印加人靠什麼工具記錄數字與帳目？", "options": ["彩繪陶片", "貝殼串珠", "刻痕骨片", "奇普結繩"], "answer": 3, "explanation": "奇普用不同顏色的繩子打結，以結的位置和形式表示數量。", "fun_fact": "專門解讀奇普的官員在帝國裡是受敬重的專業人士。"}, {"id": "history-AM-041", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "前哥倫布時代的美洲，唯一發展出完整文字系統的是哪個文明？", "options": ["馬雅", "奧爾梅克", "印加", "阿茲提克"], "answer": 0, "explanation": "馬雅文字兼有表音與表意符號，能完整記錄語言與歷史。", "fun_fact": "多數馬雅古籍在殖民初期被燒毀，只剩下四本抄本。"}, {"id": "history-AM-042", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "被視為中美洲「母文化」、以巨石人頭聞名的是哪個文明？", "options": ["米斯特克", "奧爾梅克", "薩波特克", "托爾特克"], "answer": 1, "explanation": "奧爾梅克活躍於墨西哥灣沿岸，許多中美洲文化的元素可追到他們。", "fun_fact": "巨石人頭最重的超過五十噸，石材卻來自數十公里外。"}, {"id": "history-AM-043", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "著名的「太陽金字塔」位於墨西哥哪一座古城遺址？", "options": ["帕倫克", "蒙特阿爾萬", "特奧蒂瓦坎", "圖拉"], "answer": 2, "explanation": "特奧蒂瓦坎在西元前後興起，太陽金字塔是全城最大的建築。", "fun_fact": "阿茲提克人來到時此城早已荒廢，他們替它取了現在的名字。"}, {"id": "history-AM-044", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "只有從高空才看得出圖案的納斯卡線位於哪一國？", "options": ["玻利維亞", "厄瓜多", "智利", "秘魯"], "answer": 3, "explanation": "納斯卡線刻在秘魯南部的乾旱高原上，因幾乎不下雨才保存至今。", "fun_fact": "圖案包括蜂鳥、猴子和蜘蛛，最大的長達數百公尺。"}, {"id": "history-AM-045", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "西班牙殖民美洲時強制原住民勞動與納貢的制度叫什麼？", "options": ["委託監護制", "大莊園制", "分配勞役制", "米塔制"], "answer": 0, "explanation": "殖民者取得委託監護權，名義上保護與教化原住民，實際上是強制勞役。", "fun_fact": "傳教士拉斯·卡薩斯畢生奔走，力促廢除這套制度。"}, {"id": "history-AM-046", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "殖民時期供應西班牙巨量白銀的波托西銀礦，位於今天哪一國？", "options": ["秘魯", "玻利維亞", "智利", "墨西哥"], "answer": 1, "explanation": "波托西的「富山」在十六世紀中葉開採，白銀經由西班牙流向全世界。", "fun_fact": "大量美洲白銀最後輾轉流入中國，成為明清的通用貨幣。"}, {"id": "history-AM-047", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "拉丁美洲第一個脫離殖民統治而獨立的國家是哪一國？", "options": ["阿根廷", "墨西哥", "海地", "巴西"], "answer": 2, "explanation": "海地在 1804 年宣布獨立，是由奴隸起義建立的第一個共和國。", "fun_fact": "起義初期的靈魂人物杜桑·盧維杜爾，被捕後死於法國獄中。"}, {"id": "history-AM-048", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "被尊稱為南美「解放者」的獨立運動領袖是誰？", "options": ["蘇克雷", "聖馬丁", "伊達爾戈", "玻利瓦"], "answer": 3, "explanation": "玻利瓦率軍解放今委內瑞拉、哥倫比亞等地，曾建立大哥倫比亞。", "fun_fact": "玻利維亞這個國名就是為了紀念他而取的。"}, {"id": "history-AM-049", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 3, "type": "choice", "question": "1810 年喊出「多洛雷斯吶喊」揭開墨西哥獨立序幕的是誰？", "options": ["伊達爾戈神父", "莫雷洛斯神父", "伊圖爾比德將軍", "胡亞雷斯總統"], "answer": 0, "explanation": "伊達爾戈在多洛雷斯鎮敲鐘號召起義，九月十六日成為墨西哥國慶日。", "fun_fact": "起義隔年他就被捕處決，獨立要到 1821 年才真正達成。"}, {"id": "history-AM-050", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 2, "type": "choice", "question": "1822 年宣布巴西獨立並登基稱帝的是誰？", "options": ["卡布拉爾", "佩德羅一世", "若昂六世", "佩德羅二世"], "answer": 1, "explanation": "葡萄牙王儲佩德羅拒絕返國，宣布獨立後成為巴西第一位皇帝。", "fun_fact": "拿破崙進逼時，葡萄牙王室曾整批搬到里約熱內盧。"}, {"id": "history-AM-051", "topic": "history", "unit": "AM", "unit_name": "美洲", "category": "歷史", "region": "美洲", "difficulty": 1, "type": "choice", "question": "連通大西洋與太平洋的巴拿馬運河在哪一年正式通航？", "options": ["1869 年", "1898 年", "1914 年", "1936 年"], "answer": 2, "explanation": "美國接手法國未竟的工程，1904 年動工、1914 年通航。", "fun_fact": "工程最大的難關不是挖土，而是黃熱病與瘧疾。"}, {"id": "wd-012", "category": "歷史", "difficulty": 2, "type": "choice", "question": "埃及最有名的三座大金字塔位在哪裡？", "options": ["阿斯旺", "路克索", "亞歷山大港", "吉薩"], "answer": 3, "explanation": "三座大金字塔位於開羅近郊的吉薩。", "fun_fact": "古夫金字塔是古代世界七大奇蹟中，唯一保存到今天的。", "topic": "history", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-036", "category": "歷史", "difficulty": 3, "type": "choice", "question": "幫助學者破解古埃及象形文字的關鍵文物是什麼？", "options": ["死海古卷", "羅塞塔石碑", "納斯卡線", "圖坦卡門黃金面具"], "answer": 1, "explanation": "羅塞塔石碑上用象形文字、埃及世俗體和古希臘文刻了同一段內容，法國學者商博良在 1822 年藉此破解了象形文字。", "fun_fact": "羅塞塔石碑是 1799 年由法國士兵發現的，現在收藏在倫敦的大英博物館。", "topic": "history", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-037", "category": "歷史", "difficulty": 3, "type": "choice", "question": "埃及豔后克麗奧佩脫拉七世生活的年代，距離大金字塔建成的時間，比距離人類登陸月球的時間還要近。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。古夫大金字塔約建於西元前 2560 年，克麗奧佩脫拉七世死於西元前 30 年，相距約 2,500 年；而她離 1969 年人類登月只有約 2,000 年。", "fun_fact": "對埃及豔后來說，大金字塔已經是「古蹟」了。", "topic": "history", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-078", "topic": "history", "category": "古文明", "difficulty": 1, "type": "choice", "question": "被稱為「文明搖籃」的美索不達米亞平原，主要位於今天哪個國家境內？", "options": ["伊朗", "伊拉克", "埃及", "土耳其"], "answer": 1, "explanation": "美索不達米亞意為「兩河之間的土地」，指底格里斯河與幼發拉底河之間的平原，主要範圍在今天的伊拉克。", "fun_fact": "蘇美人在這裡發展出楔形文字，是目前已知最早的文字系統之一。", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-087", "topic": "history", "category": "中世紀與十字軍", "difficulty": 1, "type": "choice", "question": "中世紀十字軍東征的主要目標，是要奪取哪一座城市？", "options": ["君士坦丁堡", "大馬士革", "耶路撒冷", "亞歷山大港"], "answer": 2, "explanation": "十字軍東征以奪回被視為聖地的耶路撒冷為號召，第一次東征在 1099 年攻下該城。", "fun_fact": "十字軍東征前後延續了將近兩百年。", "unit": "OTH", "unit_name": "中東・非洲・大洋洲", "region": "中東・非洲・大洋洲"}, {"id": "wd-088", "topic": "history", "category": "古文明", "difficulty": 1, "type": "choice", "question": "古埃及人最常用來書寫的紙狀材料是什麼？", "options": ["莎草紙", "羊皮紙", "竹簡", "泥板"], "answer": 0, "explanation": "古埃及人把尼羅河畔的莎草莖剖成薄片，交錯壓製成莎草紙來書寫。泥板是兩河流域的用法，竹簡則出自古代中國。", "fun_fact": "英文的 paper（
