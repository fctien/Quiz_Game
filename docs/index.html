<style>
/* 校園明亮配色：北科藍 + 暖橘，大圓角卡片 */
:root{
  --ground:#F6F8FC; --paper:#FFFFFF; --ink:#12233F; --muted:#66768F; --line:#DFE7F2;
  --blue:#1F53B5; --blue-soft:#E6EEFC; --cinnabar:#F0762A; --cinnabar-soft:#FDECDF;
  --jade:#12A05F; --jade-soft:#E1F6EC;
  --shadow:0 2px 4px rgba(18,35,63,.06),0 12px 28px rgba(18,35,63,.10);
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1828; --paper:#17233A; --ink:#E9EFFA; --muted:#93A3BC; --line:#28364F;
    --blue:#6E9BFF; --blue-soft:#1B2A47; --cinnabar:#FF8A3D; --cinnabar-soft:#3A2416;
    --jade:#34C77B; --jade-soft:#12301F;
    --shadow:0 2px 4px rgba(0,0,0,.40),0 12px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    --ground:#0F1828; --paper:#17233A; --ink:#E9EFFA; --muted:#93A3BC; --line:#28364F;
  --blue:#6E9BFF; --blue-soft:#1B2A47; --cinnabar:#FF8A3D; --cinnabar-soft:#3A2416;
  --jade:#34C77B; --jade-soft:#12301F;
  --shadow:0 2px 4px rgba(0,0,0,.40),0 12px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* 沒有這行,display:grid 會蓋掉 hidden 屬性 */
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 首頁 */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:2.6rem;line-height:1.1;margin:0;letter-spacing:.08em;font-weight:700}
h1 .seal{display:inline-grid;place-items:center;width:1.25em;height:1.25em;margin-left:.15em;font-size:.55em;
  vertical-align:.45em;background:var(--cinnabar);color:#fff;border-radius:4px;letter-spacing:0}
/* 品牌字樣 PULSE:跟在中文名後面的小字標 */
h1 .wordmark{display:inline-block;margin-left:.35em;padding:.18em .5em;font-size:.34em;vertical-align:.85em;
  background:linear-gradient(96deg,var(--blue),var(--cinnabar));color:#fff;border-radius:999px;
  letter-spacing:.26em;text-indent:.26em;font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;text-wrap:balance}
.best{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.best b{display:block;font-size:1.35rem;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;
  text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s}
.cat:hover{border-color:var(--blue)}
.cat:active{transform:scale(.98)}
.cat .sealbox{flex:none;min-width:44px;width:auto;height:44px;padding:0 6px;box-sizing:border-box;
  border:2px solid var(--cinnabar);color:var(--cinnabar);border-radius:6px;white-space:nowrap;
  display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:700}
/* 單元代號比較長時(例如 PyTorch 的 L1-2、L10)自動縮小字,才不會擠出方框 */
.cat .sealbox.long{font-size:1.05rem;letter-spacing:-.01em}
.cat .sealbox.xlong{font-size:.82rem;letter-spacing:-.02em}
.cat[data-k="news"] .sealbox,.cat[data-k="mix"] .sealbox{border-color:var(--blue);color:var(--blue)}
.cat b{display:block;font-size:1.05rem;line-height:1.3}
.cat small{color:var(--muted);font-size:.8rem}
.rules{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;font-size:.9rem;color:var(--muted)}
.rules h2{font-family:var(--display);font-size:1.05rem;color:var(--ink);margin:0 0 4px;letter-spacing:.1em}
.rules ul{margin:0;padding-left:1.2em}

/* 遊戲 */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lives{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--cinnabar);display:block}
.lives i.off{background:transparent;border:1.5px solid var(--line)}
.prog{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.score{font-family:var(--mono);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.streak{color:var(--cinnabar);font-size:.85rem;min-height:1.5em;text-align:center;font-weight:500}
.timer{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.timer i{display:block;height:100%;background:var(--blue);width:100%;transition:width .25s linear}
.timer.low i{background:var(--cinnabar)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem;margin-bottom:10px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 7px;letter-spacing:.05em}
.qbox{position:relative}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 18px;box-shadow:var(--shadow);
  font-family:var(--display);font-size:1.4rem;line-height:1.55;font-weight:700;white-space:pre-wrap;text-wrap:balance}
.stamp{position:absolute;right:-4px;top:-28px;width:54px;height:54px;border:3px solid currentColor;border-radius:8px;
  display:grid;place-items:center;font-family:var(--display);font-size:1.9rem;font-weight:700;transform:rotate(-12deg);
  background:var(--paper);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.stamp.pass{color:var(--cinnabar)} .stamp.fail{color:var(--muted)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
  cursor:pointer;font-size:1.02rem;display:flex;gap:12px;align-items:center;transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .n{flex:none;width:26px;height:26px;border-radius:6px;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;font-weight:600}
.opt.picked{border-color:var(--blue)}
.opt.good{border-color:var(--jade);background:var(--jade-soft)}
.opt.good .n{background:var(--jade);color:var(--paper)}
.opt.bad{border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.opt.bad .n{background:var(--cinnabar);color:var(--paper)}
.opt.gone{opacity:.25;pointer-events:none}
.opt[disabled]{cursor:default}
/* 選項裡的程式碼也要看得到縮排（.n 是 A/B/C/D 的圓角標，.cnt 是人數，不受影響） */
.opt span:not(.n),.hopt span:not(.n):not(.cnt),.popt span:not(.n){white-space:pre-wrap}

.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:var(--display);font-size:1.6rem;padding:16px}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.row{display:flex;gap:10px;margin-top:12px}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700;background:var(--blue);color:var(--paper);flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.powers{display:flex;gap:8px;margin-top:16px}
.pw{flex:1;font-size:.82rem;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:8px 4px;cursor:pointer;color:var(--muted)}
.pw:not(:disabled):hover{border-color:var(--blue);color:var(--blue)}
.pw:disabled{opacity:.35;cursor:default}

/* 解說 */
.fb{margin-top:16px;border-left:3px solid var(--line);padding:4px 0 4px 14px}
.fb.ok{border-color:var(--jade)} .fb.no{border-color:var(--cinnabar)}
.fb h3{margin:0 0 4px;font-family:var(--display);font-size:1.25rem}
.fb.ok h3{color:var(--jade)} .fb.no h3{color:var(--cinnabar)}
.fb p{margin:6px 0;max-width:36em}
.fun{background:var(--blue-soft);border-radius:8px;padding:8px 12px;font-size:.93rem}
.fun b{color:var(--blue);font-weight:700;margin-right:4px}
.fb a{color:var(--blue);word-break:break-all;font-size:.85rem}
.pop{animation:pop .3s ease both}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 脈衝榜 */
.result{text-align:center}
.bang{display:inline-block;margin-top:8px;padding:18px 28px 14px;border:2px solid var(--cinnabar);border-radius:6px;position:relative}
.bang small{display:block;color:var(--muted);letter-spacing:.3em;font-size:.8rem}
.rank{font-family:var(--display);font-size:3rem;line-height:1.2;font-weight:700;color:var(--cinnabar);letter-spacing:.15em}
.big{font-family:var(--mono);font-size:2rem;font-weight:600;margin:14px 0 2px}
.newbest{color:var(--cinnabar);font-weight:700;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border-block:1px solid var(--line)}
.stat{padding:10px 4px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:1.25rem}
.stat small{color:var(--muted)}
.review{text-align:left;margin-top:14px}
.review div{padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;display:flex;gap:10px}
.review span.m{flex:none;width:1.4em;font-family:var(--display);font-weight:700}
.review .y{color:var(--jade)} .review .x{color:var(--cinnabar)} .review .s{color:var(--muted)}
.err{color:var(--cinnabar);margin-top:12px}
/* 排行榜 */
.linkbtn{margin-top:12px;width:100%;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;
  cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.linkbtn:hover{border-color:var(--cinnabar)}
.linkbtn span:first-child{font-family:var(--display);font-size:1.1rem;letter-spacing:.1em}
.linkbtn .arrow{color:var(--cinnabar)}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbhead h1{font-size:2.2rem}
.back{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px 0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px;background:var(--paper)}
.seg button{background:transparent;border:0;padding:6px 16px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips button{flex:none;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  cursor:pointer;font-size:.85rem;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700}
.chips.multi{flex-wrap:wrap;overflow:visible}      /* 單元多的時候換行，不要橫向捲動 */
.chips.multi button{flex:none}
.board{margin-top:10px;border-top:2px solid var(--ink)}
.entry{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.entry.me{background:var(--cinnabar-soft)}
.entry .pos{font-family:var(--mono);color:var(--muted);text-align:center;font-weight:600}
.entry .pos.top{font-family:var(--display);color:var(--cinnabar);font-size:1.05rem;letter-spacing:.05em}
.entry .who{min-width:0}
.entry .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .who small{color:var(--muted);font-size:.78rem}
.entry .pts{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:.8rem;margin-top:10px}
.lbform{margin-top:18px;text-align:left}
.lbform label{font-family:var(--display);font-size:1.1rem;font-weight:700;letter-spacing:.1em}
.lbform .row{margin-top:6px}
.lbform input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink)}
.lbform input:focus{outline:2px solid var(--blue);outline-offset:1px}
.lbform .btn{flex:none;background:var(--cinnabar)}
.placed{margin-top:18px;padding:12px;border:1.5px dashed var(--cinnabar);border-radius:10px}
.placed b{color:var(--cinnabar);font-family:var(--mono)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ================= 模式選擇 ================= */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:20px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modes button{background:transparent;border:0;padding:10px 8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:1rem}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.mp-panel{margin-top:18px;display:grid;gap:12px}
.mp-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.mp-card h3{margin:0 0 4px;font-family:var(--display);font-size:1.3rem;letter-spacing:.08em}
.mp-card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.codein{font-family:var(--mono);font-size:1.6rem;letter-spacing:.4em;text-align:center;width:100%;padding:10px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.codein:focus,.textin:focus{outline:2px solid var(--blue);outline-offset:1px}
.textin{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:.85rem;color:var(--muted);font-weight:500}

/* ================= 四個選項的顏色 ================= */
:root{--o0:#1F53B5;--o1:#F0762A;--o2:#12A05F;--o3:#8B5CF6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--o0:#6E9BFF;--o1:#FF8A3D;--o2:#34C77B;--o3:#A78BFA}}
:root[data-theme="dark"]{--o0:#6E9BFF;--o1:#FF8A3D;--o2:#34C77B;--o3:#A78BFA}
.o0{--oc:var(--o0)} .o1{--oc:var(--o1)} .o2{--oc:var(--o2)} .o3{--oc:var(--o3)}

/* ================= 主持人 ================= */
.wide{max-width:980px}
.hostbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.hostbar b{color:var(--ink)}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
@media (max-width:720px){.lobby{grid-template-columns:1fr}}
.joinbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.joinbox small{display:block;color:var(--muted);letter-spacing:.2em}
.bigcode{font-family:var(--mono);font-size:clamp(3rem,12vw,5.5rem);font-weight:600;letter-spacing:.12em;line-height:1.1;margin:6px 0}
.qr{width:min(220px,70%);margin:10px auto 6px;background:#fff;padding:8px;border-radius:8px}
.qr svg{width:100%;height:auto;display:block}
.joinurl{font-family:var(--mono);font-size:.85rem;color:var(--blue);word-break:break-all}
.joinacts{justify-content:center;flex-wrap:wrap}
.joinacts .btn{flex:none;padding:8px 16px;font-size:.92rem}
.entryline{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.placed.warnnote{border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.btn.ghost.abort{color:var(--cinnabar);border-color:var(--cinnabar)}
.btn.ghost.abort:hover{background:var(--cinnabar);color:#fff}
.pill.notice{background:var(--cinnabar-soft);color:var(--cinnabar);margin:10px auto;display:inline-block}
.roster h2{font-family:var(--display);margin:0 0 10px;font-size:1.3rem;letter-spacing:.08em}
.roster h2 span{font-family:var(--mono);color:var(--cinnabar)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--paper);animation:pop .3s ease both}
.pchip.off{opacity:.45;border-style:dashed}
.pchip{display:inline-flex;align-items:center;gap:6px;padding-right:6px}
.pchip .sid{font-style:normal;font-size:.76em;color:var(--muted);font-family:var(--mono,monospace)}
.pchip .kick{border:0;background:var(--line);color:var(--ink);cursor:pointer;
  width:20px;height:20px;line-height:1;border-radius:50%;font-size:.72rem;padding:0;
  display:grid;place-items:center;opacity:.55;transition:background .15s,opacity .15s}
.pchip .kick:hover,.pchip .kick:focus-visible{background:var(--cinnabar);color:#fff;opacity:1}
.hq{display:grid;gap:16px;margin-top:10px}
.hqtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cd{width:72px;height:72px;border-radius:50%;border:3px solid var(--blue);display:grid;place-items:center;
  font-family:var(--mono);font-size:1.8rem;font-weight:600;flex:none}
.cd.low{border-color:var(--cinnabar);color:var(--cinnabar)}
.hqtext{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:700;line-height:1.45;text-wrap:balance;white-space:pre-wrap}
.double{display:inline-block;background:var(--cinnabar);color:var(--paper);border-radius:6px;padding:2px 10px;font-weight:700;font-size:.85rem;letter-spacing:.1em}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.hopts{grid-template-columns:1fr}}
.hopt{border:2px solid var(--oc);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--paper);font-size:1.15rem;position:relative;overflow:hidden}
.hopt .n{flex:none;width:34px;height:34px;border-radius:8px;background:var(--oc);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.hopt .bar{position:absolute;inset:auto 0 0 0;height:5px;background:var(--oc);transform-origin:left;transition:transform .6s ease}
.hopt .cnt{margin-left:auto;font-family:var(--mono);font-weight:600}
.hopt.dim{opacity:.35}
.hopt.win{box-shadow:0 0 0 3px var(--oc)}
.answered{font-family:var(--mono);color:var(--muted)}
.answered b{color:var(--ink);font-size:1.3rem}
.hreveal{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.hreveal{grid-template-columns:1fr}}
.fastest{color:var(--cinnabar);font-weight:700}
.topboard .entry .pos{font-size:1rem}
.move{font-family:var(--mono);font-size:.8rem;margin-left:6px}
.move.up{color:var(--jade)} .move.down{color:var(--cinnabar)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:10px;margin:20px 0 10px;text-align:center}
.pod{border:2px solid var(--cinnabar);border-bottom:0;border-radius:10px 10px 0 0;padding:12px 6px;background:var(--paper)}
.pod .t{font-family:var(--display);color:var(--cinnabar);font-size:1.4rem;font-weight:700;letter-spacing:.1em}
.pod b{display:block;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-family:var(--mono);color:var(--muted)}
.pod.p1{min-height:170px} .pod.p2{min-height:130px} .pod.p3{min-height:105px}
.conn{font-size:.8rem;color:var(--cinnabar)}

/* ================= 玩家 ================= */
.popts{display:grid;gap:10px;margin-top:14px}
.popt{border:0;border-radius:12px;padding:16px;background:var(--oc);color:var(--paper);font-size:1.1rem;font-weight:700;
  text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:60px}
.popt .n{flex:none;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--mono)}
.popt:active{transform:scale(.98)}
.popt[disabled]{cursor:default}
.sent{text-align:center;padding:30px 10px}
.sent .picked-big{display:inline-flex;gap:10px;align-items:center;border:2px solid var(--oc);border-radius:12px;padding:12px 18px;margin:14px 0;font-weight:700}
.bigstamp{width:110px;height:110px;margin:10px auto;border:4px solid currentColor;border-radius:12px;display:grid;place-items:center;
  font-family:var(--display);font-size:3.6rem;font-weight:700;transform:rotate(-10deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.bigstamp.pass{color:var(--cinnabar)} .bigstamp.fail{color:var(--muted)}
.gain{font-family:var(--mono);font-size:2rem;font-weight:600;text-align:center}
.center{text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;color:var(--muted)}

.cd.up{border-color:var(--muted);color:var(--muted)}
.rules h2 small{font-weight:400;font-size:.8rem;margin-left:8px}


/* ================= 校園明亮：外型與動態 ================= */
.cat,.q,.joinbox,.mp-card,.lbform input,.fill{border-radius:18px}
.hopt,.popt,.btn,.pw,.textin,.codein,.seg,.entry .pts{border-radius:14px}
.cat{border:0;box-shadow:var(--shadow)}
.cat:hover{box-shadow:0 4px 8px rgba(18,35,63,.08),0 16px 34px rgba(18,35,63,.14);transform:translateY(-1px)}
.sealbox{border:0;background:var(--cinnabar-soft);border-radius:12px}
.seal{border-radius:8px}
.pod{border-radius:16px 16px 0 0}
.bang{border-radius:16px}
.popt{box-shadow:0 4px 0 rgba(0,0,0,.14)}
.popt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn{transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,83,181,.28)}

/* 題目與選項進場,一個接一個 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opts .opt,.popts .popt,.hopts .hopt{animation:rise .34s ease both}
.opts .opt:nth-child(2),.popts .popt:nth-child(2),.hopts .hopt:nth-child(2){animation-delay:.06s}
.opts .opt:nth-child(3),.popts .popt:nth-child(3),.hopts .hopt:nth-child(3){animation-delay:.12s}
.opts .opt:nth-child(4),.popts .popt:nth-child(4),.hopts .hopt:nth-child(4){animation-delay:.18s}
.board .entry{animation:rise .3s ease both}
.board .entry:nth-child(2){animation-delay:.05s}
.board .entry:nth-child(3){animation-delay:.1s}
.board .entry:nth-child(4){animation-delay:.15s}
.board .entry:nth-child(5){animation-delay:.2s}

/* 倒數最後五秒:脈動提醒 */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cd.low{animation:pulse .9s ease-in-out infinite}
.timer.low i{animation:pulse .9s ease-in-out infinite;transform-origin:left}

/* 連中加分:文字微微跳動 */
@keyframes flick{0%,100%{opacity:1}50%{opacity:.55}}
.streak:not(:empty){animation:flick 1.4s ease-in-out infinite}

/* 頒獎台升起 */
@keyframes grow{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.pod{transform-origin:bottom;animation:grow .5s cubic-bezier(.2,1.4,.4,1) both}
.pod.p1{animation-delay:.25s} .pod.p3{animation-delay:.12s}


/* ================= 依主題換布景 =================
   body 的 data-topic 由前端在開始出題時設定。
   每個主題有自己的重點色與淡淡的底紋；A/B/C/D 四個選項顏色固定不變，
   學生不會因為換主題而認錯顏色。 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--art,none),var(--pattern,none);
  background-size:cover,auto;
  background-position:center center,0 0;
  background-repeat:no-repeat,repeat;
  opacity:var(--pattern-opacity,.34)}

/* Python：程式碼格線 + 官方藍黃 */
body[data-topic="python"]{--blue:#2B6CB0; --blue-soft:#E3EEF9; --cinnabar:#D99100; --cinnabar-soft:#FCF1D7;
  --pattern:repeating-linear-gradient(0deg,rgba(43,108,176,.07) 0 1px,transparent 1px 26px),
            repeating-linear-gradient(90deg,rgba(43,108,176,.05) 0 1px,transparent 1px 26px);}
body[data-topic="python"] .q,body[data-topic="python"] .hqtext{font-family:var(--mono),var(--body)}

/* VBA：Excel 風格 —— 試算表綠、儲存格格線 */
body[data-topic="vba"]{--blue:#217346; --blue-soft:#E3F1E9; --cinnabar:#C1610A; --cinnabar-soft:#FBEBDA;
  --ground:#F2F7F4;}
body[data-topic="vba"] .q,body[data-topic="vba"] .hqtext{font-family:var(--mono),var(--body)}
body[data-topic="vba"] .masthead h1,body[data-topic="vba"] .lbhead h1{color:#217346}
body[data-topic="vba"] .cat .sealbox{background:rgba(33,115,70,.13);color:#217346}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body[data-topic="vba"]{--ground:#0B1A12}
}
:root[data-theme="dark"] body[data-topic="vba"]{--ground:#0B1A12}

<script>window.EMBEDDED_BANK = {"geo": [{"id": "tw-005", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣最高的山是哪一座？", "options": ["雪山", "合歡山", "阿里山", "玉山"], "answer": 3, "explanation": "玉山主峰海拔約 3,952 公尺，是台灣第一高峰。", "fun_fact": "玉山比日本富士山（約 3,776 公尺）還高。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-006", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣最長的河流是？", "options": ["淡水河", "大甲溪", "高屏溪", "濁水溪"], "answer": 3, "explanation": "濁水溪全長約 186 公里，是台灣最長的河流。", "fun_fact": "因為上游帶來大量泥沙讓河水混濁，所以叫「濁水」。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-007", "category": "地理", "difficulty": 1, "type": "choice", "question": "日月潭位在哪一個縣？", "options": ["台中市", "嘉義縣", "南投縣", "花蓮縣"], "answer": 2, "explanation": "日月潭位於南投縣魚池鄉。", "fun_fact": "湖中的拉魯島是邵族的祖靈聖地。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-008", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣位於哪兩個板塊的交界，所以地震特別多？", "options": ["太平洋板塊與北美板塊", "菲律賓海板塊與太平洋板塊", "歐亞板塊與菲律賓海板塊", "印澳板塊與歐亞板塊"], "answer": 2, "explanation": "台灣位於歐亞板塊與菲律賓海板塊的交界處。", "fun_fact": "板塊擠壓也是台灣高山林立的原因。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-009", "category": "地理", "difficulty": 2, "type": "choice", "question": "下列哪個縣市設有「北回歸線標誌」？", "options": ["嘉義縣", "屏東縣", "台南市", "宜蘭縣"], "answer": 0, "explanation": "北回歸線通過嘉義與花蓮，兩地都設有標誌。", "fun_fact": "北回歸線會因地球自轉軸的變化而緩慢移動，所以嘉義的標誌蓋過好幾代。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-010", "category": "地理", "difficulty": 2, "type": "choice", "question": "太魯閣峽谷主要是由哪一條溪切割形成的？", "options": ["卑南溪", "蘭陽溪", "立霧溪", "秀姑巒溪"], "answer": 2, "explanation": "立霧溪長期切割大理石岩層，形成太魯閣峽谷。", "fun_fact": "太魯閣的大理石峭壁有些高達數百公尺。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-016", "category": "地理", "difficulty": 2, "type": "choice", "question": "台北 101 曾經是世界最高的大樓。", "options": ["對", "錯"], "answer": 0, "explanation": "台北 101 在 2004 到 2010 年間是世界最高建築，後來被杜拜的哈里發塔超越。", "fun_fact": "大樓裡有一顆巨大的「風阻尼器」，用來減少颱風和地震時的晃動。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-027", "category": "地理", "difficulty": 2, "type": "choice", "question": "澎湖群島的島嶼，大多是由哪一種岩石構成的？", "options": ["石灰岩", "花崗岩", "玄武岩", "大理石"], "answer": 2, "explanation": "澎湖群島多由火山熔岩冷卻形成的玄武岩構成，常可見整齊的柱狀節理。", "fun_fact": "七美著名的「雙心石滬」，就是先民用玄武岩和咾咕石堆成的捕魚陷阱。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-028", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣第一座成立的國家公園是？", "options": ["太魯閣國家公園", "墾丁國家公園", "玉山國家公園", "陽明山國家公園"], "answer": 1, "explanation": "墾丁國家公園於 1984 年成立，是台灣第一座國家公園。", "fun_fact": "每年秋天國慶日前後，大批灰面鵟鷹會飛過墾丁，因此被暱稱為「國慶鳥」。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-029", "category": "地理", "difficulty": 2, "type": "choice", "question": "在台北陽明山的小油坑，可以看到噴氣孔和硫磺結晶，這是因為當地屬於？", "options": ["石灰岩洞穴", "珊瑚礁海岸", "大屯火山群", "泥火山地形"], "answer": 2, "explanation": "陽明山一帶屬於大屯火山群，地底仍有熱源，才會有噴氣孔、硫磺和溫泉。", "fun_fact": "大屯火山群中的七星山海拔約 1,120 公尺，是台北市的最高峰。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-030", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣南部的「泥火山」會噴出滾燙的岩漿。", "options": ["對", "錯"], "answer": 1, "explanation": "泥火山噴出的是泥漿，是地下天然氣帶著泥水冒出地表形成的，溫度通常和常溫差不多，並不是岩漿。", "fun_fact": "高雄燕巢的烏山頂泥火山已被劃設為自然保留區，泥漿堆成的小錐丘很像迷你火山。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-031", "category": "地理", "difficulty": 3, "type": "choice", "question": "新北野柳地質公園的著名岩石「女王頭」，屬於哪一種地形？", "options": ["蕈狀岩", "沙丘", "海蝕洞", "鐘乳石"], "answer": 0, "explanation": "女王頭是海岸岩石經海水與風化侵蝕後，形成上粗下細、像香菇一樣的蕈狀岩。", "fun_fact": "女王頭的「脖子」因侵蝕越來越細，未來可能會斷裂，所以園區也做了仿製的女王頭。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-032", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣冬天吹東北季風時，哪一帶最容易下雨？", "options": ["嘉義、雲林一帶", "台中、彰化一帶", "台南、高雄一帶", "基隆、宜蘭一帶"], "answer": 3, "explanation": "東北季風帶著海上的水氣吹向台灣東北部，遇到山地抬升就容易降雨，基隆、宜蘭首當其衝。", "fun_fact": "基隆因為雨下得多，有「雨港」之稱。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-033", "category": "地理", "difficulty": 2, "type": "choice", "question": "以「麻豆文旦」聞名的麻豆，位於哪個縣市？", "options": ["宜蘭縣", "台中市", "屏東縣", "台南市"], "answer": 3, "explanation": "麻豆是台南市的一個區，種植文旦的歷史悠久，是著名的文旦產地。", "fun_fact": "中秋節吃柚子的習俗，一說是因為「柚」和「佑」同音，有保佑平安的意思。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-034", "category": "地理", "difficulty": 1, "type": "choice", "question": "每年春夏之交舉辦「黑鮪魚文化觀光季」而聞名的漁港是？", "options": ["屏東東港", "宜蘭南方澳", "基隆八斗子", "嘉義布袋"], "answer": 0, "explanation": "屏東東港是台灣黑鮪魚的主要卸貨港，黑鮪魚季已成為當地的招牌活動。", "fun_fact": "東港有「三寶」：黑鮪魚、櫻花蝦和油魚子。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-035", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣本島的形狀常被比喻成哪一種作物？", "options": ["蕃薯", "香蕉", "玉米", "芒果"], "answer": 0, "explanation": "台灣本島南北狹長、中間略寬，外形很像一條蕃薯。", "fun_fact": "也因為這樣，許多台灣人會以「蕃薯仔」自稱。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-036", "category": "地理", "difficulty": 3, "type": "choice", "question": "台灣本島的最東端是哪裡？", "options": ["鵝鑾鼻", "貓鼻頭", "富貴角", "三貂角"], "answer": 3, "explanation": "三貂角位於新北市貢寮區，是台灣本島最東的地點；富貴角在最北端，鵝鑾鼻與貓鼻頭則在南端。", "fun_fact": "「三貂」這個名字，源自 17 世紀西班牙人為它取的名字「Santiago」。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-037", "category": "地理", "difficulty": 1, "type": "order", "question": "請依地理位置由北到南排出這些縣市：", "options": ["屏東縣", "雲林縣", "桃園市", "苗栗縣"], "answer": [2, 3, 1, 0], "explanation": "由北到南依序是桃園市、苗栗縣、雲林縣、屏東縣。", "fun_fact": "", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-038", "category": "地理", "difficulty": 2, "type": "choice", "question": "花東縱谷夾在哪兩座山脈之間？", "options": ["玉山山脈與阿里山山脈", "中央山脈與海岸山脈", "雪山山脈與中央山脈", "海岸山脈與雪山山脈"], "answer": 1, "explanation": "花東縱谷西側是中央山脈、東側是海岸山脈，從花蓮一路延伸到台東。", "fun_fact": "有名的池上米和關山米，就產自花東縱谷南段。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-052", "category": "地理", "difficulty": 1, "type": "choice", "question": "金門最有名、常被當成伴手禮的特產酒是哪一種？", "options": ["小米酒", "梅酒", "紹興酒", "高粱酒"], "answer": 3, "explanation": "金門土地貧瘠、氣候乾燥，適合種植耐旱的高粱，當地酒廠釀造的高粱酒因此成為金門代表特產。", "fun_fact": "金門另一項知名特產「金門菜刀」，傳統上是用過去戰爭留下的砲彈鋼材打造的。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-053", "category": "地理", "difficulty": 1, "type": "choice", "question": "以山城老街、階梯與茶樓聞名的「九份」，位在哪個縣市？", "options": ["宜蘭縣", "基隆市", "台北市", "新北市"], "answer": 3, "explanation": "九份位於新北市瑞芳區，早年因採金而繁榮，現在是熱門的山城老街。", "fun_fact": "相傳早年這裡只有九戶人家，對外採買時總是要「九份」，地名因此而來。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-054", "category": "地理", "difficulty": 1, "type": "choice", "question": "每年春夏在馬祖海邊出現、會發出藍光的「藍眼淚」，主要是由什麼造成的？", "options": ["夜光蟲等會發光的浮游生物", "月光照在海面上的反光", "成群的螢火蟲", "海底火山噴出的氣體"], "answer": 0, "explanation": "藍眼淚主要是一種叫「夜光蟲」的渦鞭毛藻，受到海浪拍打等刺激時會發出藍光，4到6月是最容易看到的季節。", "fun_fact": "春夏閩江進入洪水期，把大量營養鹽帶進馬祖海域，浮游生物跟著大量繁殖，藍眼淚也就特別多。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-055", "category": "地理", "difficulty": 1, "type": "choice", "question": "綠島的「朝日溫泉」有什麼特別之處？", "options": ["位在海拔三千公尺的高山上", "是水溫很低的冷泉", "是黑色的泥漿溫泉", "是罕見的海底（鹹水）溫泉"], "answer": 3, "explanation": "朝日溫泉的泉水從海邊的礁岩湧出，帶有海水的鹹味，是全世界少見的海底溫泉。", "fun_fact": "朝日溫泉面向太平洋，許多遊客會一大早去泡湯，邊泡邊看日出。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-056", "category": "地理", "difficulty": 1, "type": "choice", "question": "有一座八個拱形相連的跨海步橋、傳說有三位仙人登臨過的「三仙台」，位在哪個縣？", "options": ["宜蘭縣", "屏東縣", "花蓮縣", "台東縣"], "answer": 3, "explanation": "三仙台位於台東縣成功鎮，屬於東部海岸國家風景區，由離岸小島與珊瑚礁海岸構成，跨海步橋長近400公尺。", "fun_fact": "相傳呂洞賓、李鐵拐、何仙姑曾在島上的三塊巨石停留，「三仙台」因此得名。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-057", "category": "地理", "difficulty": 2, "type": "choice", "question": "蘭嶼在改名之前，常被稱為什麼？", "options": ["紅頭嶼", "琉球嶼", "雞籠嶼", "火燒島"], "answer": 0, "explanation": "蘭嶼舊稱「紅頭嶼」，1947年因為島上盛產蝴蝶蘭而改名為蘭嶼。火燒島是綠島的舊稱，雞籠嶼是基隆嶼的舊稱，琉球嶼則是小琉球的正式名稱。", "fun_fact": "島上的達悟族稱蘭嶼為「Ponso no Tao」，意思是「人之島」。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-058", "category": "地理", "difficulty": 2, "type": "choice", "question": "宜蘭外海的龜山島，是怎麼形成的？", "options": ["河川泥沙沖積而成", "冰河搬運岩石堆成", "火山活動形成的火山島", "珊瑚礁慢慢堆積而成"], "answer": 2, "explanation": "龜山島是火山島，經定年研究發現，它在過去約7000年內至少發生過四次火山活動，因此被列為台灣的活火山之一，也是台灣最年輕的火山島。", "fun_fact": "龜山島「龜首」附近海底有溫泉湧出，與海水混合後變成乳白色，被稱為「牛奶海」。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-059", "category": "地理", "difficulty": 2, "type": "choice", "question": "台灣公路的最高點「武嶺」（海拔約3275公尺），位在哪一條公路上？", "options": ["台8線（中橫主線）", "台20線（南橫公路）", "台18線（阿里山公路）", "台14甲線（合歡山公路）"], "answer": 3, "explanation": "武嶺位於台14甲線上，是合歡山一帶的熱門景點，海拔約3275公尺，也是台灣公路的最高點。", "fun_fact": "冬天寒流來時，武嶺一帶常會下雪，吸引許多人上山賞雪。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-060", "category": "地理", "difficulty": 2, "type": "choice", "question": "以高聳海崖直落太平洋聞名的「清水斷崖」，位在哪一條公路沿線？", "options": ["北部濱海公路", "中部橫貫公路", "蘇花公路", "南迴公路"], "answer": 2, "explanation": "清水斷崖位於花蓮縣和平與崇德之間，蘇花公路沿著斷崖修築，是蘇花公路最壯觀的一段。", "fun_fact": "清水斷崖的山壁以接近90度的角度緊臨太平洋，被譽為台灣八大景之一。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-061", "category": "地理", "difficulty": 2, "type": "choice", "question": "嘉義的「奮起湖」以鐵路便當聞名，地名裡的「湖」是什麼意思？", "options": ["一座溫泉池", "一座高山湖泊", "一座人工水庫", "四周環山的低窪山坳地"], "answer": 3, "explanation": "奮起湖位於嘉義縣竹崎鄉、阿里山森林鐵路沿線，三面環山、中間低平，形狀像畚箕，舊稱「畚箕湖」。台語把山坳地稱為「湖」，當地其實沒有湖。", "fun_fact": "奮起湖海拔約1400公尺，過去是阿里山森林鐵路的重要中途站，旅客常在這裡買便當，「奮起湖便當」因此出名。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-062", "category": "地理", "difficulty": 2, "type": "choice", "question": "新竹的舊地名是什麼？", "options": ["艋舺", "竹塹", "打狗", "諸羅"], "answer": 1, "explanation": "新竹舊稱「竹塹」，一般認為與當地道卡斯族的「竹塹社」有關；1875年設新竹縣，取「新的竹塹」之意。諸羅是嘉義，打狗是高雄，艋舺是台北萬華。", "fun_fact": "新竹因為秋冬東北季風特別強，有「風城」的稱號，強風也很適合製作米粉和柿餅。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-063", "category": "地理", "difficulty": 2, "type": "choice", "question": "以少見的「泥漿溫泉」聞名的關子嶺溫泉，位在哪個縣市？", "options": ["台東縣", "台南市", "宜蘭縣", "新北市"], "answer": 1, "explanation": "關子嶺溫泉位於台南市白河區，泉水含有泥質，是台灣少見的泥漿溫泉，與北投、陽明山、四重溪並稱台灣四大溫泉。", "fun_fact": "關子嶺附近還有「水火同源」奇景：天然氣從岩縫冒出燃燒，旁邊同時有泉水流出。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-064", "category": "地理", "difficulty": 3, "type": "choice", "question": "「南迴鐵路」的西端起點，是屏東縣的哪一個車站？", "options": ["潮州", "東港", "枋寮", "恆春"], "answer": 2, "explanation": "南迴鐵路從屏東枋寮到台東，全長約98公里，穿越中央山脈南段，1991年完工、隔年開始營運。潮州屬於屏東線，恆春和東港目前都沒有台鐵車站。", "fun_fact": "南迴鐵路通車後，台灣的環島鐵路網終於完整接起來。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-065", "category": "地理", "difficulty": 3, "type": "choice", "question": "下列哪一座山「不」屬於「台灣五岳」？", "options": ["北大武山", "南湖大山", "秀姑巒山", "合歡山"], "answer": 3, "explanation": "台灣五岳是玉山、雪山、秀姑巒山、南湖大山和北大武山。合歡山雖然也是百岳，但不在五岳之列。", "fun_fact": "合歡山主峰離公路很近，常被當成入門百岳，是許多人第一次登上三千公尺高山的地方。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-066", "category": "地理", "difficulty": 3, "type": "choice", "question": "下列哪一條河川「不是」淡水河的支流？", "options": ["新店溪", "基隆河", "大漢溪", "頭前溪"], "answer": 3, "explanation": "淡水河的三大支流是基隆河、新店溪和大漢溪；頭前溪則是新竹地區自己的河川，直接流入台灣海峽。", "fun_fact": "大漢溪和新店溪在台北萬華、板橋一帶匯流後才稱為淡水河，最後在淡水、八里之間出海。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-067", "category": "地理", "difficulty": 3, "type": "choice", "question": "又稱「膨風茶」的東方美人茶，獨特的蜜香是因為茶芽被哪一種小昆蟲叮咬過？", "options": ["小綠葉蟬", "蜜蜂", "蠶", "螞蟻"], "answer": 0, "explanation": "東方美人茶的幼嫩茶芽經小綠葉蟬刺吸（俗稱「著涎」），再經加工後產生特殊的蜜香與熟果香。主要產於新竹北埔、峨眉及苗栗一帶。", "fun_fact": "相傳早年茶農把被蟲咬過的茶拿去賣，竟賣到好價錢，說出來被鄉親笑是「膨風」（吹牛），「膨風茶」的名字就這樣傳開了。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-068", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣的梅雨季大約在每年五、六月，常帶來連續多日的降雨。", "options": ["對", "錯"], "answer": 0, "explanation": "每年五、六月，梅雨鋒面常在台灣附近徘徊，帶來連日降雨，是台灣重要的水資源來源之一。", "fun_fact": "「梅雨」的名稱，一般認為和這段時間正好是梅子成熟的季節有關。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-069", "category": "地理", "difficulty": 2, "type": "choice", "question": "日月潭的湖面自古以來就是現在這麼大，從來沒有經過人工改造。", "options": ["對", "錯"], "answer": 1, "explanation": "日治時期興建日月潭水力發電工程，從濁水溪引水進入日月潭，使水位增高約18公尺，湖面積也大幅擴大，1934年完工。", "fun_fact": "濁水溪本來並不流進日月潭，是從武界壩取水，經過全長約15公里的引水道把溪水送進來的。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-070", "category": "地理", "difficulty": 2, "type": "order", "question": "請依地理位置由北到南，排出下列離島：", "options": ["金門", "澎湖", "蘭嶼", "馬祖"], "answer": [3, 0, 1, 2], "explanation": "馬祖位在最北邊，靠近福建閩江口；金門靠近廈門；澎湖位在台灣海峽中；蘭嶼則在台東外海，最南。", "fun_fact": "金門和馬祖都很靠近中國大陸沿岸，從金門岸邊就能看到對岸廈門的高樓。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-071", "category": "地理", "difficulty": 3, "type": "order", "question": "請依海拔由高到低，排出下列山峰：", "options": ["秀姑巒山", "玉山", "雪山", "合歡山主峰"], "answer": [1, 2, 0, 3], "explanation": "玉山約3952公尺，雪山約3886公尺，秀姑巒山約3825公尺，合歡山主峰約3417公尺。", "fun_fact": "秀姑巒山是中央山脈的最高峰，也是「台灣五岳」之一。", "topic": "geo", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-072", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣面積最大的縣市是哪一個？", "options": ["台東縣", "南投縣", "屏東縣", "花蓮縣"], "answer": 3, "explanation": "花蓮縣面積約 4,629 平方公里，是台灣面積最大的縣市；台東縣居次。", "fun_fact": "花蓮縣南北狹長約 140 公里，開車從最北到最南要走上大半天。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-073", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣本島唯一沒有海岸線、完全不靠海的縣市是？", "options": ["南投縣", "嘉義縣", "苗栗縣", "雲林縣"], "answer": 0, "explanation": "南投縣位居台灣中央，四周被台中、彰化、雲林、嘉義、花蓮等縣市包圍，沒有任何一段海岸線。", "fun_fact": "台灣地理中心碑就設在南投縣埔里鎮，所以南投也自稱「台灣的心臟」。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-074", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣面積最大的平原是哪一個？", "options": ["蘭陽平原", "屏東平原", "嘉南平原", "花東縱谷"], "answer": 2, "explanation": "嘉南平原橫跨雲林、嘉義、台南一帶，是台灣面積最大的平原，也是最重要的農業區。", "fun_fact": "日治時期完成的嘉南大圳與烏山頭水庫，讓這片平原從看天田變成大糧倉。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-075", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "國道五號的雪山隧道，連接了哪兩個縣市？", "options": ["基隆市與宜蘭縣", "新北市與宜蘭縣", "新北市與桃園市", "台北市與新北市"], "answer": 1, "explanation": "雪山隧道西端在新北市坪林，東端在宜蘭縣頭城，把台北到宜蘭的車程大幅縮短。", "fun_fact": "雪山隧道全長約 12.9 公里，開通時是當時東南亞最長的公路隧道。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-076", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "台灣夏天常說的「西北雨」，指的是什麼樣的天氣？", "options": ["午後短時間的強烈雷陣雨", "從西北方吹來的乾冷強風", "梅雨鋒面帶來的連日降雨", "颱風外圍環流造成的降雨"], "answer": 0, "explanation": "西北雨是夏季午後強烈對流形成的雷陣雨，範圍小、來得急、下不久就放晴。", "fun_fact": "台語俗諺「西北雨落不過田埂」，就是在形容它下的範圍非常侷限。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-077", "topic": "geo", "category": "地理", "difficulty": 3, "type": "choice", "question": "台灣流域面積最大的河川是哪一條？", "options": ["濁水溪", "淡水河", "曾文溪", "高屏溪"], "answer": 3, "explanation": "高屏溪流域面積約 3,257 平方公里，是台灣流域面積最大的河川；長度最長的則是濁水溪。", "fun_fact": "高屏溪舊名「下淡水溪」，為了不跟北部的淡水河混淆才改成現在的名字。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "tw-078", "topic": "geo", "category": "地理", "difficulty": 3, "type": "choice", "question": "台灣蓄水量最大的水庫是哪一座？", "options": ["石門水庫", "翡翠水庫", "曾文水庫", "德基水庫"], "answer": 2, "explanation": "曾文水庫位於台南與嘉義交界的曾文溪上游，總蓄水量居台灣之冠。", "fun_fact": "曾文水庫與烏山頭水庫串聯供水，一起撐起嘉南平原的灌溉用水。", "unit": "TW", "unit_name": "台灣", "region": "台灣"}, {"id": "geo-TW-001", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 1, "type": "choice", "question": "台灣規模最大、貨櫃裝卸量最高的國際商港是哪一座？", "options": ["基隆港", "高雄港", "臺中港", "臺北港"], "answer": 1, "explanation": "高雄港是台灣最大的國際港埠，港區水域遼闊、腹地廣，貨櫃吞吐量長年居全國之冠。", "fun_fact": "高雄港航道全長約18公里，港內水域面積超過26平方公里。"}, {"id": "geo-TW-002", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 1, "type": "choice", "question": "以日出、雲海與森林小火車聞名的阿里山國家森林遊樂區，位於哪一個縣市？", "options": ["嘉義縣", "南投縣", "雲林縣", "高雄市"], "answer": 0, "explanation": "阿里山國家森林遊樂區位於嘉義縣阿里山鄉，園區海拔約2200至2700公尺。", "fun_fact": ""}, {"id": "geo-TW-003", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 2, "type": "choice", "question": "宜蘭的蘭陽平原，主要是由哪一條河川的堆積作用形成的？", "options": ["大漢溪", "頭前溪", "和平溪", "蘭陽溪"], "answer": 3, "explanation": "蘭陽溪從山谷進入低地後沉積物快速堆積，形成大型沖積扇與三角形平原，面積約400平方公里。", "fun_fact": "蘭陽平原呈南北較長、東西較短的三角形，北起頭城、南到蘇澳。"}, {"id": "geo-TW-004", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 2, "type": "choice", "question": "中央氣象署發布「陸上颱風警報」，是因為預測颱風的暴風圈將在多久之內侵襲陸地？", "options": ["6小時", "12小時", "18小時", "24小時"], "answer": 2, "explanation": "依中央氣象署規定，預測七級風暴風範圍可能侵襲陸地前18小時發布陸上颱風警報，之後每小時更新一次。", "fun_fact": "海上颱風警報則是在暴風圈可能侵襲台灣近海前24小時發布。"}, {"id": "geo-TW-005", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 2, "type": "choice", "question": "日治時期由八田與一主持興建、成為嘉南大圳主要水源的水庫是哪一座？", "options": ["烏山頭水庫", "曾文水庫", "白河水庫", "石門水庫"], "answer": 0, "explanation": "烏山頭水庫位於台南官田，與嘉南大圳同屬八田與一規劃的水利工程，供應嘉南平原灌溉用水。", "fun_fact": "八田與一因此被稱為「嘉南大圳之父」，水庫北側設有他的紀念園區。"}, {"id": "geo-TW-006", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 2, "type": "choice", "question": "下列離島中，哪一個不是火山活動造成，而是由海底珊瑚礁抬升形成的？", "options": ["綠島", "蘭嶼", "龜山島", "小琉球"], "answer": 3, "explanation": "綠島、蘭嶼、龜山島都是火山島，小琉球（琉球嶼）則是由珊瑚礁露出海面抬升而成的珊瑚礁島。", "fun_fact": "小琉球是台灣本島周邊少見的珊瑚礁島嶼，面積約6.8平方公里。"}, {"id": "geo-TW-007", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 2, "type": "choice", "question": "台灣哪一座國家公園，是第一座以維護戰役史蹟與閩南傳統聚落為主要目標的國家公園？", "options": ["台江國家公園", "金門國家公園", "東沙環礁國家公園", "澎湖南方四島國家公園"], "answer": 1, "explanation": "金門國家公園1995年成立，是台灣第六座、也是第一座設於離島的國家公園，以戰役紀念史蹟和傳統聚落保存為主。", "fun_fact": "園區面積約3529公頃，約占大、小金門四分之一的土地。"}, {"id": "geo-TW-008", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 3, "type": "choice", "question": "台灣本島的最西端「國聖港燈塔」，位在哪一個行政區？", "options": ["雲林縣口湖鄉", "彰化縣芳苑鄉", "台南市七股區", "高雄市茄萣區"], "answer": 2, "explanation": "國聖港燈塔立於台南市七股區的頂頭額汕沙洲上，是台灣本島極西點，也是本島最西邊的燈塔。", "fun_fact": "頂頭額汕沙洲風沙景觀特殊，常被遊客稱為「台版撒哈拉」。"}, {"id": "geo-TW-009", "topic": "geo", "unit": "TW", "unit_name": "台灣", "category": "地理", "region": "台灣", "difficulty": 3, "type": "choice", "question": "澎湖跨海大橋橫跨吼門水道，連接的是哪兩個鄉？", "options": ["白沙鄉與西嶼鄉", "馬公市與湖西鄉", "湖西鄉與白沙鄉", "望安鄉與七美鄉"], "answer": 0, "explanation": "澎湖跨海大橋架在白沙島與西嶼島之間的吼門水道上，是兩島唯一的聯絡通道。", "fun_fact": "吼門水道水流湍急，流速可達每秒約3公尺，是澎湖海域著名的險流。"}, {"id": "cn-011", "category": "地理", "difficulty": 1, "type": "choice", "question": "中國最長的河流是？", "options": ["珠江", "長江", "黃河", "黑龍江"], "answer": 1, "explanation": "長江全長約 6,300 公里。", "fun_fact": "長江是亞洲第一長河、世界第三長河。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-012", "category": "地理", "difficulty": 1, "type": "choice", "question": "在月球上用肉眼可以看到萬里長城。", "options": ["對", "錯"], "answer": 1, "explanation": "這是流傳很久的誤解。長城雖長但很窄，從月球上用肉眼看不到。", "fun_fact": "就連太空人在近地軌道上，也很難用肉眼分辨出長城。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-013", "category": "地理", "difficulty": 2, "type": "choice", "question": "世界最高峰聖母峰（珠穆朗瑪峰）位於中國與哪一國的邊界？", "options": ["印度", "巴基斯坦", "尼泊爾", "不丹"], "answer": 2, "explanation": "聖母峰位於中國與尼泊爾的邊界上。", "fun_fact": "2020 年兩國共同公布的最新高度是 8,848.86 公尺。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-014", "category": "地理", "difficulty": 2, "type": "choice", "question": "著名的兵馬俑位在哪一座城市？", "options": ["南京", "北京", "洛陽", "西安"], "answer": 3, "explanation": "兵馬俑位於陝西西安，屬於秦始皇陵的一部分。", "fun_fact": "兵馬俑是 1974 年農民挖井時意外發現的。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-015", "category": "地理", "difficulty": 2, "type": "choice", "question": "「桂林山水甲天下」的桂林位於哪個省級行政區？", "options": ["雲南", "湖南", "廣西", "貴州"], "answer": 2, "explanation": "桂林位於廣西壯族自治區。", "fun_fact": "桂林的奇峰是典型的喀斯特（石灰岩）地形。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-016", "category": "地理", "difficulty": 3, "type": "choice", "question": "中國面積最大的省級行政區是？", "options": ["青海", "西藏", "新疆", "內蒙古"], "answer": 2, "explanation": "新疆面積約 166 萬平方公里，是中國面積最大的省級行政區。", "fun_fact": "新疆的面積大約是台灣的 46 倍。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-029", "category": "地理", "difficulty": 2, "type": "choice", "question": "古代帝王舉行「封禪」大典，祭告天地的名山是？", "options": ["泰山", "華山", "黃山", "峨眉山"], "answer": 0, "explanation": "泰山被尊為五嶽之首，秦始皇、漢武帝等帝王都曾到泰山封禪。", "fun_fact": "泰山在 1987 年列入世界遺產，是自然與文化雙重遺產。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-030", "category": "地理", "difficulty": 2, "type": "choice", "question": "在中國大陸，簡稱「粵」的是哪一個省級地區？", "options": ["福建", "雲南", "廣東", "廣西"], "answer": 2, "explanation": "廣東簡稱「粵」，廣西是「桂」、福建是「閩」、雲南是「滇」。", "fun_fact": "「粵語」「粵菜」的「粵」就是指廣東。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-031", "category": "地理", "difficulty": 1, "type": "order", "question": "請將這些城市由北到南排列：", "options": ["北京", "哈爾濱", "上海", "廣州"], "answer": [1, 0, 2, 3], "explanation": "由北到南依序是 哈爾濱 → 北京 → 上海 → 廣州。", "fun_fact": "哈爾濱冬天的冰雕節很有名，被稱為「冰城」。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-032", "category": "地理", "difficulty": 3, "type": "choice", "question": "下列哪一個「不是」長江三峽之一？", "options": ["巫峽", "虎跳峽", "西陵峽", "瞿塘峽"], "answer": 1, "explanation": "長江三峽是瞿塘峽、巫峽、西陵峽；虎跳峽位於雲南的金沙江上。", "fun_fact": "虎跳峽得名自傳說中老虎曾踩著江心巨石一躍跳過峽谷。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-033", "category": "地理", "difficulty": 3, "type": "choice", "question": "《西遊記》中孫悟空借芭蕉扇的「火焰山」，真實存在於哪個地方？", "options": ["雲南大理", "甘肅敦煌", "新疆吐魯番", "西藏拉薩"], "answer": 2, "explanation": "火焰山位於新疆吐魯番盆地，紅色砂岩在烈日下宛如火焰。", "fun_fact": "吐魯番盆地夏季極為炎熱，盆地內的艾丁湖是中國陸地的最低點。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-034", "category": "地理", "difficulty": 2, "type": "choice", "question": "以壁畫和佛像聞名的「莫高窟」位於哪個省？", "options": ["陝西", "寧夏", "甘肅", "新疆"], "answer": 2, "explanation": "莫高窟位於甘肅敦煌，是絲路上的佛教藝術寶庫，1987 年列入世界遺產。", "fun_fact": "1900 年莫高窟發現了「藏經洞」，裡面藏有數萬件古代文書。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-035", "category": "地理", "difficulty": 1, "type": "choice", "question": "黃河的河水之所以呈現黃色，主要是因為流經哪個地形區？", "options": ["華北平原", "黃土高原", "青藏高原", "四川盆地"], "answer": 1, "explanation": "黃河中游流經土質鬆軟的黃土高原，大量泥沙被沖入河中而變黃。", "fun_fact": "因為泥沙淤積，黃河下游河床比兩岸地面還高，被稱為「地上河」。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-036", "category": "地理", "difficulty": 2, "type": "choice", "question": "黃山是「五嶽」之一。", "options": ["對", "錯"], "answer": 1, "explanation": "五嶽是東嶽泰山、西嶽華山、南嶽衡山、北嶽恆山、中嶽嵩山，黃山並不在其中。", "fun_fact": "相傳明代旅行家徐霞客讚嘆：「五嶽歸來不看山，黃山歸來不看嶽。」", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-037", "category": "地理", "difficulty": 2, "type": "choice", "question": "因為四季氣候溫和，被稱為「春城」的是哪一座城市？", "options": ["成都", "昆明", "福州", "長春"], "answer": 1, "explanation": "雲南省會昆明位於高原，冬不嚴寒、夏不酷熱，四季如春。", "fun_fact": "名字有「春」的長春其實在東北，冬天非常寒冷。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-038", "category": "地理", "difficulty": 3, "type": "choice", "question": "被譽為「瓷都」的景德鎮位於哪個省？", "options": ["福建", "廣東", "浙江", "江西"], "answer": 3, "explanation": "景德鎮位於江西，自古以燒製瓷器聞名。", "fun_fact": "景德鎮的名字來自北宋宋真宗的年號「景德」。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-050", "category": "地理", "difficulty": 1, "type": "choice", "question": "城市依山而建、道路上上下下，被稱為「山城」的是哪一座城市？", "options": ["上海", "北京", "重慶", "天津"], "answer": 2, "explanation": "重慶位於長江與嘉陵江交會處，市區建在起伏的丘陵上，高低落差很大，所以有「山城」之稱。", "fun_fact": "重慶的輕軌2號線在李子壩站直接「穿過」一棟住宅大樓，列車從樓中呼嘯而過，成了熱門打卡景點；重慶也因多霧有「霧都」之稱。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-051", "category": "地理", "difficulty": 1, "type": "choice", "question": "以五彩湖泊和瀑布聞名的世界遺產「九寨溝」位於哪個省？", "options": ["四川", "雲南", "貴州", "青海"], "answer": 0, "explanation": "九寨溝位於四川省阿壩藏族羌族自治州，1992年列入世界自然遺產。", "fun_fact": "九寨溝的湖水因為富含碳酸鈣、又有藻類與水生植物，會呈現藍、綠、黃等不同顏色，當地人把這些湖泊稱為「海子」。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-052", "category": "地理", "difficulty": 1, "type": "choice", "question": "依山而建、外牆紅白相間的宮殿建築群「布達拉宮」位於哪座城市？", "options": ["林芝", "西寧", "日喀則", "拉薩"], "answer": 3, "explanation": "布達拉宮位於西藏拉薩市區的紅山上，1994年列入世界文化遺產。", "fun_fact": "人民幣50元紙鈔的背面圖案，就是布達拉宮。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-053", "category": "地理", "difficulty": 1, "type": "choice", "question": "平均海拔超過4,000公尺，被稱為「世界屋脊」的是哪一個高原？", "options": ["雲貴高原", "黃土高原", "青藏高原", "內蒙古高原"], "answer": 2, "explanation": "青藏高原是世界上平均海拔最高的高原，因此被稱為「世界屋脊」。", "fun_fact": "青藏高原是印度板塊向北擠壓歐亞板塊而隆起形成的，到現在仍在緩慢上升。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-054", "category": "地理", "difficulty": 2, "type": "choice", "question": "電影《阿凡達》中的懸浮山，據說靈感來自石柱林立的「張家界」，它位於哪個省？", "options": ["江西", "湖南", "湖北", "貴州"], "answer": 1, "explanation": "張家界位於湖南省西北部，所在的武陵源風景名勝區在1992年列入世界自然遺產。", "fun_fact": "《阿凡達》上映後，張家界在2010年把一根名為「南天一柱」的石柱改名為「阿凡達－哈利路亞山」。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-055", "category": "地理", "difficulty": 2, "type": "choice", "question": "以功夫聞名天下的「少林寺」，位於哪一座山？", "options": ["嵩山", "武當山", "峨眉山", "華山"], "answer": 0, "explanation": "少林寺位於河南省登封市的嵩山，嵩山就是五嶽中的「中嶽」。", "fun_fact": "少林寺所在的登封「天地之中」歷史建築群，在2010年列入世界文化遺產。武當山則是道教與武當派的聖地，兩者常被拿來相提並論。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-056", "category": "地理", "difficulty": 2, "type": "choice", "question": "「湖南」「湖北」兩個省名中的「湖」，指的是哪一座湖？", "options": ["洞庭湖", "太湖", "巢湖", "鄱陽湖"], "answer": 0, "explanation": "兩省大致以洞庭湖為界，洞庭湖以南是湖南，以北是湖北。", "fun_fact": "范仲淹〈岳陽樓記〉中「銜遠山，吞長江，浩浩湯湯」描寫的正是洞庭湖；岳陽樓就矗立在洞庭湖畔。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-057", "category": "地理", "difficulty": 2, "type": "choice", "question": "名列中國四大名園之一的「拙政園」位於哪座城市？", "options": ["杭州", "南京", "蘇州", "揚州"], "answer": 2, "explanation": "拙政園位於江蘇蘇州，與留園等蘇州古典園林在1997年列入世界文化遺產。", "fun_fact": "中國四大名園是蘇州的拙政園、留園，北京的頤和園，以及河北的承德避暑山莊，其中一半在蘇州。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-058", "category": "地理", "difficulty": 2, "type": "choice", "question": "連接青海西寧與西藏拉薩、被稱為「世界海拔最高鐵路」的是？", "options": ["京滬高鐵", "京廣鐵路", "青藏鐵路", "成昆鐵路"], "answer": 2, "explanation": "青藏鐵路全線在2006年通車，最高點唐古拉山口海拔約5,072公尺，是世界上海拔最高的鐵路。", "fun_fact": "因為高原空氣稀薄，青藏鐵路的旅客列車車廂設有供氧設備，座位旁還有吸氧的插孔。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-059", "category": "地理", "difficulty": 2, "type": "choice", "question": "以「一清二白三紅四綠五黃」形容的牛肉拉麵，是哪座城市的招牌美食？", "options": ["銀川", "太原", "西安", "蘭州"], "answer": 3, "explanation": "蘭州牛肉麵講究湯清、蘿蔔白、辣油紅、香菜蒜苗綠、麵條黃黃亮亮，因此有這句口訣。", "fun_fact": "蘭州牛肉麵是清湯系統，和台灣常見、湯頭濃郁的紅燒牛肉麵是完全不同的風格。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-060", "category": "地理", "difficulty": 2, "type": "choice", "question": "隔開海南島與廣東雷州半島的海峽是？", "options": ["渤海海峽", "瓊州海峽", "對馬海峽", "麻六甲海峽"], "answer": 1, "explanation": "瓊州海峽位於海南島北方，隔開海南島與廣東的雷州半島；海南省簡稱「瓊」，海峽也因此得名。", "fun_fact": "火車要去海南島，會整列開上渡輪「坐船」過瓊州海峽，上岸後再繼續行駛。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-061", "category": "地理", "difficulty": 3, "type": "choice", "question": "京杭大運河溝通了中國大陸東部五大水系，下列哪一條「不在」其中？", "options": ["錢塘江", "淮河", "珠江", "海河"], "answer": 2, "explanation": "京杭大運河北起北京、南到杭州，由北而南連接海河、黃河、淮河、長江、錢塘江五大水系；珠江在華南，並不在運河沿線。", "fun_fact": "京杭大運河全長將近1,800公里，是世界上最長的古代人工運河，2014年以「中國大運河」之名列入世界文化遺產。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-062", "category": "地理", "difficulty": 3, "type": "choice", "question": "中國大陸最大的沙漠「塔克拉瑪干沙漠」，位於哪一個盆地？", "options": ["四川盆地", "塔里木盆地", "柴達木盆地", "準噶爾盆地"], "answer": 1, "explanation": "塔克拉瑪干沙漠位於新疆南部的塔里木盆地中央，是中國大陸面積最大的沙漠。", "fun_fact": "它有「死亡之海」的稱號；2022年環繞整座沙漠的鐵路環線全部接通，成為世界第一條環沙漠鐵路。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-063", "category": "地理", "difficulty": 3, "type": "choice", "question": "被譽為烏龍茶名品的武夷岩茶「大紅袍」，產自哪一座山？", "options": ["黃山", "峨眉山", "廬山", "武夷山"], "answer": 3, "explanation": "大紅袍產自福建的武夷山，是武夷岩茶的代表。武夷山在1999年列入世界文化與自然雙重遺產。", "fun_fact": "武夷山九龍窠的岩壁上有幾株大紅袍「母樹」，被當成國寶保護，已經停止採摘。黃山、廬山也產名茶，分別是黃山毛峰和廬山雲霧茶。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-064", "category": "地理", "difficulty": 3, "type": "choice", "question": "長江和黃河的發源地，都位於哪一個省級行政區？", "options": ["四川", "甘肅", "西藏", "青海"], "answer": 3, "explanation": "長江與黃河都發源於青海省，當地和瀾滄江的源頭合稱「三江源」。", "fun_fact": "三江源地區被稱為「中華水塔」，長江的源頭在唐古拉山脈的各拉丹冬雪山一帶，黃河則發源於巴顏喀拉山北麓。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-065", "category": "地理", "difficulty": 2, "type": "choice", "question": "長江和黃河最後都流入同一片海。", "options": ["對", "錯"], "answer": 1, "explanation": "錯。長江在上海附近注入東海，黃河則在山東東營一帶注入渤海。", "fun_fact": "黃河每年挾帶大量泥沙入海，河口的陸地會不斷向海中延伸，東營一帶因此不斷「長出」新的土地。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-066", "category": "地理", "difficulty": 1, "type": "order", "question": "請將這些城市由西到東排列：", "options": ["成都", "武漢", "上海", "烏魯木齊"], "answer": [3, 0, 1, 2], "explanation": "烏魯木齊在新疆，位置最西；接著是四川成都、湖北武漢，最東邊是濱海的上海。", "fun_fact": "中國大陸官方統一使用北京時間，所以位置很西的烏魯木齊，夏天晚上10點左右天色可能還亮著。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-067", "category": "地理", "difficulty": 3, "type": "order", "question": "請將這些名山依主峰海拔由高到低排列：", "options": ["泰山", "峨眉山", "華山", "衡山"], "answer": [1, 2, 0, 3], "explanation": "峨眉山主峰萬佛頂約3,099公尺；西嶽華山約2,155公尺；東嶽泰山約1,500多公尺；南嶽衡山約1,300公尺。", "fun_fact": "峨眉山並不在五嶽之列，它是中國佛教四大名山之一，與五台山、普陀山、九華山齊名。", "topic": "geo", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-068", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "以「西湖」美景聞名、自古被譽為人間天堂的是哪一座城市？", "options": ["蘇州", "南京", "杭州", "揚州"], "answer": 2, "explanation": "西湖位於浙江省杭州市，「上有天堂，下有蘇杭」的「杭」指的就是杭州。", "fun_fact": "西湖十景中的「斷橋殘雪」，因為《白蛇傳》的故事而特別有名。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-069", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "上海的「母親河」，把市區分成浦東與浦西的河流是？", "options": ["蘇州河", "黃浦江", "錢塘江", "秦淮河"], "answer": 1, "explanation": "黃浦江貫穿上海市區，西岸是外灘所在的浦西，東岸是高樓林立的浦東。", "fun_fact": "黃浦江其實是長江的支流，最後在吳淞口注入長江。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-070", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "每年冬天以「冰雪大世界」冰燈展聞名的中國城市是？", "options": ["齊齊哈爾", "烏魯木齊", "呼和浩特", "哈爾濱"], "answer": 3, "explanation": "哈爾濱位於黑龍江省，冬季嚴寒且結冰期長，每年舉辦大型冰雕、冰燈展覽。", "fun_fact": "哈爾濱因為歷史上受俄羅斯影響深，市區留有不少洋蔥圓頂的東正教式建築。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-071", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "戰國時代李冰父子在四川主持興建的「都江堰」，屬於哪一類工程？", "options": ["水利灌溉工程", "軍事防禦城牆", "皇家陵墓建築", "南北運河河道"], "answer": 0, "explanation": "都江堰是分水、排沙、灌溉的水利工程，讓成都平原免於水患並成為「天府之國」。", "fun_fact": "都江堰完工至今兩千多年仍在運作，是世界上少數還在使用的古代水利工程。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-072", "topic": "geo", "category": "地理", "difficulty": 1, "type": "choice", "question": "下列哪一座城市「不是」中國大陸的直轄市？", "options": ["天津", "重慶", "廣州", "上海"], "answer": 2, "explanation": "中國大陸的直轄市是北京、天津、上海、重慶四座；廣州是廣東省的省會。", "fun_fact": "重慶是四個直轄市中最晚設立的，1997 年才從四川省分出來。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "cn-073", "topic": "geo", "category": "地理", "difficulty": 3, "type": "choice", "question": "地理上常用的「秦嶺—淮河」一線，主要是哪一種分界？", "options": ["中國的北方與南方", "季風區與非季風區", "內流區與外流區", "高原區與平原區"], "answer": 0, "explanation": "秦嶺—淮河線大致對應年降水量 800 公釐與一月均溫 0℃ 等溫線，是傳統上南方與北方的分界。", "fun_fact": "這條線也大致分開了北方的小麥麵食區與南方的稻米飯食區。", "unit": "CN", "unit_name": "中國", "region": "中國"}, {"id": "geo-CN-001", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 1, "type": "choice", "question": "廣東省的省會是哪一座城市？", "options": ["廣州", "深圳", "東莞", "珠海"], "answer": 0, "explanation": "廣東省的省會是廣州；深圳、東莞、珠海雖然同屬珠江三角洲的大城市，但都不是省會。", "fun_fact": ""}, {"id": "geo-CN-002", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "河北省的省會是哪一座城市？", "options": ["秦皇島", "保定", "石家莊", "唐山"], "answer": 2, "explanation": "河北省的省會是石家莊。保定曾是河北舊省會，唐山、秦皇島則是省內著名的工業與港口城市。", "fun_fact": ""}, {"id": "geo-CN-003", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 3, "type": "choice", "question": "吉林省的省會是哪一座城市？", "options": ["長春", "吉林市", "四平", "延吉"], "answer": 0, "explanation": "吉林省的省會是長春，而不是同名的吉林市；吉林是少數「省名與省內城市同名、但該城市並非省會」的例子。", "fun_fact": ""}, {"id": "geo-CN-004", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "內蒙古自治區的首府是哪一座城市？", "options": ["呼和浩特", "包頭", "鄂爾多斯", "赤峰"], "answer": 0, "explanation": "內蒙古自治區的首府是呼和浩特；包頭、鄂爾多斯、赤峰都是自治區內的大城市，但不是首府。", "fun_fact": ""}, {"id": "geo-CN-005", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "簡稱「晉」的是下列哪一個省？", "options": ["陝西省", "山西省", "河北省", "河南省"], "answer": 1, "explanation": "山西省因春秋時代的晉國而簡稱「晉」；陝西簡稱「陝」或「秦」，河北簡稱「冀」，河南簡稱「豫」。", "fun_fact": ""}, {"id": "geo-CN-006", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "在中國大陸的省級行政區劃中，「自治區」共有幾個？", "options": ["3個", "4個", "5個", "6個"], "answer": 2, "explanation": "中國大陸現行省級行政區包含22個省、5個自治區、4個直轄市與2個特別行政區；5個自治區是內蒙古、新疆、西藏、廣西和寧夏。（中共另將台灣列為其第23省，但實際並未管轄。）", "fun_fact": ""}, {"id": "geo-CN-007", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 3, "type": "choice", "question": "若只看名稱為「省」的行政區（不含自治區），面積最大的是哪一個？", "options": ["四川省", "青海省", "黑龍江省", "甘肅省"], "answer": 1, "explanation": "青海省約72萬平方公里，是面積最大的「省」；比它更大的新疆、西藏、內蒙古都屬於自治區。", "fun_fact": ""}, {"id": "geo-CN-008", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 1, "type": "choice", "question": "中國四大高原中，石灰岩分布廣、地表崎嶇並發育出峰林與溶洞（喀斯特地形）的是哪一個？", "options": ["青藏高原", "內蒙古高原", "黃土高原", "雲貴高原"], "answer": 3, "explanation": "雲貴高原石灰岩層厚、溶蝕作用旺盛，形成峰林、石林與地下溶洞等典型喀斯特景觀。", "fun_fact": ""}, {"id": "geo-CN-009", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "五嶽之中，位於陝西省、以山勢險峻著稱的「西嶽」是哪一座山？", "options": ["衡山", "華山", "恆山", "嵩山"], "answer": 1, "explanation": "五嶽為東嶽泰山、西嶽華山、南嶽衡山、北嶽恆山、中嶽嵩山，其中華山在陝西，素有「奇險天下第一山」之稱。", "fun_fact": ""}, {"id": "geo-CN-010", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 3, "type": "choice", "question": "下列哪一個「不是」中國四大盆地之一？", "options": ["塔里木盆地", "準噶爾盆地", "柴達木盆地", "渭河盆地"], "answer": 3, "explanation": "四大盆地是塔里木盆地、準噶爾盆地、柴達木盆地與四川盆地；渭河盆地（關中平原）範圍小得多，不在其列。", "fun_fact": ""}, {"id": "geo-CN-011", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 3, "type": "choice", "question": "中國三大平原中，面積最大的是哪一個？", "options": ["華北平原", "東北平原", "長江中下游平原", "成都平原"], "answer": 1, "explanation": "依一般地理教科書的界定，東北平原約35萬平方公里，大於華北平原（約30萬平方公里）與長江中下游平原（約20萬平方公里），是中國面積最大的平原；成都平原則不屬於三大平原。", "fun_fact": ""}, {"id": "geo-CN-012", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "中國五大淡水湖中，面積最大的是哪一個？", "options": ["洞庭湖", "太湖", "鄱陽湖", "洪澤湖"], "answer": 2, "explanation": "位於江西省北部、長江南岸的鄱陽湖面積約3,900多平方公里，是中國第一大淡水湖，洞庭湖居次。", "fun_fact": ""}, {"id": "geo-CN-013", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 2, "type": "choice", "question": "長江是中國最長的河流，它的全長大約是多少公里？", "options": ["約3,600公里", "約4,500公里", "約5,500公里", "約6,300公里"], "answer": 3, "explanation": "長江全長約6,300公里，是亞洲第一長河、世界第三長河；約5,464公里的是黃河。", "fun_fact": ""}, {"id": "geo-CN-014", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 1, "type": "choice", "question": "中國大陸年降水量的空間分布，總趨勢是下列何者？", "options": ["由東南沿海向西北內陸遞減", "由西北內陸向東南沿海遞減", "由北方向南方遞減", "全國各地大致相同"], "answer": 0, "explanation": "水氣主要來自太平洋與印度洋的夏季季風，愈往西北內陸水氣愈難到達，因此降水由東南沿海向西北內陸遞減。", "fun_fact": ""}, {"id": "geo-CN-015", "topic": "geo", "unit": "CN", "unit_name": "中國", "category": "地理", "region": "中國", "difficulty": 1, "type": "choice", "question": "下列哪一個國家「沒有」與中國大陸接壤？", "options": ["哈薩克", "尼泊爾", "泰國", "緬甸"], "answer": 2, "explanation": "中國大陸的14個陸上鄰國包含哈薩克、尼泊爾、緬甸等，但泰國與中國之間隔著緬甸與寮國，並不相鄰。", "fun_fact": ""}, {"id": "wd-025", "category": "地理", "difficulty": 2, "type": "choice", "question": "日本最高峰富士山，橫跨哪兩個縣？", "options": ["愛知縣與長野縣", "東京都與神奈川縣", "靜岡縣與山梨縣", "長野縣與岐阜縣"], "answer": 2, "explanation": "富士山海拔 3,776 公尺，位於靜岡縣與山梨縣之間。", "fun_fact": "富士山八合目以上的土地，大部分屬於富士山本宮淺間大社所有。", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "region": "日韓・東亞"}, {"id": "wd-056", "category": "地理", "difficulty": 1, "type": "choice", "question": "日本沖繩縣的縣廳所在地是哪一個城市？", "options": ["那霸市", "石垣市", "名護市", "宮古島市"], "answer": 0, "explanation": "沖繩縣的縣廳位於沖繩本島南部的那霸市，那霸機場也是台灣旅客前往沖繩最常用的機場。", "fun_fact": "那霸市的「國際通」約 1.6 公里長，因戰後快速復興，被稱為「奇蹟的一英里」。", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "region": "日韓・東亞"}, {"id": "geo-EA-001", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本的「四大島」中，面積最大、也是政治經濟核心的是哪一座？", "options": ["本州", "北海道", "九州", "四國"], "answer": 0, "explanation": "本州約占日本國土面積六成，東京、大阪、名古屋等大都市都在本州。", "fun_fact": ""}, {"id": "geo-EA-002", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本四大島依面積由大到小排列，第二名是哪一座島？", "options": ["九州", "北海道", "四國", "沖繩本島"], "answer": 1, "explanation": "四大島面積排序為本州、北海道、九州、四國；沖繩本島並不屬於四大島。", "fun_fact": ""}, {"id": "geo-EA-003", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本最高峰富士山的標高最接近下列哪一個數字？", "options": ["約 3,776 公尺", "約 2,776 公尺", "約 3,193 公尺", "約 4,776 公尺"], "answer": 0, "explanation": "富士山標高 3,776 公尺，是日本無可爭議的第一高峰。", "fun_fact": ""}, {"id": "geo-EA-004", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本的第二高峰、位於南阿爾卑斯的是哪一座山？", "options": ["奧穗高岳", "槍岳", "北岳", "御嶽山"], "answer": 2, "explanation": "北岳標高 3,193 公尺，僅次於富士山；奧穗高岳 3,190 公尺以三公尺之差屈居第三。", "fun_fact": ""}, {"id": "geo-EA-005", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "通稱「日本阿爾卑斯」的，是本州中部哪三條山脈的合稱？", "options": ["奧羽、出羽、越後", "鈴鹿、丹波、紀伊", "日高、北見、夕張", "飛驒、木曾、赤石"], "answer": 3, "explanation": "飛驒山脈是北阿爾卑斯、木曾山脈是中央阿爾卑斯、赤石山脈是南阿爾卑斯。", "fun_fact": ""}, {"id": "geo-EA-006", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "縱貫東北地方、被稱為「東北脊梁」的日本最長山脈是哪一條？", "options": ["赤石山脈", "奧羽山脈", "日高山脈", "越後山脈"], "answer": 1, "explanation": "奧羽山脈自青森延伸到栃木，長約 500 公里，把東北分成日本海側與太平洋側。", "fun_fact": ""}, {"id": "geo-EA-007", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本面積最大的湖泊是哪一座？", "options": ["猪苗代湖", "十和田湖", "洞爺湖", "琵琶湖"], "answer": 3, "explanation": "琵琶湖面積約 670 平方公里，遠遠大於日本其他湖泊。", "fun_fact": ""}, {"id": "geo-EA-008", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本最大的湖泊琵琶湖位於哪一個縣境內？", "options": ["滋賀縣", "京都府", "岐阜縣", "福井縣"], "answer": 0, "explanation": "琵琶湖幾乎占滋賀縣面積的六分之一，湖水經淀川流向大阪灣。", "fun_fact": ""}, {"id": "geo-EA-009", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本面積第二大的湖泊「霞浦」位於哪一個縣？", "options": ["茨城縣", "秋田縣", "島根縣", "北海道"], "answer": 0, "explanation": "霞浦（霞ヶ浦）橫跨茨城縣東南部，面積僅次於琵琶湖。", "fun_fact": ""}, {"id": "geo-EA-010", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本水深最深的湖泊是下列哪一座？", "options": ["支笏湖", "田澤湖", "琵琶湖", "中禪寺湖"], "answer": 1, "explanation": "秋田縣的田澤湖最深處超過 423 公尺，是日本第一深湖；支笏湖則排名第二。", "fun_fact": ""}, {"id": "geo-EA-011", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本最長的河川是下列哪一條？", "options": ["利根川", "石狩川", "信濃川", "北上川"], "answer": 2, "explanation": "信濃川全長約 367 公里，源自長野縣、在新潟縣注入日本海。", "fun_fact": ""}, {"id": "geo-EA-012", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本流域面積最大的河川是哪一條？", "options": ["信濃川", "木曾川", "利根川", "淀川"], "answer": 2, "explanation": "利根川流域涵蓋整個關東平原，流域面積居日本之冠，最長的則是信濃川。", "fun_fact": ""}, {"id": "geo-EA-013", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "日本的「都道府縣」一共有幾個？", "options": ["43 個", "50 個", "23 個", "47 個"], "answer": 3, "explanation": "日本地方行政區為 1 都、1 道、2 府、43 縣，合計 47 個。", "fun_fact": ""}, {"id": "geo-EA-014", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本「一都一道二府四十三縣」中的「二府」是指哪兩個？", "options": ["大阪府與兵庫府", "大阪府與京都府", "京都府與奈良府", "東京府與大阪府"], "answer": 1, "explanation": "目前只有大阪府與京都府保留「府」的稱呼，東京早在戰時就改制為「都」。", "fun_fact": ""}, {"id": "geo-EA-015", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 1, "type": "choice", "question": "在日本的都道府縣中，唯一稱為「道」的是哪一個？", "options": ["東海道", "九州道", "南海道", "北海道"], "answer": 3, "explanation": "北海道是日本唯一的「道」；東海道、南海道是古代的區域名稱，並非現行行政區。", "fun_fact": ""}, {"id": "geo-EA-016", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "下列哪一個縣「不」屬於日本的關東地方？", "options": ["群馬縣", "栃木縣", "靜岡縣", "茨城縣"], "answer": 2, "explanation": "關東地方是一都六縣：東京、神奈川、埼玉、千葉、茨城、栃木、群馬；靜岡屬於中部地方。", "fun_fact": ""}, {"id": "geo-EA-017", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "下列哪一個縣「不」屬於日本的東北地方？", "options": ["秋田縣", "山形縣", "新潟縣", "福島縣"], "answer": 2, "explanation": "東北六縣為青森、岩手、宮城、秋田、山形、福島；新潟一般劃入中部（北陸）地方。", "fun_fact": ""}, {"id": "geo-EA-018", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "如果不算北海道，日本面積最大的「縣」是哪一個？", "options": ["長野縣", "福島縣", "新潟縣", "岩手縣"], "answer": 3, "explanation": "岩手縣面積約 1.5 萬平方公里，是北海道以外最大的都府縣，福島、長野緊追在後。", "fun_fact": ""}, {"id": "geo-EA-019", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "日本面積最小的都道府縣是哪一個？", "options": ["大阪府", "香川縣", "東京都", "鳥取縣"], "answer": 1, "explanation": "香川縣面積不到 1,900 平方公里，是全日本最小；鳥取則是人口最少的縣。", "fun_fact": ""}, {"id": "geo-EA-020", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 2, "type": "choice", "question": "下列「縣名－縣廳所在地」的配對，哪一組是錯誤的？", "options": ["石川縣－金澤市", "兵庫縣－姬路市", "愛知縣－名古屋市", "宮城縣－仙台市"], "answer": 1, "explanation": "兵庫縣的縣廳位於神戶市，姬路市雖有名城卻不是縣廳所在地。", "fun_fact": ""}, {"id": "geo-EA-021", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "以金礦與傳統藝能聞名的佐渡島，屬於哪一個縣？", "options": ["新潟縣", "島根縣", "長崎縣", "石川縣"], "answer": 0, "explanation": "佐渡島位於新潟縣外海的日本海上，是本州外海面積相當大的島嶼。", "fun_fact": ""}, {"id": "geo-EA-022", "topic": "geo", "unit": "EA", "unit_name": "日韓・東亞", "category": "地理", "region": "日韓・東亞", "difficulty": 3, "type": "choice", "question": "日本
