<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
 *  脈衝 PULSE 前端
 *  - 有後端時：透過 /api/* 出題、計時、計分（分數以伺服器為準)，排行榜存在 SQLite
 *  - 單機模式(window.EMBEDDED_BANK 存在):瀏覽器自己出題計分；
 *    排行榜若在 claude.ai 上開啟就用共用資料庫，否則存在這台裝置
 * ============================================================ */
const LIVES = 3;
const TIME_LIMIT = {choice: 15, order: 25};
const SEAL = {python:'蟒', pytorch:'深', vba:'巨', geo:'輿', history:'史', human:'文', tech:'科', star:'星', fun:'奇', tt:'桌', news:'聞', mix:'雜'};
const CAT_NAME = {python:'Python', pytorch:'Deep Learning', vba:'VBA', geo:'地理', history:'歷史', human:'人文', tech:'科技', star:'娛樂', fun:'趣聞', tt:'桌球', news:'即時新聞', mix:'綜合挑戰'};
const TOP3 = ['滿格', '高峰', '躍升'];
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const post = async (url, body) => {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '連線失敗，請再試一次');
  return j;
};

/* ---------- 後端版 API ---------- */
const remote = {
  categories: async region => {
    // 伺服器剛啟動時題庫要載入一下,撲空就重試,不要讓主題那一排變空白
    const url = '/api/categories' + (region ? '?region=' + encodeURIComponent(region) : '');
    for (let i = 0; i < 8; i++){
      try{ const r = await fetch(url, {cache: 'no-store'}); if (r.ok) return await r.json(); }catch(e){}
      await new Promise(go => setTimeout(go, 400));
    }
    throw new Error('讀不到題庫，伺服器可能還在啟動。請稍等幾秒再重新整理。');
  },
  units: topic => fetch('/api/units?topic=' + encodeURIComponent(topic)).then(r => r.json()),
  start: (category, region, unit) => post('/api/start', {category, region, unit}),
  show: (session, index) => post('/api/show', {session, index}),
  answer: (session, index, answer) => post('/api/answer', {session, index, answer}),
  power: (session, index, type) => post('/api/power', {session, index, type}),
  finish: session => post('/api/finish', {session}).catch(() => {}),
  submit: (session, name) => post('/api/submit', {session, name}),
  leaderboard: (category, period) => fetch(`/api/leaderboard?category=${category}&period=${period}`).then(r => r.json()),
  boardNote: () => '',
};

/* ---------- 單機版：在瀏覽器裡模擬同一套規則 ---------- */
function weekKey(ts = Date.now()){
  const d = new Date(ts + 8 * 3600e3);                 // 以台灣時間切週，與後端一致
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7 + 3);   // 該週的週四
  const y = t.getUTCFullYear(), jan4 = new Date(Date.UTC(y, 0, 4));
  const w = 1 + Math.round(((t - jan4) / 864e5 - 3 + (jan4.getUTCDay() + 6) % 7) / 7);
  return `${y}-W${String(w).padStart(2, '0')}`;
}
const mult = s => s >= 5 ? 2 : s >= 3 ? 1.5 : 1;
let dbPromise = null;
const getDb = () => dbPromise ??= (window.claude?.use ? window.claude.use('db').catch(() => null) : Promise.resolve(null));

const local = {
  g: null,
  categories: async region => window.EMBEDDED_CATS.map(c => ({...c,
    count: c.count === null ? null : (region ? Object.values(EMBEDDED_BANK).flat()
      .filter(q => q.region === region && (c.key === 'mix' || q.topic === c.key)).length : c.count)})),
  async units(topic){
    const seen = new Map();
    for (const q of (EMBEDDED_BANK[topic] || [])){
      if (!q.unit) continue;
      seen.set(q.unit, {key: q.unit, name: q.unit_name || q.unit, count: (seen.get(q.unit)?.count || 0) + 1});
    }
    return [...seen.values()];
  },
  async start(category, region, unit){
    const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
    let pool = (category === 'mix' ? Object.values(EMBEDDED_BANK).flat() : [...(EMBEDDED_BANK[category] || [])])
      .filter(q => !q.expires || q.expires >= today)    // 過期題目自動下架
      .filter(q => !region || q.region === region)
      .filter(q => !unit || q.unit === unit);
    pool.sort(() => Math.random() - .5);
    const qs = pool.slice(0, 10).sort((a, b) => (a.difficulty || 2) - (b.difficulty || 2));
    this.g = {cat: category, qs, i: 0, shown: null, extra: 0, lives: LIVES, score: 0, streak: 0, best: 0,
              right: 0, answered: 0, over: false, submitted: false, powers: {fifty: true, skip: true, time: true}};
    return {session: 'local', total: qs.length, questions: qs, unit_name: qs[0]?.unit_name || ''};
  },
  state(){ const g = this.g; return {i: g.i, lives: g.lives, score: g.score, streak: g.streak, best: g.best,
    right: g.right, answered: g.answered, over: g.over, powers: {...g.powers}}; },
  advance(){ const g = this.g; g.i++; g.shown = null; g.extra = 0; if (g.lives <= 0 || g.i >= g.qs.length) g.over = true; },
  async show(){ this.g.shown ??= Date.now(); return {ok: true}; },
  async answer(_, index, ans){
    const g = this.g, q = g.qs[index];
    const limit = (TIME_LIMIT[q.type] || 15) + g.extra, elapsed = (Date.now() - g.shown) / 1000;
    const timed_out = ans === null || elapsed > limit + 1.5;
    const correct = !timed_out && JSON.stringify(ans) === JSON.stringify(q.answer);
    let gained = 0; g.answered++;
    if (correct){ g.streak++; g.right++; g.best = Math.max(g.best, g.streak);
      gained = Math.round((100 * (q.difficulty || 1) + Math.round(Math.max(0, limit - elapsed)) * 5) * mult(g.streak)); g.score += gained; }
    else { g.streak = 0; g.lives--; }
    this.advance();
    return {correct, timed_out, gained, answer: q.answer, explanation: q.explanation, fun_fact: q.fun_fact, source: q.source || '', state: this.state()};
  },
  async power(_, index, type){
    const g = this.g, q = g.qs[index];
    if (!g.powers[type]) throw new Error('這個道具已經用過了');
    g.powers[type] = false;
    const out = {};
    if (type === 'fifty') out.remove = q.options.map((_, i) => i).filter(i => i !== q.answer).sort(() => Math.random() - .5).slice(0, 2);
    if (type === 'time') g.extra += 10;
    if (type === 'skip') this.advance();
    return {...out, state: this.state()};
  },
  finish(){},
  async submit(_, name){
    const g = this.g;
    name = String(name).replace(/[\x00-\x1f<>&"']/g, '').trim().slice(0, 12);
    if (!name) throw new Error('請輸入 1 到 12 個字的暱稱');
    if (!g.over || g.submitted) throw new Error('這局已經上榜過了');
    g.submitted = true;
    const row = {name, category: g.cat, score: g.score, correct: g.right, answered: g.answered,
                 best_streak: g.best, week: weekKey(), created: Date.now() / 1000};
    const db = await getDb();
    let id;
    if (db){
      const ref = await db.collection('scores').add(row);
      id = ref.id;
    } else {
      const list = store.get('quiz_scores') || [];
      id = 'l' + Date.now();
      list.push({...row, id}); store.set('quiz_scores', list.sort((a, b) => b.score - a.score).slice(0, 200));
    }
    const rankIn = async period => {
      const all = await this.leaderboard(g.cat, period, 1000);
      const idx = all.findIndex(r => r.id === id);
      return idx >= 0 ? idx + 1 : null;
    };
    return {id, rank_week: await rankIn('week'), rank_all: await rankIn('all')};
  },
  async leaderboard(category, period, limit = 20){
    const db = await getDb();
    let rows;
    if (db){
      let q = db.collection('scores');
      if (category !== 'all') q = q.where('category', '==', category);
      if (period === 'week') q = q.where('week', '==', weekKey());
      const snap = await q.orderBy('score', 'desc').limit(Math.min(limit, 1000)).get();
      rows = snap.docs.map(d => ({id: d.id, ...d.data()}));
    } else {
      rows = (store.get('quiz_scores') || []).filter(r =>
        (category === 'all' || r.category === category) && (period === 'all' || r.week === weekKey()));
    }
    return rows.sort((a, b) => b.score - a.score || a.created - b.created).slice(0, limit);
  },
  async boardNote(){ return (await getDb()) ? '' : '目前顯示的是這台裝置上的紀錄。'; },
};

/* 地區的印章字與說明:主題是地理/歷史/人文時,「單元」就是地區 */
const REGION_SEAL = {TW:'台', CN:'中', EA:'東', SEA:'南', EU:'歐', AM:'美', OTH:'他',
                     GLOBAL:'球', POEM:'詩'};
const REGION_TOPICS = ['geo', 'history', 'human'];
const unitSeal = k => REGION_SEAL[k] || (k === 'GEN' ? '綜' : k.replace(/^W/, ''));

/* ---------- 有分單元的主題,先選單元;地理/歷史/人文則是先選地區 ---------- */
async function pickUnit(cat, region){
  document.body.dataset.topic = cat;
  const units = await api.units(cat).catch(() => []);
  if (!units.length) return startGame(cat, region);
  const byRegion = REGION_TOPICS.includes(cat);
  $app.innerHTML = `<div class="masthead"><div><h1>${esc(CAT_NAME[cat] || cat)}</h1>
      <p class="sub">${byRegion ? '選一個地區，或整個主題一起考' : '選一個單元，或直接全部一起考'}</p></div>
      <button class="back" id="back">← 回首頁</button></div>
    <div class="grid" style="grid-template-columns:1fr">
      <button class="cat" data-u=""><span class="sealbox">全</span>
        <span><b>${byRegion ? '不分地區' : '不分單元'}</b><small>全部題目一起出</small></span></button></div>
    <div class="grid">${units.map(u => {
      const tag = unitSeal(u.key);
      const size = tag.length >= 4 ? ' xlong' : tag.length >= 3 ? ' long' : '';
      return `<button class="cat" data-u="${u.key}">
      <span class="sealbox${size}">${esc(tag)}</span>
      <span><b>${esc(u.name)}</b><small>${u.count} 題</small></span></button>`;
    }).join('')}</div>`;
  document.getElementById('back').onclick = home;
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => startGame(cat, region, b.dataset.u));
}

/* ---------- 遊戲 ---------- */
let G = null;

const setTopic = t => { document.body.dataset.topic = t || ''; };

async function startGame(cat, region = '', unit = ''){
  setTopic(cat);
  $app.innerHTML = `<p class="sub">出題中…</p>`;
  try{
    const d = await api.start(cat, region, unit);
    G = {session: d.session, qs: d.questions, catKey: cat, catRegion: region, catUnit: unit,
         catName: (CAT_NAME[cat] || cat) + (region ? `・${region}` : '') + (d.unit_name ? `・${d.unit_name}` : ''), log: [],
         st: {i: 0, lives: LIVES, score: 0, streak: 0, best: 0, right: 0, answered: 0, over: false,
              powers: {fifty: true, skip: true, time: true}}};
    showQuestion();
  }catch(e){
    $app.innerHTML = `<p class="err">${esc(e.message)}</p><div class="row"><button class="btn" id="home">回首頁</button></div>`;
    document.getElementById('home').onclick = home;
  }
}

function hud(){
  const s = G.st;
  return `<div class="hud">
      <span class="lives" aria-label="剩 ${s.lives} 條命">${Array.from({length: LIVES}, (_, k) => `<i class="${k < s.lives ? '' : 'off'}"></i>`).join('')}</span>
      <span class="prog">第 ${Math.min(s.i + 1, G.qs.length)} / ${G.qs.length} 題</span>
      <span class="score">${s.score}</span>
    </div>
    <div class="streak">${streakText()}</div>
    <div class="timer" id="timer"><i></i></div>`;
}
const streakText = () => G.st.streak >= 2 ? `連中 ${G.st.streak} 題` + (mult(G.st.streak) > 1 ? `（×${mult(G.st.streak)}）` : '') : '';

async function showQuestion(){
  const i = G.st.i, q = G.qs[i];
  G.picked = []; G.locked = false;
  const isTF = q.options.length === 2 && q.options[0] === '對';
  const typeLabel = q.type === 'order' ? '排序題' : isTF ? '是非題' : '選擇題';
  const opts = q.options.map((o, k) => `<button class="opt" data-i="${k}">${isTF ? '' :
    `<span class="n">${q.type === 'order' ? '·' : 'ABCD'[k]}</span>`}<span>${esc(o)}</span></button>`).join('');
  const P = G.st.powers;
  $app.innerHTML = hud() + `
    <div class="meta"><span class="tag">${esc(q.region || G.catName)}</span><span class="tag">${esc(q.category || '')}</span>
      <span class="tag">${typeLabel}</span><span class="tag">${'★'.repeat(q.difficulty || 1)}</span>
      ${q.asof && (q.expires || q.category === '時事') ? `<span class="tag">${esc(q.asof.replace('-', ' 年 ').replace(/ 0?(\d+)$/, ' $1'))} 月資料</span>` : ''}
      ${q.ai_generated ? '<span class="tag">AI 出題</span>' : ''}</div>
    <div class="qbox"><div class="q pop">${esc(q.question)}</div></div>
    <div class="opts ${isTF ? 'tf' : ''}" id="opts">${opts}</div>
    ${q.type === 'order' ? `<p class="hint">依序點選，由最早到最晚</p>
      <div class="row"><button class="btn ghost" id="reset">重選</button><button class="btn" id="submit" disabled>送出</button></div>` : ''}
    <div class="powers">
      <button class="pw" id="pw-fifty" ${P.fifty && q.type === 'choice' && !isTF ? '' : 'disabled'}>刪去兩個</button>
      <button class="pw" id="pw-skip" ${P.skip ? '' : 'disabled'}>跳過此題</button>
      <button class="pw" id="pw-time" ${P.time ? '' : 'disabled'}>加時 10 秒</button>
    </div>
    <div id="fb"></div>`;

  const btns = [...document.querySelectorAll('.opt')];
  if (q.type === 'order'){
    btns.forEach(b => b.onclick = () => {
      if (G.locked || G.picked.includes(+b.dataset.i)) return;
      G.picked.push(+b.dataset.i);
      b.querySelector('.n').textContent = G.picked.length;
      b.classList.add('picked');
      document.getElementById('submit').disabled = G.picked.length !== q.options.length;
    });
    document.getElementById('reset').onclick = () => {
      if (G.locked) return;
      G.picked = [];
      btns.forEach(b => { b.querySelector('.n').textContent = '·'; b.classList.remove('picked'); });
      document.getElementById('submit').disabled = true;
    };
    document.getElementById('submit').onclick = () => answer(G.picked);
  } else {
    btns.forEach(b => b.onclick = () => answer(+b.dataset.i));
  }
  const usePower = async (type, el) => {
    if (G.locked) return;
    el.disabled = true;
    try{
      const r = await api.power(G.session, i, type);
      G.st = r.state;
      if (type === 'fifty') r.remove.forEach(k => btns[k].classList.add('gone'));
      if (type === 'time'){ G.deadline += 10000; G.limit += 10; }
      if (type === 'skip'){ G.locked = true; stopTimer(); G.log.push({q: q.question, ok: null}); next(); }
    }catch(e){ el.disabled = false; }
  };
  document.getElementById('pw-fifty').onclick = e => usePower('fifty', e.currentTarget);
  document.getElementById('pw-skip').onclick = e => usePower('skip', e.currentTarget);
  document.getElementById('pw-time').onclick = e => usePower('time', e.currentTarget);

  try { await api.show(G.session, i); } catch(e){ return fail(e); }
  startTimer(TIME_LIMIT[q.type] || 15);
}

function startTimer(sec){
  G.limit = sec; G.deadline = Date.now() + sec * 1000;
  stopTimer();
  G.tick = setInterval(() => {
    const left = Math.max(0, G.deadline - Date.now());
    const el = document.getElementById('timer');
    if (el){ el.firstElementChild.style.width = (left / (G.limit * 1000) * 100) + '%'; el.classList.toggle('low', left < 5000); }
    if (left <= 0){ stopTimer(); answer(null); }
  }, 200);
}
function stopTimer(){ clearInterval(G.tick); }
function fail(e){
  stopTimer();
  $app.innerHTML = `<p class="err">${esc(e.message)}</p><div class="row"><button class="btn" id="home">回首頁</button></div>`;
  document.getElementById('home').onclick = home;
}

async function answer(ans){
  if (G.locked) return;
  G.locked = true; stopTimer();
  const q = G.qs[G.st.i];
  let r;
  try { r = await api.answer(G.session, G.st.i, ans); } catch(e){ return fail(e); }
  G.st = r.state;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  document.querySelectorAll('.pw').forEach(b => b.disabled = true);
  if (!r.correct) document.querySelector('.q').classList.add('shake');
  document.querySelector('.qbox').insertAdjacentHTML('beforeend',
    `<div class="stamp ${r.correct ? 'pass' : 'fail'}" aria-hidden="true">${r.correct ? '中' : '落'}</div>`);

  if (q.type === 'order'){
    r.answer.forEach((optIdx, rank) => {
      const b = btns[optIdx]; b.classList.remove('picked');
      b.querySelector('.n').textContent = rank + 1;
      b.classList.add(r.correct || (ans && ans[rank] === optIdx) ? 'good' : 'bad');
    });
  } else {
    btns[r.answer].classList.add('good');
    if (!r.correct && ans !== null) btns[ans].classList.add('bad');
  }
  G.log.push({q: q.question, ok: r.correct});

  const title = r.correct ? `答對了，+${r.gained} 分` : r.timed_out ? '時間到！' : '答錯了！';
  const correctText = q.type === 'order' ? r.answer.map(k => q.options[k]).join(' → ') : q.options[r.answer];
  document.getElementById('fb').innerHTML = `
    <div class="fb pop ${r.correct ? 'ok' : 'no'}">
      <h3>${title}</h3>
      ${r.correct ? '' : `<p>正確答案：<b>${esc(correctText)}</b></p>`}
      <p>${esc(r.explanation)}</p>
      ${r.fun_fact ? `<p class="fun"><b>冷知識</b>${esc(r.fun_fact)}</p>` : ''}
      ${r.source ? `<a href="${esc(r.source)}" target="_blank" rel="noopener">${G.catKey === 'news' ? '閱讀新聞原文' : '查看資料來源'} ↗</a>` : ''}
      <div class="row"><button class="btn" id="next">${G.st.over ? '看放榜' : '下一題'}</button></div>
    </div>`;
  // 更新分數與命（保留原本畫面，不要重畫題目)
  const live = document.querySelector('.hud');
  live.querySelector('.lives').outerHTML = hud().match(/<span class="lives"[\s\S]*?<\/span>/)[0];
  live.querySelector('.score').textContent = G.st.score;
  document.querySelector('.streak').textContent = streakText();
  document.getElementById('next').onclick = next;
  document.getElementById('next').scrollIntoView({behavior: 'smooth', block: 'center'});
}

function next(){
  if (G.st.over) return result();
  showQuestion(); window.scrollTo(0, 0);
}

/* ---------- 放榜 ---------- */
function result(){
  const s = G.st;
  const acc = s.answered ? Math.round(s.right / s.answered * 100) : 0;
  const prev = store.get('quiz_best') || 0;
  const isBest = s.score > prev;
  if (isBest) store.set('quiz_best', s.score);
  const rank = acc >= 90 ? '滿格' : acc >= 75 ? '高峰' : acc >= 60 ? '躍升' : acc >= 40 ? '穩定' : '起跳';
  const canSubmit = s.score > 0;
  $app.innerHTML = `<div class="result">
      <p class="sub">${esc(G.catName)} ・ ${s.lives <= 0 ? '三條命用完了' : '十題作答完畢'}</p>
      <div class="bang"><small>PULSE</small><div class="rank">${rank}</div></div>
      <div class="big">${s.score} 分</div>
      ${isBest ? '<span class="newbest">刷新個人最高分！</span>' : `<span class="sub">個人最高 ${prev}</span>`}
      <div class="stats">
        <div class="stat"><b>${s.right}/${s.answered}</b><small>答對</small></div>
        <div class="stat"><b>${acc}%</b><small>正確率</small></div>
        <div class="stat"><b>${s.best}</b><small>最長連中</small></div>
      </div>
      <div id="lbslot">${canSubmit ? `
        <form class="lbform" id="lbform">
          <label for="nick">留下代號</label>
          <div class="row"><input id="nick" name="nick" maxlength="12" autocomplete="nickname" placeholder="輸入暱稱（最多 12 字）"
            value="${esc(store.get('quiz_nick') || '')}"><button class="btn" type="submit" id="lbsubmit">題名上榜</button></div>
          <p class="err" id="lberr" hidden></p>
        </form>` : ''}</div>
      <div class="row"><button class="btn ghost" id="home">換分類</button><button class="btn" id="again">再考一次</button></div>
      <div class="review">${G.log.map(x => `<div><span class="m ${x.ok === null ? 's' : x.ok ? 'y' : 'x'}">${x.ok === null ? '略' : x.ok ? '中' : '落'}</span><span>${esc(x.q.split('\n').pop())}</span></div>`).join('')}</div>
    </div>`;
  document.getElementById('home').onclick = () => { api.finish(G.session); home(); };
  document.getElementById('again').onclick = () => { api.finish(G.session); startGame(G.catKey, G.catRegion, G.catUnit); };
  const form = document.getElementById('lbform');
  if (form) form.onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById('nick').value.trim();
    const err = document.getElementById('lberr');
    const btn = document.getElementById('lbsubmit');
    btn.disabled = true; err.hidden = true;
    try{
      const r = await api.submit(G.session, name);
      store.set('quiz_nick', name);
      G.myId = r.id;
      document.getElementById('lbslot').innerHTML = `<div class="placed">
          「${esc(G.catName)}」本週第 <b>${r.rank_week ?? '-'}</b> 名 ・ 總榜第 <b>${r.rank_all ?? '-'}</b> 名
          <div class="row"><button class="btn ghost" id="seeboard">看脈衝榜</button></div></div>`;
      document.getElementById('seeboard').onclick = () => board(G.catKey, 'week');
    }catch(ex){
      err.textContent = ex.message; err.hidden = false; btn.disabled = false;
    }
  };
}

/* ---------- 脈衝榜 ---------- */
async function board(category = 'all', period = 'week'){
  const cats = ['all', 'geo', 'history', 'human', 'tech', 'star', 'fun', 'tt', ...(LOCAL ? [] : ['news']), 'mix'];
  $app.innerHTML = `<div class="lbhead"><h1>脈衝榜</h1><button class="back" id="back">← 回首頁</button></div>
    <div class="seg" role="group" aria-label="期間">
      <button id="p-week" aria-pressed="${period === 'week'}">本週</button>
      <button id="p-all" aria-pressed="${period === 'all'}">總榜</button>
    </div>
    <div class="chips" role="group" aria-label="分類">${cats.map(c =>
      `<button data-c="${c}" aria-pressed="${c === category}">${c === 'all' ? '全部' : CAT_NAME[c]}</button>`).join('')}</div>
    <div class="board" id="rows"><div class="empty">放榜中…</div></div>
    <p class="note" id="note"></p>`;
  document.getElementById('back').onclick = home;
  document.getElementById('p-week').onclick = () => board(category, 'week');
  document.getElementById('p-all').onclick = () => board(category, 'all');
  document.querySelectorAll('.chips button').forEach(b => b.onclick = () => board(b.dataset.c, period));
  document.querySelector('.chips [aria-pressed="true"]')?.scrollIntoView({inline: 'center', block: 'nearest'});
  const el = document.getElementById('rows');
  try{
    const rows = await api.leaderboard(category, period);
    document.getElementById('note').textContent = (await api.boardNote()) +
      (period === 'week' ? ' 本週榜每週一 00:00（台灣時間）重新開始。' : '');
    if (!rows.length){
      el.innerHTML = `<div class="empty">${period === 'week' ? '本週' : ''}還沒有人上榜，來當第一個滿格吧。
        <div class="row"><button class="btn" id="go">開始作答</button></div></div>`;
      document.getElementById('go').onclick = () => pickUnit(category === 'all' ? 'mix' : category, '');
      return;
    }
    el.innerHTML = rows.map((r, k) => {
      const d = new Date(r.created * 1000);
      return `<div class="entry ${r.id === G?.myId ? 'me' : ''}">
        <span class="pos ${k < 3 ? 'top' : ''}">${k < 3 ? TOP3[k] : k + 1}</span>
        <span class="who"><b>${esc(r.name)}</b><small>${CAT_NAME[r.category] || ''} ・ 答對 ${r.correct}/${r.answered} ・ ${d.getMonth() + 1}/${d.getDate()}</small></span>
        <span class="pts">${r.score}</span></div>`;
    }).join('');
  }catch(e){
    el.innerHTML = `<div class="empty">脈衝榜暫時打不開，請稍後再試。</div>`;
  }
}

home();
</script>
