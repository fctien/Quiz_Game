<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>脈衝 PULSE・多人對戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1729" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="脈衝 PULSE">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/favicon.png" type="image/png">
<link rel="stylesheet" href="/static/style.css?v=4.6">
<script>
/* 註冊 Service Worker：加到主畫面後可全螢幕開啟、載入更快 */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* 脈衝 PULSE 玩家端：加入考坊 → 選隊 → 手機作答 → 看名次 */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post = async (url, body) => {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '連線失敗，請再試一次');
  return j;
};
const ls = {get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
            set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
            del(k){ try { localStorage.removeItem(k); } catch {} }};
const params = new URLSearchParams(location.search);
let P = null, es = null, deadline = 0, lastQ = -1, tick = null, sending = false;

/* ---------- 加入 ---------- */
async function joinForm(msg = ''){
  const code = params.get('code') || '';
  let info = {};
  if (code) info = await fetch('/api/mp/info?code=' + encodeURIComponent(code)).then(r => r.json()).catch(() => ({}));
  const needSid = !!info.needs_sid, hasRoster = !!info.has_roster;
  $app.innerHTML = `<div class="masthead"><div><h1>入場<span class="seal">試</span></h1>
      <p class="sub">${info.exists ? `${esc(info.category)}　${info.mode === 'team' ? '分組賽' : '個人賽'}　已有 ${info.players} 人` : '輸入主持人畫面上的四位數房號'}</p></div>
      <a class="back" href="/">← 首頁</a></div>
    <form class="mp-card" id="f" style="margin-top:20px">
      <div class="field"><label for="code">房號</label>
        <input class="codein" id="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" value="${esc(code)}" required></div>
      ${needSid ? `<div class="field"><label for="sid">學號</label>
        <input class="textin" id="sid" maxlength="20" autocomplete="off" placeholder="請輸入學號" value="${esc(ls.get('quiz_sid') || '')}" required></div>` : ''}
      ${hasRoster ? '<p class="sub">姓名與組別會依老師上傳的名單自動帶出。</p>' : `
      <div class="field"><label for="nick">${needSid ? '姓名' : '暱稱'}</label>
        <input class="textin" id="nick" maxlength="12" autocomplete="name" placeholder="最多 12 個字" value="${esc(ls.get('quiz_nick') || '')}" required></div>`}
      <button class="btn" type="submit" id="go" style="width:100%">加入考坊</button>
      <p class="err" id="err" ${msg ? '' : 'hidden'}>${esc(msg)}</p>
    </form>`;
  document.getElementById(code ? (needSid ? 'sid' : 'nick') : 'code').focus();
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const code = document.getElementById('code').value.trim();
    const sid = document.getElementById('sid')?.value.trim() || '';
    const name = document.getElementById('nick')?.value.trim() || '';
    document.getElementById('go').disabled = true;
    try{
      const r = await post('/api/mp/join', {code, sid, name});
      if (sid) ls.set('quiz_sid', sid);
      if (name) ls.set('quiz_nick', name);
      P = {code, pid: r.pid, token: r.token};
      ls.set('mp_' + code, P);
      history.replaceState(null, '', '/play?code=' + code);
      connect();
    }catch(ex){ joinForm(ex.message); }
  };
}

async function resume(){
  const code = params.get('code');
  const saved = code && ls.get('mp_' + code);
  if (!saved) return joinForm();
  try{ await post('/api/mp/join', saved); P = saved; connect(); }
  catch{ ls.del('mp_' + code); joinForm(); }
}

/* ---------- 即時連線 ---------- */
function connect(){
  es?.close();
  es = new EventSource(`/api/mp/stream?code=${P.code}&pid=${P.pid}&token=${encodeURIComponent(P.token)}`);
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => {
    const c = document.getElementById('conn'); if (c) c.textContent = '連線中斷，重新連線中…';
    fetch(`/api/mp/info?code=${P.code}`).then(r => r.json()).then(j => {
      if (!j.exists){ es.close(); ls.del('mp_' + P.code); closed(); } }).catch(() => {});
  };
}

const header = v => `<div class="hud"><span class="prog">${esc(v.name)}${v.team ? '・' + esc(v.team) : ''} ・ 房號 ${v.code}</span>
    <span class="score">${v.score}</span></div><p class="conn" id="conn"></p>`;

function render(v){
  document.body.dataset.topic = v.topic || '';
  if (v.state !== 'question') clearInterval(tick);
  if (v.state === 'closed'){ es.close(); ls.del('mp_' + P.code); return closed(); }
  ({lobby, question, reveal, final})[v.state]?.(v);
}
function closed(){
  $app.innerHTML = `<div class="center" style="padding-top:40px"><h1>考坊已關閉</h1><p class="sub">謝謝參加！</p>
    <div class="row"><a class="btn" href="/" style="text-decoration:none;text-align:center">回首頁</a></div></div>`;
}

/* ---------- 等待 / 選隊 ---------- */
function lobby(v){
  if (v.mode === 'team' && !v.team){
    $app.innerHTML = header(v) + `<div class="center" style="padding-top:20px"><h2 style="font-family:var(--display)">選擇你的隊伍</h2>
      <p class="sub">選好才能開始，選錯可以再按一次改</p></div>
      <div class="popts">${v.teams.map((t, k) => `<button class="popt o${k % 4}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <p class="err" id="terr" hidden></p>`;
    document.querySelectorAll('.popt').forEach(b => b.onclick = async () => {
      try { await post('/api/mp/team', {...P, team: b.dataset.t}); }
      catch(e){ const el = document.getElementById('terr'); el.textContent = e.message; el.hidden = false; }
    });
    return;
  }
  $app.innerHTML = header(v) + `<div class="center" style="padding-top:30px">
    <div class="bigstamp pass" style="font-size:2.4rem">入場</div>
    <h2 style="font-family:var(--display)">${esc(v.name)}，你已報到</h2>
    ${v.team ? `<p class="pill">${esc(v.team)}</p>` : ''}
    <p class="sub">${esc(v.category)} ・ 共 ${v.total} 題 ・ 目前 ${v.players} 人<br>等主持人開始，題目會直接出現在這裡</p>
    ${v.mode === 'team' && v.teams.length > 1 ? '<div class="row"><button class="btn ghost" id="chg">換隊</button></div>' : ''}</div>`;
  document.getElementById('chg')?.addEventListener('click', () => {
    $app.querySelector('.result, .center').innerHTML = '';
    lobby({...v, team: ''});
  });
}

/* ---------- 作答 ---------- */
function question(v){
  const q = v.q;
  if (q.index !== lastQ){ lastQ = q.index; deadline = Date.now() + (v.remaining || 0) * 1000; sending = false; }
  if (v.my_answer !== null && v.my_answer !== undefined){
    const k = v.my_answer;
    $app.innerHTML = header(v) + `<div class="sent"><p class="prog">第 ${q.index + 1} / ${q.total} 題</p>
      <div class="picked-big o${k}"><span class="n" style="color:var(--oc);font-family:var(--mono)">${'ABCD'[k]}</span>${esc(q.options[k])}</div>
      <p class="sub">已交卷，${v.manual ? '等老師公布答案' : '等其他人作答'}…<br>已作答 ${v.answered} / ${v.players}</p></div>`;
    return;
  }
  $app.innerHTML = header(v) + `
    ${v.manual ? '<p class="sub center">搶答中，答對最快的人加 0.5 分</p>' : '<div class="timer" id="timer"><i></i></div>'}
    <div class="meta"><span class="tag">第 ${q.index + 1} / ${q.total} 題</span>${q.double ? '<span class="double">分數加倍</span>' : ''}</div>
    <div class="q">${esc(q.question)}</div>
    <div class="popts">${q.options.map((o, k) => `<button class="popt o${k}" data-k="${k}"><span class="n">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  document.querySelectorAll('.popt').forEach(b => b.onclick = async () => {
    if (sending) return;
    sending = true;
    document.querySelectorAll('.popt').forEach(x => { x.disabled = true; if (x !== b) x.style.opacity = .35; });
    try { await post('/api/mp/answer', {...P, index: q.index, choice: +b.dataset.k}); }
    catch(e){ sending = false; document.getElementById('conn').textContent = e.message; }
  });
  clearInterval(tick);
  if (v.manual) return;                       // 手動模式沒有倒數
  const total = v.limit * 1000;
  tick = setInterval(() => {
    const left = Math.max(0, deadline - Date.now()), el = document.getElementById('timer');
    if (el){ el.firstElementChild.style.width = (left / total * 100) + '%'; el.classList.toggle('low', left < 5000); }
  }, 200);
}

/* ---------- 公布 ---------- */
function reveal(v){
  const q = v.q, r = v.result || {correct: false, gained: 0}, ans = v.reveal.answer;
  const mv = v.move ? `<span class="move ${v.move > 0 ? 'up' : 'down'}">${v.move > 0 ? '▲' : '▼'}${Math.abs(v.move)}</span>` : '';
  const myTeam = v.mode === 'team' ? (v.team_board || []).findIndex(t => t.team === v.team) + 1 : 0;
  $app.innerHTML = header(v) + `<div class="center">
      <div class="bigstamp ${r.correct ? 'pass' : 'fail'}">${r.correct ? '中' : '落'}</div>
      <div class="gain">${r.correct ? '+' + r.gained : (r.choice === null || r.choice === undefined ? '沒有作答' : '+0')}</div>
      ${r.correct && r.bonus ? `<p class="sub">含連中加分 +${r.bonus}</p>` : ''}
      ${r.bonus_point ? `<p class="pill" style="border-color:var(--cinnabar);color:var(--cinnabar)">最快答對！課堂加分 +${r.bonus_point}</p>` : ''}
      ${r.correct && q.double ? '<p class="sub">最後一題分數加倍！</p>' : ''}
      <p style="font-size:1.2rem;margin:14px 0 4px">目前第 <b class="score">${v.rank}</b> 名 / ${v.players} 人 ${mv}</p>
      ${myTeam ? `<p class="pill">${esc(v.team)}　隊伍第 ${myTeam} 名</p>` : ''}
      ${v.streak >= 2 ? `<p class="streak">連中 ${v.streak} 題</p>` : ''}</div>
    <div class="fb ${r.correct ? 'ok' : 'no'}"><p>正確答案：<b>${'ABCD'[ans]}. ${esc(q.options[ans])}</b></p>
      <p>${esc(v.reveal.explanation)}</p></div>
    <p class="sub center">${v.last_q ? '等主持人放榜…' : '下一題馬上來…'}</p>`;
}

/* ---------- 放榜 ---------- */
function final(v){
  const t = ['滿格', '高峰', '躍升'];
  const title = v.rank <= 3 ? t[v.rank - 1] : v.rank <= Math.ceil(v.players / 2) ? '穩定' : '起跳';
  const tb = v.team_board || [];
  const myTeam = v.mode === 'team' ? tb.findIndex(x => x.team === v.team) + 1 : 0;
  $app.innerHTML = header(v) + `<div class="result">
      <div class="bang"><small>PULSE</small><div class="rank">${title}</div></div>
      <div class="big">第 ${v.rank} 名 / ${v.players} 人</div>
      <p class="sub">${v.score} 分 ・ 答對 ${v.right} / ${v.total} 題${v.bonus ? ` ・ 課堂加分 ${v.bonus}` : ''}</p>
      ${myTeam ? `<p class="pill">${esc(v.team)}　隊伍第 ${myTeam} 名（平均 ${tb[myTeam - 1].avg} 分）</p>` : ''}
      ${tb.length ? `<div class="board" style="margin-top:18px">${tb.slice(0, 3).map((x, k) => `<div class="entry">
          <span class="pos top">${t[k]}</span><span class="who"><b>${esc(x.team)}</b><small>${x.members} 人</small></span>
          <span class="pts">${x.avg}</span></div>`).join('')}</div>`
        : `<div class="board" style="margin-top:18px">${v.podium.map((p, k) => `<div class="entry"><span class="pos top">${t[k]}</span>
          <span class="who"><b>${esc(p.name)}</b></span><span class="pts">${p.score}</span></div>`).join('')}</div>`}
      <p class="sub" style="margin-top:14px">主持人可以再開一局，留在這個畫面就會自動開始</p></div>`;
}

resume();
</script>
</body>
</html>
