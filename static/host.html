<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脈衝 PULSE・主持台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1729" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="脈衝 PULSE">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/favicon.png" type="image/png">
<link rel="stylesheet" href="/static/style.css?v=4.7">
<!-- QR code 產生器：連不到網路時只會少了 QR code，輸入房號一樣能加入 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* 註冊 Service Worker：加到主畫面後可全螢幕開啟、載入更快 */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
</head>
<body>
<div class="wrap wide" id="app"></div>
<script>
/* 脈衝 PULSE 主持台：開考坊、分組、控制出題、公布答案、放榜、存入班級積分 */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEAL = {python:'蟒', pytorch:'深', geo:'輿', history:'史', human:'文', tech:'科', star:'星', fun:'奇', news:'聞', mix:'雜'};
const REGIONS = ['', '台灣', '中國', '世界'];
const post = async (url, body) => {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '連線失敗');
  return j;
};
const ss = {get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
            set(k, v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
            del(k){ try { sessionStorage.removeItem(k); } catch {} }};
let H = ss.get('mp_host');
let es = null, deadline = 0, lastQ = -1, tick = null, rosterText = '', rosterInfo = '';

/* 讀 CSV：Excel 存出來常是 Big5，這裡自動判斷 */
async function readCsv(file){
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('�')){ try { text = new TextDecoder('big5').decode(buf); } catch {} }
  return text;
}

/* ---------- 開考坊設定 ---------- */
async function setup(msg = ''){
  const pick = ss.get('mp_setup') || {category: 'mix', region: '', count: 10, time: 20, mode: 'solo', team_count: 4, class_code: ''};
  document.body.dataset.topic = pick.category || '';   // 設定頁就先換上該主題的布景
  const cats = await fetch('/api/categories' + (pick.region ? '?region=' + encodeURIComponent(pick.region) : '')).then(r => r.json()).catch(() => []);
  $app.innerHTML = `<div class="masthead"><div><h1>主持台<span class="seal">試</span></h1>
      <p class="sub">開一間考坊，學生用手機輸入房號一起搶答　<span style="opacity:.6">v4.7</span></p></div>
      <a class="back" href="/">← 回首頁</a></div>
    <div class="chips" id="regions" role="group" aria-label="地區">${REGIONS.map(x =>
      `<button data-r="${x}" aria-pressed="${x === pick.region}">${x || '不限地區'}</button>`).join('')}</div>
    <div class="chips multi" id="units" role="group" aria-label="單元"></div>
    <div class="grid" id="cats">${cats.map(c => `
      <button class="cat" data-k="${c.key}" aria-pressed="${c.key === pick.category}" ${c.count === 0 ? 'disabled style="opacity:.4"' : ''}>
        <span class="sealbox">${c.seal || SEAL[c.key] || esc(c.name[0])}</span>
        <span><b>${esc(c.name)}</b><small>${c.key === 'news' ? '今日新聞' : c.count + ' 題'}</small></span>
      </button>`).join('')}</div>
    <div class="row" style="flex-wrap:wrap;gap:18px;margin-top:18px">
      <div><div class="sub" style="margin:0 0 4px">題數</div><div class="seg" id="cnt" style="margin:0">
        ${[5, 10, 15, 20].map(n => `<button data-v="${n}" aria-pressed="${n === pick.count}">${n}</button>`).join('')}</div></div>
      <div><div class="sub" style="margin:0 0 4px">每題秒數（選「手動」由你控制開始與結束）</div><div class="seg" id="tm" style="margin:0">
        ${[10, 15, 20, 30].map(n => `<button data-v="${n}" aria-pressed="${n === pick.time}">${n}</button>`).join('')}
        <button data-v="0" aria-pressed="${pick.time === 0}">手動</button></div></div>
      <div><div class="sub" style="margin:0 0 4px">賽制</div><div class="seg" id="md" style="margin:0">
        <button data-v="solo" aria-pressed="${pick.mode === 'solo'}">個人賽</button>
        <button data-v="team" aria-pressed="${pick.mode === 'team'}">分組賽</button></div></div>
      <div id="tcwrap" ${pick.mode === 'team' ? '' : 'hidden'}><div class="sub" style="margin:0 0 4px">隊伍數</div>
        <div class="seg" id="tc" style="margin:0">${[2, 3, 4, 5, 6].map(n => `<button data-v="${n}" aria-pressed="${n === pick.team_count}">${n}</button>`).join('')}</div></div>
    </div>
    <div class="mp-card" style="margin-top:18px"><h3>課堂設定（選填）</h3>
      <p>填了班級代碼，每場成績就能累積起來，當作期末加分依據。上傳分組名單後，學生只要輸入學號就會自動帶出姓名與組別。</p>
      <div class="row" style="margin:0;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:200px"><label for="cls">班級代碼</label>
          <input class="textin" id="cls" maxlength="30" placeholder="例如 程式設計-115-1" value="${esc(pick.class_code)}"></div>
        <div class="field" style="flex:1;min-width:160px"><label for="adm">管理碼（班級已建立過才要填）</label>
          <input class="textin" id="adm" maxlength="12" placeholder="第一次開班留空"></div>
      </div>
      <div class="field"><label for="csv">分組名單 CSV（學號,姓名,組別）</label>
        <input type="file" id="csv" accept=".csv,.txt,.tsv"><small class="sub" id="csvinfo">未選擇檔案；沒有名單也可以玩，學生自己選隊。</small></div>
      <a class="joinurl" href="/class" target="_blank">查看班級累積積分 →</a></div>
    <div class="row"><button class="btn" id="create">開考坊</button></div>
    <p class="err" id="err" ${msg ? '' : 'hidden'}>${esc(msg)}</p>
    <div class="rules"><h2>怎麼玩</h2><ul>
      <li>把這個畫面投影到大螢幕，學生掃 QR code 或輸入四位數房號加入</li>
      <li>答對越快分數越高，連中有加分，<b>最後一題分數加倍</b></li>
      <li>分組賽的隊伍分數用<b>隊員平均分</b>計算，各組人數不同也公平</li>
    </ul></div>`;
  const style = document.createElement('style');
  style.textContent = '.cat[aria-pressed="true"]{border-color:var(--cinnabar);box-shadow:0 0 0 2px var(--cinnabar)}';
  $app.appendChild(style);
  const save = () => ss.set('mp_setup', pick);
  document.querySelectorAll('#regions button').forEach(b => b.onclick = () => { pick.region = b.dataset.r; save(); setup(); });
  const loadUnits = async () => {
    const box = document.getElementById('units');
    const list = await fetch('/api/units?topic=' + encodeURIComponent(pick.category)).then(r => r.json()).catch(() => []);
    if (!list.length){ box.innerHTML = ''; pick.unit = ''; pick.unit_name = ''; save(); return; }
    if (!list.some(u => u.key === pick.unit)) { pick.unit = ''; pick.unit_name = ''; save(); }
    box.innerHTML = `<button data-u="" aria-pressed="${!pick.unit}">不分單元</button>` + list.map(u =>
      `<button data-u="${u.key}" data-n="${esc(u.name)}" aria-pressed="${u.key === pick.unit}">${u.key === 'GEN' ? '綜合' : u.key}　${esc(u.name)}（${u.count}）</button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      pick.unit = b.dataset.u; pick.unit_name = b.dataset.n || ''; save();
      box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
  };
  loadUnits();
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => {
    pick.category = b.dataset.k; save();
    document.body.dataset.topic = pick.category;        // 點下去馬上換布景
    document.querySelectorAll('.cat').forEach(x => x.setAttribute('aria-pressed', x === b));
    loadUnits();
  });
  const seg = (id, key, after) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    pick[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; save();
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute('aria-pressed', x === b));
    after?.();
  });
  seg('cnt', 'count'); seg('tm', 'time'); seg('tc', 'team_count');
  seg('md', 'mode', () => document.getElementById('tcwrap').hidden = pick.mode !== 'team');
  document.getElementById('csv').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    rosterText = await readCsv(f);
    const n = rosterText.split(/\r?\n/).filter(x => x.trim()).length;
    rosterInfo = `已讀取 ${f.name}，約 ${n} 行`;
    document.getElementById('csvinfo').textContent = rosterInfo;
  };
  document.getElementById('create').onclick = async e => {
    e.currentTarget.disabled = true;
    pick.class_code = document.getElementById('cls').value.trim(); save();
    try{
      const r = await post('/api/mp/create', {...pick, admin_code: document.getElementById('adm').value.trim(), roster_text: rosterText});
      H = {code: r.code, token: r.token, join_url: r.join_url, join_urls: r.join_urls || [r.join_url],
           admin_code: r.admin_code, class_code: r.class_code};
      ss.set('mp_host', H);
      connect();
    }catch(ex){ setup(ex.message); }
  };
}

/* ---------- 即時連線 ---------- */
function connect(){
  es?.close();
  es = new EventSource(`/api/mp/stream?code=${H.code}&pid=host&token=${encodeURIComponent(H.token)}`);
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => {
    const c = document.getElementById('conn'); if (c) c.textContent = '連線中斷，重新連線中…';
    fetch(`/api/mp/info?code=${H.code}`).then(r => r.json()).then(j => {
      if (!j.exists){ es.close(); ss.del('mp_host'); H = null; setup(); } }).catch(() => {});
  };
}
const act = (path, extra = {}) => post(path, {code: H.code, token: H.token, ...extra}).catch(e => alert(e.message));

function bar(v){
  return `<div class="hostbar"><span>房號 <b class="score">${v.code}</b> ・ ${esc(v.category)}${v.region ? '・' + esc(v.region) : ''}
${v.unit_name ? '・' + esc(v.unit_name) : ''} ・ ${v.mode === 'team' ? '分組賽' : '個人賽'} ・ ${v.players} 人${v.class_code ? ' ・ 班級 ' + esc(v.class_code) : ''}</span>
    <span class="conn" id="conn"></span></div>`;
}
function render(v){
  document.body.dataset.topic = v.topic || '';
  if (v.state === 'closed'){ ss.del('mp_host'); es.close(); H = null; return setup(); }
  if (v.state !== 'question') clearInterval(tick);
  ({lobby, question, reveal, final})[v.state]?.(v);
}

/* ---------- 等待加入 ---------- */
function lobby(v){
  const byTeam = {};
  (v.teams || []).forEach(t => byTeam[t] = []);
  v.roster.forEach(p => { if (v.mode === 'team') (byTeam[p.team] ||= []).push(p); });
  $app.innerHTML = bar(v) + `${H.admin_code ? `<div class="placed" style="margin:12px 0">
      班級「${esc(H.class_code)}」已建立，管理碼 <b>${esc(H.admin_code)}</b>　請記下來，之後開考坊存分與查看積分都要用。</div>` : ''}
    <div class="lobby">
    <div class="joinbox"><small>手機掃描或輸入房號加入</small>
      <div class="bigcode">${v.code}</div>
      <div class="qr" id="qr" hidden></div>
      <div class="joinurl" id="joinurl">${esc(H.join_url)}</div>
      ${H.join_urls && H.join_urls.length > 1 ? `<button class="back" id="swap" style="margin-top:6px">手機連不到？換一個網址（${H.join_urls.length} 組）</button>` : ''}
      <p class="note">測試用：手機開 <span class="joinurl">${esc(H.join_url.split('/play')[0])}/api/health</span> 看得到 ok 就表示連得通。</p></div>
    <div class="roster"><h2>已報到 <span>${v.roster.length}</span>${v.roster_size ? ` / ${v.roster_size}` : ''} 人</h2>
      ${v.mode === 'team' ? Object.entries(byTeam).map(([t, list]) => `
        <div style="margin-bottom:10px"><b>${esc(t)}</b>（${list.length}）
          <div class="chipset" style="margin-top:4px">${list.map(p => `<span class="pchip ${p.online ? '' : 'off'}">${esc(p.name)}</span>`).join('') || '<span class="sub">尚無</span>'}</div></div>`).join('')
        : `<div class="chipset">${v.roster.map(p => `<span class="pchip ${p.online ? '' : 'off'}">${esc(p.name)}</span>`).join('') || '<p class="sub">等待考生入場…</p>'}</div>`}
      ${v.missing && v.missing.length ? `<p class="sub" style="margin-top:10px">未到（${v.missing.length}）：${v.missing.slice(0, 12).map(esc).join('、')}${v.missing.length > 12 ? '…' : ''}</p>` : ''}
      <div class="row"><button class="btn" id="go" ${v.roster.length ? '' : 'disabled'}>開始考試（${v.total} 題）</button></div>
      <div class="row"><button class="btn ghost" id="close">關閉考坊</button></div></div></div>`;
  if (window.qrcode){
    const q = qrcode(0, 'M'); q.addData(H.join_url); q.make();
    const el = document.getElementById('qr'); el.innerHTML = q.createSvgTag(5, 2); el.hidden = false;
  }
  document.getElementById('swap')?.addEventListener('click', () => {
    const i = (H.join_urls.indexOf(H.join_url) + 1) % H.join_urls.length;
    H.join_url = H.join_urls[i]; ss.set('mp_host', H); lobby(v);
  });
  document.getElementById('go').onclick = () => act('/api/mp/start');
  document.getElementById('close').onclick = () => confirm('確定要關閉考坊嗎？') && act('/api/mp/close');
}

/* ---------- 出題中 ---------- */
function opts(q, rv){
  return `<div class="hopts">${q.options.map((o, k) => {
    const cnt = rv ? rv.dist[k] : null, max = rv ? Math.max(1, ...rv.dist) : 1;
    const cls = rv ? (k === rv.answer ? 'win' : 'dim') : '';
    return `<div class="hopt o${k} ${cls}"><span class="n">${'ABCD'[k]}</span><span>${esc(o)}</span>
      ${rv ? `<span class="cnt">${cnt} 人</span><span class="bar" style="transform:scaleX(${cnt / max})"></span>` : ''}</div>`;
  }).join('')}</div>`;
}
function question(v){
  const q = v.q;
  if (q.index !== lastQ){ lastQ = q.index; deadline = Date.now() + (v.manual ? -v.elapsed * 1000 : v.remaining * 1000); }
  $app.innerHTML = bar(v) + `<div class="hq">
    <div class="hqtop"><div><span class="prog">第 ${q.index + 1} / ${q.total} 題</span>
        ${q.double ? ' <span class="double">最後一題・分數加倍</span>' : ''}
        ${v.manual ? ' <span class="pill">手動計時・按「結束本題」公布答案</span>' : ''}</div>
      <div class="cd ${v.manual ? 'up' : ''}" id="cd">${v.manual ? Math.floor(v.elapsed) : Math.ceil(v.remaining)}</div></div>
    <div class="meta"><span class="tag">${esc(q.region)}</span><span class="tag">${esc(q.category)}</span><span class="tag">${'★'.repeat(q.difficulty)}</span></div>
    <div class="hqtext">${esc(q.question)}</div>
    ${opts(q)}
    <div class="row" style="align-items:center"><span class="answered">已作答 <b>${v.answered}</b> / ${v.players}</span>
      <button class="btn${v.manual ? '' : ' ghost'}" id="rv" style="flex:none">${v.manual ? '結束本題，公布答案' : '提前公布'}</button></div></div>`;
  document.getElementById('rv').onclick = () => act('/api/mp/reveal');
  clearInterval(tick);
  tick = setInterval(() => {
    const el = document.getElementById('cd');
    if (!el) return;
    if (v.manual){ el.textContent = Math.floor((Date.now() - deadline) / 1000); return; }   // 手動模式:往上數
    const left = Math.max(0, (deadline - Date.now()) / 1000);
    el.textContent = Math.ceil(left); el.classList.toggle('low', left <= 5);
  }, 200);
}

/* ---------- 公布答案 ---------- */
function boardRows(rows, team){
  return rows.map((p, k) => `<div class="entry"><span class="pos ${k < 3 ? 'top' : ''}">${k + 1}</span>
    <span class="who"><b>${esc(team ? p.team : p.name)}${p.move ? `<span class="move ${p.move > 0 ? 'up' : 'down'}">${p.move > 0 ? '▲' : '▼'}${Math.abs(p.move)}</span>` : ''}</b>
      ${team ? `<small>${p.members} 人・總分 ${p.total}</small>` : (p.team ? `<small>${esc(p.team)}</small>` : '')}</span>
    <span class="pts">${team ? p.avg : p.score}</span></div>`).join('');
}
function reveal(v){
  const q = v.q, rv = v.reveal;
  $app.innerHTML = bar(v) + `<div class="hq">
    <div class="hqtop"><span class="prog">第 ${q.index + 1} / ${q.total} 題 ・ ${rv.answered} 人作答</span>
      ${rv.fastest ? `<span class="fastest">最快答對：${esc(rv.fastest.name)}（${rv.fastest.secs} 秒）　加 ${rv.fastest.bonus} 分</span>` : '<span class="sub">這題沒有人答對</span>'}</div>
    <div class="hqtext">${esc(q.question)}</div>
    <div class="hreveal"><div>${opts(q, rv)}
        <div class="fb ok"><p>${esc(rv.explanation)}</p>${rv.fun_fact ? `<p class="fun"><b>冷知識</b>${esc(rv.fun_fact)}</p>` : ''}</div></div>
      <div class="topboard">
        ${v.mode === 'team' ? `<div class="rules" style="border:0;padding:0"><h2>隊伍排名（平均分）</h2></div>
          <div class="board">${boardRows(v.team_board, true)}</div>` : ''}
        <div class="rules" style="border:0;padding:0"><h2>個人前五名</h2></div>
        <div class="board">${boardRows(v.top)}</div>
        <div class="row"><button class="btn" id="nx">${v.last_q ? '放榜' : '下一題'}</button></div></div></div></div>`;
  document.getElementById('nx').onclick = () => act('/api/mp/next');
}

/* ---------- 放榜 ---------- */
function final(v){
  const t = ['滿格', '高峰', '躍升'];
  const win = v.mode === 'team' ? v.team_board : v.final;
  const pod = k => win[k] ? `<div class="pod p${k + 1}"><div class="t">${t[k]}</div>
      <b>${esc(v.mode === 'team' ? win[k].team : win[k].name)}</b><small>${v.mode === 'team' ? win[k].avg : win[k].score}</small></div>` : '<div></div>';
  $app.innerHTML = bar(v) + `<div class="center"><div class="bang"><small>PULSE</small><div class="rank">放榜</div></div>
      ${v.mode === 'team' ? '<p class="sub">隊伍排名依隊員平均分計算</p>' : ''}</div>
    <div class="podium">${pod(1)}${pod(0)}${pod(2)}</div>
    ${v.mode === 'team' ? `<div class="rules" style="border:0"><h2>各隊成績</h2></div><div class="board">${boardRows(v.team_board, true)}</div>` : ''}
    <div class="rules" style="border:0"><h2>個人成績</h2></div>
    <div class="board">${v.final.map((p, k) => `<div class="entry"><span class="pos ${k < 3 ? 'top' : ''}">${k < 3 ? t[k] : k + 1}</span>
      <span class="who"><b>${esc(p.name)}</b><small>${p.sid ? esc(p.sid) + '・' : ''}${p.team ? esc(p.team) + '・' : ''}答對 ${p.right} / ${v.total}${p.bonus ? `・<b class="fastest">加分 ${p.bonus}</b>` : ''}</small></span>
      <span class="pts">${p.score}</span></div>`).join('')}</div>
    <div class="row"><a class="btn ghost" style="text-decoration:none;text-align:center"
      href="/api/mp/export?code=${v.code}&token=${encodeURIComponent(H.token)}">匯出本場成績 CSV</a></div>
    ${v.class_code ? `<div class="placed" id="saveslot">${v.saved
      ? `已存入班級「${esc(v.class_code)}」的累積積分。<div class="row"><a class="btn ghost" href="/class" target="_blank" style="text-decoration:none;text-align:center">查看累積積分</a></div>`
      : `這場成績可以存入班級「${esc(v.class_code)}」的累積積分。<div class="row"><button class="btn" id="save">存入班級積分</button></div>`}</div>` : ''}
    <div class="row"><button class="btn ghost" id="close">關閉考坊</button><button class="btn" id="again">再來一局</button></div>`;
  document.getElementById('save')?.addEventListener('click', e => { e.target.disabled = true; act('/api/mp/save_class'); });
  document.getElementById('again').onclick = () => { lastQ = -1; act('/api/mp/again'); };
  document.getElementById('close').onclick = () => act('/api/mp/close');
}

H ? connect() : setup();
</script>
